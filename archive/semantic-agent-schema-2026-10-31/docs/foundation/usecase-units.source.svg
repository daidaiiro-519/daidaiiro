<svg viewBox="0 0 900 300" width="100%" style="min-width:760px;max-width:900px;display:block;margin:0 auto" role="img" aria-label="ユースケースの単位とコマンド"><rect class="box focus" x="270" y="20" width="300" height="52"/><text class="label focus" x="286" y="42" text-anchor="start">要約</text><text class="label small" x="286" y="60" text-anchor="start">事業の目的を果たし続ける</text><rect class="box" x="230" y="110" width="310" height="52"/><text class="label" x="246" y="132" text-anchor="start">ユーザー目的＝単位</text><text class="label small" x="246" y="150" text-anchor="start">例：変更のたびに全部を確かめる</text><path class="flow" d="M420,72 V90 H385 V108"/><rect class="box" x="560" y="110" width="310" height="52"/><text class="label" x="576" y="132" text-anchor="start">ユーザー目的</text><text class="label small" x="576" y="150" text-anchor="start">例：本人が承認する</text><path class="flow" d="M420,72 V90 H715 V108"/><rect class="box kind-2" x="230" y="200" width="310" height="52"/><text class="label kind-2" x="246" y="222" text-anchor="start">サブ機能</text><text class="label small" x="246" y="240" text-anchor="start">例：確かめる（複数の目的から呼ばれる）</text><path class="flow" d="M385,162 V198"/><path class="flow" d="M715,162 V180 H470 V198"/><rect class="boundary" x="10" y="110" width="190" height="52"/><text class="label" x="24" y="132" text-anchor="start">コマンド</text><text class="label small" x="24" y="150" text-anchor="start">入口。ユースケースではない</text><path class="flow" d="M200,136 H228"/><text class="note" x="10" y="286" text-anchor="start">単位は「主体が目的を果たして用が済む」ユーザー目的。コマンドはそれを呼ぶ入口</text></svg>