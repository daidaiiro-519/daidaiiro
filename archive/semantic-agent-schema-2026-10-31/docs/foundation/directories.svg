<svg viewBox="0 0 1000 500" width="100%" style="min-width:920px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="ディレクトリ：1つの文脈の中の形。core の業務領域ごとの domain と application、inbound と outbound" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .area{fill:var(--dsvg-area-fill,#FFFFFF);stroke:var(--dsvg-line,#7C8C86)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A);font-size:10px}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E}</style><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="1000.0" height="500.0" fill="#FFFFFF" rx="8"/><text class="title" x="10" y="30" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">&lt;文脈の根&gt;/</text><text class="note" x="170" y="30" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">文脈が1つならリポジトリの根、複数なら contexts/&lt;文脈&gt;/。この下は1つの文脈の中の形</text><rect class="area" x="10" y="50" width="640" height="440" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="26" y="76" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">core/</text><text class="note" x="110" y="76" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">六角形の内側（区分の「中核」とは別）。業務領域ごとに分ける</text><rect class="box focus" x="26" y="92" width="608" height="80" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="38" y="122" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">&lt;業務領域 A&gt;/</text><text class="label small" x="38" y="144" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">中核の例。ポートを持つ</text><rect class="box kind-2" x="236" y="104" width="80" height="56" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="label small" x="276" y="137" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">domain</text><rect class="box" x="326" y="104" width="298" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label small" x="338" y="126" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">application：use_cases ・ ports</text><text class="label small" x="338" y="148" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">ports：その会話を受け持つものだけ</text><rect class="box focus" x="26" y="188" width="608" height="80" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="38" y="218" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">&lt;業務領域 B&gt;/</text><text class="label small" x="38" y="240" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">補完の例</text><rect class="box kind-2" x="236" y="200" width="80" height="56" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="label small" x="276" y="233" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">domain</text><rect class="box" x="326" y="200" width="298" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label small" x="338" y="233" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">application：use_cases</text><rect class="box focus" x="26" y="284" width="608" height="80" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="38" y="314" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">&lt;業務領域 C&gt;/</text><text class="label small" x="38" y="336" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">外の仕組みに依頼する会話を受け持つ</text><rect class="box kind-2" x="236" y="296" width="80" height="56" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="label small" x="276" y="329" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">domain</text><rect class="box" x="326" y="296" width="298" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label small" x="338" y="318" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">application：use_cases ・ ports</text><text class="label small" x="338" y="340" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">ports：外の仕組みに依頼する</text><text class="note" x="26" y="400" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">domain：集約 ・ 値 ・ ドメインサービス。ポートを知らない</text><text class="note" x="26" y="424" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">application：ユースケースの手順（use_cases）と外に依頼する約束（ports）</text><text class="note" x="26" y="448" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">ポートは会話を受け持つ業務領域に置き、共有の置き場は作らない</text><text class="note" x="26" y="472" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">ユースケース1つにつき1ファイルにしない。目的レベルでフォルダを分けない</text><rect class="area" x="660" y="50" width="330" height="440" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="676" y="76" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">外側</text><text class="note" x="740" y="76" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">六角形の外側</text><text class="label" x="676" y="114" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">inbound/</text><rect class="box" x="676" y="124" width="298" height="50" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="688" y="145" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">入口（CLI ・ API など）</text><text class="label small" x="688" y="164" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">コマンド → ユースケース ・ 起動時の結合</text><text class="label" x="676" y="206" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">outbound/</text><rect class="box" x="676" y="216" width="298" height="50" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="688" y="237" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ポートの実装（db ・ fs など）</text><text class="label small" x="688" y="256" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">外の技術を1つずつ</text><rect class="box" x="676" y="278" width="298" height="50" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="688" y="299" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">外の仕組みへのアダプター</text><text class="label small" x="688" y="318" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">連係の型（従属 ・ 変換）を明示</text></svg>