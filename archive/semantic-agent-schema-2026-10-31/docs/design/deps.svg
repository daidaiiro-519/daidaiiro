<svg viewBox="0 0 760 360" width="100%" style="min-width:700px;max-width:760px;display:block;margin:0 auto" role="img" aria-label="call を delegation の domain に置いたときの依存の向き" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A);font-size:10px}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .label.warn.small{fill:var(--dsvg-warn,#8F5410);font-size:10px}.dsvg #dsvg-fe31b3da-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E;--dsvg-ink-soft:#9DADA8;--dsvg-warn:#D9A35F}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E;--dsvg-ink-soft:#9DADA8;--dsvg-warn:#D9A35F}</style><defs data-dsvg="marker"><marker id="dsvg-fe31b3da-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="760.0" height="360.0" fill="#FFFFFF" rx="8"/><rect class="box focus" x="30" y="50" width="250" height="78" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="46" y="78" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">validation / domain</text><text class="label small" x="46" y="100" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Validator が call を作る</text><text class="label small" x="46" y="118" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">答えを5つの値にまとめる（judged）</text><rect class="box kind-2" x="480" y="50" width="250" height="78" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="label" x="496" y="78" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">delegation / domain</text><text class="label small" x="496" y="100" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Call（公開された言葉の形）</text><text class="label small" x="496" y="118" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">依存は serde_json だけ</text><rect class="box" x="480" y="220" width="250" height="78" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="496" y="248" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">delegation / application</text><text class="label small" x="496" y="270" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">ポート：任せる先に依頼する</text><text class="label small" x="496" y="288" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">判定できない rule を返す</text><rect class="box" x="30" y="220" width="250" height="78" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="46" y="248" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">declaration / domain</text><text class="label small" x="46" y="270" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Delegate（Concrete の持ち物）</text><path class="flow" d="M280,89 H478" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-fe31b3da-arrow-5B6B66)"/><text class="label small" x="379" y="80" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Call を使う</text><path class="flow" d="M605,220 V130" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-fe31b3da-arrow-5B6B66)"/><text class="label small" x="614" y="180" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Call を受け取る</text><path class="flow" d="M480,236 L282,126" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-fe31b3da-arrow-5B6B66)"/><text class="label small" x="425" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Finding を使う</text><path class="flow" d="M480,282 H282" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-fe31b3da-arrow-5B6B66)"/><text class="label small" x="381" y="274" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">Delegate を引数に取る</text><text class="label small warn" x="380" y="336" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#8F5410">validation / domain → delegation / application の辺は禁じる（循環しない）</text></svg>