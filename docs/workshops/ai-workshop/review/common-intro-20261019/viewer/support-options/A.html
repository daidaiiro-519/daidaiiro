<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIを、自分の仕事で使い続けるために</title>
<style>
  :root{
    --ground:#0E1823;
    --surface:#152534;
    --surface-2:#1B2F41;
    --paper:#F3EFE7;
    --ink:#EAF0F5;
    --dim:#8CA3B8;
    --faint:#5E7488;
    --line:#26394C;
    --accent:#63D2BC;
    --accent-dim:#2E7A6D;
    --alert:#EE8A63;
    --gold:#DFB86A;
    --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',YuMincho,serif;
    --sans:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    --mono:'JetBrains Mono','Noto Sans JP',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-feature-settings:"palt" 1;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim); color:var(--ink);}

  .deck{ position:absolute; inset:0; overflow:hidden; }
  .stage{ position:absolute; left:50%; top:50%; width:1280px; height:720px; transform-origin:center center; }
  .slide{
    position:absolute; inset:0;
    display:none; flex-direction:column; justify-content:flex-start;
    padding:96px 86.4px 78px;
  }
  .slide.on{ display:flex; animation:in .3s cubic-bezier(.2,.7,.3,1); }
  @keyframes in{ from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion:reduce){ .slide.on{animation:none;} }

  .kicker{
    font-family:var(--mono); font-size:11.5px;
    letter-spacing:.2em; color:var(--accent); text-transform:uppercase;
    margin-bottom:14px; display:flex; align-items:center; gap:.9rem;
  }
  .kicker::after{ content:""; flex:1; height:1px; background:var(--line); }
  .kicker.warm{ color:var(--alert); }
  h1{ font-family:var(--serif); font-weight:600; font-size:69.1px; line-height:1.26; text-wrap:balance; }
  h2{ font-family:var(--serif); font-weight:600; font-size:36px; line-height:1.36; text-wrap:balance; margin-bottom:16px; }

  strong{ color:var(--ink); font-weight:700; }

  em{ font-style:normal; color:var(--accent); }
  .mono{ font-family:var(--mono); }
  .alert{ color:var(--alert); }
  .gold{ color:var(--gold); }
  .ac{ color:var(--accent); }

  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:40.3px; align-items:start; }

  .center{ align-items:center; text-align:center; }

  .fmlist{ display:flex; flex-direction:column; gap:15px; }

  .recap{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; width:100%; max-width:1000px; }
  .rc{ border-top:1px solid var(--line); padding-top:12px; text-align:left; }
  .rc .rcn{ display:block; font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--accent); margin-bottom:6px; }
  .rc .rct{ display:block; font-size:14px; line-height:1.7; color:var(--dim); }
  .turnline{ font-family:var(--mono); font-size:13px; color:var(--alert); letter-spacing:.1em; }
  .branch{ display:flex; flex-direction:column; gap:12px; }
  .bnode{ border:1px solid var(--line); border-radius:2px; padding:12px 14px; background:var(--surface); }

  .bsplit{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .bx{ font-family:var(--mono); font-size:12px; color:var(--alert); text-align:center; }
  .pairfig{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; }
  .pbox{ border:1px solid var(--line); border-radius:2px; padding:12px 14px; background:var(--surface);
         font-size:14px; line-height:1.6; color:var(--ink); text-align:center; }
  .pbox small{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:4px; }
  .plink{ font-family:var(--mono); font-size:11px; color:var(--faint); text-align:center; white-space:nowrap; }
  .plink.q{ color:var(--alert); font-size:20px; }
  .pcard{ border-left:2px solid var(--accent-dim); padding:0 0 0 18px; }
  .pcard .ph{ display:block; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:2px; }

  .pcard .prow{ display:block; font-size:13.5px; line-height:1.5; color:var(--dim); padding:7px 0;

  .mir{ display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:start; }
  .mc{ display:flex; flex-direction:column; gap:20px; }

  .mrow .ms{ display:block; font-family:var(--mono); font-size:10.5px; line-height:1.7;

  .axis{ display:flex; flex-direction:column; gap:26px; }
  .ax{ border-left:2px solid var(--accent-dim); padding-left:18px; }

            color:var(--faint); margin-bottom:7px; }
  .ax .axt{ display:block; font-family:var(--serif); font-size:22px; line-height:1.45; color:var(--ink); }
  .mc.hot .ax .axt{ color:var(--alert); }
  .ax .axs{ display:block; font-size:13.5px; line-height:1.75; color:var(--dim); margin-top:9px; }
  .ax .axc{ display:block; font-family:var(--mono); font-size:10.5px; line-height:1.7;
            color:var(--faint); margin-top:6px; }
  .qlist{ display:flex; flex-direction:column; gap:26px; }
  .qrow{ display:grid; grid-template-columns:auto 1fr; gap:0 20px; align-items:baseline;
         border-left:2px solid var(--accent-dim); padding-left:20px; }

  .qn{ font-family:var(--mono); font-size:15px; letter-spacing:.1em; color:var(--accent); }

  .qt{ display:block; font-family:var(--serif); font-size:23px; line-height:1.55; color:var(--ink); }

  .dotcap{ font-size:13px; line-height:1.75; color:var(--dim); margin-top:10px; max-width:none; }
  .cvt2{ font-size:15px; color:var(--ink); margin-bottom:12px; max-width:none; }
  .cvcap2{ font-size:13px; line-height:1.8; color:var(--faint); margin-top:12px; max-width:none; }
  .cvcap2 b{ color:var(--ink); font-weight:700; }
  .cvcap2 span{ display:block; font-family:var(--mono); font-size:10px; margin-top:6px; }
  .runs2{ display:flex; flex-direction:column; gap:12px; }
  .rbox{ background:#0A1119; border:1px solid var(--line); border-radius:2px; padding:12px 14px; }
  .rbox .rl{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;

  .rbox pre{ font-family:var(--mono); font-size:11px; line-height:1.75; color:var(--dim);
             white-space:pre; overflow-x:auto; }
  .rbox pre i{ font-style:normal; color:var(--accent); }
  .rbox pre b{ font-weight:400; color:var(--alert); }
  .conv{ display:flex; flex-direction:column; gap:22px; }
  .cvblk .cvh{ display:flex; align-items:baseline; gap:12px; margin-bottom:10px; }
  .cvblk .cvv{ font-family:var(--mono); font-size:12px; color:var(--faint); letter-spacing:.08em; }
  .cvblk .cvt{ font-size:14px; color:var(--ink); }
  .cvruns{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .cvrun{ display:flex; flex-direction:column; gap:4px; }
  .cvrun span{ height:5px; border-radius:1px; background:var(--accent-dim); display:block; }
  .cvrun.x span{ background:#6E5A55; }
  .cvcap{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
          font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:8px; max-width:none; }
  .fmt{ display:flex; flex-direction:column; gap:14px; }
  .fm{ border-left:2px solid var(--line); padding-left:16px; }
  .fm .fmn{ display:block; font-size:15px; color:var(--ink); font-weight:700; }
  .fm .fmd{ display:block; font-family:var(--mono); font-size:11.5px; line-height:1.7; color:var(--faint); margin-top:4px; }
  .fm .fmd i{ font-style:normal; color:var(--accent); }
  .src1{ font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:22px; max-width:none; }
  .close{ font-size:16px; line-height:1.85; color:var(--dim); margin-top:34px; max-width:none; }
  .close .s2{ display:block; font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:8px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start; }
  .fig2{ display:flex; flex-direction:column; border-left:2px solid var(--accent-dim); padding-left:22px; }
  .fig2 .fv{ font-family:var(--serif); font-size:76px; line-height:1; font-weight:600; color:var(--ink); }
  .fig2 .fv i{ font-style:normal; font-size:.38em; color:var(--accent); margin-left:.12em; }
  .fig2 .fl{ font-size:15px; line-height:1.8; color:var(--dim); margin-top:16px; }
  .fig2 .fs{ font-family:var(--mono); font-size:10.5px; line-height:1.7; color:var(--faint); margin-top:14px; }
  .flowv{ display:flex; flex-direction:column; gap:10px; }
  .fr{ display:grid; grid-template-columns:1fr; gap:2px; border-left:2px solid var(--line); padding-left:18px; }
  .fr .ft{ font-size:17px; line-height:1.6; color:var(--ink); }
  .fr .fn{ font-family:var(--mono); font-size:10.5px; color:var(--faint); }
  .farr{ font-family:var(--mono); font-size:14px; color:var(--faint); padding-left:6px; }
  .fq{ border-left:2px solid var(--alert); padding-left:18px; }
  .fq .ft{ font-family:var(--serif); font-size:24px; line-height:1.5; color:var(--alert); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:19.6px 21.9px; }
  .card.lit{ border-left:3px solid var(--accent); }
  .card.hot{ border-left:3px solid var(--alert); }
  .card p{ font-size:13.8px; line-height:1.75; }
  .src{ font-family:var(--mono); font-size:10.2px; color:var(--faint); margin-top:.6rem; }

  .stat{ font-family:var(--serif); font-size:92.2px; line-height:1; font-weight:600; }
  .stat.sm{ font-size:48.0px; }
  .stat-cap{ font-size:13.2px; color:var(--dim); margin-top:.5rem; line-height:1.65; }

  .paper{
    background:var(--paper); color:#1A1F26; border-radius:2px;
    padding:18.4px 21.9px;
    font-family:var(--mono); font-size:12.5px; line-height:1.72;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
  .paper .tag{ display:block; font-size:.74em; color:#6C7480; letter-spacing:.08em; margin-bottom:.35rem; }
  .paper strong{ color:#1A1F26; }
  .paper mark{ background:#F4D8A8; color:#1A1F26; padding:0 .18em; }

  .code{
    background:#0A1119; border:1px solid var(--line); border-radius:2px;
    padding:18.4px 21.9px;
    font-family:var(--mono); font-size:12.5px; line-height:1.8; color:var(--dim);
    white-space:pre-wrap;
  }
  .code .c{ color:var(--faint); } .code .k{ color:var(--accent); } .code .w{ color:var(--alert); }

  ul.plain{ list-style:none; display:flex; flex-direction:column; gap:.7rem; }
  ul.plain li{ font-size:15.4px; line-height:1.75; color:var(--dim); padding-left:1.5rem; position:relative; }
  ul.plain li::before{ content:""; position:absolute; left:0; top:.72em; width:.5rem; height:1px; background:var(--accent); }
  ul.plain li.x::before{ background:var(--alert); }
  ul.num{ list-style:none; display:flex; flex-direction:column; gap:.65rem; counter-reset:n; }
  ul.num li{ font-size:15.0px; line-height:1.7; color:var(--dim); padding-left:2rem; position:relative; counter-increment:n; }
  ul.num li::before{ content:"H" counter(n); position:absolute; left:0; top:.05em; font-family:var(--mono); font-size:.82em; color:var(--gold); }

  table{ width:100%; border-collapse:collapse; font-size:12.7px; }
  th{ text-align:left; font-family:var(--mono); font-size:9.9px; letter-spacing:.09em; color:var(--faint); text-transform:uppercase; font-weight:400; padding:.45rem .6rem; border-bottom:1px solid var(--line); }
  td{ padding:.5rem .6rem; border-bottom:1px solid var(--line); color:var(--dim); vertical-align:top; }
  td.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); text-align:right; }
  td.nm{ color:var(--ink); font-weight:700; white-space:nowrap; }
  tr.hi td{ color:var(--ink); } tr.hi td:first-child{ color:var(--accent); }
  table.tight td, table.tight th{ padding:.38rem .55rem; }

  .flow{ display:grid; grid-template-columns:repeat(4,1fr); gap:.65rem; }
  .step{ background:var(--surface); border:1px solid var(--line); border-top:2px solid var(--accent-dim); border-radius:2px; padding:16.1px; }
  .step .n{ font-family:var(--mono); font-size:10.2px; color:var(--accent); letter-spacing:.1em; }
  .step .t{ font-size:13.6px; font-weight:700; margin:.3rem 0 .35rem; line-height:1.45; }
  .step .d{ font-size:11.3px; color:var(--faint); line-height:1.6; }

  .matrix{ display:grid; grid-template-columns:auto 1fr 1fr; gap:.5rem; align-items:stretch; }
  .mh{ font-family:var(--mono); font-size:10.6px; color:var(--faint); display:flex; align-items:center; justify-content:center; text-align:center; padding:.4rem; line-height:1.5; }
  .mh.side{ writing-mode:vertical-rl; }
  .cell{ background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:15.0px; }
  .cell .cl{ font-family:var(--mono); font-size:10.4px; color:var(--faint); letter-spacing:.08em; }
  .cell .ct{ font-size:13.8px; font-weight:700; margin:.25rem 0 .3rem; }
  .cell .cd{ font-size:11.5px; color:var(--faint); line-height:1.55; }
  .cell.full{ border-color:var(--accent-dim); border-width:1px 1px 1px 3px; border-left-color:var(--accent); }

  .vs{ display:grid; grid-template-columns:1fr auto 1fr; gap:16.1px; align-items:stretch; }
  .vs .arrow{ display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:23.0px; color:var(--alert); }
  .vs-lbl{ font-family:var(--mono); font-size:9.9px; letter-spacing:.12em; margin-bottom:.3rem; }
  .vs-spec .vs-lbl{ color:var(--faint); }
  .vs-impl .vs-lbl{ color:var(--alert); }
  .vs-box{ background:var(--paper); color:#1A1F26; border-radius:2px; padding:15.0px 17.3px; font-family:var(--mono); font-size:11.7px; line-height:1.68; height:100%; }
  .vs-box.dark{ background:#0A1119; color:var(--dim); border:1px solid var(--line); }
  .vs-box mark{ background:#F4D8A8; color:#1A1F26; padding:0 .18em; }
  .vs-box .w{ color:var(--alert); }
  .vs-row{ margin-bottom:16.1px; }
  .vs-row:last-child{ margin-bottom:0; }
  .vs-cap{ font-size:12.1px; color:var(--faint); margin-bottom:.35rem; }
  .chrome{ position:absolute; left:0; right:0; bottom:0; height:41.5px; display:flex; align-items:center; justify-content:space-between; padding:0 40.3px; font-family:var(--mono); font-size:9.9px; color:var(--faint); letter-spacing:.1em; pointer-events:none; z-index:5; }
  .progress{ position:absolute; top:0; left:0; height:2px; background:var(--accent); z-index:6; transition:width .3s cubic-bezier(.2,.7,.3,1); }
  .hint{ opacity:.45; }
  .navzone{ position:absolute; top:0; bottom:0; width:20%; z-index:4; cursor:pointer; }
  .navzone.prev{ left:0; } .navzone.next{ right:0; }

d" stroke-linejoin="round"/><rect x="0" y="368" width="1112" height="62" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><g transform="translate(20 381) scale(0.6)"><path d="M0 0 H56 V36 H0 Z M28 36 V47 M13 48 H43" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="72" y="393.0" font-size="19" fill="#252b29" font-weight="700" text-anchor="start">実践の参加者15名には、KiroのアカウントとAWS環境を発行</text><text x="72" y="417.0" font-size="15" fill="#59605a" font-weight="400" text-anchor="start">教材を見るためのポータルのアカウントとは別に用意します</text></svg></div></section><div class="chrome">

  <span><span id="cur">1</span> / <span id="total">2</span></span>
</div>
</div></div>
<script>
(function(){
  const slides = Array.from(document.querySelectorAll('.slide'));
  const total = slides.length;
  const elCur = document.getElementById('cur');
  const elTotal = document.getElementById('total');
  const elBar = document.getElementById('progress');
  const elLabel = document.getElementById('label');
  const LABELS = ["教材動画や解説記事、活用事例をポータルで見られます", "実践中の質問・相談と、AIを使う環境を用意します"];
  let i = 0;
  elTotal.textContent = total;
  function show(n){
    i = Math.max(0, Math.min(total-1, n));
    slides.forEach((s,k)=> s.classList.toggle('on', k===i));
    elCur.textContent = i+1;
    elBar.style.width = ((i+1)/total*100) + '%';
    elLabel.textContent = LABELS[i] || '';
    shrink(slides[i]);
    try{ location.hash = String(i+1); }catch(e){}
  }
  const next = ()=> show(i+1);
  const prev = ()=> show(i-1);
  addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10)-1;if(Number.isFinite(n)&&n!==i)show(n);});
  document.addEventListener('keydown', e=>{
    if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); next(); }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); show(0); }
    else if(e.key==='End'){ e.preventDefault(); show(total-1); }
  });
  document.getElementById('znext').addEventListener('click', next);
  document.getElementById('zprev').addEventListener('click', prev);
  let tx=null;
  document.addEventListener('touchstart', e=>{ tx = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(tx===null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if(Math.abs(dx) > 45){ dx < 0 ? next() : prev(); }
    tx = null;
  }, {passive:true});
  const stage=document.getElementById('stage');
  const deck=document.getElementById('deck');
  const shrink=(sl)=>{
    if(!sl) return;
    const b=sl.querySelector('.body'); if(!b) return;
    b.style.transform=''; b.style.width='';
    const avail=b.clientHeight, need=b.scrollHeight;
    if(need>avail+1){
      const k=Math.max(.72, avail/need);
      b.style.transformOrigin='top left';
      b.style.transform='scale('+k+')';
      b.style.width=(100/k)+'%';
    }
  };
  const fit=()=>{
    const w=deck.clientWidth||innerWidth, h=deck.clientHeight||innerHeight;
    stage.style.transform='translate(-50%,-50%) scale('+Math.min(w/1280,h/720)+')';
    shrink(document.querySelector('.slide.on'));
  };
  addEventListener('resize',fit);
  addEventListener('orientationchange',fit);
  if(window.visualViewport) visualViewport.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(deck);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  fit();
  const start = parseInt((location.hash||'').replace('#',''),10);
  show(Number.isFinite(start) && start>0 ? start-1 : 0);
})();
</script>
