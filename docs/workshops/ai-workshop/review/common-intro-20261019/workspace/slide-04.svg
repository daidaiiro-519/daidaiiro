<text class="note" x="43" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理：証憑確認</text>
<path class="link" d="M134 43 H151 V60 M134 76 H151 V60" fill="none" stroke="#252b29" stroke-width="1"/>
