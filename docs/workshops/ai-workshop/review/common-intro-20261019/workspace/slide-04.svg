<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="前のページの不具合は、上長承認後から変更を禁止する修正で解消。一方、上長の支出承認と経理の証憑確認を同じ承認済み状態で扱う設計は残った。その設計のまま差し戻しと再提出を追加し、複数の処理とテストを読み直す負担が増えた。"><defs data-dsvg="marker"><marker id="dsvg-fc0aac47-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
