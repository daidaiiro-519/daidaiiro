<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長の支出承認と経理の証憑確認が一つの承認済み状態にまとめられているが、証憑だけ再提出する要件では上長承認を維持し、経理確認をやり直す必要がある。対応のため、経理の差し戻し、申請者の証憑修正、経理の再確認の各処理に例外条件を追加し、関連処理とテストの照合範囲が広がる。"><defs data-dsvg="marker"><marker id="dsvg-f2da36e8-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
