<text class="note" x="184" y="75" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">判断を一つに集約</text>
<text class="note" x="18" y="101" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">どちらの判断が有効か、設計から区別できない</text>

