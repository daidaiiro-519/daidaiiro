<path class="link" d="M351 70 l3 3 6 -7" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="365" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長承認</text>
