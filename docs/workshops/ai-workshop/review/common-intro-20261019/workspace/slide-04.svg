<text class="note" x="30" y="168" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長承認を維持</text>
<text class="note" x="30" y="182" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">例外条件を追加</text>
