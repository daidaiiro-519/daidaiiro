<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="承認済みという言葉の意味を上長と経理の判断に分ける。上長は支出の目的と金額を承認し、経理は証憑が精算条件を満たすか確認する。目的と金額を変えず証憑だけ修正して再提出する場合、上長承認は維持し、経理は証憑を確認し直す。"><defs data-dsvg="marker"><marker id="dsvg-d05a6caf-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
<rect class="box focus" x="6" y="3" width="544" height="25" fill="#fffaf2" stroke="#ae3f23" stroke-width="2" rx="5"/>
<text class="title" x="278" y="20" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">「承認済み」── 何の判断が済んだ状態か</text>
<rect class="field" x="6" y="40" width="262" height="98" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="20" y="60" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">上長による支出の承認</text>
<rect class="badge" x="18" y="70" width="238" height="56" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M31 81 h24 v32 h-24 z M36 88 h14 M36 95 h14 M36 104 h8" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="68" y="88" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">支出の目的・金額</text>
<text class="label" x="68" y="111" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">この支出を認めた</text>
<rect class="field" x="288" y="40" width="262" height="98" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="302" y="60" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">経理による証憑の確認</text>
<rect class="badge" x="300" y="70" width="238" height="56" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M313 81 h24 v32 l-4 -3 -4 3 -4 -3 -4 3 -4 -3 -4 3 z M318 88 h14 M318 95 h14 M318 102 h8" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="350" y="88" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">領収書などの証憑</text>
<text class="label" x="350" y="111" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">精算の条件を満たした</text>
<rect class="badge" x="6" y="149" width="544" height="23" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="278" y="165" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">支出の目的・金額は変えず、証憑だけ修正して再提出</text>
<path class="flow" d="M137 173 V183" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-d05a6caf-arrow-252b29)"/>
<path class="flow" d="M419 173 V183" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-d05a6caf-arrow-252b29)"/>
<rect class="badge" x="6" y="185" width="262" height="29" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M22 199 l4 4 8 -9" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="title" x="46" y="205" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">上長の承認は維持</text>
