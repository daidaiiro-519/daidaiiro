<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="本来の仕様と今回の実装を同じ配置で比較する。上長承認後・経理承認前に申請者が金額を12,000円から18,000円に変更すると、本来は保存できないが実装では保存できる。この状態の変更は取り込み前のテストで未確認だった。変更制限を修正し、ケース追加と再テスト・再レビューを行う。">
