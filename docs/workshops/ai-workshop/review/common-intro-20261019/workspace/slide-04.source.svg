<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長の支出承認と経理の証憑確認が一つの承認済み状態にまとめられ、設計から区別できない。証憑を差し戻して再提出する要件では、経理の差し戻し時に上長承認を維持し、申請者は証憑だけを修正し、再提出後に経理が確認し直す。各処理に例外条件を追加したため、関連処理とテストの確認範囲が広がる。">
<rect class="field" x="6" y="4" width="628" height="27"/>
<path class="link" d="M20 15 v-4 a5 5 0 0 1 10 0 v4 M18 15 h14 v10 h-14 z"/>
<path class="link" d="M41 20 l3 3 6 -7"/>
<text class="label" x="57" y="22">修正済み：上長承認後は申請者が直接変更できない</text>

<rect class="field" x="6" y="37" width="628" height="57"/>
<rect class="badge" x="18" y="45" width="170" height="20"/>
<g transform="translate(31 55) scale(.19)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M43 49 h9 v13 h-9 z M46 52 h4 M46 57 h4"/>
<text class="note" x="59" y="59">上長：支出承認</text>
<rect class="badge" x="18" y="69" width="170" height="20"/>
<g transform="translate(31 79) scale(.19)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M43 73 h9 v13 l-3 -2 -2 2 -2 -2 -2 2 z M46 77 h4 M46 82 h4"/>
<text class="note" x="59" y="83">経理：証憑確認</text>
<path class="link" d="M188 55 H205 V67 M188 79 H205 V67"/>
<path class="flow" d="M205 67 H224"/>
<rect class="box focus" x="228" y="45" width="394" height="42"/>
<text class="label" x="246" y="63">共通の「承認済み」</text>
<text class="note" x="246" y="79">どちらの判断が有効か、設計から区別できない</text>

<path class="flow" d="M425 94 V101"/>
<rect class="field" x="6" y="103" width="628" height="24"/>
<path class="link" d="M18 107 h12 v15 l-3 -2 -3 2 -3 -2 -3 2 z M21 111 h7 M21 116 h7"/>
<text class="label" x="39" y="120">追加要件：証憑を差し戻して再提出</text>

<rect class="field" x="6" y="130" width="628" height="66"/>
<rect class="badge" x="14" y="136" width="194" height="54"/>
<g transform="translate(29 149) scale(.19)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="45" y="152">経理：差し戻し</text>
<text class="note" x="26" y="169">上長承認を維持</text>
<rect class="badge" x="26" y="174" width="170" height="13"/>
<text class="note" x="39" y="184">例外条件を追加</text>
<path class="flow" d="M210 162 H224"/>
<rect class="badge" x="228" y="136" width="184" height="54"/>
<g transform="translate(243 149) scale(.19)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="259" y="152">申請者：証憑修正</text>
<text class="note" x="240" y="169">証憑だけ修正できる</text>
<rect class="badge" x="240" y="174" width="160" height="13"/>
<text class="note" x="253" y="184">例外条件を追加</text>
<path class="flow" d="M414 162 H428"/>
<rect class="badge" x="432" y="136" width="194" height="54"/>
<g transform="translate(447 149) scale(.19)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="463" y="152">経理：再確認</text>
<text class="note" x="444" y="169">証憑を確認し直す</text>
<rect class="badge" x="444" y="174" width="170" height="13"/>
<text class="note" x="457" y="184">例外条件を追加</text>

<path class="flow" d="M320 196 V204"/>
<rect class="field" x="6" y="206" width="628" height="39"/>
<rect class="badge" x="18" y="214" width="13" height="16"/>
<rect class="badge" x="22" y="217" width="13" height="16"/>
<rect class="badge" x="26" y="220" width="13" height="16"/>
<path class="link" d="M29 225 h7 M29 230 h5"/>
<g transform="translate(59 225) scale(.20)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="78" y="223">3つの処理と関連テストを照合</text>
<text class="note" x="78" y="237">影響範囲を追う作業が増え、レビューに時間がかかる</text>
</svg>
