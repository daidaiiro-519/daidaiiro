<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長の支出承認と経理の証憑確認が一つの承認済み状態にまとめられているが、証憑だけ再提出する要件では上長承認を維持し、経理確認をやり直す必要がある。対応のため、経理の差し戻し、申請者の証憑修正、経理の再確認の各処理に例外条件を追加し、関連処理とテストの照合範囲が広がる。">
<rect class="field" x="6" y="4" width="308" height="106"/>
<text class="title" x="18" y="21">現行の設計</text>
<rect class="badge" x="18" y="31" width="116" height="25"/>
<g transform="translate(29 42) scale(.17)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="43" y="47">上長：支出承認</text>
<rect class="badge" x="18" y="64" width="116" height="25"/>
<g transform="translate(29 75) scale(.17)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="43" y="80">経理：証憑確認</text>
<path class="link" d="M134 43 H151 V60 M134 76 H151 V60"/>
<path class="flow" d="M151 60 H166"/>
<rect class="box focus" x="170" y="35" width="132" height="52"/>
<text class="title" x="184" y="57">承認済み</text>
<text class="note" x="184" y="75">判断を一つに集約</text>
<text class="note" x="18" y="101">どちらの判断が有効か、設計から区別できない</text>

<rect class="field" x="326" y="4" width="308" height="106"/>
<text class="title" x="340" y="21">証憑だけ再提出する要件</text>
<rect class="badge" x="340" y="31" width="280" height="20"/>
<text class="note" x="352" y="45">上長承認は維持し、経理確認はやり直す</text>
<rect class="badge" x="340" y="60" width="132" height="38"/>
<path class="link" d="M351 70 l3 3 6 -7"/>
<text class="note" x="365" y="74">上長承認</text>
<text class="label" x="365" y="91">維持</text>
<rect class="badge" x="488" y="60" width="132" height="38"/>
<path class="link" d="M499 66 a7 7 0 1 1 -1 11 M498 77 h5 M498 77 v-5"/>
<text class="note" x="513" y="74">経理確認</text>
<text class="label" x="513" y="91">やり直す</text>

<rect class="field" x="6" y="116" width="628" height="82"/>
<text class="label" x="18" y="131">対応のため、3つの処理に個別条件を追加</text>
<rect class="badge" x="18" y="138" width="190" height="51"/>
<g transform="translate(31 151) scale(.18)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="47" y="153">経理：差し戻し</text>
<text class="note" x="30" y="168">上長承認を維持</text>
<text class="note" x="30" y="182">例外条件を追加</text>
<path class="flow" d="M210 163 H222"/>
<rect class="badge" x="226" y="138" width="190" height="51"/>
<g transform="translate(239 151) scale(.18)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="255" y="153">申請者：証憑修正</text>
<text class="note" x="238" y="168">証憑だけ編集できる</text>
<text class="note" x="238" y="182">例外条件を追加</text>
<path class="flow" d="M418 163 H430"/>
<rect class="badge" x="434" y="138" width="188" height="51"/>
<g transform="translate(447 151) scale(.18)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="463" y="153">経理：再提出確認</text>
<text class="note" x="446" y="168">証憑を確認し直す</text>
<text class="note" x="446" y="182">例外条件を追加</text>

<path class="flow" d="M320 198 V205"/>
<rect class="field" x="6" y="207" width="628" height="38"/>
<rect class="badge" x="18" y="216" width="13" height="16"/>
<rect class="badge" x="22" y="219" width="13" height="16"/>
<rect class="badge" x="26" y="222" width="13" height="16"/>
<path class="link" d="M29 227 h7 M29 232 h5"/>
<g transform="translate(59 226) scale(.20)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="78" y="224">3つの処理と関連テストを照合</text>
<text class="note" x="78" y="238">影響範囲を追う作業が増え、レビューに時間がかかる</text>
</svg>
