<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="担当タスクの説明は承認後は変更不可。左は仕様と既存コードで確認できる本来の上長承認後という条件。右は開発者が経理承認後と理解してAIに伝え、実装とテストを作成し、AIレビューは指摘なし、人のレビューも承認した過程。成果物が増え、人の確認もAIの指摘中心となり、元の業務条件との照合が不十分だった。">
