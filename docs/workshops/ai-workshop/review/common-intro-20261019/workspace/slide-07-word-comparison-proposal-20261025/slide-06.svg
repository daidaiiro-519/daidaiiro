<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="承認済みが何についての判断かを上長と経理の業務に分けて確かめる。上長は支出の目的と金額を認め、経理は証憑が精算条件を満たすか確認する。支出の目的と金額を変えず証憑だけ修正した場合、上長承認は維持し、経理は再確認する。この違いを状態の表し方、変更できる条件、テストの確認項目へ反映する。"><defs data-dsvg="marker"><marker id="dsvg-b6c4d4eb-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
