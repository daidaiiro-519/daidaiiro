<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="経費精算システムを使う申請者の目的の大きさと要件、AIの開発作業を区別する。経費精算は複数の作業を含む目的。差し戻された申請の修正と再提出は一回の作業で達成する目的。そのための要件として上長承認の維持と経理の再確認を示す。AIの開発作業は下段に別枠で示す。">
<rect class="field" x="6" y="4" width="260" height="147"/>
<text class="title" x="20" y="23">申請者の目的</text>
<rect class="badge" x="18" y="32" width="236" height="40"/>
<text class="note" x="30" y="47">複数の作業を含む目的</text>
<text class="label" x="30" y="64">申請した経費を精算する</text>
<path class="flow" d="M136 74 V89"/>
<rect class="box focus" x="18" y="92" width="236" height="50"/>
<text class="note" x="30" y="107">一回の作業で達成する目的</text>
<text class="label" x="30" y="123">差し戻された申請を修正し、</text>
<text class="label" x="30" y="138">再提出を完了する</text>
<path class="flow" d="M268 117 H290"/>
<rect class="field" x="292" y="4" width="258" height="147"/>
<text class="title" x="304" y="23">この目的を満たす要件</text>
<rect class="badge" x="304" y="32" width="234" height="32"/>
<text class="note" x="316" y="46">支出の目的・金額を変えず、</text>
<text class="note" x="316" y="60">証憑だけを修正して再提出する場合</text>
<rect class="badge" x="304" y="75" width="234" height="28"/>
<text class="label" x="316" y="94">上長の承認を維持する</text>
<rect class="badge" x="304" y="112" width="234" height="28"/>
<text class="label" x="316" y="131">経理が証憑を確認し直す</text>
<rect class="field" x="6" y="164" width="544" height="50"/>
<text class="label" x="18" y="181">開発者の目的：要件を満たす変更を、確認の根拠とともに完成させる</text>
<rect class="badge" x="18" y="188" width="153" height="20"/>
<text class="note" x="94.5" y="202" text-anchor="middle">要件と既存仕様を確認</text>
<path class="flow" d="M173 198 H187"/>
<rect class="badge" x="189" y="188" width="153" height="20"/>
<text class="note" x="265.5" y="202" text-anchor="middle">設計・実装・テスト</text>
<path class="flow" d="M344 198 H358"/>
<rect class="badge" x="360" y="188" width="178" height="20"/>
<text class="note" x="449" y="202" text-anchor="middle">要件・設計と照合しレビュー</text>
</svg>
