<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="結合テストで同じ申請の作成、承認、申請者による再変更を試す。承認済みの金額は12000円のまま変わらないはずだが、18000円に変更して保存できる不具合が発覚。マージせず修正と再確認へ進む"><defs data-dsvg="marker"><marker id="dsvg-a480b70d-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
