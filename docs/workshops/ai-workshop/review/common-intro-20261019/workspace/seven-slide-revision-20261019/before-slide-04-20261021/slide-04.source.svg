<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="結合テストで同じ申請の作成、承認、申請者による再変更を試す。承認済みの金額は12000円のまま変わらないはずだが、18000円に変更して保存できる不具合が発覚。マージせず修正と再確認へ進む">
<rect class="field" x="6" y="5" width="152" height="72"/>
<text class="title" x="20" y="25">① 申請</text>
<path class="link" d="M20 37 h24 v29 h-24 z M25 45 h14 M25 51 h14 M25 57 h10"/>
<text class="label" x="57" y="47">申請者が申請</text>
<text class="note" x="57" y="65">金額：12,000円</text>
<path class="flow" d="M160 43 H199"/>
<rect class="field" x="202" y="5" width="152" height="72"/>
<text class="title" x="216" y="25">② 承認</text>
<g transform="translate(226 46) scale(.4)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="246" y="47">承認者が承認</text>
<text class="note" x="216" y="68">同じ申請が承認済みに</text>
<path class="flow" d="M356 43 H395"/>
<rect class="field" x="398" y="5" width="152" height="72"/>
<text class="title" x="412" y="25">③ 再変更</text>
<g transform="translate(422 46) scale(.4)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="442" y="47">申請者が金額変更</text>
<text class="note" x="412" y="68">18,000円で保存を試す</text>
<rect class="field" x="6" y="89" width="258" height="87"/>
<text class="title" x="20" y="111">期待する動作</text>
<rect class="badge" x="20" y="120" width="75" height="20"/>
<text class="note" x="57" y="135" text-anchor="middle">承認済み</text>
<text class="note" x="106" y="135">申請者は直接変更できない</text>
<text class="label" x="20" y="162">12,000円のまま</text>
<rect class="badge" x="192" y="146" width="58" height="22"/>
<text class="note" x="221" y="162" text-anchor="middle">保存不可</text>
<rect class="box focus" x="292" y="89" width="258" height="87"/>
<text class="title" x="306" y="111">結合テストでの動作</text>
<rect class="badge" x="306" y="120" width="75" height="20"/>
<text class="note" x="343" y="135" text-anchor="middle">承認済み</text>
<text class="note" x="392" y="135">変更して保存できてしまった</text>
<text class="label" x="306" y="162">18,000円に変更</text>
<rect class="badge" x="478" y="146" width="58" height="22"/>
<text class="note" x="507" y="162" text-anchor="middle">保存完了</text>
<rect class="badge" x="6" y="185" width="544" height="29"/>
<text class="label" x="19" y="204">マージせず、修正・再テスト・再レビューへ</text>
</svg>
