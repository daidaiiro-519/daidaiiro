<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="申請、上長承認、経理承認という状態の流れ。本来は上長承認後から申請者の変更を禁止するが、今回の実装は経理承認後から禁止しており、その間は変更できてしまう。CIで上長承認後の申請を変更すると、12000円のままのはずが18000円で保存された。修正と再確認へ進む。">
<rect class="field" x="6" y="4" width="160" height="45"/>
<text class="title" x="20" y="23">1 申請</text>
<path class="link" d="M20 30 h12 v13 h-12 z M23 34 h6 M23 38 h6"/>
<text class="note" x="42" y="40">申請者が提出</text>
<path class="flow" d="M168 27 H196"/>
<rect class="field" x="198" y="4" width="160" height="45"/>
<text class="title" x="212" y="23">2 上長承認</text>
<g transform="translate(219 36) scale(.35)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="233" y="40">上長が承認</text>
<path class="flow" d="M360 27 H388"/>
<rect class="field" x="390" y="4" width="160" height="45"/>
<text class="title" x="404" y="23">3 経理承認</text>
<g transform="translate(411 36) scale(.35)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="425" y="40">経理担当者が承認</text>
<rect class="badge" x="6" y="64" width="160" height="24"/>
<text class="label" x="20" y="81">本来の制限</text>
<rect class="field" x="198" y="64" width="352" height="24"/>
<text class="label" x="374" y="81" text-anchor="middle">上長承認後から、申請者の変更を禁止</text>
<rect class="badge" x="6" y="103" width="160" height="24"/>
<text class="label" x="20" y="120">今回の実装</text>
<rect class="box focus" x="198" y="103" width="160" height="24"/>
<text class="label" x="278" y="120" text-anchor="middle">変更できてしまう</text>
<rect class="field" x="390" y="103" width="160" height="24"/>
<text class="note" x="470" y="120" text-anchor="middle">経理承認後から変更禁止</text>
<rect class="field" x="6" y="141" width="262" height="41"/>
<text class="title" x="18" y="158">上長承認後：期待する動作</text>
<text class="label" x="18" y="175">12,000円のまま／保存不可</text>
<rect class="field" x="288" y="141" width="262" height="41"/>
<text class="title" x="300" y="158">CIのテスト：実際の動作</text>
<text class="label" x="300" y="175">18,000円に変更／保存できた</text>
<rect class="badge" x="6" y="192" width="544" height="22"/>
<text class="label" x="278" y="207" text-anchor="middle">不具合が発覚 → 修正・再テスト・再レビューが必要に</text>
</svg>