<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="変更制限の不具合は修正済みだが、設計の前提を見直さずに追加対応を続ける。左では支出の承認と証憑の確認という別の業務判断を区別する。証憑だけ修正する場合は上長承認を維持し、経理の確認をやり直す。右では共通の承認済み状態を参照したまま、変更制限の個別修正、差し戻し、再提出の条件を追加。レビューのたび複数の処理とテストを読み直す負担が残る。"><defs data-dsvg="marker"><marker id="dsvg-2d02deb8-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
<rect class="badge" x="6" y="4" width="544" height="26" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
