<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="最初の不具合は修正済み。左では支出の承認と証憑の確認という別の業務判断を区別する。証憑だけ修正する場合は上長承認を維持し、経理の確認をやり直す。右では共通の承認済み状態を参照したまま、変更制限の個別修正、差し戻し、再提出の条件を追加。レビューのたび複数の処理とテストを読み直す負担が残る。">
<rect class="badge" x="6" y="4" width="544" height="26"/>
<text class="label" x="20" y="22">最初の不具合は修正済み。その後、差し戻し・再提出を追加</text>
<rect class="field" x="6" y="41" width="176" height="124"/>
<text class="title" x="18" y="60">業務では別の判断</text>
<rect class="badge" x="18" y="69" width="152" height="39"/>
<text class="label" x="30" y="84">上長：支出を承認</text>
<text class="note" x="30" y="101">証憑だけの修正なら維持</text>
<rect class="badge" x="18" y="116" width="152" height="39"/>
<text class="label" x="30" y="131">経理：証憑を確認</text>
<text class="note" x="30" y="148">再提出された証憑を再確認</text>
<rect class="field" x="202" y="41" width="348" height="124"/>
<text class="title" x="214" y="60">実装では「承認済み」を共用</text>
<rect class="badge" x="214" y="69" width="324" height="23"/>
<text class="label" x="376" y="85" text-anchor="middle">共通の承認状態</text>
<path class="flow" d="M260 94 V106"/>
<path class="flow" d="M376 94 V106"/>
<path class="flow" d="M492 94 V106"/>
<rect class="badge" x="214" y="108" width="92" height="45"/>
<path class="link" d="M223 116 h10 v15 h-10 z M225 121 h6 M225 125 h6"/>
<text class="label" x="237" y="124">変更制限</text>
<text class="note" x="260" y="144" text-anchor="middle">個別に修正</text>
<rect class="badge" x="330" y="108" width="92" height="45"/>
<path class="link" d="M339 116 h10 v15 h-10 z M341 121 h6 M341 125 h6"/>
<text class="label" x="353" y="124">差し戻し</text>
<text class="note" x="376" y="144" text-anchor="middle">例外を追加</text>
<rect class="badge" x="446" y="108" width="92" height="45"/>
<path class="link" d="M455 116 h10 v15 h-10 z M457 121 h6 M457 125 h6"/>
<text class="label" x="469" y="124">再提出</text>
<text class="note" x="492" y="144" text-anchor="middle">条件を追加</text>
<rect class="box focus" x="6" y="177" width="544" height="37"/>
<g transform="translate(28 193) scale(.4)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="52" y="193">AIで修正は速い。でも、レビューでは複数の処理を読み直す</text>
<text class="note" x="52" y="208">何の判断を維持し、何を確認し直すか、コードとテストから確かめる</text>
</svg>