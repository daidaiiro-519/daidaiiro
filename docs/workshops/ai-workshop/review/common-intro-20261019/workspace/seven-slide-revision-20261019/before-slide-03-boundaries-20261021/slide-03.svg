<text class="label" x="278" y="120" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">変更できてしまう</text>
<rect class="field" x="390" y="103" width="160" height="24" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
