<rect class="field" x="198" y="4" width="160" height="45" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="212" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">2 上長承認</text>
<g transform="translate(219 36) scale(.35)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6" fill="none" stroke="#252b29" stroke-width="1"/></g>
<text class="note" x="233" y="40" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長が承認</text>
<path class="flow" d="M360 27 H388" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-0a172a77-arrow-252b29)"/>
<rect class="field" x="390" y="4" width="160" height="45" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="404" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">3 経理承認</text>
<g transform="translate(411 36) scale(.35)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6" fill="none" stroke="#252b29" stroke-width="1"/></g>
<text class="note" x="425" y="40" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理担当者が承認</text>
<rect class="badge" x="6" y="64" width="160" height="24" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="20" y="81" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">本来の制限</text>
<rect class="field" x="198" y="64" width="352" height="24" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="374" y="81" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">上長承認後から、申請者の変更を禁止</text>
<rect class="badge" x="6" y="103" width="160" height="24" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="20" y="120" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">今回の実装</text>
