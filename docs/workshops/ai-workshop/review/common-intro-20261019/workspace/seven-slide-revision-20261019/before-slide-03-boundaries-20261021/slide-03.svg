<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="申請、上長承認、経理承認という状態の流れ。本来は上長承認後から申請者の変更を禁止するが、今回の実装は経理承認後から禁止しており、その間は変更できてしまう。変更を取り込んだ後の自動テストで上長承認後の申請を変更すると、12000円のままのはずが18000円で保存された。修正と再確認へ進む。"><defs data-dsvg="marker"><marker id="dsvg-0a172a77-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
<rect class="field" x="6" y="4" width="160" height="45" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="20" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">1 申請</text>
