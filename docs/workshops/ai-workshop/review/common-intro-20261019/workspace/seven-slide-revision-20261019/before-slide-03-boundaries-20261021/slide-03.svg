<rect class="field" x="6" y="141" width="262" height="41" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="18" y="158" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">上長承認後：期待する動作</text>
<text class="label" x="18" y="175" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">12,000円のまま／保存不可</text>
<rect class="field" x="288" y="141" width="262" height="41" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="300" y="158" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">自動テスト：実際の動作</text>
<text class="label" x="300" y="175" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">18,000円に変更／保存できた</text>
<rect class="badge" x="6" y="192" width="544" height="22" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="278" y="207" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">不具合が発覚 → 修正・再テスト・再レビューが必要に</text>
</svg>