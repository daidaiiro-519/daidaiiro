<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="申請者と申請書で目的を示す。経費の精算という複数作業の目的から、差し戻された申請の修正と再提出へ進む。証憑だけを修正した場合、上長の承認は維持し、経理は確認し直す要件を人物と証憑で示す。下段には開発者の作業目的と、要件確認、設計と実装、レビューの作業を別枠で示す。"><defs data-dsvg="marker"><marker id="dsvg-0f8d1400-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
