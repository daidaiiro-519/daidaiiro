<rect class="field" x="6" y="53" width="262" height="132"/>
<text class="title" x="20" y="74">実際に進めていた作業</text>
<rect class="badge" x="18" y="85" width="238" height="66"/>
<path class="link" d="M30 96 h16 v36 h-16 z M34 104 l-2 3 2 3 M42 104 l2 3 -2 3 M34 118 h8 M34 124 h8"/>
<text class="note" x="59" y="102">差し戻し・再提出を追加</text>
<text class="label" x="59" y="128">既存の処理に条件を足す</text>
<path class="link" d="M137 151 V159"/>
<rect class="badge" x="18" y="159" width="238" height="19"/>
<g transform="translate(35 168) scale(.3)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="57" y="173">追加した機能の動作を確認</text>
<rect class="field" x="288" y="53" width="262" height="132"/>
<text class="title" x="302" y="74">目的から考える作業</text>
<rect class="badge" x="300" y="85" width="238" height="66"/>
<text class="note" x="312" y="99">業務ルールを確認する</text>
<text class="note" x="312" y="115">変更の影響を確認する</text>
