<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="左下のAIの指摘確認という具体的な作業から、上のレビューの目的へ戻る。目的は変更が業務上必要な条件を満たすか確かめること。その目的から右下の業務条件と実装・テスト結果の照合を考える。条件の例は承認済みを維持する。最後に、その言葉で同じ内容を確認できるかと問う。">
<rect class="box focus" x="116" y="4" width="324" height="67"/>
<text class="note" x="130" y="21">2 レビューで実現したいこと</text>
<text class="title" x="130" y="42">変更が業務上必要な条件を</text>
<text class="title" x="130" y="61">満たしているか確かめる</text>
<path class="flow" d="M63 99 V37 H114"/>
<rect class="badge" x="10" y="75" width="106" height="19"/>
<text class="note" x="63" y="89" text-anchor="middle">何のための確認？</text>
<path class="flow" d="M442 37 H493 V99"/>
<rect class="badge" x="440" y="75" width="106" height="19"/>
<text class="note" x="493" y="89" text-anchor="middle">何を確認する？</text>
<rect class="field" x="6" y="102" width="236" height="77"/>
<text class="title" x="20" y="122">1 今行っていた確認</text>
<path class="link" d="M22 135 h18 v26 h-18 z M26 141 h10 M26 147 h10 M26 153 h7"/>
<text class="label" x="52" y="145">AIの指摘がないか</text>
<text class="note" x="52" y="168">指摘なし → レビュー承認</text>
<rect class="field" x="314" y="102" width="236" height="77"/>
<text class="title" x="328" y="122">3 目的に必要な確認</text>
<text class="label" x="328" y="141">守る業務条件</text>
<text class="note" x="328" y="157">「承認済みを維持」など</text>
<text class="note" x="328" y="173">条件と実装・テスト結果を照合</text>
<rect class="badge" x="6" y="192" width="544" height="22"/>
<text class="label" x="278" y="207" text-anchor="middle">「承認済みを維持」と伝えれば、同じ内容を確認できる？</text>
</svg>