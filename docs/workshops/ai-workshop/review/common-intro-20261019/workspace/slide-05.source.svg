<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="申請者の目的の大きさを、経費精算全体と、一回の作業で達成する申請の修正・再提出に分けて示す。目的を満たす要件は既存仕様などで確認し、証憑だけの再提出では上長承認を維持し、経理が再確認する。要件から矢印で開発者の目的と作業へつなぎ、仕様確認、設計・実装・テスト、要件・設計と照合するレビューを示す。">
<rect class="field" x="6" y="4" width="294" height="162"/>
<g transform="translate(29 20) scale(.42)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="title" x="50" y="25">申請者の目的</text>
<rect class="badge" x="18" y="38" width="270" height="39"/>
<path class="link" d="M30 47 h19 v27 h-19 z M34 54 h11 M34 60 h11 M34 67 h7"/>
<text class="note" x="62" y="53">複数の作業を含む目的</text>
<text class="label" x="62" y="69">申請した経費を精算する</text>
<path class="flow" d="M153 79 V101"/>
<rect class="box focus" x="18" y="105" width="270" height="54"/>
<path class="link" d="M30 118 h19 v32 h-19 z M34 125 h11 M34 131 h8 M42 143 l10 -13 4 3 -10 13 -6 2 z"/>
<text class="note" x="67" y="120">一回の作業で達成する目的</text>
<text class="label" x="67" y="137">差し戻された申請を修正し、</text>
<text class="label" x="67" y="154">再提出を完了する</text>
<path class="flow" d="M302 132 H328"/>
<rect class="field" x="330" y="4" width="304" height="162"/>
<text class="title" x="344" y="25">業務知識・既存仕様で確かめる要件</text>
<rect class="badge" x="342" y="38" width="280" height="40"/>
<path class="link" d="M353 46 h19 v27 l-3 -2 -3 2 -3 -2 -3 2 -3 -2 -4 2 z M357 53 h11 M357 59 h11 M357 65 h7"/>
<text class="note" x="385" y="54">支出の目的・金額を変えず、</text>
<text class="note" x="385" y="70">証憑だけを修正して再提出する場合</text>
<rect class="badge" x="342" y="87" width="280" height="32"/>
<g transform="translate(357 102) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M367 102 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M371 102 l3 3 5 -6"/>
<text class="label" x="395" y="108">上長の承認を維持する</text>
<rect class="badge" x="342" y="127" width="280" height="32"/>
<g transform="translate(357 142) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M370 134 h11 v17 h-11 z M373 139 h5 M373 144 h5 M383 136 a8 8 0 0 1 0 14 M383 150 h4 M383 150 v-4"/>
<text class="label" x="395" y="148">経理が証憑を確認し直す</text>
<path class="flow" d="M482 169 V190"/>
<rect class="field" x="6" y="194" width="628" height="51"/>
<g transform="translate(25 207) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="43" y="209">開発者の目的：要件を満たす変更を、確認の根拠とともに完成させる</text>
<rect class="badge" x="18" y="219" width="176" height="21"/>
<path class="link" d="M26 222 h12 v16 h-12 z M29 227 h6 M29 232 h6"/>
<text class="note" x="46" y="234">要件と既存仕様を確認</text>
<path class="flow" d="M196 230 H216"/>
<rect class="badge" x="218" y="219" width="176" height="21"/>
<path class="link" d="M226 222 h15 v15 h-15 z M231 226 l-3 3 3 3 M237 226 l3 3 -3 3"/>
<text class="note" x="249" y="234">設計・実装・テスト</text>
<path class="flow" d="M396 230 H416"/>
<rect class="badge" x="418" y="219" width="204" height="21"/>
<path class="link" d="M426 222 h12 v16 h-12 z M429 227 h6 M429 233 l2 2 4 -4"/>
<text class="note" x="448" y="234">要件・設計と照合しレビュー</text>
