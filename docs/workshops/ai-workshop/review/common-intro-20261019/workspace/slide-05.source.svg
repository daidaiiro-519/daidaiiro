<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="設計と実装の目的を、業務ルールを守り変更の影響を確認できるようにすることと示す。左は既存処理への条件追加と個々の動作確認に偏っていた作業。右は目的から業務ルールと変更影響を確認し、判断の違いを設計で区別する作業。最後に承認が何の判断を指すかを問い、教材2へつなぐ。">
<rect class="badge" x="6" y="4" width="544" height="37"/>
