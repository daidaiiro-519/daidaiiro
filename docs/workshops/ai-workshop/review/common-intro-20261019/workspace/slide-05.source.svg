<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="申請者と申請書で目的を示す。経費の精算という複数作業の目的から、差し戻された申請の修正と再提出へ進む。証憑だけを修正した場合、上長の承認は維持し、経理は確認し直す要件を人物と証憑で示す。下段には開発者の作業目的と、要件確認、設計と実装、レビューの作業を別枠で示す。">
<rect class="field" x="6" y="4" width="294" height="169"/>
<g transform="translate(29 20) scale(.42)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="title" x="50" y="25">申請者の目的</text>
<rect class="badge" x="18" y="38" width="270" height="44"/>
<path class="link" d="M30 47 h19 v27 h-19 z M34 54 h11 M34 60 h11 M34 67 h7"/>
<text class="note" x="62" y="53">複数の作業を含む目的</text>
<text class="label" x="62" y="71">申請した経費を精算する</text>
<path class="flow" d="M153 84 V96"/>
<rect class="box focus" x="18" y="99" width="270" height="65"/>
<path class="link" d="M30 114 h19 v32 h-19 z M34 121 h11 M34 127 h8 M42 139 l10 -13 4 3 -10 13 -6 2 z"/>
<text class="note" x="67" y="115">一回の作業で達成する目的</text>
<text class="label" x="67" y="136">差し戻された申請を修正し、</text>
<text class="label" x="67" y="154">再提出を完了する</text>
<path class="flow" d="M302 132 H328"/>
<rect class="field" x="330" y="4" width="304" height="169"/>
<text class="title" x="344" y="25">この目的を満たす要件</text>
<rect class="badge" x="342" y="38" width="280" height="40"/>
<path class="link" d="M353 46 h19 v27 l-3 -2 -3 2 -3 -2 -3 2 -3 -2 -4 2 z M357 53 h11 M357 59 h11 M357 65 h7"/>
<text class="note" x="385" y="54">支出の目的・金額を変えず、</text>
<text class="note" x="385" y="70">証憑だけを修正して再提出する場合</text>
<rect class="badge" x="342" y="90" width="280" height="32"/>
<g transform="translate(357 105) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M367 105 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M371 105 l3 3 5 -6"/>
<text class="label" x="395" y="111">上長の承認を維持する</text>
<rect class="badge" x="342" y="133" width="280" height="32"/>
<g transform="translate(357 148) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M370 140 h11 v17 h-11 z M373 145 h5 M373 150 h5 M383 142 a8 8 0 0 1 0 14 M383 156 h4 M383 156 v-4"/>
<text class="label" x="395" y="154">経理が証憑を確認し直す</text>
<rect class="field" x="6" y="186" width="628" height="59"/>
<g transform="translate(25 201) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="43" y="203">開発者の目的：要件を満たす変更を、確認の根拠とともに完成させる</text>
<rect class="badge" x="18" y="215" width="176" height="24"/>
<path class="link" d="M26 219 h12 v16 h-12 z M29 224 h6 M29 229 h6"/>
<text class="note" x="46" y="231">要件と既存仕様を確認</text>
<path class="flow" d="M196 227 H216"/>
<rect class="badge" x="218" y="215" width="176" height="24"/>
<path class="link" d="M226 220 h15 v15 h-15 z M231 224 l-3 3 3 3 M237 224 l3 3 -3 3"/>
<text class="note" x="249" y="231">設計・実装・テスト</text>
<path class="flow" d="M396 227 H416"/>
<rect class="badge" x="418" y="215" width="204" height="24"/>
<path class="link" d="M426 219 h12 v16 h-12 z M429 224 h6 M429 230 l2 2 4 -4"/>
<text class="note" x="448" y="231">要件・設計と照合しレビュー</text>
