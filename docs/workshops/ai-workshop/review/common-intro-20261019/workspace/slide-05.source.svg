<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="レビューの目的は、変更後も業務上必要な条件を満たすか確かめること。左はAIの指摘を中心に確認し、指摘なしからレビューを承認した場面。右は目的から守る業務条件を決め、該当する実装とテスト結果を照合する場面。承認済みとはどの業務の判断が済んだ状態か、次の教材への問いを示す。">
<rect class="badge" x="6" y="4" width="544" height="37"/>
<text class="note" x="20" y="19">レビューの目的</text>
<text class="title" x="20" y="34">変更後も、業務上必要な条件を満たすか確かめる</text>
<rect class="field" x="6" y="53" width="262" height="126"/>
<text class="title" x="20" y="74">今行っていた確認</text>
<rect class="badge" x="18" y="85" width="238" height="47"/>
<path class="link" d="M30 96 h16 v24 h-16 z M34 102 h8 M34 108 h8 M34 114 h6"/>
<text class="note" x="59" y="102">AIレビュー結果</text>
<text class="label" x="59" y="122">指摘なし</text>
<path class="flow" d="M137 134 V147"/>
<rect class="badge" x="18" y="149" width="238" height="22"/>
<g transform="translate(35 160) scale(.3)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="57" y="165">指摘確認を中心にレビュー承認</text>
<rect class="field" x="288" y="53" width="262" height="126"/>
<text class="title" x="302" y="74">目的から考えた確認</text>
<rect class="box focus" x="300" y="85" width="238" height="47"/>
<path class="link" d="M312 96 h16 v24 h-16 z M316 102 h8 M316 108 h8 M316 114 h6"/>
<text class="note" x="341" y="102">守る業務条件</text>
<text class="label" x="341" y="122">「承認済みを維持」など</text>
<text class="note" x="419" y="145" text-anchor="middle">条件との対応を確認</text>
<path class="flow" d="M358 134 V147"/>
<path class="flow" d="M480 134 V147"/>
<rect class="badge" x="300" y="149" width="116" height="22"/>
<path class="link" d="M315 156 l-4 4 4 4 M327 156 l4 4 -4 4"/>
<text class="label" x="345" y="165">実装</text>
<rect class="badge" x="430" y="149" width="108" height="22"/>
<path class="link" d="M439 155 l4 5 8 -10"/>
<text class="label" x="460" y="165">テスト結果</text>
<rect class="badge" x="6" y="192" width="544" height="22"/>
<text class="label" x="278" y="207" text-anchor="middle">「承認済み」とは、どの業務の判断が済んだ状態？</text>
</svg>