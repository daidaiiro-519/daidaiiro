<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="承認後の変更制限は仕様書と既存コードにあった。資料も確認した開発者とレビュー担当者が、それぞれAIを使う作業を、目的、言葉の意味、AIでの確認方法から振り返る">
<rect class="field" x="6" y="5" width="182" height="173"/>
<text class="title" x="20" y="28">仕様とコードは存在</text>
<rect class="badge" x="20" y="42" width="154" height="66"/>
<text class="label" x="32" y="61">仕様書</text>
<text class="note" x="32" y="81">承認済みの申請は</text>
<text class="note" x="32" y="98">申請者が直接変更不可</text>
<rect class="badge" x="20" y="120" width="154" height="46"/>
<path class="link" d="M37 133 l-7 7 7 7 M48 133 l7 7 -7 7"/>
<text class="label" x="68" y="138">既存コード</text>
<text class="note" x="32" y="158">変更制限の処理がある</text>
<path class="flow" d="M190 92 H219"/>
<rect class="field" x="222" y="5" width="328" height="173"/>
<text class="title" x="236" y="28">作業の前提と、確認の進め方を振り返る</text>
<g transform="translate(244 56) scale(.45)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="262" y="61">開発者</text>
<rect class="badge" x="307" y="43" width="32" height="24"/>
<text class="note" x="323" y="60" text-anchor="middle">AI</text>
<g transform="translate(371 56) scale(.45)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="389" y="61">レビュー担当者</text>
<rect class="badge" x="491" y="43" width="32" height="24"/>
<text class="note" x="507" y="60" text-anchor="middle">AI</text>
<rect class="badge" x="235" y="80" width="302" height="27"/>
<text class="label" x="247" y="99">何を達成するための作業と捉えたか</text>
<rect class="badge" x="235" y="112" width="302" height="27"/>
<text class="label" x="247" y="131">業務の言葉を、どう理解していたか</text>
<rect class="badge" x="235" y="144" width="302" height="27"/>
<text class="label" x="247" y="163">AIと人は、何を基準に確認したか</text>
<rect class="badge" x="6" y="187" width="544" height="27"/>
<text class="label" x="19" y="206">別の機能でも必要な条件を反映するには、何を見直すか</text>
</svg>
