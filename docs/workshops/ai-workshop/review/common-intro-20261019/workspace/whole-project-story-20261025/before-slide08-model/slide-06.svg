<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="教材1で定めた目的と確認した要件から、業務知識と既存仕様を照合して業務モデルを考え、設計へ反映する。目的は申請の修正と再提出。要件は目的金額を変えず証憑だけを修正し、上長承認は維持、経理は再確認。モデルでは経費申請、支出内容、証憑とそれぞれの判断の関係を表す。その関係と守る条件を、状態、処理や変更条件、テストとレビューへ反映する。"><defs data-dsvg="marker"><marker id="dsvg-efdad222-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
<rect class="field" x="6" y="4" width="170" height="208" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="18" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">教材1：目的・要件</text>
<path class="badge" d="M18 38 H150 L164 52 V102 H18 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M150 38 V52 H164" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="30" y="54" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">申請者の目的</text>
<text class="label" x="30" y="75" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">申請の不備を直し、</text>
<text class="label" x="30" y="93" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">再提出を完了する</text>
<path class="badge" d="M18 113 H150 L164 127 V199 H18 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M150 113 V127 H164" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="30" y="129" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">確かめた要件</text>
<text class="note" x="30" y="147" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">証憑だけを修正</text>
<text class="note" x="30" y="162" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">支出の目的・金額は維持</text>
<text class="note" x="30" y="177" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長承認は維持</text>
<text class="note" x="30" y="192" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理は再確認</text>
<path class="flow" d="M179 117 H202" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-efdad222-arrow-252b29)"/>

<rect class="field" x="206" y="4" width="250" height="208" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="218" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">業務モデルの例：対象と関係</text>
<text class="note" x="218" y="38" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">業務知識・既存仕様と照合</text>
<rect class="badge" x="218" y="48" width="226" height="25" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="331" y="65" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">経費申請</text>
<path class="link" d="M331 74 V82 M270 82 H392 M270 82 V89 M392 82 V89" fill="none" stroke="#252b29" stroke-width="1"/>
<rect class="badge" x="218" y="91" width="104" height="39" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="230" y="107" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">支出内容</text>
<text class="note" x="230" y="122" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">目的・金額</text>
<rect class="badge" x="340" y="91" width="104" height="39" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="352" y="107" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">証憑</text>
<text class="note" x="352" y="122" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">領収書など</text>
<path class="link" d="M270 131 V149 M392 131 V149" fill="none" stroke="#252b29" stroke-width="1"/>
<rect class="badge" x="218" y="151" width="104" height="32" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="230" y="172" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">上長の承認</text>
<rect class="badge" x="340" y="151" width="104" height="32" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="352" y="172" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">経理の確認</text>
<text class="note" x="218" y="202" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">判断が何に結びつき、いつ有効か</text>
<path class="flow" d="M459 117 H482" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-efdad222-arrow-252b29)"/>

<rect class="field focus" x="486" y="4" width="148" height="208" fill="#fffaf2" stroke="#ae3f23" stroke-width="2" rx="3"/>
<text class="title" x="498" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">設計へ反映</text>
<path class="badge" d="M498 39 H610 L622 51 V82 H498 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M610 39 V51 H622" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="510" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">状態の表し方</text>
<text class="note" x="510" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">有効な判断を区別</text>
<path class="badge" d="M498 97 H610 L622 109 V140 H498 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M610 97 V109 H622" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="510" y="115" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">処理・変更条件</text>
<text class="note" x="510" y="132" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">変更時の条件を守る</text>
<path class="badge" d="M498 155 H610 L622 167 V198 H498 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M610 155 V167 H622" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="510" y="173" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">テスト・レビュー</text>
<text class="note" x="510" y="190" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">業務ルールと照合</text>

<rect class="field" x="6" y="219" width="628" height="25" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="18" y="236" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">上長承認を維持するなら、承認した目的・金額と申請内容の一致を守る</text>
</svg>