<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="教材1で定めた目的と確認した要件から、業務知識と既存仕様を照合して業務モデルを考え、設計へ反映する。目的は申請の修正と再提出。要件は目的金額を変えず証憑だけを修正し、上長承認は維持、経理は再確認。モデルでは経費申請、支出内容、証憑とそれぞれの判断の関係を表す。その関係と守る条件を、状態、処理や変更条件、テストとレビューへ反映する。">
<rect class="field" x="6" y="4" width="170" height="208"/>
<text class="title" x="18" y="22">教材1：目的・要件</text>
<path class="badge" d="M18 38 H150 L164 52 V102 H18 Z"/>
<path class="link" d="M150 38 V52 H164"/>
<text class="note" x="30" y="54">申請者の目的</text>
<text class="label" x="30" y="75">申請の不備を直し、</text>
<text class="label" x="30" y="93">再提出を完了する</text>
<path class="badge" d="M18 113 H150 L164 127 V199 H18 Z"/>
<path class="link" d="M150 113 V127 H164"/>
<text class="note" x="30" y="129">確かめた要件</text>
<text class="note" x="30" y="147">証憑だけを修正</text>
<text class="note" x="30" y="162">支出の目的・金額は維持</text>
<text class="note" x="30" y="177">上長承認は維持</text>
<text class="note" x="30" y="192">経理は再確認</text>
<path class="flow" d="M179 117 H202"/>

<rect class="field" x="206" y="4" width="250" height="208"/>
<text class="title" x="218" y="22">業務モデルの例：対象と関係</text>
<text class="note" x="218" y="38">業務知識・既存仕様と照合</text>
<rect class="badge" x="218" y="48" width="226" height="25"/>
<text class="label" x="331" y="65" text-anchor="middle">経費申請</text>
<path class="link" d="M331 74 V82 M270 82 H392 M270 82 V89 M392 82 V89"/>
<rect class="badge" x="218" y="91" width="104" height="39"/>
<text class="label" x="230" y="107">支出内容</text>
<text class="note" x="230" y="122">目的・金額</text>
<rect class="badge" x="340" y="91" width="104" height="39"/>
<text class="label" x="352" y="107">証憑</text>
<text class="note" x="352" y="122">領収書など</text>
<path class="link" d="M270 131 V149 M392 131 V149"/>
<rect class="badge" x="218" y="151" width="104" height="32"/>
<text class="label" x="230" y="172">上長の承認</text>
<rect class="badge" x="340" y="151" width="104" height="32"/>
<text class="label" x="352" y="172">経理の確認</text>
<text class="note" x="218" y="202">判断が何に結びつき、いつ有効か</text>
<path class="flow" d="M459 117 H482"/>

<rect class="field focus" x="486" y="4" width="148" height="208"/>
<text class="title" x="498" y="22">設計へ反映</text>
<path class="badge" d="M498 39 H610 L622 51 V82 H498 Z"/>
<path class="link" d="M610 39 V51 H622"/>
<text class="label" x="510" y="57">状態の表し方</text>
<text class="note" x="510" y="74">有効な判断を区別</text>
<path class="badge" d="M498 97 H610 L622 109 V140 H498 Z"/>
<path class="link" d="M610 97 V109 H622"/>
<text class="label" x="510" y="115">処理・変更条件</text>
<text class="note" x="510" y="132">変更時の条件を守る</text>
<path class="badge" d="M498 155 H610 L622 167 V198 H498 Z"/>
<path class="link" d="M610 155 V167 H622"/>
<text class="label" x="510" y="173">テスト・レビュー</text>
<text class="note" x="510" y="190">業務ルールと照合</text>

<rect class="field" x="6" y="219" width="628" height="25"/>
<text class="label" x="18" y="236">上長承認を維持するなら、承認した目的・金額と申請内容の一致を守る</text>
</svg>