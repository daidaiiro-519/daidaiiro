<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="設計では上長の支出承認と経理の証憑確認を一つの承認済み状態で扱い、何を維持し、何をやり直すか区別できない。証憑再提出の業務ルールを差し戻し・変更制限・再提出の各処理に個別追加したため、レビュー担当は三つの処理と対応するテストを読み合わせて全体の正しさを確かめる。">
<rect class="field" x="6" y="4" width="174" height="208"/>
<text class="title" x="18" y="22">設計に残った混同</text>
<rect class="badge" x="18" y="36" width="68" height="40"/>
<text class="label" x="30" y="52">上長</text>
<text class="note" x="30" y="68">支出承認</text>
<rect class="badge" x="100" y="36" width="68" height="40"/>
<text class="label" x="112" y="52">経理</text>
<text class="note" x="112" y="68">証憑確認</text>
<path class="link" d="M52 78 V84 H134 V78"/>
<path class="flow" d="M93 84 V106"/>
<rect class="badge" x="28" y="110" width="130" height="41"/>
<text class="title" x="52" y="128">承認済み</text>
<text class="note" x="52" y="145">一つの状態</text>
<rect class="badge" x="18" y="162" width="150" height="37"/>
<text class="note" x="28" y="177">何を維持し、何を</text>
<text class="note" x="28" y="191">やり直すか表せない</text>
<path class="flow" d="M183 117 H210"/>

<rect class="field" x="214" y="4" width="286" height="208"/>
<text class="title" x="226" y="22">各処理に条件を追加</text>
<path class="badge" d="M226 35 H380 L394 49 V83 H226 Z"/>
<path class="link" d="M380 35 V49 H394"/>
<text class="label" x="238" y="54">差し戻し</text>
<text class="note" x="238" y="72">上長承認を維持</text>
<path class="link" d="M397 59 H408"/>
<path class="badge" d="M412 39 H470 L480 49 V79 H412 Z"/>
<path class="link" d="M470 39 V49 H480 M426 52 l4 4 8 -9"/>
<text class="note" x="424" y="71">テスト</text>
<path class="badge" d="M226 94 H380 L394 108 V142 H226 Z"/>
<path class="link" d="M380 94 V108 H394"/>
<text class="label" x="238" y="113">変更制限</text>
<text class="note" x="238" y="131">証憑だけ編集できる</text>
<path class="link" d="M397 118 H408"/>
<path class="badge" d="M412 98 H470 L480 108 V138 H412 Z"/>
<path class="link" d="M470 98 V108 H480 M426 111 l4 4 8 -9"/>
<text class="note" x="424" y="130">テスト</text>
<path class="badge" d="M226 153 H380 L394 167 V201 H226 Z"/>
<path class="link" d="M380 153 V167 H394"/>
<text class="label" x="238" y="172">再提出</text>
<text class="note" x="238" y="190">経理確認を再開</text>
<path class="link" d="M397 177 H408"/>
<path class="badge" d="M412 157 H470 L480 167 V197 H412 Z"/>
<path class="link" d="M470 157 V167 H480 M426 170 l4 4 8 -9"/>
<text class="note" x="424" y="189">テスト</text>
<path class="link" d="M482 59 H515 M482 118 H515 M482 177 H515 M515 59 V177"/>
<path class="flow" d="M515 118 H531"/>
<rect class="field focus" x="534" y="4" width="100" height="208"/>
<text class="title" x="544" y="22">全体を確認</text>
<circle class="badge" cx="580" cy="53" r="10"/>
<path class="link" d="M558 94 V85 C558 66 602 66 602 85 V94"/>
<rect class="badge" x="581" y="77" width="28" height="34"/>
<path class="link" d="M588 88 l4 4 9 -10 M588 99 H601"/>
<text class="label" x="545" y="133">3つの処理と</text>
<text class="label" x="545" y="152">各テストを</text>
<text class="label" x="545" y="171">読み合わせる</text>

<rect class="field" x="6" y="219" width="628" height="25"/>
<text class="label" x="18" y="236">守る業務ルール：上長承認は維持し、経理確認だけをやり直す</text>
</svg>