<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="設計では上長の支出承認と経理の証憑確認を一つの承認済み状態で扱い、何を維持し、何をやり直すか区別できない。証憑再提出の業務ルールを差し戻し・変更制限・再提出の各処理に個別追加したため、レビュー担当は三つの処理と対応するテストを読み合わせて全体の正しさを確かめる。"><defs data-dsvg="marker"><marker id="dsvg-0fef218e-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
