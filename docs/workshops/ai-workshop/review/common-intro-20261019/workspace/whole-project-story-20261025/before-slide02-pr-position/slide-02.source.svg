<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="赤茶の外枠は短時間で進んだ範囲を示し、実装とテストからAIと人のレビュー、レビュー承認までを囲む。その後の結合テストは別の工程として下段に配置。仕様書と既存コードを確認し、承認後は変更不可という条件をAIに伝える。開発者とAIでコード、単体テスト、変更説明を作成し、テストを通過。AIは指摘なし、人は業務ルールを理解しているが、変更差分とAIの説明、テスト結果を手掛かりに確認し、短時間でレビュー承認まで進む。その後、変更を取り込み、結合テストで業務の流れを確かめる。">
