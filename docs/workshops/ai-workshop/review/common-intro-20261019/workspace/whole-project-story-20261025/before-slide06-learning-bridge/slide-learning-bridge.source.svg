<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="PMとPLが同じ経費精算刷新案件の要件、変更内容、テストとレビューの結果を入力し、AgentがSkillsを使用して整理する。出力イメージは変更の影響、確認済みの根拠、未確認事項。根拠のない推測で完了扱いせず、人が情報を確かめて残作業と完了見通しを判断する。">
<rect class="field" x="6" y="4" width="160" height="198"/>
<text class="title" x="18" y="24">PM・PLが入力</text>
<path class="badge" d="M18 42 H142 L154 54 V82 H18 Z"/>
<path class="link" d="M142 42 V54 H154"/>
<text class="label" x="30" y="59">要件・業務ルール</text>
<text class="note" x="30" y="75">承認段階・再提出条件</text>
<path class="badge" d="M18 92 H142 L154 104 V132 H18 Z"/>
<path class="link" d="M142 92 V104 H154"/>
<text class="label" x="30" y="109">変更内容</text>
<text class="note" x="30" y="125">差し戻し・再提出</text>
<path class="badge" d="M18 142 H142 L154 154 V192 H18 Z"/>
<path class="link" d="M142 142 V154 H154"/>
<text class="label" x="30" y="161">確認結果</text>
<text class="note" x="30" y="180">テスト・レビューの記録</text>
<path class="flow" d="M169 62 H192"/>

<rect class="field" x="196" y="4" width="136" height="198"/>
<text class="title" x="208" y="24">Agent</text>
<path class="link" d="M208 38 H230 V56 H208 Z M219 38 V33 M213 43 V47 M225 43 V47 M213 51 H225"/>
<text class="label" x="244" y="51">照合・整理</text>
<path class="flow" d="M264 63 V99"/>
<text class="note" x="274" y="85">使用</text>
<path class="badge" d="M208 103 H308 L320 115 V190 H208 Z"/>
<path class="link" d="M308 103 V115 H320"/>
<g transform="translate(220 111)"><path class="link" d="M3 0 H14 V13 H3 Z M0 3 V16 H11 M6 4 H11 M6 8 H11"/></g>
<text class="label" x="242" y="125">Skills</text>
<text class="note" x="220" y="145">根拠を対応付ける</text>
<text class="note" x="220" y="161">未確認を明示</text>
<text class="note" x="220" y="177">推測を事実にしない</text>
<path class="flow" d="M335 62 H358"/>

<rect class="field focus" x="362" y="4" width="272" height="198"/>
<text class="title" x="374" y="24">変更の影響と確認状況</text>
<text class="note" x="534" y="24">出力イメージ</text>
<rect class="badge" x="374" y="42" width="248" height="42"/>
<text class="label" x="386" y="59">変更の影響</text>
<text class="note" x="386" y="76">差し戻し・変更制限・再提出（設計を参照）</text>
<rect class="badge" x="374" y="93" width="248" height="42"/>
<text class="label" x="386" y="110">確認済みの根拠</text>
<text class="note" x="386" y="127">上長承認後の変更禁止：再テスト結果</text>
<rect class="badge" x="374" y="144" width="248" height="48"/>
<text class="label" x="386" y="161">未確認事項</text>
<text class="note" x="386" y="177">再提出の確認記録が見つからない場合</text>
<text class="note" x="386" y="189">未確認として残し、担当者に確認</text>
<path class="flow" d="M498 204 V221"/>

<rect class="field" x="6" y="225" width="628" height="22"/>
<g transform="translate(24 237)"><path class="link" d="M3 -5 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M-6 6 V4 C-6 -2 6 -2 6 4 V6"/></g>
<text class="label" x="39" y="240">PM・PLが根拠を確認し、残作業と完了見通しを判断</text>
</svg>
