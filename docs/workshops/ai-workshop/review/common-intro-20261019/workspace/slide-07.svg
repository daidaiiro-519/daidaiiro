<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="承認後は変更不可という短い説明を、申請者が承認済み申請データを直接変更できない条件として明確にする。承認の段階、対象項目や例外の範囲は既存資料やコードや業務を知る人に確かめる"><defs data-dsvg="marker"><marker id="dsvg-812968da-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
