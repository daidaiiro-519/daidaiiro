<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="証憑再提出の業務フローでは、上長の支出承認は維持し、経理の証憑確認だけをやり直す。現行設計はこの二つの判断を一つの承認済み状態で扱う。そのため差し戻し・変更制限・再提出の各処理に個別条件が分かれ、それぞれのテストも照合する。">
<rect class="field" x="6" y="4" width="628" height="104"/>
<text class="title" x="18" y="19">証憑を再提出するときの業務の流れ</text>
<rect class="badge" x="170" y="25" width="132" height="18"/>
<text class="note" x="181" y="38">1 差し戻し</text>
<path class="flow" d="M305 34 H321"/>
<rect class="badge" x="326" y="25" width="132" height="18"/>
<text class="note" x="337" y="38">2 証憑だけ修正</text>
<path class="flow" d="M461 34 H477"/>
<rect class="badge" x="482" y="25" width="140" height="18"/>
<text class="note" x="493" y="38">3 経理が再確認</text>
<text class="note" x="18" y="61">上長承認</text>
<rect class="badge" x="170" y="47" width="132" height="22"/>
<text class="label" x="181" y="62">承認済み</text>
<rect class="badge" x="326" y="47" width="132" height="22"/>
<text class="label" x="337" y="62">維持</text>
<rect class="badge" x="482" y="47" width="140" height="22"/>
<text class="label" x="493" y="62">維持</text>
<text class="note" x="18" y="89">経理確認</text>
<rect class="badge" x="170" y="75" width="132" height="22"/>
<text class="label" x="181" y="90">差し戻し</text>
<rect class="badge" x="326" y="75" width="132" height="22"/>
<text class="label" x="337" y="90">証憑を修正</text>
<rect class="badge" x="482" y="75" width="140" height="22"/>
<text class="label" x="493" y="90">再確認中</text>

<path class="flow" d="M552 99 V113 H320 V118"/>
<rect class="field" x="6" y="116" width="628" height="34"/>
<text class="note" x="18" y="137">現行設計</text>
<rect class="box focus" x="126" y="121" width="132" height="24"/>
<text class="label" x="140" y="137">承認済み</text>
<text class="note" x="277" y="137">上長承認と経理確認を、1つの状態で扱う</text>

<rect class="field" x="6" y="157" width="628" height="55"/>
<text class="label" x="18" y="172">二つの判断を保つため、各処理に条件を追加</text>
<rect class="badge" x="18" y="178" width="190" height="27"/>
<text class="note" x="30" y="190">変更制限</text>
<text class="note" x="30" y="201">証憑だけ編集できる</text>
<path class="flow" d="M210 191 H222"/>
<rect class="badge" x="226" y="178" width="190" height="27"/>
<text class="note" x="238" y="190">差し戻し</text>
<text class="note" x="238" y="201">上長承認を維持</text>
<path class="flow" d="M418 191 H430"/>
<rect class="badge" x="434" y="178" width="188" height="27"/>
<text class="note" x="446" y="190">再提出</text>
<text class="note" x="446" y="201">経理確認をやり直す</text>

<path class="flow" d="M320 212 V218"/>
<rect class="field" x="6" y="220" width="628" height="24"/>
<text class="label" x="18" y="236">変更のたびに、3処理とそれぞれのテストを照合</text>
</svg>
