<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="三つの教材で目的、意味と範囲、実行と改善を学び、自分の担当業務でAIを使った結果をチームが確認して仕事全体の改善につなげる">
<rect class="badge" x="6" y="3" width="164" height="43"/>
<text class="note" x="18" y="19">教材1</text><text class="title" x="18" y="37">目的を捉える</text>
<path class="flow" d="M170 25 H194"/>
<rect class="badge" x="196" y="3" width="164" height="43"/>
<text class="note" x="208" y="19">教材2</text><text class="title" x="208" y="37">意味と範囲を明確にする</text>
<path class="flow" d="M360 25 H384"/>
<rect class="badge" x="386" y="3" width="164" height="43"/>
<text class="note" x="398" y="19">教材3</text><text class="title" x="398" y="37">実行して改善する</text>
<rect class="field" x="6" y="69" width="146" height="110"/>
<text class="title" x="18" y="91">自分の担当業務で使う</text>
<rect class="badge" x="18" y="103" width="122" height="61"/>
<text class="label" x="30" y="123">実装・検証</text><text class="label" x="30" y="140">レビュー</text><text class="label" x="30" y="157">進捗・残作業の把握</text>
<path class="flow" d="M152 124 H178"/>
<rect class="box" x="180" y="69" width="198" height="110"/>
<text class="title" x="192" y="91">チームが確認できる結果へ</text>
<rect class="badge" x="192" y="103" width="174" height="27"/>
<text class="label" x="279" y="122" text-anchor="middle">適用した条件と確認の根拠</text>
<path class="flow" d="M241 130 V141"/><path class="flow" d="M334 130 V141"/>
<rect class="badge" x="192" y="143" width="99" height="25"/><text class="note" x="241" y="160" text-anchor="middle">業務・レビュー</text>
<rect class="badge" x="303" y="143" width="63" height="25"/><text class="note" x="334" y="160" text-anchor="middle">PM・PL</text>
<path class="flow" d="M378 124 H404"/>
<rect class="field" x="406" y="69" width="144" height="110"/>
<text class="title" x="418" y="91">仕事全体の改善</text>
<text class="label" x="418" y="119">必要な品質を満たす</text>
<text class="label" x="418" y="140">根拠を探しやすく</text>
<text class="label" x="418" y="161">手戻りを減らす</text>
<rect class="badge" x="6" y="190" width="544" height="25"/>
<text class="label" x="278" y="207" text-anchor="middle">AIで作る速さを、必要な品質とチームの確認・判断につなげる</text>
</svg>