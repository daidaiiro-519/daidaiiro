<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="AgentsがSkillsを使用しながら、要件定義、設計、実装、テストの工程で作業を進める。Skillsは目的や要件の確認、業務モデルと設計の検討、変更の影響の確認に使う判断の観点と手順。各工程でレビューし、人も根拠と結果を確認して手順を改善する。">
<rect class="field" x="6" y="4" width="284" height="129"/>
<path class="link" d="M20 17 H34 L40 23 V39 H20 Z M34 17 V23 H40 M24 28 H36 M24 33 H36"/>
<text class="title" x="50" y="27">Skills：判断の観点と手順</text>
<path class="badge" d="M20 48 H268 V71 H20 Z"/>
<text class="label" x="32" y="64">目的・要件を確かめる</text>
<path class="badge" d="M20 76 H268 V99 H20 Z"/>
<text class="label" x="32" y="92">業務モデルと設計の整合を検討する</text>
<text class="note" x="20" y="119">既存仕様との照合・変更の影響の確認など</text>
<path class="flow" d="M348 75 H295"/>
<text class="label" x="322" y="61" text-anchor="middle">使用</text>

<rect class="field focus" x="352" y="4" width="282" height="129"/>
<path class="link" d="M370 18 H392 V36 H370 Z M381 18 V13 M375 23 V27 M387 23 V27 M375 31 H387"/>
<text class="title" x="404" y="29">Agents</text>
<text class="label" x="370" y="60">工程に応じてSkillsを使い、</text>
<text class="label" x="370" y="81">目的・業務モデルに沿って作業</text>
<text class="note" x="370" y="116">判断の理由と確認結果を示す</text>
<path class="flow" d="M493 135 V150"/>

<rect class="field" x="6" y="154" width="628" height="51"/>
<text class="title" x="18" y="184">開発の工程</text>
<rect class="badge" x="112" y="165" width="106" height="29"/>
<text class="label" x="165" y="184" text-anchor="middle">要件定義</text>
<path class="flow" d="M221 180 H244"/>
<rect class="badge" x="248" y="165" width="106" height="29"/>
<text class="label" x="301" y="184" text-anchor="middle">設計</text>
<path class="flow" d="M357 180 H380"/>
<rect class="badge" x="384" y="165" width="106" height="29"/>
<text class="label" x="437" y="184" text-anchor="middle">実装</text>
<path class="flow" d="M493 180 H516"/>
<rect class="badge" x="520" y="165" width="100" height="29"/>
<text class="label" x="570" y="184" text-anchor="middle">テスト</text>

<rect class="field" x="6" y="217" width="628" height="27"/>
<g transform="translate(24 231)"><path class="link" d="M3 -5 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M-6 6 V4 C-6 -2 6 -2 6 4 V6"/></g>
<text class="label" x="39" y="235">各工程でレビュー。人も根拠と結果を確かめ、設計・成果物・Skillsを改善</text>
</svg>
