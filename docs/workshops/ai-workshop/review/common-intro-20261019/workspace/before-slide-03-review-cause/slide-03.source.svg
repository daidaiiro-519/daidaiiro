<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="開発者とAIによる実装と単体テスト、AIレビュー、人によるPRレビューを経て、結合テストへ進む。下書きの金額変更と保存を確認し、作成した単体テストは通過している">
<rect class="field" x="6" y="5" width="194" height="168"/>
<text class="title" x="19" y="28">実装・単体テスト</text>
<rect class="badge" x="23" y="42" width="62" height="54"/>
<rect class="badge" x="29" y="48" width="62" height="54"/>
<path class="link" d="M47 62 l-8 8 8 8 M67 62 l8 8 -8 8 M42 88 h35"/>
<text class="label" x="104" y="64">開発者＋AI</text>
<text class="note" x="104" y="83">コードと</text>
<text class="note" x="104" y="98">テストを作成</text>
<rect class="badge" x="18" y="111" width="170" height="40"/>
<text class="note" x="30" y="128">下書きの金額を変更</text>
<text class="note" x="30" y="143">保存した値を確認</text>
<text class="note" x="18" y="166">作成したテストは通過</text>
<path class="flow" d="M202 88 H225"/>
<rect class="field" x="228" y="5" width="196" height="168"/>
<text class="title" x="242" y="28">AIと人によるレビュー</text>
<rect class="badge" x="240" y="42" width="172" height="48"/>
<rect class="badge" x="250" y="51" width="32" height="27"/>
<text class="label" x="266" y="70" text-anchor="middle">AI</text>
<text class="label" x="294" y="62">AIレビュー</text>
<text class="note" x="294" y="80">実装・テストを確認</text>
<path class="flow" d="M326 92 V107"/>
<rect class="badge" x="240" y="109" width="172" height="53"/>
<g transform="translate(264 134) scale(.45)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="289" y="130">人のPRレビュー</text>
<text class="note" x="289" y="149">変更内容を確認</text>
<path class="flow" d="M426 88 H447"/>
<rect class="field" x="450" y="5" width="100" height="168"/>
<text class="title" x="464" y="28">次の確認</text>
<rect class="box focus" x="460" y="43" width="80" height="111"/>
<path class="link" d="M479 62 h42 v22 h-42 z M489 84 v7 M477 91 h46"/>
<text class="label" x="500" y="111" text-anchor="middle">結合テスト</text>
<text class="note" x="500" y="130" text-anchor="middle">業務の流れで</text>
<text class="note" x="500" y="145" text-anchor="middle">動作を確認</text>
<rect class="badge" x="6" y="184" width="544" height="30"/>
<text class="label" x="19" y="204">開発者自身の確認と、AI・人のレビューを経て、結合テストへ</text>
</svg>
