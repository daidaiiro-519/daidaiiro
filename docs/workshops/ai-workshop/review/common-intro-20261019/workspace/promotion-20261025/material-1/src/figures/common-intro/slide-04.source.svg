<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上段は修正済みの動作。上長承認後の直接変更はできず、再テストと再レビューで確認した。下段は残った設計。上長の支出承認と経理の証憑確認を一つの承認済み状態にしており、設計を見直さず三つの処理へ条件を追加したため、全体の関係を各処理とテストから読み合わせる確認負担が残る。">
<rect class="field" x="6" y="4" width="628" height="42"/>
<text class="title" x="18" y="21">修正済みの動作</text>
<path class="link" d="M22 33 V29 a4 4 0 0 1 8 0 V33 M20 33 H32 V42 H20 Z"/>
<text class="label" x="47" y="38">上長承認後は直接変更できない</text>
<rect class="badge" x="370" y="12" width="252" height="26"/>
<path class="link" d="M394 25 a7 7 0 1 1 -14 0 a7 7 0 1 1 14 0 M383 25 L386 28 L391 22"/>
<text class="label" x="406" y="30">再テスト・再レビューで確認</text>

<rect class="field" x="6" y="62" width="174" height="146"/>
<text class="title" x="18" y="82">残った設計</text>
<rect class="badge" x="18" y="94" width="68" height="33"/>
<text class="label" x="30" y="108">上長</text>
<text class="note" x="30" y="121">支出承認</text>
<rect class="badge" x="100" y="94" width="68" height="33"/>
<text class="label" x="112" y="108">経理</text>
<text class="note" x="112" y="121">証憑確認</text>
<path class="link" d="M52 129 V135 H134 V129"/>
<path class="flow" d="M93 135 V153"/>
<rect class="badge" x="18" y="156" width="150" height="43"/>
<text class="label" x="93" y="174" text-anchor="middle">承認済み：一つの状態</text>
<text class="note" x="93" y="190" text-anchor="middle">二つの判断の違いを表せない</text>
<path class="flow" d="M183 137 H210"/>

<rect class="field" x="214" y="62" width="286" height="146"/>
<text class="title" x="226" y="82">設計を見直さず条件を追加</text>
<path class="badge" d="M226 94 H382 L394 106 V123 H226 Z"/>
<path class="link" d="M382 94 V106 H394"/>
<text class="label" x="238" y="106">差し戻し</text>
<text class="note" x="238" y="119">上長承認を維持</text>
<path class="link" d="M397 108 H408"/>
<path class="badge" d="M412 94 H470 L480 104 V123 H412 Z"/>
<path class="link" d="M470 94 V104 H480 M420 105 L423 108 L429 101"/>
<text class="note" x="440" y="114">テスト</text>
<path class="badge" d="M226 133 H382 L394 145 V162 H226 Z"/>
<path class="link" d="M382 133 V145 H394"/>
<text class="label" x="238" y="145">変更制限</text>
<text class="note" x="238" y="158">差し戻し後は証憑のみ編集</text>
<path class="link" d="M397 147 H408"/>
<path class="badge" d="M412 133 H470 L480 143 V162 H412 Z"/>
<path class="link" d="M470 133 V143 H480 M420 144 L423 147 L429 140"/>
<text class="note" x="440" y="153">テスト</text>
<path class="badge" d="M226 172 H382 L394 184 V201 H226 Z"/>
<path class="link" d="M382 172 V184 H394"/>
<text class="label" x="238" y="184">再提出</text>
<text class="note" x="238" y="197">経理確認を再開</text>
<path class="link" d="M397 186 H408"/>
<path class="badge" d="M412 172 H470 L480 182 V201 H412 Z"/>
<path class="link" d="M470 172 V182 H480 M420 183 L423 186 L429 179"/>
<text class="note" x="440" y="192">テスト</text>
<path class="link" d="M482 108 H515 M482 147 H515 M482 186 H515 M515 108 V186"/>
<path class="flow" d="M515 147 H531"/>

<rect class="field focus" x="534" y="62" width="100" height="146"/>
<text class="title" x="544" y="82">確認の負担</text>
<path class="link" d="M588 105 a8 8 0 1 1 -16 0 a8 8 0 1 1 16 0 M558 136 V128 C558 111 602 111 602 128 V136"/>
<rect class="badge" x="584" y="121" width="24" height="26"/>
<path class="link" d="M589 130 L593 134 L602 125 M589 141 H602"/>
<text class="label" x="545" y="165">処理とテストを</text>
<text class="label" x="545" y="182">読み合わせる</text>
<text class="note" x="544" y="198">全体の関係を照合</text>

<rect class="field" x="6" y="219" width="628" height="25"/>
<text class="label" x="18" y="236">証憑だけ修正する場合：上長承認は維持し、経理確認をやり直す</text>
</svg>
