<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="前のページの不具合は、上長承認後から変更を禁止する修正で解消。一方、上長の支出承認と経理の証憑確認を同じ承認済み状態で扱う設計は残った。その設計のまま差し戻しと再提出を追加し、複数の処理とテストを読み直す負担が増えた。">
<rect class="field" x="6" y="4" width="262" height="86"/>
<text class="title" x="20" y="25">修正した動作</text>
<rect class="badge" x="18" y="40" width="107" height="34"/>
<text class="label" x="71.5" y="61" text-anchor="middle">上長承認後</text>
<path class="flow" d="M127 57 H143"/>
<rect class="badge" x="145" y="40" width="111" height="34"/>
<path class="link" d="M158 55 v-4 a4 4 0 0 1 8 0 v4 M156 55 h12 v9 h-12 z"/>
<text class="label" x="178" y="61">変更不可</text>
<rect class="field" x="288" y="4" width="262" height="86"/>
<text class="title" x="302" y="25">そのまま残った設計</text>
<rect class="badge" x="300" y="35" width="110" height="21"/>
<text class="note" x="355" y="50" text-anchor="middle">上長：支出承認</text>
<rect class="badge" x="426" y="35" width="112" height="21"/>
<text class="note" x="482" y="50" text-anchor="middle">経理：証憑確認</text>
<path class="link" d="M355 56 V61 H482 V56 M419 61 V66"/>
<rect class="badge" x="300" y="66" width="238" height="18"/>
<text class="note" x="419" y="79" text-anchor="middle">同じ「承認済み」で扱う</text>
<path class="flow" d="M419 91 V102"/>
<rect class="field" x="6" y="104" width="544" height="64"/>
<text class="title" x="20" y="120">その設計のまま、差し戻し・再提出を追加</text>
<text class="note" x="20" y="137">証憑だけ再提出：上長承認は維持／経理の確認はやり直す</text>
<rect class="badge" x="18" y="143" width="156" height="20"/>
<path class="link" d="M26 147 h9 v14 h-9 z M28 151 h5 M28 155 h5"/>
<text class="note" x="43" y="158">変更制限：修正済み</text>
<rect class="badge" x="200" y="143" width="156" height="20"/>
<path class="link" d="M208 147 h9 v14 h-9 z M210 151 h5 M210 155 h5"/>
<text class="note" x="225" y="158">差し戻し：例外を追加</text>
<rect class="badge" x="382" y="143" width="156" height="20"/>
<path class="link" d="M390 147 h9 v14 h-9 z M392 151 h5 M392 155 h5"/>
<text class="note" x="407" y="158">再提出：条件を追加</text>
<path class="flow" d="M278 169 V181"/>
<rect class="box focus" x="6" y="183" width="544" height="31"/>
<path class="link" d="M28 186 h13 v19 h-13 z M24 189 h13 v19 h-13 z M20 192 h13 v19 h-13 z M23 198 h7 M23 202 h7"/>
<g transform="translate(55 198) scale(.3)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="78" y="197">追加のたび、複数の処理とテストを読み直す</text>
<text class="note" x="78" y="210">変更の影響を確かめるレビューに時間がかかる</text>
</svg>