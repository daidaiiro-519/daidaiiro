<text class="title" x="241" y="73" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">承認済み</text>
<text class="title" x="391" y="66" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">≠</text>
