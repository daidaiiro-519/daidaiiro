<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長の支出承認と経理の証憑確認という二つの判断を、設計では一つの承認済み状態で扱う。証憑再提出の条件を変更制限・差し戻し・再提出の三処理に個別に加え、それぞれの処理とテストを確認する。">
<text class="title" x="18" y="20">設計で2つの判断を一つにまとめる</text>
<rect class="badge" x="18" y="31" width="158" height="25"/>
<g transform="translate(32 43) scale(.16)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="48" y="48">上長の支出承認</text>
<rect class="badge" x="18" y="64" width="158" height="25"/>
<g transform="translate(32 76) scale(.16)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="label" x="48" y="81">経理の証憑確認</text>
<path class="link" d="M176 43 H193 V60 M176 76 H193 V60"/>
<path class="flow" d="M193 60 H220"/>
<rect class="box focus" x="225" y="34" width="156" height="52"/>
<text class="note" x="241" y="50">設計にある状態</text>
<text class="title" x="241" y="73">承認済み</text>
<text class="title" x="391" y="66">≠</text>
<rect class="field" x="407" y="28" width="217" height="66"/>
<text class="note" x="420" y="44">再提出で必要な扱い</text>
<text class="label" x="420" y="63">上長承認は維持</text>
<text class="label" x="420" y="82">経理確認はやり直す</text>

<path class="flow" d="M303 89 V111"/>
<text class="label" x="18" y="126">設計で分けていない業務条件を、3つの処理で個別に補う</text>
<rect class="field" x="6" y="135" width="628" height="75"/>
<rect class="badge" x="18" y="145" width="190" height="47"/>
<text class="title" x="30" y="162">変更制限</text>
<text class="note" x="30" y="181">証憑だけ編集できる</text>

<rect class="badge" x="226" y="145" width="190" height="47"/>
<text class="title" x="238" y="162">差し戻し</text>
<text class="note" x="238" y="181">上長承認を維持</text>

<rect class="badge" x="434" y="145" width="188" height="47"/>
<text class="title" x="446" y="162">再提出</text>
<text class="note" x="446" y="181">経理確認を再開</text>

<path class="flow" d="M320 212 V215"/>
<rect class="field" x="6" y="216" width="628" height="28"/>
<g transform="translate(28 230) scale(.16)"><path class="link" d="M-15 -22 h30 v42 h-30 z M-9 -12 h18 M-9 -4 h18 M-9 4 h13"/></g>
<text class="label" x="52" y="234">変更時は、3つの処理と各テストを確認</text>
</svg>
