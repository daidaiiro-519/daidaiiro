<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長承認と経理の証憑確認を一つの承認済み状態で扱う設計では、証憑を再提出するとき、状態を維持すると経理確認が再開せず、状態を戻すと上長承認まで未完了になる。この違いを個別条件で補うため、差し戻し・変更制限・再提出の各処理と、それぞれのテストを確認する。"><defs data-dsvg="marker"><marker id="dsvg-f2163b2b-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
