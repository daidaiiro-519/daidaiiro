<text class="note" x="197" y="65" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">1つの状態</text>

<rect class="field" x="326" y="4" width="308" height="79" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
