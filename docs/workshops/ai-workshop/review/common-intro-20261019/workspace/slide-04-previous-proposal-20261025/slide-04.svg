<text class="note" x="339" y="117" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">状態を戻す → 上長承認まで未完了</text>

<rect class="field" x="6" y="128" width="628" height="66" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
