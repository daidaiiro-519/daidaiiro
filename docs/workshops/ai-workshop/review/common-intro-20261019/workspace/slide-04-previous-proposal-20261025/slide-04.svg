<text class="note" x="238" y="176" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">証憑だけ編集できる</text>
<text class="note" x="238" y="187" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">個別条件を追加</text>
<path class="flow" d="M418 169 H430" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-f2163b2b-arrow-252b29)"/>
<rect class="badge" x="434" y="148" width="188" height="44" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="446" y="163" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">再提出処理</text>
