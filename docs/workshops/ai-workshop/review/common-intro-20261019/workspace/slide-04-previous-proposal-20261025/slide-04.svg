<rect class="badge" x="18" y="53" width="132" height="19" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<g transform="translate(28 62) scale(.15)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6" fill="none" stroke="#252b29" stroke-width="1"/></g>
<text class="note" x="40" y="66" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理：証憑確認</text>
