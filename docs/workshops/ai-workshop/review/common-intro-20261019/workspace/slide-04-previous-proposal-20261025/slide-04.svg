<text class="note" x="365" y="45" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長承認</text>
<text class="label" x="365" y="63" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">維持</text>
<rect class="badge" x="488" y="31" width="132" height="41" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M499 37 a7 7 0 1 1 -1 11 M498 48 h5 M498 48 v-5" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="513" y="45" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理確認</text>
<text class="label" x="513" y="63" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">やり直す</text>

<rect class="field" x="6" y="86" width="628" height="38" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
