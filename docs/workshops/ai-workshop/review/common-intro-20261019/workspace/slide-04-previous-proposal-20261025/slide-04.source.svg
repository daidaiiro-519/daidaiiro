<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="上長承認と経理の証憑確認を一つの承認済み状態で扱う設計では、証憑を再提出するとき、状態を維持すると経理確認が再開せず、状態を戻すと上長承認まで未完了になる。この違いを個別条件で補うため、差し戻し・変更制限・再提出の各処理と、それぞれのテストを確認する。">
<rect class="field" x="6" y="4" width="308" height="79"/>
<text class="title" x="18" y="21">現行設計：2つの判断を1つにまとめる</text>
<rect class="badge" x="18" y="29" width="132" height="19"/>
<g transform="translate(28 38) scale(.15)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="40" y="42">上長：支出承認</text>
<rect class="badge" x="18" y="53" width="132" height="19"/>
<g transform="translate(28 62) scale(.15)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="40" y="66">経理：証憑確認</text>
<path class="link" d="M150 38 H165 V51 M150 62 H165 V51"/>
<path class="flow" d="M165 51 H179"/>
<rect class="box focus" x="183" y="31" width="119" height="41"/>
<text class="title" x="197" y="49">承認済み</text>
<text class="note" x="197" y="65">1つの状態</text>

<rect class="field" x="326" y="4" width="308" height="79"/>
<text class="title" x="338" y="21">証憑再提出後に必要な状態</text>
<rect class="badge" x="340" y="31" width="132" height="41"/>
<path class="link" d="M351 42 l3 3 6 -7"/>
<text class="note" x="365" y="45">上長承認</text>
<text class="label" x="365" y="63">維持</text>
<rect class="badge" x="488" y="31" width="132" height="41"/>
<path class="link" d="M499 37 a7 7 0 1 1 -1 11 M498 48 h5 M498 48 v-5"/>
<text class="note" x="513" y="45">経理確認</text>
<text class="label" x="513" y="63">やり直す</text>

<rect class="field" x="6" y="86" width="628" height="38"/>
<text class="label" x="18" y="100">一つの状態を維持しても、戻しても、必要な二つの扱いにならない</text>
<rect class="badge" x="18" y="105" width="294" height="16"/>
<text class="note" x="29" y="117">維持 → 経理確認が再開しない</text>
<rect class="badge" x="328" y="105" width="294" height="16"/>
<text class="note" x="339" y="117">状態を戻す → 上長承認まで未完了</text>

<rect class="field" x="6" y="128" width="628" height="66"/>
<text class="label" x="18" y="142">二つの扱いを保つため、処理ごとに条件を追加</text>
<rect class="badge" x="18" y="148" width="190" height="44"/>
<text class="label" x="30" y="163">差し戻し処理</text>
<text class="note" x="30" y="176">上長承認は維持</text>
<text class="note" x="30" y="187">個別条件を追加</text>
<path class="flow" d="M210 169 H222"/>
<rect class="badge" x="226" y="148" width="190" height="44"/>
<text class="label" x="238" y="163">変更制限</text>
<text class="note" x="238" y="176">証憑だけ編集できる</text>
<text class="note" x="238" y="187">個別条件を追加</text>
<path class="flow" d="M418 169 H430"/>
<rect class="badge" x="434" y="148" width="188" height="44"/>
<text class="label" x="446" y="163">再提出処理</text>
<text class="note" x="446" y="176">経理確認を再開</text>
<text class="note" x="446" y="187">個別条件を追加</text>

<path class="flow" d="M320 194 V200"/>
<rect class="field" x="6" y="202" width="628" height="42"/>
<rect class="badge" x="18" y="210" width="13" height="16"/>
<rect class="badge" x="22" y="213" width="13" height="16"/>
<rect class="badge" x="26" y="216" width="13" height="16"/>
<path class="link" d="M29 220 h7 M29 225 h5"/>
<text class="label" x="78" y="219">確認箇所：3つの処理と、それぞれのテスト</text>
<text class="note" x="78" y="235">各条件が業務上の扱いと一致するか照合</text>
</svg>