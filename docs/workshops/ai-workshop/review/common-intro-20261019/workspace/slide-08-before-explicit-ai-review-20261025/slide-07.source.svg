<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="一つのAgentが、要件定義、設計、実装、テストの各工程に応じてSkillsを使用して開発を進める。上段に作業を進めるAgent、下段の各工程内に使用するSkillsを描く。工程ごとに別のAgentを配置しない。各工程でレビューし、人が根拠と結果を確認して改善する。">
<rect class="field focus" x="6" y="4" width="628" height="57"/>
<path class="link" d="M22 19 H44 V38 H22 Z M33 19 V13 M27 24 V28 M39 24 V28 M27 33 H39"/>
<text class="title" x="58" y="26">Agent：目的・業務モデルに沿って開発を進める</text>
<text class="note" x="58" y="47">作業を進めながら、工程に応じて必要なSkillsを使用</text>
<path class="link" d="M320 62 V72 M80 72 H560"/>
<path class="flow" d="M80 72 V83"/>
<rect class="field" x="6" y="86" width="148" height="120"/>
<text class="title" x="20" y="108">要件定義</text>
<path class="badge" d="M18 120 H126 L142 136 V193 H18 Z"/>
<path class="link" d="M126 120 V136 H142"/>
<text class="label" x="30" y="142">Skills</text>
<text class="note" x="30" y="165">目的・範囲を確認</text>
<text class="note" x="30" y="183">既存仕様と照合</text>
<path class="flow" d="M240 72 V83"/>
<rect class="field" x="166" y="86" width="148" height="120"/>
<text class="title" x="180" y="108">設計</text>
<path class="badge" d="M178 120 H286 L302 136 V193 H178 Z"/>
<path class="link" d="M286 120 V136 H302"/>
<text class="label" x="190" y="142">Skills</text>
<text class="note" x="190" y="165">業務モデルを反映</text>
<text class="note" x="190" y="183">変更の影響を検討</text>
<path class="flow" d="M400 72 V83"/>
<rect class="field" x="326" y="86" width="148" height="120"/>
<text class="title" x="340" y="108">実装</text>
<path class="badge" d="M338 120 H446 L462 136 V193 H338 Z"/>
<path class="link" d="M446 120 V136 H462"/>
<text class="label" x="350" y="142">Skills</text>
<text class="note" x="350" y="165">設計に沿って作成</text>
<text class="note" x="350" y="183">守る条件を実装</text>
<path class="flow" d="M560 72 V83"/>
<rect class="field" x="486" y="86" width="148" height="120"/>
<text class="title" x="500" y="108">テスト</text>
<path class="badge" d="M498 120 H606 L622 136 V193 H498 Z"/>
<path class="link" d="M606 120 V136 H622"/>
<text class="label" x="510" y="142">Skills</text>
<text class="note" x="510" y="165">要件からケース作成</text>
<text class="note" x="510" y="183">実行して結果を確認</text>
<rect class="field" x="6" y="217" width="628" height="27"/>
<g transform="translate(24 231)"><path class="link" d="M3 -5 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M-6 6 V4 C-6 -2 6 -2 6 4 V6"/></g>
<text class="label" x="39" y="235">各工程でレビューし、人も根拠と結果を確認。設計・成果物・Skillsを改善</text>
</svg>
