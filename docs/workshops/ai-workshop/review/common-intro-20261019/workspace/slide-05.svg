<path class="link" d="M22 135 h18 v26 h-18 z M26 141 h10 M26 147 h10 M26 153 h7" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="52" y="145" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">AIの指摘がないか</text>
<text class="note" x="52" y="168" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">指摘なし → レビュー承認</text>
