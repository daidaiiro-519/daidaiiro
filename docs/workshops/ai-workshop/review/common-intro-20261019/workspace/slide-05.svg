<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="申請者の目的の大きさを、経費精算全体と、一回の作業で達成する申請の修正・再提出に分けて示す。目的を満たす要件は既存仕様などで確認し、証憑だけの再提出では上長承認を維持し、経理が再確認する。要件から矢印で開発者の目的と作業へつなぎ、仕様確認、設計・実装・テスト、要件・設計と照合するレビューを示す。"><defs data-dsvg="marker"><marker id="dsvg-e5206f51-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
