<text class="label" x="328" y="141" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">守る業務条件</text>
<text class="note" x="328" y="157" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">「承認済みを維持」など</text>
<text class="note" x="328" y="173" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">条件と実装・テスト結果を照合</text>
