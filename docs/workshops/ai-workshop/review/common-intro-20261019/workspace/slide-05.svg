<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="レビューの目的は、変更後も業務上必要な条件を満たすか確かめること。左はAIの指摘を中心に確認し、指摘なしからレビューを承認した場面。右は目的から守る業務条件を決め、該当する実装とテスト結果を照合する場面。承認済みとはどの業務の判断が済んだ状態か、次の教材への問いを示す。"><defs data-dsvg="marker"><marker id="dsvg-a9435029-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
