<text class="label" x="67" y="137" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">差し戻された申請を修正し、</text>
<text class="label" x="67" y="154" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">再提出を完了する</text>
