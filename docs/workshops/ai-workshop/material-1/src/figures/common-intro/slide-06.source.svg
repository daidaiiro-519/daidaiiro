<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="事例で起きた三つの問題から三教材で学ぶ内容へつなぐ。要件の解釈のずれから目的と要件の明確化へ、残った設計の問題から業務のモデル化と設計へ、実装とレビューが同じ解釈で進んだ問題からAI活用の実践と改善へ進む。">
