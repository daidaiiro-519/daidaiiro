<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="教材1の目的と要件をもとに、経費申請に含まれる支出内容と証憑、それぞれに対する上長の承認と経理の確認を業務モデルに表す。業務知識と既存仕様で関係を確かめ、支出承認と証憑確認を区別する状態や、証憑を変更したら経理が再確認する処理などの設計へ反映する例。">
<rect class="field" x="6" y="4" width="146" height="208"/>
<text class="title" x="18" y="23">教材1：目的・要件</text>
<path class="badge" d="M18 39 H128 L140 51 V94 H18 Z"/>
<path class="link" d="M128 39 V51 H140"/>
<text class="note" x="30" y="55">差し戻し後の目的</text>
<text class="label" x="30" y="73">申請の不備を直し、</text>
<text class="label" x="30" y="89">再提出する</text>
<path class="badge" d="M18 106 H128 L140 118 V200 H18 Z"/>
<path class="link" d="M128 106 V118 H140"/>
<text class="note" x="30" y="122">確かめた要件</text>
<text class="note" x="30" y="143">支出目的・金額不変</text>
<text class="note" x="30" y="159">証憑だけを修正</text>
<text class="note" x="30" y="177">上長承認は維持</text>
<text class="note" x="30" y="193">経理は再確認</text>
<path class="flow" d="M155 117 H176"/>

<rect class="field focus" x="180" y="4" width="270" height="208"/>
<text class="title" x="192" y="23">業務モデル：対象と判断の関係</text>
<rect class="badge" x="192" y="42" width="246" height="30"/>
<path class="link" d="M204 47 H217 V66 H204 Z M207 53 H214 M207 58 H214"/>
<text class="label" x="230" y="62">経費申請</text>
<path class="link" d="M315 74 V81 M250 81 H380 M250 81 V87 M380 81 V87"/>
<rect class="badge" x="192" y="90" width="117" height="44"/>
<path class="link" d="M204 99 H216 V125 H204 Z M207 105 H213 M207 112 H213 M207 119 H213"/>
<text class="label" x="228" y="108">支出内容</text>
<text class="note" x="228" y="126">目的・金額</text>
<rect class="badge" x="321" y="90" width="117" height="44"/>
<path class="link" d="M333 99 H345 V125 L342 123 L339 125 L336 123 L333 125 Z M336 105 H342 M336 112 H342 M336 119 H342"/>
<text class="label" x="357" y="108">証憑</text>
<text class="note" x="357" y="126">領収書など</text>
<path class="flow" d="M250 166 V139"/>
<path class="flow" d="M380 166 V139"/>
<rect class="badge" x="192" y="170" width="117" height="30"/>
<path class="link" d="M212 178 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M203 192 V189 C203 182 215 182 215 189 V192"/>
<text class="label" x="228" y="189">上長の承認</text>
<rect class="badge" x="321" y="170" width="117" height="30"/>
<path class="link" d="M341 178 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M332 192 V189 C332 182 344 182 344 189 V192"/>
<text class="label" x="357" y="189">経理の確認</text>
<path class="flow" d="M453 117 H474"/>

<rect class="field" x="478" y="4" width="156" height="208"/>
<text class="title" x="490" y="23">設計に反映する例</text>
<rect class="badge" x="490" y="42" width="132" height="69"/>
<rect class="badge" x="502" y="52" width="7" height="10"/>
<rect class="badge" x="514" y="52" width="7" height="10"/>
<text class="label" x="532" y="62">状態</text>
<text class="label" x="502" y="83">支出承認と</text>
<text class="label" x="502" y="101">証憑確認を区別</text>
<rect class="badge" x="490" y="124" width="132" height="76"/>
<path class="link" d="M502 135 H516 V149 H502 Z M506 139 L504 142 L506 145 M512 139 L514 142 L512 145"/>
<text class="label" x="530" y="146">変更処理</text>
<text class="label" x="502" y="170">証憑変更時は</text>
<text class="label" x="502" y="190">経理が再確認</text>

<rect class="field" x="6" y="219" width="628" height="25"/>
<text class="label" x="18" y="236">何を変えると、どの判断を確かめ直すかを設計に表す</text>
</svg>
