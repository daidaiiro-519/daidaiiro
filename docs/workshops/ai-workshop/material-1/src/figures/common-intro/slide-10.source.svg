<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="三つの教材で目的、意味と範囲、実行と改善を学び、自分の担当業務でAIを使った結果をチームが確認して仕事全体の改善につなげる">
