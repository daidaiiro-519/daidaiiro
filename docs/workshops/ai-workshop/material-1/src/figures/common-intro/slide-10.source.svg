<text class="note" x="208" y="19">教材2</text><text class="title" x="208" y="37">意味と範囲を明確にする</text>
<path class="flow" d="M360 25 H384"/>
<rect class="badge" x="386" y="3" width="164" height="43"/>
<text class="note" x="398" y="19">教材3</text><text class="title" x="398" y="37">実行して改善する</text>
