<text class="label" x="279" y="122" text-anchor="middle">適用した条件と確認の根拠</text>
<path class="flow" d="M233 130 V141"/><path class="flow" d="M326 130 V141"/>
<rect class="badge" x="192" y="143" width="81" height="25"/><text class="note" x="232" y="160" text-anchor="middle">レビュー担当</text>
<rect class="badge" x="285" y="143" width="81" height="25"/><text class="note" x="325" y="160" text-anchor="middle">PM・PL</text>
<path class="flow" d="M378 124 H404"/>
<rect class="field" x="406" y="69" width="144" height="110"/>
<text class="title" x="418" y="91">仕事全体を改善する</text>
