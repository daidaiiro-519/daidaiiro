<rect class="badge" x="397" y="42" width="141" height="48" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="note" x="409" y="61" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">共通仕様・既存コード</text>
<text class="note" x="409" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">承認後は変更不可</text>
