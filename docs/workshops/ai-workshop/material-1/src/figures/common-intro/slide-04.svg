<text class="note" x="399" y="145" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">人が指摘を確認し、</text>
<text class="note" x="399" y="159" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">追加修正・再テストへ</text>
<rect class="badge" x="6" y="181" width="544" height="34" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="note" x="18" y="195" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">AIレビューを行っても、案件で必要な条件を確認できているとは限らない</text>
<text class="note" x="18" y="209" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">次は、多くの差分や説明から、重要な確認観点を探す負担を考える</text>
</svg>