<rect class="badge" x="208" y="60" width="126" height="54" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="note" x="226" y="78" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">コード・テスト</text>
<text class="note" x="226" y="94" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">説明・レビュー結果</text>
<text class="label" x="210" y="137" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">確認した条件と</text>
<text class="label" x="210" y="158" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">該当箇所が分かりにくい</text>
