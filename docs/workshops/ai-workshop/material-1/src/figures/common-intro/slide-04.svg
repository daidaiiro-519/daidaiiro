<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="開発者は同じ担当機能の仕様書をもとにAIで実装とレビューを行う。コードとテストとレビュー結果を含むPRを人が確認し、案件の前提と既存コードに照らしてAIとも再確認して変更制御の不足を発見する"><defs data-dsvg="marker"><marker id="dsvg-4ac5cf43-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="556.0" height="216.0" fill="#f4f1e8" rx="8"/>
