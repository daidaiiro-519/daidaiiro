<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="既存メンバーは担当機能の仕様とタスク説明に共通仕様の参照先と適用条件を加えてAIに伝える。新しい開発者は関連する共通仕様を参照する必要を知らなかった">
<rect class="field" x="6" y="5" width="258" height="167"/>
<text class="title" x="20" y="28">既存メンバー</text>
<rect class="badge" x="20" y="42" width="108" height="65"/>
<text class="label" x="74" y="67" text-anchor="middle">機能の仕様</text>
<text class="note" x="74" y="90" text-anchor="middle">タスクの説明</text>
<rect class="box" x="140" y="42" width="110" height="65"/>
<text class="note" x="195" y="61" text-anchor="middle">経験から補足</text>
<text class="note" x="195" y="80" text-anchor="middle">共通仕様の参照先</text>
<text class="note" x="195" y="97" text-anchor="middle">適用する条件</text>
<path class="flow" d="M195 107 V123 H74 V107 V123 H135 V136"/>
<rect class="badge" x="99" y="138" width="72" height="27"/>
<text class="title" x="135" y="158" text-anchor="middle">AI</text>
<rect class="field" x="292" y="5" width="258" height="167"/>
<text class="title" x="306" y="28">新しく参加した開発者</text>
<rect class="badge" x="306" y="42" width="108" height="65"/>
<text class="label" x="360" y="67" text-anchor="middle">機能の仕様</text>
<text class="note" x="360" y="90" text-anchor="middle">タスクの説明</text>
<rect class="boundary" x="426" y="42" width="110" height="65"/>
<text class="title" x="481" y="62" text-anchor="middle">？</text>
<text class="note" x="481" y="80" text-anchor="middle">関連する共通仕様に</text>
<text class="note" x="481" y="97" text-anchor="middle">気づいていない</text>
<path class="flow" d="M360 107 V123 H421 V136"/>
<rect class="badge" x="385" y="138" width="72" height="27"/>
<text class="title" x="421" y="158" text-anchor="middle">AI</text>
<rect class="badge" x="6" y="183" width="544" height="32"/>
<text class="note" x="18" y="197">仕様はあるが、今回の作業とAIレビューで参照する範囲から抜けている</text>
<text class="note" x="18" y="210">新しい開発者には、何を補えばよいか分からない場合がある</text>
</svg>