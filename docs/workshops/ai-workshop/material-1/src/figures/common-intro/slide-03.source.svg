<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="共通仕様と既存コードには承認済み申請の変更を禁止する条件があるが、新しい開発者とAIは担当機能の仕様とタスク説明だけを参照し、その制御が実装から抜ける">
<rect class="field" x="6" y="5" width="165" height="164"/>
<text class="title" x="20" y="28">共通仕様の条件</text>
<rect class="boundary" x="18" y="41" width="141" height="76"/>
<text class="note" x="30" y="61">承認済みの申請なら</text>
<path class="flow" d="M88 68 V83"/>
<text class="label" x="88" y="105" text-anchor="middle">変更を認めない</text>
<text class="note" x="20" y="141">既存コードにも制御あり</text>
<text class="note" x="20" y="157">刷新でも引き継ぐ条件</text>
<path class="flow" d="M171 88 H194"/>
<rect class="box" x="196" y="5" width="164" height="164"/>
<text class="title" x="210" y="28">実装時に使った情報</text>
<rect class="badge" x="208" y="41" width="140" height="67"/>
<text class="note" x="220" y="60">担当機能の仕様書</text>
<text class="note" x="220" y="78">タスク説明</text>
<text class="label" x="220" y="99">変更して保存する</text>
<text class="note" x="210" y="133">関連する共通仕様は</text>
<text class="note" x="210" y="150">参照していなかった</text>
<path class="flow" d="M360 88 H383"/>
<rect class="field" x="385" y="5" width="165" height="164"/>
<text class="title" x="399" y="28">AIによる実装結果</text>
<rect class="boundary" x="397" y="41" width="141" height="82"/>
<rect class="badge" x="450" y="49" width="77" height="20"/>
<text class="note" x="488" y="64" text-anchor="middle">承認済み申請</text>
<text class="note" x="467" y="92" text-anchor="middle">12,000円 → 18,000円</text>
<text class="note" x="409" y="111">変更して保存できた</text>
<text class="note" x="399" y="143">承認後の変更制御が</text>
<text class="note" x="399" y="159">実装から抜けた</text>
<rect class="badge" x="6" y="181" width="544" height="34"/>
<text class="note" x="18" y="195">共通仕様は存在するが、今回の実装で参照する情報に含まれていなかった</text>
<text class="note" x="18" y="209">次のレビューで、引き継ぐ条件の不足が見つかる</text>
</svg>