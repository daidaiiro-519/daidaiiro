<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="レビュー担当者が承認済み申請の変更制御の実装箇所とテストを確かめるため、重なったPRのコード、テスト、説明、AIレビュー結果へ根拠を探しに戻る。確認したい条件と該当箇所の対応が示されていない">
<rect class="field" x="6" y="5" width="242" height="164"/>
<text class="title" x="20" y="28">AIで作成したPR</text>
<rect class="badge" x="42" y="42" width="176" height="86"/>
<rect class="badge" x="34" y="50" width="176" height="86"/>
<rect class="badge" x="26" y="58" width="176" height="86"/>
<text class="label" x="53" y="80">コード・テスト</text>
<text class="label" x="53" y="102">変更の説明</text>
<text class="label" x="53" y="124">AIレビュー結果</text>
<text class="note" x="20" y="160">確認条件と該当箇所の対応は未整理</text>
<path class="flow" d="M300 98 H250"/>
<rect class="badge" x="254" y="66" width="40" height="21"/>
<text class="note" x="274" y="81" text-anchor="middle">探す</text>
<rect class="box" x="300" y="5" width="250" height="164"/>
<g transform="translate(321 29) scale(.5)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="title" x="342" y="31">レビュー担当者</text>
<rect class="badge" x="312" y="53" width="226" height="101"/>
<text class="label" x="324" y="74">承認済み申請は変更不可</text>
<line class="grid" x1="313" y1="84" x2="537" y2="84"/>
<text class="note" x="324" y="101">どのコードで防いだ？</text>
<text class="note" x="324" y="120">どのテストで確かめた？</text>
<text class="note" x="324" y="139">変更の影響はどこまで？</text>
<rect class="badge" x="6" y="180" width="544" height="35"/>
<text class="note" x="18" y="194">読む・探す・照合する → 不明点を開発者に確認 → 修正後に再確認する</text>
<text class="note" x="18" y="208">教材1へ：次の担当者が判断するために、どんな成果と確認内容が必要かを考える</text>
</svg>