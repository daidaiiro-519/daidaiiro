<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="申請者が経費を精算する目的と、今回扱う申請の不備修正と再提出の目的を区別する。既存仕様で、上長承認後の直接変更の制限と、証憑だけを修正して再提出する場合の扱いを確かめる。その目的と要件をもとに、AIへ任せる作業の範囲を仕様確認、設計・実装・テスト、要件・設計と照合するレビューとして示す。">
<rect class="field" x="6" y="4" width="294" height="162"/>
<g transform="translate(29 20) scale(.42)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="title" x="50" y="25">申請者の目的</text>
<rect class="badge" x="18" y="38" width="270" height="39"/>
<path class="link" d="M30 47 h19 v27 h-19 z M34 54 h11 M34 60 h11 M34 67 h7"/>
<text class="note" x="62" y="53">複数の作業を含む目的</text>
<text class="label" x="62" y="69">申請した経費を精算する</text>
<path class="flow" d="M153 79 V101"/>
<rect class="box focus" x="18" y="105" width="270" height="54"/>
<path class="link" d="M30 118 h19 v32 h-19 z M34 125 h11 M34 131 h8 M42 143 l10 -13 4 3 -10 13 -6 2 z"/>
<text class="note" x="67" y="120">今回扱う目的</text>
<text class="label" x="67" y="137">申請の不備を修正し、</text>
<text class="label" x="67" y="154">再提出する</text>
<path class="flow" d="M302 132 H328"/>
<rect class="field" x="330" y="4" width="304" height="162"/>
<text class="title" x="344" y="25">既存仕様で確かめる要件</text>
<rect class="badge" x="342" y="38" width="280" height="48"/>
<path class="link" d="M354 60 V54 a6 6 0 0 1 12 0 V60 M351 60 H369 V76 H351 Z M360 65 V71"/>
<text class="label" x="385" y="67">上長承認後は直接変更できない</text>
<rect class="badge" x="342" y="96" width="280" height="63"/>
<text class="note" x="354" y="112">支出目的・金額を変えず、証憑だけ再提出</text>
<g transform="translate(358 128) scale(.28)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<path class="link" d="M370 128 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M373 128 l3 3 5 -6"/>
<text class="label" x="395" y="134">上長承認は維持</text>
<path class="link" d="M351 139 H366 V155 H351 Z M355 144 H362 M355 149 H362 M371 140 a8 8 0 0 1 0 14 M371 154 H376 M371 154 V149"/>
<text class="label" x="395" y="152">経理が確認し直す</text>
<path class="flow" d="M482 169 V190"/>
<rect class="field" x="6" y="194" width="628" height="51"/>
<path class="link" d="M19 201 H33 V213 H19 Z M26 201 V198 M22 204 V207 M30 204 V207 M22 210 H30"/>
<text class="label" x="43" y="209">AIに任せる作業の範囲</text>
<rect class="badge" x="18" y="219" width="176" height="21"/>
<path class="link" d="M26 222 h12 v16 h-12 z M29 227 h6 M29 232 h6"/>
<text class="note" x="46" y="234">要件と既存仕様を確認</text>
<path class="flow" d="M196 230 H216"/>
<rect class="badge" x="218" y="219" width="176" height="21"/>
<path class="link" d="M226 222 h15 v15 h-15 z M231 226 l-3 3 3 3 M237 226 l3 3 -3 3"/>
<text class="note" x="249" y="234">設計・実装・テスト</text>
<path class="flow" d="M396 230 H416"/>
<rect class="badge" x="418" y="219" width="204" height="21"/>
<path class="link" d="M426 222 h12 v16 h-12 z M429 227 h6 M429 233 l2 2 4 -4"/>
<text class="note" x="448" y="234">要件・設計と照合しレビュー</text>
</svg>
