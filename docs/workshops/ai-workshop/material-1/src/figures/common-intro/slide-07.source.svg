<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="承認後は変更不可という短い説明を、申請者が承認済み申請データを直接変更できない条件として明確にする。承認の段階、対象項目や例外の範囲は既存資料やコードや業務を知る人に確かめる">
<rect class="field" x="6" y="5" width="196" height="164"/>
<text class="title" x="20" y="28">既存メンバーの説明</text>
<rect class="badge" x="18" y="48" width="172" height="59"/>
<text class="title" x="32" y="73">承認後は</text>
<text class="title" x="32" y="96">変更不可</text>
<path class="link" d="M33 125 h14 v23 h-14 z M36 132 h8 M36 137 h8"/>
<text class="note" x="59" y="137">共通仕様・コードと</text>
<text class="note" x="59" y="154">照らして確かめる</text>
<path class="flow" d="M202 82 H250"/>
<rect class="box" x="252" y="5" width="298" height="164"/>
<text class="title" x="266" y="28">意味と適用範囲を明確にする</text>
<g transform="translate(285 71) scale(.55)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="note" x="285" y="108" text-anchor="middle">申請者</text>
<path class="link" d="M309 77 H388 M343 70 l14 14 M357 70 l-14 14"/>
<text class="note" x="348" y="108" text-anchor="middle">直接変更は不可</text>
<rect class="badge" x="390" y="48" width="146" height="55"/>
<text class="note" x="404" y="70">承認済みの</text>
<text class="label" x="404" y="92">申請データ</text>
<rect class="badge" x="264" y="122" width="130" height="35"/>
<text class="note" x="276" y="144">どの承認段階から？</text>
<rect class="badge" x="406" y="122" width="130" height="35"/>
<text class="note" x="418" y="144">対象項目・例外は？</text>
<rect class="badge" x="6" y="182" width="544" height="33"/>
<text class="note" x="18" y="196">共通仕様・機能仕様とコードを照合し、不明点は業務を知る人に確かめる</text>
<text class="note" x="18" y="210">明確にした前提を、教材3でAIが参照する情報と実行手順へ反映する</text>
</svg>