<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" style="min-width:470px" role="img" aria-label="教材1の目的と要件をもとに、経費申請に含まれる支出内容と証憑、それぞれに対する上長の承認と経理の確認を業務モデルに表す。業務知識と既存仕様で関係を確かめ、支出承認と証憑確認を区別する状態や、証憑を変更したら経理が再確認する処理などの設計へ反映する例。"><defs data-dsvg="marker"><marker id="dsvg-8dca4919-arrow-252b29" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#252b29"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="640.0" height="248.0" fill="#f4f1e8" rx="8"/>
<rect class="field" x="6" y="4" width="146" height="208" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="18" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">教材1：目的・要件</text>
<path class="badge" d="M18 39 H128 L140 51 V94 H18 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M128 39 V51 H140" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="30" y="55" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">差し戻し後の目的</text>
<text class="label" x="30" y="73" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">申請の不備を直し、</text>
<text class="label" x="30" y="89" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">再提出する</text>
<path class="badge" d="M18 106 H128 L140 118 V200 H18 Z" fill="#fffaf2" stroke="#252b29" stroke-width="1"/>
<path class="link" d="M128 106 V118 H140" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="note" x="30" y="122" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">確かめた要件</text>
<text class="note" x="30" y="143" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">支出目的・金額不変</text>
<text class="note" x="30" y="159" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">証憑だけを修正</text>
<text class="note" x="30" y="177" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">上長承認は維持</text>
<text class="note" x="30" y="193" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">経理は再確認</text>
<path class="flow" d="M155 117 H176" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-8dca4919-arrow-252b29)"/>

<rect class="field focus" x="180" y="4" width="270" height="208" fill="#fffaf2" stroke="#ae3f23" stroke-width="2" rx="3"/>
<text class="title" x="192" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">業務モデル：対象と判断の関係</text>
<rect class="badge" x="192" y="42" width="246" height="30" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M204 47 H217 V66 H204 Z M207 53 H214 M207 58 H214" fill="none" stroke="#252b29" stroke-width="1"/>
