<rect class="field" x="478" y="4" width="156" height="208" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="title" x="490" y="23" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#252b29">設計に反映する例</text>
<rect class="badge" x="490" y="42" width="132" height="69" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<rect class="badge" x="502" y="52" width="7" height="10" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<rect class="badge" x="514" y="52" width="7" height="10" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="532" y="62" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">状態</text>
<text class="label" x="502" y="83" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">支出承認と</text>
<text class="label" x="502" y="101" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">証憑確認を区別</text>
<rect class="badge" x="490" y="124" width="132" height="76" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M502 135 H516 V149 H502 Z M506 139 L504 142 L506 145 M512 139 L514 142 L512 145" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="530" y="146" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">変更処理</text>
<text class="label" x="502" y="170" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">証憑変更時は</text>
<text class="label" x="502" y="190" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">経理が再確認</text>

<rect class="field" x="6" y="219" width="628" height="25" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<text class="label" x="18" y="236" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">何を変えると、どの判断を確かめ直すかを設計に表す</text>
