<rect class="badge" x="192" y="90" width="117" height="44" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M204 99 H216 V125 H204 Z M207 105 H213 M207 112 H213 M207 119 H213" fill="none" stroke="#252b29" stroke-width="1"/>
