<path class="link" d="M333 99 H345 V125 L342 123 L339 125 L336 123 L333 125 Z M336 105 H342 M336 112 H342 M336 119 H342" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="357" y="108" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">証憑</text>
<text class="note" x="357" y="126" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#252b29">領収書など</text>
<path class="flow" d="M250 166 V139" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-8dca4919-arrow-252b29)"/>
<path class="flow" d="M380 166 V139" fill="none" stroke="#252b29" stroke-width="1.5" marker-end="url(#dsvg-8dca4919-arrow-252b29)"/>
<rect class="badge" x="192" y="170" width="117" height="30" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M212 178 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M203 192 V189 C203 182 215 182 215 189 V192" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="228" y="189" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">上長の承認</text>
<rect class="badge" x="321" y="170" width="117" height="30" fill="#fffaf2" stroke="#252b29" stroke-width="1" rx="3"/>
<path class="link" d="M341 178 a3 3 0 1 1 -6 0 a3 3 0 1 1 6 0 M332 192 V189 C332 182 344 182 344 189 V192" fill="none" stroke="#252b29" stroke-width="1"/>
<text class="label" x="357" y="189" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#252b29">経理の確認</text>
