<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="開発者は同じ担当機能の仕様書をもとにAIで実装とレビューを行う。コードとテストとレビュー結果を含むPRを人が確認し、案件の前提と既存コードに照らしてAIとも再確認して変更制御の不足を発見する">
<rect class="field" x="6" y="5" width="165" height="164"/>
<text class="title" x="20" y="28">AIで実装・レビュー</text>
<rect class="badge" x="18" y="42" width="141" height="36"/>
<text class="note" x="30" y="58">担当機能の仕様書を参照</text>
<text class="note" x="30" y="72">共通仕様の参照が抜けた</text>
<path class="flow" d="M88 78 V87"/>
<rect class="badge" x="18" y="89" width="141" height="25"/>
<text class="label" x="88" y="107" text-anchor="middle">AIで実装・テスト</text>
<path class="flow" d="M88 114 V124"/>
<rect class="badge" x="18" y="126" width="141" height="25"/>
<text class="label" x="88" y="144" text-anchor="middle">AIでレビュー</text>
<text class="note" x="20" y="165">この例では制約の指摘なし</text>
<path class="flow" d="M171 88 H194"/>
<rect class="field" x="196" y="5" width="164" height="164"/>
<g transform="translate(215 25) scale(.4)"><path class="link" d="M12 -14 a12 12 0 1 1 -24 0 a12 12 0 1 1 24 0 M-24 28 v-6 c0 -27 48 -27 48 0 v6"/></g>
<text class="title" x="235" y="28">PRを人が確認</text>
<rect class="badge" x="222" y="44" width="126" height="54"/>
<rect class="badge" x="215" y="52" width="126" height="54"/>
<rect class="badge" x="208" y="60" width="126" height="54"/>
<text class="note" x="226" y="78">コード・テスト</text>
<text class="note" x="226" y="94">説明・レビュー結果</text>
<text class="label" x="210" y="137">確認した条件と</text>
<text class="label" x="210" y="158">該当箇所が分かりにくい</text>
<path class="flow" d="M360 88 H383"/>
<rect class="box" x="385" y="5" width="165" height="164"/>
<text class="title" x="399" y="28">人とAIで再確認</text>
<rect class="badge" x="397" y="42" width="141" height="48"/>
<text class="note" x="409" y="61">共通仕様・既存コード</text>
<text class="note" x="409" y="80">承認後は変更不可</text>
<path class="flow" d="M467 90 V104"/>
<text class="label" x="399" y="124">変更制御の不足を発見</text>
<text class="note" x="399" y="145">人が指摘を確認し、</text>
<text class="note" x="399" y="159">追加修正・再テストへ</text>
<rect class="badge" x="6" y="181" width="544" height="34"/>
<text class="note" x="18" y="195">AIレビューを行っても、案件で必要な条件を確認できているとは限らない</text>
<text class="note" x="18" y="209">次は、多くの差分や説明から、重要な確認観点を探す負担を考える</text>
</svg>