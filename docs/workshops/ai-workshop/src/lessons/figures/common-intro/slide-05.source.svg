<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="想定例。設計を見直さず機能追加を続けると、別の担当者が既存処理の関係を把握しきれず似た処理を新たに作り、同じ業務ルールが複数の実装に分かれる可能性がある。関係を確かめずに増えると、変更の影響を調べるコード・資料・テストも広がり、動いていても業務ルール・設計・実装の対応を確かめにくくなる。">
