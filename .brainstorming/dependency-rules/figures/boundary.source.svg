<svg viewBox="0 0 1000 330" style="min-width:860px" role="img" aria-label="判定の中心と読み取りの境目">
<text class="title" x="10" y="24">グラフの JSON を公開の契約にする（矢印：データの流れ）</text>
<rect class="box kind-1" x="20" y="50" width="240" height="56"/><text class="title kind-1" x="32" y="72">cargo（読み取り）</text><text class="note small" x="32" y="92">cargo metadata --no-deps を読む</text>
<rect class="box kind-1" x="20" y="130" width="240" height="56"/><text class="title kind-1" x="32" y="152">ほかの言語の読み取り</text><text class="note small" x="32" y="172">別のプログラムでもよい</text>
<rect class="box kind-2" x="340" y="90" width="260" height="56"/><text class="title kind-2" x="352" y="112">グラフの JSON</text><text class="note small" x="352" y="132">graph.schema.json（版つき）</text>
<rect class="box kind-2" x="340" y="200" width="260" height="56"/><text class="title kind-2" x="352" y="222">規則の JSON</text><text class="note small" x="352" y="242">rules.schema.json（版つき）</text>
<rect class="box kind-3" x="660" y="90" width="140" height="56"/><text class="title kind-3" x="672" y="112">cli</text><text class="note small" x="672" y="132">JSON → core の型</text>
<rect class="box" x="840" y="90" width="140" height="56"/><text class="title" x="852" y="112">core</text><text class="note small" x="852" y="132">判定。言語を知らない</text>
<path class="flow" d="M260,78 H300 V110 H338"/>
<path class="flow" d="M260,158 H300 V126 H338"/>
<path class="flow" d="M600,118 H658"/>
<path class="flow" d="M600,228 H730 V148"/>
<path class="flow" d="M800,118 H838"/>
<text class="note" x="10" y="290">cargo の読み取りも、ほかの言語の読み取りと同じくグラフの JSON を通る。core の型は外へ出さない</text>
<text class="note" x="10" y="312">dependency-rules graph --cargo . でグラフの JSON だけを出せる。check は --graph &lt;ファイル|-&gt; でも受け取る</text>
</svg>
