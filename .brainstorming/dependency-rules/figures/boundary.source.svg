<svg viewBox="0 0 1000 300" style="min-width:860px" role="img" aria-label="判定の中心と読み取りの境目">
<text class="title" x="10" y="24">1つの crate の中の3つのモジュール（矢印：使う）</text>
<rect class="box kind-3" x="20" y="60" width="250" height="60"/><text class="title kind-3" x="32" y="84">cli（入口）</text><text class="note small" x="32" y="104">引数 ・ 出力 ・ 終了コード</text>
<rect class="box kind-1" x="20" y="180" width="250" height="60"/><text class="title kind-1" x="32" y="204">cargo（読み取り）</text><text class="note small" x="32" y="224">cargo metadata --no-deps を読む</text>
<rect class="box" x="380" y="120" width="300" height="60"/><text class="title" x="392" y="144">core（判定の中心）</text><text class="note small" x="392" y="164">node ・ edge ・ component ・ allow ・ 違反</text>
<rect class="area" x="760" y="60" width="220" height="180"/><text class="note small" x="772" y="80">core が知らないもの</text>
<text class="note small" x="772" y="110">packages ・ dependencies</text><text class="note small" x="772" y="130">workspace_members</text><text class="note small" x="772" y="150">Cargo.toml ・ crate</text><text class="note small" x="772" y="170">ファイル ・ プロセス</text>
<path class="flow" d="M145,120 V178"/><text class="label small" x="155" y="152">グラフを作らせる</text>
<path class="flow" d="M270,90 H325 V140 H378"/><text class="label small" x="282" y="82">グラフと規則を渡す</text>
<path class="flow" d="M270,210 H325 V160 H378"/><text class="label small" x="282" y="230">core の型で返す</text>
<text class="note" x="10" y="280">Rust 以外の読み取りは、cargo と同じ位置にモジュールを足す。core と規則の形は変えない</text>
</svg>
