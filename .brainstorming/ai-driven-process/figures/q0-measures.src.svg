<svg viewBox="0 0 640 400" style="min-width:540px" role="img" aria-label="プロセスを測る3つの指標と見る順">
<text class="label" x="18" y="22" font-weight="700" text-anchor="middle">先</text>
<line class="flow" x1="18" y1="32" x2="18" y2="282"/>
<text class="label" x="18" y="300" font-weight="700" text-anchor="middle">後</text>
<rect class="box focus" x="40" y="12" width="590" height="80"/>
<rect class="badge focus" x="54" y="26" width="72" height="22"/><text class="note focus" x="90" y="41" font-weight="700" text-anchor="middle">1 目的</text>
<text class="title focus" x="140" y="43">利用者の目的に届いたか</text><text class="label" x="54" y="74">作ったものの妥当性確認で、目的を果たせた割合</text>
<rect class="box kind-2" x="40" y="108" width="590" height="80"/>
<rect class="badge kind-2" x="54" y="122" width="72" height="22"/><text class="note kind-2" x="90" y="137" font-weight="700" text-anchor="middle">2 制約</text>
<text class="title kind-2" x="140" y="139">revert と障害を増やしていないか</text><text class="label" x="54" y="170">上がったら、速くなったのではなく問題を後ろへ送っただけ</text>
<rect class="box kind-3" x="40" y="204" width="590" height="80"/>
<rect class="badge kind-3" x="54" y="218" width="72" height="22"/><text class="note kind-3" x="90" y="233" font-weight="700" text-anchor="middle">3 目的</text>
<text class="title kind-3" x="140" y="235">人の時間を最小にしたか</text><text class="label" x="54" y="266">人の承認数 ・ 人を待つ時間 ・ 目的と基準に使った時間</text>
<rect class="box warn" x="40" y="318" width="250" height="62"/><text class="label warn" x="54" y="342" font-weight="700">言わないこと</text><text class="label" x="54" y="366">品質が担保された</text>
<rect class="box" x="306" y="318" width="324" height="62"/><text class="label" x="320" y="342" font-weight="700">言えること</text><text class="label" x="320" y="366">終了基準を満たし、残った危険を受け入れた</text>
</svg>