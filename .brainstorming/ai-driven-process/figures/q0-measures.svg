<text class="title kind-3" x="140" y="235" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#566318">人の時間を最小にしたか</text><text class="label" x="54" y="266" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人の承認数 ・ 人を待つ時間 ・ 目的と基準に使った時間</text>
<rect class="box warn" x="40" y="318" width="250" height="62" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="54" y="342" font-weight="700" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">言わないこと</text><text class="label" x="54" y="366" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">品質が担保された</text>
<rect class="box" x="306" y="318" width="324" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="320" y="342" font-weight="700" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">言えること</text><text class="label" x="320" y="366" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">終了基準を満たし、残った危険を受け入れた</text>
