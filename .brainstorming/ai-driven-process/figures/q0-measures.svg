<svg viewBox="0 0 640 400" style="min-width:540px" role="img" aria-label="プロセスを測る3つの指標と見る順" class="dsvg"><style data-dsvg="dark">.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .badge.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .note.focus{fill:var(--dsvg-accent,#0D5C55);font-size:11px}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .badge.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .note.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:11px}.dsvg .title.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:13px;font-weight:700}.dsvg .box.kind-3{fill:var(--dsvg-kind-3-bg,#E8ECD3);stroke:var(--dsvg-kind-3,#566318)}.dsvg .badge.kind-3{fill:var(--dsvg-kind-3-bg,#E8ECD3);stroke:var(--dsvg-kind-3,#566318)}.dsvg .note.kind-3{fill:var(--dsvg-kind-3,#566318);font-size:11px}.dsvg .title.kind-3{fill:var(--dsvg-kind-3,#566318);font-size:13px;font-weight:700}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg #dsvg-72561d9d-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-box-fill:#16211E}}:root[data-theme="dark"] .dsvg{--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-box-fill:#16211E}</style><defs data-dsvg="marker"><marker id="dsvg-72561d9d-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs>
<text class="label" x="18" y="22" font-weight="700" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">先</text>
<line class="flow" x1="18" y1="32" x2="18" y2="282" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-72561d9d-arrow-5B6B66)"/>
<text class="label" x="18" y="300" font-weight="700" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">後</text>
<rect class="box focus" x="40" y="12" width="590" height="80" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<rect class="badge focus" x="54" y="26" width="72" height="22" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="3"/><text class="note focus" x="90" y="41" font-weight="700" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#0D5C55">1 目的</text>
<text class="title focus" x="140" y="43" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">利用者の目的に届いたか</text><text class="label" x="54" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">作ったものの妥当性確認で、目的を果たせた割合</text>
<rect class="box kind-2" x="40" y="108" width="590" height="80" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/>
<rect class="badge kind-2" x="54" y="122" width="72" height="22" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1" rx="3"/><text class="note kind-2" x="90" y="137" font-weight="700" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#2F5B80">2 制約</text>
<text class="title kind-2" x="140" y="139" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">revert と障害を増やしていないか</text><text class="label" x="54" y="170" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">上がったら、速くなったのではなく問題を後ろへ送っただけ</text>
<rect class="box kind-3" x="40" y="204" width="590" height="80" fill="#E8ECD3" stroke="#566318" stroke-width="1.5" rx="5"/>
