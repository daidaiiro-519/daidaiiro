<text class="note small" x="115" y="210" text-anchor="middle">仕様へ戻す</text>
<rect class="badge" x="315" y="196" width="90" height="20"/>
<text class="note small" x="360" y="210" text-anchor="middle">検査へ戻す</text>
<text class="note" x="10" y="362">破線：受け入れ基準が曖昧なとき、AI は解釈で埋めずにループ1へ押し返す</text>
