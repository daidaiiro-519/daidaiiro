<svg viewBox="0 0 720 380" style="min-width:600px" role="img" aria-label="3つのループと、作ったものの妥当性確認">
<rect class="box kind-1" x="10" y="40" width="210" height="130"/>
<text class="label kind-1" x="22" y="64" font-weight="700">ループ1　作る前の妥当性確認</text>
<text class="label" x="22" y="90">そもそも作るべきか</text>
<text class="label" x="22" y="112">目的 → ユースケース</text>
<text class="label" x="22" y="134">保証と拡張 → 受け入れ基準</text>
<text class="note" x="22" y="158">人と利用者</text>
<rect class="box kind-2" x="255" y="40" width="210" height="130"/>
<text class="label kind-2" x="267" y="64" font-weight="700">ループ2　検証</text>
<text class="label" x="267" y="90">検査を書き、先に失敗させる</text>
<text class="label" x="267" y="112">実装 → 新しい文脈のレビュー</text>
<text class="label" x="267" y="134">基準を満たしたら止める</text>
<text class="note" x="267" y="158">ほぼ AI</text>
<rect class="box kind-1" x="500" y="40" width="210" height="130"/>
<text class="label kind-1" x="512" y="64" font-weight="700">作ったものの妥当性確認</text>
<text class="label" x="512" y="90">探索的テスト</text>
<text class="label" x="512" y="112">使用性テスト</text>
<text class="label" x="512" y="134">ユーザー受け入れテスト</text>
<text class="note" x="512" y="158">人と利用者</text>
<path class="flow" d="M220,92 H253"/>
<path class="flow" d="M465,92 H498"/>
<path class="flow async" d="M255,150 H222"/>
<rect class="box" x="500" y="240" width="210" height="90"/>
<text class="label" x="512" y="266" font-weight="700">小さく出す</text>
<text class="label" x="512" y="290">フラグ ・ 段階リリース</text>
<text class="note" x="512" y="314">戻せない変更は別の守り（Q4）</text>
<path class="flow" d="M605,170 V238"/>
<rect class="box kind-3" x="10" y="240" width="455" height="90"/>
<text class="label kind-3" x="22" y="266" font-weight="700">ループ3　学習</text>
<text class="label" x="22" y="290">即時：指標がしきい値を越えたら戻す</text>
<text class="label" x="22" y="312">遡及：足りなかった層へ戻し、目的に届いたかを問う</text>
<path class="flow" d="M500,285 H467"/>
<path class="flow" d="M115,240 V172"/>
<path class="flow" d="M360,240 V172"/>
