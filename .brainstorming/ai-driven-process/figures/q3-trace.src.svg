<svg viewBox="0 0 700 330" style="min-width:600px" role="img" aria-label="受け入れ基準とテストの対応表">
<text class="note" x="10" y="22" font-weight="700">受け入れ基準</text>
<text class="note" x="330" y="22" font-weight="700">テスト</text>
<text class="note" x="500" y="22" font-weight="700">実装前に失敗</text>
<text class="note" x="620" y="22" font-weight="700">人の確認</text>
<rect class="box" x="10" y="36" width="300" height="44"/><text class="label" x="22" y="55" font-weight="700">UC-3 主成功</text>
<text class="label small" x="22" y="72">確定すると在庫が減る</text>
<rect class="box" x="330" y="36" width="150" height="44"/><text class="label" x="342" y="63">test UC-3/main</text>
<text class="label" x="540" y="63" text-anchor="middle">あり</text>
<rect class="badge focus" x="606" y="47" width="88" height="22"/><text class="note focus" x="650" y="62" font-weight="700" text-anchor="middle">済</text>
<rect class="box" x="10" y="90" width="300" height="44"/><text class="label" x="22" y="109" font-weight="700">UC-3 最低保証</text>
<text class="label small" x="22" y="126">失敗してもログが残る</text>
<rect class="box" x="330" y="90" width="150" height="44"/><text class="label" x="342" y="117">test UC-3/min</text>
<text class="label" x="540" y="117" text-anchor="middle">あり</text>
<rect class="badge focus" x="606" y="101" width="88" height="22"/><text class="note focus" x="650" y="116" font-weight="700" text-anchor="middle">済</text>
<rect class="box" x="10" y="144" width="300" height="44"/><text class="label" x="22" y="163" font-weight="700">UC-3 4a</text>
<text class="label small" x="22" y="180">在庫切れなら確定しない</text>
<rect class="box" x="330" y="144" width="150" height="44"/><text class="label" x="342" y="171">test UC-3/4a</text>
<text class="label" x="540" y="171" text-anchor="middle">あり</text>
<rect class="badge focus" x="606" y="155" width="88" height="22"/><text class="note focus" x="650" y="170" font-weight="700" text-anchor="middle">済</text>
<rect class="box" x="10" y="198" width="300" height="44"/><text class="label" x="22" y="217" font-weight="700">UC-3 6a</text>
<text class="label small" x="22" y="234">決済が落ちたら取り消す</text>
<rect class="box" x="330" y="198" width="150" height="44"/><text class="label" x="342" y="225">（無い）</text>
<text class="label" x="540" y="225" text-anchor="middle">―</text>
<rect class="badge warn" x="606" y="209" width="88" height="22"/><text class="note warn" x="650" y="224" font-weight="700" text-anchor="middle">欠け</text>
<rect class="box" x="10" y="252" width="300" height="44"/><text class="label" x="22" y="271" font-weight="700">（無い）</text>
<rect class="box" x="330" y="252" width="150" height="44"/><text class="label" x="342" y="279">test 3回やり直す</text>
<text class="label" x="540" y="279" text-anchor="middle">あり</text>
<rect class="badge warn" x="606" y="263" width="88" height="22"/><text class="note warn" x="650" y="278" font-weight="700" text-anchor="middle">範囲の越え</text>
<text class="note" x="10" y="314">人が見るのは右の列だけ：欠け ・ 範囲の越え ・ 重複</text>
</svg>