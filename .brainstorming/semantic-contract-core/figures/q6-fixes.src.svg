<text class="label" x="74" y="57">どの一員も、自分は Concrete スキーマとして書かれている</text>
<rect class="box" x="502" y="32" width="580" height="41"/>
<text class="label" x="512" y="57">準拠と所有を分ける。どの一員も meta-schema に準拠し、所有は Core（名前の頭）で示す</text>
<rect class="box" x="64" y="79" width="430" height="58"/>
<text class="label" x="74" y="104">自分の検査で13件の指摘</text>
<rect class="box" x="502" y="79" width="580" height="58"/>
<text class="label" x="512" y="104">除外の道を作らず、description と x-prompt を足して0件にする（手元の形には</text>
