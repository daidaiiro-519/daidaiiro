<svg viewBox="0 0 860 364" style="min-width:860px" role="img" aria-label="基盤の契約のスキーマの境界の崩れと直し方">
<text class="note" x="20" y="22">いまの崩れ</text>
<text class="note" x="408" y="22">直し方</text>
<rect class="box" x="16" y="32" width="380" height="48"/>
<text class="label" x="26" y="52">6つが、自分は Concrete スキーマ</text>
<text class="label" x="26" y="68">として書かれている</text>
<rect class="box" x="404" y="32" width="440" height="48"/>
<text class="label" x="414" y="52">準拠と所有を分ける。7つとも meta-schema に準拠し、</text>
<text class="label" x="414" y="68">所有は基盤（名前の頭 schema-driven/）</text>
<rect class="box" x="16" y="86" width="380" height="48"/>
<text class="label" x="26" y="115">自分の検査で13件の指摘</text>
<rect class="box" x="404" y="86" width="440" height="48"/>
<text class="label" x="414" y="106">除外の道を作らず、description と x-prompt を</text>
<text class="label" x="414" y="122">足して0件にする</text>
<rect class="box" x="16" y="140" width="380" height="48"/>
<text class="label" x="26" y="160">注釈の一覧がメタスキーマ（5）と</text>
<text class="label" x="26" y="176">コード（7）で違う</text>
<rect class="box" x="404" y="140" width="440" height="48"/>
<text class="label" x="414" y="160">x- キーワードの表の1か所にまとめる。</text>
<text class="label" x="414" y="176">コードはこの表を読む</text>
<rect class="box" x="16" y="194" width="380" height="48"/>
<text class="label" x="26" y="214">annotations ・ view と meta-schema を</text>
<text class="label" x="26" y="230">つなぐのがコードだけ</text>
<rect class="box" x="404" y="194" width="440" height="48"/>
<text class="label" x="414" y="214">x- キーワードの表が、定義のスキーマを</text>
<text class="label" x="414" y="230">$ref で指す</text>
<rect class="box" x="16" y="248" width="380" height="48"/>
<text class="label" x="26" y="277">x-ref の label を誰も読まない</text>
<rect class="box" x="404" y="248" width="440" height="48"/>
<text class="label" x="414" y="277">消す。名前の出どころは x-view の label の1か所</text>
<rect class="box" x="16" y="302" width="380" height="48"/>
<text class="label" x="26" y="331">7つとも公開の記録が無い</text>
<rect class="box" x="404" y="302" width="440" height="48"/>
<text class="label" x="414" y="331">版を上げずに足したあと、公開の前に1回記録する</text>
</svg>