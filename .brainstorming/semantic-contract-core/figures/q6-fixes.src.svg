<svg viewBox="0 0 1050 456" style="min-width:900px" role="img" aria-label="schema-driven で起きたことと、Semantic Agent Schema でそれを起こさない決まり">
<text class="note" x="20" y="22">schema-driven で起きたこと（参考の事実）</text>
<text class="note" x="458" y="22">Semantic Agent Schema の決まり</text>
<rect class="box" x="16" y="32" width="430" height="58"/>
<text class="label" x="26" y="57">どの一員も、自分は Semantic Concrete Schema として</text>
<text class="label" x="26" y="74">書かれていた</text>
<rect class="box" x="454" y="32" width="580" height="58"/>
<text class="label" x="464" y="57">準拠と所有を分ける。どの一員も本体のメタスキーマ（semantic-abstract-schema.json）</text>
<text class="label" x="464" y="74">に準拠し、所有は URN の持ち主の部分（core か Skill か Agent の名前）で示す</text>
<rect class="box" x="16" y="96" width="430" height="58"/>
<text class="label" x="26" y="121">自分の検査で13件の指摘が出た</text>
<rect class="box" x="454" y="96" width="580" height="58"/>
<text class="label" x="464" y="121">基盤の一員も自分の検査から除外せず、description と</text>
<text class="label" x="464" y="138">x-prompt を持つ（手元の形には x-prompt を求めない）</text>
<rect class="box" x="16" y="160" width="430" height="41"/>
<text class="label" x="26" y="185">注釈の一覧がメタスキーマ（5）とコード（7）で違った</text>
<rect class="box" x="454" y="160" width="580" height="41"/>
<text class="label" x="464" y="185">Abstract の x- は Abstract の中に1つずつ定義し、コードはそれを読む</text>
<rect class="box" x="16" y="207" width="430" height="58"/>
<text class="label" x="26" y="232">annotations ・ view と meta-schema を</text>
<text class="label" x="26" y="249">つなぐのがコードだけだった</text>
<rect class="box" x="454" y="207" width="580" height="58"/>
<text class="label" x="464" y="232">本体が annotations を $ref で指す。</text>
<text class="label" x="464" y="249">欄に書く x- の形は本体の $defs に置く</text>
<rect class="box" x="16" y="271" width="430" height="58"/>
<text class="label" x="26" y="296">データを指すキーワードに置いた label を、</text>
<text class="label" x="26" y="313">どのコードも読まなかった</text>
<rect class="box" x="454" y="271" width="580" height="58"/>
<text class="label" x="464" y="296">名前の出どころは x-instance-label の1か所にする</text>
<rect class="box" x="16" y="335" width="430" height="41"/>
<text class="label" x="26" y="360">公開の記録が無いまま abstract@v1 を配った</text>
<rect class="box" x="454" y="335" width="580" height="41"/>
<text class="label" x="464" y="360">最初の公開から公開の記録を付け、出した版は変えない</text>
<rect class="box" x="16" y="382" width="430" height="58"/>
<text class="label" x="26" y="407">データを指すキーワードの名前が、</text>
<text class="label" x="26" y="424">$ref（スキーマを指す）と紛れた</text>
<rect class="box" x="454" y="382" width="580" height="58"/>
<text class="label" x="464" y="407">データを指すキーワードは x-relationship と呼び、</text>
<text class="label" x="464" y="424">存在の検査と inverse の意味を description に書く</text>
</svg>
