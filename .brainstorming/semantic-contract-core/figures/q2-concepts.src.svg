<svg viewBox="0 0 780 448" style="min-width:660px" role="img" aria-label="標準は JSON Schema だけにし、ほかの技術の概念は Abstract の拡張項目として定義して基盤が検証する。Concrete が足した x- は Concrete の validator が検証する">
<text class="note" x="20" y="22">技術</text><text class="note" x="196" y="22">使うもの ・ 参考にする概念</text><text class="note" x="486" y="22">置き場所と validator</text>
<rect class="box kind-1" x="20" y="34" width="160" height="56"/><text class="title" x="34" y="68">JSON Schema</text>
<path class="flow" d="M182,62 H192"/>
<rect class="box" x="196" y="34" width="270" height="56"/>
<text class="label" x="208" y="58">標準としてそのまま使う</text>
<text class="label" x="208" y="76">構造と値の制約 ・ $ref</text>
<path class="flow" d="M468,62 H482"/>
<rect class="box kind-1" x="486" y="34" width="274" height="56"/>
<text class="label" x="498" y="58">形の検証</text>
<text class="label" x="498" y="76">JSON Schema の実装が検証する</text>
<rect class="boundary" x="20" y="102" width="160" height="56"/><text class="title" x="34" y="136">JSON-LD</text>
<path class="flow" d="M182,130 H192"/>
<rect class="box" x="196" y="102" width="270" height="56"/>
<text class="label" x="208" y="126">参考にする概念：共通の識別子</text>
<text class="label" x="208" y="144">・ 名前の対応付け ・ 再定義の保護</text>
<path class="flow" d="M468,130 H482"/>
<rect class="box focus" x="486" y="102" width="274" height="56"/>
<text class="label" x="498" y="126">用語集 glossary の term を</text>
<text class="label" x="498" y="144">欄から標準の $ref で指す</text>
<rect class="boundary" x="20" y="170" width="160" height="56"/><text class="title" x="34" y="204">SHACL</text>
<path class="flow" d="M182,198 H192"/>
<rect class="box" x="196" y="170" width="270" height="56"/>
<text class="label" x="208" y="194">参考にする概念：関係の制約</text>
<text class="label" x="208" y="212">・ 経路 ・ 閉じる／開く ・ 結果の報告</text>
<path class="flow" d="M468,198 H482"/>
<rect class="box focus" x="486" y="170" width="274" height="56"/>
<text class="label" x="498" y="194">キーワード x-relationship と</text>
<text class="label" x="498" y="212">x-prompt の中の rule</text>
<rect class="boundary" x="20" y="238" width="160" height="56"/><text class="title" x="34" y="272">RDF ・ SPARQL</text>
<path class="flow" d="M182,266 H192"/>
<rect class="box" x="196" y="238" width="270" height="56"/>
<text class="label" x="208" y="262">参考にする概念：インスタンスを</text>
<text class="label" x="208" y="280">またいだ関係のグラフと問い合わせ</text>
<path class="flow" d="M468,266 H482"/>
<rect class="box focus" x="486" y="238" width="274" height="56"/>
<text class="label" x="498" y="262">Semantic Schema Resolver と</text>
<text class="label" x="498" y="280">意味で探す（関係の索引を使う）</text>
<rect class="box warn" x="20" y="312" width="740" height="120"/>
<text class="title" x="34" y="336">x- は2種類ある</text>
<text class="label" x="34" y="360">Abstract の拡張項目（3つの技術から採った概念）：Abstract のメタスキーマで閉じ、基盤が意味の検証まで持つ</text>
<text class="label" x="34" y="384">Concrete が足した x-：意味の検証は Concrete の validator。基盤は作法に従うかを見て、結果をまとめる</text>
<text class="label" x="34" y="408">JSON Schema の実装は、知らない x- を注釈として集めるだけで検証しない。標準へは投影しない</text>
</svg>
