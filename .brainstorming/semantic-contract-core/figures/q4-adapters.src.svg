<svg viewBox="0 0 760 420" style="min-width:640px" role="img" aria-label="入る側と出る側のアダプターを差し替えれば、手元でもクラウドでも基盤は同じ振る舞いになる">
<text class="note" x="20" y="22">入る側のアダプター</text>
<rect class="box" x="20" y="32" width="355" height="62"/><text class="title" x="34" y="58">手元：CLI ・ MCP</text><text class="note" x="34" y="80">いまある（標準入出力）</text>
<rect class="boundary" x="395" y="32" width="355" height="62"/><text class="title" x="409" y="58">クラウド：実行環境から受ける</text><text class="note" x="409" y="80">あとで足す</text>
<path class="flow" d="M197,96 V128"/><path class="flow" d="M572,96 V128"/>
<rect class="box focus" x="20" y="132" width="730" height="66"/><text class="title" x="34" y="158">基盤のインターフェース：コマンドと protocol（JSON Schema）</text><text class="label" x="34" y="182">どこで動かしても同じ形で受けて、同じ結果を返す</text>
<path class="flow" d="M385,200 V226"/>
<rect class="box" x="20" y="230" width="730" height="62"/><text class="title" x="34" y="256">core（Rust）</text><text class="label" x="34" y="278">入出力に触らない。ファイル ・ プログラム ・ AI の起動はポートの向こう</text>
<path class="flow" d="M197,294 V326"/><path class="flow" d="M572,294 V326"/>
<text class="note" x="20" y="322">出る側のアダプター</text>
<rect class="box" x="20" y="330" width="355" height="62"/><text class="title" x="34" y="356">手元：ファイル</text><text class="note" x="34" y="378">いまある</text>
<rect class="boundary" x="395" y="330" width="355" height="62"/><text class="title" x="409" y="356">クラウド：保存先</text><text class="note" x="409" y="378">あとで足す</text>
</svg>