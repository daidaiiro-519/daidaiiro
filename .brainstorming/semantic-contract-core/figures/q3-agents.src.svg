<svg viewBox="0 0 1058 508" style="min-width:900px" role="img" aria-label="Agents 契約：基盤は値の写しを渡し、5つの値と根拠を受け取って確かめる">
<text class="note" x="20" y="24">core（Agents 契約）</text>
<text class="note" x="420" y="24">adapters（AI のアダプター）</text>
<text class="note" x="726" y="24">AI ツールの CLI（外）</text>
<rect class="box" x="16" y="40" width="360" height="58"/>
<text class="label" x="26" y="65">だれに聞くか：rule の agent が x-delegates</text>
<text class="label" x="26" y="82">の名前を指し、任せる先の Concrete とモデルが決まる</text>
<rect class="box" x="16" y="106" width="360" height="58"/>
<text class="label" x="26" y="131">割り当てが無ければ、AI を呼ばずに unsupported</text>
<text class="label" x="26" y="148">を返す</text>
<rect class="box focus" x="16" y="188" width="360" height="75"/>
<text class="label" x="26" y="213">渡すもの：rule ・ reads が指す欄の値の写し ・</text>
<text class="label" x="26" y="230">x-prompt の read の文 ・ 関係するインスタンス</text>
<text class="label" x="26" y="247">の読んだ欄の値。I33 は変更の前後の値と意図も渡す</text>
<rect class="box" x="416" y="188" width="250" height="58"/>
<text class="label" x="426" y="213">AI ツールごとの起動の違いを吸収し、</text>
<text class="label" x="426" y="230">道具を持たせずに起動する</text>
<rect class="boundary" x="722" y="188" width="320" height="58"/>
<text class="label" x="732" y="213">判定する。AI ツールごとの設定ファイルが、</text>
<text class="label" x="732" y="230">何を許すかを決める</text>
<rect class="boundary" x="722" y="287" width="320" height="75"/>
<text class="label" x="732" y="312">返すもの：5つの値のどれかと根拠。I33 は、</text>
<text class="label" x="732" y="329">意図全体の意味の1文と対象ごとの意味の1文も返す</text>
<text class="label" x="732" y="346">（読んだ値の位置と意図の id つき）</text>
<rect class="box" x="416" y="287" width="250" height="75"/>
<text class="label" x="426" y="312">Claude Code ・ Codex ・ Kiro ・</text>
<text class="label" x="426" y="329"> GitHub Copilot の答えから</text>
<text class="label" x="426" y="346">JSON を受け取り、基盤へ返す</text>
<rect class="box focus" x="16" y="287" width="360" height="41"/>
<text class="label" x="26" y="312">受け取った答えを、基盤が確かめる</text>
<rect class="box warn" x="16" y="336" width="360" height="41"/>
<text class="label" x="26" y="361">形を満たさない答え → error</text>
<rect class="box" x="16" y="385" width="360" height="58"/>
<text class="label" x="26" y="410">根拠が渡した値に無い答え ・ 割れた答え →</text>
<text class="label" x="26" y="427">unverified</text>
<rect class="box" x="16" y="451" width="360" height="41"/>
<text class="label" x="26" y="476">それ以外 → 返った値と根拠</text>
<path class="flow" d="M376,212 H414"/>
<path class="flow" d="M666,212 H720"/>
<path class="flow" d="M722,311 H668"/>
<path class="flow" d="M416,311 H378"/>
</svg>