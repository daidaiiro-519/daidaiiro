<rect class="box" x="362" y="177" width="470" height="58"/>
<text class="label" x="372" y="202">文脈。term（名前 ・ 意味 ・ 値の形 ・ 単位）の並び。</text>
<text class="label" x="372" y="219">複数の Concrete が版付きの id で指す</text>
<rect class="box" x="840" y="177" width="170" height="58"/>
<text class="label" x="850" y="202">意味の宣言</text>
<rect class="box" x="154" y="241" width="200" height="41"/>
