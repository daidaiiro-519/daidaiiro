<rect class="box" x="362" y="335" width="470" height="58"/>
<text class="label" x="372" y="360">文脈。部品のカタログとデザインシステム（トークン）。</text>
<text class="label" x="372" y="377">カタログがトークン名とコントラストの組で指すので一緒に変える</text>
<rect class="box" x="840" y="335" width="170" height="58"/>
<text class="label" x="850" y="360">描画</text>
<rect class="box" x="154" y="399" width="200" height="58"/>
