<text class="note" x="158" y="22">名前</text>
<text class="note" x="366" y="22">中身</text>
<text class="note" x="844" y="22">業務領域</text>
<rect class="box focus" x="16" y="32" width="130" height="399"/>
<text class="title" x="26" y="57">集約</text>
<rect class="box focus" x="16" y="437" width="130" height="1206"/>
<text class="title" x="26" y="462">値オブジェクト</text>
<rect class="box focus" x="16" y="1649" width="130" height="898"/>
<text class="title" x="26" y="1674">ドメインサービス</text>
<rect class="box focus" x="16" y="2553" width="130" height="122"/>
<text class="title" x="26" y="2578">腐敗防止層</text>
<rect class="box" x="154" y="32" width="200" height="126"/>
<text class="label" x="164" y="57">Semantic Abstract</text>
<text class="label" x="164" y="74">Schema</text>
<rect class="box" x="362" y="32" width="470" height="126"/>
<text class="label" x="372" y="57">Core。版（識別子）・ Core の語彙 ・ Concrete の契約（形 ・</text>
<text class="label" x="372" y="74">拡張の契約 ・ 保存の決まり）・ 一員の形 ・ tool permissions の形</text>
<text class="label" x="372" y="91"> ・ 閉じた一覧のデータ ・ Core の</text>
<text class="label" x="372" y="108">rule（理由と変更の項目が合っている） ・ セッションの参照の形 ・</text>
<text class="label" x="372" y="125">手元のセッションの索引の形 ・ 関係の索引の形（DB</text>
<text class="label" x="372" y="142">のスキーマもここから決まる）</text>
<rect class="box" x="840" y="32" width="170" height="126"/>
<text class="label" x="850" y="57">意味の宣言</text>
<rect class="box" x="154" y="164" width="200" height="58"/>
<text class="label" x="164" y="189">Semantic Concrete</text>
<text class="label" x="164" y="206">Schema</text>
<rect class="box" x="362" y="164" width="470" height="58"/>
<text class="label" x="372" y="189">文脈。欄 ・ rule ・ term ・ 文脈の語彙 ・ view ・ validator</text>
<text class="label" x="372" y="206">の割り当て ・ 変えてよい範囲 ・ x-prompt ・ 公開する部分の版</text>
<rect class="box" x="840" y="164" width="170" height="58"/>
<text class="label" x="850" y="189">意味の宣言</text>
<rect class="box" x="154" y="228" width="200" height="41"/>
<text class="label" x="164" y="253">instance</text>
<rect class="box" x="362" y="228" width="470" height="41"/>
<text class="label" x="372" y="253">文脈。欄の値 ・ 従う Concrete（$schema）</text>
<rect class="box" x="840" y="228" width="170" height="41"/>
<text class="label" x="850" y="253">instance の作成と変更</text>
<rect class="box" x="154" y="275" width="200" height="58"/>
<text class="label" x="164" y="300">判定の記録</text>
<rect class="box" x="362" y="275" width="470" height="58"/>
<text class="label" x="372" y="300">文脈（形は Abstract）。判定した値 ・ 結果 ・ 根拠 ・ 判定した者</text>
<rect class="box" x="840" y="275" width="170" height="58"/>
<text class="label" x="850" y="300">変更の確かめと例外の判</text>
<text class="label" x="850" y="317">断</text>
<rect class="box" x="154" y="339" width="200" height="92"/>
<text class="label" x="164" y="364">変更の記録</text>
<rect class="box" x="362" y="339" width="470" height="92"/>
<text class="label" x="372" y="364">文脈（形は Abstract）。id（書いた時に1回だけ決める、</text>
<text class="label" x="372" y="381">打ち合わせずに一意な値）・ 理由 ・ 目的の参照 ・ 書いた者の種類（人</text>
<text class="label" x="372" y="398"> ・ AI の Agent）・ 変更の項目の並び。セッション ID は持たない。</text>
<text class="label" x="372" y="415">書いた時に作業ツリーに置き、instance と同じ変更でコミットされる</text>
<rect class="box" x="840" y="339" width="170" height="92"/>
<text class="label" x="850" y="364">変更の確かめと例外の判</text>
<text class="label" x="850" y="381">断</text>
<rect class="box" x="154" y="437" width="200" height="41"/>
<text class="label" x="164" y="462">rule</text>
<rect class="box" x="362" y="437" width="470" height="41"/>
<text class="label" x="372" y="462">id ・ rule ・ why ・ test ・ 判定する者 ・ 読む欄 ・ 使う term</text>
<rect class="box" x="840" y="437" width="170" height="41"/>
<rect class="box" x="154" y="484" width="200" height="41"/>
<text class="label" x="164" y="509">term</text>
<rect class="box" x="362" y="484" width="470" height="41"/>
<text class="label" x="372" y="509">版付きの名前と定義</text>
<rect class="box" x="840" y="484" width="170" height="41"/>
<rect class="box" x="154" y="531" width="200" height="41"/>
<text class="label" x="164" y="556">拡張した x- の定義</text>
<rect class="box" x="362" y="531" width="470" height="41"/>
<text class="label" x="372" y="556">名前（範囲は $id）・ 値の形 ・ 意味 ・ 任せる検証役の名前</text>
<rect class="box" x="840" y="531" width="170" height="41"/>
<rect class="box" x="154" y="578" width="200" height="41"/>
<text class="label" x="164" y="603">公開された言葉の版</text>
<rect class="box" x="362" y="578" width="470" height="41"/>
<text class="label" x="372" y="603">Concrete の公開する部分の版。出した版は変えない</text>
<rect class="box" x="840" y="578" width="170" height="41"/>
<rect class="box" x="154" y="625" width="200" height="58"/>
<text class="label" x="164" y="650">検証結果</text>
<rect class="box" x="362" y="625" width="470" height="58"/>
<text class="label" x="372" y="650">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="667">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="625" width="170" height="58"/>
<rect class="box" x="154" y="689" width="200" height="75"/>
<text class="label" x="164" y="714">判定した値</text>
<rect class="box" x="362" y="689" width="470" height="75"/>
<text class="label" x="372" y="714">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。AI は</text>
<text class="label" x="372" y="731">validator、外のツールは名前と版も）。いまの値との比べ方は JSON</text>
<text class="label" x="372" y="748">Schema の等しさの定義に従う</text>
<rect class="box" x="840" y="689" width="170" height="75"/>
<rect class="box" x="154" y="770" width="200" height="41"/>
<text class="label" x="164" y="795">view</text>
<rect class="box" x="362" y="770" width="470" height="41"/>
<text class="label" x="372" y="795">ページテンプレート ・ カタログ ・ デザインシステムの参照</text>
<rect class="box" x="840" y="770" width="170" height="41"/>
<rect class="box" x="154" y="817" width="200" height="41"/>
<text class="label" x="164" y="842">validator の割り当て</text>
<rect class="box" x="362" y="817" width="470" height="41"/>
<text class="label" x="372" y="842">rule と x- ごとの validator の名前（AI はモデルの名前まで）</text>
<rect class="box" x="840" y="817" width="170" height="41"/>
<rect class="box" x="154" y="864" width="200" height="41"/>
<text class="label" x="164" y="889">変えてよい範囲</text>
<rect class="box" x="362" y="864" width="470" height="41"/>
<text class="label" x="372" y="889">AI が書いてよい欄</text>
<rect class="box" x="840" y="864" width="170" height="41"/>
<rect class="box" x="154" y="911" width="200" height="41"/>
<text class="label" x="164" y="936">x-prompt</text>
<rect class="box" x="362" y="911" width="470" height="41"/>
<text class="label" x="372" y="936">書く単位ごとの案内</text>
<rect class="box" x="840" y="911" width="170" height="41"/>
<rect class="box" x="154" y="958" width="200" height="41"/>
<text class="label" x="164" y="983">参照（x-ref）</text>
<rect class="box" x="362" y="958" width="470" height="41"/>
<text class="label" x="372" y="983">ほかの instance、またはほかの文脈の公開された言葉の版を指す</text>
<rect class="box" x="840" y="958" width="170" height="41"/>
<rect class="box" x="154" y="1005" width="200" height="41"/>
<text class="label" x="164" y="1030">導出（x-derive）</text>
<rect class="box" x="362" y="1005" width="470" height="41"/>
<text class="label" x="372" y="1030">ほかの欄から決まる値の宣言</text>
<rect class="box" x="840" y="1005" width="170" height="41"/>
<rect class="box" x="154" y="1052" width="200" height="75"/>
<text class="label" x="164" y="1077">取り込めない理由</text>
<rect class="box" x="362" y="1052" width="470" height="75"/>
<text class="label" x="372" y="1077">変更を取り込む前に人が見るべき違反（範囲の外 ・ 参照の壊れ ・</text>
<text class="label" x="372" y="1094">指されたものを消す ・ ID の使い直し ・ AI が書いた人の判定 ・ AI</text>
<text class="label" x="372" y="1111">が変えた tool permissions）</text>
<rect class="box" x="840" y="1052" width="170" height="75"/>
<rect class="box" x="154" y="1133" width="200" height="92"/>
<text class="label" x="164" y="1158">セッションの参照</text>
<rect class="box" x="362" y="1133" width="470" height="92"/>
<text class="label" x="372" y="1158">id ・ 根から親までの id の並び。呼ぶ側（harness ・ AI</text>
<text class="label" x="372" y="1175">のツール）が渡す、中身を解釈しない文字列。変更の記録には入れず、</text>
<text class="label" x="372" y="1192">手元のセッションの索引にだけ置く。Q0 のセッション ID（基盤が AI の</text>
<text class="label" x="372" y="1209">validator を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1133" width="170" height="92"/>
<rect class="box" x="154" y="1231" width="200" height="58"/>
<text class="label" x="164" y="1256">手元のセッションの索引</text>
<rect class="box" x="362" y="1231" width="470" height="58"/>
<text class="label" x="372" y="1256">セッションの参照 → 変更の記録の id の並び。</text>
<text class="label" x="372" y="1273">作業した本人の手元だけに置き、コミットしない</text>
<rect class="box" x="840" y="1231" width="170" height="58"/>
<rect class="box" x="154" y="1295" width="200" height="75"/>
<text class="label" x="164" y="1320">関係の索引</text>
<rect class="box" x="362" y="1295" width="470" height="75"/>
<text class="label" x="372" y="1320">instance の id ・ kind（範囲は Concrete の $id）・</text>
<text class="label" x="372" y="1337">x-ref（指す側 → 指される側 ・ 公開された版）。</text>
<text class="label" x="372" y="1354">正本のファイルから作り直せ、コミットしない</text>
<rect class="box" x="840" y="1295" width="170" height="75"/>
<rect class="box" x="154" y="1376" width="200" height="75"/>
<text class="label" x="164" y="1401">変更の項目</text>
<rect class="box" x="362" y="1376" width="470" height="75"/>
<text class="label" x="372" y="1401">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1418">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1435">変更の前後から導く</text>
<rect class="box" x="840" y="1376" width="170" height="75"/>
<rect class="box" x="154" y="1457" width="200" height="58"/>
<text class="label" x="164" y="1482">目的の参照</text>
<rect class="box" x="362" y="1457" width="470" height="58"/>
<text class="label" x="372" y="1482">目的を指す id（ACDR の番号 ・ ボードの論点など）。</text>
<text class="label" x="372" y="1499">基盤は指す先を解釈しない</text>
<rect class="box" x="840" y="1457" width="170" height="58"/>
<rect class="box" x="154" y="1521" width="200" height="58"/>
<text class="label" x="164" y="1546">まとめ方</text>
<rect class="box" x="362" y="1521" width="470" height="58"/>
<text class="label" x="372" y="1546">目的の参照 ・ 対象の条件（コミットされた記録で引く）と、セッション</text>
<text class="label" x="372" y="1563">（手元の索引で引く。作業した本人だけ）。保存せず、出すときに組み立てる</text>
<rect class="box" x="840" y="1521" width="170" height="58"/>
<rect class="box" x="154" y="1585" width="200" height="58"/>
<text class="label" x="164" y="1610">変更の例外</text>
<rect class="box" x="362" y="1585" width="470" height="58"/>
<text class="label" x="372" y="1610">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変更の無い記録 ・</text>
<text class="label" x="372" y="1627">記録の書き換え ・ 変えてよい範囲の外 ・ 状態が変わった</text>
<rect class="box" x="840" y="1585" width="170" height="58"/>
<rect class="box" x="154" y="1649" width="200" height="58"/>
<text class="label" x="164" y="1674">Scaffold する</text>
<rect class="box" x="362" y="1649" width="470" height="58"/>
<text class="label" x="372" y="1674">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1691">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1649" width="170" height="58"/>
<text class="label" x="850" y="1674">意味の宣言</text>
<rect class="box" x="154" y="1713" width="200" height="75"/>
<text class="label" x="164" y="1738">Concrete を照らす</text>
<rect class="box" x="362" y="1713" width="470" height="75"/>
<text class="label" x="372" y="1738">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1755">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1772">意味は見ない）</text>
<rect class="box" x="840" y="1713" width="170" height="75"/>
<text class="label" x="850" y="1738">意味の宣言</text>
<rect class="box" x="154" y="1794" width="200" height="58"/>
<text class="label" x="164" y="1819">Semantic Schema</text>
<text class="label" x="164" y="1836">Resolver</text>
<rect class="box" x="362" y="1794" width="470" height="58"/>
<text class="label" x="372" y="1819">$schema ・ $ref ・ x-ref ・ x-derive ・ 文脈の語彙 ・</text>
<text class="label" x="372" y="1836">公開された言葉の版を解決する</text>
<rect class="box" x="840" y="1794" width="170" height="58"/>
<text class="label" x="850" y="1819">意味の検証</text>
<rect class="box" x="154" y="1858" width="200" height="109"/>
<text class="label" x="164" y="1883">Semantic Schema</text>
<text class="label" x="164" y="1900">Validator</text>
<rect class="box" x="362" y="1858" width="470" height="109"/>
<text class="label" x="372" y="1883">Core の x- と rule は自分で検証し、Concrete が足した x-</text>
<text class="label" x="372" y="1900">は宣言された検証役に任せて結果をまとめる。</text>
<text class="label" x="372" y="1917">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="1934">理由と変更の項目が合っているかは Core の rule として、CI</text>
<text class="label" x="372" y="1951">とレビューの側で毎回判定する</text>
<rect class="box" x="840" y="1858" width="170" height="109"/>
<text class="label" x="850" y="1883">意味の検証</text>
<rect class="box" x="154" y="1973" width="200" height="58"/>
<text class="label" x="164" y="1998">状態を導く</text>
<rect class="box" x="362" y="1973" width="470" height="58"/>
<text class="label" x="372" y="1998">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="1973" width="170" height="58"/>
<text class="label" x="850" y="1998">変更の確かめと例外の判</text>
<text class="label" x="850" y="2015">断</text>
<rect class="box" x="154" y="2037" width="200" height="126"/>
<text class="label" x="164" y="2062">変更を見せる</text>
<rect class="box" x="362" y="2037" width="470" height="126"/>
<text class="label" x="372" y="2062">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="2079">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="2096">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="2113">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="2130">まとまりに入る対象だけを出す。同じ欄を何度も変えた記録は（対象 ・ </text>
<text class="label" x="372" y="2147">欄）ごとにまとめて出す</text>
<rect class="box" x="840" y="2037" width="170" height="126"/>
<text class="label" x="850" y="2062">変更の確かめと例外の判</text>
<text class="label" x="850" y="2079">断</text>
<rect class="box" x="154" y="2169" width="200" height="58"/>
<text class="label" x="164" y="2194">例外をまとめる</text>
<rect class="box" x="362" y="2169" width="470" height="58"/>
<text class="label" x="372" y="2194">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="2211">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="2169" width="170" height="58"/>
<text class="label" x="850" y="2194">変更の確かめと例外の判</text>
<text class="label" x="850" y="2211">断</text>
<rect class="box" x="154" y="2233" width="200" height="58"/>
<text class="label" x="164" y="2258">意味で探して取り出す</text>
<rect class="box" x="362" y="2233" width="470" height="58"/>
<text class="label" x="372" y="2258">term ・ x-ref ・ 文脈の語彙 ・ 判定の結果 ・ 状態で探し、</text>
<text class="label" x="372" y="2275">要る部分だけを返す。探した結果に探した範囲を付ける</text>
<rect class="box" x="840" y="2233" width="170" height="58"/>
<text class="label" x="850" y="2258">意味で探す</text>
<rect class="box" x="154" y="2297" width="200" height="58"/>
<text class="label" x="164" y="2322">Semantic Schema</text>
<text class="label" x="164" y="2339">Renderer</text>
<rect class="box" x="362" y="2297" width="470" height="58"/>
<text class="label" x="372" y="2322">instance を、状態と rule ごとの結果と一緒に人が読む形にする</text>
<rect class="box" x="840" y="2297" width="170" height="58"/>
<text class="label" x="850" y="2322">描画</text>
<rect class="box" x="154" y="2361" width="200" height="58"/>
<text class="label" x="164" y="2386">移す</text>
<rect class="box" x="362" y="2361" width="470" height="58"/>
<text class="label" x="372" y="2386">Abstract の新しい版へ Concrete を合わせる。機械で直せるものは直</text>
<text class="label" x="372" y="2403">し、残りは案内を返す</text>
<rect class="box" x="840" y="2361" width="170" height="58"/>
<text class="label" x="850" y="2386">マイグレーション</text>
<rect class="box" x="154" y="2425" width="200" height="58"/>
<text class="label" x="164" y="2450">取り込む</text>
<rect class="box" x="362" y="2425" width="470" height="58"/>
<text class="label" x="372" y="2450">既存のファイルに $schema を当てて instance にし、</text>
<text class="label" x="372" y="2467">決まらないものを下書きの一覧に出す</text>
<rect class="box" x="840" y="2425" width="170" height="58"/>
