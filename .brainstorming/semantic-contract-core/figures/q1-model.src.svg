<rect class="box" x="362" y="271" width="470" height="58"/>
<text class="label" x="372" y="296">文脈。kind ごとの節 ・ 部品 ・ 値を取る式。</text>
<text class="label" x="372" y="313">形と参照の検査だけを持つ</text>
<rect class="box" x="840" y="271" width="170" height="58"/>
<text class="label" x="850" y="296">描画</text>
<rect class="box" x="154" y="335" width="200" height="58"/>
