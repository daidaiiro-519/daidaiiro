<text class="label" x="372" y="202">複数の Concrete が版付きの id で指す</text>
<rect class="box" x="840" y="160" width="170" height="58"/>
<text class="label" x="850" y="185">意味の宣言</text>
<rect class="box" x="154" y="224" width="200" height="41"/>
