<text class="note" x="158" y="22">名前</text>
<text class="note" x="366" y="22">中身</text>
<text class="note" x="844" y="22">業務領域</text>
<rect class="box focus" x="16" y="32" width="130" height="365"/>
<text class="title" x="26" y="57">集約</text>
