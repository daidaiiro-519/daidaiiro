<rect class="box focus" x="16" y="2421" width="130" height="122"/>
<text class="title" x="26" y="2446">腐敗防止層</text>
<rect class="box" x="154" y="32" width="200" height="92"/>
<text class="label" x="164" y="57">Semantic Abstract</text>
<text class="label" x="164" y="74">Schema</text>
<rect class="box" x="362" y="32" width="470" height="92"/>
<text class="label" x="372" y="57">Core。版（識別子）・ Core の語彙 ・ Concrete の契約（形 ・</text>
<text class="label" x="372" y="74">拡張の契約）・ 一員の形 ・ tool permissions の形 ・</text>
<text class="label" x="372" y="91">閉じた一覧のデータ ・ Core の rule（理由と変更の項目が合っている）</text>
<text class="label" x="372" y="108"> ・ セッションの参照の形 ・ 手元のセッションの索引の形</text>
<rect class="box" x="840" y="32" width="170" height="92"/>
<text class="label" x="850" y="57">意味の宣言</text>
<rect class="box" x="154" y="130" width="200" height="58"/>
<text class="label" x="164" y="155">Semantic Concrete</text>
<text class="label" x="164" y="172">Schema</text>
<rect class="box" x="362" y="130" width="470" height="58"/>
<text class="label" x="372" y="155">文脈。欄 ・ rule ・ term ・ 文脈の語彙 ・ view ・ validator</text>
<text class="label" x="372" y="172">の割り当て ・ 変えてよい範囲 ・ x-prompt ・ 公開する部分の版</text>
<rect class="box" x="840" y="130" width="170" height="58"/>
<text class="label" x="850" y="155">意味の宣言</text>
<rect class="box" x="154" y="194" width="200" height="41"/>
<text class="label" x="164" y="219">instance</text>
<rect class="box" x="362" y="194" width="470" height="41"/>
<text class="label" x="372" y="219">文脈。欄の値 ・ 従う Concrete（$schema）</text>
<rect class="box" x="840" y="194" width="170" height="41"/>
<text class="label" x="850" y="219">instance の作成と変更</text>
<rect class="box" x="154" y="241" width="200" height="58"/>
<text class="label" x="164" y="266">判定の記録</text>
<rect class="box" x="362" y="241" width="470" height="58"/>
<text class="label" x="372" y="266">文脈（形は Abstract）。判定した値 ・ 結果 ・ 根拠 ・ 判定した者</text>
<rect class="box" x="840" y="241" width="170" height="58"/>
<text class="label" x="850" y="266">変更の確かめと例外の判</text>
<text class="label" x="850" y="283">断</text>
<rect class="box" x="154" y="305" width="200" height="92"/>
<text class="label" x="164" y="330">変更の記録</text>
<rect class="box" x="362" y="305" width="470" height="92"/>
<text class="label" x="372" y="330">文脈（形は Abstract）。id（書いた時に1回だけ決める、</text>
<text class="label" x="372" y="347">打ち合わせずに一意な値）・ 理由 ・ 目的の参照 ・ 書いた者の種類（人</text>
<text class="label" x="372" y="364"> ・ AI の Agent）・ 変更の項目の並び。セッション ID は持たない。</text>
<text class="label" x="372" y="381">書いた時に作業ツリーに置き、instance と同じ変更でコミットされる</text>
<rect class="box" x="840" y="305" width="170" height="92"/>
<text class="label" x="850" y="330">変更の確かめと例外の判</text>
<text class="label" x="850" y="347">断</text>
<rect class="box" x="154" y="403" width="200" height="41"/>
<text class="label" x="164" y="428">rule</text>
<rect class="box" x="362" y="403" width="470" height="41"/>
<text class="label" x="372" y="428">id ・ rule ・ why ・ test ・ 判定する者 ・ 読む欄 ・ 使う term</text>
<rect class="box" x="840" y="403" width="170" height="41"/>
<rect class="box" x="154" y="450" width="200" height="41"/>
<text class="label" x="164" y="475">term</text>
<rect class="box" x="362" y="450" width="470" height="41"/>
<text class="label" x="372" y="475">版付きの名前と定義</text>
<rect class="box" x="840" y="450" width="170" height="41"/>
<rect class="box" x="154" y="497" width="200" height="41"/>
<text class="label" x="164" y="522">拡張した x- の定義</text>
<rect class="box" x="362" y="497" width="470" height="41"/>
<text class="label" x="372" y="522">名前（範囲は $id）・ 値の形 ・ 意味 ・ 任せる検証役の名前</text>
<rect class="box" x="840" y="497" width="170" height="41"/>
<rect class="box" x="154" y="544" width="200" height="41"/>
<text class="label" x="164" y="569">公開された言葉の版</text>
<rect class="box" x="362" y="544" width="470" height="41"/>
<text class="label" x="372" y="569">Concrete の公開する部分の版。出した版は変えない</text>
<rect class="box" x="840" y="544" width="170" height="41"/>
<rect class="box" x="154" y="591" width="200" height="58"/>
<text class="label" x="164" y="616">検証結果</text>
<rect class="box" x="362" y="591" width="470" height="58"/>
<text class="label" x="372" y="616">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="633">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="591" width="170" height="58"/>
<rect class="box" x="154" y="655" width="200" height="75"/>
<text class="label" x="164" y="680">判定した値</text>
<rect class="box" x="362" y="655" width="470" height="75"/>
<text class="label" x="372" y="680">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。AI は</text>
<text class="label" x="372" y="697">validator、外のツールは名前と版も）。いまの値との比べ方は JSON</text>
<text class="label" x="372" y="714">Schema の等しさの定義に従う</text>
<rect class="box" x="840" y="655" width="170" height="75"/>
<rect class="box" x="154" y="736" width="200" height="41"/>
<text class="label" x="164" y="761">view</text>
<rect class="box" x="362" y="736" width="470" height="41"/>
<text class="label" x="372" y="761">ページテンプレート ・ カタログ ・ デザインシステムの参照</text>
<rect class="box" x="840" y="736" width="170" height="41"/>
<rect class="box" x="154" y="783" width="200" height="41"/>
<text class="label" x="164" y="808">validator の割り当て</text>
<rect class="box" x="362" y="783" width="470" height="41"/>
<text class="label" x="372" y="808">rule と x- ごとの validator の名前（AI はモデルの名前まで）</text>
<rect class="box" x="840" y="783" width="170" height="41"/>
<rect class="box" x="154" y="830" width="200" height="41"/>
<text class="label" x="164" y="855">変えてよい範囲</text>
<rect class="box" x="362" y="830" width="470" height="41"/>
<text class="label" x="372" y="855">AI が書いてよい欄</text>
<rect class="box" x="840" y="830" width="170" height="41"/>
<rect class="box" x="154" y="877" width="200" height="41"/>
<text class="label" x="164" y="902">x-prompt</text>
<rect class="box" x="362" y="877" width="470" height="41"/>
<text class="label" x="372" y="902">書く単位ごとの案内</text>
<rect class="box" x="840" y="877" width="170" height="41"/>
<rect class="box" x="154" y="924" width="200" height="41"/>
<text class="label" x="164" y="949">参照（x-ref）</text>
<rect class="box" x="362" y="924" width="470" height="41"/>
<text class="label" x="372" y="949">ほかの instance、またはほかの文脈の公開された言葉の版を指す</text>
<rect class="box" x="840" y="924" width="170" height="41"/>
<rect class="box" x="154" y="971" width="200" height="41"/>
<text class="label" x="164" y="996">導出（x-derive）</text>
<rect class="box" x="362" y="971" width="470" height="41"/>
<text class="label" x="372" y="996">ほかの欄から決まる値の宣言</text>
<rect class="box" x="840" y="971" width="170" height="41"/>
<rect class="box" x="154" y="1018" width="200" height="58"/>
<text class="label" x="164" y="1043">取り込めない理由</text>
<rect class="box" x="362" y="1018" width="470" height="58"/>
<text class="label" x="372" y="1043">変更を取り込む前に人が見るべき違反（範囲の外 ・ 参照の壊れ ・</text>
<text class="label" x="372" y="1060">指されたものを消す ・ ID の使い直し ・ AI が書いた人の判定）</text>
<rect class="box" x="840" y="1018" width="170" height="58"/>
<rect class="box" x="154" y="1082" width="200" height="92"/>
<text class="label" x="164" y="1107">セッションの参照</text>
<rect class="box" x="362" y="1082" width="470" height="92"/>
<text class="label" x="372" y="1107">id ・ 根から親までの id の並び。呼ぶ側（harness ・ AI</text>
<text class="label" x="372" y="1124">のツール）が渡す、中身を解釈しない文字列。変更の記録には入れず、</text>
<text class="label" x="372" y="1141">手元のセッションの索引にだけ置く。Q0 のセッション ID（基盤が AI の</text>
<text class="label" x="372" y="1158">validator を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1082" width="170" height="92"/>
<rect class="box" x="154" y="1180" width="200" height="58"/>
<text class="label" x="164" y="1205">手元のセッションの索引</text>
<rect class="box" x="362" y="1180" width="470" height="58"/>
<text class="label" x="372" y="1205">セッションの参照 → 変更の記録の id の並び。</text>
<text class="label" x="372" y="1222">作業した本人の手元だけに置き、コミットしない</text>
<rect class="box" x="840" y="1180" width="170" height="58"/>
<rect class="box" x="154" y="1244" width="200" height="75"/>
<text class="label" x="164" y="1269">変更の項目</text>
<rect class="box" x="362" y="1244" width="470" height="75"/>
<text class="label" x="372" y="1269">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1286">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1303">変更の前後から導く</text>
<rect class="box" x="840" y="1244" width="170" height="75"/>
<rect class="box" x="154" y="1325" width="200" height="58"/>
<text class="label" x="164" y="1350">目的の参照</text>
<rect class="box" x="362" y="1325" width="470" height="58"/>
<text class="label" x="372" y="1350">目的を指す id（ACDR の番号 ・ ボードの論点など）。</text>
<text class="label" x="372" y="1367">基盤は指す先を解釈しない</text>
<rect class="box" x="840" y="1325" width="170" height="58"/>
<rect class="box" x="154" y="1389" width="200" height="58"/>
<text class="label" x="164" y="1414">まとめ方</text>
<rect class="box" x="362" y="1389" width="470" height="58"/>
<text class="label" x="372" y="1414">目的の参照 ・ 対象の条件（コミットされた記録で引く）と、セッション</text>
<text class="label" x="372" y="1431">（手元の索引で引く。作業した本人だけ）。保存せず、出すときに組み立てる</text>
<rect class="box" x="840" y="1389" width="170" height="58"/>
<rect class="box" x="154" y="1453" width="200" height="58"/>
<text class="label" x="164" y="1478">変更の例外</text>
<rect class="box" x="362" y="1453" width="470" height="58"/>
<text class="label" x="372" y="1478">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変更の無い記録 ・</text>
<text class="label" x="372" y="1495">記録の書き換え ・ 変えてよい範囲の外 ・ 状態が変わった</text>
<rect class="box" x="840" y="1453" width="170" height="58"/>
<rect class="box" x="154" y="1517" width="200" height="58"/>
<text class="label" x="164" y="1542">Scaffold する</text>
<rect class="box" x="362" y="1517" width="470" height="58"/>
<text class="label" x="372" y="1542">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1559">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1517" width="170" height="58"/>
<text class="label" x="850" y="1542">意味の宣言</text>
<rect class="box" x="154" y="1581" width="200" height="75"/>
<text class="label" x="164" y="1606">Concrete を照らす</text>
<rect class="box" x="362" y="1581" width="470" height="75"/>
<text class="label" x="372" y="1606">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1623">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1640">意味は見ない）</text>
<rect class="box" x="840" y="1581" width="170" height="75"/>
<text class="label" x="850" y="1606">意味の宣言</text>
<rect class="box" x="154" y="1662" width="200" height="58"/>
<text class="label" x="164" y="1687">Semantic Schema</text>
<text class="label" x="164" y="1704">Resolver</text>
<rect class="box" x="362" y="1662" width="470" height="58"/>
<text class="label" x="372" y="1687">$schema ・ $ref ・ x-ref ・ x-derive ・ 文脈の語彙 ・</text>
<text class="label" x="372" y="1704">公開された言葉の版を解決する</text>
<rect class="box" x="840" y="1662" width="170" height="58"/>
<text class="label" x="850" y="1687">意味の検証</text>
<rect class="box" x="154" y="1726" width="200" height="109"/>
<text class="label" x="164" y="1751">Semantic Schema</text>
<text class="label" x="164" y="1768">Validator</text>
<rect class="box" x="362" y="1726" width="470" height="109"/>
<text class="label" x="372" y="1751">Core の x- と rule は自分で検証し、Concrete が足した x-</text>
<text class="label" x="372" y="1768">は宣言された検証役に任せて結果をまとめる。</text>
<text class="label" x="372" y="1785">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="1802">理由と変更の項目が合っているかは Core の rule として、CI</text>
<text class="label" x="372" y="1819">とレビューの側で毎回判定する</text>
<rect class="box" x="840" y="1726" width="170" height="109"/>
<text class="label" x="850" y="1751">意味の検証</text>
<rect class="box" x="154" y="1841" width="200" height="58"/>
<text class="label" x="164" y="1866">状態を導く</text>
<rect class="box" x="362" y="1841" width="470" height="58"/>
<text class="label" x="372" y="1866">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="1841" width="170" height="58"/>
<text class="label" x="850" y="1866">変更の確かめと例外の判</text>
<text class="label" x="850" y="1883">断</text>
<rect class="box" x="154" y="1905" width="200" height="126"/>
<text class="label" x="164" y="1930">変更を見せる</text>
<rect class="box" x="362" y="1905" width="470" height="126"/>
<text class="label" x="372" y="1930">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="1947">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="1964">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="1981">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="1998">まとまりに入る対象だけを出す。同じ欄を何度も変えた記録は（対象 ・ </text>
<text class="label" x="372" y="2015">欄）ごとにまとめて出す</text>
<rect class="box" x="840" y="1905" width="170" height="126"/>
<text class="label" x="850" y="1930">変更の確かめと例外の判</text>
<text class="label" x="850" y="1947">断</text>
<rect class="box" x="154" y="2037" width="200" height="58"/>
<text class="label" x="164" y="2062">例外をまとめる</text>
<rect class="box" x="362" y="2037" width="470" height="58"/>
<text class="label" x="372" y="2062">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="2079">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="2037" width="170" height="58"/>
<text class="label" x="850" y="2062">変更の確かめと例外の判</text>
<text class="label" x="850" y="2079">断</text>
<rect class="box" x="154" y="2101" width="200" height="58"/>
<text class="label" x="164" y="2126">意味で探して取り出す</text>
<rect class="box" x="362" y="2101" width="470" height="58"/>
<text class="label" x="372" y="2126">term ・ x-ref ・ 文脈の語彙 ・ 判定の結果 ・ 状態で探し、</text>
<text class="label" x="372" y="2143">要る部分だけを返す</text>
<rect class="box" x="840" y="2101" width="170" height="58"/>
<text class="label" x="850" y="2126">意味で探す</text>
<rect class="box" x="154" y="2165" width="200" height="58"/>
<text class="label" x="164" y="2190">Semantic Schema</text>
<text class="label" x="164" y="2207">Renderer</text>
<rect class="box" x="362" y="2165" width="470" height="58"/>
<text class="label" x="372" y="2190">instance を、状態と rule ごとの結果と一緒に人が読む形にする</text>
<rect class="box" x="840" y="2165" width="170" height="58"/>
<text class="label" x="850" y="2190">描画</text>
<rect class="box" x="154" y="2229" width="200" height="58"/>
<text class="label" x="164" y="2254">移す</text>
<rect class="box" x="362" y="2229" width="470" height="58"/>
<text class="label" x="372" y="2254">Abstract の新しい版へ Concrete を合わせる。機械で直せるものは直</text>
<text class="label" x="372" y="2271">し、残りは案内を返す</text>
<rect class="box" x="840" y="2229" width="170" height="58"/>
<text class="label" x="850" y="2254">マイグレーション</text>
<rect class="box" x="154" y="2293" width="200" height="58"/>
<text class="label" x="164" y="2318">取り込む</text>
<rect class="box" x="362" y="2293" width="470" height="58"/>
<text class="label" x="372" y="2318">既存のファイルに $schema を当てて instance にし、</text>
<text class="label" x="372" y="2335">決まらないものを下書きの一覧に出す</text>
<rect class="box" x="840" y="2293" width="170" height="58"/>
<text class="label" x="850" y="2318">instance の作成と変更</text>
<rect class="box" x="154" y="2357" width="200" height="58"/>
<text class="label" x="164" y="2382">公開された言葉の版を出す</text>
<rect class="box" x="362" y="2357" width="470" height="58"/>
<text class="label" x="372" y="2382">Concrete の公開する部分と Abstract の版を、版を並べて出す。</text>
<text class="label" x="372" y="2399">出した版は変えない</text>
<rect class="box" x="840" y="2357" width="170" height="58"/>
<text class="label" x="850" y="2382">スキーマの保存と公開</text>
<rect class="box" x="154" y="2421" width="200" height="58"/>
