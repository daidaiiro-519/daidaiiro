<text class="label" x="164" y="962">導出（x-derive）</text>
<rect class="box" x="362" y="937" width="470" height="41"/>
<text class="label" x="372" y="962">ほかの欄から決まる値の宣言</text>
<rect class="box" x="840" y="937" width="170" height="41"/>
<rect class="box" x="154" y="984" width="200" height="58"/>
<text class="label" x="164" y="1009">取り込めない理由</text>
<rect class="box" x="362" y="984" width="470" height="58"/>
<text class="label" x="372" y="1009">変更を取り込む前に人が見るべき違反（範囲の外 ・ 参照の壊れ ・</text>
