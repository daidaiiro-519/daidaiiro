<rect class="box" x="362" y="621" width="470" height="75"/>
<text class="label" x="372" y="646">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。AI は</text>
<text class="label" x="372" y="663">validator、外のツールは名前と版も）。いまの値との比べ方は JSON</text>
