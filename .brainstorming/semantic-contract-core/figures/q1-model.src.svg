<rect class="box" x="154" y="32" width="200" height="109"/>
<text class="label" x="164" y="57">Semantic Abstract</text>
<text class="label" x="164" y="74">Schema</text>
<rect class="box" x="362" y="32" width="470" height="109"/>
<text class="label" x="372" y="57">Core。版（識別子）・ Core の語彙 ・ Concrete の契約（形 ・</text>
<text class="label" x="372" y="74">拡張の契約 ・ 保存の決まり）・ 一員の形 ・ tool permissions の形</text>
<text class="label" x="372" y="91"> ・ 閉じた一覧のデータ ・ Core の</text>
<text class="label" x="372" y="108">rule（理由と変更の項目が合っている） ・ セッションの参照の形 ・</text>
<text class="label" x="372" y="125">手元のセッションの索引の形</text>
<rect class="box" x="840" y="32" width="170" height="109"/>
<text class="label" x="850" y="57">意味の宣言</text>
<rect class="box" x="154" y="147" width="200" height="58"/>
<text class="label" x="164" y="172">Semantic Concrete</text>
<text class="label" x="164" y="189">Schema</text>
<rect class="box" x="362" y="147" width="470" height="58"/>
<text class="label" x="372" y="172">文脈。欄 ・ rule ・ term ・ 文脈の語彙 ・ view ・ validator</text>
<text class="label" x="372" y="189">の割り当て ・ 変えてよい範囲 ・ x-prompt ・ 公開する部分の版</text>
<rect class="box" x="840" y="147" width="170" height="58"/>
<text class="label" x="850" y="172">意味の宣言</text>
<rect class="box" x="154" y="211" width="200" height="41"/>
<text class="label" x="164" y="236">instance</text>
<rect class="box" x="362" y="211" width="470" height="41"/>
<text class="label" x="372" y="236">文脈。欄の値 ・ 従う Concrete（$schema）</text>
<rect class="box" x="840" y="211" width="170" height="41"/>
<text class="label" x="850" y="236">instance の作成と変更</text>
<rect class="box" x="154" y="258" width="200" height="58"/>
<text class="label" x="164" y="283">判定の記録</text>
<rect class="box" x="362" y="258" width="470" height="58"/>
<text class="label" x="372" y="283">文脈（形は Abstract）。判定した値 ・ 結果 ・ 根拠 ・ 判定した者</text>
<rect class="box" x="840" y="258" width="170" height="58"/>
<text class="label" x="850" y="283">変更の確かめと例外の判</text>
<text class="label" x="850" y="300">断</text>
<rect class="box" x="154" y="322" width="200" height="92"/>
<text class="label" x="164" y="347">変更の記録</text>
<rect class="box" x="362" y="322" width="470" height="92"/>
<text class="label" x="372" y="347">文脈（形は Abstract）。id（書いた時に1回だけ決める、</text>
<text class="label" x="372" y="364">打ち合わせずに一意な値）・ 理由 ・ 目的の参照 ・ 書いた者の種類（人</text>
<text class="label" x="372" y="381"> ・ AI の Agent）・ 変更の項目の並び。セッション ID は持たない。</text>
<text class="label" x="372" y="398">書いた時に作業ツリーに置き、instance と同じ変更でコミットされる</text>
<rect class="box" x="840" y="322" width="170" height="92"/>
<text class="label" x="850" y="347">変更の確かめと例外の判</text>
<text class="label" x="850" y="364">断</text>
<rect class="box" x="154" y="420" width="200" height="41"/>
<text class="label" x="164" y="445">rule</text>
<rect class="box" x="362" y="420" width="470" height="41"/>
<text class="label" x="372" y="445">id ・ rule ・ why ・ test ・ 判定する者 ・ 読む欄 ・ 使う term</text>
<rect class="box" x="840" y="420" width="170" height="41"/>
<rect class="box" x="154" y="467" width="200" height="41"/>
<text class="label" x="164" y="492">term</text>
<rect class="box" x="362" y="467" width="470" height="41"/>
<text class="label" x="372" y="492">版付きの名前と定義</text>
<rect class="box" x="840" y="467" width="170" height="41"/>
<rect class="box" x="154" y="514" width="200" height="41"/>
<text class="label" x="164" y="539">拡張した x- の定義</text>
<rect class="box" x="362" y="514" width="470" height="41"/>
<text class="label" x="372" y="539">名前（範囲は $id）・ 値の形 ・ 意味 ・ 任せる検証役の名前</text>
<rect class="box" x="840" y="514" width="170" height="41"/>
<rect class="box" x="154" y="561" width="200" height="41"/>
<text class="label" x="164" y="586">公開された言葉の版</text>
<rect class="box" x="362" y="561" width="470" height="41"/>
<text class="label" x="372" y="586">Concrete の公開する部分の版。出した版は変えない</text>
<rect class="box" x="840" y="561" width="170" height="41"/>
<rect class="box" x="154" y="608" width="200" height="58"/>
<text class="label" x="164" y="633">検証結果</text>
<rect class="box" x="362" y="608" width="470" height="58"/>
<text class="label" x="372" y="633">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="650">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="608" width="170" height="58"/>
<rect class="box" x="154" y="672" width="200" height="75"/>
<text class="label" x="164" y="697">判定した値</text>
<rect class="box" x="362" y="672" width="470" height="75"/>
<text class="label" x="372" y="697">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。AI は</text>
<text class="label" x="372" y="714">validator、外のツールは名前と版も）。いまの値との比べ方は JSON</text>
<text class="label" x="372" y="731">Schema の等しさの定義に従う</text>
<rect class="box" x="840" y="672" width="170" height="75"/>
<rect class="box" x="154" y="753" width="200" height="41"/>
<text class="label" x="164" y="778">view</text>
<rect class="box" x="362" y="753" width="470" height="41"/>
<text class="label" x="372" y="778">ページテンプレート ・ カタログ ・ デザインシステムの参照</text>
<rect class="box" x="840" y="753" width="170" height="41"/>
<rect class="box" x="154" y="800" width="200" height="41"/>
<text class="label" x="164" y="825">validator の割り当て</text>
<rect class="box" x="362" y="800" width="470" height="41"/>
<text class="label" x="372" y="825">rule と x- ごとの validator の名前（AI はモデルの名前まで）</text>
<rect class="box" x="840" y="800" width="170" height="41"/>
<rect class="box" x="154" y="847" width="200" height="41"/>
<text class="label" x="164" y="872">変えてよい範囲</text>
<rect class="box" x="362" y="847" width="470" height="41"/>
<text class="label" x="372" y="872">AI が書いてよい欄</text>
<rect class="box" x="840" y="847" width="170" height="41"/>
<rect class="box" x="154" y="894" width="200" height="41"/>
<text class="label" x="164" y="919">x-prompt</text>
<rect class="box" x="362" y="894" width="470" height="41"/>
<text class="label" x="372" y="919">書く単位ごとの案内</text>
<rect class="box" x="840" y="894" width="170" height="41"/>
<rect class="box" x="154" y="941" width="200" height="41"/>
<text class="label" x="164" y="966">参照（x-ref）</text>
<rect class="box" x="362" y="941" width="470" height="41"/>
<text class="label" x="372" y="966">ほかの instance、またはほかの文脈の公開された言葉の版を指す</text>
<rect class="box" x="840" y="941" width="170" height="41"/>
<rect class="box" x="154" y="988" width="200" height="41"/>
<text class="label" x="164" y="1013">導出（x-derive）</text>
<rect class="box" x="362" y="988" width="470" height="41"/>
<text class="label" x="372" y="1013">ほかの欄から決まる値の宣言</text>
<rect class="box" x="840" y="988" width="170" height="41"/>
<rect class="box" x="154" y="1035" width="200" height="75"/>
<text class="label" x="164" y="1060">取り込めない理由</text>
<rect class="box" x="362" y="1035" width="470" height="75"/>
<text class="label" x="372" y="1060">変更を取り込む前に人が見るべき違反（範囲の外 ・ 参照の壊れ ・</text>
<text class="label" x="372" y="1077">指されたものを消す ・ ID の使い直し ・ AI が書いた人の判定 ・ AI</text>
<text class="label" x="372" y="1094">が変えた tool permissions）</text>
<rect class="box" x="840" y="1035" width="170" height="75"/>
<rect class="box" x="154" y="1116" width="200" height="92"/>
<text class="label" x="164" y="1141">セッションの参照</text>
<rect class="box" x="362" y="1116" width="470" height="92"/>
<text class="label" x="372" y="1141">id ・ 根から親までの id の並び。呼ぶ側（harness ・ AI</text>
<text class="label" x="372" y="1158">のツール）が渡す、中身を解釈しない文字列。変更の記録には入れず、</text>
<text class="label" x="372" y="1175">手元のセッションの索引にだけ置く。Q0 のセッション ID（基盤が AI の</text>
<text class="label" x="372" y="1192">validator を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1116" width="170" height="92"/>
<rect class="box" x="154" y="1214" width="200" height="58"/>
<text class="label" x="164" y="1239">手元のセッションの索引</text>
<rect class="box" x="362" y="1214" width="470" height="58"/>
<text class="label" x="372" y="1239">セッションの参照 → 変更の記録の id の並び。</text>
<text class="label" x="372" y="1256">作業した本人の手元だけに置き、コミットしない</text>
<rect class="box" x="840" y="1214" width="170" height="58"/>
<rect class="box" x="154" y="1278" width="200" height="75"/>
<text class="label" x="164" y="1303">変更の項目</text>
<rect class="box" x="362" y="1278" width="470" height="75"/>
<text class="label" x="372" y="1303">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1320">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1337">変更の前後から導く</text>
<rect class="box" x="840" y="1278" width="170" height="75"/>
<rect class="box" x="154" y="1359" width="200" height="58"/>
<text class="label" x="164" y="1384">目的の参照</text>
<rect class="box" x="362" y="1359" width="470" height="58"/>
<text class="label" x="372" y="1384">目的を指す id（ACDR の番号 ・ ボードの論点など）。</text>
<text class="label" x="372" y="1401">基盤は指す先を解釈しない</text>
<rect class="box" x="840" y="1359" width="170" height="58"/>
<rect class="box" x="154" y="1423" width="200" height="58"/>
<text class="label" x="164" y="1448">まとめ方</text>
<rect class="box" x="362" y="1423" width="470" height="58"/>
<text class="label" x="372" y="1448">目的の参照 ・ 対象の条件（コミットされた記録で引く）と、セッション</text>
<text class="label" x="372" y="1465">（手元の索引で引く。作業した本人だけ）。保存せず、出すときに組み立てる</text>
<rect class="box" x="840" y="1423" width="170" height="58"/>
<rect class="box" x="154" y="1487" width="200" height="58"/>
<text class="label" x="164" y="1512">変更の例外</text>
<rect class="box" x="362" y="1487" width="470" height="58"/>
<text class="label" x="372" y="1512">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変更の無い記録 ・</text>
<text class="label" x="372" y="1529">記録の書き換え ・ 変えてよい範囲の外 ・ 状態が変わった</text>
<rect class="box" x="840" y="1487" width="170" height="58"/>
<rect class="box" x="154" y="1551" width="200" height="58"/>
<text class="label" x="164" y="1576">Scaffold する</text>
<rect class="box" x="362" y="1551" width="470" height="58"/>
<text class="label" x="372" y="1576">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1593">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1551" width="170" height="58"/>
<text class="label" x="850" y="1576">意味の宣言</text>
<rect class="box" x="154" y="1615" width="200" height="75"/>
<text class="label" x="164" y="1640">Concrete を照らす</text>
<rect class="box" x="362" y="1615" width="470" height="75"/>
<text class="label" x="372" y="1640">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1657">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1674">意味は見ない）</text>
<rect class="box" x="840" y="1615" width="170" height="75"/>
<text class="label" x="850" y="1640">意味の宣言</text>
<rect class="box" x="154" y="1696" width="200" height="58"/>
<text class="label" x="164" y="1721">Semantic Schema</text>
<text class="label" x="164" y="1738">Resolver</text>
<rect class="box" x="362" y="1696" width="470" height="58"/>
<text class="label" x="372" y="1721">$schema ・ $ref ・ x-ref ・ x-derive ・ 文脈の語彙 ・</text>
<text class="label" x="372" y="1738">公開された言葉の版を解決する</text>
<rect class="box" x="840" y="1696" width="170" height="58"/>
<text class="label" x="850" y="1721">意味の検証</text>
<rect class="box" x="154" y="1760" width="200" height="109"/>
<text class="label" x="164" y="1785">Semantic Schema</text>
<text class="label" x="164" y="1802">Validator</text>
<rect class="box" x="362" y="1760" width="470" height="109"/>
<text class="label" x="372" y="1785">Core の x- と rule は自分で検証し、Concrete が足した x-</text>
<text class="label" x="372" y="1802">は宣言された検証役に任せて結果をまとめる。</text>
<text class="label" x="372" y="1819">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="1836">理由と変更の項目が合っているかは Core の rule として、CI</text>
<text class="label" x="372" y="1853">とレビューの側で毎回判定する</text>
<rect class="box" x="840" y="1760" width="170" height="109"/>
<text class="label" x="850" y="1785">意味の検証</text>
<rect class="box" x="154" y="1875" width="200" height="58"/>
<text class="label" x="164" y="1900">状態を導く</text>
<rect class="box" x="362" y="1875" width="470" height="58"/>
<text class="label" x="372" y="1900">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="1875" width="170" height="58"/>
<text class="label" x="850" y="1900">変更の確かめと例外の判</text>
<text class="label" x="850" y="1917">断</text>
<rect class="box" x="154" y="1939" width="200" height="126"/>
<text class="label" x="164" y="1964">変更を見せる</text>
<rect class="box" x="362" y="1939" width="470" height="126"/>
<text class="label" x="372" y="1964">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="1981">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="1998">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="2015">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="2032">まとまりに入る対象だけを出す。同じ欄を何度も変えた記録は（対象 ・ </text>
<text class="label" x="372" y="2049">欄）ごとにまとめて出す</text>
<rect class="box" x="840" y="1939" width="170" height="126"/>
<text class="label" x="850" y="1964">変更の確かめと例外の判</text>
<text class="label" x="850" y="1981">断</text>
<rect class="box" x="154" y="2071" width="200" height="58"/>
<text class="label" x="164" y="2096">例外をまとめる</text>
<rect class="box" x="362" y="2071" width="470" height="58"/>
<text class="label" x="372" y="2096">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="2113">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="2071" width="170" height="58"/>
<text class="label" x="850" y="2096">変更の確かめと例外の判</text>
<text class="label" x="850" y="2113">断</text>
<rect class="box" x="154" y="2135" width="200" height="58"/>
<text class="label" x="164" y="2160">意味で探して取り出す</text>
<rect class="box" x="362" y="2135" width="470" height="58"/>
<text class="label" x="372" y="2160">term ・ x-ref ・ 文脈の語彙 ・ 判定の結果 ・ 状態で探し、</text>
<text class="label" x="372" y="2177">要る部分だけを返す。探した結果に探した範囲を付ける</text>
<rect class="box" x="840" y="2135" width="170" height="58"/>
<text class="label" x="850" y="2160">意味で探す</text>
<rect class="box" x="154" y="2199" width="200" height="58"/>
<text class="label" x="164" y="2224">Semantic Schema</text>
<text class="label" x="164" y="2241">Renderer</text>
<rect class="box" x="362" y="2199" width="470" height="58"/>
<text class="label" x="372" y="2224">instance を、状態と rule ごとの結果と一緒に人が読む形にする</text>
<rect class="box" x="840" y="2199" width="170" height="58"/>
<text class="label" x="850" y="2224">描画</text>
<rect class="box" x="154" y="2263" width="200" height="58"/>
<text class="label" x="164" y="2288">移す</text>
<rect class="box" x="362" y="2263" width="470" height="58"/>
<text class="label" x="372" y="2288">Abstract の新しい版へ Concrete を合わせる。機械で直せるものは直</text>
<text class="label" x="372" y="2305">し、残りは案内を返す</text>
<rect class="box" x="840" y="2263" width="170" height="58"/>
<text class="label" x="850" y="2288">マイグレーション</text>
<rect class="box" x="154" y="2327" width="200" height="58"/>
<text class="label" x="164" y="2352">取り込む</text>
<rect class="box" x="362" y="2327" width="470" height="58"/>
<text class="label" x="372" y="2352">既存のファイルに $schema を当てて instance にし、</text>
<text class="label" x="372" y="2369">決まらないものを下書きの一覧に出す</text>
<rect class="box" x="840" y="2327" width="170" height="58"/>
<text class="label" x="850" y="2352">instance の作成と変更</text>
<rect class="box" x="154" y="2391" width="200" height="58"/>
<text class="label" x="164" y="2416">公開された言葉の版を出す</text>
<rect class="box" x="362" y="2391" width="470" height="58"/>
<text class="label" x="372" y="2416">Concrete の公開する部分と Abstract の版を、版を並べて出す。</text>
<text class="label" x="372" y="2433">出した版は変えない</text>
<rect class="box" x="840" y="2391" width="170" height="58"/>
