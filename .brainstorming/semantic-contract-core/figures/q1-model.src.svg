<rect class="box" x="154" y="32" width="200" height="92"/>
<text class="label" x="164" y="57">Semantic Abstract</text>
<text class="label" x="164" y="74">Schema</text>
<rect class="box" x="362" y="32" width="470" height="92"/>
<text class="label" x="372" y="57">Core。版（識別子）・ Core の語彙 ・ Concrete の契約（形 ・</text>
<text class="label" x="372" y="74">拡張の契約）・ 一員の形 ・ tool permissions の形 ・</text>
<text class="label" x="372" y="91">閉じた一覧のデータ ・ Core の rule（理由と変更の項目が合っている）</text>
<text class="label" x="372" y="108"> ・ セッションの参照の形 ・ 手元のセッションの索引の形</text>
<rect class="box" x="840" y="32" width="170" height="92"/>
