<rect class="box" x="362" y="241" width="470" height="41"/>
<text class="label" x="372" y="266">文脈。欄の値 ・ 従う Concrete（$schema）</text>
<rect class="box" x="840" y="241" width="170" height="41"/>
<text class="label" x="850" y="266">instance の作成と変更</text>
<rect class="box" x="154" y="288" width="200" height="58"/>
<text class="label" x="164" y="313">ページテンプレート</text>
<rect class="box" x="362" y="288" width="470" height="58"/>
<text class="label" x="372" y="313">文脈。kind ごとの節 ・ 部品 ・ 値を取る式。</text>
<text class="label" x="372" y="330">形と参照の検査だけを持つ</text>
<rect class="box" x="840" y="288" width="170" height="58"/>
<text class="label" x="850" y="313">描画</text>
<rect class="box" x="154" y="352" width="200" height="58"/>
<text class="label" x="164" y="377">表示の組</text>
<rect class="box" x="362" y="352" width="470" height="58"/>
<text class="label" x="372" y="377">文脈。部品のカタログとデザインシステム（トークン）。</text>
<text class="label" x="372" y="394">カタログがトークン名とコントラストの組で指すので一緒に変える</text>
<rect class="box" x="840" y="352" width="170" height="58"/>
<text class="label" x="850" y="377">描画</text>
<rect class="box" x="154" y="416" width="200" height="58"/>
<text class="label" x="164" y="441">判定の記録</text>
<rect class="box" x="362" y="416" width="470" height="58"/>
<text class="label" x="372" y="441">文脈（形は Abstract）。判定した値 ・ 結果 ・ 根拠 ・ 判定した者</text>
<rect class="box" x="840" y="416" width="170" height="58"/>
<text class="label" x="850" y="441">変更の確かめと</text>
<text class="label" x="850" y="458">例外の判断</text>
<rect class="box" x="154" y="480" width="200" height="75"/>
<text class="label" x="164" y="505">変更の記録</text>
<rect class="box" x="362" y="480" width="470" height="75"/>
<text class="label" x="372" y="505">文脈（形は Abstract）。id ・ 理由 ・ 目的の参照 ・ 書いた者の種類 ・</text>
<text class="label" x="372" y="522">変更の項目の並び。セッション ID は持たない。</text>
<text class="label" x="372" y="539">instance との一致はマージの時点で確かめる（結果整合）</text>
<rect class="box" x="840" y="480" width="170" height="75"/>
<text class="label" x="850" y="505">変更の確かめと</text>
<text class="label" x="850" y="522">例外の判断</text>
<rect class="box" x="154" y="561" width="200" height="41"/>
<text class="label" x="164" y="586">rule</text>
<rect class="box" x="362" y="561" width="470" height="41"/>
<text class="label" x="372" y="586">id ・ rule ・ why ・ test ・ 判定する者 ・ 読む欄 ・ 使う term</text>
<rect class="box" x="840" y="561" width="170" height="41"/>
<rect class="box" x="154" y="608" width="200" height="41"/>
<text class="label" x="164" y="633">term</text>
<rect class="box" x="362" y="608" width="470" height="41"/>
<text class="label" x="372" y="633">版付きの名前と定義</text>
<rect class="box" x="840" y="608" width="170" height="41"/>
<rect class="box" x="154" y="655" width="200" height="41"/>
<text class="label" x="164" y="680">拡張した x- の定義</text>
<rect class="box" x="362" y="655" width="470" height="41"/>
<text class="label" x="372" y="680">名前（範囲は $id）・ 値の形 ・ 意味 ・ 任せる検証役の名前</text>
<rect class="box" x="840" y="655" width="170" height="41"/>
<rect class="box" x="154" y="702" width="200" height="41"/>
<text class="label" x="164" y="727">公開された言葉の版</text>
<rect class="box" x="362" y="702" width="470" height="41"/>
<text class="label" x="372" y="727">Concrete の公開する部分の版。出した版は変えない</text>
<rect class="box" x="840" y="702" width="170" height="41"/>
<rect class="box" x="154" y="749" width="200" height="58"/>
<text class="label" x="164" y="774">検証結果</text>
<rect class="box" x="362" y="749" width="470" height="58"/>
<text class="label" x="372" y="774">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="791">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="749" width="170" height="58"/>
<rect class="box" x="154" y="813" width="200" height="75"/>
<text class="label" x="164" y="838">判定した値</text>
<rect class="box" x="362" y="813" width="470" height="75"/>
<text class="label" x="372" y="838">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。AI は</text>
<text class="label" x="372" y="855">validator、外のツールは名前と版も）。いまの値との比べ方は JSON</text>
<text class="label" x="372" y="872">Schema の等しさの定義に従う</text>
<rect class="box" x="840" y="813" width="170" height="75"/>
<rect class="box" x="154" y="894" width="200" height="41"/>
<text class="label" x="164" y="919">view</text>
<rect class="box" x="362" y="894" width="470" height="41"/>
<text class="label" x="372" y="919">ページテンプレート ・ カタログ ・ デザインシステムの参照</text>
<rect class="box" x="840" y="894" width="170" height="41"/>
<rect class="box" x="154" y="941" width="200" height="41"/>
<text class="label" x="164" y="966">validator の割り当て</text>
<rect class="box" x="362" y="941" width="470" height="41"/>
<text class="label" x="372" y="966">rule と x- ごとの validator の名前（AI はモデルの名前まで）</text>
<rect class="box" x="840" y="941" width="170" height="41"/>
<rect class="box" x="154" y="988" width="200" height="41"/>
<text class="label" x="164" y="1013">変えてよい範囲</text>
<rect class="box" x="362" y="988" width="470" height="41"/>
<text class="label" x="372" y="1013">AI が書いてよい欄</text>
<rect class="box" x="840" y="988" width="170" height="41"/>
<rect class="box" x="154" y="1035" width="200" height="41"/>
<text class="label" x="164" y="1060">x-prompt</text>
<rect class="box" x="362" y="1035" width="470" height="41"/>
<text class="label" x="372" y="1060">書く単位ごとの案内</text>
<rect class="box" x="840" y="1035" width="170" height="41"/>
<rect class="box" x="154" y="1082" width="200" height="41"/>
<text class="label" x="164" y="1107">参照（x-relationship）</text>
<rect class="box" x="362" y="1082" width="470" height="41"/>
<text class="label" x="372" y="1107">ほかの instance、またはほかの文脈の公開された言葉の版を指す</text>
<rect class="box" x="840" y="1082" width="170" height="41"/>
<rect class="box" x="154" y="1129" width="200" height="41"/>
<text class="label" x="164" y="1154">導出（x-derive）</text>
<rect class="box" x="362" y="1129" width="470" height="41"/>
<text class="label" x="372" y="1154">ほかの欄から決まる値の宣言</text>
<rect class="box" x="840" y="1129" width="170" height="41"/>
<rect class="box" x="154" y="1176" width="200" height="58"/>
<text class="label" x="164" y="1201">取り込めない理由</text>
<rect class="box" x="362" y="1176" width="470" height="58"/>
<text class="label" x="372" y="1201">変更を取り込む前に人が見るべき違反（範囲の外 ・ 参照の壊れ ・</text>
<text class="label" x="372" y="1218">指されたものを消す ・ ID の使い直し ・ AI が書いた人の判定）</text>
<rect class="box" x="840" y="1176" width="170" height="58"/>
<rect class="box" x="154" y="1240" width="200" height="92"/>
<text class="label" x="164" y="1265">セッションの参照</text>
<rect class="box" x="362" y="1240" width="470" height="92"/>
<text class="label" x="372" y="1265">id ・ 根から親までの id の並び。呼ぶ側（harness ・ AI</text>
<text class="label" x="372" y="1282">のツール）が渡す、中身を解釈しない文字列。変更の記録には入れず、</text>
<text class="label" x="372" y="1299">手元のセッションの索引にだけ置く。Q0 のセッション ID（基盤が AI の</text>
<text class="label" x="372" y="1316">validator を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1240" width="170" height="92"/>
<rect class="box" x="154" y="1338" width="200" height="58"/>
<text class="label" x="164" y="1363">手元のセッションの索引</text>
<rect class="box" x="362" y="1338" width="470" height="58"/>
<text class="label" x="372" y="1363">セッションの参照 → 変更の記録の id の並び。</text>
<text class="label" x="372" y="1380">作業した本人の手元だけに置き、コミットしない</text>
<rect class="box" x="840" y="1338" width="170" height="58"/>
<rect class="box" x="154" y="1402" width="200" height="92"/>
<text class="label" x="164" y="1427">関係の索引</text>
<rect class="box" x="362" y="1402" width="470" height="92"/>
<text class="label" x="372" y="1427">instance の id ・ kind（範囲は Concrete の $id）・</text>
<text class="label" x="372" y="1444">x-relationship（指す側 → 指される側 ・ 公開された版）。</text>
<text class="label" x="372" y="1461">正本のファイルから作り直せ、コミットしない。形は遅いと測れてから</text>
<text class="label" x="372" y="1478">Abstract に足す</text>
<rect class="box" x="840" y="1402" width="170" height="92"/>
<rect class="box" x="154" y="1500" width="200" height="75"/>
<text class="label" x="164" y="1525">変更の項目</text>
<rect class="box" x="362" y="1500" width="470" height="75"/>
<text class="label" x="372" y="1525">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1542">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1559">変更の前後から導く</text>
<rect class="box" x="840" y="1500" width="170" height="75"/>
<rect class="box" x="154" y="1581" width="200" height="58"/>
<text class="label" x="164" y="1606">目的の参照</text>
<rect class="box" x="362" y="1581" width="470" height="58"/>
<text class="label" x="372" y="1606">目的を指す id（ACDR の番号 ・ ボードの論点など）。</text>
<text class="label" x="372" y="1623">基盤は指す先を解釈しない</text>
<rect class="box" x="840" y="1581" width="170" height="58"/>
<rect class="box" x="154" y="1645" width="200" height="58"/>
<text class="label" x="164" y="1670">まとめ方</text>
<rect class="box" x="362" y="1645" width="470" height="58"/>
<text class="label" x="372" y="1670">目的の参照 ・ 対象の条件（コミットされた記録で引く）と、セッション</text>
<text class="label" x="372" y="1687">（手元の索引で引く。作業した本人だけ）。保存せず、出すときに組み立てる</text>
<rect class="box" x="840" y="1645" width="170" height="58"/>
<rect class="box" x="154" y="1709" width="200" height="58"/>
<text class="label" x="164" y="1734">変更の例外</text>
<rect class="box" x="362" y="1709" width="470" height="58"/>
<text class="label" x="372" y="1734">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変更の無い記録 ・</text>
<text class="label" x="372" y="1751">記録の書き換え ・ 変えてよい範囲の外 ・ 状態が変わった</text>
<rect class="box" x="840" y="1709" width="170" height="58"/>
<rect class="box" x="154" y="1773" width="200" height="58"/>
<text class="label" x="164" y="1798">Scaffold する</text>
<rect class="box" x="362" y="1773" width="470" height="58"/>
<text class="label" x="372" y="1798">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1815">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1773" width="170" height="58"/>
<text class="label" x="850" y="1798">意味の宣言</text>
<rect class="box" x="154" y="1837" width="200" height="75"/>
<text class="label" x="164" y="1862">Concrete を照らす</text>
<rect class="box" x="362" y="1837" width="470" height="75"/>
<text class="label" x="372" y="1862">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1879">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1896">意味は見ない）</text>
<rect class="box" x="840" y="1837" width="170" height="75"/>
<text class="label" x="850" y="1862">意味の宣言</text>
<rect class="box" x="154" y="1918" width="200" height="58"/>
<text class="label" x="164" y="1943">Semantic Schema</text>
<text class="label" x="164" y="1960">Resolver</text>
<rect class="box" x="362" y="1918" width="470" height="58"/>
<text class="label" x="372" y="1943">$schema ・ $ref ・ x-relationship ・ x-derive ・ glossary ・</text>
<text class="label" x="372" y="1960">公開された言葉の版を解決する</text>
<rect class="box" x="840" y="1918" width="170" height="58"/>
<text class="label" x="850" y="1943">意味の検証</text>
<rect class="box" x="154" y="1982" width="200" height="109"/>
<text class="label" x="164" y="2007">Semantic Schema</text>
<text class="label" x="164" y="2024">Validator</text>
<rect class="box" x="362" y="1982" width="470" height="109"/>
<text class="label" x="372" y="2007">Core の x- と rule は自分で検証し、Concrete が足した x-</text>
<text class="label" x="372" y="2024">は宣言された検証役に任せて結果をまとめる。</text>
<text class="label" x="372" y="2041">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="2058">理由と変更の項目が合っているかは Core の rule として、CI</text>
<text class="label" x="372" y="2075">とレビューの側で毎回判定する</text>
<rect class="box" x="840" y="1982" width="170" height="109"/>
<text class="label" x="850" y="2007">意味の検証</text>
<rect class="box" x="154" y="2097" width="200" height="58"/>
<text class="label" x="164" y="2122">状態を導く</text>
<rect class="box" x="362" y="2097" width="470" height="58"/>
<text class="label" x="372" y="2122">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="2097" width="170" height="58"/>
<text class="label" x="850" y="2122">変更の確かめと</text>
<text class="label" x="850" y="2139">例外の判断</text>
<rect class="box" x="154" y="2161" width="200" height="126"/>
<text class="label" x="164" y="2186">変更を見せる</text>
<rect class="box" x="362" y="2161" width="470" height="126"/>
<text class="label" x="372" y="2186">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="2203">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="2220">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="2237">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="2254">まとまりに入る対象だけを出す。同じ欄を何度も変えた記録は（対象 ・ </text>
<text class="label" x="372" y="2271">欄）ごとにまとめて出す</text>
<rect class="box" x="840" y="2161" width="170" height="126"/>
<text class="label" x="850" y="2186">変更の確かめと</text>
<text class="label" x="850" y="2203">例外の判断</text>
<rect class="box" x="154" y="2293" width="200" height="58"/>
<text class="label" x="164" y="2318">例外をまとめる</text>
<rect class="box" x="362" y="2293" width="470" height="58"/>
<text class="label" x="372" y="2318">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="2335">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="2293" width="170" height="58"/>
<text class="label" x="850" y="2318">変更の確かめと</text>
<text class="label" x="850" y="2335">例外の判断</text>
<rect class="box" x="154" y="2357" width="200" height="58"/>
<text class="label" x="164" y="2382">意味で探して取り出す</text>
<rect class="box" x="362" y="2357" width="470" height="58"/>
<text class="label" x="372" y="2382">term ・ x-relationship ・ glossary ・ 判定の結果 ・ 状態で探し、</text>
<text class="label" x="372" y="2399">要る部分だけを返す。探した結果に探した範囲を付ける</text>
<rect class="box" x="840" y="2357" width="170" height="58"/>
<text class="label" x="850" y="2382">意味で探す</text>
<rect class="box" x="154" y="2421" width="200" height="58"/>
<text class="label" x="164" y="2446">Semantic Schema</text>
<text class="label" x="164" y="2463">Renderer</text>
<rect class="box" x="362" y="2421" width="470" height="58"/>
<text class="label" x="372" y="2446">instance を、状態と rule ごとの結果と一緒に人が読む形にする</text>
<rect class="box" x="840" y="2421" width="170" height="58"/>
