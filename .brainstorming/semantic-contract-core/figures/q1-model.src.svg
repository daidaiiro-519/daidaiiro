<rect class="box" x="362" y="399" width="470" height="58"/>
<text class="label" x="372" y="424">文脈（形は Abstract）。判定した値 ・ 結果 ・ 根拠 ・ 判定した者</text>
<rect class="box" x="840" y="399" width="170" height="58"/>
<text class="label" x="850" y="424">変更の確かめと</text>
<text class="label" x="850" y="441">例外の判断</text>
<rect class="box" x="154" y="463" width="200" height="75"/>
<text class="label" x="164" y="488">変更の記録</text>
<rect class="box" x="362" y="463" width="470" height="75"/>
<text class="label" x="372" y="488">文脈（形は Abstract）。id ・ 理由 ・ 目的の参照 ・ 書いた者の種類 ・</text>
<text class="label" x="372" y="505">変更の項目の並び。セッション ID は持たない。</text>
<text class="label" x="372" y="522">instance との一致はマージの時点で確かめる（結果整合）</text>
<rect class="box" x="840" y="463" width="170" height="75"/>
<text class="label" x="850" y="488">変更の確かめと</text>
<text class="label" x="850" y="505">例外の判断</text>
<rect class="box" x="154" y="544" width="200" height="41"/>
<text class="label" x="164" y="569">rule</text>
<rect class="box" x="362" y="544" width="470" height="41"/>
<text class="label" x="372" y="569">id ・ rule ・ why ・ test ・ 判定する者 ・ 読む欄 ・ 使う term</text>
<rect class="box" x="840" y="544" width="170" height="41"/>
<rect class="box" x="154" y="591" width="200" height="41"/>
<text class="label" x="164" y="616">term</text>
<rect class="box" x="362" y="591" width="470" height="41"/>
<text class="label" x="372" y="616">版付きの名前と定義</text>
<rect class="box" x="840" y="591" width="170" height="41"/>
<rect class="box" x="154" y="638" width="200" height="58"/>
<text class="label" x="164" y="663">拡張した x- の定義</text>
<rect class="box" x="362" y="638" width="470" height="58"/>
<rect class="box" x="840" y="638" width="170" height="58"/>
<text class="label" x="372" y="663">名前（範囲は $id）・ 値の形 ・ 意味（description と x-prompt）。</text>
<text class="label" x="372" y="680">判定は x-prompt の rule が持つ</text>
<rect class="box" x="154" y="702" width="200" height="41"/>
<text class="label" x="164" y="727">公開された言葉の版</text>
<rect class="box" x="362" y="702" width="470" height="41"/>
<text class="label" x="372" y="727">Concrete の公開する部分の版。出した版は変えない</text>
<rect class="box" x="840" y="702" width="170" height="41"/>
<rect class="box" x="154" y="749" width="200" height="58"/>
<text class="label" x="164" y="774">検証結果</text>
<rect class="box" x="362" y="749" width="470" height="58"/>
<text class="label" x="372" y="774">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="791">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="749" width="170" height="58"/>
<rect class="box" x="154" y="813" width="200" height="75"/>
<text class="label" x="164" y="838">判定した値</text>
<rect class="box" x="362" y="813" width="470" height="75"/>
<rect class="box" x="840" y="813" width="170" height="75"/>
<text class="label" x="372" y="838">判定したときに読んだ値（読む欄 ・ term ・ 参照先の値。</text>
<text class="label" x="372" y="855">AI は任せる先の名前とモデル、外のツールは名前と版も）。</text>
<text class="label" x="372" y="872">いまの値との比べ方は JSON Schema の等しさの定義に従う</text>
<rect class="box" x="154" y="894" width="200" height="41"/>
<text class="label" x="164" y="919">view</text>
<rect class="box" x="362" y="894" width="470" height="41"/>
<text class="label" x="372" y="919">ページテンプレート ・ カタログ ・ デザインシステムの参照</text>
<rect class="box" x="840" y="894" width="170" height="41"/>
<rect class="box" x="154" y="941" width="200" height="109"/>
<rect class="box" x="362" y="941" width="470" height="109"/>
<rect class="box" x="840" y="941" width="170" height="109"/>
<text class="label" x="372" y="966">Concrete が子のセッションに任せられる Concrete の一覧</text>
<text class="label" x="372" y="983">（名前 ・ role ・ Concrete の URN ・ モデル）。</text>
<text class="label" x="372" y="1000">親と子はセッションごとに決まる関係で、同じ Concrete</text>
<text class="label" x="372" y="1017">が親にも子にもなる。</text>
<text class="label" x="372" y="1034">親（オーケストレーター）自身は、自分の任せる先に載せない</text>
<text class="label" x="164" y="966">任せる先</text>
<rect class="box" x="154" y="1056" width="200" height="58"/>
<rect class="box" x="362" y="1056" width="470" height="58"/>
<rect class="box" x="840" y="1056" width="170" height="58"/>
<text class="label" x="372" y="1081">欄ごとの、その欄の値を決めるのは人である、という宣言。</text>
<text class="label" x="372" y="1098">AI が書き写すのはよいが、値は人の入口から来たものでなければならない</text>
<text class="label" x="164" y="1081">決定権</text>
<rect class="box" x="154" y="1120" width="200" height="41"/>
<text class="label" x="164" y="1145">x-prompt</text>
<rect class="box" x="362" y="1120" width="470" height="41"/>
<text class="label" x="372" y="1145">書く単位ごとの案内</text>
<rect class="box" x="840" y="1120" width="170" height="41"/>
<rect class="box" x="154" y="1167" width="200" height="41"/>
<text class="label" x="164" y="1192">参照（x-relationship）</text>
<rect class="box" x="362" y="1167" width="470" height="41"/>
<text class="label" x="372" y="1192">ほかの instance、またはほかの文脈の公開された言葉の版を指す</text>
<rect class="box" x="840" y="1167" width="170" height="41"/>
<rect class="box" x="154" y="1214" width="200" height="41"/>
<rect class="box" x="362" y="1214" width="470" height="41"/>
<rect class="box" x="840" y="1214" width="170" height="41"/>
<text class="label" x="164" y="1239">導出（x-derived-from）</text>
<text class="label" x="372" y="1239">ほかの欄から決まる値の宣言と、その依存</text>
<rect class="box" x="154" y="1261" width="200" height="75"/>
<text class="label" x="164" y="1286">取り込めない理由</text>
<rect class="box" x="362" y="1261" width="470" height="75"/>
<rect class="box" x="840" y="1261" width="170" height="75"/>
<text class="label" x="372" y="1286">変更を取り込む前に人が見るべき違反（人が決める欄の書き換え ・</text>
<text class="label" x="372" y="1303">参照の壊れ ・ 指されたものを消す ・ ID の使い直し ・</text>
<text class="label" x="372" y="1320">AI が書いた人の判定）</text>
<rect class="box" x="154" y="1342" width="200" height="92"/>
<text class="label" x="164" y="1367">セッションの参照</text>
<rect class="box" x="362" y="1342" width="470" height="92"/>
<text class="label" x="372" y="1367">id ・ 根から親までの id の並び。呼ぶ側（harness ・ AI</text>
<text class="label" x="372" y="1384">のツール）が渡す、中身を解釈しない文字列。変更の記録には入れず、</text>
<text class="label" x="372" y="1401">手元のセッションの索引にだけ置く。Q0 のセッション ID（基盤が AI の</text>
<text class="label" x="372" y="1418">validator を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1342" width="170" height="92"/>
<rect class="box" x="154" y="1440" width="200" height="58"/>
<text class="label" x="164" y="1465">手元のセッションの索引</text>
<rect class="box" x="362" y="1440" width="470" height="58"/>
<text class="label" x="372" y="1465">セッションの参照 → 変更の記録の id の並び。</text>
<text class="label" x="372" y="1482">作業した本人の手元だけに置き、コミットしない</text>
<rect class="box" x="840" y="1440" width="170" height="58"/>
<rect class="box" x="154" y="1504" width="200" height="92"/>
<text class="label" x="164" y="1529">関係の索引</text>
<rect class="box" x="362" y="1504" width="470" height="92"/>
<text class="label" x="372" y="1529">instance の id ・ kind（範囲は Concrete の $id）・</text>
<text class="label" x="372" y="1546">x-relationship（指す側 → 指される側 ・ 公開された版）。</text>
<text class="label" x="372" y="1563">正本のファイルから作り直せ、コミットしない。形は遅いと測れてから</text>
<text class="label" x="372" y="1580">Abstract に足す</text>
<rect class="box" x="840" y="1504" width="170" height="92"/>
<rect class="box" x="154" y="1602" width="200" height="75"/>
<text class="label" x="164" y="1627">変更の項目</text>
<rect class="box" x="362" y="1602" width="470" height="75"/>
<text class="label" x="372" y="1627">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1644">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1661">変更の前後から導く</text>
<rect class="box" x="840" y="1602" width="170" height="75"/>
<rect class="box" x="154" y="1683" width="200" height="58"/>
<text class="label" x="164" y="1708">目的の参照</text>
<rect class="box" x="362" y="1683" width="470" height="58"/>
<text class="label" x="372" y="1708">目的を指す id（ACDR の番号 ・ ボードの論点など）。</text>
<text class="label" x="372" y="1725">基盤は指す先を解釈しない</text>
<rect class="box" x="840" y="1683" width="170" height="58"/>
<rect class="box" x="154" y="1747" width="200" height="58"/>
<text class="label" x="164" y="1772">まとめ方</text>
<rect class="box" x="362" y="1747" width="470" height="58"/>
<text class="label" x="372" y="1772">目的の参照 ・ 対象の条件（コミットされた記録で引く）と、セッション</text>
<text class="label" x="372" y="1789">（手元の索引で引く。作業した本人だけ）。保存せず、出すときに組み立てる</text>
<rect class="box" x="840" y="1747" width="170" height="58"/>
<rect class="box" x="154" y="1811" width="200" height="58"/>
<text class="label" x="164" y="1836">変更の例外</text>
<rect class="box" x="362" y="1811" width="470" height="58"/>
<rect class="box" x="840" y="1811" width="170" height="58"/>
<text class="label" x="372" y="1836">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変更の無い記録 ・</text>
<text class="label" x="372" y="1853">記録の書き換え ・ 人が決める欄の書き換え ・ 状態が変わった</text>
<rect class="box" x="154" y="1875" width="200" height="58"/>
<text class="label" x="164" y="1900">Scaffold する</text>
<rect class="box" x="362" y="1875" width="470" height="58"/>
<text class="label" x="372" y="1900">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1917">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1875" width="170" height="58"/>
<text class="label" x="850" y="1900">意味の宣言</text>
<rect class="box" x="154" y="1939" width="200" height="75"/>
<text class="label" x="164" y="1964">Concrete を照らす</text>
<rect class="box" x="362" y="1939" width="470" height="75"/>
<text class="label" x="372" y="1964">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1981">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1998">意味は見ない）</text>
<rect class="box" x="840" y="1939" width="170" height="75"/>
<text class="label" x="850" y="1964">意味の宣言</text>
<rect class="box" x="154" y="2020" width="200" height="58"/>
<text class="label" x="164" y="2045">Semantic Schema</text>
<text class="label" x="164" y="2062">Resolver</text>
<rect class="box" x="362" y="2020" width="470" height="58"/>
<rect class="box" x="840" y="2020" width="170" height="58"/>
<text class="label" x="372" y="2045">$schema ・ $ref ・ x-relationship ・ x-derived-from ・</text>
<text class="label" x="372" y="2062">glossary ・ 公開された言葉の版を解決する</text>
<text class="label" x="850" y="2045">意味の検証</text>
<rect class="box" x="154" y="2084" width="200" height="109"/>
<text class="label" x="164" y="2109">Semantic Schema</text>
<text class="label" x="164" y="2126">Validator</text>
<rect class="box" x="362" y="2084" width="470" height="109"/>
<rect class="box" x="840" y="2084" width="170" height="109"/>
<text class="label" x="372" y="2109">Core の x- と rule は自分で検証し、Concrete が足した x- は、</text>
<text class="label" x="372" y="2126">rule の agent が指す任せる先に任せて結果をまとめる。</text>
<text class="label" x="372" y="2143">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="2160">理由と変更の項目が合っているかは Core の rule として、CI</text>
<text class="label" x="372" y="2177">とレビューの側で毎回判定する</text>
<text class="label" x="850" y="2109">意味の検証</text>
<rect class="box" x="154" y="2199" width="200" height="58"/>
<text class="label" x="164" y="2224">状態を導く</text>
<rect class="box" x="362" y="2199" width="470" height="58"/>
<text class="label" x="372" y="2224">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="2199" width="170" height="58"/>
<text class="label" x="850" y="2224">変更の確かめと</text>
<text class="label" x="850" y="2241">例外の判断</text>
<rect class="box" x="154" y="2263" width="200" height="126"/>
<text class="label" x="164" y="2288">変更を見せる</text>
<rect class="box" x="362" y="2263" width="470" height="126"/>
<text class="label" x="372" y="2288">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="2305">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="2322">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="2339">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="2356">まとまりに入る対象だけを出す。同じ欄を何度も変えた記録は（対象 ・ </text>
<text class="label" x="372" y="2373">欄）ごとにまとめて出す</text>
<rect class="box" x="840" y="2263" width="170" height="126"/>
<text class="label" x="850" y="2288">変更の確かめと</text>
<text class="label" x="850" y="2305">例外の判断</text>
<rect class="box" x="154" y="2395" width="200" height="58"/>
<text class="label" x="164" y="2420">例外をまとめる</text>
<rect class="box" x="362" y="2395" width="470" height="58"/>
<text class="label" x="372" y="2420">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="2437">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="2395" width="170" height="58"/>
<text class="label" x="850" y="2420">変更の確かめと</text>
<text class="label" x="850" y="2437">例外の判断</text>
<rect class="box" x="154" y="2459" width="200" height="58"/>
<text class="label" x="164" y="2484">意味で探して取り出す</text>
<rect class="box" x="362" y="2459" width="470" height="58"/>
<text class="label" x="372" y="2484">term ・ x-relationship ・ glossary ・ 判定の結果 ・ 状態で探し、</text>
