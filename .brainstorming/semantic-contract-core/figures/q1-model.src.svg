<rect class="box" x="362" y="1048" width="470" height="75"/>
<text class="label" x="372" y="1073">id ・ 親の id ・ 作業した者。呼ぶ側の申告で、基盤は確かめない。Q0</text>
<text class="label" x="372" y="1090">のセッション ID（基盤が AI の validator</text>
<text class="label" x="372" y="1107">を続けて呼ぶためのもの）とは別</text>
<rect class="box" x="840" y="1048" width="170" height="75"/>
<rect class="box" x="154" y="1129" width="200" height="75"/>
<text class="label" x="164" y="1154">変更の項目</text>
<rect class="box" x="362" y="1129" width="470" height="75"/>
<text class="label" x="372" y="1154">対象（Concrete ・ instance ・ 判定の記録）・ 欄（JSON Pointer</text>
<text class="label" x="372" y="1171">）・ 項目ごとの理由（変更の理由と違うときだけ）。前後の値は持たず、</text>
<text class="label" x="372" y="1188">変更の前後から導く</text>
<rect class="box" x="840" y="1129" width="170" height="75"/>
<rect class="box" x="154" y="1210" width="200" height="58"/>
<text class="label" x="164" y="1235">まとめ方</text>
<rect class="box" x="362" y="1210" width="470" height="58"/>
<text class="label" x="372" y="1235">セッション ・ 目的 ・ 対象の条件。保存せず、</text>
<text class="label" x="372" y="1252">出すときに紐づく変更の記録を取り出して組み立てる</text>
<rect class="box" x="840" y="1210" width="170" height="58"/>
<rect class="box" x="154" y="1274" width="200" height="58"/>
<text class="label" x="164" y="1299">変更の例外</text>
<rect class="box" x="362" y="1274" width="470" height="58"/>
<text class="label" x="372" y="1299">理由が無い ・ 理由が合わない ・ 記録に無い ・ 変えてよい範囲の外 ・</text>
<text class="label" x="372" y="1316">状態が変わった</text>
<rect class="box" x="840" y="1274" width="170" height="58"/>
<rect class="box" x="154" y="1338" width="200" height="58"/>
<text class="label" x="164" y="1363">Scaffold する</text>
<rect class="box" x="362" y="1338" width="470" height="58"/>
<text class="label" x="372" y="1363">Abstract から Concrete の雛形、Concrete から instance</text>
<text class="label" x="372" y="1380">の雛形を作る（2段）</text>
<rect class="box" x="840" y="1338" width="170" height="58"/>
<text class="label" x="850" y="1363">意味の宣言</text>
<rect class="box" x="154" y="1402" width="200" height="75"/>
<text class="label" x="164" y="1427">Concrete を照らす</text>
<rect class="box" x="362" y="1402" width="470" height="75"/>
<text class="label" x="372" y="1427">Concrete が Abstract の版 ・ Concrete の契約 ・</text>
<text class="label" x="372" y="1444">拡張の作法に従うかを検査する（足した x- の定義が作法に従うかを含む。</text>
<text class="label" x="372" y="1461">意味は見ない）</text>
<rect class="box" x="840" y="1402" width="170" height="75"/>
<text class="label" x="850" y="1427">意味の宣言</text>
<rect class="box" x="154" y="1483" width="200" height="58"/>
<text class="label" x="164" y="1508">Semantic Schema</text>
<text class="label" x="164" y="1525">Resolver</text>
<rect class="box" x="362" y="1483" width="470" height="58"/>
<text class="label" x="372" y="1508">$schema ・ $ref ・ x-ref ・ x-derive ・ 文脈の語彙 ・</text>
<text class="label" x="372" y="1525">公開された言葉の版を解決する</text>
<rect class="box" x="840" y="1483" width="170" height="58"/>
<text class="label" x="850" y="1508">意味の検証</text>
<rect class="box" x="154" y="1547" width="200" height="109"/>
<text class="label" x="164" y="1572">Semantic Schema</text>
<text class="label" x="164" y="1589">Validator</text>
<rect class="box" x="362" y="1547" width="470" height="109"/>
<text class="label" x="372" y="1572">Core の x- と rule は自分で検証し、Concrete が足した x-</text>
<text class="label" x="372" y="1589">は宣言された検証役に任せて結果をまとめる。</text>
<text class="label" x="372" y="1606">判定した値がいまと同じ判定の記録は使い直す。</text>
<text class="label" x="372" y="1623">理由と変更の項目が合っているかは Core の rule として、変更を書いた</text>
<text class="label" x="372" y="1640">AI と別のセッションの AI に判定させる</text>
<rect class="box" x="840" y="1547" width="170" height="109"/>
<text class="label" x="850" y="1572">意味の検証</text>
<rect class="box" x="154" y="1662" width="200" height="58"/>
<text class="label" x="164" y="1687">状態を導く</text>
<rect class="box" x="362" y="1662" width="470" height="58"/>
<text class="label" x="372" y="1687">検証結果と判定の記録から、instance の状態を決定表で導く</text>
<rect class="box" x="840" y="1662" width="170" height="58"/>
<text class="label" x="850" y="1687">変更の確かめと例外の判</text>
<text class="label" x="850" y="1704">断</text>
<rect class="box" x="154" y="1726" width="200" height="109"/>
<text class="label" x="164" y="1751">変更を見せる</text>
<rect class="box" x="362" y="1726" width="470" height="109"/>
<text class="label" x="372" y="1751">変更（取り込みを含む）の後の姿で全 instance を検証し、状態 ・</text>
<text class="label" x="372" y="1768">変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<text class="label" x="372" y="1785">まとめ方を渡すと、紐づく変更の記録を取り出し、変更の例外 → 目的 →</text>
<text class="label" x="372" y="1802">対象ごとの意味の差分と理由 → 検証の結果の順で、</text>
<text class="label" x="372" y="1819">まとまりに入る対象だけを出す</text>
<rect class="box" x="840" y="1726" width="170" height="109"/>
<text class="label" x="850" y="1751">変更の確かめと例外の判</text>
<text class="label" x="850" y="1768">断</text>
<rect class="box" x="154" y="1841" width="200" height="58"/>
<text class="label" x="164" y="1866">例外をまとめる</text>
<rect class="box" x="362" y="1841" width="470" height="58"/>
<text class="label" x="372" y="1866">判定できなかった rule を原因（rule ・ 入力の変化 ・</text>
<text class="label" x="372" y="1883">validator）ごとにまとめ、人が判断できる形にする</text>
<rect class="box" x="840" y="1841" width="170" height="58"/>
<text class="label" x="850" y="1866">変更の確かめと例外の判</text>
<text class="label" x="850" y="1883">断</text>
<rect class="box" x="154" y="1905" width="200" height="58"/>
<text class="label" x="164" y="1930">意味で探して取り出す</text>
<rect class="box" x="362" y="1905" width="470" height="58"/>
<text class="label" x="372" y="1930">term ・ x-ref ・ 文脈の語彙 ・ 判定の結果 ・ 状態で探し、</text>
<text class="label" x="372" y="1947">要る部分だけを返す</text>
<rect class="box" x="840" y="1905" width="170" height="58"/>
<text class="label" x="850" y="1930">意味で探す</text>
<rect class="box" x="154" y="1969" width="200" height="58"/>
<text class="label" x="164" y="1994">Semantic Schema</text>
<text class="label" x="164" y="2011">Renderer</text>
<rect class="box" x="362" y="1969" width="470" height="58"/>
<text class="label" x="372" y="1994">instance を、状態と rule ごとの結果と一緒に人が読む形にする</text>
<rect class="box" x="840" y="1969" width="170" height="58"/>
<text class="label" x="850" y="1994">描画</text>
<rect class="box" x="154" y="2033" width="200" height="58"/>
<text class="label" x="164" y="2058">移す</text>
<rect class="box" x="362" y="2033" width="470" height="58"/>
<text class="label" x="372" y="2058">Abstract の新しい版へ Concrete を合わせる。機械で直せるものは直</text>
<text class="label" x="372" y="2075">し、残りは案内を返す</text>
<rect class="box" x="840" y="2033" width="170" height="58"/>
<text class="label" x="850" y="2058">マイグレーション</text>
<rect class="box" x="154" y="2097" width="200" height="58"/>
<text class="label" x="164" y="2122">取り込む</text>
<rect class="box" x="362" y="2097" width="470" height="58"/>
<text class="label" x="372" y="2122">既存のファイルに $schema を当てて instance にし、</text>
<text class="label" x="372" y="2139">決まらないものを下書きの一覧に出す</text>
<rect class="box" x="840" y="2097" width="170" height="58"/>
<text class="label" x="850" y="2122">instance の作成と変更</text>
<rect class="box" x="154" y="2161" width="200" height="58"/>
<text class="label" x="164" y="2186">公開された言葉の版を出す</text>
<rect class="box" x="362" y="2161" width="470" height="58"/>
<text class="label" x="372" y="2186">Concrete の公開する部分と Abstract の版を、版を並べて出す。</text>
<text class="label" x="372" y="2203">出した版は変えない</text>
<rect class="box" x="840" y="2161" width="170" height="58"/>
<text class="label" x="850" y="2186">スキーマの保存と公開</text>
<rect class="box" x="154" y="2225" width="200" height="58"/>
<text class="label" x="164" y="2250">Agents 契約（AI）</text>
<rect class="box" x="362" y="2225" width="470" height="58"/>
<text class="label" x="372" y="2250">AI の validator をプロセスとして呼び、読む欄 ・ term ・</text>
<text class="label" x="372" y="2267">参照先の値の写しだけを渡し、答えの形と根拠を確かめる</text>
<rect class="box" x="840" y="2225" width="170" height="58"/>
<text class="label" x="850" y="2250">AI と外のツールによる</text>
<text class="label" x="850" y="2267">判定</text>
<rect class="box" x="154" y="2289" width="200" height="58"/>
<text class="label" x="164" y="2314">検証役との受け渡し（作法の</text>
<text class="label" x="164" y="2331">2）</text>
<rect class="box" x="362" y="2289" width="470" height="58"/>
<text class="label" x="372" y="2314">Concrete が宣言した検証役を、tool permissions</text>
<text class="label" x="372" y="2331">に名前があるものだけ、シェルを通さず権限を絞って呼び、JSON で受け渡す</text>
<rect class="box" x="840" y="2289" width="170" height="58"/>
<text class="label" x="850" y="2314">AI と外のツールによる</text>
<text class="label" x="850" y="2331">判定</text>
</svg>