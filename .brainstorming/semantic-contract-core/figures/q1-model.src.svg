<text class="label" x="372" y="138">validator の割り当て ・ 変えてよい範囲 ・ x-prompt ・</text>
<text class="label" x="372" y="155">公開する部分の版</text>
<rect class="box" x="840" y="96" width="170" height="75"/>
<text class="label" x="850" y="121">意味の宣言</text>
<rect class="box" x="154" y="177" width="200" height="58"/>
