<text class="label" x="372" y="582">5つの値のどれか1つ ・ 根拠 ・ 判定した者（機械 ・ 基盤 ・</text>
<text class="label" x="372" y="599">外のツール ・ AI ・ 人）</text>
<rect class="box" x="840" y="557" width="170" height="58"/>
<rect class="box" x="154" y="621" width="200" height="75"/>
