<svg viewBox="0 0 760 536" style="min-width:640px" role="img" aria-label="基盤の目的と、5つの設計原則のいまの実装で足りているもの ・ 足りないもの">
<rect class="box focus" x="20" y="12" width="722" height="76"/>
<text class="title" x="34" y="34">目的</text>
<text class="label" x="34" y="56">JSON Schema が担ってきた構造の機械的な検証を、意味の領域まで広げる</text>
<text class="label" x="34" y="76">機械で担保しきれない部分を、契約の中で AI が文脈を理解して判断し、結果は5つの値で返す</text>
<text class="note" x="20" y="108">設計原則（構想 v0.3）</text><text class="note" x="236" y="108">いまの実装（schema-driven）で足りている</text><text class="note" x="506" y="108">足りない</text>
<rect class="box" x="20" y="120" width="204" height="58"/>
<text class="title" x="32" y="154">1 宣言と解釈の分離</text>
<rect class="box kind-1" x="234" y="120" width="262" height="58"/>
<text class="label" x="246" y="144">宣言（スキーマ ・ 注釈）と</text>
<text class="label" x="246" y="162">検証（エンジン）は分かれている</text>
<rect class="box warn" x="506" y="120" width="236" height="58"/>
<text class="label" x="518" y="144">validator を</text>
<text class="label" x="518" y="162">外から足す仕組み</text>
<rect class="box" x="20" y="190" width="204" height="58"/>
<text class="title" x="32" y="224">2 既存技術は部品</text>
<rect class="box kind-1" x="234" y="190" width="262" height="58"/>
<text class="label" x="246" y="214">標準は JSON Schema だけ。</text>
<text class="label" x="246" y="232">形の検証を任せている</text>
<rect class="box warn" x="506" y="190" width="236" height="58"/>
<text class="label" x="518" y="214">JSON-LD ・ SHACL ・ RDF の</text>
<text class="label" x="518" y="232">概念を参考に自前で定義すること</text>
<rect class="box" x="20" y="260" width="204" height="58"/>
<text class="title" x="32" y="284">3 言語非依存の</text>
<text class="title" x="32" y="302">意味モデル</text>
<rect class="box kind-1" x="234" y="260" width="262" height="58"/>
<text class="label" x="246" y="284">Rust で作り、</text>
<text class="label" x="246" y="302">CLI ・ MCP ・ JSON で返す</text>
<rect class="box warn" x="506" y="260" width="236" height="58"/>
<text class="label" x="518" y="284">出力の形を</text>
<text class="label" x="518" y="302">JSON Schema で公開すること</text>
<rect class="box" x="20" y="330" width="204" height="58"/>
<text class="title" x="32" y="354">4 拡張可能な</text>
<text class="title" x="32" y="372">表現モデル</text>
<rect class="box kind-1" x="234" y="330" width="262" height="58"/>
<text class="label" x="246" y="354">x- を足せる</text>
<text class="label" x="246" y="372">（新しい形では x-extensions）</text>
<rect class="box warn" x="506" y="330" width="236" height="58"/>
<text class="label" x="518" y="354">x- の拡張を基盤のコマンドで</text>
<text class="label" x="518" y="372">検証し、できなければ返すこと</text>
<rect class="box" x="20" y="400" width="204" height="58"/>
<text class="title" x="32" y="424">5 検証可能で</text>
<text class="title" x="32" y="442">実用に耐える</text>
<rect class="box kind-1" x="234" y="400" width="262" height="58"/>
<text class="label" x="246" y="424">同じ入力から</text>
<text class="label" x="246" y="442">同じ結果を返す</text>
<rect class="box warn" x="506" y="400" width="236" height="58"/>
<text class="label" x="518" y="424">別の言語の実装が</text>
<text class="label" x="518" y="442">使える適合の試験</text>
<rect class="box focus" x="20" y="476" width="722" height="48"/>
<text class="label" x="34" y="496">足す：基盤から AI を呼ぶ契約（Agents 契約）</text>
<text class="note" x="34" y="514">全体構成図の外部インターフェースは、4つとも外から基盤を呼ぶ向きである</text>
</svg>