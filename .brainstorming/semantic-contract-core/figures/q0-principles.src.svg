<svg viewBox="0 0 760 450" style="min-width:640px" role="img" aria-label="5つの設計原則と、いまの基盤で足りているもの ・ 足りないもの">
<text class="note" x="20" y="22">設計原則（構想 v0.3）</text><text class="note" x="236" y="22">いまの基盤で足りている</text><text class="note" x="506" y="22">足りない</text>
<rect class="box" x="20" y="34" width="204" height="58"/>
<text class="title" x="32" y="68">1 宣言と解釈の分離</text>
<rect class="box kind-1" x="234" y="34" width="262" height="58"/>
<text class="label" x="246" y="58">宣言（スキーマ ・ 注釈）と</text>
<text class="label" x="246" y="76">確かめ（エンジン）は分かれている</text>
<rect class="box warn" x="506" y="34" width="236" height="58"/>
<text class="label" x="518" y="58">確かめる担い手を</text>
<text class="label" x="518" y="76">外から足す口</text>
<rect class="box" x="20" y="104" width="204" height="58"/>
<text class="title" x="32" y="138">2 既存技術は部品</text>
<rect class="box kind-1" x="234" y="104" width="262" height="58"/>
<text class="label" x="246" y="128">JSON Schema を</text>
<text class="label" x="246" y="146">エンジンに組み込んでいる</text>
<rect class="box warn" x="506" y="104" width="236" height="58"/>
<text class="label" x="518" y="128">JSON-LD ・ SHACL ・ RDF の</text>
<text class="label" x="518" y="146">概念を自前で定義して写すこと</text>
<rect class="box" x="20" y="174" width="204" height="58"/>
<text class="title" x="32" y="198">3 言語非依存の</text>
<text class="title" x="32" y="216">意味モデル</text>
<rect class="box kind-1" x="234" y="174" width="262" height="58"/>
<text class="label" x="246" y="198">Rust で作り、</text>
<text class="label" x="246" y="216">CLI ・ MCP ・ JSON で返す</text>
<rect class="box warn" x="506" y="174" width="236" height="58"/>
<text class="label" x="518" y="198">出力の形を</text>
<text class="label" x="518" y="216">JSON Schema で公開すること</text>
<rect class="box" x="20" y="244" width="204" height="58"/>
<text class="title" x="32" y="268">4 拡張可能な</text>
<text class="title" x="32" y="286">表現モデル</text>
<rect class="box kind-1" x="234" y="244" width="262" height="58"/>
<text class="label" x="246" y="268">x-annotations で</text>
<text class="label" x="246" y="286">注釈を足せる</text>
<rect class="box warn" x="506" y="244" width="236" height="58"/>
<text class="label" x="518" y="268">足した注釈を確かめ、</text>
<text class="label" x="518" y="286">確かめなければ返すこと</text>
<rect class="box" x="20" y="314" width="204" height="58"/>
<text class="title" x="32" y="338">5 検証可能で</text>
<text class="title" x="32" y="356">実用に耐える</text>
<rect class="box kind-1" x="234" y="314" width="262" height="58"/>
<text class="label" x="246" y="338">同じ入力から</text>
<text class="label" x="246" y="356">同じ結果を返す</text>
<rect class="box warn" x="506" y="314" width="236" height="58"/>
<text class="label" x="518" y="338">別の言語の実装が</text>
<text class="label" x="518" y="356">使える適合の試験</text>
<rect class="box focus" x="20" y="390" width="722" height="48"/>
<text class="label" x="34" y="410">足す：基盤から AI を呼ぶ口（Agents 契約）</text>
<text class="note" x="34" y="428">全体構成図の外部インターフェースは、4つとも外から基盤を呼ぶ向きである</text>
</svg>