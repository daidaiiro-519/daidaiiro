<svg viewBox="0 0 760 514" style="min-width:640px" role="img" aria-label="基盤の目的と、5つの設計原則のいまの基盤で足りているもの ・ 足りないもの">
<rect class="box focus" x="20" y="12" width="722" height="54"/>
<text class="title" x="34" y="34">目的</text>
<text class="label" x="34" y="54">AI が書いたインスタンスを、宣言した決まりで機械が確かめ、確かめられなかった決まりも隠さず返す</text>
<text class="note" x="20" y="86">設計原則（構想 v0.3）</text><text class="note" x="236" y="86">いまの基盤で足りている</text><text class="note" x="506" y="86">足りない</text>
<rect class="box" x="20" y="98" width="204" height="58"/>
<text class="title" x="32" y="132">1 宣言と解釈の分離</text>
<rect class="box kind-1" x="234" y="98" width="262" height="58"/>
<text class="label" x="246" y="122">宣言（スキーマ ・ 注釈）と</text>
<text class="label" x="246" y="140">確かめ（エンジン）は分かれている</text>
<rect class="box warn" x="506" y="98" width="236" height="58"/>
<text class="label" x="518" y="122">確かめる担い手を</text>
<text class="label" x="518" y="140">外から足す仕組み</text>
<rect class="box" x="20" y="168" width="204" height="58"/>
<text class="title" x="32" y="202">2 既存技術は部品</text>
<rect class="box kind-1" x="234" y="168" width="262" height="58"/>
<text class="label" x="246" y="192">標準は JSON Schema だけ。</text>
<text class="label" x="246" y="210">形の確かめを任せている</text>
<rect class="box warn" x="506" y="168" width="236" height="58"/>
<text class="label" x="518" y="192">JSON-LD ・ SHACL ・ RDF の</text>
<text class="label" x="518" y="210">概念を参考に自前で定義すること</text>
<rect class="box" x="20" y="238" width="204" height="58"/>
<text class="title" x="32" y="262">3 言語非依存の</text>
<text class="title" x="32" y="280">意味モデル</text>
<rect class="box kind-1" x="234" y="238" width="262" height="58"/>
<text class="label" x="246" y="262">Rust で作り、</text>
<text class="label" x="246" y="280">CLI ・ MCP ・ JSON で返す</text>
<rect class="box warn" x="506" y="238" width="236" height="58"/>
<text class="label" x="518" y="262">出力の形を</text>
<text class="label" x="518" y="280">JSON Schema で公開すること</text>
<rect class="box" x="20" y="308" width="204" height="58"/>
<text class="title" x="32" y="332">4 拡張可能な</text>
<text class="title" x="32" y="350">表現モデル</text>
<rect class="box kind-1" x="234" y="308" width="262" height="58"/>
<text class="label" x="246" y="332">x-annotations で</text>
<text class="label" x="246" y="350">注釈を足せる</text>
<rect class="box warn" x="506" y="308" width="236" height="58"/>
<text class="label" x="518" y="332">x- の拡張を基盤のコマンドで</text>
<text class="label" x="518" y="350">確かめ、できなければ返すこと</text>
<rect class="box" x="20" y="378" width="204" height="58"/>
<text class="title" x="32" y="402">5 検証可能で</text>
<text class="title" x="32" y="420">実用に耐える</text>
<rect class="box kind-1" x="234" y="378" width="262" height="58"/>
<text class="label" x="246" y="402">同じ入力から</text>
<text class="label" x="246" y="420">同じ結果を返す</text>
<rect class="box warn" x="506" y="378" width="236" height="58"/>
<text class="label" x="518" y="402">別の言語の実装が</text>
<text class="label" x="518" y="420">使える適合の試験</text>
<rect class="box focus" x="20" y="454" width="722" height="48"/>
<text class="label" x="34" y="474">足す：基盤から AI を呼ぶ契約（Agents 契約）</text>
<text class="note" x="34" y="492">全体構成図の外部インターフェースは、4つとも外から基盤を呼ぶ向きである</text>
</svg>