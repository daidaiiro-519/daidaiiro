<rect class="box" x="84" y="32" width="260" height="58"/>
<text class="label" x="94" y="57">契約の版と割り当てを、</text>
<text class="label" x="94" y="74">人が通してから公開する</text>
<rect class="box" x="352" y="32" width="640" height="58"/>
<text class="label" x="362" y="57">その仕組みを持たない。契約の変更は U2（変更を見せる）、判定できなかった rule は U16 が持つ</text>
<rect class="box" x="84" y="96" width="260" height="58"/>
<text class="label" x="94" y="121">人が確かめ終えたインスタンス</text>
<text class="label" x="94" y="138">への変更を、提案として出す</text>
<rect class="box" x="352" y="96" width="640" height="58"/>
<text class="label" x="362" y="121">インスタンスごとに人が通す仕組みを持たないので要らない</text>
<rect class="box" x="84" y="160" width="260" height="41"/>
<text class="label" x="94" y="185">別のブランチで契約を変える</text>
<rect class="box" x="352" y="160" width="640" height="41"/>
<text class="label" x="362" y="185">契約の変更もふつうの変更なので、U18 に入る</text>
<rect class="box" x="84" y="207" width="260" height="41"/>
<text class="label" x="94" y="232">手元と CI で検証する</text>
<rect class="box" x="352" y="207" width="640" height="41"/>
<text class="label" x="362" y="232">U8 と同じ目的なので、U8 の保証に入れた</text>
<rect class="box" x="84" y="254" width="260" height="41"/>
<text class="label" x="94" y="279">担当を割り振る</text>
<rect class="box" x="352" y="254" width="640" height="41"/>
<text class="label" x="362" y="279">誰が見るかは基盤の関心ではない</text>
<rect class="box" x="84" y="301" width="260" height="41"/>
<text class="label" x="94" y="326">判定が割れる</text>
<rect class="box" x="352" y="301" width="640" height="41"/>
<text class="label" x="362" y="326">AI の答えが割れたら U16（unverified）、両方で同じ判定を変えたら U18（衝突）に入る</text>
</svg>