<text class="note" x="88" y="22">場面</text>
<text class="note" x="356" y="22">外した理由</text>
<rect class="box focus" x="16" y="32" width="60" height="58"/>
<text class="title" x="26" y="57">U9</text>
<rect class="box focus" x="16" y="96" width="60" height="58"/>
<text class="title" x="26" y="121">U15</text>
<rect class="box focus" x="16" y="160" width="60" height="41"/>
<text class="title" x="26" y="185">U19</text>
<rect class="box focus" x="16" y="207" width="60" height="41"/>
