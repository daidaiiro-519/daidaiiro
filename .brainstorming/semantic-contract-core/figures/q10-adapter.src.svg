<svg viewBox="0 0 958 388" style="min-width:900px" role="img" aria-label="守る契約は基盤が定義し、Git はそれを実現するアダプターの1つ">
<text class="note" x="20" y="22"></text>
<text class="note" x="68" y="22">Semantic Schema Core が守る契約</text>
<text class="note" x="546" y="22">Git で実現するとき（アダプター）</text>
<rect class="box focus" x="16" y="32" width="40" height="41"/>
<text class="title" x="26" y="57">1</text>
<rect class="box focus" x="16" y="79" width="40" height="58"/>
<text class="title" x="26" y="104">2</text>
<rect class="box focus" x="16" y="143" width="40" height="41"/>
<text class="title" x="26" y="168">3</text>
<rect class="box focus" x="16" y="190" width="40" height="41"/>
<text class="title" x="26" y="215">4</text>
<rect class="box focus" x="16" y="237" width="40" height="41"/>
<text class="title" x="26" y="262">5</text>
<rect class="box focus" x="16" y="284" width="40" height="41"/>
<text class="title" x="26" y="309">6</text>
<rect class="box focus" x="16" y="331" width="40" height="41"/>
<text class="title" x="26" y="356">7</text>
<rect class="box" x="64" y="32" width="470" height="41"/>
<text class="label" x="74" y="57">変更は、差分と理由を持つ変更として出す</text>
<rect class="box" x="542" y="32" width="400" height="41"/>
<text class="label" x="552" y="57">ブランチと PR（説明欄が理由）</text>
<rect class="box" x="64" y="79" width="470" height="58"/>
<text class="label" x="74" y="104">変更ごとに、全 instance の状態 ・ 状態が変わった instance ・</text>
<text class="label" x="74" y="121">人が見るものを出す</text>
<rect class="box" x="542" y="79" width="400" height="58"/>
<text class="label" x="552" y="104">ブランチの CI と、PR へのコメント</text>
<rect class="box" x="64" y="143" width="470" height="41"/>
<text class="label" x="74" y="168">AI と人の判定の記録は、変更に入れて残す</text>
<rect class="box" x="542" y="143" width="400" height="41"/>
<text class="label" x="552" y="168">記録は1件1ファイル（instance × rule）。PR の差分に出る</text>
<rect class="box" x="64" y="190" width="470" height="41"/>
<text class="label" x="74" y="215">人の判定は、見た入力に結び付く</text>
<rect class="box" x="542" y="190" width="400" height="41"/>
<text class="label" x="552" y="215">PR のレビューで判定し、記録のファイルを足す</text>
<rect class="box" x="64" y="237" width="470" height="41"/>
<text class="label" x="74" y="262">ほかの変更を取り込んだら、取り込んだあとの姿で同じことをする</text>
<rect class="box" x="542" y="237" width="400" height="41"/>
<text class="label" x="552" y="262">main の取り込み（merge ・ rebase）と、そのあとの CI</text>
<rect class="box" x="64" y="284" width="470" height="41"/>
<text class="label" x="74" y="309">同じ instance × rule の判定を両方で変えたら、人が選ぶ</text>
<rect class="box" x="542" y="284" width="400" height="41"/>
<text class="label" x="552" y="309">Git の衝突</text>
<rect class="box" x="64" y="331" width="470" height="41"/>
<text class="label" x="74" y="356">任せる先（Concrete とモデル）は契約の一部なので、変えるのはふつうの変更</text>
<rect class="box" x="542" y="331" width="400" height="41"/>
<text class="label" x="552" y="356">任せる先を書いたスキーマの変更を PR で出す</text>
</svg>