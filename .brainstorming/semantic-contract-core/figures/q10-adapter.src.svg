<svg viewBox="0 0 958 435" style="min-width:900px" role="img" aria-label="守る契約は基盤が定義し、Git はそれを実現するアダプターの1つ">
<text class="note" x="20" y="22"></text>
<text class="note" x="68" y="22">Semantic Schema Core が守る契約</text>
<text class="note" x="546" y="22">Git で実現するとき（アダプター）</text>
<rect class="box focus" x="16" y="32" width="40" height="41"/>
<text class="title" x="26" y="57">1</text>
<rect class="box focus" x="16" y="79" width="40" height="41"/>
<text class="title" x="26" y="104">2</text>
<rect class="box focus" x="16" y="126" width="40" height="41"/>
<text class="title" x="26" y="151">3</text>
<rect class="box focus" x="16" y="173" width="40" height="41"/>
<text class="title" x="26" y="198">4</text>
<rect class="box focus" x="16" y="220" width="40" height="41"/>
<text class="title" x="26" y="245">5</text>
<rect class="box focus" x="16" y="267" width="40" height="41"/>
<text class="title" x="26" y="292">6</text>
<rect class="box focus" x="16" y="314" width="40" height="41"/>
<text class="title" x="26" y="339">7</text>
<rect class="box focus" x="16" y="361" width="40" height="58"/>
<text class="title" x="26" y="386">8</text>
<rect class="box" x="64" y="32" width="470" height="41"/>
<text class="label" x="74" y="57">変更は、差分と理由を持つ変更セットとして出す</text>
<rect class="box" x="542" y="32" width="400" height="41"/>
<text class="label" x="552" y="57">ブランチと PR（説明欄が理由）</text>
<rect class="box" x="64" y="79" width="470" height="41"/>
<text class="label" x="74" y="104">変更セットごとに検証し、結果と人が見るものを出す</text>
<rect class="box" x="542" y="79" width="400" height="41"/>
<text class="label" x="552" y="104">ブランチの CI と、PR へのコメント</text>
<rect class="box" x="64" y="126" width="470" height="41"/>
<text class="label" x="74" y="151">効く検証の記録を書けるのは、信頼できる実行者だけ</text>
<rect class="box" x="542" y="126" width="400" height="41"/>
<text class="label" x="552" y="151">CI（手元の実行は参考）</text>
<rect class="box" x="64" y="173" width="470" height="41"/>
<text class="label" x="74" y="198">人の確かめは、そのときの中身のハッシュに結び付く</text>
<rect class="box" x="542" y="173" width="400" height="41"/>
<text class="label" x="552" y="198">PR のレビュー（push で古い承認を消す設定）</text>
<rect class="box" x="64" y="220" width="470" height="41"/>
<text class="label" x="74" y="245">ほかの変更を取り込んだら、取り込んだ中身を検証し直す</text>
<rect class="box" x="542" y="220" width="400" height="41"/>
<text class="label" x="552" y="245">main の取り込み（merge ・ rebase）と、そのあとの CI</text>
<rect class="box" x="64" y="267" width="470" height="41"/>
<text class="label" x="74" y="292">同じところを両方で変えたら、人が中身を選ぶ</text>
<rect class="box" x="542" y="267" width="400" height="41"/>
<text class="label" x="552" y="292">Git の衝突</text>
<rect class="box" x="64" y="314" width="470" height="41"/>
<text class="label" x="74" y="339">記録は足すだけで、合わせても衝突しない</text>
<rect class="box" x="542" y="314" width="400" height="41"/>
<text class="label" x="552" y="339">1件1ファイル、名前は中身のハッシュ</text>
<rect class="box" x="64" y="361" width="470" height="58"/>
<text class="label" x="74" y="386">validator の割り当て（AI とモデルの名前）は契約の一部で、</text>
<text class="label" x="74" y="403">変えるのは変更セット</text>
<rect class="box" x="542" y="361" width="400" height="58"/>
<text class="label" x="552" y="386">割り当てのファイルの変更を PR で出す</text>
</svg>