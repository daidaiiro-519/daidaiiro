<svg viewBox="0 0 996 469" style="min-width:900px" role="img" aria-label="チームでの1つの PR の流れ：ブランチの CI が検証し、人は差分と理由を見る">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">誰が</text>
<text class="note" x="226" y="22">何をする</text>
<text class="note" x="564" y="22">基盤が守ること</text>
<rect class="box focus" x="64" y="32" width="150" height="41"/>
<text class="title" x="74" y="57">AI</text>
<rect class="box focus" x="64" y="79" width="150" height="105"/>
<text class="title" x="74" y="104">CI（ブランチ）</text>
<rect class="box focus" x="64" y="190" width="150" height="41"/>
<text class="title" x="74" y="215">人</text>
<rect class="box focus" x="64" y="237" width="150" height="58"/>
<text class="title" x="74" y="262">AI</text>
<rect class="box focus" x="64" y="301" width="150" height="58"/>
<text class="title" x="74" y="326">CI（ブランチ）</text>
<rect class="box focus" x="64" y="365" width="150" height="41"/>
<text class="title" x="74" y="390">Git</text>
<rect class="box focus" x="64" y="412" width="150" height="41"/>
<text class="title" x="74" y="437">Git ・ CI（main）</text>
<rect class="box" x="16" y="32" width="40" height="41"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="222" y="32" width="330" height="41"/>
<text class="label" x="232" y="57">feature ブランチで記事を書き、PR を出す</text>
<rect class="box" x="560" y="32" width="420" height="41"/>
<text class="label" x="570" y="57">記事のファイルだけを書く</text>
<rect class="box" x="16" y="79" width="40" height="41"/>
<text class="label" x="26" y="104">2</text>
<rect class="box" x="222" y="79" width="330" height="41"/>
<text class="label" x="232" y="104">意味の検証をする</text>
<rect class="box" x="560" y="79" width="420" height="41"/>
<text class="label" x="570" y="104">効く記録は CI が書いたもの（J35）</text>
<rect class="box" x="16" y="126" width="40" height="58"/>
<text class="label" x="26" y="151">3</text>
<rect class="box" x="222" y="126" width="330" height="58"/>
<text class="label" x="232" y="151">差分 ・ 理由 ・ 検証の結果と、人が見るものを</text>
<text class="label" x="232" y="168">PR に出す</text>
<rect class="box" x="560" y="126" width="420" height="58"/>
<text class="label" x="570" y="151">人が見るのは、判定できなかった rule と契約の差分だけ（J33）</text>
<rect class="box" x="16" y="190" width="40" height="41"/>
<text class="label" x="26" y="215">4</text>
<rect class="box" x="222" y="190" width="330" height="41"/>
<text class="label" x="232" y="215">PR で差分と理由を見て、要るものを確かめる</text>
<rect class="box" x="560" y="190" width="420" height="41"/>
<text class="label" x="570" y="215">誰が見るかはチームのやり方。基盤は決めない</text>
<rect class="box" x="16" y="237" width="40" height="58"/>
<text class="label" x="26" y="262">5</text>
<rect class="box" x="222" y="237" width="330" height="58"/>
<text class="label" x="232" y="262">push で直す</text>
<rect class="box" x="560" y="237" width="420" height="58"/>
<text class="label" x="570" y="262">中身が変わった rule だけ検証し直す。</text>
<text class="label" x="570" y="279">確かめたことは中身が変われば効かない（J21）</text>
<rect class="box" x="16" y="301" width="40" height="58"/>
<text class="label" x="26" y="326">6</text>
<rect class="box" x="222" y="301" width="330" height="58"/>
<text class="label" x="232" y="326">main の差分を取り込み、</text>
<text class="label" x="232" y="343">取り込んだ中身を検証し直す</text>
<rect class="box" x="560" y="301" width="420" height="58"/>
<text class="label" x="570" y="326">消された記事を指す → 違反。先に入った契約の版 →</text>
<text class="label" x="570" y="343">自分の版は試し直し（J34 ・ J30）</text>
<rect class="box" x="16" y="365" width="40" height="41"/>
<text class="label" x="26" y="390">7</text>
<rect class="box" x="222" y="365" width="330" height="41"/>
<text class="label" x="232" y="390">同じ欄を両方で変えていたら衝突として止める</text>
<rect class="box" x="560" y="365" width="420" height="41"/>
<text class="label" x="570" y="390">人が中身を選ぶ（J34）</text>
<rect class="box" x="16" y="412" width="40" height="41"/>
<text class="label" x="26" y="437">8</text>
<rect class="box" x="222" y="412" width="330" height="41"/>
<text class="label" x="232" y="437">マージし、main でもう一度検証する</text>
<rect class="box" x="560" y="412" width="420" height="41"/>
<text class="label" x="570" y="437">記録は1件1ファイルなので、合わせるだけ（J34）</text>
</svg>