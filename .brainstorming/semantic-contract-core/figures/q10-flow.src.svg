<svg viewBox="0 0 996 486" style="min-width:900px" role="img" aria-label="チームでの1つの変更セットの流れ：誰が何をし、基盤が何を守るか">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">誰が</text>
<text class="note" x="246" y="22">何をする</text>
<text class="note" x="584" y="22">基盤が守ること</text>
<rect class="box focus" x="64" y="32" width="170" height="41"/>
<text class="title" x="74" y="57">AI</text>
<rect class="box focus" x="64" y="79" width="170" height="105"/>
<text class="title" x="74" y="104">信頼できる実行者</text>
<rect class="box focus" x="64" y="190" width="170" height="58"/>
<text class="title" x="74" y="215">人</text>
<rect class="box focus" x="64" y="254" width="170" height="58"/>
<text class="title" x="74" y="279">AI</text>
<rect class="box focus" x="64" y="318" width="170" height="58"/>
<text class="title" x="74" y="343">信頼できる実行者</text>
<rect class="box focus" x="64" y="382" width="170" height="41"/>
<text class="title" x="74" y="407">人</text>
<rect class="box focus" x="64" y="429" width="170" height="41"/>
<text class="title" x="74" y="454">信頼できる実行者</text>
<rect class="box" x="16" y="32" width="40" height="41"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="242" y="32" width="330" height="41"/>
<text class="label" x="252" y="57">変更を、差分と理由を持つ変更セットとして出す</text>
<rect class="box" x="580" y="32" width="400" height="41"/>
<text class="label" x="590" y="57">記事のファイルだけを書く</text>
<rect class="box" x="16" y="79" width="40" height="41"/>
<text class="label" x="26" y="104">2</text>
<rect class="box" x="242" y="79" width="330" height="41"/>
<text class="label" x="252" y="104">変更セットの中身を意味で検証する</text>
<rect class="box" x="580" y="79" width="400" height="41"/>
<text class="label" x="590" y="104">効く記録を書けるのは信頼できる実行者だけ（J35）</text>
<rect class="box" x="16" y="126" width="40" height="58"/>
<text class="label" x="26" y="151">3</text>
<rect class="box" x="242" y="126" width="330" height="58"/>
<text class="label" x="252" y="151">差分 ・ 理由 ・ 検証の結果と、</text>
<text class="label" x="252" y="168">人が見るものを変更セットに出す</text>
<rect class="box" x="580" y="126" width="400" height="58"/>
<text class="label" x="590" y="151">人が見るのは、判定できなかった rule と契約の差分だけ（</text>
<text class="label" x="590" y="168">J33）</text>
<rect class="box" x="16" y="190" width="40" height="58"/>
<text class="label" x="26" y="215">4</text>
<rect class="box" x="242" y="190" width="330" height="58"/>
<text class="label" x="252" y="215">差分と理由を見て、要るものを確かめ、</text>
<text class="label" x="252" y="232">取り込むかを決める</text>
<rect class="box" x="580" y="190" width="400" height="58"/>
<text class="label" x="590" y="215">誰が見るかはチームのやり方で、基盤は決めない</text>
<rect class="box" x="16" y="254" width="40" height="58"/>
<text class="label" x="26" y="279">5</text>
<rect class="box" x="242" y="254" width="330" height="58"/>
<text class="label" x="252" y="279">変更セットに追加の変更を足す</text>
<rect class="box" x="580" y="254" width="400" height="58"/>
<text class="label" x="590" y="279">中身が変わった rule だけ検証し直す。</text>
<text class="label" x="590" y="296">確かめたことは中身が変われば効かない（J21）</text>
<rect class="box" x="16" y="318" width="40" height="58"/>
<text class="label" x="26" y="343">6</text>
<rect class="box" x="242" y="318" width="330" height="58"/>
<text class="label" x="252" y="343">統合先の変更を取り込み、取り込んだ中身を検証し直</text>
<text class="label" x="252" y="360">す</text>
<rect class="box" x="580" y="318" width="400" height="58"/>
<text class="label" x="590" y="343">消された記事を指す → 違反。先に入った契約の版 →</text>
<text class="label" x="590" y="360">自分の版は試し直し（J34 ・ J30）</text>
<rect class="box" x="16" y="382" width="40" height="41"/>
<text class="label" x="26" y="407">7</text>
<rect class="box" x="242" y="382" width="330" height="41"/>
<text class="label" x="252" y="407">同じところを両方で変えていたら、中身を選ぶ</text>
<rect class="box" x="580" y="382" width="400" height="41"/>
<text class="label" x="590" y="407">衝突として止まる（J34）</text>
<rect class="box" x="16" y="429" width="40" height="41"/>
<text class="label" x="26" y="454">8</text>
<rect class="box" x="242" y="429" width="330" height="41"/>
<text class="label" x="252" y="454">統合先に取り込み、もう一度検証する</text>
<rect class="box" x="580" y="429" width="400" height="41"/>
<text class="label" x="590" y="454">記録は1件1ファイルなので、合わせるだけ（J34）</text>
</svg>