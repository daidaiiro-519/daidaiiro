<svg viewBox="0 0 996 358" style="min-width:900px" role="img" aria-label="チームでの1つの変更の流れ：基盤がするのは検証と、見るものを出すことだけ">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">誰が</text>
<text class="note" x="166" y="22">何をする</text>
<text class="note" x="554" y="22">基盤が守ること</text>
<rect class="box focus" x="64" y="32" width="90" height="41"/>
<text class="title" x="74" y="57">AI</text>
<rect class="box focus" x="64" y="79" width="90" height="105"/>
<text class="title" x="74" y="104">基盤</text>
<rect class="box focus" x="64" y="190" width="90" height="41"/>
<text class="title" x="74" y="215">人</text>
<rect class="box focus" x="64" y="237" width="90" height="58"/>
<text class="title" x="74" y="262">基盤</text>
<rect class="box focus" x="64" y="301" width="90" height="41"/>
<text class="title" x="74" y="326">人</text>
<rect class="box" x="16" y="32" width="40" height="41"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="162" y="32" width="380" height="41"/>
<text class="label" x="172" y="57">変更を出す（記事 ・ 契約のどちらでも）</text>
<rect class="box" x="550" y="32" width="430" height="41"/>
<text class="label" x="560" y="57">中身のファイルだけを書く</text>
<rect class="box" x="16" y="79" width="40" height="58"/>
<text class="label" x="26" y="104">2</text>
<rect class="box" x="162" y="79" width="380" height="58"/>
<text class="label" x="172" y="104">変更後の姿で全 instance を検証する</text>
<rect class="box" x="550" y="79" width="430" height="58"/>
<text class="label" x="560" y="104">機械は計算し直し、AI は入力が変わった判定だけ聞き直して、</text>
<text class="label" x="560" y="121">記録を変更に入れる（M4）</text>
<rect class="box" x="16" y="143" width="40" height="41"/>
<text class="label" x="26" y="168">3</text>
<rect class="box" x="162" y="143" width="380" height="41"/>
<text class="label" x="172" y="168">状態 ・ 状態が変わった instance ・ 人が見るものを出す</text>
<rect class="box" x="550" y="143" width="430" height="41"/>
<text class="label" x="560" y="168">人が見るのは、AI が判定できなかったものだけ（M10）</text>
<rect class="box" x="16" y="190" width="40" height="41"/>
<text class="label" x="26" y="215">4</text>
<rect class="box" x="162" y="190" width="380" height="41"/>
<text class="label" x="172" y="215">差分と理由と、基盤が出したものを見て、取り込むかを決める</text>
<rect class="box" x="550" y="190" width="430" height="41"/>
<text class="label" x="560" y="215">誰が見るかはチームのやり方。要るものは判定の記録を足す（M7）</text>
<rect class="box" x="16" y="237" width="40" height="58"/>
<text class="label" x="26" y="262">5</text>
<rect class="box" x="162" y="237" width="380" height="58"/>
<text class="label" x="172" y="262">ほかの変更を取り込んだら、取り込んだあとの姿で 2 と 3</text>
<text class="label" x="172" y="279">をする</text>
<rect class="box" x="550" y="237" width="430" height="58"/>
<text class="label" x="560" y="262">消された記事を指す記事は違反。入力が変わった判定は効かない（M6</text>
<text class="label" x="560" y="279"> ・ M7）</text>
<rect class="box" x="16" y="301" width="40" height="41"/>
<text class="label" x="26" y="326">6</text>
<rect class="box" x="162" y="301" width="380" height="41"/>
<text class="label" x="172" y="326">同じ判定を両方で変えていたら選ぶ</text>
<rect class="box" x="550" y="301" width="430" height="41"/>
<text class="label" x="560" y="326">変更の仕組みの衝突として止まる</text>
</svg>