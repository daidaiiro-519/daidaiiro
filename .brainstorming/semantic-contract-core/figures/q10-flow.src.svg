<svg viewBox="0 0 996 537" style="min-width:900px" role="img" aria-label="チームでの1つの変更の流れ：基盤がするのは検証と、変更のまとまりを出すことだけ">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">誰が</text>
<text class="note" x="166" y="22">何をする</text>
<text class="note" x="554" y="22">基盤が守ること</text>
<rect class="box focus" x="64" y="32" width="90" height="41"/>
<text class="title" x="74" y="57">AI</text>
<rect class="box focus" x="64" y="79" width="90" height="203"/>
<text class="title" x="74" y="104">基盤</text>
<rect class="box focus" x="64" y="288" width="90" height="58"/>
<text class="title" x="74" y="313">人</text>
<rect class="box focus" x="64" y="352" width="90" height="58"/>
<text class="title" x="74" y="377">AI</text>
<rect class="box focus" x="64" y="416" width="90" height="58"/>
<text class="title" x="74" y="441">基盤</text>
<rect class="box focus" x="64" y="480" width="90" height="41"/>
<text class="title" x="74" y="505">人</text>
<rect class="box" x="16" y="32" width="40" height="41"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="162" y="32" width="380" height="41"/>
<text class="label" x="172" y="57">変更を出す（記事 ・ 契約のどちらでも）</text>
<rect class="box" x="550" y="32" width="430" height="41"/>
<text class="label" x="560" y="57">中身のファイルと、意図ごとの変更の記録を書く</text>
<rect class="box" x="16" y="79" width="40" height="75"/>
<text class="label" x="26" y="104">2</text>
<rect class="box" x="162" y="79" width="380" height="75"/>
<text class="label" x="172" y="104">変更後の姿で全 instance を検証する</text>
<rect class="box" x="550" y="79" width="430" height="75"/>
<text class="label" x="560" y="104">機械は計算し直し、</text>
<text class="label" x="560" y="121">AI は判定した値が変わった判定だけ聞き直して、</text>
<text class="label" x="560" y="138">記録を変更に入れる</text>
<rect class="box" x="16" y="160" width="40" height="58"/>
<text class="label" x="26" y="185">3</text>
<rect class="box" x="162" y="160" width="380" height="58"/>
<text class="label" x="172" y="185">意図ごとに I33 を判定し、意味の変更を判定の記録に残す</text>
<rect class="box" x="550" y="160" width="430" height="58"/>
<text class="label" x="560" y="185">前の値は、記録を足したコミットの親から取る。</text>
<text class="label" x="560" y="202">判定した値が等しければ聞き直さない</text>
<rect class="box" x="16" y="224" width="40" height="58"/>
<text class="label" x="26" y="249">4</text>
<rect class="box" x="162" y="224" width="380" height="58"/>
<text class="label" x="172" y="249">変更の前後から、変更のまとまりを組み立てて出す</text>
<rect class="box" x="550" y="224" width="430" height="58"/>
<text class="label" x="560" y="249">例外（件数つき）→ 目的 → 意図 → 意味 →</text>
<text class="label" x="560" y="266">検証結果の差分 → 描画の差分</text>
<rect class="box" x="16" y="288" width="40" height="58"/>
<text class="label" x="26" y="313">5</text>
<rect class="box" x="162" y="288" width="380" height="58"/>
<text class="label" x="172" y="313">目的で1回承認し、意図ごとに確かめる</text>
<rect class="box" x="550" y="288" width="430" height="58"/>
<text class="label" x="560" y="313">承認と取り込みは変更の仕組みに任せ、Core は承認の記録を</text>
<text class="label" x="560" y="330">持たない</text>
<rect class="box" x="16" y="352" width="40" height="58"/>
<text class="label" x="26" y="377">6</text>
<rect class="box" x="162" y="352" width="380" height="58"/>
<text class="label" x="172" y="377">差し戻された意図を直す</text>
<rect class="box" x="550" y="352" width="430" height="58"/>
<text class="label" x="560" y="377">記録は書き換えず、新しい変更の記録を足して、</text>
<text class="label" x="560" y="394">置き換える意図の id で前の記録を指す</text>
<rect class="box" x="16" y="416" width="40" height="58"/>
<text class="label" x="26" y="441">7</text>
<rect class="box" x="162" y="416" width="380" height="58"/>
<text class="label" x="172" y="441">ほかの変更を取り込んだら、取り込んだあとの</text>
<text class="label" x="172" y="458">姿で 2 と 4 をする</text>
<rect class="box" x="550" y="416" width="430" height="58"/>
<text class="label" x="560" y="441">消された記事を指す記事は違反。</text>
<text class="label" x="560" y="458">判定した値が変わった判定は効かない</text>
<rect class="box" x="16" y="480" width="40" height="41"/>
<text class="label" x="26" y="505">8</text>
<rect class="box" x="162" y="480" width="380" height="41"/>
<text class="label" x="172" y="505">同じ判定か同じ欄を両方で変えていたら選ぶ</text>
<rect class="box" x="550" y="480" width="430" height="41"/>
<text class="label" x="560" y="505">変更の仕組みの衝突として止まる</text>
</svg>
