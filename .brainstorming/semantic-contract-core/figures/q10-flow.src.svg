<svg viewBox="0 0 956 435" style="min-width:900px" role="img" aria-label="1つの PR の流れ：誰が何をし、基盤は何を守るか">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">誰が</text>
<text class="note" x="186" y="22">何をする</text>
<text class="note" x="524" y="22">基盤が守ること</text>
<rect class="box focus" x="64" y="32" width="110" height="41"/>
<text class="title" x="74" y="57">AI</text>
<rect class="box focus" x="64" y="79" width="110" height="41"/>
<text class="title" x="74" y="104">CI</text>
<rect class="box focus" x="64" y="126" width="110" height="41"/>
<text class="title" x="74" y="151">基盤</text>
<rect class="box focus" x="64" y="173" width="110" height="41"/>
<text class="title" x="74" y="198">担当</text>
<rect class="box focus" x="64" y="220" width="110" height="41"/>
<text class="title" x="74" y="245">CI</text>
<rect class="box focus" x="64" y="267" width="110" height="41"/>
<text class="title" x="74" y="292">担当が不在</text>
<rect class="box focus" x="64" y="314" width="110" height="58"/>
<text class="title" x="74" y="339">CI</text>
<rect class="box focus" x="64" y="378" width="110" height="41"/>
<text class="title" x="74" y="403">Git</text>
<rect class="box" x="16" y="32" width="40" height="41"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="182" y="32" width="330" height="41"/>
<text class="label" x="192" y="57">記事を書き、PR を出す</text>
<rect class="box" x="520" y="32" width="420" height="41"/>
<text class="label" x="530" y="57">記事のファイルだけ。記録は書かない</text>
<rect class="box" x="16" y="79" width="40" height="41"/>
<text class="label" x="26" y="104">2</text>
<rect class="box" x="182" y="79" width="330" height="41"/>
<text class="label" x="192" y="104">PR の記事を検証し、記録を書く</text>
<rect class="box" x="520" y="79" width="420" height="41"/>
<text class="label" x="530" y="104">効く記録を書けるのは CI だけ（J35）</text>
<rect class="box" x="16" y="126" width="40" height="41"/>
<text class="label" x="26" y="151">3</text>
<rect class="box" x="182" y="126" width="330" height="41"/>
<text class="label" x="192" y="151">判断が要るものを、rule の担当の受信箱へ届ける</text>
<rect class="box" x="520" y="126" width="420" height="41"/>
<text class="label" x="530" y="151">1人が取ったら、ほかの担当には出さない（J33）</text>
<rect class="box" x="16" y="173" width="40" height="41"/>
<text class="label" x="26" y="198">4</text>
<rect class="box" x="182" y="173" width="330" height="41"/>
<text class="label" x="192" y="198">PR のレビューで判断する</text>
<rect class="box" x="520" y="173" width="420" height="41"/>
<text class="label" x="530" y="198">身元は Git のホスティングが持つ</text>
<rect class="box" x="16" y="220" width="40" height="41"/>
<text class="label" x="26" y="245">5</text>
<rect class="box" x="182" y="220" width="330" height="41"/>
<text class="label" x="192" y="245">レビューを判断の記録にする</text>
<rect class="box" x="520" y="220" width="420" height="41"/>
<text class="label" x="530" y="245">レビューを通らない判断は効かない（J35）</text>
<rect class="box" x="16" y="267" width="40" height="41"/>
<text class="label" x="26" y="292">6</text>
<rect class="box" x="182" y="267" width="330" height="41"/>
<text class="label" x="192" y="292">3日だれも取らない</text>
<rect class="box" x="520" y="267" width="420" height="41"/>
<text class="label" x="530" y="292">代わりの担当と承認者にも届く（J36）</text>
<rect class="box" x="16" y="314" width="40" height="58"/>
<text class="label" x="26" y="339">7</text>
<rect class="box" x="182" y="314" width="330" height="58"/>
<text class="label" x="192" y="339">併合の前に検査する</text>
<rect class="box" x="520" y="314" width="420" height="58"/>
<text class="label" x="530" y="339">親の版が変わった ・ 消した記事を指す ・</text>
<text class="label" x="530" y="356">同じ記事を両方で変えた → 併合できない（J30 ・ J12 ・ J34）</text>
<rect class="box" x="16" y="378" width="40" height="41"/>
<text class="label" x="26" y="403">8</text>
<rect class="box" x="182" y="378" width="330" height="41"/>
<text class="label" x="192" y="403">併合する</text>
<rect class="box" x="520" y="378" width="420" height="41"/>
<text class="label" x="530" y="403">記録と判断は1件1ファイルなので、合わせるだけ（J34）</text>
</svg>