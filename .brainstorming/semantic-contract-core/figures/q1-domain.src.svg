<svg viewBox="0 0 960 500" style="min-width:860px" role="img" aria-label="Semantic Schema Core の9つの概念と3つの集約">
<rect class="box" x="120" y="16" width="260" height="48"/><text class="label" x="132" y="37">Abstract スキーマ（版）</text><text class="note" x="132" y="55">値オブジェクト。名前@vN で決まる</text>
<rect class="area" x="16" y="110" width="424" height="208"/><text class="title" x="30" y="134">Concrete スキーマの集約</text>
<rect class="box focus" x="30" y="150" width="396" height="30"/><text class="label" x="40" y="170">Concrete スキーマ（集約のルート）</text>
<rect class="box" x="30" y="190" width="396" height="30"/><text class="label" x="40" y="210">rule（id ・ rule ・ why ・ test）</text>
<rect class="box" x="30" y="230" width="396" height="30"/><text class="label" x="40" y="250">公開した版（値オブジェクト）</text>
<rect class="box" x="30" y="270" width="396" height="30"/><text class="label" x="40" y="290">term（terms@v1 の $defs。欄は $ref で指す）</text>
<path class="flow" d="M250,110 V64"/><text class="note" x="262" y="92">x-abstract で申告する</text>
<rect class="area" x="16" y="370" width="424" height="118"/><text class="title" x="30" y="394">instance の集約</text>
<rect class="box focus" x="30" y="406" width="396" height="30"/><text class="label" x="40" y="426">instance（集約のルート）</text>
<rect class="box" x="30" y="446" width="396" height="30"/><text class="label" x="40" y="466">承認の記録（承認した時点のハッシュ）</text>
<path class="flow" d="M250,370 V318"/><text class="note" x="262" y="350">$schema で指す</text>
<rect class="area" x="540" y="110" width="404" height="118"/><text class="title" x="554" y="134">view の集約</text>
<rect class="box focus" x="554" y="150" width="376" height="30"/><text class="label" x="564" y="170">view（集約のルート）</text>
<text class="note" x="554" y="206">ページテンプレート ・ カタログ ・ デザインシステム</text>
<path class="flow" d="M540,165 H440"/><text class="note" x="490" y="157" text-anchor="middle">x-view を読む</text>
<rect class="box" x="526" y="406" width="418" height="70"/><text class="label" x="540" y="428">検証結果（値オブジェクト。保存しない）</text><text class="note" x="540" y="448">rule 1件ごとに、5つの値のどれか1つ</text><text class="note" x="540" y="466">verified ・ violated ・ unverified ・ unsupported ・ error</text>
<path class="flow" d="M440,421 H526"/><text class="note" x="483" y="413" text-anchor="middle">検証で返る</text>
</svg>