<svg viewBox="0 0 960 480" style="min-width:860px" role="img" aria-label="Semantic Schema Core の9つの概念と3つの集約">
<rect class="box" x="90" y="16" width="340" height="48"/><text class="label" x="102" y="37">Semantic Abstract Schema（一員6つ）</text><text class="note" x="102" y="55">値オブジェクト。名前@vN で決まる</text>
<rect class="area" x="16" y="110" width="424" height="208"/><text class="title" x="30" y="134">Concrete スキーマの集約</text>
<rect class="box focus" x="30" y="150" width="396" height="30"/><text class="label" x="40" y="170">Concrete スキーマ（集約のルート）</text>
<rect class="box" x="30" y="190" width="396" height="30"/><text class="label" x="40" y="210">rule（id ・ rule ・ why ・ test）</text>
<rect class="box" x="30" y="230" width="396" height="30"/><text class="label" x="40" y="250">公開した版（値オブジェクト）</text>
<rect class="box" x="30" y="270" width="396" height="30"/><text class="label" x="40" y="290">term（terms@v1 の $defs。欄は $ref で指す）</text>
<path class="flow" d="M250,110 V64"/><text class="note" x="262" y="92">x-abstract で申告する</text>
<rect class="area" x="16" y="370" width="424" height="80"/><text class="title" x="30" y="394">instance の集約</text>
<rect class="box focus" x="30" y="406" width="396" height="30"/><text class="label" x="40" y="426">instance（集約のルート）</text>
<path class="flow" d="M250,370 V318"/><text class="note" x="262" y="350">$schema で指す</text>
<rect class="box" x="526" y="110" width="418" height="70"/><text class="label" x="540" y="132">view（値オブジェクト）</text><text class="note" x="540" y="152">ページテンプレート ・ カタログ ・ デザインシステム</text><text class="note" x="540" y="170">読むときに Semantic Abstract Schema で検証する</text>
<path class="flow" d="M526,165 H440"/><text class="note" x="483" y="157" text-anchor="middle">x-view を読む</text>
<rect class="area" x="526" y="238" width="418" height="80"/><text class="title" x="540" y="262">承認の記録の集約</text>
<rect class="box focus" x="540" y="274" width="390" height="30"/><text class="label" x="550" y="294">承認の記録（フォルダ1つに1件）</text>
<path class="flow" d="M640,318 V395 H440"/><text class="note" x="652" y="350">パスとハッシュで指す</text>
<rect class="box" x="526" y="404" width="418" height="70"/><text class="label" x="540" y="426">検証結果（値オブジェクト。保存しない）</text><text class="note" x="540" y="446">rule 1件ごとに、5つの値のどれか1つ</text><text class="note" x="540" y="464">verified ・ violated ・ unverified ・ unsupported ・ error</text>
<path class="flow" d="M440,430 H526"/><text class="note" x="483" y="424" text-anchor="middle">検証で返る</text>
</svg>