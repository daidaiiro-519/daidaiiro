<svg viewBox="0 0 960 660" style="min-width:860px" role="img" aria-label="Semantic Schema Core の概念と4つの集約">
<rect class="box" x="90" y="16" width="340" height="48"/><text class="label" x="102" y="37">Semantic Abstract Schema（一員6つ）</text><text class="note" x="102" y="55">値オブジェクト。名前@vN で決まる</text>
<rect class="area" x="16" y="110" width="424" height="248"/><text class="title" x="30" y="134">Concrete スキーマの集約（人が承認する）</text>
<rect class="box focus" x="30" y="150" width="396" height="30"/><text class="label" x="40" y="170">Concrete の版（下書き → 承認待ち → 公開 → 引退）</text>
<rect class="box" x="30" y="190" width="396" height="30"/><text class="label" x="40" y="210">rule（判定する者 ・ 読む欄 ・ why ・ test）</text>
<rect class="box focus" x="30" y="230" width="396" height="30"/><text class="label" x="40" y="250">validator の割り当て（Concrete に1つ）</text>
<rect class="box" x="30" y="270" width="396" height="30"/><text class="label" x="40" y="290">term（terms@v1 の $defs。欄は $ref で指す）</text>
<text class="note" x="30" y="342">承認は依頼の時点の中身のハッシュに結び付く</text>
<path class="flow" d="M250,110 V64"/><text class="note" x="262" y="92">$schema で申告する</text>
<rect class="area" x="16" y="410" width="424" height="120"/><text class="title" x="30" y="434">instance の集約</text>
<rect class="box focus" x="30" y="446" width="396" height="30"/><text class="label" x="40" y="466">instance（従う版1つ ・ 変えてよい範囲）</text>
<text class="note" x="30" y="512">状態は持たず、読むたびに決定表で導く</text>
<path class="flow" d="M250,410 V358"/><text class="note" x="262" y="390">$schema で指す</text>
<rect class="box" x="526" y="110" width="418" height="70"/><text class="label" x="540" y="132">view（値オブジェクト）</text><text class="note" x="540" y="152">ページテンプレート ・ カタログ ・ デザインシステム</text><text class="note" x="540" y="170">読むときに Semantic Abstract Schema で検証する</text>
<path class="flow" d="M526,165 H440"/><text class="note" x="483" y="157" text-anchor="middle">x-view を読む</text>
<rect class="area" x="526" y="220" width="418" height="80"/><text class="title" x="540" y="244">検証の記録の集約</text>
<rect class="box focus" x="540" y="256" width="390" height="30"/><text class="label" x="550" y="276">検証の記録（rule ごとの入力と結果）</text>
<rect class="area" x="526" y="318" width="418" height="80"/><text class="title" x="540" y="342">人の判断の集約（人だけが足す）</text>
<rect class="box focus" x="540" y="354" width="390" height="30"/><text class="label" x="550" y="374">人の判断（合っている ・ 合っていない）</text>
<path class="flow" d="M526,260 H496 V470 H440"/>
<path class="flow" d="M526,372 H470 V490 H440"/>
<rect class="box" x="526" y="430" width="418" height="100"/><text class="label" x="540" y="452">状態を導く（ドメインサービス）</text><text class="note" x="540" y="472">rule の効いている結果：未記入 → 人の判断 → いまの結果</text><text class="note" x="540" y="492">いまの結果：入力がいまと一致する最後の記録</text><text class="note" x="540" y="512">instance の状態：決定表で導く（下書き ・ 判断待ち など）</text>
<rect class="box" x="526" y="560" width="418" height="56"/><text class="label" x="540" y="582">検証結果（値オブジェクト）</text><text class="note" x="540" y="602">verified ・ violated ・ unverified ・ unsupported ・ error</text>
<text class="note" x="16" y="648">集約は4つ。人が承認するのは Concrete の版と割り当てだけで、instance には承認を付けない</text>
</svg>