<svg viewBox="0 0 1006 648" style="min-width:900px" role="img" aria-label="不変条件10行：何について守るか" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E}</style><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="1006.0" height="648.0" fill="#FFFFFF" rx="8"/>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">#</text>
<text class="note" x="78" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">何について</text>
<text class="note" x="206" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">不変条件</text>
<text class="note" x="834" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">試験</text>
<rect class="box focus" x="74" y="32" width="120" height="122" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="84" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">契約</text>
<rect class="box focus" x="74" y="160" width="120" height="233" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="84" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">検証</text>
<rect class="box focus" x="74" y="399" width="120" height="105" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="84" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">判定の記録</text>
<rect class="box focus" x="74" y="510" width="120" height="58" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="84" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">状態</text>
<rect class="box focus" x="74" y="574" width="120" height="58" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="84" y="599" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">変更</text>
<rect class="box" x="16" y="32" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M1</text>
<rect class="box" x="202" y="32" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x- キーワードを定義できるのは Semantic Abstract Schema だけで、Concrete は定義された</text>
<text class="label" x="212" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x- を使う。</text>
<rect class="box" x="830" y="32" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">モデルの外（メタスキ</text>
<text class="label" x="840" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ーマの検査）</text>
<rect class="box" x="16" y="96" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M2</text>
<rect class="box" x="202" y="96" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">rule は判定する者（機械 ・ AI ・ 人）を持ち、AI と人の rule は読む欄を持つ。rule が使う</text>
<text class="label" x="212" y="138" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">term は契約に定義がある。</text>
<rect class="box" x="830" y="96" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S14</text>
<rect class="box" x="16" y="160" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M3</text>
<rect class="box" x="202" y="160" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">検証の結果は rule ごとに5つの値のどれか1つと、根拠と、判定した者（機械 ・ 基盤 ・ AI ・ </text>
<text class="label" x="212" y="202" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人）である。</text>
<rect class="box" x="830" y="160" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S1 ・ S17 ・ S18</text>
<rect class="box" x="16" y="224" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="249" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M4</text>
<rect class="box" x="202" y="224" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="249" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">機械の rule は中身と契約から毎回計算し直す。AI と人の判定は判定の記録として変更に入れて残</text>
<text class="label" x="212" y="266" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">し、入力が変わらない限り聞き直さない。</text>
<rect class="box" x="830" y="224" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="249" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S13 ・ S16</text>
<rect class="box" x="16" y="288" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="313" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M5</text>
<rect class="box" x="202" y="288" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="313" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI には読む欄 ・ term ・ 参照先の値の写しだけを渡す。根拠が空か読んだ値に無い答えと、</text>
<text class="label" x="212" y="330" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">割れた答えは unverified にする。</text>
<rect class="box" x="830" y="288" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="313" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S6 ・ S7 ・ S11</text>
<rect class="box" x="16" y="352" width="50" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="377" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M6</text>
<rect class="box" x="202" y="352" width="620" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="377" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-ref の参照先が無ければ基盤が violated にする。参照先の状態は参照元に伝えない。</text>
<rect class="box" x="830" y="352" width="160" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="377" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S10 ・ S11</text>
<rect class="box" x="16" y="399" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M7</text>
<rect class="box" x="202" y="399" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">判定の記録は instance × rule ごとに1つで、入力（rule と読む欄 ・ term ・ 参照先の値。</text>
<text class="label" x="212" y="441" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI は validator も）に結び付き、変われば効かない。</text>
<rect class="box" x="830" y="399" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S2 ・ S3 ・ S4 ・</text>
<text class="label" x="840" y="441" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S5 ・ S9 ・ S15</text>
<rect class="box" x="16" y="463" width="50" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="488" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M8</text>
<rect class="box" x="202" y="463" width="620" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="488" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人が覆せるのは AI と人の rule の結果だけで、機械と基盤が判定した結果は覆せない。</text>
<rect class="box" x="830" y="463" width="160" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="488" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S8</text>
<rect class="box" x="16" y="510" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M9</text>
<rect class="box" x="202" y="510" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">instance の状態は決定表で導く：violated があれば下書き、error があれば確かめ直しを待つ、</text>
<text class="label" x="212" y="552" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">unverified ・ unsupported があれば判断待ち、無ければ検証済み。</text>
<rect class="box" x="830" y="510" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S1 ・ S2 ・ S17</text>
<rect class="box" x="16" y="574" width="50" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="599" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">M10</text>
<rect class="box" x="202" y="574" width="620" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="212" y="599" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更には、変更後の契約で全 instance を検証した状態 ・ 状態が変わった instance ・</text>
<text class="label" x="212" y="616" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人が見るもの ・ 新しい判定の記録を出す。差分と理由は変更の仕組みが持つ。</text>
<rect class="box" x="830" y="574" width="160" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="840" y="599" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">S12 ・ S13 ・ S15</text>
</svg>