<svg viewBox="0 0 720 440" style="min-width:600px" role="img" aria-label="基盤が持つものと持たないもの">
<rect class="area" x="10" y="10" width="470" height="420"/><text class="title" x="24" y="36">基盤 schema-driven が持つもの</text>
<rect class="box" x="24" y="50" width="442" height="52"/><text class="title" x="38" y="72">宣言の契約</text><text class="note" x="38" y="92">abstract スキーマ ・ 注釈（x-ref ・ x-derive ・ x-prompt）</text>
<rect class="badge" x="380" y="60" width="76" height="22"/><text class="note" x="418" y="76" text-anchor="middle">足りている</text>
<rect class="box" x="24" y="112" width="442" height="52"/><text class="title" x="38" y="134">検証する仕組み</text><text class="note" x="38" y="154">書いたその場の検証 ・ check ・ approve ・ 公開した版の指紋</text>
<rect class="badge" x="380" y="122" width="76" height="22"/><text class="note" x="418" y="138" text-anchor="middle">足りている</text>
<rect class="box warn" x="24" y="174" width="442" height="52"/><text class="title" x="38" y="196">ルールごとの結果</text><text class="note" x="38" y="216">検証した validator と結果を、ルール1件ずつ返す</text>
<rect class="badge warn" x="380" y="184" width="76" height="22"/><text class="note" x="418" y="200" text-anchor="middle">足りない</text>
<rect class="box warn" x="24" y="236" width="442" height="52"/><text class="title" x="38" y="258">検証しなかったことの報告</text><text class="note" x="38" y="278">検査しなかったルールを、合格にせず返す</text>
<rect class="badge warn" x="380" y="246" width="76" height="22"/><text class="note" x="418" y="262" text-anchor="middle">足りない</text>
<rect class="box warn" x="24" y="298" width="442" height="52"/><text class="title" x="38" y="320">Agents 契約</text><text class="note" x="38" y="340">AI を検証する validator ・ 会話の相手として呼ぶ約束</text>
<rect class="badge warn" x="380" y="308" width="76" height="22"/><text class="note" x="418" y="324" text-anchor="middle">足りない</text>
<rect class="box" x="24" y="360" width="442" height="52"/><text class="title" x="38" y="382">描画</text><text class="note" x="38" y="402">インスタンスを承認の画面へ投影する（render）</text>
<rect class="badge" x="380" y="370" width="76" height="22"/><text class="note" x="418" y="386" text-anchor="middle">足りている</text>
<rect class="boundary" x="496" y="10" width="214" height="420"/><text class="title" x="510" y="36">基盤が持たないもの</text>
<rect class="box" x="510" y="50" width="186" height="74"/><text class="label" x="522" y="80">使う側のデータ</text><text class="label" x="522" y="104">何を持つかは Skill</text>
<rect class="box" x="510" y="140" width="186" height="74"/><text class="label" x="522" y="170">UI ・ Workflow の</text><text class="label" x="522" y="194">Runtime（動かす側）</text>
<rect class="box" x="510" y="230" width="186" height="74"/><text class="label" x="522" y="260">コードの生成と</text><text class="label" x="522" y="284">技術の選び方</text>
<rect class="box" x="510" y="320" width="186" height="74"/><text class="label" x="522" y="350">JSON-LD ・ RDF ・</text><text class="label" x="522" y="374">SHACL への写し</text>
</svg>