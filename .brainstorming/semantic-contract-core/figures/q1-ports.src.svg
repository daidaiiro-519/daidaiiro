<rect class="box" x="174" y="902" width="330" height="92"/>
<text class="label" x="184" y="927">手元のセッションの索引を読む ・ 書く</text>
<rect class="box" x="512" y="902" width="270" height="92"/>
<text class="label" x="522" y="927">作業した人の手元（最初のアダプターは</text>
<text class="label" x="522" y="944">SQLite 1ファイル。すべての</text>
<text class="label" x="522" y="961">worktree から読める場所に置き、</text>
<text class="label" x="522" y="978">コミットしない）</text>
<rect class="box" x="790" y="902" width="210" height="92"/>
<text class="label" x="800" y="927">保存と版の管理</text>
<rect class="box" x="174" y="1000" width="330" height="58"/>
<text class="label" x="184" y="1025">変更の前後を受け取る（前後の姿 ・ 出した者 ・</text>
