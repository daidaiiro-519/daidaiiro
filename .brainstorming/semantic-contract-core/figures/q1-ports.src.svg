<rect class="box" x="512" y="659" width="270" height="75"/>
<text class="label" x="522" y="684">文脈のリポジトリのファイル</text>
<rect class="box" x="790" y="659" width="210" height="75"/>
<text class="label" x="800" y="684">保存と版の管理</text>
<rect class="box" x="174" y="740" width="330" height="92"/>
<text class="label" x="184" y="765">インスタンスを読む ・ 書く</text>
<rect class="box" x="512" y="740" width="270" height="92"/>
<text class="label" x="522" y="765">文脈のリポジトリのファイル（正本。</text>
<text class="label" x="522" y="782">関係の索引は、遅いと測れてから、</text>
<text class="label" x="522" y="799">ファイルから作り直せる手元の DB</text>
<text class="label" x="522" y="816">を同じポートの後ろに置く）</text>
<rect class="box" x="790" y="740" width="210" height="92"/>
<text class="label" x="800" y="765">保存と版の管理</text>
<rect class="box" x="174" y="838" width="330" height="58"/>
<text class="label" x="184" y="863">判定の記録を読む ・ 書く</text>
<rect class="box" x="512" y="838" width="270" height="58"/>
<text class="label" x="522" y="863">文脈のリポジトリのファイル（最初のアダ</text>
