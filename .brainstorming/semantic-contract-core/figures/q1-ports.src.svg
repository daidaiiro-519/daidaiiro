<svg viewBox="0 0 1016 1411" style="min-width:900px" role="img" aria-label="ポートとアダプター：駆動する側は見せるアダプター、駆動される側は満たすアダプター">
<text class="note" x="20" y="22"></text>
<text class="note" x="178" y="22">ポート</text>
<text class="note" x="516" y="22">アダプター</text>
<text class="note" x="794" y="22">使う場面 ・ 業務領域</text>
<rect class="box focus" x="16" y="32" width="150" height="621"/>
<text class="title" x="26" y="57">駆動する側（外に差し</text>
<text class="title" x="26" y="74">出す口）</text>
<rect class="box focus" x="16" y="659" width="150" height="736"/>
<text class="title" x="26" y="684">駆動される側（中が外</text>
<text class="title" x="26" y="701">に求める口）</text>
<rect class="box" x="174" y="32" width="330" height="92"/>
<text class="label" x="184" y="57">意味を宣言する（作成 ・ Concrete を</text>
<text class="label" x="184" y="74">照らす ・ glossary と Concrete の拡張項目を</text>
<text class="label" x="184" y="91">定義する ・ 公開する部分の版を出す。</text>
<text class="label" x="184" y="108">セッション ID と意図を一緒に受け取る）</text>
<rect class="box" x="512" y="32" width="270" height="92"/>
<text class="label" x="522" y="57">CLI ・ MCP</text>
<rect class="box" x="790" y="32" width="210" height="92"/>
<text class="label" x="800" y="57">U1 ・ U2 ・ U3 ・ U23 ・</text>
<text class="label" x="800" y="74">U24</text>
<rect class="box" x="174" y="130" width="330" height="75"/>
<text class="label" x="184" y="155">インスタンスを書く（作成 ・ 更新 ・ 削除 ・</text>
<text class="label" x="184" y="172">取り込む。セッション ID と意図を</text>
<text class="label" x="184" y="189">一緒に受け取る）</text>
<rect class="box" x="512" y="130" width="270" height="75"/>
<text class="label" x="522" y="155">CLI ・ MCP</text>
<rect class="box" x="790" y="130" width="210" height="75"/>
<text class="label" x="800" y="155">U5 ・ U6 ・ U7 ・ U11 ・</text>
<text class="label" x="800" y="172">U17</text>
<rect class="box" x="174" y="211" width="330" height="58"/>
<text class="label" x="184" y="236">検証する ・ 変更を見せる（まとめ方と変更の</text>
<text class="label" x="184" y="253">前後を受け取る）</text>
<rect class="box" x="512" y="211" width="270" height="58"/>
<text class="label" x="522" y="236">CLI ・ MCP ・ CI</text>
<rect class="box" x="790" y="211" width="210" height="58"/>
<text class="label" x="800" y="236">U8 ・ U10 ・ U18 ・ U25</text>
<rect class="box" x="174" y="275" width="330" height="41"/>
<text class="label" x="184" y="300">判定する</text>
<rect class="box" x="512" y="275" width="270" height="41"/>
<text class="label" x="522" y="300">人の操作の入口だけ（MCP には見せない）</text>
<rect class="box" x="790" y="275" width="210" height="41"/>
<text class="label" x="800" y="300">U16</text>
<rect class="box" x="174" y="322" width="330" height="58"/>
<text class="label" x="184" y="347">探して取り出す ・ 案内する</text>
<rect class="box" x="512" y="322" width="270" height="58"/>
<text class="label" x="522" y="347">CLI ・ MCP</text>
<rect class="box" x="790" y="322" width="210" height="58"/>
<text class="label" x="800" y="347">U1 ・ U5 ・ U6 ・ U12 ・</text>
<text class="label" x="800" y="364">U24 ・ U26</text>
<rect class="box" x="174" y="386" width="330" height="41"/>
<text class="label" x="184" y="411">描画する</text>
<rect class="box" x="512" y="386" width="270" height="41"/>
<text class="label" x="522" y="411">CLI ・ 画面</text>
<rect class="box" x="790" y="386" width="210" height="41"/>
<text class="label" x="800" y="411">U12 ・ U16</text>
<rect class="box" x="174" y="433" width="330" height="41"/>
<text class="label" x="184" y="458">Abstract の版を出す ・ 移す</text>
<rect class="box" x="512" y="433" width="270" height="41"/>
<text class="label" x="522" y="458">基盤を作る側の CLI だけ</text>
<rect class="box" x="790" y="433" width="210" height="41"/>
<text class="label" x="800" y="458">U3 ・ U4</text>
<rect class="box" x="174" y="480" width="330" height="58"/>
<text class="label" x="184" y="505">経緯をたどる（対象ごと ・ 目的ごと。</text>
<text class="label" x="184" y="522">作業した本人の手元ではセッションごと）</text>
<rect class="box" x="512" y="480" width="270" height="58"/>
<text class="label" x="522" y="505">CLI</text>
<rect class="box" x="790" y="480" width="210" height="58"/>
<text class="label" x="800" y="505">U13</text>
<rect class="box" x="174" y="544" width="330" height="109"/>
<text class="label" x="184" y="569">セッションを決める ・ 立てる ・ 閉じる（目的の</text>
<text class="label" x="184" y="586">参照 ・ 親 ・ 役割を受け取り、AI ツールの起動の</text>
<text class="label" x="184" y="603">前に、再開する ID か「新しく立てる」を返す。</text>
<text class="label" x="184" y="620">新しく立てたら、AI ツールが発行した ID を</text>
<text class="label" x="184" y="637">受け取って登録する）</text>
<rect class="box" x="512" y="544" width="270" height="109"/>
<text class="label" x="522" y="569">CLI ・ MCP</text>
<rect class="box" x="790" y="544" width="210" height="109"/>
<text class="label" x="800" y="569">U27</text>
<rect class="box" x="174" y="659" width="330" height="75"/>
<text class="label" x="184" y="684">契約を読む ・ 書く（Concrete の文書 ・</text>
