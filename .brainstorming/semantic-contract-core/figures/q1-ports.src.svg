<rect class="box" x="174" y="1243" width="330" height="41"/>
<text class="label" x="184" y="1268">rule の判定を頼む（AI）</text>
<rect class="box" x="512" y="1243" width="270" height="41"/>
<text class="label" x="522" y="1268">Claude Code ・ Codex などの CLI</text>
