<rect class="box" x="790" y="723" width="210" height="58"/>
<text class="label" x="800" y="748">保存と版の管理</text>
<rect class="box" x="174" y="787" width="330" height="109"/>
<text class="label" x="184" y="812">変更の記録を読む ・ 書く</text>
<rect class="box" x="512" y="787" width="270" height="109"/>
<text class="label" x="522" y="812">文脈のリポジトリのファイル（最初のアダ</text>
<text class="label" x="522" y="829">プターは1件1ファイル。</text>
<text class="label" x="522" y="846">索引は遅いと測れてから、</text>
<text class="label" x="522" y="863">ファイルから作り直せるものを同じポート</text>
<text class="label" x="522" y="880">の後ろに置く）</text>
<rect class="box" x="790" y="787" width="210" height="109"/>
