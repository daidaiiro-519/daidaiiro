<text class="label" x="522" y="978">コミットしない）</text>
<rect class="box" x="790" y="902" width="210" height="92"/>
<text class="label" x="800" y="927">保存と版の管理</text>
<rect class="box" x="174" y="1000" width="330" height="58"/>
<text class="label" x="184" y="1025">変更の前後を受け取る（前の姿 ・ 後の姿 ・</text>
