<svg viewBox="0 0 1016 1296" style="min-width:900px" role="img" aria-label="ポートとアダプター：駆動する側は見せるアダプター、駆動される側は満たすアダプター">
<text class="note" x="20" y="22"></text>
<text class="note" x="178" y="22">ポート</text>
<text class="note" x="516" y="22">アダプター</text>
<text class="note" x="794" y="22">使う場面 ・ 業務領域</text>
<rect class="box focus" x="16" y="32" width="150" height="506"/>
