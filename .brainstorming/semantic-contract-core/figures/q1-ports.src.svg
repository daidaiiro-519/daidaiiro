<rect class="box" x="174" y="787" width="330" height="109"/>
<text class="label" x="184" y="812">変更の記録を読む ・ 書く</text>
<rect class="box" x="512" y="787" width="270" height="109"/>
<text class="label" x="522" y="812">文脈のリポジトリのファイル（最初のアダ</text>
<text class="label" x="522" y="829">プターは1件1ファイル。</text>
