<rect class="box" x="174" y="902" width="330" height="92"/>
<text class="label" x="184" y="927">手元のセッションの索引を読む ・ 書く</text>
<rect class="box" x="512" y="902" width="270" height="92"/>
<text class="label" x="522" y="927">作業した人の手元（最初のアダプターは</text>
