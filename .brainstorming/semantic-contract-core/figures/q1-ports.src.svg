<text class="label" x="522" y="1157">る）</text>
<rect class="box" x="790" y="1115" width="210" height="58"/>
<text class="label" x="800" y="1140">保存と版の管理</text>
<rect class="box" x="174" y="1179" width="330" height="58"/>
<text class="label" x="184" y="1204">公開された言葉を取りに行く（ほかの文脈の公開する</text>
