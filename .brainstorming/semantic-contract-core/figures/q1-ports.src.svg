<rect class="box" x="790" y="32" width="210" height="92"/>
<text class="label" x="800" y="57">U1 ・ U2 ・ U3 ・ U23 ・</text>
<text class="label" x="800" y="74">U24</text>
<rect class="box" x="174" y="130" width="330" height="75"/>
<text class="label" x="184" y="155">instance を書く（Scaffold ・ 作る ・ 変える</text>
<text class="label" x="184" y="172"> ・ 消す ・ 取り込む。セッションの参照と意図を</text>
<text class="label" x="184" y="189">一緒に受け取る）</text>
<rect class="box" x="512" y="130" width="270" height="75"/>
<text class="label" x="522" y="155">CLI ・ MCP</text>
<rect class="box" x="790" y="130" width="210" height="75"/>
<text class="label" x="800" y="155">U5 ・ U6 ・ U7 ・ U11 ・</text>
<text class="label" x="800" y="172">U17</text>
<rect class="box" x="174" y="211" width="330" height="58"/>
<text class="label" x="184" y="236">検証する ・ 変更を見せる（まとめ方と変更の</text>
