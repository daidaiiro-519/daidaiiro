<text class="label" x="522" y="1093">コミットしない）</text>
<rect class="box" x="790" y="1017" width="210" height="92"/>
<text class="label" x="800" y="1042">保存と版の管理</text>
<rect class="box" x="174" y="1115" width="330" height="58"/>
<text class="label" x="184" y="1140">変更の前後を受け取る（前の姿 ・ 後の姿 ・</text>
<text class="label" x="184" y="1157">出した者 ・ 消した ID の履歴）</text>
<rect class="box" x="512" y="1115" width="270" height="58"/>
