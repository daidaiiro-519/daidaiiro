<rect class="box" x="512" y="211" width="270" height="58"/>
<text class="label" x="522" y="236">CLI ・ MCP ・ CI</text>
<rect class="box" x="790" y="211" width="210" height="58"/>
<text class="label" x="800" y="236">U8 ・ U10 ・ U18 ・ U25</text>
<rect class="box" x="174" y="275" width="330" height="41"/>
<text class="label" x="184" y="300">判定する</text>
<rect class="box" x="512" y="275" width="270" height="41"/>
<text class="label" x="522" y="300">人の操作の入口だけ（MCP には見せない）</text>
<rect class="box" x="790" y="275" width="210" height="41"/>
<text class="label" x="800" y="300">U16</text>
<rect class="box" x="174" y="322" width="330" height="58"/>
<text class="label" x="184" y="347">探して取り出す ・ 案内する</text>
<rect class="box" x="512" y="322" width="270" height="58"/>
<text class="label" x="522" y="347">CLI ・ MCP</text>
<rect class="box" x="790" y="322" width="210" height="58"/>
<text class="label" x="800" y="347">U1 ・ U5 ・ U6 ・ U12 ・</text>
<text class="label" x="800" y="364">U24 ・ U26</text>
<rect class="box" x="174" y="386" width="330" height="41"/>
