<rect class="box" x="790" y="595" width="210" height="58"/>
<text class="label" x="800" y="620">保存と版の管理</text>
<rect class="box" x="174" y="659" width="330" height="58"/>
<text class="label" x="184" y="684">instance を読む ・ 書く</text>
<rect class="box" x="512" y="659" width="270" height="58"/>
<text class="label" x="522" y="684">文脈のリポジトリのファイル</text>
<rect class="box" x="790" y="659" width="210" height="58"/>
<text class="label" x="800" y="684">保存と版の管理</text>
<rect class="box" x="174" y="723" width="330" height="58"/>
<text class="label" x="184" y="748">判定の記録を読む ・ 書く</text>
