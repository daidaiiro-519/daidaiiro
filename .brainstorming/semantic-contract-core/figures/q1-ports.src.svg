<rect class="box" x="512" y="1000" width="270" height="58"/>
<text class="label" x="522" y="1025">Git（出した者は変更の仕組みが約束す</text>
<text class="label" x="522" y="1042">る）</text>
<rect class="box" x="790" y="1000" width="210" height="58"/>
<text class="label" x="800" y="1025">保存と版の管理</text>
<rect class="box" x="174" y="1064" width="330" height="58"/>
<text class="label" x="184" y="1089">公開された言葉を取りに行く（ほかの文脈の公開する</text>
