<text class="label" x="522" y="364">CLI ・ MCP</text>
<rect class="box" x="790" y="339" width="210" height="58"/>
<text class="label" x="800" y="364">U1 ・ U5 ・ U6 ・ U12 ・</text>
<text class="label" x="800" y="381">U24</text>
<rect class="box" x="174" y="403" width="330" height="58"/>
<text class="label" x="184" y="428">描画する</text>
