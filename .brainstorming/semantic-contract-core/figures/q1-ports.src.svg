<rect class="box" x="790" y="838" width="210" height="58"/>
<text class="label" x="800" y="863">保存と版の管理</text>
<rect class="box" x="174" y="902" width="330" height="109"/>
<text class="label" x="184" y="927">変更の記録を読む ・ 書く</text>
<rect class="box" x="512" y="902" width="270" height="109"/>
<text class="label" x="522" y="927">文脈のリポジトリのファイル（最初のアダ</text>
<text class="label" x="522" y="944">プターは1件1ファイル。</text>
<text class="label" x="522" y="961">索引は遅いと測れてから、</text>
<text class="label" x="522" y="978">ファイルから作り直せるものを同じポート</text>
<text class="label" x="522" y="995">の後ろに置く）</text>
<rect class="box" x="790" y="902" width="210" height="109"/>
<text class="label" x="800" y="927">保存と版の管理</text>
<rect class="box" x="174" y="1017" width="330" height="92"/>
<text class="label" x="184" y="1042">セッションと手元のセッションの索引を読む ・ 書く</text>
<rect class="box" x="512" y="1017" width="270" height="92"/>
