<text class="label" x="522" y="236">CLI ・ MCP ・ CI</text>
<rect class="box" x="790" y="211" width="210" height="58"/>
<text class="label" x="800" y="236">U8 ・ U10 ・ U18 ・ U25</text>
<rect class="box" x="174" y="275" width="330" height="58"/>
