<rect class="box" x="790" y="544" width="210" height="75"/>
<text class="label" x="800" y="569">保存と版の管理</text>
<rect class="box" x="174" y="625" width="330" height="92"/>
<text class="label" x="184" y="650">instance を読む ・ 書く</text>
<rect class="box" x="512" y="625" width="270" height="92"/>
<text class="label" x="522" y="650">文脈のリポジトリのファイル（正本。</text>
