<svg viewBox="0 0 1088 533" style="min-width:900px" role="img" aria-label="Core の x- の9つ：書く場所と中身">
<text class="note" x="20" y="22">書く場所</text>
<text class="note" x="138" y="22">x-</text>
<text class="note" x="316" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="110" height="216"/>
<text class="title" x="26" y="57">根</text>
<rect class="box focus" x="16" y="254" width="110" height="58"/>
<text class="title" x="26" y="279">根と欄</text>
<rect class="box focus" x="16" y="318" width="110" height="199"/>
<text class="title" x="26" y="343">欄</text>
<rect class="box" x="134" y="32" width="170" height="41"/>
<text class="label" x="144" y="57">x-instance-path</text>
<rect class="box" x="312" y="32" width="760" height="41"/>
<text class="label" x="322" y="57">instance を置く場所。名前の入る所は {id} のように書く（RFC 6570 のレベル1）</text>
<rect class="box" x="134" y="79" width="170" height="41"/>
<text class="label" x="144" y="104">x-instance-label</text>
<rect class="box" x="312" y="79" width="760" height="41"/>
<text class="label" x="322" y="104">他から指されたときと、変更を見せるときの instance の名前の型（例 "論点 {id}「{name}」"）</text>
<rect class="box" x="134" y="126" width="170" height="58"/>
<text class="label" x="144" y="151">x-delegates</text>
<rect class="box" x="312" y="126" width="760" height="58"/>
<text class="label" x="322" y="151">任せる先：名前 → { role ・ concrete（Concrete の URN）・ model（任意） }。外のツールは、それを包む</text>
<text class="label" x="322" y="168">Concrete（Skill）を置く</text>
<rect class="box" x="134" y="190" width="170" height="58"/>
<text class="label" x="144" y="215">x-extensions</text>
<rect class="box" x="312" y="190" width="760" height="58"/>
<text class="label" x="322" y="215">Concrete が足す x- の定義：名前 → { schema ・ description ・ x-prompt ・ x-published（任意） }。</text>
<text class="label" x="322" y="232">判定はその x-prompt の rule に書く</text>
<rect class="box" x="134" y="254" width="170" height="58"/>
<text class="label" x="144" y="279">x-prompt</text>
<rect class="box" x="312" y="254" width="760" height="58"/>
<text class="label" x="322" y="279">読むとき（read：means ・ parse ・ shown ・ when）と書くとき（write：rule の並び）のプロンプト。</text>
<text class="label" x="322" y="296">rule の by は machine ・ ai ・ human で、ai なら agent で任せる先を指す</text>
<rect class="box" x="134" y="318" width="170" height="41"/>
<text class="label" x="144" y="343">x-relationship</text>
<rect class="box" x="312" y="318" width="760" height="41"/>
<text class="label" x="322" y="343">この欄が指す instance の種類：{ to: Concrete の URN }。指す先が無ければ違反</text>
<rect class="box" x="134" y="365" width="170" height="41"/>
<text class="label" x="144" y="390">x-derived-from</text>
<rect class="box" x="312" y="365" width="760" height="41"/>
<text class="label" x="322" y="390">この欄の値を何からどう導くか（rules ・ otherwise ・ declared）と、その依存（reads）</text>
<rect class="box" x="134" y="412" width="170" height="41"/>
<text class="label" x="144" y="437">x-decided-by</text>
<rect class="box" x="312" y="412" width="760" height="41"/>
<text class="label" x="322" y="437">"human" のとき、この欄の値を決めるのは人。AI が書き写すのはよいが、値は人の入口から来たものに限る</text>
<rect class="box" x="134" y="459" width="170" height="58"/>
<text class="label" x="144" y="484">x-published</text>
<rect class="box" x="312" y="459" width="760" height="58"/>
<text class="label" x="322" y="484">true のとき、この欄を他の文脈へ見せる。term は glossary の側に、x- は x-extensions の定義の側に付ける。</text>
<text class="label" x="322" y="501">版は $id の v&lt;版> が表す</text>
</svg>