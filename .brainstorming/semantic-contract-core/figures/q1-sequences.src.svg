<svg viewBox="0 0 1012 1144" style="min-width:900px" role="img" aria-label="出来事の列の試験：モデルで実行して全部通る">
<text class="note" x="20" y="22">#</text>
<text class="note" x="84" y="22">場面</text>
<text class="note" x="162" y="22">出来事の列と期待する結果</text>
<text class="note" x="810" y="22">不変条件</text>
<rect class="box focus" x="80" y="32" width="70" height="58"/>
<text class="title" x="90" y="57">U0</text>
<rect class="box focus" x="80" y="96" width="70" height="58"/>
<text class="title" x="90" y="121">U10</text>
<rect class="box focus" x="80" y="160" width="70" height="41"/>
<text class="title" x="90" y="185">U9</text>
<rect class="box focus" x="80" y="207" width="70" height="41"/>
<text class="title" x="90" y="232">U12</text>
<rect class="box focus" x="80" y="254" width="70" height="41"/>
<text class="title" x="90" y="279">U13</text>
<rect class="box focus" x="80" y="301" width="70" height="41"/>
<text class="title" x="90" y="326">U16</text>
<rect class="box focus" x="80" y="348" width="70" height="58"/>
<text class="title" x="90" y="373">U14</text>
<rect class="box focus" x="80" y="412" width="70" height="41"/>
<text class="title" x="90" y="437">U7</text>
<rect class="box focus" x="80" y="459" width="70" height="41"/>
<text class="title" x="90" y="484">U11</text>
<rect class="box focus" x="80" y="506" width="70" height="41"/>
<text class="title" x="90" y="531">U16</text>
<rect class="box focus" x="80" y="553" width="70" height="41"/>
<text class="title" x="90" y="578">U5</text>
<rect class="box focus" x="80" y="600" width="70" height="41"/>
<text class="title" x="90" y="625">U2</text>
<rect class="box focus" x="80" y="647" width="70" height="88"/>
<text class="title" x="90" y="672">U16</text>
<rect class="box focus" x="80" y="741" width="70" height="41"/>
<text class="title" x="90" y="766">U9</text>
<rect class="box focus" x="80" y="788" width="70" height="88"/>
<text class="title" x="90" y="813">U14</text>
<rect class="box focus" x="80" y="882" width="70" height="41"/>
<text class="title" x="90" y="907">U11</text>
<rect class="box focus" x="80" y="929" width="70" height="58"/>
<text class="title" x="90" y="954">U17</text>
<rect class="box focus" x="80" y="993" width="70" height="41"/>
<text class="title" x="90" y="1018">U8</text>
<rect class="box focus" x="80" y="1040" width="70" height="41"/>
<text class="title" x="90" y="1065">U1</text>
<rect class="box focus" x="80" y="1087" width="70" height="41"/>
<text class="title" x="90" y="1112">U6</text>
<rect class="box" x="16" y="32" width="56" height="58"/>
<text class="label" x="26" y="57">S1</text>
<rect class="box" x="158" y="32" width="640" height="58"/>
<text class="label" x="168" y="57">検証済み → 参照先の instance が変わる → 読むと検証待ち。人の判断は断られる</text>
<rect class="box" x="806" y="32" width="190" height="58"/>
<text class="label" x="816" y="57">J15 ・ J17 ・ J20 ・</text>
<text class="label" x="816" y="74">J24</text>
<rect class="box" x="16" y="96" width="56" height="58"/>
<text class="label" x="26" y="121">S2</text>
<rect class="box" x="158" y="96" width="640" height="58"/>
<text class="label" x="168" y="121">AI の validator を替える → 抜き取ってから承認1回 → AI の rule だけ検証し直し、</text>
<text class="label" x="168" y="138">人の判断は効いたまま</text>
<rect class="box" x="806" y="96" width="190" height="58"/>
<text class="label" x="816" y="121">J3 ・ J5 ・ J15 ・ J21</text>
<rect class="box" x="16" y="160" width="56" height="41"/>
<text class="label" x="26" y="185">S3</text>
<rect class="box" x="158" y="160" width="640" height="41"/>
<text class="label" x="168" y="185">AI が rule を弱めた版を依頼 → AI が書き直す → 人が見た中身では承認できない</text>
<rect class="box" x="806" y="160" width="190" height="41"/>
<text class="label" x="816" y="185">J3 ・ J4</text>
<rect class="box" x="16" y="207" width="56" height="41"/>
<text class="label" x="26" y="232">S4</text>
<rect class="box" x="158" y="207" width="640" height="41"/>
<text class="label" x="168" y="232">検証済み → 基盤を通らずに読む欄を書き換える → その rule は検証待ちで、verified と示さない</text>
<rect class="box" x="806" y="207" width="190" height="41"/>
<text class="label" x="816" y="232">J15 ・ J17</text>
<rect class="box" x="16" y="254" width="56" height="41"/>
<text class="label" x="26" y="279">S5</text>
<rect class="box" x="158" y="254" width="640" height="41"/>
<text class="label" x="168" y="279">人の判断の記録を書き換える → その判断は効かず、判断の前の結果に戻る</text>
<rect class="box" x="806" y="254" width="190" height="41"/>
<text class="label" x="816" y="279">J26 ・ J23</text>
<rect class="box" x="16" y="301" width="56" height="41"/>
<text class="label" x="26" y="326">S6</text>
<rect class="box" x="158" y="301" width="640" height="41"/>
<text class="label" x="168" y="326">unverified → 人が「合っていない」と判断 → violated（人）で、instance は下書き</text>
<rect class="box" x="806" y="301" width="190" height="41"/>
<text class="label" x="816" y="326">J19 ・ J24</text>
<rect class="box" x="16" y="348" width="56" height="58"/>
<text class="label" x="26" y="373">S7</text>
<rect class="box" x="158" y="348" width="640" height="58"/>
<text class="label" x="168" y="373">AI の validator が error を返す → 検証待ちのまま次の検証で再び渡し、同じ入力で3回続けば</text>
<text class="label" x="168" y="390">unverified</text>
<rect class="box" x="806" y="348" width="190" height="58"/>
<text class="label" x="816" y="373">J17 ・ J18</text>
<rect class="box" x="16" y="412" width="56" height="41"/>
<text class="label" x="26" y="437">S8</text>
<rect class="box" x="158" y="412" width="640" height="41"/>
<text class="label" x="168" y="437">新しい版へ移すと violated → 元の版とハッシュのまま残り、理由が返る</text>
<rect class="box" x="806" y="412" width="190" height="41"/>
<text class="label" x="816" y="437">J10</text>
<rect class="box" x="16" y="459" width="56" height="41"/>
<text class="label" x="26" y="484">S9</text>
<rect class="box" x="158" y="459" width="640" height="41"/>
<text class="label" x="168" y="484">消した → 消した ID で変える ・ 作る → 断られる</text>
<rect class="box" x="806" y="459" width="190" height="41"/>
<text class="label" x="816" y="484">J13</text>
<rect class="box" x="16" y="506" width="56" height="41"/>
<text class="label" x="26" y="531">S10</text>
<rect class="box" x="158" y="506" width="640" height="41"/>
<text class="label" x="168" y="531">AI の violated を人が覆す。機械の violated は覆せない</text>
<rect class="box" x="806" y="506" width="190" height="41"/>
<text class="label" x="816" y="531">J20</text>
<rect class="box" x="16" y="553" width="56" height="41"/>
<text class="label" x="26" y="578">S11</text>
<rect class="box" x="158" y="553" width="640" height="41"/>
<text class="label" x="168" y="578">AI には読む欄だけが渡り、根拠が読む欄に無い verified は unverified になる（検証の経路で）</text>
<rect class="box" x="806" y="553" width="190" height="41"/>
<text class="label" x="816" y="578">J9 ・ J16</text>
<rect class="box" x="16" y="600" width="56" height="41"/>
<text class="label" x="26" y="625">S12</text>
<rect class="box" x="158" y="600" width="640" height="41"/>
<text class="label" x="168" y="625">新しい版を公開 → 試して結果が変わる instance だけが前の版で検証済み</text>
<rect class="box" x="806" y="600" width="190" height="41"/>
<text class="label" x="816" y="625">J25</text>
<rect class="box" x="16" y="647" width="56" height="41"/>
<text class="label" x="26" y="672">S13</text>
<rect class="box" x="158" y="647" width="640" height="41"/>
<text class="label" x="168" y="672">人に示したあとに AI が読む欄を変える → 示した入力では判断できない</text>
<rect class="box" x="806" y="647" width="190" height="41"/>
<text class="label" x="816" y="672">J21</text>
<rect class="box" x="16" y="694" width="56" height="41"/>
<text class="label" x="26" y="719">S14</text>
<rect class="box" x="158" y="694" width="640" height="41"/>
<text class="label" x="168" y="719">まとめて判断 → instance ごとに保存し、断ったものの一覧が返る</text>
<rect class="box" x="806" y="694" width="190" height="41"/>
<text class="label" x="816" y="719">J22</text>
<rect class="box" x="16" y="741" width="56" height="41"/>
<text class="label" x="26" y="766">S15</text>
<rect class="box" x="158" y="741" width="640" height="41"/>
<text class="label" x="168" y="766">AI は承認 ・ 判断 ・ 取り消しができない</text>
<rect class="box" x="806" y="741" width="190" height="41"/>
<text class="label" x="816" y="766">J6</text>
<rect class="box" x="16" y="788" width="56" height="41"/>
<text class="label" x="26" y="813">S16</text>
<rect class="box" x="158" y="788" width="640" height="41"/>
<text class="label" x="168" y="813">抜き取りの人の判断が無いまま割り当ての承認を依頼する → 断られる（qa の U0-1）</text>
<rect class="box" x="806" y="788" width="190" height="41"/>
<text class="label" x="816" y="813">J5</text>
<rect class="box" x="16" y="835" width="56" height="41"/>
<text class="label" x="26" y="860">S17</text>
<rect class="box" x="158" y="835" width="640" height="41"/>
<text class="label" x="168" y="860">抜き取りで人と AI が食い違う → 承認の依頼に食い違いの数が載る</text>
<rect class="box" x="806" y="835" width="190" height="41"/>
<text class="label" x="816" y="860">J5</text>
<rect class="box" x="16" y="882" width="56" height="41"/>
<text class="label" x="26" y="907">S18</text>
<rect class="box" x="158" y="882" width="640" height="41"/>
<text class="label" x="168" y="907">ほかの instance が x-ref で指している instance を消す → 断られる（qa の U0-3）</text>
<rect class="box" x="806" y="882" width="190" height="41"/>
<text class="label" x="816" y="907">J12</text>
<rect class="box" x="16" y="929" width="56" height="58"/>
<text class="label" x="26" y="954">S19</text>
<rect class="box" x="158" y="929" width="640" height="58"/>
<text class="label" x="168" y="954">$schema が決まらないファイルを取り込む → 候補になり、AI は確定できず、</text>
<text class="label" x="168" y="971">人が確定すると検証待ちから始まる（qa の U0-4）</text>
<rect class="box" x="806" y="929" width="190" height="58"/>
<text class="label" x="816" y="954">J6</text>
<rect class="box" x="16" y="993" width="56" height="41"/>
<text class="label" x="26" y="1018">S20</text>
<rect class="box" x="158" y="993" width="640" height="41"/>
<text class="label" x="168" y="1018">機械の rule が error を返し続ける → 検証待ちのままで、人は判断で埋められない</text>
<rect class="box" x="806" y="993" width="190" height="41"/>
<text class="label" x="816" y="1018">J17 ・ J20</text>
<rect class="box" x="16" y="1040" width="56" height="41"/>
<text class="label" x="26" y="1065">S21</text>
<rect class="box" x="158" y="1040" width="640" height="41"/>
<text class="label" x="168" y="1065">公開した term を書き換える → 断られる。新しい版は別の名前で並べる</text>
<rect class="box" x="806" y="1040" width="190" height="41"/>
<text class="label" x="816" y="1065">J1 ・ J2</text>
<rect class="box" x="16" y="1087" width="56" height="41"/>
<text class="label" x="26" y="1112">S22</text>
<rect class="box" x="158" y="1087" width="640" height="41"/>
<text class="label" x="168" y="1112">変えてよい範囲は Concrete の版が決め、範囲の外の欄の変更は断られる</text>
<rect class="box" x="806" y="1087" width="190" height="41"/>
<text class="label" x="816" y="1112">J11</text>
</svg>