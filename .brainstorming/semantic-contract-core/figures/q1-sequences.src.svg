<svg viewBox="0 0 962 990" style="min-width:900px" role="img" aria-label="出来事の列の試験：モデルで実行して18本とも通る">
<text class="note" x="20" y="22">#</text>
<text class="note" x="84" y="22">場面</text>
<text class="note" x="162" y="22">出来事の列と期待する結果</text>
<text class="note" x="810" y="22">不変条件</text>
<rect class="box focus" x="80" y="32" width="70" height="41"/>
<text class="title" x="90" y="57">U5</text>
<rect class="box focus" x="80" y="79" width="70" height="41"/>
<text class="title" x="90" y="104">U16</text>
<rect class="box focus" x="80" y="126" width="70" height="88"/>
<text class="title" x="90" y="151">U6</text>
<rect class="box focus" x="80" y="220" width="70" height="41"/>
<text class="title" x="90" y="245">U16</text>
<rect class="box focus" x="80" y="267" width="70" height="88"/>
<text class="title" x="90" y="292">U5</text>
<rect class="box focus" x="80" y="361" width="70" height="41"/>
<text class="title" x="90" y="386">U16</text>
<rect class="box focus" x="80" y="408" width="70" height="41"/>
<text class="title" x="90" y="433">U22</text>
<rect class="box focus" x="80" y="455" width="70" height="58"/>
<text class="title" x="90" y="480">U11</text>
<rect class="box focus" x="80" y="519" width="70" height="41"/>
<text class="title" x="90" y="544">U12</text>
<rect class="box focus" x="80" y="566" width="70" height="41"/>
<text class="title" x="90" y="591">U2</text>
<rect class="box focus" x="80" y="613" width="70" height="58"/>
<text class="title" x="90" y="638">U14</text>
<rect class="box focus" x="80" y="677" width="70" height="41"/>
<text class="title" x="90" y="702">U1</text>
<rect class="box focus" x="80" y="724" width="70" height="58"/>
<text class="title" x="90" y="749">U2</text>
<rect class="box focus" x="80" y="788" width="70" height="58"/>
<text class="title" x="90" y="813">U0</text>
<rect class="box focus" x="80" y="852" width="70" height="58"/>
<text class="title" x="90" y="877">U8</text>
<rect class="box focus" x="80" y="916" width="70" height="58"/>
<text class="title" x="90" y="941">U14</text>
<rect class="box" x="16" y="32" width="56" height="41"/>
<text class="label" x="26" y="57">S1</text>
<rect class="box" x="158" y="32" width="640" height="41"/>
<text class="label" x="168" y="57">AI が書いた記事を検証する → 機械と AI がどちらも verified なら、人には何も出ず検証済み</text>
<rect class="box" x="806" y="32" width="140" height="41"/>
<text class="label" x="816" y="57">M3 ・ M9</text>
<rect class="box" x="16" y="79" width="56" height="41"/>
<text class="label" x="26" y="104">S2</text>
<rect class="box" x="158" y="79" width="640" height="41"/>
<text class="label" x="168" y="104">AI が判定できない → 判断待ちで人が見るものに出る → 人が判定すると検証済み</text>
<rect class="box" x="806" y="79" width="140" height="41"/>
<text class="label" x="816" y="104">M7 ・ M9</text>
<rect class="box" x="16" y="126" width="56" height="41"/>
<text class="label" x="26" y="151">S3</text>
<rect class="box" x="158" y="126" width="640" height="41"/>
<text class="label" x="168" y="151">人が判定したあとに読む欄が変わる → 判定は効かず、AI に聞き直す</text>
<rect class="box" x="806" y="126" width="140" height="41"/>
<text class="label" x="816" y="151">M7</text>
<rect class="box" x="16" y="173" width="56" height="41"/>
<text class="label" x="26" y="198">S4</text>
<rect class="box" x="158" y="173" width="640" height="41"/>
<text class="label" x="168" y="198">読まない欄だけが変わる → 人の判定は効いたまま</text>
<rect class="box" x="806" y="173" width="140" height="41"/>
<text class="label" x="816" y="198">M7</text>
<rect class="box" x="16" y="220" width="56" height="41"/>
<text class="label" x="26" y="245">S5</text>
<rect class="box" x="158" y="220" width="640" height="41"/>
<text class="label" x="168" y="245">人に見せたあとに中身が変わる → 見せた中身では判定できない</text>
<rect class="box" x="806" y="220" width="140" height="41"/>
<text class="label" x="816" y="245">M7</text>
<rect class="box" x="16" y="267" width="56" height="41"/>
<text class="label" x="26" y="292">S6</text>
<rect class="box" x="158" y="267" width="640" height="41"/>
<text class="label" x="168" y="292">AI の根拠が読む欄に無い ・ 根拠が空 ・ 答えが割れる → どれも unverified</text>
<rect class="box" x="806" y="267" width="140" height="41"/>
<text class="label" x="816" y="292">M5</text>
<rect class="box" x="16" y="314" width="56" height="41"/>
<text class="label" x="26" y="339">S7</text>
<rect class="box" x="158" y="314" width="640" height="41"/>
<text class="label" x="168" y="339">AI が渡された値を書き換えても、記事は変わらない（AI に渡すのは写しだけ）</text>
<rect class="box" x="806" y="314" width="140" height="41"/>
<text class="label" x="816" y="339">M5</text>
<rect class="box" x="16" y="361" width="56" height="41"/>
<text class="label" x="26" y="386">S8</text>
<rect class="box" x="158" y="361" width="640" height="41"/>
<text class="label" x="168" y="386">AI の violated は人が覆せる。機械の violated と、基盤の violated（参照先が無い）は覆せない</text>
<rect class="box" x="806" y="361" width="140" height="41"/>
<text class="label" x="816" y="386">M8</text>
<rect class="box" x="16" y="408" width="56" height="41"/>
<text class="label" x="26" y="433">S9</text>
<rect class="box" x="158" y="408" width="640" height="41"/>
<text class="label" x="168" y="433">判定し直す → 判定の記録は instance × rule ごとに1つで、新しい判定に置き換わる</text>
<rect class="box" x="806" y="408" width="140" height="41"/>
<text class="label" x="816" y="433">M7</text>
<rect class="box" x="16" y="455" width="56" height="58"/>
<text class="label" x="26" y="480">S10</text>
<rect class="box" x="158" y="455" width="640" height="58"/>
<text class="label" x="168" y="480">参照先の記事が消える（別の変更を取り込んだ結果でも同じ）→ 指していた記事は基盤が violated</text>
<text class="label" x="168" y="497">にする</text>
<rect class="box" x="806" y="455" width="140" height="58"/>
<text class="label" x="816" y="480">M6</text>
<rect class="box" x="16" y="519" width="56" height="41"/>
<text class="label" x="26" y="544">S11</text>
<rect class="box" x="158" y="519" width="640" height="41"/>
<text class="label" x="168" y="544">AI には参照先の値が渡り、関係を意味で判定できる。参照先が下書きでも、参照元には伝えない</text>
<rect class="box" x="806" y="519" width="140" height="41"/>
<text class="label" x="816" y="544">M5 ・ M6</text>
<rect class="box" x="16" y="566" width="56" height="41"/>
<text class="label" x="26" y="591">S12</text>
<rect class="box" x="158" y="566" width="640" height="41"/>
<text class="label" x="168" y="591">契約の rule を消す変更 → 状態が変わる記事が出る（差分と理由は変更の仕組みが持つ）</text>
<rect class="box" x="806" y="566" width="140" height="41"/>
<text class="label" x="816" y="591">M10</text>
<rect class="box" x="16" y="613" width="56" height="58"/>
<text class="label" x="26" y="638">S13</text>
<rect class="box" x="158" y="613" width="640" height="58"/>
<text class="label" x="168" y="638">validator を替える変更 → AI の判定は聞き直して記録が変更に入り、結果が変わる記事が出る。</text>
<text class="label" x="168" y="655">人の判定は効いたまま</text>
<rect class="box" x="806" y="613" width="140" height="58"/>
<text class="label" x="816" y="638">M10 ・ M7</text>
<rect class="box" x="16" y="677" width="56" height="41"/>
<text class="label" x="26" y="702">S14</text>
<rect class="box" x="158" y="677" width="640" height="41"/>
<text class="label" x="168" y="702">判定する者 ・ 読む欄の無い rule と、契約に無い term を使う rule は断られる</text>
<rect class="box" x="806" y="677" width="140" height="41"/>
<text class="label" x="816" y="702">M2</text>
<rect class="box" x="16" y="724" width="56" height="58"/>
<text class="label" x="26" y="749">S15</text>
<rect class="box" x="158" y="724" width="640" height="58"/>
<text class="label" x="168" y="749">term の定義を変える変更 → 断らない。その term を使う rule の AI と人の判定は効かなくなり、</text>
<text class="label" x="168" y="766">聞き直す</text>
<rect class="box" x="806" y="724" width="140" height="58"/>
<text class="label" x="816" y="749">M7</text>
<rect class="box" x="16" y="788" width="56" height="58"/>
<text class="label" x="26" y="813">S16</text>
<rect class="box" x="158" y="788" width="640" height="58"/>
<text class="label" x="168" y="813">何も変えずに何度検証し直しても、AI の判定は記録を使うので状態は変わらない（AI</text>
<text class="label" x="168" y="830">が毎回違う答えを返しても）</text>
<rect class="box" x="806" y="788" width="140" height="58"/>
<text class="label" x="816" y="813">M4</text>
<rect class="box" x="16" y="852" width="56" height="58"/>
<text class="label" x="26" y="877">S17</text>
<rect class="box" x="158" y="852" width="640" height="58"/>
<text class="label" x="168" y="877">validator が答えられない（error）→ 記録せず、確かめ直しを待つ。必須の欄が空なら機械の rule</text>
<text class="label" x="168" y="894">で下書き</text>
<rect class="box" x="806" y="852" width="140" height="58"/>
<text class="label" x="816" y="877">M3 ・ M9</text>
<rect class="box" x="16" y="916" width="56" height="58"/>
<text class="label" x="26" y="941">S18</text>
<rect class="box" x="158" y="916" width="640" height="58"/>
<text class="label" x="168" y="941">validator の割り当てが無い AI の rule → unsupported で人が見るものに出る。</text>
<text class="label" x="168" y="958">判定は「合っている」「合っていない」だけ</text>
<rect class="box" x="806" y="916" width="140" height="58"/>
<text class="label" x="816" y="941">M3</text>
</svg>