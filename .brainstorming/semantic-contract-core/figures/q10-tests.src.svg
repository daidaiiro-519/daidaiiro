<text class="title" x="90" y="646">U5</text>
<rect class="box" x="16" y="32" width="56" height="58"/>
<text class="label" x="26" y="57">TS1</text>
<rect class="box" x="158" y="32" width="640" height="58"/>
<text class="label" x="168" y="57">変更セットで AI が記事を書く → 変更セットの 信頼できる実行者が検証し、人が見るものが</text>
<text class="label" x="168" y="74">変更セットに出る</text>
<rect class="box" x="806" y="32" width="190" height="58"/>
<text class="label" x="816" y="57">J35</text>
<rect class="box" x="16" y="96" width="56" height="58"/>
<text class="label" x="26" y="121">TS2</text>
<rect class="box" x="158" y="96" width="640" height="58"/>
<text class="label" x="168" y="121">変更セットの中で人が確かめる → 検証済み。そのあと 変更セットに追加の変更 して中身が変わる →</text>
<text class="label" x="168" y="138">確かめたことは効かない</text>
<rect class="box" x="806" y="96" width="190" height="58"/>
<text class="label" x="816" y="121">J21 ・ J35</text>
<rect class="box" x="16" y="160" width="56" height="41"/>
<text class="label" x="26" y="185">TS3</text>
<rect class="box" x="158" y="160" width="640" height="41"/>
<text class="label" x="168" y="185">統合先に別の人の変更が入る → 自分の変更セットに取り込むと、変わった中身だけが検証し直される</text>
<rect class="box" x="806" y="160" width="190" height="41"/>
<text class="label" x="816" y="185">J34 ・ J21</text>
<rect class="box" x="16" y="207" width="56" height="58"/>
<text class="label" x="26" y="232">TS4</text>
<rect class="box" x="158" y="207" width="640" height="58"/>
<text class="label" x="168" y="232">自分が 変更セットの中で確かめた記事を、統合先で別の人が変えていた → 取り込むと、</text>
<text class="label" x="168" y="249">確かめたことは効かず 変更セットに出る</text>
<rect class="box" x="806" y="207" width="190" height="58"/>
<text class="label" x="816" y="232">J21</text>
<rect class="box" x="16" y="271" width="56" height="58"/>
<text class="label" x="26" y="296">TS5</text>
<rect class="box" x="158" y="271" width="640" height="58"/>
<text class="label" x="168" y="296">統合先で記事 p1 が消された → 自分の変更セットで p1 を指していた記事は、</text>
<text class="label" x="168" y="313">取り込み時の検証で違反になる</text>
<rect class="box" x="806" y="271" width="190" height="58"/>
<text class="label" x="816" y="296">J12</text>
<rect class="box" x="16" y="335" width="56" height="58"/>
<text class="label" x="26" y="360">TS6</text>
<rect class="box" x="158" y="335" width="640" height="58"/>
<text class="label" x="168" y="360">統合先に別の契約 v2 が先に入った → 自分の v2</text>
<text class="label" x="168" y="377">は取り込み時に「試し直して変更セットの中で確かめる」になる</text>
<rect class="box" x="806" y="335" width="190" height="58"/>
<text class="label" x="816" y="360">J30</text>
<rect class="box" x="16" y="399" width="56" height="41"/>
<text class="label" x="26" y="424">TS7</text>
<rect class="box" x="158" y="399" width="640" height="41"/>
<text class="label" x="168" y="424">同じ記事の同じ欄を、統合先 と自分の変更セットで別々に変えた → 衝突として人が中身を選ぶ</text>
<rect class="box" x="806" y="399" width="190" height="41"/>
<text class="label" x="816" y="424">J34</text>
<rect class="box" x="16" y="446" width="56" height="58"/>
<text class="label" x="26" y="471">TS8</text>
<rect class="box" x="158" y="446" width="640" height="58"/>
<text class="label" x="168" y="471">手で verified の記録をファイルとして足す ・ 信頼できない場所で検証する → どちらも効かない。</text>
<text class="label" x="168" y="488">信頼できる実行者の検証だけが効く</text>
<rect class="box" x="806" y="446" width="190" height="58"/>
<text class="label" x="816" y="471">J35</text>
<rect class="box" x="16" y="510" width="56" height="58"/>
<text class="label" x="26" y="535">TS9</text>
<rect class="box" x="158" y="510" width="640" height="58"/>
<text class="label" x="168" y="535">信頼できる実行者の2回の検証 で AI の答えが割れた → 取り込みの順番によらず unverified にな</text>
<text class="label" x="168" y="552">り、変更セット に人が見るものとして出る</text>
<rect class="box" x="806" y="510" width="190" height="58"/>
<text class="label" x="816" y="535">J32</text>
<rect class="box" x="16" y="574" width="56" height="41"/>
<text class="label" x="26" y="599">TS10</text>
<rect class="box" x="158" y="574" width="640" height="41"/>
<text class="label" x="168" y="599">変更セットで確かめていない判断は、チームでは効かない</text>
<rect class="box" x="806" y="574" width="190" height="41"/>
<text class="label" x="816" y="599">J35</text>
<rect class="box" x="16" y="621" width="56" height="58"/>
<text class="label" x="26" y="646">TS11</text>
<rect class="box" x="158" y="621" width="640" height="58"/>
<text class="label" x="168" y="646">AI の validator が渡された値を書き換えようとしても、記事は変わらない（AI が書けるのは答えだ</text>
<text class="label" x="168" y="663">け）</text>
<rect class="box" x="806" y="621" width="190" height="58"/>
<text class="label" x="816" y="646">J9</text>
</svg>