<text class="title" x="90" y="1112">U21</text>
<rect class="box" x="16" y="32" width="56" height="41"/>
<text class="label" x="26" y="57">TS1</text>
<rect class="box" x="158" y="32" width="640" height="41"/>
<text class="label" x="168" y="57">契約の承認者でない人と、依頼した本人は、契約の新しい版を承認できない</text>
<rect class="box" x="806" y="32" width="190" height="41"/>
<text class="label" x="816" y="57">J28</text>
<rect class="box" x="16" y="79" width="56" height="41"/>
<text class="label" x="26" y="104">TS2</text>
<rect class="box" x="158" y="79" width="640" height="41"/>
<text class="label" x="168" y="104">rule の判断の担当でない人は、その rule を判断できない</text>
<rect class="box" x="806" y="79" width="190" height="41"/>
<text class="label" x="816" y="104">J29</text>
<rect class="box" x="16" y="126" width="56" height="41"/>
<text class="label" x="26" y="151">TS3</text>
<rect class="box" x="158" y="126" width="640" height="41"/>
<text class="label" x="168" y="151">担当の判断が割れる → 判断待ちに戻り、承認者へ届く。承認者の判断で決まる</text>
<rect class="box" x="806" y="126" width="190" height="41"/>
<text class="label" x="816" y="151">J31</text>
<rect class="box" x="16" y="173" width="56" height="41"/>
<text class="label" x="26" y="198">TS4</text>
<rect class="box" x="158" y="173" width="640" height="41"/>
<text class="label" x="168" y="198">2回の CI で AI の答えが割れる → 順番に頼らず unverified。機械の答えが割れたら承認者へ届く</text>
<rect class="box" x="806" y="173" width="190" height="41"/>
<text class="label" x="816" y="198">J32</text>
<rect class="box" x="16" y="220" width="56" height="58"/>
<text class="label" x="26" y="245">TS5</text>
<rect class="box" x="158" y="220" width="640" height="58"/>
<text class="label" x="168" y="245">2つのブランチで別々の v2 が承認される → 先に併合したほうが公開。後の PR は CI が止め、</text>
<text class="label" x="168" y="262">承認し直しが届く</text>
<rect class="box" x="806" y="220" width="190" height="58"/>
<text class="label" x="816" y="245">J30</text>
<rect class="box" x="16" y="284" width="56" height="41"/>
<text class="label" x="26" y="309">TS6</text>
<rect class="box" x="158" y="284" width="640" height="41"/>
<text class="label" x="168" y="309">A のブランチで判断したあと、B のブランチで中身が変わって併合 → 判断は効かず、判断待ちに戻る</text>
<rect class="box" x="806" y="284" width="190" height="41"/>
<text class="label" x="816" y="309">J21</text>
<rect class="box" x="16" y="331" width="56" height="41"/>
<text class="label" x="26" y="356">TS7</text>
<rect class="box" x="158" y="331" width="640" height="41"/>
<text class="label" x="168" y="356">2つのブランチで同じ記事の同じ欄を別々に変える → 併合は断られ、人が中身を選ぶ</text>
<rect class="box" x="806" y="331" width="190" height="41"/>
<text class="label" x="816" y="356">J34</text>
<rect class="box" x="16" y="378" width="56" height="41"/>
<text class="label" x="26" y="403">TS8</text>
<rect class="box" x="158" y="378" width="640" height="41"/>
<text class="label" x="168" y="403">届け先：判断は担当へ、契約の承認は承認者（依頼した本人を除く）へ届き、関係の無い人には届かない</text>
<rect class="box" x="806" y="378" width="190" height="41"/>
<text class="label" x="816" y="403">J33</text>
<rect class="box" x="16" y="425" width="56" height="41"/>
<text class="label" x="26" y="450">TS9</text>
<rect class="box" x="158" y="425" width="640" height="41"/>
<text class="label" x="168" y="450">記録と判断はブランチをまたいで合わせるだけで、どちらも消えない</text>
<rect class="box" x="806" y="425" width="190" height="41"/>
<text class="label" x="816" y="450">J34</text>
<rect class="box" x="16" y="472" width="56" height="58"/>
<text class="label" x="26" y="497">TS10</text>
<rect class="box" x="158" y="472" width="640" height="58"/>
<text class="label" x="168" y="497">A の v2 に従う記事を作ったあと、B の v2 が先に併合される → A の PR は止まり、その記事は</text>
<text class="label" x="168" y="514">main に入らない</text>
<rect class="box" x="806" y="472" width="190" height="58"/>
<text class="label" x="816" y="497">J30</text>
<rect class="box" x="16" y="536" width="56" height="41"/>
<text class="label" x="26" y="561">TS11</text>
<rect class="box" x="158" y="536" width="640" height="41"/>
<text class="label" x="168" y="561">手で verified の記録をファイルとして足す → CI が書いた記録ではないので効かない</text>
<rect class="box" x="806" y="536" width="190" height="41"/>
<text class="label" x="816" y="561">J35</text>
<rect class="box" x="16" y="583" width="56" height="41"/>
<text class="label" x="26" y="608">TS12</text>
<rect class="box" x="158" y="583" width="640" height="41"/>
<text class="label" x="168" y="608">同じ人が2つのブランチで逆の判断をする → どちらの向きで併合しても「割れた」</text>
<rect class="box" x="806" y="583" width="190" height="41"/>
<text class="label" x="816" y="608">J31</text>
<rect class="box" x="16" y="630" width="56" height="41"/>
<text class="label" x="26" y="655">TS13</text>
<rect class="box" x="158" y="630" width="640" height="41"/>
<text class="label" x="168" y="655">チームでは、依頼者の無い依頼、名前の無い取り消し、PR のレビューを通らない承認 ・ 判断は断られる</text>
<rect class="box" x="806" y="630" width="190" height="41"/>
<text class="label" x="816" y="655">J28 ・ J35</text>
<rect class="box" x="16" y="677" width="56" height="41"/>
<text class="label" x="26" y="702">TS14</text>
<rect class="box" x="158" y="677" width="640" height="41"/>
<text class="label" x="168" y="702">担当の決まっていない rule は承認者だけが判断できる。担当から外した人の判断は効かなくなる</text>
<rect class="box" x="806" y="677" width="190" height="41"/>
<text class="label" x="816" y="702">J29</text>
<rect class="box" x="16" y="724" width="56" height="41"/>
<text class="label" x="26" y="749">TS15</text>
<rect class="box" x="158" y="724" width="640" height="41"/>
<text class="label" x="168" y="749">承認者を変えた最新の版を引退しても、承認者は前の版の名簿に戻らない</text>
<rect class="box" x="806" y="724" width="190" height="41"/>
<text class="label" x="816" y="749">J28</text>
<rect class="box" x="16" y="771" width="56" height="41"/>
<text class="label" x="26" y="796">TS16</text>
<rect class="box" x="158" y="771" width="640" height="41"/>
<text class="label" x="168" y="796">A で記事 p1 を消し、B で p1 を指す記事を作る → 併合の前の検査が止める</text>
<rect class="box" x="806" y="771" width="190" height="41"/>
<text class="label" x="816" y="796">J12</text>
<rect class="box" x="16" y="818" width="56" height="41"/>
<text class="label" x="26" y="843">TS17</text>
<rect class="box" x="158" y="818" width="640" height="41"/>
<text class="label" x="168" y="843">手元の検証は状態に効かず、CI の検証だけが効く。手元の error も数えない</text>
<rect class="box" x="806" y="818" width="190" height="41"/>
<text class="label" x="816" y="843">J35</text>
<rect class="box" x="16" y="865" width="56" height="41"/>
<text class="label" x="26" y="890">TS18</text>
<rect class="box" x="158" y="865" width="640" height="41"/>
<text class="label" x="168" y="890">担当が3日取らない → 代わりの担当と承認者にも届き、代わりの担当が判断できる</text>
<rect class="box" x="806" y="865" width="190" height="41"/>
<text class="label" x="816" y="890">J36</text>
<rect class="box" x="16" y="912" width="56" height="41"/>
<text class="label" x="26" y="937">TS19</text>
<rect class="box" x="158" y="912" width="640" height="41"/>
<text class="label" x="168" y="937">1人の担当が取ったら、ほかの担当には出さない</text>
<rect class="box" x="806" y="912" width="190" height="41"/>
<text class="label" x="816" y="937">J33</text>
<rect class="box" x="16" y="959" width="56" height="58"/>
<text class="label" x="26" y="984">TS20</text>
<rect class="box" x="158" y="959" width="640" height="58"/>
<text class="label" x="168" y="984">検証済み以外の状態は、必ず誰かの受信箱に出る（下書き ・ 判断待ち ・ 割れた ・ 割り当て無し ・</text>
<text class="label" x="168" y="1001">承認し直し）</text>
<rect class="box" x="806" y="959" width="190" height="58"/>
<text class="label" x="816" y="984">J33</text>
<rect class="box" x="16" y="1023" width="56" height="58"/>
<text class="label" x="26" y="1048">TS21</text>
<rect class="box" x="158" y="1023" width="640" height="58"/>
<text class="label" x="168" y="1048">AI の validator が渡された値を書き換えようとしても、記事は変わらない（AI が書けるのは答えだ</text>
<text class="label" x="168" y="1065">け）</text>
<rect class="box" x="806" y="1023" width="190" height="58"/>
<text class="label" x="816" y="1048">J9</text>
<rect class="box" x="16" y="1087" width="56" height="41"/>
<text class="label" x="26" y="1112">TS22</text>
<rect class="box" x="158" y="1087" width="640" height="41"/>
<text class="label" x="168" y="1112">チームでは、PR のレビューを通らない契約の承認は断られる</text>
<rect class="box" x="806" y="1087" width="190" height="41"/>
<text class="label" x="816" y="1112">J35</text>
</svg>