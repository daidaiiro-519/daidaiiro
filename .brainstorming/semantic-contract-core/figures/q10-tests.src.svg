<rect class="box focus" x="80" y="570" width="70" height="58"/>
<text class="title" x="90" y="595">U5</text>
<rect class="box" x="16" y="32" width="56" height="41"/>
<text class="label" x="26" y="57">TS1</text>
<rect class="box" x="158" y="32" width="640" height="41"/>
<text class="label" x="168" y="57">feature ブランチで AI が記事を書く → ブランチの CI が検証し、人が見るものが PR に出る</text>
<rect class="box" x="806" y="32" width="190" height="41"/>
<text class="label" x="816" y="57">J35</text>
<rect class="box" x="16" y="79" width="56" height="41"/>
<text class="label" x="26" y="104">TS2</text>
<rect class="box" x="158" y="79" width="640" height="41"/>
<text class="label" x="168" y="104">PR で人が確かめる → 検証済み。そのあと PR に push して中身が変わる → 確かめたことは効かない</text>
<rect class="box" x="806" y="79" width="190" height="41"/>
<text class="label" x="816" y="104">J21 ・ J35</text>
<rect class="box" x="16" y="126" width="56" height="41"/>
<text class="label" x="26" y="151">TS3</text>
<rect class="box" x="158" y="126" width="640" height="41"/>
<text class="label" x="168" y="151">main に別の人の変更が入る → 自分のブランチに取り込むと、変わった中身だけが検証し直される</text>
<rect class="box" x="806" y="126" width="190" height="41"/>
<text class="label" x="816" y="151">J34 ・ J21</text>
<rect class="box" x="16" y="173" width="56" height="58"/>
<text class="label" x="26" y="198">TS4</text>
<rect class="box" x="158" y="173" width="640" height="58"/>
<text class="label" x="168" y="198">自分が PR で確かめた記事を、main で別の人が変えていた → 取り込むと、確かめたことは効かず PR</text>
<text class="label" x="168" y="215">に出る</text>
<rect class="box" x="806" y="173" width="190" height="58"/>
<text class="label" x="816" y="198">J21</text>
<rect class="box" x="16" y="237" width="56" height="58"/>
<text class="label" x="26" y="262">TS5</text>
<rect class="box" x="158" y="237" width="640" height="58"/>
<text class="label" x="168" y="262">main で記事 p1 が消された → 自分のブランチで p1 を指していた記事は、</text>
<text class="label" x="168" y="279">取り込み時の検証で違反になる</text>
<rect class="box" x="806" y="237" width="190" height="58"/>
<text class="label" x="816" y="262">J12</text>
<rect class="box" x="16" y="301" width="56" height="41"/>
<text class="label" x="26" y="326">TS6</text>
<rect class="box" x="158" y="301" width="640" height="41"/>
<text class="label" x="168" y="326">main に別の契約 v2 が先に入った → 自分の v2 は取り込み時に「試し直して PR で確かめる」になる</text>
<rect class="box" x="806" y="301" width="190" height="41"/>
<text class="label" x="816" y="326">J30</text>
<rect class="box" x="16" y="348" width="56" height="41"/>
<text class="label" x="26" y="373">TS7</text>
<rect class="box" x="158" y="348" width="640" height="41"/>
<text class="label" x="168" y="373">同じ記事の同じ欄を、main と自分のブランチで別々に変えた → Git の衝突として人が中身を選ぶ</text>
<rect class="box" x="806" y="348" width="190" height="41"/>
<text class="label" x="816" y="373">J34</text>
<rect class="box" x="16" y="395" width="56" height="58"/>
<text class="label" x="26" y="420">TS8</text>
<rect class="box" x="158" y="395" width="640" height="58"/>
<text class="label" x="168" y="420">手で verified の記録をファイルとして足す ・ 手元で検証する → どちらも効かない。CI</text>
<text class="label" x="168" y="437">の検証だけが効く</text>
<rect class="box" x="806" y="395" width="190" height="58"/>
<text class="label" x="816" y="420">J35</text>
<rect class="box" x="16" y="459" width="56" height="58"/>
<text class="label" x="26" y="484">TS9</text>
<rect class="box" x="158" y="459" width="640" height="58"/>
<text class="label" x="168" y="484">2回の CI で AI の答えが割れた → 取り込みの順番によらず unverified になり、PR</text>
<text class="label" x="168" y="501">に人が見るものとして出る</text>
<rect class="box" x="806" y="459" width="190" height="58"/>
<text class="label" x="816" y="484">J32</text>
<rect class="box" x="16" y="523" width="56" height="41"/>
<text class="label" x="26" y="548">TS10</text>
<rect class="box" x="158" y="523" width="640" height="41"/>
<text class="label" x="168" y="548">PR で確かめていない判断は、チームでは効かない</text>
<rect class="box" x="806" y="523" width="190" height="41"/>
<text class="label" x="816" y="548">J35</text>
<rect class="box" x="16" y="570" width="56" height="58"/>
<text class="label" x="26" y="595">TS11</text>
<rect class="box" x="158" y="570" width="640" height="58"/>
<text class="label" x="168" y="595">AI の validator が渡された値を書き換えようとしても、記事は変わらない（AI が書けるのは答えだ</text>
<text class="label" x="168" y="612">け）</text>
<rect class="box" x="806" y="570" width="190" height="58"/>
<text class="label" x="816" y="595">J9</text>
</svg>