<rect class="box focus" x="80" y="630" width="70" height="88"/>
<text class="title" x="90" y="655">U21</text>
<rect class="box focus" x="80" y="724" width="70" height="41"/>
<text class="title" x="90" y="749">U2</text>
<rect class="box focus" x="80" y="771" width="70" height="41"/>
<text class="title" x="90" y="796">U11</text>
<rect class="box focus" x="80" y="818" width="70" height="41"/>
<text class="title" x="90" y="843">U20</text>
