<svg viewBox="0 0 1104 1598" style="min-width:900px" role="img" aria-label="使う場面：主体 ・ 目的 ・ 成功したときの保証 ・ 最低限の保証">
<text class="note" x="20" y="22">#</text>
<text class="note" x="88" y="22">主体</text>
<text class="note" x="236" y="22">目的</text>
<text class="note" x="484" y="22">成功したとき</text>
<text class="note" x="792" y="22">最低限</text>
<rect class="box focus" x="16" y="32" width="60" height="92"/>
<text class="title" x="26" y="57">U0</text>
<rect class="box focus" x="16" y="130" width="60" height="75"/>
<text class="title" x="26" y="155">U1</text>
<rect class="box focus" x="16" y="211" width="60" height="75"/>
<text class="title" x="26" y="236">U2</text>
<rect class="box focus" x="16" y="292" width="60" height="58"/>
<text class="title" x="26" y="317">U3</text>
<rect class="box focus" x="16" y="356" width="60" height="75"/>
<text class="title" x="26" y="381">U4</text>
<rect class="box focus" x="16" y="437" width="60" height="92"/>
<text class="title" x="26" y="462">U5</text>
<rect class="box focus" x="16" y="535" width="60" height="75"/>
<text class="title" x="26" y="560">U6</text>
<rect class="box focus" x="16" y="616" width="60" height="58"/>
<text class="title" x="26" y="641">U7</text>
<rect class="box focus" x="16" y="680" width="60" height="75"/>
<text class="title" x="26" y="705">U8</text>
<rect class="box focus" x="16" y="761" width="60" height="75"/>
<text class="title" x="26" y="786">U10</text>
<rect class="box focus" x="16" y="842" width="60" height="75"/>
<text class="title" x="26" y="867">U11</text>
<rect class="box focus" x="16" y="923" width="60" height="75"/>
<text class="title" x="26" y="948">U12</text>
<rect class="box focus" x="16" y="1004" width="60" height="75"/>
<text class="title" x="26" y="1029">U13</text>
<rect class="box focus" x="16" y="1085" width="60" height="75"/>
<text class="title" x="26" y="1110">U14</text>
<rect class="box focus" x="16" y="1166" width="60" height="75"/>
<text class="title" x="26" y="1191">U16</text>
<rect class="box focus" x="16" y="1247" width="60" height="75"/>
<text class="title" x="26" y="1272">U17</text>
<rect class="box focus" x="16" y="1328" width="60" height="92"/>
<text class="title" x="26" y="1353">U18</text>
<rect class="box focus" x="16" y="1426" width="60" height="75"/>
<text class="title" x="26" y="1451">U23</text>
<rect class="box focus" x="16" y="1507" width="60" height="75"/>
<text class="title" x="26" y="1532">U24</text>
<rect class="box" x="84" y="32" width="140" height="92"/>
<text class="label" x="94" y="57">利用者</text>
<rect class="box" x="232" y="32" width="240" height="92"/>
<text class="label" x="242" y="57">AI に書かせた成果物を、</text>
<text class="label" x="242" y="74">正しいと確かめた状態で使い続ける</text>
<rect class="box" x="480" y="32" width="300" height="92"/>
<text class="label" x="490" y="57">使っている instance が、</text>
<text class="label" x="490" y="74">いまの契約のすべての rule で verified</text>
<text class="label" x="490" y="91">（機械の検証と、変更に入れた AI ・</text>
<text class="label" x="490" y="108">人の判定の記録）である</text>
<rect class="box" x="788" y="32" width="300" height="92"/>
<text class="label" x="798" y="57">入力が変わった判定と、検証できなかった</text>
<text class="label" x="798" y="74">rule は、verified として見えない</text>
<rect class="box" x="84" y="130" width="140" height="75"/>
<text class="label" x="94" y="155">作者（人か AI）</text>
<rect class="box" x="232" y="130" width="240" height="75"/>
<text class="label" x="242" y="155">Concrete スキーマを作る</text>
<rect class="box" x="480" y="130" width="300" height="75"/>
<text class="label" x="490" y="155">Concrete が Abstract</text>
<text class="label" x="490" y="172">の版と拡張の契約に従い、Agent</text>
<text class="label" x="490" y="189">が案内に従って instance を書ける</text>
<rect class="box" x="788" y="130" width="300" height="75"/>
<text class="label" x="798" y="155">契約に従わない Concrete は、違反した</text>
<text class="label" x="798" y="172">rule と一緒に取り込めない理由として出る</text>
<rect class="box" x="84" y="211" width="140" height="75"/>
<text class="label" x="94" y="236">作者</text>
<rect class="box" x="232" y="211" width="240" height="75"/>
<text class="label" x="242" y="236">Concrete スキーマを変える</text>
<rect class="box" x="480" y="211" width="300" height="75"/>
<text class="label" x="490" y="236">変更に、変更後の姿での全 instance の状態</text>
<text class="label" x="490" y="253"> ・ 状態が変わった instance ・</text>
<text class="label" x="490" y="270">人が見るものが出る</text>
<rect class="box" x="788" y="211" width="300" height="75"/>
<text class="label" x="798" y="236">取り込むまで、いまの契約と instance</text>
<text class="label" x="798" y="253">の状態は変わらない</text>
<rect class="box" x="84" y="292" width="140" height="58"/>
<text class="label" x="94" y="317">作者</text>
<rect class="box" x="232" y="292" width="240" height="58"/>
<text class="label" x="242" y="317">Abstract の新しい版に</text>
<text class="label" x="242" y="334">Concrete を合わせる</text>
<rect class="box" x="480" y="292" width="300" height="58"/>
<text class="label" x="490" y="317">機械で直せる箇所は直り、</text>
<text class="label" x="490" y="334">残りは案内に従って直る</text>
<rect class="box" x="788" y="292" width="300" height="58"/>
<text class="label" x="798" y="317">移せなかった箇所は一覧で返り、いまの</text>
<text class="label" x="798" y="334">Concrete は壊れない</text>
<rect class="box" x="84" y="356" width="140" height="75"/>
<text class="label" x="94" y="381">提供側（Core</text>
<text class="label" x="94" y="398">を作る側）</text>
<rect class="box" x="232" y="356" width="240" height="75"/>
<text class="label" x="242" y="381">Abstract の新しい版を、</text>
<text class="label" x="242" y="398">移し方と一緒に出す</text>
<rect class="box" x="480" y="356" width="300" height="75"/>
<text class="label" x="490" y="381">作者が U3 を案内どおりに終えられる</text>
<rect class="box" x="788" y="356" width="300" height="75"/>
<text class="label" x="798" y="381">前の Abstract の版は中身が変わらず、</text>
<text class="label" x="798" y="398">それを申告する Concrete</text>
<text class="label" x="798" y="415">は検証を通り続ける</text>
<rect class="box" x="84" y="437" width="140" height="92"/>
<text class="label" x="94" y="462">AI の Agent</text>
<rect class="box" x="232" y="437" width="240" height="92"/>
<text class="label" x="242" y="462">instance を作る</text>
<rect class="box" x="480" y="437" width="300" height="92"/>
<text class="label" x="490" y="462">変えてよい範囲の中で書かれ、rule</text>
<text class="label" x="490" y="479">ごとの結果がそろい、violated が無い</text>
<rect class="box" x="788" y="437" width="300" height="92"/>
<text class="label" x="798" y="462">violated ・ error の rule</text>
<text class="label" x="798" y="479">が根拠付きで返る。必須の欄が空なら、</text>
<text class="label" x="798" y="496">根拠「必須の欄が空」の機械の violated</text>
<text class="label" x="798" y="513">として返る</text>
<rect class="box" x="84" y="535" width="140" height="75"/>
<text class="label" x="94" y="560">AI の Agent</text>
<rect class="box" x="232" y="535" width="240" height="75"/>
<text class="label" x="242" y="560">既存の instance を変える</text>
<rect class="box" x="480" y="535" width="300" height="75"/>
<text class="label" x="490" y="560">参照と導出値が整合したまま変わる</text>
<rect class="box" x="788" y="535" width="300" height="75"/>
<text class="label" x="798" y="560">参照が壊れる ・ 導出値が合わない変更は</text>
<text class="label" x="798" y="577">violated として返り、</text>
<text class="label" x="798" y="594">取り込めない理由に出る</text>
<rect class="box" x="84" y="616" width="140" height="58"/>
<text class="label" x="94" y="641">AI の Agent</text>
<rect class="box" x="232" y="616" width="240" height="58"/>
<text class="label" x="242" y="641">契約の変更で violated になった</text>
<text class="label" x="242" y="658">instance を、同じ変更の中で直す</text>
<rect class="box" x="480" y="616" width="300" height="58"/>
<text class="label" x="490" y="641">直した instance が変更後の契約で</text>
<text class="label" x="490" y="658">violated を持たず、元の意味が保たれている</text>
<rect class="box" x="788" y="616" width="300" height="58"/>
<text class="label" x="798" y="641">直せなかった instance は violated</text>
<text class="label" x="798" y="658">のまま変更後の検証に出て、理由が返る</text>
<rect class="box" x="84" y="680" width="140" height="75"/>
<text class="label" x="94" y="705">CI（変更の仕組み）</text>
<rect class="box" x="232" y="680" width="240" height="75"/>
<text class="label" x="242" y="705">変更のたびに、すべての instance</text>
<text class="label" x="242" y="722">を検証する</text>
<rect class="box" x="480" y="680" width="300" height="75"/>
<text class="label" x="490" y="705">violated と unverified の一覧が返り、</text>
<text class="label" x="490" y="722">手元と同じ結果になる</text>
<rect class="box" x="788" y="680" width="300" height="75"/>
<text class="label" x="798" y="705">validator が答えない ・ 誤った形で答えた</text>
<text class="label" x="798" y="722">rule は error として返り、verified</text>
<text class="label" x="798" y="739">に数えない</text>
<rect class="box" x="84" y="761" width="140" height="75"/>
<text class="label" x="94" y="786">利用者</text>
<rect class="box" x="232" y="761" width="240" height="75"/>
<text class="label" x="242" y="786">入力が変わった instance</text>
<text class="label" x="242" y="803">を確かめ直す</text>
<rect class="box" x="480" y="761" width="300" height="75"/>
<text class="label" x="490" y="786">入力が変わった rule だけが検証し直され、</text>
<text class="label" x="490" y="803">状態が変わった instance</text>
<text class="label" x="490" y="820">が変更の出力に出る</text>
<rect class="box" x="788" y="761" width="300" height="75"/>
<text class="label" x="798" y="786">基盤を通らずに書き換えられた instance </text>
<text class="label" x="798" y="803">も、次の検証で入力が変わったと分かり、</text>
<text class="label" x="798" y="820">前の判定は効かない</text>
<rect class="box" x="84" y="842" width="140" height="75"/>
<text class="label" x="94" y="867">利用者</text>
<rect class="box" x="232" y="842" width="240" height="75"/>
<text class="label" x="242" y="867">要らない instance ・</text>
<text class="label" x="242" y="884">判定の記録を消す</text>
<rect class="box" x="480" y="842" width="300" height="75"/>
<text class="label" x="490" y="867">消したものを指す参照と、</text>
<text class="label" x="490" y="884">消したものに結び付いた記録が残っていない</text>
<rect class="box" x="788" y="842" width="300" height="75"/>
<text class="label" x="798" y="867">消したものを指す instance</text>
<text class="label" x="798" y="884">は変更後の検証で violated になり、</text>
<text class="label" x="798" y="901">取り込めない理由に出る</text>
<rect class="box" x="84" y="923" width="140" height="75"/>
<text class="label" x="94" y="948">読み手（人）</text>
<rect class="box" x="232" y="923" width="240" height="75"/>
<text class="label" x="242" y="948">人が読む形で読んで判断する</text>
<rect class="box" x="480" y="923" width="300" height="75"/>
<text class="label" x="490" y="948">rule ごとの結果と instance の状態が、</text>
<text class="label" x="490" y="965">内容と一緒に見える</text>
<rect class="box" x="788" y="923" width="300" height="75"/>
<text class="label" x="798" y="948">描画に失敗したら1ページも書かず、</text>
<text class="label" x="798" y="965">効かなくなった判定を verified</text>
<text class="label" x="798" y="982">として見せない</text>
<rect class="box" x="84" y="1004" width="140" height="75"/>
<text class="label" x="94" y="1029">利用者 ・</text>
<text class="label" x="94" y="1046">監査する人</text>
<rect class="box" x="232" y="1004" width="240" height="75"/>
<text class="label" x="242" y="1029">検証と判定の経緯を、</text>
<text class="label" x="242" y="1046">あとから確かめる</text>
<rect class="box" x="480" y="1004" width="300" height="75"/>
<text class="label" x="490" y="1029">誰が ・ どの変更の姿で ・ どの instance</text>
<text class="label" x="490" y="1046">× rule を ・ いつ判定したかが分かる</text>
<rect class="box" x="788" y="1004" width="300" height="75"/>
<text class="label" x="798" y="1029">記録の書き換えは変更の差分に出て、AI ・</text>
<text class="label" x="798" y="1046">人の rule で記録が無いものは記録が無いと分</text>
<text class="label" x="798" y="1063">かる</text>
<rect class="box" x="84" y="1085" width="140" height="75"/>
<text class="label" x="94" y="1110">harness の作者</text>
<rect class="box" x="232" y="1085" width="240" height="75"/>
<text class="label" x="242" y="1110">validator（AI ・</text>
<text class="label" x="242" y="1127">外のツール）をつなぐ</text>
<rect class="box" x="480" y="1085" width="300" height="75"/>
<text class="label" x="490" y="1110">判定できる rule が宣言され、宣言の外の</text>
<text class="label" x="490" y="1127">rule は unsupported と返る</text>
<rect class="box" x="788" y="1085" width="300" height="75"/>
<text class="label" x="798" y="1110">validator を1つもつながなくても、</text>
<text class="label" x="798" y="1127">機械で決まる rule は検証され、残りは</text>
<text class="label" x="798" y="1144">unsupported として返る</text>
<rect class="box" x="84" y="1166" width="140" height="75"/>
<text class="label" x="94" y="1191">判断する人</text>
<rect class="box" x="232" y="1166" width="240" height="75"/>
<text class="label" x="242" y="1191">機械と AI が判定できなかった</text>
<text class="label" x="242" y="1208">rule を判断する（AI の判定を覆</text>
<text class="label" x="242" y="1225">す）</text>
<rect class="box" x="480" y="1166" width="300" height="75"/>
<text class="label" x="490" y="1191">原因ごとにまとめて判断し、</text>
<text class="label" x="490" y="1208">示した入力に結び付いた記録が変更に入る</text>
<rect class="box" x="788" y="1166" width="300" height="75"/>
<text class="label" x="798" y="1191">判断されなかった rule は unverified</text>
<text class="label" x="798" y="1208">のまま残り、verified として見えない</text>
<rect class="box" x="84" y="1247" width="140" height="75"/>
<text class="label" x="94" y="1272">利用者</text>
<rect class="box" x="232" y="1247" width="240" height="75"/>
<text class="label" x="242" y="1272">既存のファイルを取り込む（導入）</text>
<rect class="box" x="480" y="1247" width="300" height="75"/>
<text class="label" x="490" y="1272">$schema が1つに決まるファイルはそのまま</text>
<text class="label" x="490" y="1289">instance になり、決まらないファイルは下書</text>
<text class="label" x="490" y="1306">きとして一覧に出る</text>
<rect class="box" x="788" y="1247" width="300" height="75"/>
<text class="label" x="798" y="1272">取り込めなかったファイルは中身が変わらず、</text>
<text class="label" x="798" y="1289">理由が返る</text>
<rect class="box" x="84" y="1328" width="140" height="92"/>
<text class="label" x="94" y="1353">利用者（チーム）</text>
<rect class="box" x="232" y="1328" width="240" height="92"/>
<text class="label" x="242" y="1353">ほかの変更を取り込む</text>
<rect class="box" x="480" y="1328" width="300" height="92"/>
<text class="label" x="490" y="1353">取り込んだあとの姿で全 instance</text>
<text class="label" x="490" y="1370">が検証され、状態が変わったものが出る</text>
<rect class="box" x="788" y="1328" width="300" height="92"/>
<text class="label" x="798" y="1353">同じ instance × rule</text>
<text class="label" x="798" y="1370">の判定を両方で変えたときは、</text>
<text class="label" x="798" y="1387">基盤が片方を選ばず、変更の仕組みの衝突とし</text>
<text class="label" x="798" y="1404">て人に出る</text>
<rect class="box" x="84" y="1426" width="140" height="75"/>
<text class="label" x="94" y="1451">作者</text>
<rect class="box" x="232" y="1426" width="240" height="75"/>
<text class="label" x="242" y="1451">文脈の語彙（x-）を定義する ・</text>
<text class="label" x="242" y="1468">変える</text>
<rect class="box" x="480" y="1426" width="300" height="75"/>
<text class="label" x="490" y="1451">定義した x- が形 ・ 意味 ・ 検証の仕方 ・</text>
<text class="label" x="490" y="1468"> 名前の範囲を持ち、その x- を使う全</text>
<text class="label" x="490" y="1485">instance が宣言した検証の仕方で検証される</text>
<rect class="box" x="788" y="1426" width="300" height="75"/>
<text class="label" x="798" y="1451">検証の仕方が書けない x- は unsupported</text>
<text class="label" x="798" y="1468">として返り、Core の語彙とぶつかる定義は違</text>
<text class="label" x="798" y="1485">反として返る</text>
<rect class="box" x="84" y="1507" width="140" height="75"/>
<text class="label" x="94" y="1532">作者</text>
<rect class="box" x="232" y="1507" width="240" height="75"/>
<text class="label" x="242" y="1532">ほかの文脈の公開された言葉（</text>
<text class="label" x="242" y="1549">Concrete の公開する部分）を</text>
<text class="label" x="242" y="1566">x-ref で読む</text>
<rect class="box" x="480" y="1507" width="300" height="75"/>
<text class="label" x="490" y="1532">読む側は、指した公開された言葉の版で検証さ</text>
<text class="label" x="490" y="1549">れ続ける</text>
<rect class="box" x="788" y="1507" width="300" height="75"/>
<text class="label" x="798" y="1532">読む先の版が無い ・ 読む先が新しい版だけを</text>
<text class="label" x="798" y="1549">出したときは、読む側の検証にそう出て、</text>
<text class="label" x="798" y="1566">黙って壊れない</text>
</svg>