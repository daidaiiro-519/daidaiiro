<text class="title" x="26" y="334">U3</text>
<rect class="box focus" x="16" y="373" width="60" height="75"/>
<text class="title" x="26" y="398">U4</text>
<rect class="box focus" x="16" y="454" width="60" height="92"/>
<text class="title" x="26" y="479">U5</text>
<rect class="box focus" x="16" y="552" width="60" height="75"/>
<text class="title" x="26" y="577">U6</text>
<rect class="box focus" x="16" y="633" width="60" height="92"/>
<text class="title" x="26" y="658">U7</text>
<rect class="box focus" x="16" y="731" width="60" height="75"/>
<text class="title" x="26" y="756">U8</text>
<rect class="box focus" x="16" y="812" width="60" height="75"/>
<text class="title" x="26" y="837">U10</text>
<rect class="box focus" x="16" y="893" width="60" height="75"/>
<text class="title" x="26" y="918">U11</text>
<rect class="box focus" x="16" y="974" width="60" height="75"/>
<text class="title" x="26" y="999">U12</text>
<rect class="box focus" x="16" y="1055" width="60" height="109"/>
<text class="title" x="26" y="1080">U13</text>
<rect class="box focus" x="16" y="1170" width="60" height="75"/>
<text class="title" x="26" y="1195">U14</text>
<rect class="box focus" x="16" y="1251" width="60" height="75"/>
<text class="title" x="26" y="1276">U16</text>
<rect class="box focus" x="16" y="1332" width="60" height="75"/>
<text class="title" x="26" y="1357">U17</text>
<rect class="box focus" x="16" y="1413" width="60" height="92"/>
<text class="title" x="26" y="1438">U18</text>
<rect class="box focus" x="16" y="1511" width="60" height="75"/>
<text class="title" x="26" y="1536">U23</text>
<rect class="box focus" x="16" y="1592" width="60" height="75"/>
<text class="title" x="26" y="1617">U24</text>
<rect class="box focus" x="16" y="1673" width="60" height="126"/>
<text class="title" x="26" y="1698">U25</text>
<rect class="box" x="84" y="32" width="140" height="92"/>
<text class="label" x="94" y="57">利用者</text>
<rect class="box" x="232" y="32" width="240" height="92"/>
<text class="label" x="242" y="57">AI に書かせた成果物を、</text>
<text class="label" x="242" y="74">正しいと確かめた状態で使い続ける</text>
<rect class="box" x="480" y="32" width="300" height="92"/>
<text class="label" x="490" y="57">使っている instance が、</text>
<text class="label" x="490" y="74">いまの契約のすべての rule で verified</text>
<text class="label" x="490" y="91">（機械の検証と、変更に入れた AI ・</text>
<text class="label" x="490" y="108">人の判定の記録）である</text>
<rect class="box" x="788" y="32" width="300" height="92"/>
<text class="label" x="798" y="57">入力が変わった判定と、検証できなかった</text>
<text class="label" x="798" y="74">rule は、verified として見えない</text>
<rect class="box" x="84" y="130" width="140" height="75"/>
<text class="label" x="94" y="155">作者（人か AI）</text>
<rect class="box" x="232" y="130" width="240" height="75"/>
<text class="label" x="242" y="155">Concrete スキーマを作る</text>
<rect class="box" x="480" y="130" width="300" height="75"/>
<text class="label" x="490" y="155">Concrete が Abstract</text>
<text class="label" x="490" y="172">の版と拡張の契約に従い、Agent</text>
<text class="label" x="490" y="189">が案内に従って instance を書ける</text>
<rect class="box" x="788" y="130" width="300" height="75"/>
<text class="label" x="798" y="155">契約に従わない Concrete は、違反した</text>
<text class="label" x="798" y="172">rule と一緒に取り込めない理由として出る</text>
<rect class="box" x="84" y="211" width="140" height="92"/>
<text class="label" x="94" y="236">作者</text>
<rect class="box" x="232" y="211" width="240" height="92"/>
<text class="label" x="242" y="236">Concrete スキーマを変える</text>
<rect class="box" x="480" y="211" width="300" height="92"/>
<text class="label" x="490" y="236">変更に、変更後の姿での全 instance の状態</text>
<text class="label" x="490" y="253"> ・ 状態が変わった instance ・</text>
<text class="label" x="490" y="270">人が見るものが出る。変更の記録（セッション</text>
<text class="label" x="490" y="287">の参照 ・ 理由）が一緒に残る</text>
<rect class="box" x="788" y="211" width="300" height="92"/>
<text class="label" x="798" y="236">取り込むまで、いまの契約と instance</text>
<text class="label" x="798" y="253">の状態は変わらない</text>
<rect class="box" x="84" y="309" width="140" height="58"/>
<text class="label" x="94" y="334">作者</text>
<rect class="box" x="232" y="309" width="240" height="58"/>
<text class="label" x="242" y="334">Abstract の新しい版に</text>
<text class="label" x="242" y="351">Concrete を合わせる</text>
<rect class="box" x="480" y="309" width="300" height="58"/>
<text class="label" x="490" y="334">機械で直せる箇所は直り、</text>
<text class="label" x="490" y="351">残りは案内に従って直る</text>
<rect class="box" x="788" y="309" width="300" height="58"/>
<text class="label" x="798" y="334">移せなかった箇所は一覧で返り、いまの</text>
<text class="label" x="798" y="351">Concrete は壊れない</text>
<rect class="box" x="84" y="373" width="140" height="75"/>
<text class="label" x="94" y="398">提供側（Core</text>
<text class="label" x="94" y="415">を作る側）</text>
<rect class="box" x="232" y="373" width="240" height="75"/>
<text class="label" x="242" y="398">Abstract の新しい版を、</text>
<text class="label" x="242" y="415">移し方と一緒に出す</text>
<rect class="box" x="480" y="373" width="300" height="75"/>
<text class="label" x="490" y="398">作者が U3 を案内どおりに終えられる</text>
<rect class="box" x="788" y="373" width="300" height="75"/>
<text class="label" x="798" y="398">前の Abstract の版は中身が変わらず、</text>
<text class="label" x="798" y="415">それを申告する Concrete</text>
<text class="label" x="798" y="432">は検証を通り続ける</text>
<rect class="box" x="84" y="454" width="140" height="92"/>
<text class="label" x="94" y="479">AI の Agent</text>
<rect class="box" x="232" y="454" width="240" height="92"/>
<text class="label" x="242" y="479">instance を作る</text>
<rect class="box" x="480" y="454" width="300" height="92"/>
<text class="label" x="490" y="479">変えてよい範囲の中で書かれ、rule</text>
<text class="label" x="490" y="496">ごとの結果がそろい、violated が無い。</text>
<text class="label" x="490" y="513">変更の記録（セッションの参照 ・</text>
<text class="label" x="490" y="530">理由）が一緒に残る</text>
<rect class="box" x="788" y="454" width="300" height="92"/>
<text class="label" x="798" y="479">violated ・ error の rule</text>
<text class="label" x="798" y="496">が根拠付きで返る。必須の欄が空なら、</text>
<text class="label" x="798" y="513">根拠「必須の欄が空」の機械の violated</text>
<text class="label" x="798" y="530">として返る</text>
<rect class="box" x="84" y="552" width="140" height="75"/>
<text class="label" x="94" y="577">AI の Agent</text>
<rect class="box" x="232" y="552" width="240" height="75"/>
<text class="label" x="242" y="577">既存の instance を変える</text>
<rect class="box" x="480" y="552" width="300" height="75"/>
<text class="label" x="490" y="577">参照と導出値が整合したまま変わる。</text>
<text class="label" x="490" y="594">変更の記録（セッションの参照 ・</text>
<text class="label" x="490" y="611">理由）が一緒に残る</text>
<rect class="box" x="788" y="552" width="300" height="75"/>
<text class="label" x="798" y="577">参照が壊れる ・ 導出値が合わない変更は</text>
<text class="label" x="798" y="594">violated として返り、</text>
<text class="label" x="798" y="611">取り込めない理由に出る</text>
<rect class="box" x="84" y="633" width="140" height="92"/>
<text class="label" x="94" y="658">AI の Agent</text>
<rect class="box" x="232" y="633" width="240" height="92"/>
<text class="label" x="242" y="658">契約の変更で violated になった</text>
<text class="label" x="242" y="675">instance を、同じ変更の中で直す</text>
<rect class="box" x="480" y="633" width="300" height="92"/>
<text class="label" x="490" y="658">直した instance が変更後の契約で</text>
<text class="label" x="490" y="675">violated を持たず、元の意味が保たれてい</text>
<text class="label" x="490" y="692">る。変更の記録（セッションの参照 ・</text>
<text class="label" x="490" y="709">理由）が一緒に残る</text>
<rect class="box" x="788" y="633" width="300" height="92"/>
<text class="label" x="798" y="658">直せなかった instance は violated</text>
<text class="label" x="798" y="675">のまま変更後の検証に出て、理由が返る</text>
<rect class="box" x="84" y="731" width="140" height="75"/>
<text class="label" x="94" y="756">CI（変更の仕組み）</text>
<rect class="box" x="232" y="731" width="240" height="75"/>
<text class="label" x="242" y="756">変更のたびに、すべての instance</text>
<text class="label" x="242" y="773">を検証する</text>
<rect class="box" x="480" y="731" width="300" height="75"/>
<text class="label" x="490" y="756">violated と unverified の一覧が返り、</text>
<text class="label" x="490" y="773">手元と同じ結果になる</text>
<rect class="box" x="788" y="731" width="300" height="75"/>
<text class="label" x="798" y="756">validator が答えない ・ 誤った形で答えた</text>
<text class="label" x="798" y="773">rule は error として返り、verified</text>
<text class="label" x="798" y="790">に数えない</text>
<rect class="box" x="84" y="812" width="140" height="75"/>
<text class="label" x="94" y="837">利用者</text>
<rect class="box" x="232" y="812" width="240" height="75"/>
<text class="label" x="242" y="837">入力が変わった instance</text>
<text class="label" x="242" y="854">を確かめ直す</text>
<rect class="box" x="480" y="812" width="300" height="75"/>
<text class="label" x="490" y="837">入力が変わった rule だけが検証し直され、</text>
<text class="label" x="490" y="854">状態が変わった instance</text>
<text class="label" x="490" y="871">が変更の出力に出る</text>
<rect class="box" x="788" y="812" width="300" height="75"/>
<text class="label" x="798" y="837">基盤を通らずに書き換えられた instance </text>
<text class="label" x="798" y="854">も、次の検証で入力が変わったと分かり、</text>
<text class="label" x="798" y="871">前の判定は効かない</text>
<rect class="box" x="84" y="893" width="140" height="75"/>
<text class="label" x="94" y="918">利用者</text>
<rect class="box" x="232" y="893" width="240" height="75"/>
<text class="label" x="242" y="918">要らない instance ・</text>
<text class="label" x="242" y="935">判定の記録を消す</text>
<rect class="box" x="480" y="893" width="300" height="75"/>
<text class="label" x="490" y="918">消したものを指す参照と、</text>
<text class="label" x="490" y="935">消したものに結び付いた記録が残っていない</text>
<rect class="box" x="788" y="893" width="300" height="75"/>
<text class="label" x="798" y="918">消したものを指す instance</text>
<text class="label" x="798" y="935">は変更後の検証で violated になり、</text>
<text class="label" x="798" y="952">取り込めない理由に出る</text>
<rect class="box" x="84" y="974" width="140" height="75"/>
<text class="label" x="94" y="999">読み手（人）</text>
<rect class="box" x="232" y="974" width="240" height="75"/>
<text class="label" x="242" y="999">人が読む形で読んで判断する</text>
<rect class="box" x="480" y="974" width="300" height="75"/>
<text class="label" x="490" y="999">rule ごとの結果と instance の状態が、</text>
<text class="label" x="490" y="1016">内容と一緒に見える</text>
<rect class="box" x="788" y="974" width="300" height="75"/>
<text class="label" x="798" y="999">描画に失敗したら1ページも書かず、</text>
<text class="label" x="798" y="1016">効かなくなった判定を verified</text>
<text class="label" x="798" y="1033">として見せない</text>
<rect class="box" x="84" y="1055" width="140" height="109"/>
<text class="label" x="94" y="1080">利用者 ・</text>
<text class="label" x="94" y="1097">監査する人</text>
<rect class="box" x="232" y="1055" width="240" height="109"/>
<text class="label" x="242" y="1080">検証と判定と内容の変更の経緯を、</text>
<text class="label" x="242" y="1097">対象ごと ・ セッションごとにあとか</text>
<text class="label" x="242" y="1114">ら確かめる</text>
<rect class="box" x="480" y="1055" width="300" height="109"/>
<text class="label" x="490" y="1080">対象ごとに、どのセッションが ・ どの理由で</text>
<text class="label" x="490" y="1097"> ・ どの欄を変えたかと、誰が ・</text>
<text class="label" x="490" y="1114">どの変更の姿で ・ どの instance × rule</text>
<text class="label" x="490" y="1131">を判定したかが分かる。親のセッションで引く</text>
<text class="label" x="490" y="1148">と子のセッションの変更も含む</text>
<rect class="box" x="788" y="1055" width="300" height="109"/>
<text class="label" x="798" y="1080">記録の書き換えは変更の差分に出て、AI ・</text>
<text class="label" x="798" y="1097">人の rule で判定の記録が無いもの ・</text>
<text class="label" x="798" y="1114">変更の記録が無い書き換えは、</text>
<text class="label" x="798" y="1131">記録が無いと分かる</text>
<rect class="box" x="84" y="1170" width="140" height="75"/>
<text class="label" x="94" y="1195">harness の作者</text>
<rect class="box" x="232" y="1170" width="240" height="75"/>
<text class="label" x="242" y="1195">validator（AI ・</text>
<text class="label" x="242" y="1212">外のツール）をつなぐ</text>
<rect class="box" x="480" y="1170" width="300" height="75"/>
<text class="label" x="490" y="1195">判定できる rule が宣言され、宣言の外の</text>
<text class="label" x="490" y="1212">rule は unsupported と返る</text>
<rect class="box" x="788" y="1170" width="300" height="75"/>
<text class="label" x="798" y="1195">validator を1つもつながなくても、</text>
<text class="label" x="798" y="1212">機械で決まる rule は検証され、残りは</text>
<text class="label" x="798" y="1229">unsupported として返る</text>
<rect class="box" x="84" y="1251" width="140" height="75"/>
<text class="label" x="94" y="1276">判断する人</text>
<rect class="box" x="232" y="1251" width="240" height="75"/>
<text class="label" x="242" y="1276">機械と AI が判定できなかった</text>
<text class="label" x="242" y="1293">rule を判断する（AI の判定を覆</text>
<text class="label" x="242" y="1310">す）</text>
<rect class="box" x="480" y="1251" width="300" height="75"/>
<text class="label" x="490" y="1276">原因ごとにまとめて判断し、</text>
<text class="label" x="490" y="1293">示した入力に結び付いた記録が変更に入る</text>
<rect class="box" x="788" y="1251" width="300" height="75"/>
<text class="label" x="798" y="1276">判断されなかった rule は unverified</text>
<text class="label" x="798" y="1293">のまま残り、verified として見えない</text>
<rect class="box" x="84" y="1332" width="140" height="75"/>
<text class="label" x="94" y="1357">利用者</text>
<rect class="box" x="232" y="1332" width="240" height="75"/>
<text class="label" x="242" y="1357">既存のファイルを取り込む（導入）</text>
<rect class="box" x="480" y="1332" width="300" height="75"/>
<text class="label" x="490" y="1357">$schema が1つに決まるファイルはそのまま</text>
<text class="label" x="490" y="1374">instance になり、決まらないファイルは下書</text>
<text class="label" x="490" y="1391">きとして一覧に出る</text>
<rect class="box" x="788" y="1332" width="300" height="75"/>
<text class="label" x="798" y="1357">取り込めなかったファイルは中身が変わらず、</text>
<text class="label" x="798" y="1374">理由が返る</text>
<rect class="box" x="84" y="1413" width="140" height="92"/>
<text class="label" x="94" y="1438">利用者（チーム）</text>
<rect class="box" x="232" y="1413" width="240" height="92"/>
<text class="label" x="242" y="1438">ほかの変更を取り込む</text>
<rect class="box" x="480" y="1413" width="300" height="92"/>
<text class="label" x="490" y="1438">取り込んだあとの姿で全 instance</text>
<text class="label" x="490" y="1455">が検証され、状態が変わったものが出る</text>
<rect class="box" x="788" y="1413" width="300" height="92"/>
<text class="label" x="798" y="1438">同じ instance × rule の判定 ・</text>
<text class="label" x="798" y="1455">同じ対象の同じ欄を両方で変えたときは、</text>
<text class="label" x="798" y="1472">基盤が片方を選ばず、変更の仕組みの衝突とし</text>
<text class="label" x="798" y="1489">て人に出る</text>
<rect class="box" x="84" y="1511" width="140" height="75"/>
<text class="label" x="94" y="1536">作者</text>
<rect class="box" x="232" y="1511" width="240" height="75"/>
<text class="label" x="242" y="1536">文脈の語彙（x-）を定義する ・</text>
<text class="label" x="242" y="1553">変える</text>
<rect class="box" x="480" y="1511" width="300" height="75"/>
<text class="label" x="490" y="1536">定義した x- が形 ・ 意味 ・ 検証の仕方 ・</text>
<text class="label" x="490" y="1553"> 名前の範囲を持ち、その x- を使う全</text>
<text class="label" x="490" y="1570">instance が宣言した検証の仕方で検証される</text>
<rect class="box" x="788" y="1511" width="300" height="75"/>
<text class="label" x="798" y="1536">検証の仕方が書けない x- は unsupported</text>
<text class="label" x="798" y="1553">として返り、Core の語彙とぶつかる定義は違</text>
<text class="label" x="798" y="1570">反として返る</text>
<rect class="box" x="84" y="1592" width="140" height="75"/>
<text class="label" x="94" y="1617">作者</text>
<rect class="box" x="232" y="1592" width="240" height="75"/>
<text class="label" x="242" y="1617">ほかの文脈の公開された言葉（</text>
<text class="label" x="242" y="1634">Concrete の公開する部分）を</text>
<text class="label" x="242" y="1651">x-ref で読む</text>
<rect class="box" x="480" y="1592" width="300" height="75"/>
<text class="label" x="490" y="1617">読む側は、指した公開された言葉の版で検証さ</text>
<text class="label" x="490" y="1634">れ続ける</text>
<rect class="box" x="788" y="1592" width="300" height="75"/>
<text class="label" x="798" y="1617">読む先の版が無い ・ 読む先が新しい版だけを</text>
