<rect class="box focus" x="16" y="650" width="60" height="109"/>
<text class="title" x="26" y="675">U7</text>
<rect class="box focus" x="16" y="765" width="60" height="75"/>
<text class="title" x="26" y="790">U8</text>
<rect class="box focus" x="16" y="846" width="60" height="75"/>
<text class="title" x="26" y="871">U10</text>
<rect class="box focus" x="16" y="927" width="60" height="75"/>
<text class="title" x="26" y="952">U11</text>
<rect class="box focus" x="16" y="1008" width="60" height="75"/>
<text class="title" x="26" y="1033">U12</text>
<rect class="box focus" x="16" y="1089" width="60" height="109"/>
<text class="title" x="26" y="1114">U13</text>
<rect class="box focus" x="16" y="1204" width="60" height="109"/>
<text class="title" x="26" y="1229">U14</text>
<rect class="box focus" x="16" y="1319" width="60" height="75"/>
<text class="title" x="26" y="1344">U16</text>
<rect class="box focus" x="16" y="1400" width="60" height="75"/>
<text class="title" x="26" y="1425">U17</text>
<rect class="box focus" x="16" y="1481" width="60" height="92"/>
