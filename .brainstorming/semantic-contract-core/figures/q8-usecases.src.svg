<svg viewBox="0 0 956 872" style="min-width:900px" role="img" aria-label="使う場面：要約1と利用者の目的15の、主体 ・ 目的 ・ 成功したときの状態">
<text class="note" x="20" y="22">番号</text>
<text class="note" x="128" y="22">主体</text>
<text class="note" x="306" y="22">目的</text>
<text class="note" x="604" y="22">成功したときの状態</text>
<rect class="box focus" x="16" y="32" width="100" height="46"/>
<text class="title" x="26" y="60">U0（要約）</text>
<rect class="box" x="124" y="32" width="170" height="46"/>
<text class="label" x="134" y="60">利用者</text>
<rect class="box" x="302" y="32" width="290" height="46"/>
<text class="label" x="312" y="51">AI に書かせた成果物を、正しいと</text>
<text class="label" x="312" y="67">確かめた状態で使い続ける</text>
<rect class="box" x="600" y="32" width="340" height="46"/>
<text class="label" x="610" y="51">使っている instance がすべていまの版に従い、</text>
<text class="label" x="610" y="67">承認のあとで古くなっていない</text>
<rect class="box focus" x="16" y="84" width="100" height="46"/>
<text class="title" x="26" y="112">U1</text>
<rect class="box" x="124" y="84" width="170" height="46"/>
<text class="label" x="134" y="112">作者（人か AI）</text>
<rect class="box" x="302" y="84" width="290" height="46"/>
<text class="label" x="312" y="103">Concrete スキーマを作って</text>
<text class="label" x="312" y="119">公開する</text>
<rect class="box" x="600" y="84" width="340" height="46"/>
<text class="label" x="610" y="103">Agent が案内に従って書ける。</text>
<text class="label" x="610" y="119">公開した版は変わらない</text>
<rect class="box focus" x="16" y="136" width="100" height="46"/>
<text class="title" x="26" y="164">U2</text>
<rect class="box" x="124" y="136" width="170" height="46"/>
<text class="label" x="134" y="164">作者</text>
<rect class="box" x="302" y="136" width="290" height="46"/>
<text class="label" x="312" y="155">Concrete スキーマを変えて、</text>
<text class="label" x="312" y="171">新しい版を公開する</text>
<rect class="box" x="600" y="136" width="340" height="46"/>
<text class="label" x="610" y="155">既存の instance への影響と移し方が、</text>
<text class="label" x="610" y="171">新しい版と一緒に出ている</text>
<rect class="box focus" x="16" y="188" width="100" height="46"/>
<text class="title" x="26" y="216">U3</text>
<rect class="box" x="124" y="188" width="170" height="46"/>
<text class="label" x="134" y="216">作者</text>
<rect class="box" x="302" y="188" width="290" height="46"/>
<text class="label" x="312" y="207">Abstract の新しい版に Concrete を</text>
<text class="label" x="312" y="223">合わせる（マイグレーション）</text>
<rect class="box" x="600" y="188" width="340" height="46"/>
<text class="label" x="610" y="207">機械で直せる箇所は直り、</text>
<text class="label" x="610" y="223">残りは案内に従って直る</text>
<rect class="box focus" x="16" y="240" width="100" height="46"/>
<text class="title" x="26" y="268">U4</text>
<rect class="box" x="124" y="240" width="170" height="46"/>
<text class="label" x="134" y="268">提供側</text>
<rect class="box" x="302" y="240" width="290" height="46"/>
<text class="label" x="312" y="259">Abstract の新しい版を、</text>
<text class="label" x="312" y="275">移し方と一緒に公開する</text>
<rect class="box" x="600" y="240" width="340" height="46"/>
<text class="label" x="610" y="268">作者が U3 を案内どおりに終えられる</text>
<rect class="box focus" x="16" y="292" width="100" height="46"/>
<text class="title" x="26" y="320">U5</text>
<rect class="box" x="124" y="292" width="170" height="46"/>
<text class="label" x="134" y="311">利用者の代わりの</text>
<text class="label" x="134" y="327">AI の Agent</text>
<rect class="box" x="302" y="292" width="290" height="46"/>
<text class="label" x="312" y="320">instance を作る</text>
<rect class="box" x="600" y="292" width="340" height="46"/>
<text class="label" x="610" y="311">変えてよい範囲の中で書かれ、</text>
<text class="label" x="610" y="327">rule ごとの結果がそろい、違反が無い</text>
<rect class="box focus" x="16" y="344" width="100" height="46"/>
<text class="title" x="26" y="372">U6</text>
<rect class="box" x="124" y="344" width="170" height="46"/>
<text class="label" x="134" y="363">利用者の代わりの</text>
<text class="label" x="134" y="379">AI の Agent</text>
<rect class="box" x="302" y="344" width="290" height="46"/>
<text class="label" x="312" y="372">既存の instance を変える</text>
<rect class="box" x="600" y="344" width="340" height="46"/>
<text class="label" x="610" y="363">ほかの変更を上書きせず、</text>
<text class="label" x="610" y="379">参照と導出値が整合したまま保存される</text>
<rect class="box focus" x="16" y="396" width="100" height="46"/>
<text class="title" x="26" y="424">U7</text>
<rect class="box" x="124" y="396" width="170" height="46"/>
<text class="label" x="134" y="415">利用者の代わりの</text>
<text class="label" x="134" y="431">AI の Agent</text>
<rect class="box" x="302" y="396" width="290" height="46"/>
<text class="label" x="312" y="415">instance を新しい版の</text>
<text class="label" x="312" y="431">Concrete へ移す</text>
<rect class="box" x="600" y="396" width="340" height="46"/>
<text class="label" x="610" y="415">新しい版で検証を通り、</text>
<text class="label" x="610" y="431">元の意味が保たれている</text>
<rect class="box focus" x="16" y="448" width="100" height="46"/>
<text class="title" x="26" y="476">U8</text>
<rect class="box" x="124" y="448" width="170" height="46"/>
<text class="label" x="134" y="476">利用者の代わりの CI</text>
<rect class="box" x="302" y="448" width="290" height="46"/>
<text class="label" x="312" y="467">変更のたびに、すべての</text>
<text class="label" x="312" y="483">instance を検証する</text>
<rect class="box" x="600" y="448" width="340" height="46"/>
<text class="label" x="610" y="467">違反と未検証の一覧が返り、</text>
<text class="label" x="610" y="483">手元と同じ結果になる</text>
<rect class="box focus" x="16" y="500" width="100" height="46"/>
<text class="title" x="26" y="528">U9</text>
<rect class="box" x="124" y="500" width="170" height="46"/>
<text class="label" x="134" y="528">承認者（人）</text>
<rect class="box" x="302" y="500" width="290" height="46"/>
<text class="label" x="312" y="528">instance を承認する</text>
<rect class="box" x="600" y="500" width="340" height="46"/>
<text class="label" x="610" y="519">未検証の rule が人の判断で埋まり、</text>
<text class="label" x="610" y="535">承認の記録が根拠付きで残る</text>
<rect class="box focus" x="16" y="552" width="100" height="46"/>
<text class="title" x="26" y="580">U10</text>
<rect class="box" x="124" y="552" width="170" height="46"/>
<text class="label" x="134" y="580">利用者</text>
<rect class="box" x="302" y="552" width="290" height="46"/>
<text class="label" x="312" y="571">承認のあとで古くなった instance を</text>
<text class="label" x="312" y="587">見つけて確かめ直す（陳腐化を防ぐ）</text>
<rect class="box" x="600" y="552" width="340" height="46"/>
<text class="label" x="610" y="571">変わった instance が、すべて</text>
<text class="label" x="610" y="587">再承認か修正に回っている</text>
<rect class="box focus" x="16" y="604" width="100" height="46"/>
<text class="title" x="26" y="632">U11</text>
<rect class="box" x="124" y="604" width="170" height="46"/>
<text class="label" x="134" y="632">利用者</text>
<rect class="box" x="302" y="604" width="290" height="46"/>
<text class="label" x="312" y="623">要らない instance ・ 記録 ・ 版を</text>
<text class="label" x="312" y="639">消す（ノイズを残さない）</text>
<rect class="box" x="600" y="604" width="340" height="46"/>
<text class="label" x="610" y="632">消したものを指す参照が残っていない</text>
<rect class="box focus" x="16" y="656" width="100" height="46"/>
<text class="title" x="26" y="684">U12</text>
<rect class="box" x="124" y="656" width="170" height="46"/>
<text class="label" x="134" y="684">読み手（人）</text>
<rect class="box" x="302" y="656" width="290" height="46"/>
<text class="label" x="312" y="675">人が読む形で読んで</text>
<text class="label" x="312" y="691">判断する</text>
<rect class="box" x="600" y="656" width="340" height="46"/>
<text class="label" x="610" y="675">検証の結果と承認の状態が、</text>
<text class="label" x="610" y="691">内容と一緒に見える</text>
<rect class="box focus" x="16" y="708" width="100" height="46"/>
<text class="title" x="26" y="736">U13</text>
<rect class="box" x="124" y="708" width="170" height="46"/>
<text class="label" x="134" y="727">利用者 ・</text>
<text class="label" x="134" y="743">監査する人</text>
<rect class="box" x="302" y="708" width="290" height="46"/>
<text class="label" x="312" y="727">検証と承認の経緯を、</text>
<text class="label" x="312" y="743">あとから確かめる</text>
<rect class="box" x="600" y="708" width="340" height="46"/>
<text class="label" x="610" y="727">誰が ・ どの版で ・ どの範囲を ・</text>
<text class="label" x="610" y="743">いつ判定したかが分かる</text>
<rect class="box focus" x="16" y="760" width="100" height="46"/>
<text class="title" x="26" y="788">U14</text>
<rect class="box" x="124" y="760" width="170" height="46"/>
<text class="label" x="134" y="788">harness の作者</text>
<rect class="box" x="302" y="760" width="290" height="46"/>
<text class="label" x="312" y="779">validator（機械 ・ AI）を</text>
<text class="label" x="312" y="795">つなぐ</text>
<rect class="box" x="600" y="760" width="340" height="46"/>
<text class="label" x="610" y="779">判定できる rule が宣言され、</text>
<text class="label" x="610" y="795">宣言の外の rule は unsupported と返る</text>
<rect class="box focus" x="16" y="812" width="100" height="46"/>
<text class="title" x="26" y="840">U15</text>
<rect class="box" x="124" y="812" width="170" height="46"/>
<text class="label" x="134" y="831">利用者の代わりの</text>
<text class="label" x="134" y="847">AI の Agent</text>
<rect class="box" x="302" y="812" width="290" height="46"/>
<text class="label" x="312" y="831">承認済みの instance への</text>
<text class="label" x="312" y="847">変更を提案する</text>
<rect class="box" x="600" y="812" width="340" height="46"/>
<text class="label" x="610" y="831">差分 ・ なぜ必要か ・ なぜこの変更か ・</text>
<text class="label" x="610" y="847">検証の結果がそろい、承認者が判断できる</text>
</svg>