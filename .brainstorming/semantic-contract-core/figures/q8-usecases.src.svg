<text class="title" x="26" y="351">U3</text>
<rect class="box focus" x="16" y="390" width="60" height="75"/>
<text class="title" x="26" y="415">U4</text>
<rect class="box focus" x="16" y="471" width="60" height="143"/>
<text class="title" x="26" y="496">U5</text>
<rect class="box focus" x="16" y="620" width="60" height="75"/>
<text class="title" x="26" y="645">U6</text>
<rect class="box focus" x="16" y="701" width="60" height="109"/>
<text class="title" x="26" y="726">U7</text>
<rect class="box focus" x="16" y="816" width="60" height="75"/>
<text class="title" x="26" y="841">U8</text>
<rect class="box focus" x="16" y="897" width="60" height="75"/>
<text class="title" x="26" y="922">U10</text>
<rect class="box focus" x="16" y="978" width="60" height="126"/>
<text class="title" x="26" y="1003">U11</text>
<rect class="box focus" x="16" y="1110" width="60" height="92"/>
<text class="title" x="26" y="1135">U12</text>
<rect class="box focus" x="16" y="1208" width="60" height="109"/>
<text class="title" x="26" y="1233">U13</text>
<rect class="box focus" x="16" y="1323" width="60" height="75"/>
<text class="title" x="26" y="1348">U14</text>
<rect class="box focus" x="16" y="1404" width="60" height="75"/>
<text class="title" x="26" y="1429">U16</text>
<rect class="box focus" x="16" y="1485" width="60" height="75"/>
<text class="title" x="26" y="1510">U17</text>
<rect class="box focus" x="16" y="1566" width="60" height="92"/>
<text class="title" x="26" y="1591">U18</text>
<rect class="box focus" x="16" y="1664" width="60" height="75"/>
<text class="title" x="26" y="1689">U23</text>
<rect class="box focus" x="16" y="1745" width="60" height="92"/>
<text class="title" x="26" y="1770">U24</text>
<rect class="box focus" x="16" y="1843" width="60" height="126"/>
<text class="title" x="26" y="1868">U25</text>
<rect class="box focus" x="16" y="1975" width="60" height="58"/>
<text class="title" x="26" y="2000">U26</text>
<rect class="box" x="84" y="32" width="140" height="92"/>
<text class="label" x="94" y="57">利用者</text>
<rect class="box" x="232" y="32" width="240" height="92"/>
<text class="label" x="242" y="57">AI に書かせた成果物を、</text>
<text class="label" x="242" y="74">正しいと確かめた状態で使い続ける</text>
<rect class="box" x="480" y="32" width="300" height="92"/>
<text class="label" x="490" y="57">使っている instance が、</text>
<text class="label" x="490" y="74">いまの契約のすべての rule で verified</text>
<text class="label" x="490" y="91">（機械の検証と、変更に入れた AI ・</text>
<text class="label" x="490" y="108">人の判定の記録）である</text>
<rect class="box" x="788" y="32" width="300" height="92"/>
<text class="label" x="798" y="57">入力が変わった判定と、検証できなかった</text>
<text class="label" x="798" y="74">rule は、verified として見えない</text>
<rect class="box" x="84" y="130" width="140" height="75"/>
<text class="label" x="94" y="155">作者（人か AI）</text>
<rect class="box" x="232" y="130" width="240" height="75"/>
<text class="label" x="242" y="155">Concrete スキーマを作る</text>
<rect class="box" x="480" y="130" width="300" height="75"/>
<text class="label" x="490" y="155">Concrete が Abstract</text>
<text class="label" x="490" y="172">の版と拡張の契約に従い、Agent</text>
<text class="label" x="490" y="189">が案内に従って instance を書ける</text>
<rect class="box" x="788" y="130" width="300" height="75"/>
<text class="label" x="798" y="155">契約に従わない Concrete は、違反した</text>
<text class="label" x="798" y="172">rule と一緒に取り込めない理由として出る</text>
<rect class="box" x="84" y="211" width="140" height="109"/>
<text class="label" x="94" y="236">作者</text>
<rect class="box" x="232" y="211" width="240" height="109"/>
<text class="label" x="242" y="236">Concrete スキーマを変える</text>
<rect class="box" x="480" y="211" width="300" height="109"/>
<text class="label" x="490" y="236">変更に、変更後の姿での全 instance の状態</text>
<text class="label" x="490" y="253"> ・ 状態が変わった instance ・</text>
<text class="label" x="490" y="270">人が見るものが出る。変更の記録（意図 ・</text>
<text class="label" x="490" y="287">目的の参照）が一緒に残り、</text>
<text class="label" x="490" y="304">セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="211" width="300" height="109"/>
<text class="label" x="798" y="236">取り込むまで、いまの契約と instance</text>
<text class="label" x="798" y="253">の状態は変わらない</text>
<rect class="box" x="84" y="326" width="140" height="58"/>
<text class="label" x="94" y="351">作者</text>
<rect class="box" x="232" y="326" width="240" height="58"/>
<text class="label" x="242" y="351">Abstract の新しい版に</text>
<text class="label" x="242" y="368">Concrete を合わせる</text>
<rect class="box" x="480" y="326" width="300" height="58"/>
<text class="label" x="490" y="351">機械で直せる箇所は直り、</text>
<text class="label" x="490" y="368">残りは案内に従って直る</text>
<rect class="box" x="788" y="326" width="300" height="58"/>
<text class="label" x="798" y="351">移せなかった箇所は一覧で返り、いまの</text>
<text class="label" x="798" y="368">Concrete は壊れない</text>
<rect class="box" x="84" y="390" width="140" height="75"/>
<text class="label" x="94" y="415">提供側（Core</text>
<text class="label" x="94" y="432">を作る側）</text>
<rect class="box" x="232" y="390" width="240" height="75"/>
<text class="label" x="242" y="415">Abstract の新しい版を、</text>
<text class="label" x="242" y="432">移し方と一緒に出す</text>
<rect class="box" x="480" y="390" width="300" height="75"/>
<text class="label" x="490" y="415">作者が U3 を案内どおりに終えられる</text>
<rect class="box" x="788" y="390" width="300" height="75"/>
<text class="label" x="798" y="415">前の Abstract の版は中身が変わらず、</text>
<text class="label" x="798" y="432">それを申告する Concrete</text>
<text class="label" x="798" y="449">は検証を通り続ける</text>
<rect class="box" x="84" y="471" width="140" height="143"/>
<text class="label" x="94" y="496">AI の Agent</text>
<rect class="box" x="232" y="471" width="240" height="143"/>
<text class="label" x="242" y="496">instance を作る</text>
<rect class="box" x="480" y="471" width="300" height="143"/>
<rect class="box" x="788" y="471" width="300" height="143"/>
<text class="label" x="490" y="496">決定権が人の欄は、</text>
<text class="label" x="490" y="513">人の入口から来た値のまま書かれ、</text>
<text class="label" x="490" y="530">rule ごとの結果がそろい、</text>
<text class="label" x="490" y="547">violated が無い。</text>
<text class="label" x="490" y="564">変更の記録（意図 ・ 目的の参照）が</text>
<text class="label" x="490" y="581">一緒に残り、セッションの参照は</text>
<text class="label" x="490" y="598">手元の索引に残る</text>
<text class="label" x="798" y="496">violated ・ error の rule</text>
<text class="label" x="798" y="513">が根拠付きで返る。必須の欄が空なら、</text>
<text class="label" x="798" y="530">根拠「必須の欄が空」の機械の violated</text>
<text class="label" x="798" y="547">として返る</text>
<rect class="box" x="84" y="620" width="140" height="75"/>
<text class="label" x="94" y="645">AI の Agent</text>
<rect class="box" x="232" y="620" width="240" height="75"/>
<text class="label" x="242" y="645">既存の instance を変える</text>
<rect class="box" x="480" y="620" width="300" height="75"/>
<text class="label" x="490" y="645">参照と導出値が整合したまま変わる。</text>
<text class="label" x="490" y="662">変更の記録（意図 ・ 目的の参照）が一緒に残</text>
<text class="label" x="490" y="679">り、セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="620" width="300" height="75"/>
<text class="label" x="798" y="645">参照が壊れる ・ 導出値が合わない変更は</text>
<text class="label" x="798" y="662">violated として返り、</text>
<text class="label" x="798" y="679">取り込めない理由に出る</text>
<rect class="box" x="84" y="701" width="140" height="109"/>
<text class="label" x="94" y="726">AI の Agent</text>
<rect class="box" x="232" y="701" width="240" height="109"/>
<text class="label" x="242" y="726">契約の変更で violated になった</text>
<text class="label" x="242" y="743">instance を、同じ変更の中で直す</text>
<rect class="box" x="480" y="701" width="300" height="109"/>
<text class="label" x="490" y="726">直した instance が変更後の契約で</text>
<text class="label" x="490" y="743">violated を持たず、元の意味が保たれてい</text>
<text class="label" x="490" y="760">る。変更の記録（意図 ・</text>
<text class="label" x="490" y="777">目的の参照）が一緒に残り、</text>
<text class="label" x="490" y="794">セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="701" width="300" height="109"/>
<text class="label" x="798" y="726">直せなかった instance は violated</text>
<text class="label" x="798" y="743">のまま変更後の検証に出て、理由が返る</text>
<rect class="box" x="84" y="816" width="140" height="75"/>
<text class="label" x="94" y="841">CI（変更の仕組み）</text>
<rect class="box" x="232" y="816" width="240" height="75"/>
<text class="label" x="242" y="841">変更のたびに、すべての instance</text>
<text class="label" x="242" y="858">を検証する</text>
<rect class="box" x="480" y="816" width="300" height="75"/>
<text class="label" x="490" y="841">violated と unverified の一覧が返り、</text>
<text class="label" x="490" y="858">手元と同じ結果になる</text>
<rect class="box" x="788" y="816" width="300" height="75"/>
<text class="label" x="798" y="841">validator が答えない ・ 誤った形で答えた</text>
<text class="label" x="798" y="858">rule は error として返り、verified</text>
<text class="label" x="798" y="875">に数えない</text>
<rect class="box" x="84" y="897" width="140" height="75"/>
<text class="label" x="94" y="922">利用者</text>
<rect class="box" x="232" y="897" width="240" height="75"/>
<text class="label" x="242" y="922">入力が変わった instance</text>
<text class="label" x="242" y="939">を確かめ直す</text>
<rect class="box" x="480" y="897" width="300" height="75"/>
<text class="label" x="490" y="922">入力が変わった rule だけが検証し直され、</text>
<text class="label" x="490" y="939">状態が変わった instance</text>
<text class="label" x="490" y="956">が変更の出力に出る</text>
<rect class="box" x="788" y="897" width="300" height="75"/>
<text class="label" x="798" y="922">基盤を通らずに書き換えられた instance </text>
<text class="label" x="798" y="939">も、次の検証で入力が変わったと分かり、</text>
<text class="label" x="798" y="956">前の判定は効かない</text>
<rect class="box" x="84" y="978" width="140" height="126"/>
<text class="label" x="94" y="1003">利用者</text>
<rect class="box" x="232" y="978" width="240" height="126"/>
<text class="label" x="242" y="1003">要らない instance ・</text>
<text class="label" x="242" y="1020">判定の記録を消す</text>
<rect class="box" x="480" y="978" width="300" height="126"/>
<text class="label" x="490" y="1003">同じ文脈の中で、消したものを指す参照と、</text>
<text class="label" x="490" y="1020">消したものに結び付いた判定の記録が残ってい</text>
<text class="label" x="490" y="1037">ない。変更の記録は経緯として残る</text>
<rect class="box" x="788" y="978" width="300" height="126"/>
<text class="label" x="798" y="1003">消したものを指す instance</text>
<text class="label" x="798" y="1020">は変更後の検証で violated になり、</text>
<text class="label" x="798" y="1037">取り込めない理由に出る。</text>
<text class="label" x="798" y="1054">ほかの文脈から指されている instance</text>
<text class="label" x="798" y="1071">を消すと、指している側の次の検証で</text>
<text class="label" x="798" y="1088">violated になり、黙って壊れない</text>
<rect class="box" x="84" y="1110" width="140" height="92"/>
<text class="label" x="94" y="1135">読み手（人）</text>
<rect class="box" x="232" y="1110" width="240" height="92"/>
<text class="label" x="242" y="1135">人が読む形で読んで判断する</text>
<rect class="box" x="480" y="1110" width="300" height="92"/>
<text class="label" x="490" y="1135">rule ごとの結果と instance の状態が、</text>
<text class="label" x="490" y="1152">内容と一緒に見える</text>
<rect class="box" x="788" y="1110" width="300" height="92"/>
<text class="label" x="798" y="1135">描画に失敗したら1ページも書かず、</text>
<text class="label" x="798" y="1152">効かなくなった判定を verified</text>
<text class="label" x="798" y="1169">として見せない。探した結果には探した範囲が</text>
<text class="label" x="798" y="1186">付き、範囲の外は探していないと返る</text>
<rect class="box" x="84" y="1208" width="140" height="109"/>
<text class="label" x="94" y="1233">利用者 ・</text>
<text class="label" x="94" y="1250">監査する人</text>
<rect class="box" x="232" y="1208" width="240" height="109"/>
<text class="label" x="242" y="1233">検証と判定と内容の変更の経緯を、</text>
<text class="label" x="242" y="1250">対象ごと ・ 目的ごとにあとから確か</text>
<text class="label" x="242" y="1267">める</text>
<rect class="box" x="480" y="1208" width="300" height="109"/>
<text class="label" x="490" y="1233">対象ごとに、どの意図 ・ どの目的で ・</text>
<text class="label" x="490" y="1250">どの欄を変えたかと、誰が ・ どの変更の姿で</text>
<text class="label" x="490" y="1267"> ・ どの instance × rule</text>
<text class="label" x="490" y="1284">を判定したかが分かる。いつ ・</text>
<text class="label" x="490" y="1301">誰が出したかは変更の仕組みの履歴から分かる</text>
<rect class="box" x="788" y="1208" width="300" height="109"/>
<text class="label" x="798" y="1233">記録の書き換えは変更の差分に出て、AI ・</text>
<text class="label" x="798" y="1250">人の rule で判定の記録が無いもの ・</text>
<text class="label" x="798" y="1267">変更の記録が無い書き換えは、</text>
<text class="label" x="798" y="1284">記録が無いと分かる</text>
<rect class="box" x="84" y="1323" width="140" height="75"/>
<text class="label" x="94" y="1348">harness の作者</text>
<rect class="box" x="232" y="1323" width="240" height="75"/>
<text class="label" x="242" y="1348">validator（AI ・</text>
<text class="label" x="242" y="1365">外のツール）をつなぐ</text>
<rect class="box" x="480" y="1323" width="300" height="75"/>
<text class="label" x="490" y="1348">判定できる rule が宣言され、宣言の外の</text>
<text class="label" x="490" y="1365">rule は unsupported と返る</text>
<rect class="box" x="788" y="1323" width="300" height="75"/>
<text class="label" x="798" y="1348">validator を1つもつながなくても、</text>
<text class="label" x="798" y="1365">機械で決まる rule は検証され、残りは</text>
<text class="label" x="798" y="1382">unsupported として返る</text>
<rect class="box" x="84" y="1404" width="140" height="75"/>
<text class="label" x="94" y="1429">判断する人</text>
<rect class="box" x="232" y="1404" width="240" height="75"/>
<text class="label" x="242" y="1429">機械と AI が判定できなかった</text>
<text class="label" x="242" y="1446">rule を判断する（AI の判定を覆</text>
<text class="label" x="242" y="1463">す）</text>
<rect class="box" x="480" y="1404" width="300" height="75"/>
<text class="label" x="490" y="1429">原因ごとにまとめて判断し、</text>
<text class="label" x="490" y="1446">示した入力に結び付いた記録が変更に入る</text>
<rect class="box" x="788" y="1404" width="300" height="75"/>
<text class="label" x="798" y="1429">判断されなかった rule は unverified</text>
<text class="label" x="798" y="1446">のまま残り、verified として見えない</text>
<rect class="box" x="84" y="1485" width="140" height="75"/>
<text class="label" x="94" y="1510">利用者</text>
<rect class="box" x="232" y="1485" width="240" height="75"/>
<text class="label" x="242" y="1510">既存のファイルを取り込む（導入）</text>
<rect class="box" x="480" y="1485" width="300" height="75"/>
<text class="label" x="490" y="1510">$schema が1つに決まるファイルはそのまま</text>
<text class="label" x="490" y="1527">instance になり、決まらないファイルは下書</text>
<text class="label" x="490" y="1544">きとして一覧に出る</text>
<rect class="box" x="788" y="1485" width="300" height="75"/>
<text class="label" x="798" y="1510">取り込めなかったファイルは中身が変わらず、</text>
<text class="label" x="798" y="1527">理由が返る</text>
<rect class="box" x="84" y="1566" width="140" height="92"/>
<text class="label" x="94" y="1591">利用者（チーム）</text>
<rect class="box" x="232" y="1566" width="240" height="92"/>
<text class="label" x="242" y="1591">ほかの変更を取り込む</text>
<rect class="box" x="480" y="1566" width="300" height="92"/>
<text class="label" x="490" y="1591">取り込んだあとの姿で全 instance</text>
<text class="label" x="490" y="1608">が検証され、状態が変わったものが出る</text>
<rect class="box" x="788" y="1566" width="300" height="92"/>
<text class="label" x="798" y="1591">同じ instance × rule の判定 ・</text>
<text class="label" x="798" y="1608">同じ対象の同じ欄を両方で変えたときは、</text>
<text class="label" x="798" y="1625">基盤が片方を選ばず、変更の仕組みの衝突とし</text>
<text class="label" x="798" y="1642">て人に出る</text>
<rect class="box" x="84" y="1664" width="140" height="75"/>
<text class="label" x="94" y="1689">作者</text>
<rect class="box" x="232" y="1664" width="240" height="75"/>
<text class="label" x="242" y="1689">文脈の語彙（x-）を定義する ・</text>
<text class="label" x="242" y="1706">変える</text>
<rect class="box" x="480" y="1664" width="300" height="75"/>
<text class="label" x="490" y="1689">定義した x- が形 ・ 意味 ・ 検証の仕方 ・</text>
<text class="label" x="490" y="1706"> 名前の範囲を持ち、その x- を使う全</text>
<text class="label" x="490" y="1723">instance が宣言した検証の仕方で検証される</text>
<rect class="box" x="788" y="1664" width="300" height="75"/>
<text class="label" x="798" y="1689">検証の仕方が書けない x- は unsupported</text>
<text class="label" x="798" y="1706">として返り、Core の語彙とぶつかる定義は違</text>
<text class="label" x="798" y="1723">反として返る</text>
<rect class="box" x="84" y="1745" width="140" height="92"/>
<text class="label" x="94" y="1770">作者</text>
<rect class="box" x="232" y="1745" width="240" height="92"/>
<text class="label" x="242" y="1770">ほかの文脈の公開された言葉（</text>
<text class="label" x="242" y="1787">Concrete の公開する部分）を</text>
<text class="label" x="242" y="1804">x-relationship で読む</text>
<rect class="box" x="480" y="1745" width="300" height="92"/>
<text class="label" x="490" y="1770">読む側は、指した公開された言葉の版で検証さ</text>
<text class="label" x="490" y="1787">れ続ける</text>
<rect class="box" x="788" y="1745" width="300" height="92"/>
<text class="label" x="798" y="1770">読む先の版が無い ・ 読む先が新しい版だけを</text>
<text class="label" x="798" y="1787">出したときは、読む側の検証にそう出て、</text>
<text class="label" x="798" y="1804">黙って壊れない。探した結果には探した範囲が</text>
<text class="label" x="798" y="1821">付き、範囲の外は探していないと返る</text>
<rect class="box" x="84" y="1843" width="140" height="126"/>
<text class="label" x="94" y="1868">変更を見る人（</text>
<text class="label" x="94" y="1885">harness</text>
<text class="label" x="94" y="1902">が代わりに始めるこ</text>
<text class="label" x="94" y="1919">ともある）</text>
<rect class="box" x="232" y="1843" width="240" height="126"/>
<text class="label" x="242" y="1868">変更を確かめて、取り込むかを決める</text>
<rect class="box" x="480" y="1843" width="300" height="126"/>
<text class="label" x="490" y="1868">条件（目的 ・ 対象。作業した本人の手元では</text>
<text class="label" x="490" y="1885">セッションも）に紐づくすべての変更の記録</text>
<text class="label" x="490" y="1902">が、意図 ・ 意味の変更 ・ 意図と変更が合って</text>
<text class="label" x="490" y="1919">いるかの判定（I33）・</text>
<text class="label" x="490" y="1936">変更後の検証の結果と一緒に出て、</text>
<text class="label" x="490" y="1953">例外が件数と一緒に先頭に出る</text>
<rect class="box" x="788" y="1843" width="300" height="126"/>
<text class="label" x="798" y="1868">見ても契約 ・ instance ・</text>
<text class="label" x="798" y="1885">記録は変わらない。意図は書き換わらずに出</text>
<text class="label" x="798" y="1902">て、意図の無い変更と、基盤を通らずに変えた</text>
<text class="label" x="798" y="1919">欄は、そうだと分かる</text>
<rect class="box" x="84" y="1975" width="140" height="58"/>
<text class="label" x="94" y="2000">harness の作者</text>
<rect class="box" x="232" y="1975" width="240" height="58"/>
<text class="label" x="242" y="2000">探す範囲（文脈の地図）を宣言する</text>
<rect class="box" x="480" y="1975" width="300" height="58"/>
<text class="label" x="490" y="2000">宣言した文脈の集まりを1つの索引で引け、</text>
<text class="label" x="490" y="2017">探した結果に範囲が付く</text>
<rect class="box" x="788" y="1975" width="300" height="58"/>
