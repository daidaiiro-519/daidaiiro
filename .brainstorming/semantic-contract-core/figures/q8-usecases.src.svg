<rect class="box focus" x="16" y="1741" width="60" height="126"/>
<text class="title" x="26" y="1766">U25</text>
<rect class="box" x="84" y="32" width="140" height="92"/>
<text class="label" x="94" y="57">利用者</text>
<rect class="box" x="232" y="32" width="240" height="92"/>
<text class="label" x="242" y="57">AI に書かせた成果物を、</text>
<text class="label" x="242" y="74">正しいと確かめた状態で使い続ける</text>
<rect class="box" x="480" y="32" width="300" height="92"/>
<text class="label" x="490" y="57">使っている instance が、</text>
<text class="label" x="490" y="74">いまの契約のすべての rule で verified</text>
<text class="label" x="490" y="91">（機械の検証と、変更に入れた AI ・</text>
<text class="label" x="490" y="108">人の判定の記録）である</text>
<rect class="box" x="788" y="32" width="300" height="92"/>
<text class="label" x="798" y="57">入力が変わった判定と、検証できなかった</text>
<text class="label" x="798" y="74">rule は、verified として見えない</text>
<rect class="box" x="84" y="130" width="140" height="75"/>
<text class="label" x="94" y="155">作者（人か AI）</text>
<rect class="box" x="232" y="130" width="240" height="75"/>
<text class="label" x="242" y="155">Concrete スキーマを作る</text>
<rect class="box" x="480" y="130" width="300" height="75"/>
<text class="label" x="490" y="155">Concrete が Abstract</text>
<text class="label" x="490" y="172">の版と拡張の契約に従い、Agent</text>
<text class="label" x="490" y="189">が案内に従って instance を書ける</text>
<rect class="box" x="788" y="130" width="300" height="75"/>
<text class="label" x="798" y="155">契約に従わない Concrete は、違反した</text>
<text class="label" x="798" y="172">rule と一緒に取り込めない理由として出る</text>
<rect class="box" x="84" y="211" width="140" height="109"/>
<text class="label" x="94" y="236">作者</text>
<rect class="box" x="232" y="211" width="240" height="109"/>
<text class="label" x="242" y="236">Concrete スキーマを変える</text>
<rect class="box" x="480" y="211" width="300" height="109"/>
<text class="label" x="490" y="236">変更に、変更後の姿での全 instance の状態</text>
<text class="label" x="490" y="253"> ・ 状態が変わった instance ・</text>
<text class="label" x="490" y="270">人が見るものが出る。変更の記録（理由 ・</text>
<text class="label" x="490" y="287">目的の参照）が一緒に残り、</text>
<text class="label" x="490" y="304">セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="211" width="300" height="109"/>
<text class="label" x="798" y="236">取り込むまで、いまの契約と instance</text>
<text class="label" x="798" y="253">の状態は変わらない</text>
<rect class="box" x="84" y="326" width="140" height="58"/>
<text class="label" x="94" y="351">作者</text>
<rect class="box" x="232" y="326" width="240" height="58"/>
<text class="label" x="242" y="351">Abstract の新しい版に</text>
<text class="label" x="242" y="368">Concrete を合わせる</text>
<rect class="box" x="480" y="326" width="300" height="58"/>
<text class="label" x="490" y="351">機械で直せる箇所は直り、</text>
<text class="label" x="490" y="368">残りは案内に従って直る</text>
<rect class="box" x="788" y="326" width="300" height="58"/>
<text class="label" x="798" y="351">移せなかった箇所は一覧で返り、いまの</text>
<text class="label" x="798" y="368">Concrete は壊れない</text>
<rect class="box" x="84" y="390" width="140" height="75"/>
<text class="label" x="94" y="415">提供側（Core</text>
<text class="label" x="94" y="432">を作る側）</text>
<rect class="box" x="232" y="390" width="240" height="75"/>
<text class="label" x="242" y="415">Abstract の新しい版を、</text>
<text class="label" x="242" y="432">移し方と一緒に出す</text>
<rect class="box" x="480" y="390" width="300" height="75"/>
<text class="label" x="490" y="415">作者が U3 を案内どおりに終えられる</text>
<rect class="box" x="788" y="390" width="300" height="75"/>
<text class="label" x="798" y="415">前の Abstract の版は中身が変わらず、</text>
<text class="label" x="798" y="432">それを申告する Concrete</text>
<text class="label" x="798" y="449">は検証を通り続ける</text>
<rect class="box" x="84" y="471" width="140" height="92"/>
<text class="label" x="94" y="496">AI の Agent</text>
<rect class="box" x="232" y="471" width="240" height="92"/>
<text class="label" x="242" y="496">instance を作る</text>
<rect class="box" x="480" y="471" width="300" height="92"/>
<text class="label" x="490" y="496">変えてよい範囲の中で書かれ、rule</text>
<text class="label" x="490" y="513">ごとの結果がそろい、violated が無い。</text>
<text class="label" x="490" y="530">変更の記録（理由 ・ 目的の参照）が一緒に残</text>
<text class="label" x="490" y="547">り、セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="471" width="300" height="92"/>
<text class="label" x="798" y="496">violated ・ error の rule</text>
<text class="label" x="798" y="513">が根拠付きで返る。必須の欄が空なら、</text>
<text class="label" x="798" y="530">根拠「必須の欄が空」の機械の violated</text>
<text class="label" x="798" y="547">として返る</text>
<rect class="box" x="84" y="569" width="140" height="75"/>
<text class="label" x="94" y="594">AI の Agent</text>
<rect class="box" x="232" y="569" width="240" height="75"/>
<text class="label" x="242" y="594">既存の instance を変える</text>
<rect class="box" x="480" y="569" width="300" height="75"/>
<text class="label" x="490" y="594">参照と導出値が整合したまま変わる。</text>
<text class="label" x="490" y="611">変更の記録（理由 ・ 目的の参照）が一緒に残</text>
<text class="label" x="490" y="628">り、セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="569" width="300" height="75"/>
<text class="label" x="798" y="594">参照が壊れる ・ 導出値が合わない変更は</text>
<text class="label" x="798" y="611">violated として返り、</text>
<text class="label" x="798" y="628">取り込めない理由に出る</text>
<rect class="box" x="84" y="650" width="140" height="109"/>
<text class="label" x="94" y="675">AI の Agent</text>
<rect class="box" x="232" y="650" width="240" height="109"/>
<text class="label" x="242" y="675">契約の変更で violated になった</text>
<text class="label" x="242" y="692">instance を、同じ変更の中で直す</text>
<rect class="box" x="480" y="650" width="300" height="109"/>
<text class="label" x="490" y="675">直した instance が変更後の契約で</text>
<text class="label" x="490" y="692">violated を持たず、元の意味が保たれてい</text>
<text class="label" x="490" y="709">る。変更の記録（理由 ・</text>
<text class="label" x="490" y="726">目的の参照）が一緒に残り、</text>
<text class="label" x="490" y="743">セッションの参照は手元の索引に残る</text>
<rect class="box" x="788" y="650" width="300" height="109"/>
<text class="label" x="798" y="675">直せなかった instance は violated</text>
<text class="label" x="798" y="692">のまま変更後の検証に出て、理由が返る</text>
<rect class="box" x="84" y="765" width="140" height="75"/>
<text class="label" x="94" y="790">CI（変更の仕組み）</text>
<rect class="box" x="232" y="765" width="240" height="75"/>
<text class="label" x="242" y="790">変更のたびに、すべての instance</text>
<text class="label" x="242" y="807">を検証する</text>
<rect class="box" x="480" y="765" width="300" height="75"/>
<text class="label" x="490" y="790">violated と unverified の一覧が返り、</text>
<text class="label" x="490" y="807">手元と同じ結果になる</text>
<rect class="box" x="788" y="765" width="300" height="75"/>
<text class="label" x="798" y="790">validator が答えない ・ 誤った形で答えた</text>
<text class="label" x="798" y="807">rule は error として返り、verified</text>
<text class="label" x="798" y="824">に数えない</text>
<rect class="box" x="84" y="846" width="140" height="75"/>
<text class="label" x="94" y="871">利用者</text>
<rect class="box" x="232" y="846" width="240" height="75"/>
<text class="label" x="242" y="871">入力が変わった instance</text>
<text class="label" x="242" y="888">を確かめ直す</text>
<rect class="box" x="480" y="846" width="300" height="75"/>
<text class="label" x="490" y="871">入力が変わった rule だけが検証し直され、</text>
<text class="label" x="490" y="888">状態が変わった instance</text>
<text class="label" x="490" y="905">が変更の出力に出る</text>
<rect class="box" x="788" y="846" width="300" height="75"/>
<text class="label" x="798" y="871">基盤を通らずに書き換えられた instance </text>
<text class="label" x="798" y="888">も、次の検証で入力が変わったと分かり、</text>
<text class="label" x="798" y="905">前の判定は効かない</text>
<rect class="box" x="84" y="927" width="140" height="75"/>
<text class="label" x="94" y="952">利用者</text>
<rect class="box" x="232" y="927" width="240" height="75"/>
<text class="label" x="242" y="952">要らない instance ・</text>
<text class="label" x="242" y="969">判定の記録を消す</text>
<rect class="box" x="480" y="927" width="300" height="75"/>
<text class="label" x="490" y="952">消したものを指す参照と、</text>
<text class="label" x="490" y="969">消したものに結び付いた判定の記録が残ってい</text>
<text class="label" x="490" y="986">ない。変更の記録は経緯として残る</text>
<rect class="box" x="788" y="927" width="300" height="75"/>
<text class="label" x="798" y="952">消したものを指す instance</text>
<text class="label" x="798" y="969">は変更後の検証で violated になり、</text>
<text class="label" x="798" y="986">取り込めない理由に出る</text>
<rect class="box" x="84" y="1008" width="140" height="75"/>
<text class="label" x="94" y="1033">読み手（人）</text>
<rect class="box" x="232" y="1008" width="240" height="75"/>
<text class="label" x="242" y="1033">人が読む形で読んで判断する</text>
<rect class="box" x="480" y="1008" width="300" height="75"/>
<text class="label" x="490" y="1033">rule ごとの結果と instance の状態が、</text>
<text class="label" x="490" y="1050">内容と一緒に見える</text>
<rect class="box" x="788" y="1008" width="300" height="75"/>
<text class="label" x="798" y="1033">描画に失敗したら1ページも書かず、</text>
<text class="label" x="798" y="1050">効かなくなった判定を verified</text>
<text class="label" x="798" y="1067">として見せない</text>
<rect class="box" x="84" y="1089" width="140" height="109"/>
<text class="label" x="94" y="1114">利用者 ・</text>
<text class="label" x="94" y="1131">監査する人</text>
<rect class="box" x="232" y="1089" width="240" height="109"/>
<text class="label" x="242" y="1114">検証と判定と内容の変更の経緯を、</text>
<text class="label" x="242" y="1131">対象ごと ・ 目的ごとにあとから確か</text>
<text class="label" x="242" y="1148">める</text>
<rect class="box" x="480" y="1089" width="300" height="109"/>
<text class="label" x="490" y="1114">対象ごとに、どの理由 ・ どの目的で ・</text>
<text class="label" x="490" y="1131">どの欄を変えたかと、誰が ・ どの変更の姿で</text>
<text class="label" x="490" y="1148"> ・ どの instance × rule</text>
<text class="label" x="490" y="1165">を判定したかが分かる。いつ ・</text>
<text class="label" x="490" y="1182">誰が出したかは変更の仕組みの履歴から分かる</text>
<rect class="box" x="788" y="1089" width="300" height="109"/>
<text class="label" x="798" y="1114">記録の書き換えは変更の差分に出て、AI ・</text>
<text class="label" x="798" y="1131">人の rule で判定の記録が無いもの ・</text>
<text class="label" x="798" y="1148">変更の記録が無い書き換えは、</text>
<text class="label" x="798" y="1165">記録が無いと分かる</text>
<rect class="box" x="84" y="1204" width="140" height="109"/>
<text class="label" x="94" y="1229">harness の作者</text>
<rect class="box" x="232" y="1204" width="240" height="109"/>
<text class="label" x="242" y="1229">validator（AI ・</text>
<text class="label" x="242" y="1246">外のツール）をつなぐ</text>
<rect class="box" x="480" y="1204" width="300" height="109"/>
<text class="label" x="490" y="1229">判定できる rule が宣言され、宣言の外の</text>
<text class="label" x="490" y="1246">rule は unsupported と返る。</text>
<text class="label" x="490" y="1263">unsupported になった検証役は、人が Core</text>
<text class="label" x="490" y="1280">の人の入口から tool permissions</text>
<text class="label" x="490" y="1297">に登録できる</text>
<rect class="box" x="788" y="1204" width="300" height="109"/>
<text class="label" x="798" y="1229">validator を1つもつながなくても、</text>
<text class="label" x="798" y="1246">機械で決まる rule は検証され、残りは</text>
<text class="label" x="798" y="1263">unsupported として返る</text>
<rect class="box" x="84" y="1319" width="140" height="75"/>
<text class="label" x="94" y="1344">判断する人</text>
<rect class="box" x="232" y="1319" width="240" height="75"/>
<text class="label" x="242" y="1344">機械と AI が判定できなかった</text>
<text class="label" x="242" y="1361">rule を判断する（AI の判定を覆</text>
<text class="label" x="242" y="1378">す）</text>
<rect class="box" x="480" y="1319" width="300" height="75"/>
<text class="label" x="490" y="1344">原因ごとにまとめて判断し、</text>
<text class="label" x="490" y="1361">示した入力に結び付いた記録が変更に入る</text>
<rect class="box" x="788" y="1319" width="300" height="75"/>
<text class="label" x="798" y="1344">判断されなかった rule は unverified</text>
<text class="label" x="798" y="1361">のまま残り、verified として見えない</text>
<rect class="box" x="84" y="1400" width="140" height="75"/>
<text class="label" x="94" y="1425">利用者</text>
<rect class="box" x="232" y="1400" width="240" height="75"/>
<text class="label" x="242" y="1425">既存のファイルを取り込む（導入）</text>
<rect class="box" x="480" y="1400" width="300" height="75"/>
<text class="label" x="490" y="1425">$schema が1つに決まるファイルはそのまま</text>
<text class="label" x="490" y="1442">instance になり、決まらないファイルは下書</text>
<text class="label" x="490" y="1459">きとして一覧に出る</text>
<rect class="box" x="788" y="1400" width="300" height="75"/>
<text class="label" x="798" y="1425">取り込めなかったファイルは中身が変わらず、</text>
<text class="label" x="798" y="1442">理由が返る</text>
<rect class="box" x="84" y="1481" width="140" height="92"/>
<text class="label" x="94" y="1506">利用者（チーム）</text>
<rect class="box" x="232" y="1481" width="240" height="92"/>
<text class="label" x="242" y="1506">ほかの変更を取り込む</text>
<rect class="box" x="480" y="1481" width="300" height="92"/>
<text class="label" x="490" y="1506">取り込んだあとの姿で全 instance</text>
<text class="label" x="490" y="1523">が検証され、状態が変わったものが出る</text>
<rect class="box" x="788" y="1481" width="300" height="92"/>
<text class="label" x="798" y="1506">同じ instance × rule の判定 ・</text>
<text class="label" x="798" y="1523">同じ対象の同じ欄を両方で変えたときは、</text>
<text class="label" x="798" y="1540">基盤が片方を選ばず、変更の仕組みの衝突とし</text>
<text class="label" x="798" y="1557">て人に出る</text>
<rect class="box" x="84" y="1579" width="140" height="75"/>
<text class="label" x="94" y="1604">作者</text>
<rect class="box" x="232" y="1579" width="240" height="75"/>
<text class="label" x="242" y="1604">文脈の語彙（x-）を定義する ・</text>
<text class="label" x="242" y="1621">変える</text>
<rect class="box" x="480" y="1579" width="300" height="75"/>
<text class="label" x="490" y="1604">定義した x- が形 ・ 意味 ・ 検証の仕方 ・</text>
<text class="label" x="490" y="1621"> 名前の範囲を持ち、その x- を使う全</text>
<text class="label" x="490" y="1638">instance が宣言した検証の仕方で検証される</text>
<rect class="box" x="788" y="1579" width="300" height="75"/>
<text class="label" x="798" y="1604">検証の仕方が書けない x- は unsupported</text>
<text class="label" x="798" y="1621">として返り、Core の語彙とぶつかる定義は違</text>
<text class="label" x="798" y="1638">反として返る</text>
<rect class="box" x="84" y="1660" width="140" height="75"/>
<text class="label" x="94" y="1685">作者</text>
<rect class="box" x="232" y="1660" width="240" height="75"/>
