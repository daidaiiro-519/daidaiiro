<svg viewBox="0 0 1104 2049" style="min-width:900px" role="img" aria-label="使う場面：主体 ・ 目的 ・ 成功したときの保証 ・ 最低限の保証">
<text class="note" x="20" y="22">#</text>
<text class="note" x="88" y="22">主体</text>
<text class="note" x="236" y="22">目的</text>
<text class="note" x="484" y="22">成功したとき</text>
<text class="note" x="792" y="22">最低限</text>
<rect class="box focus" x="16" y="32" width="60" height="92"/>
<text class="title" x="26" y="57">U0</text>
