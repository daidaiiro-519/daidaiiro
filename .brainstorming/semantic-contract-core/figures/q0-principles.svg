<svg viewBox="0 0 760 536" style="min-width:640px" role="img" aria-label="基盤の目的と、5つの設計原則のいまの基盤で足りているもの ・ 足りないもの" class="dsvg"><style data-dsvg="dark">.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}}:root[data-theme="dark"] .dsvg{--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}</style>
<rect class="box focus" x="20" y="12" width="722" height="76" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="34" y="34" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">目的</text>
<text class="label" x="34" y="56" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">意味 ・ 構造 ・ 関係 ・ 制約を1つの契約（Schema）に宣言し、その契約でインスタンスを解釈して検証する</text>
<text class="label" x="34" y="76" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">形や数のように機械で決まる検証も、意味の判断が要る検証も、同じ契約から行い、同じ形の結果で返す</text>
<text class="note" x="20" y="108" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">設計原則（構想 v0.3）</text><text class="note" x="236" y="108" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">いまの基盤で足りている</text><text class="note" x="506" y="108" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">足りない</text>
<rect class="box" x="20" y="120" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="154" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">1 宣言と解釈の分離</text>
<rect class="box kind-1" x="234" y="120" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="144" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">宣言（スキーマ ・ 注釈）と</text>
<text class="label" x="246" y="162" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめ（エンジン）は分かれている</text>
<rect class="box warn" x="506" y="120" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="144" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめるものを</text>
<text class="label" x="518" y="162" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">外から足す仕組み</text>
<rect class="box" x="20" y="190" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="224" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">2 既存技術は部品</text>
<rect class="box kind-1" x="234" y="190" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="214" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">標準は JSON Schema だけ。</text>
<text class="label" x="246" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">形の確かめを任せている</text>
<rect class="box warn" x="506" y="190" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="214" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">JSON-LD ・ SHACL ・ RDF の</text>
<text class="label" x="518" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">概念を参考に自前で定義すること</text>
<rect class="box" x="20" y="260" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="284" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">3 言語非依存の</text>
<text class="title" x="32" y="302" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">意味モデル</text>
<rect class="box kind-1" x="234" y="260" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="284" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Rust で作り、</text>
<text class="label" x="246" y="302" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">CLI ・ MCP ・ JSON で返す</text>
<rect class="box warn" x="506" y="260" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="284" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">出力の形を</text>
<text class="label" x="518" y="302" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">JSON Schema で公開すること</text>
<rect class="box" x="20" y="330" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="354" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">4 拡張可能な</text>
<text class="title" x="32" y="372" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">表現モデル</text>
<rect class="box kind-1" x="234" y="330" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="354" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-annotations で</text>
<text class="label" x="246" y="372" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">注釈を足せる</text>
<rect class="box warn" x="506" y="330" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="354" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x- の拡張を基盤のコマンドで</text>
<text class="label" x="518" y="372" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめ、できなければ返すこと</text>
<rect class="box" x="20" y="400" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">5 検証可能で</text>
<text class="title" x="32" y="442" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">実用に耐える</text>
<rect class="box kind-1" x="234" y="400" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ入力から</text>
<text class="label" x="246" y="442" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ結果を返す</text>
<rect class="box warn" x="506" y="400" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">別の言語の実装が</text>
<text class="label" x="518" y="442" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">使える適合の試験</text>
<rect class="box focus" x="20" y="476" width="722" height="48" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label" x="34" y="496" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">足す：基盤から AI を呼ぶ契約（Agents 契約）</text>
<text class="note" x="34" y="514" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">全体構成図の外部インターフェースは、4つとも外から基盤を呼ぶ向きである</text>
</svg>
