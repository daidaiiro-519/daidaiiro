<svg viewBox="0 0 760 450" style="min-width:640px" role="img" aria-label="5つの設計原則と、いまの基盤で足りているもの ・ 足りないもの" class="dsvg"><style data-dsvg="dark">.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}</style>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">設計原則（構想 v0.3）</text><text class="note" x="236" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">いまの基盤で足りている</text><text class="note" x="506" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">足りない</text>
<rect class="box" x="20" y="34" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="68" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">1 宣言と解釈の分離</text>
<rect class="box kind-1" x="234" y="34" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">宣言（スキーマ ・ 注釈）と</text>
<text class="label" x="246" y="76" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめ（エンジン）は分かれている</text>
<rect class="box warn" x="506" y="34" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめる担い手を</text>
<text class="label" x="518" y="76" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">外から足す仕組み</text>
<rect class="box" x="20" y="104" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="138" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">2 既存技術は部品</text>
<rect class="box kind-1" x="234" y="104" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="128" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">JSON Schema を</text>
<text class="label" x="246" y="146" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">エンジンに組み込んでいる</text>
<rect class="box warn" x="506" y="104" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="128" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">JSON-LD ・ SHACL ・ RDF の</text>
<text class="label" x="518" y="146" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">概念を自前で定義して写すこと</text>
<rect class="box" x="20" y="174" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">3 言語非依存の</text>
<text class="title" x="32" y="216" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">意味モデル</text>
<rect class="box kind-1" x="234" y="174" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Rust で作り、</text>
<text class="label" x="246" y="216" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">CLI ・ MCP ・ JSON で返す</text>
<rect class="box warn" x="506" y="174" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">出力の形を</text>
<text class="label" x="518" y="216" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">JSON Schema で公開すること</text>
<rect class="box" x="20" y="244" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="268" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">4 拡張可能な</text>
<text class="title" x="32" y="286" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">表現モデル</text>
<rect class="box kind-1" x="234" y="244" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="268" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-annotations で</text>
<text class="label" x="246" y="286" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">注釈を足せる</text>
<rect class="box warn" x="506" y="244" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="268" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">足した注釈を確かめ、</text>
<text class="label" x="518" y="286" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめなければ返すこと</text>
<rect class="box" x="20" y="314" width="204" height="58" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="32" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">5 検証可能で</text>
<text class="title" x="32" y="356" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">実用に耐える</text>
<rect class="box kind-1" x="234" y="314" width="262" height="58" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="label" x="246" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ入力から</text>
<text class="label" x="246" y="356" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ結果を返す</text>
<rect class="box warn" x="506" y="314" width="236" height="58" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label" x="518" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">別の言語の実装が</text>
<text class="label" x="518" y="356" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">使える適合の試験</text>
<rect class="box focus" x="20" y="390" width="722" height="48" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label" x="34" y="410" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">足す：基盤から AI を呼ぶ契約（Agents 契約）</text>
<text class="note" x="34" y="428" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">全体構成図の外部インターフェースは、4つとも外から基盤を呼ぶ向きである</text>
</svg>