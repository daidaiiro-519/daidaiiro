<svg viewBox="0 0 780 400" style="min-width:660px" role="img" aria-label="基盤の境界と、呼ぶ向き">
<rect class="boundary" x="20" y="20" width="170" height="150"/><text class="title" x="34" y="44">使う側</text>
<text class="label" x="34" y="70">Skill ・ ほかの言語</text>
<text class="label" x="34" y="88">の validator ・ 人</text>
<path class="flow" d="M192,95 H246"/><text class="note" x="200" y="80">呼ぶ</text>
<rect class="area" x="250" y="20" width="300" height="320"/><text class="title" x="264" y="44">基盤 Semantic Agent Schema</text>
<rect class="box" x="264" y="56" width="272" height="56"/><text class="label" x="276" y="80">インターフェース</text><text class="note" x="276" y="100">CLI ・ MCP ・ HTTP ・ WASM Component</text>
<rect class="box" x="264" y="122" width="272" height="88"/><text class="label" x="276" y="146">持つもの</text>
<text class="note" x="276" y="168">宣言の契約 ・ 検証する仕組み ・ 検証結果</text>
<text class="note" x="276" y="186">作成 ・ 更新 ・ 判定 ・ 描画</text>
<rect class="box focus" x="264" y="220" width="272" height="56"/><text class="label" x="276" y="244">outbound adapter（足す）</text><text class="note" x="276" y="264">Agents 契約で AI の CLI を起動する</text>
<path class="flow" d="M538,248 H580"/><text class="note" x="552" y="232">呼ぶ</text>
<rect class="boundary" x="584" y="200" width="184" height="96"/><text class="title" x="598" y="224">AI の CLI</text><text class="note" x="598" y="246">Claude Code ・ Codex</text><text class="note" x="598" y="264">Kiro ・ GitHub Copilot</text><text class="note" x="598" y="282">答えは基盤が検証する</text>
<rect class="boundary" x="584" y="20" width="184" height="150"/><text class="title" x="598" y="44">持たないもの</text>
<text class="note" x="598" y="70">使う側のデータ</text>
<text class="note" x="598" y="88">UI ・ Workflow を</text>
<text class="note" x="598" y="106">動かす側</text>
<text class="note" x="598" y="124">コードの生成</text>
<text class="note" x="20" y="366">全体構成図の外部インターフェースは「使う側 → 基盤」の向きだけ。</text>
<text class="note" x="20" y="386">「基盤 → AI」の向きは、outbound adapterとして足す</text>
</svg>