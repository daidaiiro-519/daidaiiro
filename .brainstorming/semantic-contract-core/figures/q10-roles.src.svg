<svg viewBox="0 0 966 234" style="min-width:900px" role="img" aria-label="役割の分け方：身元はホスティング、役割は契約、照合は CI">
<text class="note" x="20" y="22">持つもの</text>
<text class="note" x="238" y="22">誰が持つか</text>
<text class="note" x="416" y="22">中身</text>
<text class="note" x="754" y="22">基盤は</text>
<rect class="box focus" x="16" y="32" width="210" height="58"/>
<text class="title" x="26" y="57">身元（誰か）</text>
<rect class="box focus" x="16" y="96" width="210" height="58"/>
<text class="title" x="26" y="121">役割（誰が何をしてよいか）</text>
<rect class="box focus" x="16" y="160" width="210" height="58"/>
<text class="title" x="26" y="185">照合（その2つが合っているか）</text>
<rect class="box" x="234" y="32" width="170" height="58"/>
<text class="label" x="244" y="57">Git のホスティング</text>
<rect class="box" x="412" y="32" width="330" height="58"/>
<text class="label" x="422" y="57">PR の作者が依頼した人、レビューで承認した人が承</text>
<text class="label" x="422" y="74">認 ・ 判断した人</text>
<rect class="box" x="750" y="32" width="200" height="58"/>
<text class="label" x="760" y="57">持たない。名前を受け取るだけ</text>
<rect class="box" x="234" y="96" width="170" height="58"/>
<text class="label" x="244" y="121">基盤の契約（policy）</text>
<rect class="box" x="412" y="96" width="330" height="58"/>
<text class="label" x="422" y="121">承認者 ・ rule ごとの判断の担当 ・ 代わり ・</text>
<text class="label" x="422" y="138">期限</text>
<rect class="box" x="750" y="96" width="200" height="58"/>
<text class="label" x="760" y="121">持つ。最後に承認した版の名簿</text>
<text class="label" x="760" y="138">が効く</text>
<rect class="box" x="234" y="160" width="170" height="58"/>
<text class="label" x="244" y="185">CI の必須チェック</text>
<rect class="box" x="412" y="160" width="330" height="58"/>
<text class="label" x="422" y="185">効く記録を書く ・ レビューを判断の記録にする ・</text>
<text class="label" x="422" y="202"> 併合の前の検査</text>
<rect class="box" x="750" y="160" width="200" height="58"/>
<text class="label" x="760" y="185">検査の決まりを持つ</text>
</svg>