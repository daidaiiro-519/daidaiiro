<svg viewBox="0 0 958 371" style="min-width:900px" role="img" aria-label="基盤がすることと、しないこと">
<text class="note" x="20" y="22"></text>
<text class="note" x="168" y="22">何を</text>
<text class="note" x="426" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="140" height="182"/>
<text class="title" x="26" y="57">基盤がする</text>
<rect class="box focus" x="16" y="220" width="140" height="135"/>
<text class="title" x="26" y="245">基盤がしない</text>
<rect class="box" x="164" y="32" width="250" height="41"/>
<text class="label" x="174" y="57">意味の検証</text>
<rect class="box" x="422" y="32" width="520" height="41"/>
<text class="label" x="432" y="57">どのブランチでも CI で同じ検証をする</text>
<rect class="box" x="164" y="79" width="250" height="41"/>
<text class="label" x="174" y="104">取り込んだ中身の検証し直し</text>
<rect class="box" x="422" y="79" width="520" height="41"/>
<text class="label" x="432" y="104">中身が変わった rule だけを検証し直す</text>
<rect class="box" x="164" y="126" width="250" height="41"/>
<text class="label" x="174" y="151">PR に出すもの</text>
<rect class="box" x="422" y="126" width="520" height="41"/>
<text class="label" x="432" y="151">差分 ・ 理由 ・ 検証の結果 ・ 人が見るもの</text>
<rect class="box" x="164" y="173" width="250" height="41"/>
<text class="label" x="174" y="198">確かめたことの結び付け</text>
<rect class="box" x="422" y="173" width="520" height="41"/>
<text class="label" x="432" y="198">人が PR で確かめたことを、そのときの中身のハッシュに結び付ける</text>
<rect class="box" x="164" y="220" width="250" height="41"/>
<text class="label" x="174" y="245">誰が承認 ・ 確かめるか</text>
<rect class="box" x="422" y="220" width="520" height="41"/>
<text class="label" x="432" y="245">チームのやり方とホスティング（CODEOWNERS ・ レビューの設定）に任せる</text>
<rect class="box" x="164" y="267" width="250" height="41"/>
<text class="label" x="174" y="292">担当 ・ 代わり ・ 期限 ・ 受信箱</text>
<rect class="box" x="422" y="267" width="520" height="41"/>
<text class="label" x="432" y="292">PR のレビュー依頼と通知に任せる</text>
<rect class="box" x="164" y="314" width="250" height="41"/>
<text class="label" x="174" y="339">ファイルの併合</text>
<rect class="box" x="422" y="314" width="520" height="41"/>
<text class="label" x="432" y="339">Git に任せる。基盤は併合したあとの中身を検証する</text>
</svg>