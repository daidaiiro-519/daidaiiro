<text class="note" x="68" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">Semantic Schema Core が守る契約</text>
<text class="note" x="546" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">Git で実現するとき（アダプター）</text>
