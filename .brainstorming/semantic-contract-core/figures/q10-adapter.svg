<svg viewBox="0 0 958 418" style="min-width:900px" role="img" aria-label="守る契約は基盤が定義し、Git はそれを実現するアダプターの1つ" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E}</style><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="958.0" height="418.0" fill="#FFFFFF" rx="8"/>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66"/>
<text class="note" x="68" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">Semantic Agent Schema が守る契約</text>
<text class="note" x="546" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">Git で実現するとき（アダプター）</text>
<rect class="box focus" x="16" y="32" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">1</text>
<rect class="box focus" x="16" y="79" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">2</text>
<rect class="box focus" x="16" y="126" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">3</text>
<rect class="box focus" x="16" y="173" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">4</text>
<rect class="box focus" x="16" y="220" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">5</text>
<rect class="box focus" x="16" y="267" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">6</text>
<rect class="box focus" x="16" y="314" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">7</text>
<rect class="box focus" x="16" y="361" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">8</text>
<rect class="box" x="64" y="32" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更は、目的の参照と意図ごとの変更の記録を持つ変更として出す</text>
<rect class="box" x="542" y="32" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ブランチと PR（変更の記録は JSON のファイル）</text>
<rect class="box" x="64" y="79" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更の前後（前の姿 ・ 後の姿の参照）を、変更の仕組みから受け取る</text>
<rect class="box" x="542" y="79" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ブランチの合流点と先端のコミット（手元では作業ツリー）</text>
<rect class="box" x="64" y="126" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更ごとに、全 instance の状態と、変更のまとまりを出す</text>
<rect class="box" x="542" y="126" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ブランチの CI と、PR へのコメント</text>
<rect class="box" x="64" y="173" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI と人の判定の記録は、変更に入れて残す</text>
<rect class="box" x="542" y="173" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">記録は1件1ファイル。PR の差分に出る</text>
<rect class="box" x="64" y="220" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">承認は目的で1回、確かめるのは意図ごと。Core は承認の記録を持たない</text>
<rect class="box" x="542" y="220" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">PR の承認</text>
<rect class="box" x="64" y="267" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人が判定の記録に残すのは、判断待ちと AI の rule の結果だけ</text>
<rect class="box" x="542" y="267" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">PR のレビューで判定し、記録のファイルを足す</text>
<rect class="box" x="64" y="314" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ほかの変更を取り込んだら、取り込んだあとの姿で同じことをする</text>
<rect class="box" x="542" y="314" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">main の取り込み（merge ・ rebase）と、そのあとの CI</text>
<rect class="box" x="64" y="361" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ判定か同じ対象の同じ欄を両方で変えたら、人が選ぶ</text>
<rect class="box" x="542" y="361" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Git の衝突</text>
</svg>