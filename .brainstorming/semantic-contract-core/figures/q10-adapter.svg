<text class="title" x="26" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">8</text>
<rect class="box" x="64" y="32" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更は、差分と理由を持つ変更セットとして出す</text>
<rect class="box" x="542" y="32" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ブランチと PR（説明欄が理由）</text>
<rect class="box" x="64" y="79" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更セットごとに検証し、結果と人が見るものを出す</text>
<rect class="box" x="542" y="79" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ブランチの CI と、PR へのコメント</text>
<rect class="box" x="64" y="126" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">効く検証の記録を書けるのは、信頼できる実行者だけ</text>
<rect class="box" x="542" y="126" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">CI（手元の実行は参考）</text>
<rect class="box" x="64" y="173" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人の確かめは、そのときの中身のハッシュに結び付く</text>
<rect class="box" x="542" y="173" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">PR のレビュー（push で古い承認を消す設定）</text>
<rect class="box" x="64" y="220" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ほかの変更を取り込んだら、取り込んだ中身を検証し直す</text>
<rect class="box" x="542" y="220" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">main の取り込み（merge ・ rebase）と、そのあとの CI</text>
<rect class="box" x="64" y="267" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じところを両方で変えたら、人が中身を選ぶ</text>
<rect class="box" x="542" y="267" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Git の衝突</text>
<rect class="box" x="64" y="314" width="470" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">記録は足すだけで、合わせても衝突しない</text>
<rect class="box" x="542" y="314" width="400" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">1件1ファイル、名前は中身のハッシュ</text>
<rect class="box" x="64" y="361" width="470" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">validator の割り当て（AI とモデルの名前）は契約の一部で、</text>
<text class="label" x="74" y="403" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変えるのは変更セット</text>
<rect class="box" x="542" y="361" width="400" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="552" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">割り当てのファイルの変更を PR で出す</text>
</svg>