<rect class="box focus" x="16" y="267" width="40" height="41" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="title" x="26" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">6</text>
