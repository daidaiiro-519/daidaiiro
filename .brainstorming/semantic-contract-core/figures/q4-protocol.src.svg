<svg viewBox="0 0 760 330" style="min-width:640px" role="img" aria-label="1つの protocol を、基盤の CLI ・ MCP ・ WASM が同じ形で運ぶ">
<rect class="box" x="20" y="20" width="236" height="62"/><text class="title" x="32" y="46">CLI（標準入出力）</text><text class="note" x="32" y="68">いまある</text>
<path class="flow" d="M138,84 V122"/>
<rect class="box" x="267" y="20" width="236" height="62"/><text class="title" x="279" y="46">MCP</text><text class="note" x="279" y="68">いまある</text>
<path class="flow" d="M385,84 V122"/>
<rect class="box warn" x="514" y="20" width="236" height="62"/><text class="title" x="526" y="46">WASM Component</text><text class="note" x="526" y="68">足す</text>
<path class="flow" d="M632,84 V122"/>
<rect class="box focus" x="20" y="126" width="730" height="74"/>
<text class="title" x="34" y="152">protocol（JSON Schema で公開）</text>
<text class="label" x="34" y="178">要求と応答の形 ・ 版 ・ 能力の表明 ・ 結果の検証結果の5つの値。どのインターフェースからでも同じ形で返す</text>
<path class="flow" d="M385,202 V236"/>
<rect class="box" x="20" y="240" width="730" height="74"/>
<text class="title" x="34" y="266">エンジン（Rust）</text>
<text class="label" x="34" y="292">適合の試験は入力と期待結果の JSON の組。どのインターフェースとどの言語の実装も同じ試験を通す</text>
</svg>