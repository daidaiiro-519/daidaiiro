<svg viewBox="0 0 1000 570" style="min-width:900px" role="img" aria-label="変更の記録の ER 図">
<rect class="boundary" x="16" y="16" width="664" height="276"/>
<text class="note" x="30" y="276">集約の境界：変更の記録（1回の保存で変えるのはこの中だけ）</text>
<rect class="box focus" x="30" y="40" width="290" height="150"/><text class="title" x="42" y="64">変更の記録（集約）</text>
<text class="note" x="42" y="88">id（打ち合わせずに一意な値）</text>
<text class="note" x="42" y="110">理由（なぜ変えたか）</text>
<text class="note" x="42" y="132">目的の参照（id）</text>
<text class="note" x="42" y="154">セッションの参照（値）</text>
<text class="note" x="42" y="176">変更の項目の並び（値）</text>
<rect class="box" x="380" y="30" width="280" height="106"/><text class="title" x="392" y="54">セッションの参照（値）</text>
<text class="note" x="392" y="78">id</text>
<text class="note" x="392" y="100">根から親までの id の並び</text>
<text class="note" x="392" y="122">作業した者（呼ぶ側の申告）</text>
<rect class="box" x="380" y="160" width="280" height="106"/><text class="title" x="392" y="184">変更の項目（値）</text>
<text class="note" x="392" y="208">対象（種類と id）</text>
<text class="note" x="392" y="230">欄（JSON Pointer）</text>
<text class="note" x="392" y="252">項目ごとの理由（違うときだけ）</text>
<rect class="boundary" x="730" y="30" width="250" height="84"/><text class="title" x="742" y="54">セッションの中身（外）</text>
<text class="note" x="742" y="78">会話の記録。手元の AI のツールが持つ</text>
<text class="note" x="742" y="100">リポジトリに入れない</text>
<rect class="boundary" x="730" y="160" width="250" height="84"/><text class="title" x="742" y="184">Git など（外）</text>
<text class="note" x="742" y="208">ファイルの前後の値 ・ 履歴</text>
<text class="note" x="742" y="230">出した者 ・ 時刻 ・ 取り込み ・ 衝突</text>
<rect class="box" x="30" y="340" width="250" height="106"/><text class="title" x="42" y="364">判定の記録</text>
<text class="note" x="42" y="388">instance id ・ rule id</text>
<text class="note" x="42" y="410">判定した値 ・ 結果 ・ 根拠</text>
<text class="note" x="42" y="432">判定した者</text>
<rect class="box" x="380" y="340" width="250" height="106"/><text class="title" x="392" y="364">instance（仕様の document）</text>
<text class="note" x="392" y="388">id</text>
<text class="note" x="392" y="410">$schema（Concrete の $id）</text>
<text class="note" x="392" y="432">欄の値（JSON）</text>
<rect class="box" x="720" y="340" width="260" height="84"/><text class="title" x="732" y="364">Semantic Concrete Schema</text>
<text class="note" x="732" y="388">$id</text>
<text class="note" x="732" y="410">rule ・ term ・ 文脈の語彙</text>
<path class="flow" d="M320,80 H380"/><text class="note" x="326" y="72">1 ─ 1</text>
<path class="flow" d="M320,175 H380"/><text class="note" x="326" y="167">1 ─ N</text>
<path class="link" d="M730,75 H660"/><text class="note" x="692" y="67">id</text>
<path class="flow" d="M730,210 H660"/><text class="note" x="690" y="202">前後</text>
<path class="flow" d="M500,266 V340"/>
<path class="flow" d="M420,266 V310 H155 V340"/>
<path class="flow" d="M580,266 V310 H850 V340"/><text class="note" x="700" y="302">項目の対象（N ─ 1）</text>
<path class="flow" d="M380,390 H280"/><text class="note" x="364" y="382">1</text><text class="note" x="288" y="382">N</text>
<path class="flow" d="M720,390 H630"/><text class="note" x="705" y="382">1</text><text class="note" x="638" y="382">N</text>
<text class="note" x="30" y="478">保存：正本は文脈のリポジトリのファイル（最初のアダプターは1件1ファイル）で、変更（PR）と一緒に共有する。DB は使わない。</text>
<text class="note" x="30" y="500">まとまりは保存しない。セッション ・ 目的 ・ 対象を記録が持つ id で引き、出すときに組み立てる。</text>
<text class="note" x="30" y="522">理由と変更の項目が合っているかは Core の rule で、変更を書いた AI と別のセッションの AI が判定する。</text>
<text class="note" x="30" y="544">対象は仕様の document まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
</svg>