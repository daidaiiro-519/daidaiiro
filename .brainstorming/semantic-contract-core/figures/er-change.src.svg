<svg viewBox="0 0 1000 590" style="min-width:900px" role="img" aria-label="変更の記録の ER 図">
<rect class="box focus" x="30" y="20" width="290" height="172"/><text class="title" x="42" y="44">変更の記録（集約）</text>
<text class="note" x="42" y="68">id</text>
<text class="note" x="42" y="90">理由（なぜ変えたか）</text>
<text class="note" x="42" y="112">比べた案</text>
<text class="note" x="42" y="134">出した時刻</text>
<text class="note" x="42" y="156">セッションの参照（値）</text>
<text class="note" x="42" y="178">変更の項目の並び（値）</text>
<rect class="box" x="380" y="20" width="280" height="106"/><text class="title" x="392" y="44">セッションの参照（値）</text>
<text class="note" x="392" y="68">id ・ 親の id（0..1）</text>
<text class="note" x="392" y="90">作業した者（呼ぶ側の申告）</text>
<text class="note" x="392" y="112">セッションの開始 ・ 終了は持たない</text>
<rect class="box" x="380" y="150" width="280" height="106"/><text class="title" x="392" y="174">変更の項目（値）</text>
<text class="note" x="392" y="198">対象（種類と id）</text>
<text class="note" x="392" y="220">欄（JSON Pointer）</text>
<text class="note" x="392" y="242">項目ごとの理由（違うときだけ）</text>
<rect class="box" x="760" y="150" width="220" height="84"/><text class="title" x="772" y="174">変更の前後（Git など）</text>
<text class="note" x="772" y="198">ファイルの前後の値 ・ 履歴</text>
<text class="note" x="772" y="220">出した者 ・ 取り込み ・ 衝突</text>
<rect class="box" x="30" y="360" width="250" height="106"/><text class="title" x="42" y="384">判定の記録</text>
<text class="note" x="42" y="408">instance id ・ rule id</text>
<text class="note" x="42" y="430">判定した値 ・ 結果 ・ 根拠</text>
<text class="note" x="42" y="452">判定した者</text>
<rect class="box" x="380" y="360" width="250" height="106"/><text class="title" x="392" y="384">instance（仕様の document）</text>
<text class="note" x="392" y="408">id</text>
<text class="note" x="392" y="430">$schema（Concrete の $id）</text>
<text class="note" x="392" y="452">欄の値（JSON）</text>
<rect class="box" x="720" y="360" width="260" height="84"/><text class="title" x="732" y="384">Semantic Concrete Schema</text>
<text class="note" x="732" y="408">$id</text>
<text class="note" x="732" y="430">rule ・ term ・ 文脈の語彙</text>
<path class="flow" d="M320,60 H380"/><text class="note" x="326" y="52">1 ─ 1</text>
<path class="flow" d="M320,175 H380"/><text class="note" x="326" y="167">1 ─ N</text>
<path class="flow" d="M760,200 H660"/><text class="note" x="668" y="192">前後の値を導く</text>
<path class="flow" d="M500,256 V360"/>
<path class="flow" d="M420,256 V310 H155 V360"/>
<path class="flow" d="M580,256 V310 H850 V360"/><text class="note" x="600" y="302">項目の対象（N ─ 1）</text>
<path class="flow" d="M380,410 H280"/><text class="note" x="364" y="402">1</text><text class="note" x="288" y="402">N</text>
<path class="flow" d="M720,410 H630"/><text class="note" x="705" y="402">1</text><text class="note" x="638" y="402">N</text>
<text class="note" x="30" y="510">まとまりは保存しない。出すときに、まとめ方（セッション ・ 目的 ・ 対象）に紐づく変更の記録を取り出して組み立てる。</text>
<text class="note" x="30" y="532">理由と変更の項目が合っているかは Core の rule で、変更を書いた AI と別のセッションの AI が判定する。</text>
<text class="note" x="30" y="554">対象は仕様の document まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
</svg>