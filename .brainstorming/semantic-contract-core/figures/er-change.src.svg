<text class="note" x="42" y="478">instance id ・ rule id</text>
<text class="note" x="42" y="500">判定した値 ・ 結果 ・ 根拠</text>
<text class="note" x="42" y="522">判定した者</text>
<text class="note" x="42" y="544">変更 id</text>
<rect class="box" x="375" y="430" width="250" height="106"/><text class="title" x="387" y="454">instance</text>
<text class="note" x="387" y="478">id</text>
<text class="note" x="387" y="500">$schema（Concrete の $id）</text>
<text class="note" x="387" y="522">欄の値</text>
<rect class="box" x="720" y="430" width="260" height="84"/><text class="title" x="732" y="454">Semantic Concrete Schema</text>
<text class="note" x="732" y="478">$id</text>
<text class="note" x="732" y="500">rule ・ term ・ 文脈の語彙</text>
<path class="flow" d="M280,90 H375"/><text class="note" x="288" y="82">1</text><text class="note" x="360" y="82">N</text>
<path class="flow" d="M625,90 H720"/><text class="note" x="633" y="82">1</text><text class="note" x="705" y="82">N</text>
