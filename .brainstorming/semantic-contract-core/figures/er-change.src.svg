<svg viewBox="0 0 1000 660" style="min-width:900px" role="img" aria-label="変更の記録の ER 図（案）">
<rect class="box focus" x="30" y="20" width="250" height="150"/><text class="title" x="42" y="44">セッション</text>
<text class="note" x="42" y="68">id</text>
<text class="note" x="42" y="90">親セッション id（0..1）</text>
<text class="note" x="42" y="112">作業した者（人 ・ AI の Agent）</text>
<text class="note" x="42" y="134">始めた時刻 ・ 終えた時刻</text>
<text class="note" x="42" y="156">目的</text>
<rect class="box focus" x="375" y="20" width="250" height="150"/><text class="title" x="387" y="44">変更</text>
<text class="note" x="387" y="68">id</text>
<text class="note" x="387" y="90">セッション id</text>
<text class="note" x="387" y="112">理由（なぜ変えたか）</text>
