<text class="note" x="42" y="588">instance id ・ rule id</text>
<text class="note" x="42" y="610">判定した値 ・ 結果 ・ 根拠</text>
<text class="note" x="42" y="632">判定した者</text>
<text class="note" x="42" y="654">変更 id</text>
<rect class="box" x="375" y="540" width="250" height="106"/><text class="title" x="387" y="564">instance（仕様の document）</text>
<text class="note" x="387" y="588">id</text>
<text class="note" x="387" y="610">$schema（Concrete の $id）</text>
<text class="note" x="387" y="632">欄の値（JSON）</text>
<rect class="box" x="720" y="540" width="260" height="84"/><text class="title" x="732" y="564">Semantic Concrete Schema</text>
<text class="note" x="732" y="588">$id</text>
<text class="note" x="732" y="610">rule ・ term ・ 文脈の語彙</text>
<path class="flow" d="M155,148 V230"/><text class="note" x="165" y="192">まとまり N ─ N 変更</text>
<path class="flow" d="M500,170 V200 H230 V230"/><text class="note" x="300" y="214">セッション 1 ─ N 変更</text>
<path class="flow" d="M625,60 H660 V200 H560 V170"/><text class="note" x="668" y="130">親 1 ─ 子 N</text>
<path class="flow" d="M280,300 H375"/><text class="note" x="288" y="292">1</text><text class="note" x="360" y="292">N</text>
<path class="flow" d="M500,424 V540"/><path class="flow" d="M560,424 V480 H850 V540"/><text class="note" x="620" y="472">項目の対象（N ─ 1）</text>
<path class="flow" d="M155,380 V540"/><text class="note" x="165" y="470">判定の記録は変更に入る（1 ─ N）</text>
<path class="flow" d="M375,590 H280"/><text class="note" x="360" y="582">1</text><text class="note" x="288" y="582">N</text>
<path class="flow" d="M720,590 H625"/><text class="note" x="705" y="582">1</text><text class="note" x="633" y="582">N</text>
<text class="note" x="30" y="706">まとまりごとに、対象ごとの意味の差分 ・ 理由 ・ 変更後の検証の結果 ・ 人が見るものを出せる。PR は、まとまりの使い方の1つ（基盤は PR を知らない）。</text>
<text class="note" x="30" y="728">対象は仕様の document（Concrete の instance）まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
<text class="note" x="30" y="750">ファイルの保存と履歴は Git などのアダプターが持つ。変更の記録は意味の単位（欄）で、理由と一緒に基盤が持つ。</text>
</svg>