<path class="flow" d="M850,214 V430"/><path class="flow" d="M760,214 V320 H500 V430"/><text class="note" x="560" y="312">項目の対象（N ─ 1）</text>
<path class="flow" d="M420,170 V260 H155 V430"/><text class="note" x="165" y="252">判定の記録は変更に入る（1 ─ N）</text>
<path class="flow" d="M375,480 H280"/><text class="note" x="360" y="472">1</text><text class="note" x="288" y="472">N</text>
<path class="flow" d="M720,480 H625"/><text class="note" x="705" y="472">1</text><text class="note" x="633" y="472">N</text>
<text class="note" x="30" y="620">セッションごとに、そのセッションと子のセッションの変更 ・ 項目 ・ 理由を引ける。対象ごとに、その instance ・ Concrete の経緯を引ける。</text>
<text class="note" x="30" y="642">ファイルの保存と履歴は Git などのアダプターが持つ。変更の記録は意味の単位（欄）で、理由と一緒に基盤が持つ。</text>
</svg>