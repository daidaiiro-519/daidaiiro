<rect class="box focus" x="720" y="20" width="260" height="194"/><text class="title" x="732" y="44">変更の項目</text>
<text class="note" x="732" y="68">id</text>
<text class="note" x="732" y="90">変更 id</text>
<text class="note" x="732" y="112">対象（種類と id）</text>
<text class="note" x="732" y="134">欄（JSON Pointer）</text>
<text class="note" x="732" y="156">変更前の値 ・ 変更後の値</text>
<text class="note" x="732" y="178">操作（足す ・ 変える ・ 消す）</text>
