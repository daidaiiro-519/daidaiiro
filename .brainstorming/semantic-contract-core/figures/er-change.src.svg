<text class="note" x="42" y="134">作った者（harness など）</text>
<rect class="box focus" x="375" y="20" width="250" height="150"/><text class="title" x="387" y="44">セッション</text>
<text class="note" x="387" y="68">id</text>
<text class="note" x="387" y="90">親セッション id（0..1）</text>
<text class="note" x="387" y="112">作業した者（人 ・ AI の Agent）</text>
<text class="note" x="387" y="134">始めた時刻 ・ 終えた時刻</text>
<text class="note" x="387" y="156">目的</text>
<rect class="box focus" x="30" y="230" width="250" height="150"/><text class="title" x="42" y="254">変更</text>
<text class="note" x="42" y="278">id</text>
<text class="note" x="42" y="300">セッション id</text>
<text class="note" x="42" y="322">理由（なぜ変えたか）</text>
<text class="note" x="42" y="344">比べた案</text>
<text class="note" x="42" y="366">出した時刻</text>
<rect class="box focus" x="375" y="230" width="250" height="194"/><text class="title" x="387" y="254">変更の項目</text>
<text class="note" x="387" y="278">id</text>
<text class="note" x="387" y="300">変更 id</text>
<text class="note" x="387" y="322">対象（種類と id）</text>
<text class="note" x="387" y="344">欄（JSON Pointer）</text>
<text class="note" x="387" y="366">変更前の値 ・ 変更後の値</text>
<text class="note" x="387" y="388">操作（足す ・ 変える ・ 消す）</text>
<text class="note" x="387" y="410">理由（項目ごと）</text>
