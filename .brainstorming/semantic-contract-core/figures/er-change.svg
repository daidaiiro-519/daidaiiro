<text class="note" x="30" y="510" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">まとまりは保存しない。出すときに、まとめ方（セッション ・ 目的 ・ 対象）に紐づく変更の記録を取り出して組み立てる。</text>
<text class="note" x="30" y="532" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">理由と変更の項目が合っているかは Core の rule で、変更を書いた AI と別のセッションの AI が判定する。</text>
<text class="note" x="30" y="554" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">対象は仕様の document まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
