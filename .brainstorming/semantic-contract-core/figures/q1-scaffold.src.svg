<svg viewBox="0 0 962 382" style="min-width:860px" role="img" aria-label="Abstract から Concrete、Concrete から instance を Scaffold で作る2段と、2か所の x-prompt">
<rect class="area" x="16" y="16" width="270" height="324"/><text class="title" x="30" y="40">Abstract</text>
<text class="note" x="30" y="60">本体 semantic-abstract-schema.json</text>
<rect class="badge" x="220" y="24" width="52" height="22"/><text class="note" x="246" y="40" text-anchor="middle">基盤</text>
<rect class="box focus" x="30" y="94" width="242" height="76"/><text class="label" x="40" y="117">根の x-prompt</text>
<text class="note" x="40" y="138">Concrete スキーマの書き方</text>
<text class="note" x="40" y="158">読む人：Concrete を書く人</text>
<rect class="box focus" x="30" y="182" width="242" height="76"/><text class="label" x="40" y="205">$defs/prompt</text>
<text class="note" x="40" y="226">x-prompt の形</text>
<text class="note" x="40" y="246">read と write の2つ</text>
<rect class="box focus" x="30" y="270" width="242" height="36"/><text class="label" x="40" y="293">Core の x- の定義</text>
<rect class="area" x="346" y="16" width="270" height="324"/><text class="title" x="360" y="40">Concrete</text>
<text class="note" x="360" y="60">例：urn:semantic-schema-core:</text>
<text class="note" x="360" y="74">acdr:record:v1</text>
<rect class="badge" x="550" y="24" width="52" height="22"/><text class="note" x="576" y="40" text-anchor="middle">文脈</text>
<rect class="box" x="360" y="94" width="242" height="56"/><text class="label" x="370" y="117">$schema</text>
<text class="note" x="370" y="138">使う Abstract の版</text>
<rect class="box" x="360" y="162" width="242" height="76"/><text class="label" x="370" y="185">各欄の x-prompt</text>
<text class="note" x="370" y="206">その欄の値の書き方</text>
<text class="note" x="370" y="226">読む人：instance を書く人</text>
<rect class="box" x="360" y="250" width="242" height="76"/><text class="label" x="370" y="273">x-relationship ・ x-decided-by</text>
<text class="label" x="370" y="293">x-derived-from</text>
<text class="note" x="370" y="314">x-instance-path（置き場所）</text>
<rect class="area" x="676" y="16" width="270" height="324"/><text class="title" x="690" y="40">instance</text>
<text class="note" x="690" y="60">例：records/ACDR-1.json</text>
<rect class="badge" x="880" y="24" width="52" height="22"/><text class="note" x="906" y="40" text-anchor="middle">文脈</text>
<rect class="box" x="690" y="94" width="242" height="56"/><text class="label" x="700" y="117">値だけ</text>
<text class="note" x="700" y="138">x- キーワードは書かない</text>
<path class="flow" d="M286,114 H346"/><text class="note" x="316" y="106" text-anchor="middle">Scaffold</text>
<path class="flow" d="M616,114 H676"/><text class="note" x="646" y="106" text-anchor="middle">Scaffold</text>
<path class="flow" d="M276,220 H316 V210 H360"/>
<text class="note" x="316" y="254" text-anchor="middle">形に従う</text>
<text class="note" x="16" y="366">x-prompt の中身は継承しない。読む人が違うので、Abstract と Concrete は別の文を書き、形（$defs/prompt）だけを共有する</text>
</svg>
