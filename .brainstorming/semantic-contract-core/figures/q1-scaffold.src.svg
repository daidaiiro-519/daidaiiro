<svg viewBox="0 0 962 352" style="min-width:860px" role="img" aria-label="Abstract スキーマから Concrete スキーマ、Concrete スキーマから instance を create で作る2段と、3か所の x-prompt">
<rect class="area" x="16" y="16" width="270" height="294"/><text class="title" x="30" y="40">Abstract スキーマ</text>
<text class="note" x="30" y="60">schema-driven/abstract@v1</text>
<rect class="badge" x="220" y="24" width="52" height="22"/><text class="note" x="246" y="40" text-anchor="middle">基盤</text>
<rect class="box focus" x="30" y="80" width="242" height="76"/><text class="label" x="40" y="103">根の x-prompt</text>
<text class="note" x="40" y="124">Concrete スキーマの書き方</text>
<text class="note" x="40" y="144">読む人：Concrete を書く人</text>
<rect class="box focus" x="30" y="168" width="242" height="76"/><text class="label" x="40" y="191">$defs/prompt</text>
<text class="note" x="40" y="212">x-prompt の形</text>
<text class="note" x="40" y="232">read と write の2つ</text>
<rect class="box focus" x="30" y="256" width="242" height="36"/><text class="label" x="40" y="279">x- keyword の定義（7個）</text>
<rect class="area" x="346" y="16" width="270" height="294"/><text class="title" x="360" y="40">Concrete スキーマ</text>
<text class="note" x="360" y="60">例：lexicon/glossary@v1</text>
<rect class="badge" x="550" y="24" width="52" height="22"/><text class="note" x="576" y="40" text-anchor="middle">文脈</text>
<rect class="box" x="360" y="80" width="242" height="56"/><text class="label" x="370" y="103">$schema</text>
<text class="note" x="370" y="124">使う Abstract の版</text>
<rect class="box" x="360" y="148" width="242" height="76"/><text class="label" x="370" y="171">各欄の x-prompt</text>
<text class="note" x="370" y="192">その欄の値の書き方</text>
<text class="note" x="370" y="212">読む人：instance を書く人</text>
<rect class="box" x="360" y="236" width="242" height="56"/><text class="label" x="370" y="259">x-view ・ x-ref ・ x-derive</text>
<text class="note" x="370" y="280">x-generates（instance の置き場所）</text>
<rect class="area" x="676" y="16" width="270" height="294"/><text class="title" x="690" y="40">instance</text>
<text class="note" x="690" y="60">例：declarations/GLO-1.json</text>
<rect class="badge" x="880" y="24" width="52" height="22"/><text class="note" x="906" y="40" text-anchor="middle">文脈</text>
<rect class="box" x="690" y="80" width="242" height="56"/><text class="label" x="700" y="103">値だけ</text>
<text class="note" x="700" y="124">x- キーワードは書かない</text>
<path class="flow" d="M286,100 H346"/><text class="note" x="316" y="92" text-anchor="middle">create</text>
<path class="flow" d="M616,100 H676"/><text class="note" x="646" y="92" text-anchor="middle">create</text>
<path class="flow" d="M276,206 H316 V196 H360"/>
<text class="note" x="316" y="240" text-anchor="middle">形に従う</text>
<text class="note" x="16" y="336">x-prompt の中身は継承しない。読む人が違うので、Abstract と Concrete は別の文を書き、形（$defs/prompt）だけを共有する</text>
</svg>
