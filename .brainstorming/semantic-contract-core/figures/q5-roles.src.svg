<svg viewBox="0 0 760 346" style="min-width:640px" role="img" aria-label="Resolver が解決し、Semantic Validator と描画が使う。Semantic Validator はルールごとに validator を選ぶ">
<rect class="box focus" x="20" y="20" width="720" height="62"/><text class="title" x="34" y="46">Resolver</text><text class="label" x="34" y="68">x-ref の指す先 ・ x-derive の導出値 ・ 語彙を解決する（いまの graph()）</text>
<path class="flow" d="M200,84 V116"/><path class="flow" d="M620,84 V116"/>
<rect class="area" x="20" y="120" width="500" height="190"/><text class="title" x="34" y="144">Semantic Validator（検証の全体）</text>
<text class="label" x="34" y="166">ルールごとに、どの validator で検証するかを選ぶ</text>
<rect class="box" x="34" y="180" width="150" height="56"/><text class="title" x="46" y="204">Schema Validator</text><text class="note" x="46" y="224">構造と値</text>
<rect class="box" x="194" y="180" width="150" height="56"/><text class="title" x="206" y="204">基盤のエンジン</text><text class="note" x="206" y="224">関係と数</text>
<rect class="box kind-1" x="354" y="180" width="150" height="56"/><text class="title" x="366" y="204">AI ・ 人</text><text class="note" x="366" y="224">意味のルール</text>
<text class="note" x="34" y="262">3つとも validator。結果は検証結果で返す</text>
<rect class="box" x="540" y="120" width="200" height="190"/><text class="title" x="554" y="144">描画</text><text class="label" x="554" y="166">解決した結果を</text><text class="label" x="554" y="186">画面に出す</text>
<text class="note" x="20" y="334">1つのドメインの中のモジュールとして分ける（同じ言葉で話せるため）</text>
</svg>