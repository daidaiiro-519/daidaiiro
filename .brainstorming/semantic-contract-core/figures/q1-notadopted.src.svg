<svg viewBox="0 0 860 418" style="min-width:860px" role="img" aria-label="構想 v0.3 から採らない概念と理由">
<text class="note" x="20" y="22">構想 v0.3 の概念</text>
<text class="note" x="348" y="22">採らない理由</text>
<rect class="box" x="16" y="32" width="320" height="48"/>
<text class="label" x="26" y="52">Semantic Model</text>
<text class="label" x="26" y="68">（Entity ・ Property ・ Type）</text>
<rect class="box" x="344" y="32" width="500" height="48"/>
<text class="label" x="354" y="52">docs 自身が Entity を必須にしない。抽象スキーマと</text>
<text class="label" x="354" y="68">別にモデルを持つと、同じものに2つのモデルができる</text>
<rect class="box" x="16" y="86" width="320" height="48"/>
<text class="label" x="26" y="115">Interpreter ・ Interpretation</text>
<rect class="box" x="344" y="86" width="500" height="48"/>
<text class="label" x="354" y="106">検証 ・ 調停 ・ 実行の3つの意味を1語に載せている</text>
<text class="label" x="354" y="122">（Q5 で3つの語に分けた）</text>
<rect class="box" x="16" y="140" width="320" height="48"/>
<text class="label" x="26" y="169">Contract（examples の kind）</text>
<rect class="box" x="344" y="140" width="500" height="48"/>
<text class="label" x="354" y="169">Semantic Concrete Schema と同じものを指す。名前を1つにする</text>
<rect class="box" x="16" y="194" width="320" height="48"/>
<text class="label" x="26" y="214">Relation / Graph Engine と</text>
<text class="label" x="26" y="230">Constraint Engine を分けること</text>
<rect class="box" x="344" y="194" width="500" height="48"/>
<text class="label" x="354" y="214">Q3 で1つにまとめた。正本は JSON で、Graph は</text>
<text class="label" x="354" y="230">Semantic Schema Resolver の中の作業の形</text>
<rect class="box" x="16" y="248" width="320" height="48"/>
<text class="label" x="26" y="268">Projection</text>
<text class="label" x="26" y="284">（JSON-LD ・ SHACL への投影）</text>
<rect class="box" x="344" y="248" width="500" height="48"/>
<text class="label" x="354" y="277">Q2 で投影しないと決めた。概念だけを使う</text>
<rect class="box" x="16" y="302" width="320" height="48"/>
<text class="label" x="26" y="322">検証の4つの側面と</text>
<text class="label" x="26" y="338">capability の4区別</text>
<rect class="box" x="344" y="302" width="500" height="48"/>
<text class="label" x="354" y="322">docs 自身が議論の視点としている。</text>
<text class="label" x="354" y="338">機械的 ／ セマンティックの2つで足りる</text>
<rect class="box" x="16" y="356" width="320" height="48"/>
<text class="label" x="26" y="385">Vocabulary の階層 ・ 登録 ・ 衝突</text>
<rect class="box" x="344" y="356" width="500" height="48"/>
<text class="label" x="354" y="376">docs に階層の記述が無く、登録と衝突は未決。</text>
<text class="label" x="354" y="392">いま要るのは id ・ 意味 ・ 値の形 ・ 単位だけ</text>
</svg>