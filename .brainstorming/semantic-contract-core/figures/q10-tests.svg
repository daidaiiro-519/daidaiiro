<rect class="box" x="158" y="399" width="640" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="168" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">同じ記事の同じ欄を、統合先 と自分の変更セットで別々に変えた → 衝突として人が中身を選ぶ</text>
<rect class="box" x="806" y="399" width="190" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="424" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J34</text>
<rect class="box" x="16" y="446" width="56" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="471" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">TS8</text>
<rect class="box" x="158" y="446" width="640" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="168" y="471" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">手で verified の記録をファイルとして足す ・ 信頼できない場所で検証する → どちらも効かない。</text>
<text class="label" x="168" y="488" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">信頼できる実行者の検証だけが効く</text>
<rect class="box" x="806" y="446" width="190" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="471" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J35</text>
<rect class="box" x="16" y="510" width="56" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">TS9</text>
<rect class="box" x="158" y="510" width="640" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="168" y="535" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">信頼できる実行者の2回の検証 で AI の答えが割れた → 取り込みの順番によらず unverified にな</text>
<text class="label" x="168" y="552" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">り、変更セット に人が見るものとして出る</text>
