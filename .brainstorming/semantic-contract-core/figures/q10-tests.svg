<rect class="box" x="158" y="335" width="640" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="168" y="360" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">統合先に別の契約 v2 が先に入った → 自分の v2</text>
<text class="label" x="168" y="377" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">は取り込み時に「試し直して変更セットの中で確かめる」になる</text>
<rect class="box" x="806" y="335" width="190" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="360" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J30</text>
<rect class="box" x="16" y="399" width="56" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
