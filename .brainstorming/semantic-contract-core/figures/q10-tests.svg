<text class="label" x="168" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更セットで AI が記事を書く → 変更セットの 信頼できる実行者が検証し、人が見るものが</text>
<text class="label" x="168" y="74" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更セットに出る</text>
