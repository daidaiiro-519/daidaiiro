<text class="label" x="168" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">統合先に別の人の変更が入る → 自分の変更セットに取り込むと、変わった中身だけが検証し直される</text>
<rect class="box" x="806" y="160" width="190" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J34 ・ J21</text>
<rect class="box" x="16" y="207" width="56" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">TS4</text>
