<rect class="box" x="158" y="271" width="640" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="168" y="296" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">統合先で記事 p1 が消された → 自分の変更セットで p1 を指していた記事は、</text>
<text class="label" x="168" y="313" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">取り込み時の検証で違反になる</text>
<rect class="box" x="806" y="271" width="190" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="296" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J12</text>
<rect class="box" x="16" y="335" width="56" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
