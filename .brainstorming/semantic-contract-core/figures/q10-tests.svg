<text class="label" x="168" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">自分が 変更セットの中で確かめた記事を、統合先で別の人が変えていた → 取り込むと、</text>
<text class="label" x="168" y="249" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめたことは効かず 変更セットに出る</text>
<rect class="box" x="806" y="207" width="190" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J21</text>
<rect class="box" x="16" y="271" width="56" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
