<text class="label" x="168" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更セットの中で人が確かめる → 検証済み。そのあと 変更セットに追加の変更 して中身が変わる →</text>
<text class="label" x="168" y="138" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめたことは効かない</text>
<rect class="box" x="806" y="96" width="190" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="816" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">J21 ・ J35</text>
<rect class="box" x="16" y="160" width="56" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="26" y="185" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">TS3</text>
