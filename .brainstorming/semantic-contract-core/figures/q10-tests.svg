<text class="label" x="168" y="646" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI の validator が渡された値を書き換えようとしても、記事は変わらない（AI が書けるのは答えだ</text>
<text class="label" x="168" y="663" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">け）</text>
