<rect class="box" x="64" y="237" width="430" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="262" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-ref の label を誰も読まない</text>
<rect class="box" x="502" y="237" width="580" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="512" y="262" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">消す。名前の出どころは x-view の label の1か所</text>
<rect class="box" x="64" y="284" width="430" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="309" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">公開の記録が無いまま abstract@v1 を配った（schema-driven</text>
<text class="label" x="74" y="326" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">v0.1.0〜0.1.1 ・ brainstorming v0.1.0〜0.1.2）</text>
<rect class="box" x="502" y="284" width="580" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="512" y="309" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">0.x は互換を約束しない版とし、今回の変更も v1 に足す。</text>
<text class="label" x="512" y="326" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">次に公開するときから公開の記録を付け、そこから先は出した版を変えない</text>
