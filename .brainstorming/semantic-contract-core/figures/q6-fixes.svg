<text class="label" x="74" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">どの一員も、自分は Concrete スキーマとして書かれている</text>
<rect class="box" x="502" y="32" width="580" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="512" y="57" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">準拠と所有を分ける。どの一員も meta-schema に準拠し、所有は Core（名前の頭）で示す</text>
<rect class="box" x="64" y="79" width="430" height="58" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">自分の検査で13件の指摘</text>
