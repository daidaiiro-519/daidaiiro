<text class="label" x="512" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">除外の道を作らず、description と x-prompt を足して0件にする（手元の形には</text>
<text class="label" x="512" y="121" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-prompt を求めない）</text>
<rect class="box" x="64" y="143" width="430" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="74" y="168" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">注釈の一覧がメタスキーマ（5）とコード（7）で違う</text>
<rect class="box" x="502" y="143" width="580" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="512" y="168" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x- キーワードの表の1か所にまとめる。コードはこの表を読む</text>
