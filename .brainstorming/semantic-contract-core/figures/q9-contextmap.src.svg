<svg viewBox="0 0 858 352" style="min-width:858px" role="img" aria-label="文脈の地図：Semantic Schema Core と、まわりの文脈との関係">
<text class="note" x="20" y="22">文脈</text>
<text class="note" x="248" y="22">Core との関係</text>
<text class="note" x="466" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="220" height="46"/>
<text class="title" x="26" y="60">Semantic Schema Core</text>
<rect class="box" x="244" y="32" width="210" height="46"/>
<text class="label" x="254" y="60">基盤の内側は1つの文脈</text>
<rect class="box" x="462" y="32" width="380" height="46"/>
<text class="label" x="472" y="51">中に業務領域ごとの論理的な境界を置く。</text>
<text class="label" x="472" y="67">外へは共用サービスと公開された言葉</text>
<rect class="box focus" x="16" y="84" width="220" height="46"/>
<text class="title" x="26" y="112">Skill ・ Agent の各文脈</text>
<rect class="box" x="244" y="84" width="210" height="46"/>
<text class="label" x="254" y="112">Core の下流（従う）</text>
<rect class="box" x="462" y="84" width="380" height="46"/>
<text class="label" x="472" y="103">Concrete スキーマと terms@v1 を持つ。</text>
<text class="label" x="472" y="119">Abstract の版に従う</text>
<rect class="box focus" x="16" y="136" width="220" height="46"/>
<text class="title" x="26" y="164">harness ・ 開発基盤</text>
<rect class="box" x="244" y="136" width="210" height="46"/>
<text class="label" x="254" y="164">Core の下流（従う）</text>
<rect class="box" x="462" y="136" width="380" height="46"/>
<text class="label" x="472" y="155">プロダクト。文脈の地図と</text>
<text class="label" x="472" y="171">instance だけを持つ</text>
<rect class="box focus" x="16" y="188" width="220" height="46"/>
<text class="title" x="26" y="216">AI の validator（外）</text>
<rect class="box" x="244" y="188" width="210" height="46"/>
<text class="label" x="254" y="216">Core の上流</text>
<rect class="box" x="462" y="188" width="380" height="46"/>
<text class="label" x="472" y="207">Agents 契約を腐敗防止層として</text>
<text class="label" x="472" y="223">Core の側に置き、中核のモデルを守る</text>
<rect class="box focus" x="16" y="240" width="220" height="46"/>
<text class="title" x="26" y="268">Skill ・ Agent どうし</text>
<rect class="box" x="244" y="240" width="210" height="46"/>
<text class="label" x="254" y="268">互いに独立</text>
<rect class="box" x="462" y="240" width="380" height="46"/>
<text class="label" x="472" y="259">ほかの Concrete を読むときは、</text>
<text class="label" x="472" y="275">読まれる側が公開された言葉になる</text>
<rect class="box focus" x="16" y="292" width="220" height="46"/>
<text class="title" x="26" y="320">人</text>
<rect class="box" x="244" y="292" width="210" height="46"/>
<text class="label" x="254" y="320">文脈ではなくアクター</text>
<rect class="box" x="462" y="292" width="380" height="46"/>
<text class="label" x="472" y="311">描画した view と承認の command で</text>
<text class="label" x="472" y="327">境界を越える</text>
</svg>