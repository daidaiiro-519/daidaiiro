<svg viewBox="0 0 780 420" style="min-width:660px" role="img" aria-label="基盤のポートとアダプターと、描画の契約">
<rect class="boundary" x="20" y="20" width="150" height="110"/><text class="title" x="34" y="44">使う側</text>
<text class="label" x="34" y="70">Skill ・ 人</text>
<text class="label" x="34" y="90">ほかの言語のプログラム</text>
<path class="flow" d="M172,82 H206"/><text class="note" x="176" y="72">呼ぶ</text>
<rect class="area" x="210" y="20" width="360" height="340"/><text class="title" x="224" y="44">基盤 schema-driven</text>
<rect class="box" x="224" y="56" width="332" height="52"/><text class="label" x="236" y="78">inbound adapter</text><text class="note" x="236" y="97">CLI ・ MCP（クラウドの入口はあとで足す）</text>
<rect class="box" x="224" y="118" width="332" height="104"/><text class="label" x="236" y="140">持つ契約</text>
<text class="note" x="236" y="160">宣言の契約 ・ 検証する仕組み ・ 結果の検証結果の5つの値</text>
<text class="note" x="236" y="180">作成 ・ 更新 ・ 承認</text>
<text class="note" x="236" y="200">描画の契約（abstract が持ち、render で描く）</text>
<rect class="box focus" x="224" y="232" width="332" height="50"/><text class="label" x="236" y="253">AI を呼ぶポート（Agents 契約）</text><text class="note" x="236" y="272">呼ぶ契約は1つ。答えは基盤が Schema で検証する</text>
<rect class="box" x="224" y="292" width="332" height="54"/><text class="label" x="236" y="314">outbound adapter</text><text class="note" x="236" y="334">AI ツールごとに差し替える</text>
<path class="flow" d="M558,319 H596"/><text class="note" x="574" y="309">呼ぶ</text>
<rect class="boundary" x="600" y="250" width="172" height="110"/><text class="title" x="614" y="274">AI ツール</text>
<text class="note" x="614" y="296">Claude Code ・ Codex</text>
<text class="note" x="614" y="314">Kiro ・ GitHub Copilot</text>
<text class="note" x="614" y="334">利用者ごとに違う</text>
<rect class="boundary" x="600" y="20" width="160" height="150"/><text class="title" x="614" y="44">使う側が用意する</text>
<text class="note" x="614" y="70">concrete スキーマ</text>
<text class="note" x="614" y="90">ページテンプレート</text>
<text class="note" x="614" y="110">部品のカタログ</text>
<text class="note" x="614" y="130">デザインシステム</text>
<path class="link" d="M600,170 L558,196"/>
<text class="note" x="20" y="386">AI ツールは利用者ごとに違うので、outbound adapterで差し替える。ポートから見た呼ぶ契約は1つである。</text>
<text class="note" x="20" y="406">描画の契約は abstract が持ち、concrete はテンプレート ・ カタログ ・ デザインシステムを用意して基盤の render で描く。</text>
</svg>