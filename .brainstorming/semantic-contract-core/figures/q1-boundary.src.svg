<rect class="box" x="64" y="113" width="470" height="58"/>
<text class="label" x="74" y="138">個々の Concrete スキーマの文書（欄 ・ rule ・ term ・ 文脈の語彙</text>
<text class="label" x="74" y="155"> ・ view ・ 割り当て ・ 変えてよい範囲 ・ 公開する部分）</text>
<rect class="box" x="542" y="113" width="230" height="58"/>
