<rect class="box" x="780" y="177" width="220" height="58"/>
<text class="label" x="790" y="202">その文脈だけ。版は並べて出し、</text>
<text class="label" x="790" y="219">出した版は変えない</text>
<rect class="box" x="64" y="241" width="470" height="58"/>
<text class="label" x="74" y="266">instance と判定の記録（記録の形は Abstract の一員）</text>
<rect class="box" x="542" y="241" width="230" height="58"/>
<text class="label" x="552" y="266">文脈</text>
<rect class="box" x="780" y="241" width="220" height="58"/>
