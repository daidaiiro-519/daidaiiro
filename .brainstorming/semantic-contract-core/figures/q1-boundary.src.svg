<svg viewBox="0 0 1016 925" style="min-width:900px" role="img" aria-label="境界：何を誰が持ち、誰が変えるか">
<text class="note" x="20" y="22"></text>
<text class="note" x="68" y="22">もの</text>
<text class="note" x="546" y="22">持ち主</text>
<text class="note" x="784" y="22">変える者</text>
<rect class="box focus" x="16" y="32" width="40" height="75"/>
<text class="title" x="26" y="57">1</text>
<rect class="box focus" x="16" y="113" width="40" height="58"/>
<text class="title" x="26" y="138">2</text>
