<svg viewBox="0 0 1016 1185" style="min-width:900px" role="img" aria-label="境界：何を誰が持ち、誰が変えるか">
<text class="note" x="20" y="22"></text>
<text class="note" x="68" y="22">もの</text>
<text class="note" x="546" y="22">持ち主</text>
<text class="note" x="784" y="22">変える者</text>
<rect class="box focus" x="16" y="32" width="40" height="75"/>
<text class="title" x="26" y="57">1</text>
<rect class="box" x="64" y="32" width="470" height="75"/>
<text class="label" x="74" y="57">Semantic Abstract Schema（版で識別する。メタスキーマ ・ 基盤</text>
<text class="label" x="74" y="74">の拡張項目 ・ Concrete の契約 ・ 拡張の契約 ・ 一員の形 ・</text>
<text class="label" x="74" y="91">閉じた一覧のデータ）</text>
<rect class="box" x="542" y="32" width="230" height="75"/>
<text class="label" x="552" y="57">基盤</text>
<rect class="box" x="780" y="32" width="220" height="75"/>
<text class="label" x="790" y="57">基盤だけ</text>
<rect class="box focus" x="16" y="113" width="40" height="75"/>
<text class="title" x="26" y="138">2</text>
<rect class="box" x="64" y="113" width="470" height="75"/>
<text class="label" x="74" y="138">個々の Semantic Concrete Schema の文書（欄 ・ rule ・</text>
<text class="label" x="74" y="155">glossary の term を指す $ref ・ Concrete の拡張項目 ・</text>
<text class="label" x="74" y="172">任せる先 ・ 決定権 ・ 公開する部分）</text>
<rect class="box" x="542" y="113" width="230" height="75"/>
<text class="label" x="552" y="138">文脈</text>
<rect class="box" x="780" y="113" width="220" height="75"/>
<text class="label" x="790" y="138">その文脈だけ</text>
<rect class="box focus" x="16" y="194" width="40" height="58"/>
<text class="title" x="26" y="219">3</text>
<rect class="box" x="64" y="194" width="470" height="58"/>
<text class="label" x="74" y="219">Concrete の公開する部分の版（公開する term ・ x- の定義 ・</text>
<text class="label" x="74" y="236">x-relationship で指される欄の形）</text>
<rect class="box" x="542" y="194" width="230" height="58"/>
<text class="label" x="552" y="219">文脈（公開された言葉として出す）</text>
<rect class="box" x="780" y="194" width="220" height="58"/>
<text class="label" x="790" y="219">その文脈だけ。版は並べて出し、</text>
<text class="label" x="790" y="236">出した版は変えない</text>
<rect class="box focus" x="16" y="258" width="40" height="58"/>
<text class="title" x="26" y="283">4</text>
<rect class="box" x="64" y="258" width="470" height="58"/>
<text class="label" x="74" y="283">glossary ・ インスタンス ・ 判定の記録（記録の形は Abstract の一員）</text>
<rect class="box" x="542" y="258" width="230" height="58"/>
<text class="label" x="552" y="283">文脈</text>
<rect class="box" x="780" y="258" width="220" height="58"/>
<text class="label" x="790" y="283">文脈。人の判定は人が出した変更</text>
<text class="label" x="790" y="300">でだけ</text>
<rect class="box focus" x="16" y="322" width="40" height="58"/>
<text class="title" x="26" y="347">5</text>
<rect class="box" x="64" y="322" width="470" height="58"/>
<text class="label" x="74" y="347">検証のエンジンと protocol</text>
<rect class="box" x="542" y="322" width="230" height="58"/>
<text class="label" x="552" y="347">基盤</text>
<rect class="box" x="780" y="322" width="220" height="58"/>
<text class="label" x="790" y="347">基盤だけ（実装の言語は契約に</text>
<text class="label" x="790" y="364">出さない）</text>
<rect class="box focus" x="16" y="386" width="40" height="58"/>
<text class="title" x="26" y="411">6</text>
<rect class="box" x="64" y="386" width="470" height="58"/>
<text class="label" x="74" y="411">Concrete が足した x- の意味の検証と、その依存</text>
<rect class="box" x="542" y="386" width="230" height="58"/>
<text class="label" x="552" y="411">Concrete（文脈）</text>
<rect class="box" x="780" y="386" width="220" height="58"/>
<text class="label" x="790" y="411">その文脈。基盤</text>
<text class="label" x="790" y="428">は作法だけを持つ</text>
<rect class="box focus" x="16" y="450" width="40" height="58"/>
<text class="title" x="26" y="475">7</text>
<rect class="box" x="64" y="450" width="470" height="58"/>
<text class="label" x="74" y="475">変更の記録（意図 ・ 目的の参照 ・ 書いた者の種類 ・ 変更の項目 ・</text>
<text class="label" x="74" y="492">置き換える意図の id。セッション ID は持たない。形は Abstract の一員）</text>
<rect class="box" x="542" y="450" width="230" height="58"/>
<text class="label" x="552" y="475">文脈</text>
<rect class="box" x="780" y="450" width="220" height="58"/>
<text class="label" x="790" y="475">その文脈。書くのは変更を出した</text>
<text class="label" x="790" y="492">作者か AI の Agent</text>
<rect class="box focus" x="16" y="514" width="40" height="58"/>
<text class="title" x="26" y="539">8</text>
<rect class="box" x="64" y="514" width="470" height="58"/>
<text class="label" x="74" y="539">目的（ACDR ・ 論点など）</text>
<rect class="box" x="542" y="514" width="230" height="58"/>
<text class="label" x="552" y="539">外</text>
<rect class="box" x="780" y="514" width="220" height="58"/>
<text class="label" x="790" y="539">外。基盤は目的の参照（id）</text>
<text class="label" x="790" y="556">だけを持つ</text>
<rect class="box focus" x="16" y="578" width="40" height="58"/>
<text class="title" x="26" y="603">9</text>
<rect class="box" x="64" y="578" width="470" height="58"/>
<text class="label" x="74" y="603">ファイルの差分（前後の値）・ 履歴 ・ 出した者 ・ 時刻 ・ 承認 ・</text>
<text class="label" x="74" y="620">取り込み ・ 衝突</text>
<rect class="box" x="542" y="578" width="230" height="58"/>
<text class="label" x="552" y="603">外（AI のツール ・ harness ・</text>
<text class="label" x="552" y="620">Git などの変更の仕組み）</text>
<rect class="box" x="780" y="578" width="220" height="58"/>
<text class="label" x="790" y="603">外。基盤は差分を作らず受け取る</text>
<text class="label" x="790" y="620">だけで、承認の記録を持たない</text>
<rect class="box focus" x="16" y="642" width="40" height="92"/>
<text class="title" x="26" y="667">10</text>
<rect class="box" x="64" y="642" width="470" height="92"/>
<text class="label" x="74" y="667">セッションの中身（会話の記録）</text>
<rect class="box" x="542" y="642" width="230" height="92"/>
<text class="label" x="552" y="667">外（手元の AI のツール）</text>
<rect class="box" x="780" y="642" width="220" height="92"/>
<text class="label" x="790" y="667">外。リポジトリに入れない。</text>
<text class="label" x="790" y="684">セッション ID はセッションと</text>
<text class="label" x="790" y="701">手元の索引にだけ置き、</text>
<text class="label" x="790" y="718">変更の記録には入れない</text>
<rect class="box focus" x="16" y="740" width="40" height="75"/>
<text class="title" x="26" y="765">11</text>
<rect class="box" x="64" y="740" width="470" height="75"/>
<text class="label" x="74" y="765">セッションの発行と会話の中身 ・ AI ツールの起動</text>
<rect class="box" x="542" y="740" width="230" height="75"/>
<text class="label" x="552" y="765">外（AI ツール ・ 人 ・</text>
<text class="label" x="552" y="782">harness）</text>
<rect class="box" x="780" y="740" width="220" height="75"/>
<text class="label" x="790" y="765">外。基盤は起動の前に</text>
<text class="label" x="790" y="782">問われて、再開する ID か</text>
<text class="label" x="790" y="799">「新しく立てる」を返すだけ</text>
<rect class="box focus" x="16" y="821" width="40" height="58"/>
<text class="title" x="26" y="846">12</text>
<rect class="box" x="64" y="821" width="470" height="58"/>
<text class="label" x="74" y="846">セッション（6つの欄。形は Abstract の一員）</text>
<rect class="box" x="542" y="821" width="230" height="58"/>
<text class="label" x="552" y="846">基盤（作業した人の手元、</text>
<text class="label" x="552" y="863">コミットしない）</text>
<rect class="box" x="780" y="821" width="220" height="58"/>
<text class="label" x="790" y="846">基盤のコマンド（立てる ・</text>
<text class="label" x="790" y="863">閉じる）だけ</text>
<rect class="box focus" x="16" y="885" width="40" height="75"/>
<text class="title" x="26" y="910">13</text>
<rect class="box" x="64" y="885" width="470" height="75"/>
<text class="label" x="74" y="910">任せた範囲（親が子に任せるときの約束。任せるたびに決まる）</text>
<rect class="box" x="542" y="885" width="230" height="75"/>
<text class="label" x="552" y="910">外（親のセッション。引き継ぎの</text>
<text class="label" x="552" y="927">プロンプトに書く）</text>
<rect class="box" x="780" y="885" width="220" height="75"/>
<text class="label" x="790" y="910">外。基盤は持たない。</text>
<text class="label" x="790" y="927">変わった欄は、</text>
<text class="label" x="790" y="944">変更の記録で出す</text>
<rect class="box focus" x="16" y="966" width="40" height="58"/>
<text class="title" x="26" y="991">14</text>
<rect class="box" x="64" y="966" width="470" height="58"/>
<text class="label" x="74" y="991">手元のセッションの索引（セッション ID → 変更の記録の id。形は</text>
<text class="label" x="74" y="1008">Abstract の一員）</text>
<rect class="box" x="542" y="966" width="230" height="58"/>
<text class="label" x="552" y="991">作業した人の手元（コミットしな</text>
<text class="label" x="552" y="1008">い）</text>
<rect class="box" x="780" y="966" width="220" height="58"/>
<text class="label" x="790" y="991">作業した本人だけ</text>
<rect class="box focus" x="16" y="1030" width="40" height="58"/>
<text class="title" x="26" y="1055">15</text>
<rect class="box" x="64" y="1030" width="470" height="58"/>
<text class="label" x="74" y="1055">関係の索引（インスタンスと x-relationship。正本のファイルから</text>
<text class="label" x="74" y="1072">作り直せる）</text>
<rect class="box" x="542" y="1030" width="230" height="58"/>
<text class="label" x="552" y="1055">基盤（手元の DB。コミットしな</text>
<text class="label" x="552" y="1072">い）</text>
<rect class="box" x="780" y="1030" width="220" height="58"/>
<text class="label" x="790" y="1055">基盤だけ。Concrete</text>
<text class="label" x="790" y="1072">は保存の形を宣言しない</text>
<rect class="box focus" x="16" y="1094" width="40" height="75"/>
<text class="title" x="26" y="1119">16</text>
<rect class="box" x="64" y="1094" width="470" height="75"/>
<text class="label" x="74" y="1119">AI の Agent に何を許すか（各 AI ツールの許可）</text>
<rect class="box" x="542" y="1094" width="230" height="75"/>
<text class="label" x="552" y="1119">各 AI ツールの設定ファイル（</text>
<text class="label" x="552" y="1136">Claude Code の</text>
<text class="label" x="552" y="1153">.claude/settings.json など）</text>
<rect class="box" x="780" y="1094" width="220" height="75"/>
<text class="label" x="790" y="1119">外。基盤は許可の契約を持たな</text>
<text class="label" x="790" y="1136">い</text>
</svg>
