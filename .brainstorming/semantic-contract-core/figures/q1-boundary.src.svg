<svg viewBox="0 0 962 392" style="min-width:860px" role="img" aria-label="区切られた文脈の中の Concrete の境界と、基盤が検証する範囲">
<rect class="area" x="16" y="16" width="610" height="330"/><text class="title" x="30" y="40">区切られた文脈（例：Skill ・ Agent ・ アプリケーション ・ プロジェクト）</text>
<rect class="boundary" x="30" y="60" width="220" height="270"/><text class="title" x="44" y="84">Concrete の外</text>
<rect class="box kind-1" x="44" y="116" width="192" height="30"/><text class="label" x="54" y="136">ソースコード</text>
<rect class="box kind-1" x="44" y="236" width="192" height="30"/><text class="label" x="54" y="256">テストのコード</text>
<text class="note" x="44" y="296">言語の道具が見る</text><text class="note" x="44" y="314">（テスト ・ 静的解析）</text>
<rect class="box" x="300" y="60" width="312" height="270"/><text class="title" x="314" y="84">Concrete</text>
<text class="note" x="314" y="104">基盤が JSON Schema で検証できる JSON</text>
<rect class="box focus" x="314" y="116" width="284" height="30"/><text class="label" x="324" y="136">Concrete スキーマ</text>
<rect class="box focus" x="314" y="156" width="284" height="30"/><text class="label" x="324" y="176">instance</text>
<rect class="box focus" x="314" y="196" width="284" height="30"/><text class="label" x="324" y="216">射影（render の HTML ・ Markdown）</text>
<rect class="box focus" x="314" y="236" width="284" height="30"/><text class="label" x="324" y="256">テストの記録（ACDR 0107）</text>
<path class="flow" d="M236,251 H314"/><text class="note" x="268" y="242" text-anchor="middle">書く</text>
<rect class="area" x="646" y="16" width="300" height="330"/><text class="title" x="660" y="40">Semantic Schema-Driven 基盤</text>
<rect class="box focus" x="660" y="116" width="272" height="30"/><text class="label" x="670" y="136">check ・ check-schemas</text>
<rect class="box focus" x="660" y="156" width="272" height="30"/><text class="label" x="670" y="176">Semantic Validator</text>
<rect class="box focus" x="660" y="196" width="272" height="30"/><text class="label" x="670" y="216">render</text>
<text class="note" x="660" y="276">検証するのは Concrete だけ</text><text class="note" x="660" y="296">ソースコードは読まない</text>
<text class="note" x="16" y="372">ソースコードと基盤は、テストが走ったときに書く記録（JSON）でつながる</text></svg>
