<svg viewBox="0 0 1016 976" style="min-width:900px" role="img" aria-label="境界：何を誰が持ち、誰が変えるか">
<text class="note" x="20" y="22"></text>
<text class="note" x="68" y="22">もの</text>
<text class="note" x="546" y="22">持ち主</text>
<text class="note" x="784" y="22">変える者</text>
<rect class="box focus" x="16" y="32" width="40" height="75"/>
<text class="title" x="26" y="57">1</text>
<rect class="box focus" x="16" y="113" width="40" height="58"/>
<text class="title" x="26" y="138">2</text>
<rect class="box focus" x="16" y="177" width="40" height="58"/>
<text class="title" x="26" y="202">3</text>
<rect class="box focus" x="16" y="241" width="40" height="58"/>
<text class="title" x="26" y="266">4</text>
<rect class="box focus" x="16" y="305" width="40" height="58"/>
<text class="title" x="26" y="330">5</text>
<rect class="box focus" x="16" y="369" width="40" height="126"/>
<text class="title" x="26" y="394">6</text>
<rect class="box focus" x="16" y="501" width="40" height="58"/>
<text class="title" x="26" y="526">7</text>
<rect class="box focus" x="16" y="565" width="40" height="58"/>
<text class="title" x="26" y="590">8</text>
<rect class="box focus" x="16" y="629" width="40" height="58"/>
<text class="title" x="26" y="654">9</text>
<rect class="box focus" x="16" y="693" width="40" height="75"/>
<text class="title" x="26" y="718">10</text>
<rect class="box focus" x="16" y="774" width="40" height="58"/>
<text class="title" x="26" y="799">11</text>
<rect class="box focus" x="16" y="838" width="40" height="58"/>
<text class="title" x="26" y="863">12</text>
<rect class="box focus" x="16" y="902" width="40" height="58"/>
<text class="title" x="26" y="927">13</text>
<rect class="box" x="64" y="32" width="470" height="75"/>
<text class="label" x="74" y="57">Semantic Abstract Schema（版で識別する。メタスキーマ ・ Core</text>
<text class="label" x="74" y="74">の語彙 ・ Concrete の契約 ・ 拡張の契約 ・ 一員の形 ・ tool</text>
<text class="label" x="74" y="91">permissions の形 ・ 閉じた一覧のデータ）</text>
<rect class="box" x="542" y="32" width="230" height="75"/>
<text class="label" x="552" y="57">Core</text>
<rect class="box" x="780" y="32" width="220" height="75"/>
<text class="label" x="790" y="57">Core だけ</text>
<rect class="box" x="64" y="113" width="470" height="58"/>
<text class="label" x="74" y="138">個々の Concrete スキーマの文書（欄 ・ rule ・ term ・ 文脈の語彙</text>
<text class="label" x="74" y="155"> ・ view ・ 割り当て ・ 変えてよい範囲 ・ 公開する部分）</text>
<rect class="box" x="542" y="113" width="230" height="58"/>
<text class="label" x="552" y="138">文脈</text>
<rect class="box" x="780" y="113" width="220" height="58"/>
<text class="label" x="790" y="138">その文脈だけ</text>
<rect class="box" x="64" y="177" width="470" height="58"/>
<text class="label" x="74" y="202">Concrete の公開する部分の版（公開する term ・ x- の定義 ・ x-ref</text>
<text class="label" x="74" y="219">で指される欄の形）</text>
<rect class="box" x="542" y="177" width="230" height="58"/>
<text class="label" x="552" y="202">文脈（公開された言葉として出す）</text>
<rect class="box" x="780" y="177" width="220" height="58"/>
<text class="label" x="790" y="202">その文脈だけ。版は並べて出し、</text>
<text class="label" x="790" y="219">出した版は変えない</text>
<rect class="box" x="64" y="241" width="470" height="58"/>
<text class="label" x="74" y="266">instance と判定の記録（記録の形は Abstract の一員）</text>
<rect class="box" x="542" y="241" width="230" height="58"/>
<text class="label" x="552" y="266">文脈</text>
<rect class="box" x="780" y="241" width="220" height="58"/>
<text class="label" x="790" y="266">文脈。人の判定は人が出した変更</text>
<text class="label" x="790" y="283">でだけ</text>
<rect class="box" x="64" y="305" width="470" height="58"/>
<text class="label" x="74" y="330">検証のエンジンと protocol</text>
<rect class="box" x="542" y="305" width="230" height="58"/>
<text class="label" x="552" y="330">Core</text>
<rect class="box" x="780" y="305" width="220" height="58"/>
<text class="label" x="790" y="330">Core だけ（実装の言語は契約に</text>
<text class="label" x="790" y="347">出さない）</text>
<rect class="box" x="64" y="369" width="470" height="126"/>
<text class="label" x="74" y="394">tool permissions（その文脈で起動してよい外のツールの一覧。Core</text>
<text class="label" x="74" y="411">が起動する検証役も、文脈が起動する AI の Agent も、これに従う）</text>
<rect class="box" x="542" y="369" width="230" height="126"/>
<text class="label" x="552" y="394">形は Abstract、</text>
<text class="label" x="552" y="411">値は文脈（agents.json</text>
<text class="label" x="552" y="428">のような設定ファイルに外出し）</text>
<rect class="box" x="780" y="369" width="220" height="126"/>
<text class="label" x="790" y="394">その文脈。各 AI</text>
<text class="label" x="790" y="411">ツールの許可の形（Claude</text>
<text class="label" x="790" y="428">Code の --allowedTools ・</text>
<text class="label" x="790" y="445">Codex の sandbox ・ Kiro</text>
<text class="label" x="790" y="462">の trust など）へは、Agents</text>
<text class="label" x="790" y="479">契約のアダプターが写す</text>
<rect class="box" x="64" y="501" width="470" height="58"/>
<text class="label" x="74" y="526">Concrete が足した x- の意味の検証と、その依存</text>
<rect class="box" x="542" y="501" width="230" height="58"/>
<text class="label" x="552" y="526">Concrete（文脈）</text>
<rect class="box" x="780" y="501" width="220" height="58"/>
<text class="label" x="790" y="526">その文脈。Core</text>
<text class="label" x="790" y="543">は作法だけを持つ</text>
<rect class="box" x="64" y="565" width="470" height="58"/>
<text class="label" x="74" y="590">変更の記録（理由 ・ 目的の参照 ・ 書いた者の種類 ・ 変更の項目。</text>
<text class="label" x="74" y="607">セッション ID は持たない。形は Abstract の一員）</text>
<rect class="box" x="542" y="565" width="230" height="58"/>
<text class="label" x="552" y="590">文脈</text>
<rect class="box" x="780" y="565" width="220" height="58"/>
<text class="label" x="790" y="590">その文脈。書くのは変更を出した</text>
<text class="label" x="790" y="607">作者か AI の Agent</text>
<rect class="box" x="64" y="629" width="470" height="58"/>
<text class="label" x="74" y="654">ファイルの前後の値 ・ 履歴 ・ 出した者 ・ 時刻 ・ 取り込み ・ 衝突</text>
<rect class="box" x="542" y="629" width="230" height="58"/>
<text class="label" x="552" y="654">外（AI のツール ・ harness ・</text>
<text class="label" x="552" y="671">Git などの変更の仕組み）</text>
<rect class="box" x="780" y="629" width="220" height="58"/>
<text class="label" x="790" y="654">外。基盤は受け取るだけ</text>
<rect class="box" x="64" y="693" width="470" height="75"/>
<text class="label" x="74" y="718">セッションの中身（会話の記録）</text>
<rect class="box" x="542" y="693" width="230" height="75"/>
<text class="label" x="552" y="718">外（手元の AI のツール）</text>
<rect class="box" x="780" y="693" width="220" height="75"/>
<text class="label" x="790" y="718">外。リポジトリに入れず、</text>
<text class="label" x="790" y="735">変更の記録はセッションの id</text>
<text class="label" x="790" y="752">だけを持つ</text>
<rect class="box" x="64" y="774" width="470" height="58"/>
<text class="label" x="74" y="799">セッションを管理する役（ID の発行 ・ 始まりと終わり ・</text>
<text class="label" x="74" y="816">子のセッションへの受け渡し）</text>
<rect class="box" x="542" y="774" width="230" height="58"/>
<text class="label" x="552" y="799">外（harness ・ AI のツール）</text>
<rect class="box" x="780" y="774" width="220" height="58"/>
<text class="label" x="790" y="799">外。Core は参照を受け取るだけ</text>
<rect class="box" x="64" y="838" width="470" height="58"/>
<text class="label" x="74" y="863">手元のセッションの索引（セッションの参照 → 変更の記録の id。形は</text>
<text class="label" x="74" y="880">Abstract の一員）</text>
<rect class="box" x="542" y="838" width="230" height="58"/>
<text class="label" x="552" y="863">作業した人の手元（コミットしな</text>
<text class="label" x="552" y="880">い）</text>
<rect class="box" x="780" y="838" width="220" height="58"/>
<text class="label" x="790" y="863">作業した本人だけ</text>
<rect class="box" x="64" y="902" width="470" height="58"/>
<text class="label" x="74" y="927">関係の索引（instance と x-ref。正本のファイルから作り直せる）</text>
<rect class="box" x="542" y="902" width="230" height="58"/>
<text class="label" x="552" y="927">Core（手元の DB。コミットしな</text>
<text class="label" x="552" y="944">い）</text>
<rect class="box" x="780" y="902" width="220" height="58"/>
<text class="label" x="790" y="927">Core だけ。Concrete</text>
<text class="label" x="790" y="944">は保存の形を宣言しない</text>
</svg>