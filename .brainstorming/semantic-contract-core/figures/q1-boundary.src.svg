<rect class="box focus" x="16" y="834" width="40" height="75"/>
<text class="title" x="26" y="859">13</text>
<rect class="box" x="64" y="32" width="470" height="75"/>
<text class="label" x="74" y="57">Semantic Abstract Schema（版で識別する。メタスキーマ ・ Core</text>
<text class="label" x="74" y="74">の語彙 ・ Concrete の契約 ・ 拡張の契約 ・ 一員の形 ・</text>
<text class="label" x="74" y="91">閉じた一覧のデータ）</text>
<rect class="box" x="542" y="32" width="230" height="75"/>
<text class="label" x="552" y="57">Core</text>
<rect class="box" x="780" y="32" width="220" height="75"/>
<text class="label" x="790" y="57">Core だけ</text>
<rect class="box" x="64" y="113" width="470" height="58"/>
<text class="label" x="74" y="138">個々の Concrete スキーマの文書（欄 ・ rule ・ term ・ 文脈の語彙</text>
<text class="label" x="74" y="155"> ・ view ・ 割り当て ・ 変えてよい範囲 ・ 公開する部分）</text>
<rect class="box" x="542" y="113" width="230" height="58"/>
<text class="label" x="552" y="138">文脈</text>
<rect class="box" x="780" y="113" width="220" height="58"/>
<text class="label" x="790" y="138">その文脈だけ</text>
<rect class="box" x="64" y="177" width="470" height="58"/>
<text class="label" x="74" y="202">Concrete の公開する部分の版（公開する term ・ x- の定義 ・ x-ref</text>
<text class="label" x="74" y="219">で指される欄の形）</text>
<rect class="box" x="542" y="177" width="230" height="58"/>
<text class="label" x="552" y="202">文脈（公開された言葉として出す）</text>
<rect class="box" x="780" y="177" width="220" height="58"/>
<text class="label" x="790" y="202">その文脈だけ。版は並べて出し、</text>
<text class="label" x="790" y="219">出した版は変えない</text>
<rect class="box" x="64" y="241" width="470" height="58"/>
<text class="label" x="74" y="266">instance と判定の記録（記録の形は Abstract の一員）</text>
<rect class="box" x="542" y="241" width="230" height="58"/>
<text class="label" x="552" y="266">文脈</text>
<rect class="box" x="780" y="241" width="220" height="58"/>
<text class="label" x="790" y="266">文脈。人の判定は人が出した変更</text>
<text class="label" x="790" y="283">でだけ</text>
<rect class="box" x="64" y="305" width="470" height="58"/>
<text class="label" x="74" y="330">検証のエンジンと protocol</text>
<rect class="box" x="542" y="305" width="230" height="58"/>
<text class="label" x="552" y="330">Core</text>
<rect class="box" x="780" y="305" width="220" height="58"/>
<text class="label" x="790" y="330">Core だけ（実装の言語は契約に</text>
<text class="label" x="790" y="347">出さない）</text>
<rect class="box" x="64" y="369" width="470" height="58"/>
<text class="label" x="74" y="394">Concrete が足した x- の意味の検証と、その依存</text>
<rect class="box" x="542" y="369" width="230" height="58"/>
<text class="label" x="552" y="394">Concrete（文脈）</text>
<rect class="box" x="780" y="369" width="220" height="58"/>
<text class="label" x="790" y="394">その文脈。Core</text>
<text class="label" x="790" y="411">は作法だけを持つ</text>
<rect class="box" x="64" y="433" width="470" height="58"/>
<text class="label" x="74" y="458">変更の記録（理由 ・ 目的の参照 ・ 書いた者の種類 ・ 変更の項目。</text>
<text class="label" x="74" y="475">セッション ID は持たない。形は Abstract の一員）</text>
<rect class="box" x="542" y="433" width="230" height="58"/>
<text class="label" x="552" y="458">文脈</text>
<rect class="box" x="780" y="433" width="220" height="58"/>
<text class="label" x="790" y="458">その文脈。書くのは変更を出した</text>
<text class="label" x="790" y="475">作者か AI の Agent</text>
<rect class="box" x="64" y="497" width="470" height="58"/>
<text class="label" x="74" y="522">ファイルの前後の値 ・ 履歴 ・ 出した者 ・ 時刻 ・ 取り込み ・ 衝突</text>
<rect class="box" x="542" y="497" width="230" height="58"/>
<text class="label" x="552" y="522">外（AI のツール ・ harness ・</text>
<text class="label" x="552" y="539">Git などの変更の仕組み）</text>
<rect class="box" x="780" y="497" width="220" height="58"/>
<text class="label" x="790" y="522">外。基盤は受け取るだけ</text>
<rect class="box" x="64" y="561" width="470" height="75"/>
<text class="label" x="74" y="586">セッションの中身（会話の記録）</text>
<rect class="box" x="542" y="561" width="230" height="75"/>
<text class="label" x="552" y="586">外（手元の AI のツール）</text>
<rect class="box" x="780" y="561" width="220" height="75"/>
<text class="label" x="790" y="586">外。リポジトリに入れず、</text>
<text class="label" x="790" y="603">変更の記録はセッションの id</text>
<text class="label" x="790" y="620">だけを持つ</text>
<rect class="box" x="64" y="642" width="470" height="58"/>
<text class="label" x="74" y="667">セッションを管理する役（ID の発行 ・ 始まりと終わり ・</text>
<text class="label" x="74" y="684">子のセッションへの受け渡し）</text>
<rect class="box" x="542" y="642" width="230" height="58"/>
<text class="label" x="552" y="667">外（harness ・ AI のツール）</text>
<rect class="box" x="780" y="642" width="220" height="58"/>
<text class="label" x="790" y="667">外。Core は参照を受け取るだけ</text>
<rect class="box" x="64" y="706" width="470" height="58"/>
<text class="label" x="74" y="731">手元のセッションの索引（セッションの参照 → 変更の記録の id。形は</text>
<text class="label" x="74" y="748">Abstract の一員）</text>
<rect class="box" x="542" y="706" width="230" height="58"/>
<text class="label" x="552" y="731">作業した人の手元（コミットしな</text>
<text class="label" x="552" y="748">い）</text>
<rect class="box" x="780" y="706" width="220" height="58"/>
<text class="label" x="790" y="731">作業した本人だけ</text>
<rect class="box" x="64" y="770" width="470" height="58"/>
<text class="label" x="74" y="795">関係の索引（instance と x-ref。正本のファイルから作り直せる）</text>
<rect class="box" x="542" y="770" width="230" height="58"/>
<text class="label" x="552" y="795">Core（手元の DB。コミットしな</text>
<text class="label" x="552" y="812">い）</text>
<rect class="box" x="780" y="770" width="220" height="58"/>
<text class="label" x="790" y="795">Core だけ。Concrete</text>
<text class="label" x="790" y="812">は保存の形を宣言しない</text>
<rect class="box" x="64" y="834" width="470" height="75"/>
<text class="label" x="74" y="859">AI の Agent に何を許すか（各 AI ツールの許可）</text>
<rect class="box" x="542" y="834" width="230" height="75"/>
<text class="label" x="552" y="859">各 AI ツールの設定ファイル（</text>
<text class="label" x="552" y="876">Claude Code の</text>
<text class="label" x="552" y="893">.claude/settings.json など）</text>
<rect class="box" x="780" y="834" width="220" height="75"/>
<text class="label" x="790" y="859">外。Core は許可の契約を持たな</text>
<text class="label" x="790" y="876">い</text>
</svg>