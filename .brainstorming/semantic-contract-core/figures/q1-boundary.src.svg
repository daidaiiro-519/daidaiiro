<text class="title" x="26" y="266">4</text>
<rect class="box focus" x="16" y="305" width="40" height="58"/>
<text class="title" x="26" y="330">5</text>
<rect class="box focus" x="16" y="369" width="40" height="58"/>
<text class="title" x="26" y="394">6</text>
<rect class="box focus" x="16" y="433" width="40" height="58"/>
<text class="title" x="26" y="458">7</text>
<rect class="box focus" x="16" y="497" width="40" height="58"/>
<text class="title" x="26" y="522">8</text>
<rect class="box focus" x="16" y="561" width="40" height="75"/>
<text class="title" x="26" y="586">9</text>
