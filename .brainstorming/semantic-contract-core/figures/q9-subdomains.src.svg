<svg viewBox="0 0 956 662" style="min-width:900px" role="img" aria-label="業務領域：中核5 ・ 補完4 ・ 一般2">
<text class="note" x="20" y="22">分類</text>
<text class="note" x="108" y="22">業務領域</text>
<text class="note" x="306" y="22">中身</text>
<text class="note" x="644" y="22">決め手</text>
<rect class="box focus" x="16" y="32" width="80" height="46"/>
<text class="title" x="26" y="59">中核</text>
<rect class="box" x="104" y="32" width="190" height="46"/>
<text class="label" x="114" y="59">意味の宣言</text>
<rect class="box" x="302" y="32" width="330" height="46"/>
<text class="label" x="312" y="51">基盤を変えずに意味と能力を足し、Concrete が</text>
<text class="label" x="312" y="67">Abstract の意味の種類に合うかを決める</text>
<rect class="box" x="640" y="32" width="300" height="46"/>
<text class="label" x="650" y="51">業務ルールと制約条件の記述が要る。作者が担う</text>
<text class="label" x="650" y="67">（検証は CI ・ AI）</text>
<rect class="box focus" x="16" y="84" width="80" height="46"/>
<text class="title" x="26" y="111">中核</text>
<rect class="box" x="104" y="84" width="190" height="46"/>
<text class="label" x="114" y="111">意味の検証</text>
<rect class="box" x="302" y="84" width="330" height="46"/>
<text class="label" x="312" y="103">x- に基づく検証 ・ 参照と導出値の整合 ・語のずれの</text>
<text class="label" x="312" y="119">検出</text>
<rect class="box" x="640" y="84" width="300" height="46"/>
<text class="label" x="650" y="103">ただの検証器が持たない差。複雑な規則と不変条件</text>
<text class="label" x="650" y="119">を持つ</text>
<rect class="box focus" x="16" y="136" width="80" height="62"/>
<text class="title" x="26" y="171">中核</text>
<rect class="box" x="104" y="136" width="190" height="62"/>
<text class="label" x="114" y="171">変更の確かめと例外の判断</text>
<rect class="box" x="302" y="136" width="330" height="62"/>
<text class="label" x="312" y="155">変更後の状態と人が見るものを出し、機械と AI が決め</text>
<text class="label" x="312" y="171">きれなかった rule と人が決める欄を、セッションの中</text>
<text class="label" x="312" y="187">で作業した本人が承認する</text>
<rect class="box" x="640" y="136" width="300" height="62"/>
<text class="label" x="650" y="163">「AI に書かせた成果物を使い続ける」の本体。ア</text>
<text class="label" x="650" y="179">クターとデータが検証と違う</text>
<rect class="box focus" x="16" y="204" width="80" height="46"/>
<text class="title" x="26" y="231">中核</text>
<rect class="box" x="104" y="204" width="190" height="46"/>
<text class="label" x="114" y="231">意味で探す</text>
<rect class="box" x="302" y="204" width="330" height="46"/>
<text class="label" x="312" y="223">語 ・ 参照 ・ rule の結果の意味で探し、必要な部分</text>
<text class="label" x="312" y="239">だけを返す</text>
<rect class="box" x="640" y="204" width="300" height="46"/>
<text class="label" x="650" y="223">この基盤のモデルの意味で探すので、ほかの製品に</text>
<text class="label" x="650" y="239">は無い（利用者の判断）</text>
<rect class="box focus" x="16" y="256" width="80" height="62"/>
<text class="title" x="26" y="291">中核</text>
<rect class="box" x="104" y="256" width="190" height="62"/>
<text class="label" x="114" y="291">目的ごとのセッションの管理</text>
<rect class="box" x="302" y="256" width="330" height="62"/>
<text class="label" x="312" y="275">AI ツールが発行したセッションを、目的 ・ 意図 ・</text>
<text class="label" x="312" y="291">親子 ・ 再開の ID ・ 状態と結びつけ、再開か新規か</text>
<text class="label" x="312" y="307">をデータで決める</text>
<rect class="box" x="640" y="256" width="300" height="62"/>
<text class="label" x="650" y="283">再開か新規かを再現できる形で選ぶ仕組みは既製品</text>
<text class="label" x="650" y="299">に無い。業務ルールのモデリングが要る</text>
<rect class="box focus" x="16" y="324" width="80" height="46"/>
<text class="title" x="26" y="351">補完</text>
<rect class="box" x="104" y="324" width="190" height="46"/>
<text class="label" x="114" y="351">スキーマの保存と公開</text>
<rect class="box" x="302" y="324" width="330" height="46"/>
<text class="label" x="312" y="351">置き場所 ・ 版の番号 ・ 公開の CRUD</text>
<rect class="box" x="640" y="324" width="300" height="46"/>
<text class="label" x="650" y="351">CRUD と公開が中心</text>
<rect class="box focus" x="16" y="376" width="80" height="46"/>
<text class="title" x="26" y="403">補完</text>
<rect class="box" x="104" y="376" width="190" height="46"/>
<text class="label" x="114" y="403">instance の作成と変更</text>
<rect class="box" x="302" y="376" width="330" height="46"/>
<text class="label" x="312" y="403">instance の CRUD</text>
<rect class="box" x="640" y="376" width="300" height="46"/>
<text class="label" x="650" y="403">CRUD が中心</text>
<rect class="box focus" x="16" y="428" width="80" height="62"/>
<text class="title" x="26" y="463">補完</text>
<rect class="box" x="104" y="428" width="190" height="62"/>
<text class="label" x="114" y="463">マイグレーション</text>
<rect class="box" x="302" y="428" width="330" height="62"/>
<text class="label" x="312" y="447">Abstract の新しい版へ Concrete を合わせる（文</text>
<text class="label" x="312" y="463">脈の中の instance は契約の変更にすぐ従い、直すの</text>
<text class="label" x="312" y="479">は U7）</text>
<rect class="box" x="640" y="428" width="300" height="62"/>
<text class="label" x="650" y="455">業務ロジックが育ったら、中核への変化として見直</text>
<text class="label" x="650" y="471">す</text>
<rect class="box focus" x="16" y="496" width="80" height="46"/>
<text class="title" x="26" y="523">補完</text>
<rect class="box" x="104" y="496" width="190" height="46"/>
<text class="label" x="114" y="523">描画</text>
<rect class="box" x="302" y="496" width="330" height="46"/>
<text class="label" x="312" y="523">ビュー ・ デザインシステムの適用</text>
<rect class="box" x="640" y="496" width="300" height="46"/>
<text class="label" x="650" y="523">競争優位を生まない</text>
<rect class="box focus" x="16" y="548" width="80" height="46"/>
<text class="title" x="26" y="575">一般</text>
<rect class="box" x="104" y="548" width="190" height="46"/>
<text class="label" x="114" y="575">AI と外のツールによる判定</text>
<rect class="box" x="302" y="548" width="330" height="46"/>
<text class="label" x="312" y="575">外の AI と外のツールに判定を頼む</text>
<rect class="box" x="640" y="548" width="300" height="46"/>
<text class="label" x="650" y="575">外の AI ・ ツールを使う</text>
<rect class="box focus" x="16" y="600" width="80" height="46"/>
<text class="title" x="26" y="627">一般</text>
<rect class="box" x="104" y="600" width="190" height="46"/>
<text class="label" x="114" y="627">保存と版の管理</text>
<rect class="box" x="302" y="600" width="330" height="46"/>
<text class="label" x="312" y="627">ファイル ・ git</text>
<rect class="box" x="640" y="600" width="300" height="46"/>
<text class="label" x="650" y="627">既にある道具を使う</text>
</svg>
