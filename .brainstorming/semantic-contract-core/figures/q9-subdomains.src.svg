<svg viewBox="0 0 956 576" style="min-width:900px" role="img" aria-label="業務領域：中核4 ・ 補完4 ・ 一般2">
<text class="note" x="20" y="22">分類</text>
<text class="note" x="108" y="22">業務領域</text>
<text class="note" x="306" y="22">中身</text>
<text class="note" x="644" y="22">決め手</text>
<rect class="box focus" x="16" y="32" width="80" height="46"/>
<text class="title" x="26" y="60">中核</text>
<rect class="box" x="104" y="32" width="190" height="46"/>
<text class="label" x="114" y="60">意味の宣言</text>
<rect class="box" x="302" y="32" width="330" height="46"/>
<text class="label" x="312" y="51">基盤を変えずに意味と能力を足し、Concrete が</text>
<text class="label" x="312" y="67">Abstract の意味の種類に合うかを決める</text>
<rect class="box" x="640" y="32" width="300" height="46"/>
<text class="label" x="650" y="51">業務ルールと制約条件の記述が要る。</text>
<text class="label" x="650" y="67">作者が担う（検証は CI ・ AI）</text>
<rect class="box focus" x="16" y="84" width="80" height="46"/>
<text class="title" x="26" y="112">中核</text>
<rect class="box" x="104" y="84" width="190" height="46"/>
<text class="label" x="114" y="112">意味の検証</text>
<rect class="box" x="302" y="84" width="330" height="46"/>
<text class="label" x="312" y="103">x- に基づく検証 ・ 参照と導出値の整合 ・</text>
<text class="label" x="312" y="119">語のずれの検出</text>
<rect class="box" x="640" y="84" width="300" height="46"/>
<text class="label" x="650" y="103">ただの検証器が持たない差。</text>
<text class="label" x="650" y="119">複雑な規則と不変条件を持つ</text>
<rect class="box focus" x="16" y="136" width="80" height="46"/>
<text class="title" x="26" y="164">中核</text>
<rect class="box" x="104" y="136" width="190" height="46"/>
<text class="label" x="114" y="164">変更の確かめと例外の判断</text>
<rect class="box" x="302" y="136" width="330" height="46"/>
<text class="label" x="312" y="155">変更後の状態と人が見るものを出し、</text>
<text class="label" x="312" y="171">判定できなかった rule を人が判断する</text>
<rect class="box" x="640" y="136" width="300" height="46"/>
<text class="label" x="650" y="155">U0 の「使い続ける」の本体。</text>
<text class="label" x="650" y="171">アクターとデータが検証と違う</text>
<rect class="box focus" x="16" y="188" width="80" height="46"/>
<text class="title" x="26" y="216">中核</text>
<rect class="box" x="104" y="188" width="190" height="46"/>
<text class="label" x="114" y="216">意味で探す</text>
<rect class="box" x="302" y="188" width="330" height="46"/>
<text class="label" x="312" y="207">語 ・ 参照 ・ rule の結果の意味で探し、</text>
<text class="label" x="312" y="223">必要な部分だけを返す</text>
<rect class="box" x="640" y="188" width="300" height="46"/>
<text class="label" x="650" y="207">この基盤のモデルの意味で探すので、</text>
<text class="label" x="650" y="223">ほかの製品には無い（利用者の判断）</text>
<rect class="box focus" x="16" y="240" width="80" height="46"/>
<text class="title" x="26" y="268">補完</text>
<rect class="box" x="104" y="240" width="190" height="46"/>
<text class="label" x="114" y="268">スキーマの保存と公開</text>
<rect class="box" x="302" y="240" width="330" height="46"/>
<text class="label" x="312" y="268">置き場所 ・ 版の番号 ・ 公開の CRUD</text>
<rect class="box" x="640" y="240" width="300" height="46"/>
<text class="label" x="650" y="268">CRUD と公開が中心</text>
<rect class="box focus" x="16" y="292" width="80" height="46"/>
<text class="title" x="26" y="320">補完</text>
<rect class="box" x="104" y="292" width="190" height="46"/>
<text class="label" x="114" y="320">instance の作成と変更</text>
<rect class="box" x="302" y="292" width="330" height="46"/>
<text class="label" x="312" y="320">instance の CRUD</text>
<rect class="box" x="640" y="292" width="300" height="46"/>
<text class="label" x="650" y="320">CRUD が中心</text>
<rect class="box focus" x="16" y="344" width="80" height="62"/>
<text class="title" x="26" y="372">補完</text>
<rect class="box" x="104" y="344" width="190" height="62"/>
<text class="label" x="114" y="372">マイグレーション</text>
<rect class="box" x="302" y="344" width="330" height="62"/>
<text class="label" x="312" y="363">Abstract の新しい版へ Concrete を合わせる</text>
<text class="label" x="312" y="379">（文脈の中の instance は契約の変更にすぐ従い、</text>
<text class="label" x="312" y="395">直すのは U7）</text>
<rect class="box" x="640" y="344" width="300" height="62"/>
<text class="label" x="650" y="363">業務ロジックが育ったら、</text>
<text class="label" x="650" y="379">中核への変化として見直す</text>
<rect class="box focus" x="16" y="412" width="80" height="46"/>
<text class="title" x="26" y="440">補完</text>
<rect class="box" x="104" y="412" width="190" height="46"/>
<text class="label" x="114" y="440">描画</text>
<rect class="box" x="302" y="412" width="330" height="46"/>
<text class="label" x="312" y="440">ビュー ・ デザインシステムの適用</text>
<rect class="box" x="640" y="412" width="300" height="46"/>
<text class="label" x="650" y="440">競争優位を生まない</text>
<rect class="box focus" x="16" y="464" width="80" height="46"/>
<text class="title" x="26" y="492">一般</text>
<rect class="box" x="104" y="464" width="190" height="46"/>
<text class="label" x="114" y="492">AI と外のツールによる判定</text>
<rect class="box" x="302" y="464" width="330" height="46"/>
<text class="label" x="312" y="492">外の AI と外のツールに判定を頼む</text>
<rect class="box" x="640" y="464" width="300" height="46"/>
<text class="label" x="650" y="492">外の AI ・ ツールを使う</text>
<rect class="box focus" x="16" y="516" width="80" height="46"/>
<text class="title" x="26" y="544">一般</text>
<rect class="box" x="104" y="516" width="190" height="46"/>
<text class="label" x="114" y="544">保存と版の管理</text>
<rect class="box" x="302" y="516" width="330" height="46"/>
<text class="label" x="312" y="544">ファイル ・ git</text>
<rect class="box" x="640" y="516" width="300" height="46"/>
<text class="label" x="650" y="544">既にある道具を使う</text>
</svg>