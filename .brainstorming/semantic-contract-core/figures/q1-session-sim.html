<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--page:#eef1ef;--block:#f8faf9;--head:#dfe7e4;--control:#eef1ef;--answer:#d5e6e3;--notice:#f8f3e8;--done:#e3f1df;--removed:#f6e0df;--literal:#eef1ef;--text:#111d1a;--sub:#3c4a46;--key:#0d5c55;--onkey:#f8faf9;--warn:#8f5410;--textdone:#2f6528;--textremoved:#a3262a;--line:#ccd8d4;--linectl:#5b6b66;--linenotice:#d9b77e;--linedone:#3e7b36;--source:#7a3b6d}
@media (prefers-color-scheme:dark){:root{--page:#0e1614;--block:#16211e;--head:#22302d;--control:#22302d;--answer:#173330;--notice:#241d14;--done:#1c2b19;--removed:#3a1c1d;--literal:#0e1614;--text:#e6eeeb;--sub:#c2cec9;--key:#6cc9b8;--onkey:#16211e;--warn:#d9a35f;--textdone:#a6d69b;--textremoved:#f0a3a0;--line:#2a3936;--linectl:#93a29d;--linenotice:#6e5738;--linedone:#86c27a;--source:#d094c2}}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px;background:var(--page);color:var(--text);font:14px/1.7 "Zen Kaku Gothic New", system-ui, sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--linectl);background:var(--control);color:var(--text);border-radius:6px;padding:4px 14px}
button.key{background:var(--key);color:var(--onkey);border-color:var(--key)}
button:disabled{opacity:.4;cursor:default}
.lead{background:var(--block);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:4px}
.dots span{width:22px;height:6px;border-radius:3px;background:var(--head);border:1px solid var(--line)}
.dots span.on{background:var(--key);border-color:var(--key)}
.story{background:var(--answer);border:1px solid var(--key);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.story .n{font-size:12px;color:var(--sub)}
.story .t{font-size:16px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.col{background:var(--block);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.col h4{margin:0 0 2px;font-size:14px}
.col .sub{font-size:12px;color:var(--sub);margin-bottom:6px}
.f{border:1px solid var(--line);background:var(--literal);border-radius:6px;padding:4px 8px;margin:4px 0;font-size:12px;overflow-x:auto}
.f.new{outline:2px solid var(--key)}
.f .p{font-weight:700}
.sid{white-space:nowrap;background:var(--notice);color:var(--warn);border:1px solid var(--linenotice);border-radius:10px;padding:0 6px;font-size:11px}
.tag{border:1px solid var(--line);background:var(--head);border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
.none{color:var(--sub);font-size:13px}
.view{background:var(--block);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.view h4{margin:0 0 6px;font-size:14px}
.ex{border:1px solid var(--textremoved);background:var(--removed);color:var(--textremoved);border-radius:6px;padding:4px 8px;margin:4px 0;font-size:13px}
.why{background:var(--block);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px;margin-top:4px}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
th{background:var(--head)}
code{font-family:"JetBrains Mono",monospace;font-size:11px}
.note{color:var(--sub);font-size:12px}
</style></head><body>
<div class="lead">記事を書く Skill を例に、<b>1つのセッション（と子のセッション）で変えたものに同じセッション ID が付き、それは手元の索引だけに残り、コミットにはセッション ID の無い記録が入る</b>流れを見る。「次へ」で1場面ずつ進む。<span class="sid">s-7f3a</span> の印は、セッション ID を持つデータ。</div>
<div class="nav"><button id="prev">前へ</button><button id="next" class="key">次へ</button><div class="dots" id="dots"></div><button id="again">はじめから</button></div>
<div class="story"><div class="n" id="no"></div><div class="t" id="title"></div><div id="detail"></div></div>
<div class="grid">
 <div class="col"><h4>手元（gitignore。コミットしない）</h4><div class="sub">手元のセッションの索引（SQLite 1ファイル）── セッション ID を持つのはここだけ</div><div id="local"></div></div>
 <div class="col"><h4>リポジトリ（コミットする）</h4><div class="sub">中身の変更と、セッション ID の無い変更の記録（JSON 1件1ファイル）</div><div id="repo"></div></div>
</div>
<div class="view" id="viewbox"><h4 id="vh"></h4><div id="view"></div></div>
<div class="why" id="why"></div>
<script>
const $=s=>document.querySelector(s);
const idx=rows=>'<div class="f"><span class="p">sessions.sqlite</span><span class="tag">手元の索引</span><div class="tw"><table><tr><th>セッション ID</th><th>根から親までの id</th><th>変更の記録の id</th></tr>'+(rows.length?rows.map(r=>'<tr><td><span class="sid">'+r[0]+'</span></td><td>'+(r[1]||'（根）')+'</td><td>'+r[2]+'</td></tr>').join(''):'<tr><td colspan="3">まだ無い</td></tr>')+'</table></div></div>';
const rec=(id,reason,who,items,st)=>'<div class="f"><span class="p">.changes/'+id+'.json</span><span class="tag">'+st+'</span><br>意図：'+reason+'<br>目的の参照：ACDR-0201 ／ 書いた者の種類：'+who+'<br>項目：'+items.map(i=>'<code>'+i+'</code>').join(' ・ ')+'</div>';
const file=(path,what,st)=>'<div class="f"><span class="p">'+path+'</span><span class="tag">'+st+'</span><br>'+what+'</div>';
const r1=st=>rec('9b1e7c40','価格改定を反映する（5% → 8%）','AI の Agent',['記事2 /本文'],st);
const r2=st=>rec('d04a2e91','本文の改定に要約を合わせる','AI の Agent',['記事2 /要約'],st);
const r3=st=>rec('51f7b0c3','改定の告知を足す','AI の Agent',['記事3 /本文'],st);
const I1=[['s-7f3a','','9b1e7c40']],I2=I1.concat([['s-91c2','s-7f3a','d04a2e91'],['s-91c2','s-7f3a','51f7b0c3']]);
const U='変更あり（未コミット）';
const STEPS=[
 {t:'セッションが始まる',d:'AI のツール（または harness）がセッションを始め、セッション ID s-7f3a を決める。Core は ID を発行しない。',
  local:[idx([])],repo:[],vh:'',view:'',
  why:'セッションを管理する役（ID の発行 ・ 始まりと終わり ・ 子への受け渡し）は外が持つ。Core は、書き込みのたびに参照を受け取るだけ。'},
 {t:'AI が記事2の本文を変える',d:'目的は ACDR-0201（価格改定）。AI は instance を書くときに、セッションの参照 s-7f3a と意図と目的の参照を一緒に渡す。',
  local:[idx(I1)],repo:[file('articles/記事2.json','/本文：5% → 8%',U),r1(U)],vh:'',view:'',
  why:'Core は、変更の記録をその場でセッション ID の無い形で作業ツリーに置き、id（9b1e7c40）をここで1回だけ決める。セッション ID は手元の索引にだけ書く。'},
 {t:'子のセッションが要約と告知を直す',d:'Agent が子のセッション s-91c2 に任せ、記事2の要約と記事3の本文を直させた。子のセッションには、外の役が親の id を渡す。',
  local:[idx(I2)],repo:[file('articles/記事2.json','/本文 ・ /要約',U),file('articles/記事3.json','/本文：告知を足す',U),r1(U),r2(U),r3(U)],vh:'',view:'',
  why:'子の索引には、子の ID s-91c2 と、根から親までの id（s-7f3a）が付く。親の id で引けば、子の変更も出る。'},
 {t:'開発者が「このセッションで何を変えたか」を見る',d:'開発者が s-7f3a で引く。',
  local:[idx(I2)],repo:[file('articles/記事2.json','/本文 ・ /要約',U),file('articles/記事3.json','/本文：告知を足す',U),r1(U),r2(U),r3(U)],
  vh:'手元で s-7f3a を引いた結果（子のセッションを含む）',view:'<div class="tw"><table><tr><th>セッション</th><th>対象 ・ 欄</th><th>意図</th></tr><tr><td>s-7f3a</td><td>記事2 /本文</td><td>価格改定を反映する（5% → 8%）</td></tr><tr><td>s-91c2（子）</td><td>記事2 /要約</td><td>本文の改定に要約を合わせる</td></tr><tr><td>s-91c2（子）</td><td>記事3 /本文</td><td>改定の告知を足す</td></tr></table></div><p class="note">手元の索引（SQLite）で記録の id を引き、意図は作業ツリーの記録から読む。セッションで引けるのは、索引を持つ本人だけ。</p>',
  why:'索引は SQLite の1ファイルで、すべての worktree から読める場所に置く。記録のファイルが増えても、セッションで引くのは索引の1回で済む。'},
 {t:'誰かが記事1を直接書き換える',d:'基盤を通らずに、エディタで記事1のタイトルが書き換えられた。',
  local:[idx(I2)],repo:[file('articles/記事1.json','/タイトル',U),file('articles/記事2.json','/本文 ・ /要約',U),file('articles/記事3.json','/本文：告知を足す',U),r1(U),r2(U),r3(U)],vh:'',view:'',
  why:'基盤を通っていないので、記録も索引の行も無い。記録と実際の差分を突き合わせたときに見つかる。'},
 {t:'コミットする',d:'ふつうに git commit する。コミットのときに作り直す手順は無い。',
  local:[idx(I2)],
  repo:[file('articles/記事1.json','/タイトル','コミット'),file('articles/記事2.json','/本文 ・ /要約','コミット'),file('articles/記事3.json','/本文','コミット'),r1('コミット'),r2('コミット'),r3('コミット')],
  vh:'検証のときに出る例外',view:'<div class="ex">記録に無い：記事1 /タイトル（基盤を通らない書き換え）</div><p class="note">コミットの中身：記事3件 ＋ .changes/ の記録3件。sessions.sqlite は入らない。記録の id は書いた時のまま（9b1e7c40 など）なので、手元の索引からたどれる。hook を入れていない clone や rebase ・ squash でも、記録は変わらない。</p>',
  why:'コミットに入る記録は、書いた時からセッション ID を持たない。誰が出したか ・ いつかは Git が持つ。'},
 {t:'レビューする人が PR で見る',d:'別の人が、目的 ACDR-0201 で変更をまとめて見る。harness は、この出力を PR に載せる。',
  local:[],repo:[],vh:'目的 ACDR-0201 で組み立てたまとまり（レビューする人の画面）',
  view:'<div class="ex">例外 1件：記録に無い ── 記事1 /タイトル</div><div class="tw"><table><tr><th>対象</th><th>欄</th><th>意図</th><th>意図と変更が合っているか（CI で判定）</th><th>変更後の検証</th></tr><tr><td>記事2</td><td>/本文</td><td>価格改定を反映する（5% → 8%）</td><td>verified</td><td>検証済み</td></tr><tr><td>記事2</td><td>/要約</td><td>本文の改定に要約を合わせる</td><td>verified</td><td>検証済み</td></tr><tr><td>記事3</td><td>/本文</td><td>改定の告知を足す</td><td>verified</td><td>検証済み</td></tr></table></div><p class="note">見ていないもの：ソースコード ・ テストのコード。セッション ID は出ない（レビューする人の手元には索引が無い）。</p>',
  why:'レビューする人はファイルの差分を1つずつ開かず、例外1件と3行の意図を見て判断する。意図と変更が合っているかは、CI とレビューの側で毎回判定する。'},
 {t:'あとから監査する人が記事2の経緯を見る',d:'数か月後、別の人が「記事2はなぜ今の本文なのか」を記事2で引く。',
  local:[],repo:[],vh:'記事2で引いた経緯（コミットされた記録から）',
  view:'<div class="tw"><table><tr><th>欄</th><th>意図</th><th>目的</th><th>書いた者の種類</th><th>いつ ・ 誰が出したか（Git から）</th></tr><tr><td>/本文</td><td>価格改定を反映する（5% → 8%）</td><td>ACDR-0201</td><td>AI の Agent</td><td>コミットの時刻と出した者</td></tr><tr><td>/要約</td><td>本文の改定に要約を合わせる</td><td>ACDR-0201</td><td>AI の Agent</td><td>コミットの時刻と出した者</td></tr></table></div><p class="note">セッションでは引けない（セッション ID はコミットされていない）。</p>',
  why:'経緯（U13）は、コミットされた記録を対象 ・ 目的で引く。セッションで引くのは、作業した本人の手元だけ。'},
];
let step=-1;
function render(){$('#dots').innerHTML=STEPS.map((_,i)=>'<span class="'+(i<=step?'on':'')+'"></span>').join('');
 $('#prev').disabled=step<0;$('#next').disabled=step>=STEPS.length-1;
 if(step<0){$('#no').textContent='はじめに';$('#title').textContent='価格改定（ACDR-0201）を記事に反映する作業';$('#detail').textContent='AI の Agent が、子のセッションも使いながら記事を直し、最後にコミットして PR を出す。';
  $('#local').innerHTML=$('#repo').innerHTML='<div class="none">まだ何も無い</div>';$('#viewbox').style.display='none';$('#why').textContent='左が手元だけに残るもの、右がコミットされて共有されるもの。';return;}
 const s=STEPS[step];$('#no').textContent='場面 '+(step+1)+' / '+STEPS.length;$('#title').textContent=s.t;$('#detail').textContent=s.d;
 const keep=step>=6?'<div class="none">（ほかの人の画面なので、書いた人の手元は見えない）</div>':'';
 $('#local').innerHTML=s.local.length?s.local.join(''):keep||'<div class="none">無い</div>';
 $('#repo').innerHTML=s.repo.length?s.repo.join(''):(step>=6?'<div class="none">前の場面でコミットしたもの（記事3件 ＋ .changes/ の記録3件）</div>':'<div class="none">変更なし</div>');
 $('#viewbox').style.display=s.vh?'':'none';$('#vh').textContent=s.vh;$('#view').innerHTML=s.view;$('#why').textContent=s.why;}
$('#next').onclick=()=>{step++;render();};$('#prev').onclick=()=>{step--;render();};$('#again').onclick=()=>{step=-1;render();};
render();
</script></body></html>
