<text class="label" x="282" y="307">（read ・ write）</text>
<rect class="box" x="480" y="265" width="150" height="48"/>
<text class="label" x="490" y="290">値オブジェクト</text>
<rect class="box" x="638" y="265" width="300" height="48"/>
<text class="label" x="648" y="290">Concrete を照らす（形）。Semantic Schema</text>
<text class="label" x="648" y="307">Validator が write のルールで検証する</text>
<rect class="box focus" x="16" y="319" width="150" height="48"/>
<text class="title" x="26" y="344">（write の中）</text>
<rect class="box" x="174" y="319" width="90" height="48"/>
<text class="label" x="184" y="344">x-prompt</text>
<rect class="box" x="272" y="319" width="200" height="48"/>
<text class="label" x="282" y="344">ルール（rule）</text>
<rect class="box" x="480" y="319" width="150" height="48"/>
<text class="label" x="490" y="344">エンティティ（id で</text>
<text class="label" x="490" y="361">引く）</text>
<rect class="box" x="638" y="319" width="300" height="48"/>
<text class="label" x="648" y="344">Semantic Schema Validator（判定する者ご</text>
<text class="label" x="648" y="361">とに機械 ・ AI ・ 人へ）</text>
<rect class="box focus" x="16" y="373" width="150" height="48"/>
<text class="title" x="26" y="398">x-relationship</text>
<rect class="box" x="174" y="373" width="90" height="48"/>
<text class="label" x="184" y="398">欄</text>
<rect class="box" x="272" y="373" width="200" height="48"/>
<text class="label" x="282" y="398">参照</text>
<rect class="box" x="480" y="373" width="150" height="48"/>
<text class="label" x="490" y="398">値オブジェクト</text>
<rect class="box" x="638" y="373" width="300" height="48"/>
<text class="label" x="648" y="398">Semantic Schema Resolver が指す先を解決</text>
<text class="label" x="648" y="415">し、Validator が無ければ違反にする</text>
<rect class="box focus" x="16" y="427" width="150" height="48"/>
<text class="title" x="26" y="452">x-derived-from</text>
<rect class="box" x="174" y="427" width="90" height="48"/>
<text class="label" x="184" y="452">欄</text>
<rect class="box" x="272" y="427" width="200" height="48"/>
<text class="label" x="282" y="452">導出</text>
<rect class="box" x="480" y="427" width="150" height="48"/>
<text class="label" x="490" y="452">値オブジェクト</text>
<rect class="box" x="638" y="427" width="300" height="48"/>
<text class="label" x="648" y="452">Resolver が値を導き、Validator が宣言値と</text>
<text class="label" x="648" y="469">合うかを見る</text>
<rect class="box focus" x="16" y="481" width="150" height="48"/>
<text class="title" x="26" y="506">x-decided-by</text>
<rect class="box" x="174" y="481" width="90" height="48"/>
<text class="label" x="184" y="506">欄</text>
<rect class="box" x="272" y="481" width="200" height="48"/>
<text class="label" x="282" y="506">決定権</text>
<rect class="box" x="480" y="481" width="150" height="48"/>
<text class="label" x="490" y="506">値オブジェクト</text>
<rect class="box" x="638" y="481" width="300" height="48"/>
<text class="label" x="648" y="506">Validator と人の入口（値が人の入口から来た</text>
<text class="label" x="648" y="523">か）</text>
<rect class="box focus" x="16" y="535" width="150" height="40"/>
<text class="title" x="26" y="560">x-published</text>
<rect class="box" x="174" y="535" width="90" height="40"/>
<text class="label" x="184" y="560">欄</text>
<rect class="box" x="272" y="535" width="200" height="40"/>
<text class="label" x="282" y="560">公開の印</text>
<rect class="box" x="480" y="535" width="150" height="40"/>
<text class="label" x="490" y="560">値オブジェクト</text>
<rect class="box" x="638" y="535" width="300" height="40"/>
<text class="label" x="648" y="560">公開された言葉の版を出す（公開する部分を組む）</text>
</svg>
