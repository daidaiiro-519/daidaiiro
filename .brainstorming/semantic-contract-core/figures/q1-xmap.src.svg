<rect class="box" x="174" y="32" width="90" height="48"/>
<text class="label" x="184" y="57">根</text>
<rect class="box" x="272" y="32" width="200" height="48"/>
<text class="label" x="282" y="57">置き場所の型</text>
<rect class="box" x="480" y="32" width="150" height="48"/>
<text class="label" x="490" y="57">値オブジェクト</text>
<rect class="box" x="638" y="32" width="300" height="48"/>
<text class="label" x="648" y="57">Concrete を照らす（形）。作成と取り込むが使</text>
<text class="label" x="648" y="74">う</text>
<rect class="box focus" x="16" y="86" width="150" height="48"/>
<text class="title" x="26" y="111">x-instance-label</text>
<rect class="box" x="174" y="86" width="90" height="48"/>
<text class="label" x="184" y="111">根</text>
<rect class="box" x="272" y="86" width="200" height="48"/>
<text class="label" x="282" y="111">名前の型</text>
<rect class="box" x="480" y="86" width="150" height="48"/>
<text class="label" x="490" y="111">値オブジェクト</text>
<rect class="box" x="638" y="86" width="300" height="48"/>
<text class="label" x="648" y="111">Concrete を照らす（欄が在るか）。Renderer</text>
<text class="label" x="648" y="128">と変更を見せるが使う</text>
