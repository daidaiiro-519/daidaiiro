<text class="label" x="648" y="486">合うかを見る</text>
<rect class="box focus" x="16" y="498" width="150" height="48"/>
<text class="title" x="26" y="523">x-decided-by</text>
<rect class="box" x="174" y="498" width="90" height="48"/>
<text class="label" x="184" y="523">欄</text>
<rect class="box" x="272" y="498" width="200" height="48"/>
<text class="label" x="282" y="523">決定権</text>
<rect class="box" x="480" y="498" width="150" height="48"/>
<text class="label" x="490" y="523">値オブジェクト</text>
<rect class="box" x="638" y="498" width="300" height="48"/>
