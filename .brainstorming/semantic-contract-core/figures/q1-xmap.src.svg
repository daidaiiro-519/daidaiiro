<rect class="box" x="174" y="390" width="90" height="48"/>
<text class="label" x="184" y="415">欄</text>
<rect class="box" x="272" y="390" width="200" height="48"/>
<text class="label" x="282" y="415">参照</text>
<rect class="box" x="480" y="390" width="150" height="48"/>
<text class="label" x="490" y="415">値オブジェクト</text>
<rect class="box" x="638" y="390" width="300" height="48"/>
