<svg viewBox="0 0 954 591" style="min-width:900px" role="img" aria-label="x- の9つと、ドメインのオブジェクトと、検証する担い手の対応">
<text class="note" x="20" y="22">x-</text>
<text class="note" x="178" y="22">書く場所</text>
