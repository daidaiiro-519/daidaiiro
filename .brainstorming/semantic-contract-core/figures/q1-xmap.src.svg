<text class="title" x="26" y="165">x-delegates</text>
<rect class="box" x="174" y="140" width="90" height="65"/>
<text class="label" x="184" y="165">根</text>
<rect class="box" x="272" y="140" width="200" height="65"/>
<text class="label" x="282" y="165">任せる先</text>
<rect class="box" x="480" y="140" width="150" height="65"/>
<text class="label" x="490" y="165">エンティティ（名前で</text>
<text class="label" x="490" y="182">引く）</text>
<rect class="box" x="638" y="140" width="300" height="65"/>
<text class="label" x="648" y="165">Concrete を照らす（Concrete の URN が在</text>
<text class="label" x="648" y="182">るか）。Validator が ルールの agent から</text>
<text class="label" x="648" y="199">引く</text>
<rect class="box focus" x="16" y="211" width="150" height="48"/>
<text class="title" x="26" y="236">x-extensions</text>
<rect class="box" x="174" y="211" width="90" height="48"/>
<text class="label" x="184" y="236">根</text>
<rect class="box" x="272" y="211" width="200" height="48"/>
<text class="label" x="282" y="236">拡張した x- の定義</text>
<rect class="box" x="480" y="211" width="150" height="48"/>
<text class="label" x="490" y="236">値オブジェクト</text>
<rect class="box" x="638" y="211" width="300" height="48"/>
<text class="label" x="648" y="236">Concrete を照らす（作法と、Abstract の拡</text>
<text class="label" x="648" y="253">張項目との衝突）</text>
<rect class="box focus" x="16" y="265" width="150" height="48"/>
<text class="title" x="26" y="290">x-prompt</text>
<rect class="box" x="174" y="265" width="90" height="48"/>
<text class="label" x="184" y="290">根と欄</text>
<rect class="box" x="272" y="265" width="200" height="48"/>
