<rect class="box focus" x="16" y="552" width="150" height="40"/>
<text class="title" x="26" y="577">x-published</text>
<rect class="box" x="174" y="552" width="90" height="40"/>
<text class="label" x="184" y="577">欄</text>
<rect class="box" x="272" y="552" width="200" height="40"/>
<text class="label" x="282" y="577">公開の印</text>
<rect class="box" x="480" y="552" width="150" height="40"/>
<text class="label" x="490" y="577">値オブジェクト</text>
<rect class="box" x="638" y="552" width="300" height="40"/>
<text class="label" x="648" y="577">公開された言葉の版を出す（公開する部分を組む）</text>
