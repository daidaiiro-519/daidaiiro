<svg viewBox="0 0 900 452" style="min-width:760px" role="img" aria-label="Semantic Abstract Schema から Semantic Concrete Schema、Concrete から instance への3段">
<text class="note" x="20" y="22">段と持ち主</text><text class="note" x="356" y="22">何を決めるか（brainstorming のボードの例）</text>
<rect class="box focus" x="20" y="32" width="320" height="96"/>
<text class="title" x="34" y="56">① Semantic Abstract Schema</text>
<text class="label" x="34" y="78">urn:semantic-schema-core:core:</text>
<text class="label" x="34" y="96">semantic-abstract-schema:v1</text>
<text class="note" x="34" y="116">Core が持つ</text>
<rect class="box" x="356" y="32" width="524" height="96"/>
<text class="label" x="370" y="56">スキーマが守ること</text>
<text class="note" x="370" y="78">根に title と description を書く ・ 欄ごとに description と x-prompt を書く</text>
<text class="note" x="370" y="96">データを指す欄は x-relationship で書く</text>
<path class="flow" d="M180,130 V168"/>
<text class="note" x="192" y="154">Scaffold で雛形を作り、$schema で指して従う</text>
<rect class="box focus" x="20" y="172" width="320" height="96"/>
<text class="title" x="34" y="196">② Semantic Concrete Schema</text>
<text class="label" x="34" y="218">urn:semantic-schema-core:</text>
<text class="label" x="34" y="236">brainstorming:board:v1</text>
<text class="note" x="34" y="256">Skill ・ Agent が持つ</text>
<rect class="box" x="356" y="172" width="524" height="96"/>
<text class="label" x="370" y="196">データが守ること</text>
<text class="note" x="370" y="218">ボードは topics を持ち、論点は id ・ question ・ answer を持つ</text>
<text class="note" x="370" y="236">depends は topics の id を指す（x-relationship）</text>
<path class="flow" d="M180,270 V308"/>
<text class="note" x="192" y="294">Scaffold で雛形を作り、$schema で指して従う</text>
<rect class="box focus" x="20" y="312" width="320" height="96"/>
<text class="title" x="34" y="336">③ instance</text>
<text class="label" x="34" y="358">.brainstorming/</text>
<text class="label" x="34" y="376">semantic-contract-core.json</text>
<text class="note" x="34" y="396">文脈がコミットする</text>
<rect class="box" x="356" y="312" width="524" height="96"/>
<text class="label" x="370" y="336">実際の値</text>
<text class="note" x="370" y="358">Q6 の question は「Semantic Abstract Schema を…」</text>
<text class="note" x="20" y="436">②は③から見ればスキーマで、①から見れば①に従う1件のデータである（Concrete は Abstract の instance でもある）</text>
</svg>
