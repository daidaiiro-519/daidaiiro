<text class="label" x="174" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">誰が承認 ・ 確かめるか</text>
<rect class="box" x="422" y="220" width="520" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="432" y="245" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">チームのやり方とホスティング（CODEOWNERS ・ レビューの設定）に任せる</text>
<rect class="box" x="164" y="267" width="250" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="174" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">担当 ・ 代わり ・ 期限 ・ 受信箱</text>
<rect class="box" x="422" y="267" width="520" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="432" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">PR のレビュー依頼と通知に任せる</text>
<rect class="box" x="164" y="314" width="250" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="174" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ファイルの併合</text>
<rect class="box" x="422" y="314" width="520" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="432" y="339" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Git に任せる。基盤は併合したあとの中身を検証する</text>
</svg>