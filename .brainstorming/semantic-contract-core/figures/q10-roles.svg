<text class="label" x="432" y="151" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">差分 ・ 理由 ・ 検証の結果 ・ 人が見るもの</text>
<rect class="box" x="164" y="173" width="250" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="174" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">確かめたことの結び付け</text>
<rect class="box" x="422" y="173" width="520" height="41" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="432" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">人が PR で確かめたことを、そのときの中身のハッシュに結び付ける</text>
