<svg viewBox="0 0 1004 1241" style="min-width:900px" role="img" aria-label="エンジンの能力：種類ごとに固めた表">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">種類</text>
<text class="note" x="206" y="22">能力</text>
<text class="note" x="404" y="22">何をするか</text>
<text class="note" x="882" y="22">場面</text>
<rect class="box focus" x="64" y="32" width="130" height="314"/>
<text class="title" x="74" y="57">集約の操作</text>
<rect class="box focus" x="64" y="352" width="130" height="297"/>
<text class="title" x="74" y="377">command</text>
<rect class="box focus" x="64" y="655" width="130" height="314"/>
<text class="title" x="74" y="680">ドメインサービス</text>
<rect class="box focus" x="64" y="975" width="130" height="122"/>
<text class="title" x="74" y="1000">query</text>
<rect class="box focus" x="64" y="1103" width="130" height="122"/>
<text class="title" x="74" y="1128">腐敗防止層</text>
<rect class="box" x="16" y="32" width="40" height="75"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="202" y="32" width="190" height="75"/>
<text class="label" x="212" y="57">版 ・ 割り当てを書く</text>
<rect class="box" x="400" y="32" width="470" height="75"/>
<text class="label" x="410" y="57">Concrete の下書きの版に rule ・ term ・ 読む欄 ・ 判定する者 ・</text>
<text class="label" x="410" y="74">変えてよい範囲 ・ 移し方を書き、validator</text>
<text class="label" x="410" y="91">の割り当てと抜き取りの割合を書く</text>
<rect class="box" x="878" y="32" width="110" height="75"/>
<text class="label" x="888" y="57">U1 ・ U2 ・</text>
<text class="label" x="888" y="74">U14</text>
<rect class="box" x="16" y="113" width="40" height="58"/>
<text class="label" x="26" y="138">2</text>
<rect class="box" x="202" y="113" width="190" height="58"/>
<text class="label" x="212" y="138">承認する ・ 差し戻す</text>
<rect class="box" x="400" y="113" width="470" height="58"/>
<text class="label" x="410" y="138">人の操作の入口だけから、依頼の時点のハッシュと一致する版 ・</text>
<text class="label" x="410" y="155">割り当てを公開にするか、下書きへ戻す</text>
<rect class="box" x="878" y="113" width="110" height="58"/>
<text class="label" x="888" y="138">U9</text>
<rect class="box" x="16" y="177" width="40" height="41"/>
<text class="label" x="26" y="202">3</text>
<rect class="box" x="202" y="177" width="190" height="41"/>
<text class="label" x="212" y="202">引退させる</text>
<rect class="box" x="400" y="177" width="470" height="41"/>
<text class="label" x="410" y="202">従う instance の無い版を引退にする</text>
<rect class="box" x="878" y="177" width="110" height="41"/>
<text class="label" x="888" y="202">U2 ・ U11</text>
<rect class="box" x="16" y="224" width="40" height="58"/>
<text class="label" x="26" y="249">4</text>
<rect class="box" x="202" y="224" width="190" height="58"/>
<text class="label" x="212" y="249">instance を作る ・</text>
<text class="label" x="212" y="266">変える</text>
<rect class="box" x="400" y="224" width="470" height="58"/>
<text class="label" x="410" y="249">変えてよい範囲の中で書き、ハッシュが一致するときだけ保存する</text>
<rect class="box" x="878" y="224" width="110" height="58"/>
<text class="label" x="888" y="249">U5 ・ U6</text>
<rect class="box" x="16" y="288" width="40" height="58"/>
<text class="label" x="26" y="313">5</text>
<rect class="box" x="202" y="288" width="190" height="58"/>
<text class="label" x="212" y="313">人が判断する ・ 取り消す</text>
<rect class="box" x="400" y="288" width="470" height="58"/>
<text class="label" x="410" y="313">人の操作の入口だけから、rule ごとに instance</text>
<text class="label" x="410" y="330">を並べて判断を足すか取り消す</text>
<rect class="box" x="878" y="288" width="110" height="58"/>
<text class="label" x="888" y="313">U16</text>
<rect class="box" x="16" y="352" width="40" height="58"/>
<text class="label" x="26" y="377">6</text>
<rect class="box" x="202" y="352" width="190" height="58"/>
<text class="label" x="212" y="377">試す</text>
<rect class="box" x="400" y="352" width="470" height="58"/>
<text class="label" x="410" y="377">下書きの版や割り当てを instance に当てて検証し、結果が変わる</text>
<text class="label" x="410" y="394">instance と、抜き取る instance を返す。結果はいまの結果にしない</text>
<rect class="box" x="878" y="352" width="110" height="58"/>
<text class="label" x="888" y="377">U2 ・ U9 ・</text>
<text class="label" x="888" y="394">U14</text>
<rect class="box" x="16" y="416" width="40" height="58"/>
<text class="label" x="26" y="441">7</text>
<rect class="box" x="202" y="416" width="190" height="58"/>
<text class="label" x="212" y="441">承認を依頼する</text>
<rect class="box" x="400" y="416" width="470" height="58"/>
<text class="label" x="410" y="441">試した結果と、抜き取りへの人の判断（件数がそろっていること）を付けて人</text>
<text class="label" x="410" y="458">へ出す</text>
<rect class="box" x="878" y="416" width="110" height="58"/>
<text class="label" x="888" y="441">U9</text>
<rect class="box" x="16" y="480" width="40" height="58"/>
<text class="label" x="26" y="505">8</text>
<rect class="box" x="202" y="480" width="190" height="58"/>
<text class="label" x="212" y="505">取り込む</text>
<rect class="box" x="400" y="480" width="470" height="58"/>
<text class="label" x="410" y="505">$schema が公開した版1つに決まるファイルはそのまま instance にし、</text>
<text class="label" x="410" y="522">決まらないものだけ人が版を確定する</text>
<rect class="box" x="878" y="480" width="110" height="58"/>
<text class="label" x="888" y="505">U17</text>
<rect class="box" x="16" y="544" width="40" height="58"/>
<text class="label" x="26" y="569">9</text>
<rect class="box" x="202" y="544" width="190" height="58"/>
<text class="label" x="212" y="569">移す</text>
<rect class="box" x="400" y="544" width="470" height="58"/>
<text class="label" x="410" y="569">instance を新しい公開した版へ1件ずつ移し、</text>
<text class="label" x="410" y="586">移せなかったものは元の版に残して理由を返す</text>
<rect class="box" x="878" y="544" width="110" height="58"/>
<text class="label" x="888" y="569">U3 ・ U7</text>
<rect class="box" x="16" y="608" width="40" height="41"/>
<text class="label" x="26" y="633">10</text>
<rect class="box" x="202" y="608" width="190" height="41"/>
<text class="label" x="212" y="633">消す</text>
<rect class="box" x="400" y="608" width="470" height="41"/>
<text class="label" x="410" y="633">ほかの instance が x-ref で指していない instance を消す</text>
<rect class="box" x="878" y="608" width="110" height="41"/>
<text class="label" x="888" y="633">U11</text>
<rect class="box" x="16" y="655" width="40" height="58"/>
<text class="label" x="26" y="680">11</text>
<rect class="box" x="202" y="655" width="190" height="58"/>
<text class="label" x="212" y="680">検証する</text>
<rect class="box" x="400" y="655" width="470" height="58"/>
<text class="label" x="410" y="680">検証待ちの rule だけを、割り当てた validator に渡して記録に足す。</text>
<text class="label" x="410" y="697">error は次の検証で再び渡す</text>
<rect class="box" x="878" y="655" width="110" height="58"/>
<text class="label" x="888" y="680">U5 ・ U6 ・</text>
<text class="label" x="888" y="697">U8</text>
<rect class="box" x="16" y="719" width="40" height="58"/>
<text class="label" x="26" y="744">12</text>
<rect class="box" x="202" y="719" width="190" height="58"/>
<text class="label" x="212" y="744">状態を導く</text>
<rect class="box" x="400" y="719" width="470" height="58"/>
<text class="label" x="410" y="744">読むたびに入力を比べ、rule の効いている結果と instance</text>
<text class="label" x="410" y="761">の状態を決定表で導く</text>
<rect class="box" x="878" y="719" width="110" height="58"/>
<text class="label" x="888" y="744">U0 ・ U10 ・</text>
<text class="label" x="888" y="761"> U12</text>
<rect class="box" x="16" y="783" width="40" height="58"/>
<text class="label" x="26" y="808">13</text>
<rect class="box" x="202" y="783" width="190" height="58"/>
<text class="label" x="212" y="808">解決する</text>
<rect class="box" x="400" y="783" width="470" height="58"/>
<text class="label" x="410" y="808">$schema ・ $ref ・ x-ref ・ x-derive の指す先と導出値を決める</text>
<rect class="box" x="878" y="783" width="110" height="58"/>
<text class="label" x="888" y="808">U6 ・ U8 ・</text>
<text class="label" x="888" y="825">U11</text>
<rect class="box" x="16" y="847" width="40" height="58"/>
<text class="label" x="26" y="872">14</text>
<rect class="box" x="202" y="847" width="190" height="58"/>
<text class="label" x="212" y="872">意味で探して取り出す</text>
<rect class="box" x="400" y="847" width="470" height="58"/>
<text class="label" x="410" y="872">term ・ x-ref ・ rule の結果 ・ 状態で探し、要る部分だけを返す</text>
<rect class="box" x="878" y="847" width="110" height="58"/>
<text class="label" x="888" y="872">U5 ・ U6 ・</text>
<text class="label" x="888" y="889">U10 ・ U12</text>
<rect class="box" x="16" y="911" width="40" height="58"/>
<text class="label" x="26" y="936">15</text>
<rect class="box" x="202" y="911" width="190" height="58"/>
<text class="label" x="212" y="936">描画する</text>
<rect class="box" x="400" y="911" width="470" height="58"/>
<text class="label" x="410" y="936">instance を、rule ごとの効いている結果と状態と一緒に人が読む形にす</text>
<text class="label" x="410" y="953">る</text>
<rect class="box" x="878" y="911" width="110" height="58"/>
<text class="label" x="888" y="936">U12 ・ U16</text>
<rect class="box" x="16" y="975" width="40" height="58"/>
<text class="label" x="26" y="1000">16</text>
<rect class="box" x="202" y="975" width="190" height="58"/>
<text class="label" x="212" y="1000">案内する</text>
<rect class="box" x="400" y="975" width="470" height="58"/>
<text class="label" x="410" y="1000">書く単位ごとの x-prompt と変えてよい範囲を返す</text>
<rect class="box" x="878" y="975" width="110" height="58"/>
<text class="label" x="888" y="1000">U1 ・ U5 ・</text>
<text class="label" x="888" y="1017">U6</text>
<rect class="box" x="16" y="1039" width="40" height="58"/>
<text class="label" x="26" y="1064">17</text>
<rect class="box" x="202" y="1039" width="190" height="58"/>
<text class="label" x="212" y="1064">経緯をたどる</text>
<rect class="box" x="400" y="1039" width="470" height="58"/>
<text class="label" x="410" y="1064">承認 ・ 検証 ・ 人の判断の記録を時の順に返し、</text>
<text class="label" x="410" y="1081">欠けと書き換えの位置を返す</text>
<rect class="box" x="878" y="1039" width="110" height="58"/>
<text class="label" x="888" y="1064">U13</text>
<rect class="box" x="16" y="1103" width="40" height="58"/>
<text class="label" x="26" y="1128">18</text>
<rect class="box" x="202" y="1103" width="190" height="58"/>
<text class="label" x="212" y="1128">AI に判定を頼む</text>
<rect class="box" x="400" y="1103" width="470" height="58"/>
<text class="label" x="410" y="1128">読む欄と term の値だけを AI に渡して判定させ、</text>
<text class="label" x="410" y="1145">答えの形と根拠を検査する</text>
<rect class="box" x="878" y="1103" width="110" height="58"/>
<text class="label" x="888" y="1128">U5 ・ U8 ・</text>
<text class="label" x="888" y="1145">U14</text>
<rect class="box" x="16" y="1167" width="40" height="58"/>
<text class="label" x="26" y="1192">19</text>
<rect class="box" x="202" y="1167" width="190" height="58"/>
<text class="label" x="212" y="1192">validator</text>
<text class="label" x="212" y="1209">の能力を受け付ける</text>
<rect class="box" x="400" y="1167" width="470" height="58"/>
<text class="label" x="410" y="1192">validator が判定できる rule の種類の宣言を受け、担当の無い rule</text>
<text class="label" x="410" y="1209">を unsupported にする</text>
<rect class="box" x="878" y="1167" width="110" height="58"/>
<text class="label" x="888" y="1192">U14</text>
</svg>