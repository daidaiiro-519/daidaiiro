<svg viewBox="0 0 998 1458" style="min-width:900px" role="img" aria-label="拡張の契約：Core は作法だけを持ち、足した x- の意味の検証は Concrete が持つ">
<text class="note" x="20" y="22"></text>
<text class="note" x="168" y="22">項目</text>
<text class="note" x="426" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="140" height="237"/>
<text class="title" x="26" y="57">責任</text>
<rect class="box focus" x="16" y="275" width="140" height="301"/>
<text class="title" x="26" y="300">作法（Q7 で</text>
<text class="title" x="26" y="317">決めた）</text>
<rect class="box focus" x="16" y="582" width="140" height="186"/>
<text class="title" x="26" y="607">言語に依らない</text>
<rect class="box focus" x="16" y="774" width="140" height="314"/>
<text class="title" x="26" y="799">外のツール</text>
<rect class="box focus" x="16" y="1094" width="140" height="348"/>
<text class="title" x="26" y="1119">保存</text>
<rect class="box" x="164" y="32" width="250" height="92"/>
<rect class="box" x="422" y="32" width="560" height="92"/>
<text class="label" x="174" y="57">Core 自身の x-（</text>
<text class="label" x="174" y="74">x-relationship ・</text>
<text class="label" x="174" y="91">x-derived-from ・ x-prompt ・</text>
<text class="label" x="174" y="108">x-decided-by など）</text>
<text class="label" x="432" y="57">Core：Core が意味の検証まで持つ ／ Concrete：使うだけ</text>
<rect class="box" x="164" y="130" width="250" height="92"/>
<text class="label" x="174" y="155">Concrete が足した x-</text>
<rect class="box" x="422" y="130" width="560" height="92"/>
<text class="label" x="432" y="155">Core：作法に従っているかを見る。rule の agent が指す任せる先を呼び、</text>
<text class="label" x="432" y="172">場所ごとの5つの値と根拠を受け取ってまとめる。意味は解釈しない ／</text>
<text class="label" x="432" y="189">Concrete：意味の検証と、そのための依存（ツール ・ AI の使い方 ・</text>
<text class="label" x="432" y="206">ライブラリ）を持つ</text>
<rect class="box" x="164" y="228" width="250" height="41"/>
<text class="label" x="174" y="253">validator が無い ・ 答えない</text>
<rect class="box" x="422" y="228" width="560" height="41"/>
<text class="label" x="432" y="253">Core：隠さず unsupported か error で返す ／ Concrete：直す</text>
<rect class="box" x="164" y="275" width="250" height="75"/>
<text class="label" x="174" y="300">1. x- の定義の形</text>
<rect class="box" x="422" y="275" width="560" height="75"/>
<text class="label" x="432" y="300">名前（範囲は Concrete の $id。Core が調べるのは Core の拡張項目とのぶつかりだけ）・</text>
<text class="label" x="432" y="317">値の形（JSON Schema。値の形の検査は JSON Schema の実装に任せる）・</text>
<text class="label" x="432" y="334">意味（description と x-prompt）。判定は x-prompt の rule に書く</text>
<rect class="box" x="164" y="356" width="250" height="75"/>
<text class="label" x="174" y="381">2. validator との受け渡し</text>
<rect class="box" x="422" y="356" width="560" height="75"/>
<text class="label" x="432" y="381">Core が渡す：その x- が置かれた場所 ・ その値 ・ 読む欄の値。</text>
<text class="label" x="432" y="398">受け取る：場所ごとの5つの値と根拠。時間切れと失敗の返し方。プロセスと JSON</text>
<text class="label" x="432" y="415">で受け渡し、validator の言語は問わない</text>
<rect class="box" x="164" y="437" width="250" height="75"/>
<text class="label" x="174" y="462">3. validator の宣言</text>
<rect class="box" x="422" y="437" width="560" height="75"/>
<text class="label" x="432" y="462">validator は任せる先に名前で書き、AI の rule は agent でその名前を指す。</text>
<text class="label" x="432" y="479">割り当てが無ければ unsupported。</text>
<text class="label" x="432" y="496">AI は Core の腐敗防止層 Agents 契約を通して呼ぶ</text>
<rect class="box" x="164" y="518" width="250" height="58"/>
<text class="label" x="174" y="543">4. 作法の版</text>
<rect class="box" x="422" y="518" width="560" height="58"/>
<text class="label" x="432" y="543">作法に版を付け、Concrete はどの版に従うかを申告する。Core</text>
<text class="label" x="432" y="560">は出した作法の版を変えずに保つ</text>
<rect class="box" x="164" y="582" width="250" height="58"/>
<text class="label" x="174" y="607">データだけで書く</text>
<rect class="box" x="422" y="582" width="560" height="58"/>
<text class="label" x="432" y="607">拡張も検証の宣言も、データ（JSON Schema と宣言）だけで書く。Rust</text>
<text class="label" x="432" y="624">のコードやプラグインを求めない</text>
<rect class="box" x="164" y="646" width="250" height="58"/>
<text class="label" x="174" y="671">JSON Schema の版と範囲</text>
<rect class="box" x="422" y="646" width="560" height="58"/>
<text class="label" x="432" y="671">JSON Schema は 2020-12 に固定し、format は注釈だけにし、pattern</text>
<text class="label" x="432" y="688">で使ってよい正規表現の範囲を決める</text>
<rect class="box" x="164" y="710" width="250" height="58"/>
<text class="label" x="174" y="735">閉じた一覧の出し方</text>
<rect class="box" x="422" y="710" width="560" height="58"/>
<text class="label" x="432" y="735">閉じた一覧は、$id の一覧のデータとして Abstract</text>
<text class="label" x="432" y="752">と一緒に出す（どの言語の実装も同じ一覧を持てる）</text>
<rect class="box" x="164" y="774" width="250" height="75"/>
<text class="label" x="174" y="799">validator の宣言と許可</text>
<rect class="box" x="422" y="774" width="560" height="75"/>
<text class="label" x="432" y="799">外のツールは、それを包む Concrete（Skill）を任せる先に置いて呼ぶ。</text>
<text class="label" x="432" y="816">Concrete はリポジトリでレビューされるので、別の許可の一覧を持たない</text>
<text class="label" x="432" y="833">（Makefile と同じくリポジトリを信頼する）</text>
<rect class="box" x="164" y="855" width="250" height="75"/>
<text class="label" x="174" y="880">入出力</text>
<rect class="box" x="422" y="855" width="560" height="75"/>
<text class="label" x="432" y="880">入出力は JSON。渡すのは、その x- が置かれた場所 ・ その値 ・</text>
<text class="label" x="432" y="897">読む欄の値の写しだけ（作法の2）。出力の形 ・ 終了コードと5つの値の対応 ・ 時間切れ</text>
<text class="label" x="432" y="914"> ・ 出力の大きさの上限を作法に書く</text>
<rect class="box" x="164" y="936" width="250" height="41"/>
<text class="label" x="174" y="961">起動の仕方</text>
<rect class="box" x="422" y="936" width="560" height="41"/>
<text class="label" x="432" y="961">起動はシェルを通さず、引数の配列と作業のディレクトリを決めて渡す。秘密情報を渡さない</text>
<rect class="box" x="164" y="983" width="250" height="58"/>
<text class="label" x="174" y="1008">機械の検証の条件</text>
<rect class="box" x="422" y="983" width="560" height="58"/>
<text class="label" x="432" y="1008">ネットワーク ・ 時刻 ・ 乱数を使わず、同じ値から同じ結果を返すものは機械の検証と</text>
<text class="label" x="432" y="1025">して扱う。そうでないものは判定の記録に残す</text>
<rect class="box" x="164" y="1047" width="250" height="41"/>
<text class="label" x="174" y="1072">ツールの名前と版</text>
<rect class="box" x="422" y="1047" width="560" height="41"/>
<text class="label" x="432" y="1072">ツールの名前と版は、判定の記録に残す</text>
<rect class="box" x="164" y="1094" width="250" height="75"/>
<text class="label" x="174" y="1119">正本の置き場所</text>
<rect class="box" x="422" y="1094" width="560" height="75"/>
<text class="label" x="432" y="1119">instance ・ glossary ・ ビュー ・ デザインシステム ・ 変更の記録 ・</text>
<text class="label" x="432" y="1136">判定の記録の正本は、文脈のリポジトリにコミットする JSON のファイルにする。</text>
<text class="label" x="432" y="1153">Concrete は保存の形（DB ・ テーブル）を宣言しない</text>
<rect class="box" x="164" y="1175" width="250" height="75"/>
<text class="label" x="174" y="1200">データモデルの書き方</text>
<rect class="box" x="422" y="1175" width="560" height="75"/>
<text class="label" x="432" y="1200">種類は Concrete スキーマ、1件は instance（id と kind）、関係は</text>
<text class="label" x="432" y="1217">x-relationship（指す先 ・ 逆向き ・ 公開された版）で書く。必須と件数は</text>
<text class="label" x="432" y="1234">JSON Schema（required ・ minItems ・ maxItems）で書き、x- で書き直さない</text>
<rect class="box" x="164" y="1256" width="250" height="58"/>
<text class="label" x="174" y="1281">中身の種類の持ち主</text>
<rect class="box" x="422" y="1256" width="560" height="58"/>
<text class="label" x="432" y="1281">中身の種類（集約 ・ 使う場面 ・ 業務領域など）は Core に置かない。</text>
<text class="label" x="432" y="1298">仕様の文脈が定義して版で公開し、ほかの文脈はその版を指して読む</text>
<rect class="box" x="164" y="1320" width="250" height="75"/>
<text class="label" x="174" y="1345">索引の持ち主</text>
<rect class="box" x="422" y="1320" width="560" height="75"/>
<text class="label" x="432" y="1345">索引（手元のセッションの索引 ・ 関係の索引）は Core が持つ。行の形は Abstract</text>
<text class="label" x="432" y="1362">の一員、DB のスキーマ（DDL）と DB の版は Core の SQLite アダプターが持ち、</text>
<text class="label" x="432" y="1379">Concrete は宣言しない。手元に置き、コミットしない</text>
<rect class="box" x="164" y="1401" width="250" height="41"/>
<text class="label" x="174" y="1426">関係の索引を足す時点</text>
<rect class="box" x="422" y="1401" width="560" height="41"/>
<text class="label" x="432" y="1426">関係の索引は正本のファイルから作り直せる。足すのは、全件を読むのが遅いと測れてから</text>
</svg>
