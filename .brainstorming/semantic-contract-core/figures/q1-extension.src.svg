<svg viewBox="0 0 998 1578" style="min-width:900px" role="img" aria-label="拡張の契約：Core は作法だけを持ち、足した x- の意味の検証は Concrete が持つ">
<text class="note" x="20" y="22"></text>
<text class="note" x="168" y="22">項目</text>
<text class="note" x="426" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="140" height="220"/>
<text class="title" x="26" y="57">責任</text>
<rect class="box focus" x="16" y="258" width="140" height="267"/>
<text class="title" x="26" y="283">作法（Q7 で詰め</text>
<text class="title" x="26" y="300">る）</text>
<rect class="box focus" x="16" y="531" width="140" height="199"/>
<text class="title" x="26" y="556">拡張の仕方</text>
<rect class="box focus" x="16" y="736" width="140" height="186"/>
<text class="title" x="26" y="761">言語に依らない</text>
<rect class="box focus" x="16" y="928" width="140" height="314"/>
<text class="title" x="26" y="953">外のツール</text>
<rect class="box focus" x="16" y="1248" width="140" height="314"/>
<text class="title" x="26" y="1273">保存</text>
<rect class="box" x="164" y="32" width="250" height="75"/>
<text class="label" x="174" y="57">Core 自身の x-（x-ref ・</text>
<text class="label" x="174" y="74">x-derive ・ x-prompt ・</text>
<text class="label" x="174" y="91">x-view ・ x-term など）</text>
<rect class="box" x="422" y="32" width="560" height="75"/>
<text class="label" x="432" y="57">Core：Core が意味の検証まで持つ ／ Concrete：使うだけ</text>
<rect class="box" x="164" y="113" width="250" height="92"/>
<text class="label" x="174" y="138">Concrete が足した x-</text>
<rect class="box" x="422" y="113" width="560" height="92"/>
<text class="label" x="432" y="138">Core：作法に従っているかを見る。宣言された検証役を呼び、</text>
<text class="label" x="432" y="155">場所ごとの5つの値と根拠を受け取ってまとめる。意味は解釈しない ／</text>
<text class="label" x="432" y="172">Concrete：意味の検証と、そのための依存（ツール ・ AI の使い方 ・</text>
<text class="label" x="432" y="189">ライブラリ）を持つ</text>
<rect class="box" x="164" y="211" width="250" height="41"/>
<text class="label" x="174" y="236">検証役が無い ・ 答えない</text>
<rect class="box" x="422" y="211" width="560" height="41"/>
<text class="label" x="432" y="236">Core：隠さず unsupported か error で返す ／ Concrete：直す</text>
<rect class="box" x="164" y="258" width="250" height="58"/>
<text class="label" x="174" y="283">1. x- の定義の形</text>
<rect class="box" x="422" y="258" width="560" height="58"/>
<text class="label" x="432" y="283">名前（範囲は Concrete の $id）・ 値の形（JSON Schema）・ 意味（description</text>
<text class="label" x="432" y="300">と x-prompt）・ どの検証役に任せるか（名前で指す）</text>
<rect class="box" x="164" y="322" width="250" height="75"/>
<text class="label" x="174" y="347">2. 検証役との受け渡し</text>
<rect class="box" x="422" y="322" width="560" height="75"/>
<text class="label" x="432" y="347">Core が渡す：その x- が置かれた場所 ・ その値 ・ 読む欄の値。</text>
<text class="label" x="432" y="364">受け取る：場所ごとの5つの値と根拠。時間切れと失敗の返し方。プロセスと JSON</text>
<text class="label" x="432" y="381">で受け渡し、検証役の言語は問わない</text>
<rect class="box" x="164" y="403" width="250" height="58"/>
<text class="label" x="174" y="428">3. 検証役の宣言</text>
<rect class="box" x="422" y="403" width="560" height="58"/>
<text class="label" x="432" y="428">呼んでよい検証役は tool permissions に書く。AI に任せるときも、Concrete</text>
<text class="label" x="432" y="445">がその検証役を選ぶ（Agents 契約は Core が持つ口の1つ）</text>
<rect class="box" x="164" y="467" width="250" height="58"/>
<text class="label" x="174" y="492">4. 作法の版</text>
<rect class="box" x="422" y="467" width="560" height="58"/>
<text class="label" x="432" y="492">作法に版を付け、Concrete はどの版に従うかを申告する。Core</text>
<text class="label" x="432" y="509">は出した作法の版を変えずに保つ</text>
<rect class="box" x="164" y="531" width="250" height="41"/>
<text class="label" x="174" y="556">形</text>
<rect class="box" x="422" y="531" width="560" height="41"/>
<text class="label" x="432" y="556">x- の値の形を JSON Schema で書く（値の形の検査は JSON Schema の実装に任せる）</text>
<rect class="box" x="164" y="578" width="250" height="41"/>
<text class="label" x="174" y="603">意味</text>
<rect class="box" x="422" y="578" width="560" height="41"/>
<text class="label" x="432" y="603">description と x-prompt で書く</text>
<rect class="box" x="164" y="625" width="250" height="58"/>
<text class="label" x="174" y="650">検証役</text>
<rect class="box" x="422" y="625" width="560" height="58"/>
<text class="label" x="432" y="650">Concrete が宣言した検証役（外のツール ・ AI）。tool permissions</text>
<text class="label" x="432" y="667">に名前があるものだけ</text>
<rect class="box" x="164" y="689" width="250" height="41"/>
<text class="label" x="174" y="714">名前の範囲</text>
<rect class="box" x="422" y="689" width="560" height="41"/>
<text class="label" x="432" y="714">Concrete の $id で決まる。Core が調べるのは Core の語彙とのぶつかりだけ</text>
<rect class="box" x="164" y="736" width="250" height="58"/>
<text class="label" x="174" y="761">1</text>
<rect class="box" x="422" y="736" width="560" height="58"/>
<text class="label" x="432" y="761">拡張も検証の宣言も、データ（JSON Schema と宣言）だけで書く。Rust</text>
<text class="label" x="432" y="778">のコードやプラグインを求めない</text>
<rect class="box" x="164" y="800" width="250" height="58"/>
<text class="label" x="174" y="825">2</text>
<rect class="box" x="422" y="800" width="560" height="58"/>
<text class="label" x="432" y="825">JSON Schema は 2020-12 に固定し、format は注釈だけにし、pattern</text>
<text class="label" x="432" y="842">で使ってよい正規表現の範囲を決める</text>
<rect class="box" x="164" y="864" width="250" height="58"/>
<text class="label" x="174" y="889">3</text>
<rect class="box" x="422" y="864" width="560" height="58"/>
<text class="label" x="432" y="889">閉じた一覧は、$id の一覧のデータとして Abstract</text>
<text class="label" x="432" y="906">と一緒に出す（どの言語の実装も同じ一覧を持てる）</text>
<rect class="box" x="164" y="928" width="250" height="75"/>
<text class="label" x="174" y="953">1</text>
<rect class="box" x="422" y="928" width="560" height="75"/>
<text class="label" x="432" y="953">外のツールは、tool permissions（agents.json</text>
<text class="label" x="432" y="970">のような外出しの設定ファイル）に名前があるものだけを呼ぶ。基盤が形を持ち、</text>
<text class="label" x="432" y="987">文脈が値を持つ（Q3 の決定）</text>
<rect class="box" x="164" y="1009" width="250" height="75"/>
<text class="label" x="174" y="1034">2</text>
<rect class="box" x="422" y="1009" width="560" height="75"/>
<text class="label" x="432" y="1034">入出力は JSON。渡すのは、その x- が置かれた場所 ・ その値 ・</text>
<text class="label" x="432" y="1051">読む欄の値の写しだけ（作法の2）。出力の形 ・ 終了コードと5つの値の対応 ・ 時間切れ</text>
<text class="label" x="432" y="1068"> ・ 出力の大きさの上限を作法に書く</text>
<rect class="box" x="164" y="1090" width="250" height="41"/>
<text class="label" x="174" y="1115">3</text>
<rect class="box" x="422" y="1090" width="560" height="41"/>
<text class="label" x="432" y="1115">起動はシェルを通さず、引数の配列と作業のディレクトリを決めて渡す。秘密情報を渡さない</text>
<rect class="box" x="164" y="1137" width="250" height="58"/>
<text class="label" x="174" y="1162">4</text>
<rect class="box" x="422" y="1137" width="560" height="58"/>
<text class="label" x="432" y="1162">ネットワーク ・ 時刻 ・ 乱数を使わず、同じ値から同じ結果を返すものは機械の検証とし</text>
<text class="label" x="432" y="1179">て扱う。そうでないものは判定の記録に残す</text>
<rect class="box" x="164" y="1201" width="250" height="41"/>
<text class="label" x="174" y="1226">5</text>
<rect class="box" x="422" y="1201" width="560" height="41"/>
<text class="label" x="432" y="1226">ツールの名前と版は、判定の記録に残す</text>
<rect class="box" x="164" y="1248" width="250" height="58"/>
<text class="label" x="174" y="1273">1</text>
<rect class="box" x="422" y="1248" width="560" height="58"/>
<text class="label" x="432" y="1273">instance ・ 変更の記録 ・ 判定の記録の正本は、文脈のリポジトリにコミットする</text>
<text class="label" x="432" y="1290">JSON のファイルにする。Concrete は保存の形（DB ・ テーブル）を宣言しない</text>
<rect class="box" x="164" y="1312" width="250" height="75"/>
<text class="label" x="174" y="1337">2</text>
<rect class="box" x="422" y="1312" width="560" height="75"/>
<text class="label" x="432" y="1337">種類は Concrete スキーマ、1件は instance（id と kind）、関係は x-ref（指す先</text>
<text class="label" x="432" y="1354"> ・ 逆向き ・ 公開された版）で書く。必須と件数は JSON Schema（required ・</text>
<text class="label" x="432" y="1371">minItems ・ maxItems）で書き、x- で書き直さない</text>
<rect class="box" x="164" y="1393" width="250" height="58"/>
<text class="label" x="174" y="1418">3</text>
<rect class="box" x="422" y="1393" width="560" height="58"/>
<text class="label" x="432" y="1418">中身の種類（集約 ・ 使う場面 ・ 業務領域など）は Core に置かない。</text>
<text class="label" x="432" y="1435">仕様の文脈が定義して版で公開し、ほかの文脈はその版を指して読む</text>
<rect class="box" x="164" y="1457" width="250" height="58"/>
<text class="label" x="174" y="1482">4</text>
<rect class="box" x="422" y="1457" width="560" height="58"/>
<text class="label" x="432" y="1482">索引（instance と x-ref の関係の索引 ・ 手元のセッションの索引）は Core が持</text>
<text class="label" x="432" y="1499">つ。手元の DB（最初のアダプターは SQLite）に置き、コミットしない</text>
<rect class="box" x="164" y="1521" width="250" height="41"/>
<text class="label" x="174" y="1546">5</text>
<rect class="box" x="422" y="1521" width="560" height="41"/>
<text class="label" x="432" y="1546">関係の索引は正本のファイルから作り直せる。足すのは、全件を読むのが遅いと測れてから</text>
</svg>