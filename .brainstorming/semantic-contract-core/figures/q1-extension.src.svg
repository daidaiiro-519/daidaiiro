<svg viewBox="0 0 998 1424" style="min-width:900px" role="img" aria-label="拡張の契約：Core は作法だけを持ち、足した x- の意味の検証は Concrete が持つ">
<text class="note" x="20" y="22"></text>
<text class="note" x="168" y="22">項目</text>
<text class="note" x="426" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="140" height="220"/>
<text class="title" x="26" y="57">責任</text>
<rect class="box focus" x="16" y="258" width="140" height="284"/>
<text class="title" x="26" y="283">作法（Q7 で</text>
<text class="title" x="26" y="300">詰める）</text>
<rect class="box focus" x="16" y="548" width="140" height="186"/>
<text class="title" x="26" y="573">言語に依らない</text>
<rect class="box focus" x="16" y="740" width="140" height="314"/>
<text class="title" x="26" y="765">外のツール</text>
<rect class="box focus" x="16" y="1060" width="140" height="348"/>
<text class="title" x="26" y="1085">保存</text>
<rect class="box" x="164" y="32" width="250" height="75"/>
<text class="label" x="174" y="57">Core 自身の x-（</text>
<text class="label" x="174" y="74">x-relationship ・ x-derive ・</text>
<text class="label" x="174" y="91">x-prompt ・ x-view など）</text>
<rect class="box" x="422" y="32" width="560" height="75"/>
<text class="label" x="432" y="57">Core：Core が意味の検証まで持つ ／ Concrete：使うだけ</text>
<rect class="box" x="164" y="113" width="250" height="92"/>
<text class="label" x="174" y="138">Concrete が足した x-</text>
<rect class="box" x="422" y="113" width="560" height="92"/>
<text class="label" x="432" y="138">Core：作法に従っているかを見る。宣言された検証役を呼び、</text>
<text class="label" x="432" y="155">場所ごとの5つの値と根拠を受け取ってまとめる。意味は解釈しない ／</text>
<text class="label" x="432" y="172">Concrete：意味の検証と、そのための依存（ツール ・ AI の使い方 ・</text>
<text class="label" x="432" y="189">ライブラリ）を持つ</text>
<rect class="box" x="164" y="211" width="250" height="41"/>
<text class="label" x="174" y="236">検証役が無い ・ 答えない</text>
<rect class="box" x="422" y="211" width="560" height="41"/>
<text class="label" x="432" y="236">Core：隠さず unsupported か error で返す ／ Concrete：直す</text>
<rect class="box" x="164" y="258" width="250" height="75"/>
<text class="label" x="174" y="283">1. x- の定義の形</text>
<rect class="box" x="422" y="258" width="560" height="75"/>
<text class="label" x="432" y="283">名前（範囲は Concrete の $id。Core が調べるのは Core の語彙とのぶつかりだけ）・</text>
<text class="label" x="432" y="300">値の形（JSON Schema。値の形の検査は JSON Schema の実装に任せる）・</text>
<text class="label" x="432" y="317">意味（description と x-prompt）・ どの検証役に任せるか（名前で指す）</text>
<rect class="box" x="164" y="339" width="250" height="75"/>
<text class="label" x="174" y="364">2. 検証役との受け渡し</text>
<rect class="box" x="422" y="339" width="560" height="75"/>
<text class="label" x="432" y="364">Core が渡す：その x- が置かれた場所 ・ その値 ・ 読む欄の値。</text>
<text class="label" x="432" y="381">受け取る：場所ごとの5つの値と根拠。時間切れと失敗の返し方。プロセスと JSON</text>
<text class="label" x="432" y="398">で受け渡し、検証役の言語は問わない</text>
<rect class="box" x="164" y="420" width="250" height="58"/>
<text class="label" x="174" y="445">3. 検証役の宣言</text>
<rect class="box" x="422" y="420" width="560" height="58"/>
<text class="label" x="432" y="445">検証役は x- の定義に名前で書く。AI に任せるときも、Concrete</text>
<text class="label" x="432" y="462">がその検証役を選ぶ。AI は Core の腐敗防止層 Agents 契約を通して呼ぶ</text>
<rect class="box" x="164" y="484" width="250" height="58"/>
<text class="label" x="174" y="509">4. 作法の版</text>
<rect class="box" x="422" y="484" width="560" height="58"/>
<text class="label" x="432" y="509">作法に版を付け、Concrete はどの版に従うかを申告する。Core</text>
<text class="label" x="432" y="526">は出した作法の版を変えずに保つ</text>
<rect class="box" x="164" y="548" width="250" height="58"/>
<text class="label" x="174" y="573">データだけで書く</text>
<rect class="box" x="422" y="548" width="560" height="58"/>
<text class="label" x="432" y="573">拡張も検証の宣言も、データ（JSON Schema と宣言）だけで書く。Rust</text>
<text class="label" x="432" y="590">のコードやプラグインを求めない</text>
<rect class="box" x="164" y="612" width="250" height="58"/>
<text class="label" x="174" y="637">JSON Schema の版と範囲</text>
<rect class="box" x="422" y="612" width="560" height="58"/>
<text class="label" x="432" y="637">JSON Schema は 2020-12 に固定し、format は注釈だけにし、pattern</text>
<text class="label" x="432" y="654">で使ってよい正規表現の範囲を決める</text>
<rect class="box" x="164" y="676" width="250" height="58"/>
<text class="label" x="174" y="701">閉じた一覧の出し方</text>
<rect class="box" x="422" y="676" width="560" height="58"/>
<text class="label" x="432" y="701">閉じた一覧は、$id の一覧のデータとして Abstract</text>
<text class="label" x="432" y="718">と一緒に出す（どの言語の実装も同じ一覧を持てる）</text>
<rect class="box" x="164" y="740" width="250" height="75"/>
<text class="label" x="174" y="765">検証役の宣言と許可</text>
<rect class="box" x="422" y="740" width="560" height="75"/>
<text class="label" x="432" y="765">検証役は Concrete の x- の定義に名前で書く。Concrete</text>
<text class="label" x="432" y="782">はリポジトリでレビューされるので、別の許可の一覧を持たない（Makefile</text>
<text class="label" x="432" y="799">と同じくリポジトリを信頼する）</text>
<rect class="box" x="164" y="821" width="250" height="75"/>
<text class="label" x="174" y="846">入出力</text>
<rect class="box" x="422" y="821" width="560" height="75"/>
<text class="label" x="432" y="846">入出力は JSON。渡すのは、その x- が置かれた場所 ・ その値 ・</text>
<text class="label" x="432" y="863">読む欄の値の写しだけ（作法の2）。出力の形 ・ 終了コードと5つの値の対応 ・ 時間切れ</text>
<text class="label" x="432" y="880"> ・ 出力の大きさの上限を作法に書く</text>
<rect class="box" x="164" y="902" width="250" height="41"/>
<text class="label" x="174" y="927">起動の仕方</text>
<rect class="box" x="422" y="902" width="560" height="41"/>
<text class="label" x="432" y="927">起動はシェルを通さず、引数の配列と作業のディレクトリを決めて渡す。秘密情報を渡さない</text>
<rect class="box" x="164" y="949" width="250" height="58"/>
<text class="label" x="174" y="974">機械の検証の条件</text>
<rect class="box" x="422" y="949" width="560" height="58"/>
<text class="label" x="432" y="974">ネットワーク ・ 時刻 ・ 乱数を使わず、同じ値から同じ結果を返すものは機械の検証と</text>
<text class="label" x="432" y="991">して扱う。そうでないものは判定の記録に残す</text>
<rect class="box" x="164" y="1013" width="250" height="41"/>
<text class="label" x="174" y="1038">ツールの名前と版</text>
<rect class="box" x="422" y="1013" width="560" height="41"/>
<text class="label" x="432" y="1038">ツールの名前と版は、判定の記録に残す</text>
<rect class="box" x="164" y="1060" width="250" height="75"/>
<text class="label" x="174" y="1085">正本の置き場所</text>
<rect class="box" x="422" y="1060" width="560" height="75"/>
<text class="label" x="432" y="1085">instance ・ glossary ・ ページテンプレート ・ 表示の組 ・ 変更の記録 ・</text>
<text class="label" x="432" y="1102">判定の記録の正本は、文脈のリポジトリにコミットする JSON のファイルにする。</text>
<text class="label" x="432" y="1119">Concrete は保存の形（DB ・ テーブル）を宣言しない</text>
<rect class="box" x="164" y="1141" width="250" height="75"/>
<text class="label" x="174" y="1166">データモデルの書き方</text>
<rect class="box" x="422" y="1141" width="560" height="75"/>
<text class="label" x="432" y="1166">種類は Concrete スキーマ、1件は instance（id と kind）、関係は</text>
<text class="label" x="432" y="1183">x-relationship（指す先 ・ 逆向き ・ 公開された版）で書く。必須と件数は</text>
<text class="label" x="432" y="1200">JSON Schema（required ・ minItems ・ maxItems）で書き、x- で書き直さない</text>
<rect class="box" x="164" y="1222" width="250" height="58"/>
<text class="label" x="174" y="1247">中身の種類の持ち主</text>
<rect class="box" x="422" y="1222" width="560" height="58"/>
<text class="label" x="432" y="1247">中身の種類（集約 ・ 使う場面 ・ 業務領域など）は Core に置かない。</text>
<text class="label" x="432" y="1264">仕様の文脈が定義して版で公開し、ほかの文脈はその版を指して読む</text>
<rect class="box" x="164" y="1286" width="250" height="75"/>
<text class="label" x="174" y="1311">索引の持ち主</text>
<rect class="box" x="422" y="1286" width="560" height="75"/>
<text class="label" x="432" y="1311">索引（手元のセッションの索引 ・ 関係の索引）は Core が持つ。行の形は Abstract</text>
<text class="label" x="432" y="1328">の一員、DB のスキーマ（DDL）と DB の版は Core の SQLite アダプターが持ち、</text>
<text class="label" x="432" y="1345">Concrete は宣言しない。手元に置き、コミットしない</text>
<rect class="box" x="164" y="1367" width="250" height="41"/>
<text class="label" x="174" y="1392">関係の索引を足す時点</text>
<rect class="box" x="422" y="1367" width="560" height="41"/>
<text class="label" x="432" y="1392">関係の索引は正本のファイルから作り直せる。足すのは、全件を読むのが遅いと測れてから</text>
</svg>
