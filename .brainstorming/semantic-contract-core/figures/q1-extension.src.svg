<svg viewBox="0 0 998 691" style="min-width:900px" role="img" aria-label="拡張の契約：Concrete が x- を足すときの決まり">
<text class="note" x="20" y="22"></text>
<text class="note" x="168" y="22">項目</text>
<text class="note" x="286" y="22">中身</text>
<rect class="box focus" x="16" y="32" width="140" height="216"/>
<text class="title" x="26" y="57">拡張の仕方</text>
<rect class="box focus" x="16" y="254" width="140" height="135"/>
<text class="title" x="26" y="279">言語に依らない</text>
<rect class="box focus" x="16" y="395" width="140" height="280"/>
<text class="title" x="26" y="420">外のツール</text>
<rect class="box" x="164" y="32" width="110" height="41"/>
<text class="label" x="174" y="57">形</text>
<rect class="box" x="282" y="32" width="700" height="41"/>
<text class="label" x="292" y="57">x- の値の形を JSON Schema で書く（値の形の検査は JSON Schema の実装に任せる）</text>
<rect class="box" x="164" y="79" width="110" height="41"/>
<text class="label" x="174" y="104">意味</text>
<rect class="box" x="282" y="79" width="700" height="41"/>
<text class="label" x="292" y="104">何を表すかを description と x-prompt で書く</text>
<rect class="box" x="164" y="126" width="110" height="75"/>
<text class="label" x="174" y="151">検証の仕方</text>
<rect class="box" x="282" y="126" width="700" height="75"/>
<text class="label" x="292" y="151">次のどれか：Core の x-（x-ref ・ x-derive など）の組み合わせ ／ rule の id を指す（AI ・</text>
<text class="label" x="292" y="168">人の判定は rule が持つ）／ 外のツール（tool permissions に名前があるもの）。どれでも書けなければ</text>
<text class="label" x="292" y="185">unsupported</text>
<rect class="box" x="164" y="207" width="110" height="41"/>
<text class="label" x="174" y="232">名前の範囲</text>
<rect class="box" x="282" y="207" width="700" height="41"/>
<text class="label" x="292" y="232">語の範囲は Concrete の $id で決まる。Core が調べるのは Core の語彙とのぶつかりだけ</text>
<rect class="box" x="164" y="254" width="110" height="41"/>
<text class="label" x="174" y="279">1</text>
<rect class="box" x="282" y="254" width="700" height="41"/>
<text class="label" x="292" y="279">拡張も検証の宣言も、データ（JSON Schema と宣言）だけで書く。Rust のコードやプラグインを求めない</text>
<rect class="box" x="164" y="301" width="110" height="41"/>
<text class="label" x="174" y="326">2</text>
<rect class="box" x="282" y="301" width="700" height="41"/>
<text class="label" x="292" y="326">JSON Schema は 2020-12 に固定し、format は注釈だけにし、pattern で使ってよい正規表現の範囲を決める</text>
<rect class="box" x="164" y="348" width="110" height="41"/>
<text class="label" x="174" y="373">3</text>
<rect class="box" x="282" y="348" width="700" height="41"/>
<text class="label" x="292" y="373">閉じた一覧は、$id の一覧のデータとして Abstract と一緒に出す（どの言語の実装も同じ一覧を持てる）</text>
<rect class="box" x="164" y="395" width="110" height="58"/>
<text class="label" x="174" y="420">1</text>
<rect class="box" x="282" y="395" width="700" height="58"/>
<text class="label" x="292" y="420">外のツールは、tool permissions（agents.json のような外出しの設定ファイル）に名前があるものだけを呼</text>
<text class="label" x="292" y="437">ぶ。基盤が形を持ち、文脈が値を持つ（Q3 の決定）</text>
<rect class="box" x="164" y="459" width="110" height="58"/>
<text class="label" x="174" y="484">2</text>
<rect class="box" x="282" y="459" width="700" height="58"/>
<text class="label" x="292" y="484">入出力は JSON。渡すのは読む欄 ・ term ・ 参照先の値の写しだけ。出力の形 ・ 終了コードと5つの値の対応 ・</text>
<text class="label" x="292" y="501"> 時間切れ ・ 出力の大きさの上限を契約に書く</text>
<rect class="box" x="164" y="523" width="110" height="41"/>
<text class="label" x="174" y="548">3</text>
<rect class="box" x="282" y="523" width="700" height="41"/>
<text class="label" x="292" y="548">起動はシェルを通さず、引数の配列と作業のディレクトリを決めて渡す。秘密情報を渡さない</text>
<rect class="box" x="164" y="570" width="110" height="58"/>
<text class="label" x="174" y="595">4</text>
<rect class="box" x="282" y="570" width="700" height="58"/>
<text class="label" x="292" y="595">ネットワーク ・ 時刻 ・ 乱数を使わず、同じ値から同じ結果を返すものは機械の検証として扱う。</text>
<text class="label" x="292" y="612">そうでないものは判定の記録に残す</text>
<rect class="box" x="164" y="634" width="110" height="41"/>
<text class="label" x="174" y="659">5</text>
<rect class="box" x="282" y="634" width="700" height="41"/>
<text class="label" x="292" y="659">ツールの名前と版は、判定の記録に残す</text>
</svg>