<rect class="box focus" x="30" y="206" width="290" height="172"/><text class="title" x="42" y="230">変更の記録（集約。1件が意図1つ）</text>
<text class="note" x="42" y="254">id（書いた時に決める一意な値）</text>
<text class="note" x="42" y="276">目的の参照（id）</text>
<text class="note" x="42" y="298">意図（目的の中の判断の1つ）</text>
