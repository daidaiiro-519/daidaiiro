<rect class="box" x="380" y="246" width="280" height="84"/><text class="title" x="392" y="270">変更の項目（値）</text>
<text class="note" x="392" y="294">対象（種類と id）</text>
<text class="note" x="392" y="316">欄（x-prompt を持つ書く単位）</text>
<rect class="boundary" x="730" y="186" width="250" height="84"/><text class="title" x="742" y="210">目的（外）</text>
<text class="note" x="742" y="234">ACDR ・ ボードの論点など</text>
<text class="note" x="742" y="256">Core は目的の参照だけを持つ</text>
<rect class="boundary" x="730" y="290" width="250" height="106"/><text class="title" x="742" y="314">変更の仕組み（外。Git など）</text>
<text class="note" x="742" y="338">ファイルの差分（前後の値）・ 履歴</text>
<text class="note" x="742" y="360">出した者 ・ 時刻</text>
<text class="note" x="742" y="382">承認 ・ 取り込み ・ 衝突</text>
<path class="flow" d="M175,148 V206"/><text class="note" x="186" y="172">記録の id で指す</text>
<path class="flow" d="M320,226 H730"/><text class="note" x="540" y="218">目的の参照（N ─ 1）</text>
<path class="flow" d="M320,288 H380"/><text class="note" x="326" y="280">1 ─ N</text>
<path class="flow" d="M730,316 H660"/><text class="note" x="690" y="308">前後</text>
<path class="flow" d="M500,330 V470"/>
<path class="flow" d="M420,330 V452 H200 V470"/>
<path class="flow" d="M580,330 V452 H850 V470"/><text class="note" x="700" y="442">項目の対象（N ─ 1）</text>
<path class="flow" d="M80,470 V378"/><text class="note" x="88" y="440">I33 の対象（N ─ 1）</text>
<rect class="box" x="30" y="470" width="290" height="150"/><text class="title" x="42" y="494">判定の記録</text>
<text class="note" x="42" y="518">対象の id ・ rule id</text>
<text class="note" x="42" y="540">判定した値 ・ 結果 ・ 判定した者</text>
<text class="note" x="42" y="562">根拠（I33 は意味と判定の理由）</text>
<text class="note" x="42" y="584">意味：意図全体と対象ごとの1文</text>
<text class="note" x="42" y="606">各文に読んだ値の位置と意図の id</text>
<rect class="box" x="380" y="470" width="250" height="128"/><text class="title" x="392" y="494">instance（仕様の document）</text>
<text class="note" x="392" y="518">id ・ kind（範囲は Concrete の $id）</text>
<text class="note" x="392" y="540">$schema（Concrete の $id）</text>
<text class="note" x="392" y="562">欄の値（JSON）</text>
<text class="note" x="392" y="584">x-relationship（指す先 ・ 版）</text>
<rect class="box" x="720" y="470" width="260" height="84"/><text class="title" x="732" y="494">Semantic Concrete Schema</text>
<text class="note" x="732" y="518">$id</text>
<text class="note" x="732" y="540">rule ・ x-prompt ・ x-relationship</text>
<path class="flow" d="M380,520 H320"/><text class="note" x="364" y="512">1</text><text class="note" x="328" y="512">N</text>
<path class="flow" d="M720,520 H630"/><text class="note" x="705" y="512">1</text><text class="note" x="638" y="512">N</text>
<rect class="box" x="380" y="680" width="280" height="106"/><text class="title" x="392" y="704">関係の索引（手元の DB）</text>
<text class="note" x="392" y="728">instance id ・ kind</text>
<text class="note" x="392" y="750">x-relationship：指す側 → 指される側（版）</text>
<text class="note" x="392" y="772">正本から作り直せる。コミットしない</text>
<path class="flow" d="M500,598 V680"/><text class="note" x="512" y="640">正本から作る</text>
<rect class="box" x="30" y="680" width="290" height="106"/><text class="title" x="42" y="704">変更のまとまり（出力）</text>
<text class="note" x="42" y="728">Abstract の一員の形。保存しない</text>
<text class="note" x="42" y="750">変更の前後と2つの記録から組み立てる</text>
<text class="note" x="42" y="772">Concrete が $ref で使い、ビューで描く</text>
<path class="flow" d="M175,620 V680"/><text class="note" x="186" y="652">組み立てる</text>
<text class="note" x="30" y="826">コミットするのは、変更の記録と判定の記録（JSON のファイル。1件1ファイル）と対象だけ。セッション ID は手元の索引にだけ置く。</text>
<text class="note" x="30" y="848">意味の変更は I33 の判定の記録に残る。I33 は変更の中でだけ判定し、取り込んだあとの状態の導出には使わない。</text>
<text class="note" x="30" y="870">差し戻した意図は書き換えず、新しい変更の記録を足して、置き換える意図の id で前の記録を指す。</text>
<text class="note" x="30" y="892">手元の DB（SQLite）：手元のセッションの索引と関係の索引。DB のスキーマは Core が持ち、コミットしない。</text>
<text class="note" x="30" y="914">ファイルの差分 ・ 承認 ・ 取り込みは変更の仕組みが持つ。Core は差分を作らず、承認の記録も持たない。</text>
<text class="note" x="30" y="936">対象は仕様の document まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
</svg>
