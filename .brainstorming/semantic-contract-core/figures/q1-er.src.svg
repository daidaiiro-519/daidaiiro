<svg viewBox="0 0 1000 860" style="min-width:900px" role="img" aria-label="変更の記録とセッションの ER 図">
<rect class="box" x="30" y="20" width="290" height="128"/><text class="title" x="42" y="44">手元のセッションの索引</text>
<text class="note" x="42" y="68">セッション ID ・ 根から親までの id の並び</text>
<text class="note" x="42" y="90">変更の記録の id の並び</text>
<text class="note" x="42" y="112">SQLite 1ファイル（最初のアダプター）</text>
<text class="note" x="42" y="134">コミットしない</text>
<rect class="boundary" x="380" y="20" width="280" height="106"/><text class="title" x="392" y="44">セッションを管理する役（外）</text>
<text class="note" x="392" y="68">harness ・ AI のツール</text>
<text class="note" x="392" y="90">ID の発行 ・ 始まりと終わり</text>
<text class="note" x="392" y="112">子のセッションへの受け渡し</text>
<rect class="boundary" x="730" y="20" width="250" height="84"/><text class="title" x="742" y="44">セッションの中身（外）</text>
<text class="note" x="742" y="68">会話の記録。手元の AI のツール</text>
<text class="note" x="742" y="90">リポジトリに入れない</text>
<path class="flow" d="M380,70 H320"/><text class="note" x="334" y="62">渡す</text>
<path class="link" d="M730,60 H660"/><text class="note" x="692" y="52">id</text>
<rect class="boundary" x="16" y="186" width="664" height="196"/>
<text class="note" x="30" y="372">集約の境界：変更の記録（1回の保存で変えるのはこの中だけ）</text>
<rect class="box focus" x="30" y="206" width="290" height="150"/><text class="title" x="42" y="230">変更の記録（集約）</text>
<text class="note" x="42" y="254">id（書いた時に決める一意な値）</text>
<text class="note" x="42" y="276">理由（なぜ変えたか）</text>
<text class="note" x="42" y="298">目的の参照（id）</text>
<text class="note" x="42" y="320">書いた者の種類（人 ・ AI）</text>
<text class="note" x="42" y="342">変更の項目の並び（値）</text>
<rect class="box" x="380" y="226" width="280" height="106"/><text class="title" x="392" y="250">変更の項目（値）</text>
<text class="note" x="392" y="274">対象（種類と id）</text>
<text class="note" x="392" y="296">欄（JSON Pointer）</text>
<text class="note" x="392" y="318">項目ごとの理由（違うときだけ）</text>
<rect class="boundary" x="730" y="226" width="250" height="84"/><text class="title" x="742" y="250">Git など（外）</text>
<text class="note" x="742" y="274">ファイルの前後の値 ・ 履歴</text>
<text class="note" x="742" y="296">出した者 ・ 時刻 ・ 取り込み ・ 衝突</text>
<path class="flow" d="M175,148 V206"/><text class="note" x="186" y="172">記録の id で指す</text>
<path class="flow" d="M320,276 H380"/><text class="note" x="326" y="268">1 ─ N</text>
<path class="flow" d="M730,276 H660"/><text class="note" x="690" y="268">前後</text>
<path class="flow" d="M500,332 V420"/>
<path class="flow" d="M420,332 V400 H155 V420"/>
<path class="flow" d="M580,332 V400 H850 V420"/><text class="note" x="700" y="392">項目の対象（N ─ 1）</text>
<rect class="box" x="30" y="420" width="250" height="106"/><text class="title" x="42" y="444">判定の記録</text>
<text class="note" x="42" y="468">instance id ・ rule id</text>
<text class="note" x="42" y="490">判定した値 ・ 結果 ・ 根拠</text>
<text class="note" x="42" y="512">判定した者</text>
<rect class="box" x="380" y="420" width="250" height="128"/><text class="title" x="392" y="444">instance（仕様の document）</text>
<text class="note" x="392" y="468">id ・ kind（範囲は Concrete の $id）</text>
<text class="note" x="392" y="490">$schema（Concrete の $id）</text>
<text class="note" x="392" y="512">欄の値（JSON）</text>
<text class="note" x="392" y="534">x-relationship（指す先 ・ 版）</text>
<rect class="box" x="380" y="620" width="280" height="128"/><text class="title" x="392" y="644">関係の索引（手元の DB）</text>
<text class="note" x="392" y="668">instance id ・ kind</text>
<text class="note" x="392" y="690">x-relationship：指す側 → 指される側（版）</text>
<text class="note" x="392" y="712">正本のファイルから作り直せる</text>
<text class="note" x="392" y="734">コミットしない</text>
<path class="flow" d="M500,548 V620"/><text class="note" x="512" y="590">正本から作る</text>
<rect class="box" x="720" y="420" width="260" height="84"/><text class="title" x="732" y="444">Semantic Concrete Schema</text>
<text class="note" x="732" y="468">$id</text>
<text class="note" x="732" y="490">rule ・ glossary の term を指す $ref</text>
<path class="flow" d="M380,470 H280"/><text class="note" x="364" y="462">1</text><text class="note" x="288" y="462">N</text>
<path class="flow" d="M720,470 H630"/><text class="note" x="705" y="462">1</text><text class="note" x="638" y="462">N</text>
<text class="note" x="30" y="772">コミットするのは、集約の境界の中（JSON のファイル。1件1ファイル）と対象だけ。セッション ID は手元の索引にだけ置く。</text>
<text class="note" x="30" y="794">手元の DB（SQLite）：手元のセッションの索引と関係の索引。DB のスキーマは Core が持ち、Concrete は宣言しない。コミットしない。</text>
<text class="note" x="30" y="816">変更の記録は、書いた時にセッション ID の無い形で作業ツリーに置く。まとまりは保存せず、id で引いて組み立てる。</text>
<text class="note" x="30" y="838">対象は仕様の document まで。ソースコードは追わない（開発のハーネス ・ UATDD の側が担保する）。</text>
</svg>
