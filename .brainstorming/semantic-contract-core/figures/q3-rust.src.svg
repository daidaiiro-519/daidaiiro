<svg viewBox="0 0 780 470" style="min-width:660px" role="img" aria-label="Rust の構成と、外への契約">
<rect class="area" x="10" y="10" width="560" height="450"/><text class="title" x="24" y="34">workspace（版と Cargo.lock は1か所）</text>
<rect class="box" x="26" y="48" width="528" height="170"/><text class="title" x="40" y="72">crate：core（入出力に触らない）</text>
<rect class="box" x="42" y="86" width="496" height="34"/><text class="label" x="54" y="108">module domain</text><text class="note" x="200" y="108">宣言 ・ 結果の5つの語（enum）・ 決まりの判定</text>
<rect class="box" x="42" y="128" width="496" height="34"/><text class="label" x="54" y="150">module application</text><text class="note" x="200" y="150">作成 ・ 更新 ・ 検査 ・ 承認 ・ 描画の手順</text>
<rect class="box" x="42" y="170" width="496" height="34"/><text class="label" x="54" y="192">module ports</text><text class="note" x="200" y="192">trait：Files ・ Programs ・ Agents（AI を起動する）</text>
<path class="flow" d="M290,262 V222"/><text class="note" x="300" y="246">adapters → core の一方向だけ（ビルドが守る）</text>
<rect class="box" x="26" y="266" width="528" height="180"/><text class="title" x="40" y="290">crate：adapters（trait を実物で満たす）</text>
<rect class="box" x="42" y="304" width="496" height="36"/><text class="label" x="54" y="327">インターフェース</text><text class="note" x="170" y="327">CLI ・ MCP ・ HTTP ・ WASM Component</text>
<rect class="box" x="42" y="348" width="496" height="36"/><text class="label" x="54" y="371">出ていく側</text><text class="note" x="170" y="371">AI の CLI を起動する（Agents 契約）</text>
<rect class="box" x="42" y="392" width="496" height="36"/><text class="label" x="54" y="415">標準の部品</text><text class="note" x="170" y="415">jsonschema ・ json-ld など。feature で能力を選ぶ</text>
<rect class="box focus" x="590" y="48" width="180" height="170"/><text class="title focus" x="604" y="72">外への契約</text>
<text class="label" x="604" y="100">protocol</text>
<text class="label" x="604" y="122">（JSON Schema）</text>
<text class="label" x="604" y="144">crate や trait は</text>
<text class="label" x="604" y="166">外へ出さない</text>
<rect class="boundary" x="590" y="266" width="180" height="180"/><text class="title" x="604" y="290">ほかの言語</text>
<text class="label" x="604" y="318">TypeScript ・ Python</text>
<text class="label" x="604" y="340">・ Go の担い手は</text>
<text class="label" x="604" y="362">protocol でつなぐ</text>
<text class="label" x="604" y="384">（WASM でも使える）</text>
<path class="link" d="M680,220 V264"/>
</svg>