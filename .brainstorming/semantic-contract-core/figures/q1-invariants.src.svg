<svg viewBox="0 0 1006 1792" style="min-width:900px" role="img" aria-label="不変条件30行：対象ごとに固め、導いた使う場面を付けた表">
<text class="note" x="20" y="22">#</text>
<text class="note" x="78" y="22">対象</text>
<text class="note" x="196" y="22">不変条件</text>
<text class="note" x="844" y="22">使う場面</text>
<rect class="box focus" x="74" y="32" width="110" height="105"/>
<text class="title" x="84" y="57">Abstract</text>
<rect class="box focus" x="74" y="143" width="110" height="280"/>
<text class="title" x="84" y="168">Concrete</text>
<rect class="box focus" x="74" y="429" width="110" height="199"/>
<text class="title" x="84" y="454">instance</text>
<rect class="box focus" x="74" y="634" width="110" height="233"/>
<text class="title" x="84" y="659">検証結果</text>
<rect class="box focus" x="74" y="873" width="110" height="169"/>
<text class="title" x="84" y="898">判定の記録</text>
<rect class="box focus" x="74" y="1048" width="110" height="41"/>
<text class="title" x="84" y="1073">状態</text>
<rect class="box focus" x="74" y="1095" width="110" height="186"/>
<text class="title" x="84" y="1120">変更</text>
<rect class="box focus" x="74" y="1287" width="110" height="58"/>
<text class="title" x="84" y="1312">例外</text>
<rect class="box focus" x="74" y="1351" width="110" height="122"/>
<text class="title" x="84" y="1376">探す</text>
<rect class="box focus" x="74" y="1479" width="110" height="41"/>
<text class="title" x="84" y="1504">描画</text>
<rect class="box focus" x="74" y="1526" width="110" height="58"/>
<text class="title" x="84" y="1551">移す</text>
<rect class="box focus" x="74" y="1590" width="110" height="58"/>
<text class="title" x="84" y="1615">経緯</text>
<rect class="box focus" x="74" y="1654" width="110" height="58"/>
<text class="title" x="84" y="1679">外のツール</text>
<rect class="box focus" x="74" y="1718" width="110" height="58"/>
<text class="title" x="84" y="1743">作法</text>
<rect class="box" x="16" y="32" width="50" height="58"/>
<text class="label" x="26" y="57">I1</text>
<rect class="box" x="192" y="32" width="640" height="58"/>
<text class="label" x="202" y="57">Core の語彙 ・ Concrete の契約 ・ 拡張の契約は Abstract だけが持つ。出した Abstract</text>
<text class="label" x="202" y="74">の版は変えず、新しい版を並べて出す。</text>
<rect class="box" x="840" y="32" width="150" height="58"/>
<text class="label" x="850" y="57">U4</text>
<rect class="box" x="16" y="96" width="50" height="41"/>
<text class="label" x="26" y="121">I2</text>
<rect class="box" x="192" y="96" width="640" height="41"/>
<text class="label" x="202" y="121">閉じた一覧は $id の一覧のデータで、一覧に無い $schema は取りに行かずに断る。</text>
<rect class="box" x="840" y="96" width="150" height="41"/>
<text class="label" x="850" y="121">U1 ・ U4</text>
<rect class="box" x="16" y="143" width="50" height="58"/>
<text class="label" x="26" y="168">I3</text>
<rect class="box" x="192" y="143" width="640" height="58"/>
<text class="label" x="202" y="168">Concrete は $schema で Abstract の版を1つ申告し、その版の Concrete</text>
<text class="label" x="202" y="185">の契約と拡張の契約に従う。</text>
<rect class="box" x="840" y="143" width="150" height="58"/>
<text class="label" x="850" y="168">U1 ・ U3</text>
<rect class="box" x="16" y="207" width="50" height="58"/>
<text class="label" x="26" y="232">I4</text>
<rect class="box" x="192" y="207" width="640" height="58"/>
<text class="label" x="202" y="232">rule は判定する者と（AI ・ 人なら）読む欄を持ち、id は Concrete の中で一意。使う term と</text>
<text class="label" x="202" y="249">x- には定義がある。</text>
<rect class="box" x="840" y="207" width="150" height="58"/>
<text class="label" x="850" y="232">U1</text>
<rect class="box" x="16" y="271" width="50" height="58"/>
<text class="label" x="26" y="296">I5</text>
<rect class="box" x="192" y="271" width="640" height="58"/>
<text class="label" x="202" y="296">Concrete が足した x- の定義は作法に従う。Core は意味を解釈せず、</text>
<text class="label" x="202" y="313">宣言された検証役の結果を5つの値と根拠でまとめる。</text>
<rect class="box" x="840" y="271" width="150" height="58"/>
<text class="label" x="850" y="296">U23 ・ U14</text>
<rect class="box" x="16" y="335" width="50" height="41"/>
<text class="label" x="26" y="360">I6</text>
<rect class="box" x="192" y="335" width="640" height="41"/>
<text class="label" x="202" y="360">文脈の語彙の範囲は Concrete の $id で決まり、Core の語彙とぶつかる定義は違反になる。</text>
<rect class="box" x="840" y="335" width="150" height="41"/>
<text class="label" x="850" y="360">U23</text>
<rect class="box" x="16" y="382" width="50" height="41"/>
<text class="label" x="26" y="407">I7</text>
<rect class="box" x="192" y="382" width="640" height="41"/>
<text class="label" x="202" y="407">公開する部分は版を並べて出し、出した版は変えない。読む側は指した版で検証される。</text>
<rect class="box" x="840" y="382" width="150" height="41"/>
<text class="label" x="850" y="407">U24 ・ U1 ・ U2</text>
<rect class="box" x="16" y="429" width="50" height="41"/>
<text class="label" x="26" y="454">I8</text>
<rect class="box" x="192" y="429" width="640" height="41"/>
<text class="label" x="202" y="454">instance は Concrete 1つに従う。$schema が解決できない instance は下書きとして返る。</text>
<rect class="box" x="840" y="429" width="150" height="41"/>
<text class="label" x="850" y="454">U5 ・ U8 ・ U17</text>
<rect class="box" x="16" y="476" width="50" height="58"/>
<text class="label" x="26" y="501">I9</text>
<rect class="box" x="192" y="476" width="640" height="58"/>
<text class="label" x="202" y="501">x-ref の参照先が無ければ基盤が violated にする。参照を壊す変更と、</text>
<text class="label" x="202" y="518">指されたものを消す変更は取り込めない理由に出る。</text>
<rect class="box" x="840" y="476" width="150" height="58"/>
<text class="label" x="850" y="501">U6 ・ U11</text>
<rect class="box" x="16" y="540" width="50" height="41"/>
<text class="label" x="26" y="565">I10</text>
<rect class="box" x="192" y="540" width="640" height="41"/>
<text class="label" x="202" y="565">x-derive の宣言値は導出値と一致し、合わない変更は violated として取り込めない理由に出る。</text>
<rect class="box" x="840" y="540" width="150" height="41"/>
<text class="label" x="850" y="565">U6</text>
<rect class="box" x="16" y="587" width="50" height="41"/>
<text class="label" x="26" y="612">I11</text>
<rect class="box" x="192" y="587" width="640" height="41"/>
<text class="label" x="202" y="612">消した ID は使い直さない。消した instance に結び付いた判定の記録は効かない。</text>
<rect class="box" x="840" y="587" width="150" height="41"/>
<text class="label" x="850" y="612">U11</text>
<rect class="box" x="16" y="634" width="50" height="58"/>
<text class="label" x="26" y="659">I12</text>
<rect class="box" x="192" y="634" width="640" height="58"/>
<text class="label" x="202" y="659">検証結果は rule と拡張した x- ごとに、5つの値のどれか1つ ・ 根拠 ・ 判定した者を持つ。</text>
<text class="label" x="202" y="676">必須の欄が空なら機械の violated。</text>
<rect class="box" x="840" y="634" width="150" height="58"/>
<text class="label" x="850" y="659">U5 ・ U8 ・ U14</text>
<rect class="box" x="16" y="698" width="50" height="41"/>
<text class="label" x="26" y="723">I13</text>
<rect class="box" x="192" y="698" width="640" height="41"/>
<text class="label" x="202" y="723">機械の検証と、決定的な外のツールは、同じ値から同じ結果を返し、手元と CI で同じになる。</text>
<rect class="box" x="840" y="698" width="150" height="41"/>
<text class="label" x="850" y="723">U8</text>
<rect class="box" x="16" y="745" width="50" height="58"/>
<text class="label" x="26" y="770">I14</text>
<rect class="box" x="192" y="745" width="640" height="58"/>
<text class="label" x="202" y="770">AI には読む欄 ・ term ・ 参照先の値の写しだけを渡す。根拠が空か読んだ値に無い答えと、</text>
<text class="label" x="202" y="787">割れた答えは unverified。</text>
<rect class="box" x="840" y="745" width="150" height="58"/>
<text class="label" x="850" y="770">U5 ・ U8</text>
<rect class="box" x="16" y="809" width="50" height="58"/>
<text class="label" x="26" y="834">I15</text>
<rect class="box" x="192" y="809" width="640" height="58"/>
<text class="label" x="202" y="834">検証役が無い ・ tool permissions に無い ・ 答えないときは、隠さず決めた値で返し、手元と CI</text>
<text class="label" x="202" y="851">で同じになる。</text>
<rect class="box" x="840" y="809" width="150" height="58"/>
<text class="label" x="850" y="834">U8 ・ U14</text>
<rect class="box" x="16" y="873" width="50" height="58"/>
<text class="label" x="26" y="898">I16</text>
<rect class="box" x="192" y="873" width="640" height="58"/>
<text class="label" x="202" y="898">AI と人の判定は判定の記録として変更に入れ、判定した値を残す。いまの値と等しければ聞き直さず、</text>
<text class="label" x="202" y="915">違えば効かない。</text>
<rect class="box" x="840" y="873" width="150" height="58"/>
<text class="label" x="850" y="898">U10 ・ U16 ・ U8</text>
<rect class="box" x="16" y="937" width="50" height="41"/>
<text class="label" x="26" y="962">I17</text>
<rect class="box" x="192" y="937" width="640" height="41"/>
<text class="label" x="202" y="962">状態は、変更に入れた判定の記録だけから導く。CI は AI に聞き直さず、記録が無ければ無いと返す。</text>
<rect class="box" x="840" y="937" width="150" height="41"/>
<text class="label" x="850" y="962">U8 ・ U13</text>
<rect class="box" x="16" y="984" width="50" height="58"/>
<text class="label" x="26" y="1009">I18</text>
<rect class="box" x="192" y="984" width="640" height="58"/>
<text class="label" x="202" y="1009">人が覆せるのは AI と人の rule の結果だけ。人の判定は、</text>
<text class="label" x="202" y="1026">変更の仕組みが人と約束した変更でだけ足せる。</text>
<rect class="box" x="840" y="984" width="150" height="58"/>
<text class="label" x="850" y="1009">U16</text>
<rect class="box" x="16" y="1048" width="50" height="41"/>
<text class="label" x="26" y="1073">I19</text>
<rect class="box" x="192" y="1048" width="640" height="41"/>
<text class="label" x="202" y="1073">instance の状態は保存せず、検証結果と判定の記録から決定表で導く。</text>
<rect class="box" x="840" y="1048" width="150" height="41"/>
<text class="label" x="850" y="1073">U0 ・ U12</text>
<rect class="box" x="16" y="1095" width="50" height="58"/>
<text class="label" x="26" y="1120">I20</text>
<rect class="box" x="192" y="1095" width="640" height="58"/>
<text class="label" x="202" y="1120">変更（取り込みを含む）には、変更後の全 instance の状態 ・ 変わったもの ・ 人が見るもの ・</text>
<text class="label" x="202" y="1137">取り込めない理由を出す。</text>
<rect class="box" x="840" y="1095" width="150" height="58"/>
<text class="label" x="850" y="1120">U2 ・ U7 ・ U8 ・</text>
<text class="label" x="850" y="1137">U10 ・ U18</text>
<rect class="box" x="16" y="1159" width="50" height="58"/>
<text class="label" x="26" y="1184">I21</text>
<rect class="box" x="192" y="1159" width="640" height="58"/>
<text class="label" x="202" y="1184">AI が出した変更は、Concrete の変えてよい範囲の中だけを変える。</text>
<text class="label" x="202" y="1201">外を変えたら取り込めない理由に出る。</text>
<rect class="box" x="840" y="1159" width="150" height="58"/>
<text class="label" x="850" y="1184">U5 ・ U6</text>
<rect class="box" x="16" y="1223" width="50" height="58"/>
<text class="label" x="26" y="1248">I22</text>
<rect class="box" x="192" y="1223" width="640" height="58"/>
<text class="label" x="202" y="1248">同じ instance × rule の判定を両方で変えた取り込みは、基盤が片方を選ばず、衝突として人に出</text>
<text class="label" x="202" y="1265">る。</text>
<rect class="box" x="840" y="1223" width="150" height="58"/>
<text class="label" x="850" y="1248">U18</text>
<rect class="box" x="16" y="1287" width="50" height="58"/>
<text class="label" x="26" y="1312">I23</text>
<rect class="box" x="192" y="1287" width="640" height="58"/>
<text class="label" x="202" y="1312">判定できなかった rule は、原因ごとにまとめて人が見るものに出る。判断されないものは</text>
<text class="label" x="202" y="1329">unverified のまま。</text>
<rect class="box" x="840" y="1287" width="150" height="58"/>
<text class="label" x="850" y="1312">U16</text>
<rect class="box" x="16" y="1351" width="50" height="58"/>
<text class="label" x="26" y="1376">I24</text>
<rect class="box" x="192" y="1351" width="640" height="58"/>
<text class="label" x="202" y="1376">探すは、いまの入力に対する判定の結果と状態だけを使い、効かなくなった判定を verified</text>
<text class="label" x="202" y="1393">として返さない。</text>
<rect class="box" x="840" y="1351" width="150" height="58"/>
<text class="label" x="850" y="1376">U5 ・ U6 ・ U12</text>
<rect class="box" x="16" y="1415" width="50" height="58"/>
<text class="label" x="26" y="1440">I25</text>
<rect class="box" x="192" y="1415" width="640" height="58"/>
<text class="label" x="202" y="1440">term は版付きの名前で一致を決め、別の版の term は別の語として探す。</text>
<text class="label" x="202" y="1457">公開された言葉は読む側の指した版で探す。</text>
<rect class="box" x="840" y="1415" width="150" height="58"/>
<text class="label" x="850" y="1440">U12 ・ U24</text>
<rect class="box" x="16" y="1479" width="50" height="41"/>
<text class="label" x="26" y="1504">I26</text>
<rect class="box" x="192" y="1479" width="640" height="41"/>
<text class="label" x="202" y="1504">描画は状態と rule ごとの結果を内容と一緒に示し、失敗したら1ページも書かない。</text>
<rect class="box" x="840" y="1479" width="150" height="41"/>
<text class="label" x="850" y="1504">U12</text>
<rect class="box" x="16" y="1526" width="50" height="58"/>
<text class="label" x="26" y="1551">I27</text>
<rect class="box" x="192" y="1526" width="640" height="58"/>
<text class="label" x="202" y="1551">Abstract の新しい版は移し方を持つ。移せない箇所は理由と一緒に返り、いまの Concrete は壊れな</text>
<text class="label" x="202" y="1568">い。</text>
<rect class="box" x="840" y="1526" width="150" height="58"/>
<text class="label" x="850" y="1551">U3 ・ U4</text>
<rect class="box" x="16" y="1590" width="50" height="58"/>
<text class="label" x="26" y="1615">I28</text>
<rect class="box" x="192" y="1590" width="640" height="58"/>
<text class="label" x="202" y="1615">判定の記録は判定した者 ・ 入力 ・ 根拠を持ち、変更の履歴と合わせて誰がいつ何を判定したかが分か</text>
<text class="label" x="202" y="1632">る。</text>
<rect class="box" x="840" y="1590" width="150" height="58"/>
<text class="label" x="850" y="1615">U13</text>
<rect class="box" x="16" y="1654" width="50" height="58"/>
<text class="label" x="26" y="1679">I29</text>
<rect class="box" x="192" y="1654" width="640" height="58"/>
<text class="label" x="202" y="1679">検証役は tool permissions に名前があるものだけを呼び、渡すのはその x- の場所 ・ 値 ・</text>
<text class="label" x="202" y="1696">読む欄の値だけ。</text>
<rect class="box" x="840" y="1654" width="150" height="58"/>
<text class="label" x="850" y="1679">U14 ・ U23</text>
<rect class="box" x="16" y="1718" width="50" height="58"/>
<text class="label" x="26" y="1743">I30</text>
<rect class="box" x="192" y="1718" width="640" height="58"/>
<text class="label" x="202" y="1743">作法には版があり、Concrete は従う版を申告する。出した作法の版は変えず、Core</text>
<text class="label" x="202" y="1760">を更新しても作法を保つ。</text>
<rect class="box" x="840" y="1718" width="150" height="58"/>
<text class="label" x="850" y="1743">U3 ・ U4 ・ U23</text>
</svg>