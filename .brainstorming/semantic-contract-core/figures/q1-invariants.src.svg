<svg viewBox="0 0 1006 2240" style="min-width:900px" role="img" aria-label="不変条件37行：対象ごとに固め、導いた使う場面を付けた表">
<text class="note" x="20" y="22">#</text>
<text class="note" x="78" y="22">対象</text>
<text class="note" x="196" y="22">不変条件</text>
<text class="note" x="844" y="22">使う場面</text>
<rect class="box focus" x="74" y="32" width="110" height="105"/>
<text class="title" x="84" y="57">Abstract</text>
<rect class="box focus" x="74" y="143" width="110" height="280"/>
<text class="title" x="84" y="168">Concrete</text>
<rect class="box focus" x="74" y="429" width="110" height="216"/>
<text class="title" x="84" y="454">instance</text>
<rect class="box focus" x="74" y="651" width="110" height="233"/>
<text class="title" x="84" y="676">検証結果</text>
<rect class="box focus" x="74" y="890" width="110" height="169"/>
<text class="title" x="84" y="915">判定の記録</text>
<rect class="box focus" x="74" y="1065" width="110" height="41"/>
<text class="title" x="84" y="1090">状態</text>
<rect class="box focus" x="74" y="1112" width="110" height="186"/>
<text class="title" x="84" y="1137">変更</text>
<rect class="box focus" x="74" y="1304" width="110" height="58"/>
<text class="title" x="84" y="1329">例外</text>
<rect class="box focus" x="74" y="1368" width="110" height="122"/>
<text class="title" x="84" y="1393">探す</text>
<rect class="box focus" x="74" y="1496" width="110" height="41"/>
<text class="title" x="84" y="1521">描画</text>
<rect class="box focus" x="74" y="1543" width="110" height="58"/>
<text class="title" x="84" y="1568">移す</text>
<rect class="box focus" x="74" y="1607" width="110" height="58"/>
<text class="title" x="84" y="1632">経緯</text>
<rect class="box focus" x="74" y="1671" width="110" height="58"/>
<text class="title" x="84" y="1696">外のツール</text>
<rect class="box focus" x="74" y="1735" width="110" height="58"/>
<text class="title" x="84" y="1760">作法</text>
<rect class="box focus" x="74" y="1799" width="110" height="233"/>
<text class="title" x="84" y="1824">変更の記録</text>
<rect class="box focus" x="74" y="2038" width="110" height="58"/>
<text class="title" x="84" y="2063">まとめ方</text>
<rect class="box focus" x="74" y="2102" width="110" height="58"/>
<text class="title" x="84" y="2127">変更を見せる</text>
<rect class="box focus" x="74" y="2166" width="110" height="58"/>
<text class="title" x="84" y="2191">変更の記録</text>
<rect class="box" x="16" y="32" width="50" height="58"/>
<text class="label" x="26" y="57">I1</text>
<rect class="box" x="192" y="32" width="640" height="58"/>
<text class="label" x="202" y="57">Core の語彙 ・ Concrete の契約 ・ 拡張の契約は Abstract だけが持つ。出した Abstract</text>
<text class="label" x="202" y="74">の版は変えず、新しい版を並べて出す。</text>
<rect class="box" x="840" y="32" width="150" height="58"/>
<text class="label" x="850" y="57">U4</text>
<rect class="box" x="16" y="96" width="50" height="41"/>
<text class="label" x="26" y="121">I2</text>
<rect class="box" x="192" y="96" width="640" height="41"/>
<text class="label" x="202" y="121">閉じた一覧は $id の一覧のデータで、一覧に無い $schema は取りに行かずに断る。</text>
<rect class="box" x="840" y="96" width="150" height="41"/>
<text class="label" x="850" y="121">U1 ・ U4</text>
<rect class="box" x="16" y="143" width="50" height="58"/>
<text class="label" x="26" y="168">I3</text>
<rect class="box" x="192" y="143" width="640" height="58"/>
<text class="label" x="202" y="168">Concrete は $schema で Abstract の版を1つ申告し、その版の Concrete</text>
<text class="label" x="202" y="185">の契約と拡張の契約に従う。</text>
<rect class="box" x="840" y="143" width="150" height="58"/>
<text class="label" x="850" y="168">U1 ・ U3</text>
<rect class="box" x="16" y="207" width="50" height="58"/>
<text class="label" x="26" y="232">I4</text>
<rect class="box" x="192" y="207" width="640" height="58"/>
<text class="label" x="202" y="232">rule は判定する者と（AI ・ 人なら）読む欄を持ち、id は Concrete の中で一意。使う term と</text>
<text class="label" x="202" y="249">x- には定義がある。</text>
<rect class="box" x="840" y="207" width="150" height="58"/>
<text class="label" x="850" y="232">U1</text>
<rect class="box" x="16" y="271" width="50" height="58"/>
<text class="label" x="26" y="296">I5</text>
<rect class="box" x="192" y="271" width="640" height="58"/>
<text class="label" x="202" y="296">Concrete が足した x- の定義は作法に従う。Core は意味を解釈せず、</text>
<text class="label" x="202" y="313">宣言された検証役の結果を5つの値と根拠でまとめる。</text>
<rect class="box" x="840" y="271" width="150" height="58"/>
<text class="label" x="850" y="296">U23 ・ U14</text>
<rect class="box" x="16" y="335" width="50" height="41"/>
<text class="label" x="26" y="360">I6</text>
<rect class="box" x="192" y="335" width="640" height="41"/>
<text class="label" x="202" y="360">文脈の語彙の範囲は Concrete の $id で決まり、Core の語彙とぶつかる定義は違反になる。</text>
<rect class="box" x="840" y="335" width="150" height="41"/>
<text class="label" x="850" y="360">U23</text>
<rect class="box" x="16" y="382" width="50" height="41"/>
<text class="label" x="26" y="407">I7</text>
<rect class="box" x="192" y="382" width="640" height="41"/>
<text class="label" x="202" y="407">公開する部分は版を並べて出し、出した版は変えない。読む側は指した版で検証される。</text>
<rect class="box" x="840" y="382" width="150" height="41"/>
<text class="label" x="850" y="407">U24 ・ U1 ・ U2</text>
<rect class="box" x="16" y="429" width="50" height="41"/>
<text class="label" x="26" y="454">I8</text>
<rect class="box" x="192" y="429" width="640" height="41"/>
<text class="label" x="202" y="454">instance は Concrete 1つに従う。$schema が解決できない instance は下書きとして返る。</text>
<rect class="box" x="840" y="429" width="150" height="41"/>
<text class="label" x="850" y="454">U5 ・ U8 ・ U17</text>
<rect class="box" x="16" y="476" width="50" height="58"/>
<text class="label" x="26" y="501">I9</text>
<rect class="box" x="192" y="476" width="640" height="58"/>
<text class="label" x="202" y="501">x-ref の参照先が無ければ基盤が violated にする。参照を壊す変更と、</text>
<text class="label" x="202" y="518">指されたものを消す変更は取り込めない理由に出る。</text>
<rect class="box" x="840" y="476" width="150" height="58"/>
<text class="label" x="850" y="501">U6 ・ U11</text>
<rect class="box" x="16" y="540" width="50" height="41"/>
<text class="label" x="26" y="565">I10</text>
<rect class="box" x="192" y="540" width="640" height="41"/>
<text class="label" x="202" y="565">x-derive の宣言値は導出値と一致し、合わない変更は violated として取り込めない理由に出る。</text>
<rect class="box" x="840" y="540" width="150" height="41"/>
<text class="label" x="850" y="565">U6</text>
<rect class="box" x="16" y="587" width="50" height="58"/>
<text class="label" x="26" y="612">I11</text>
<rect class="box" x="192" y="587" width="640" height="58"/>
<text class="label" x="202" y="612">消した ID は使い直さない。消した instance に結び付いた判定の記録は効かない。</text>
<text class="label" x="202" y="629">変更の記録は経緯として残る。</text>
<rect class="box" x="840" y="587" width="150" height="58"/>
<text class="label" x="850" y="612">U11 ・ U13</text>
<rect class="box" x="16" y="651" width="50" height="58"/>
<text class="label" x="26" y="676">I12</text>
<rect class="box" x="192" y="651" width="640" height="58"/>
<text class="label" x="202" y="676">検証結果は rule と拡張した x- ごとに、5つの値のどれか1つ ・ 根拠 ・ 判定した者を持つ。</text>
<text class="label" x="202" y="693">必須の欄が空なら機械の violated。</text>
<rect class="box" x="840" y="651" width="150" height="58"/>
<text class="label" x="850" y="676">U5 ・ U8 ・ U14</text>
<rect class="box" x="16" y="715" width="50" height="41"/>
<text class="label" x="26" y="740">I13</text>
<rect class="box" x="192" y="715" width="640" height="41"/>
<text class="label" x="202" y="740">機械の検証と、決定的な外のツールは、同じ値から同じ結果を返し、手元と CI で同じになる。</text>
<rect class="box" x="840" y="715" width="150" height="41"/>
<text class="label" x="850" y="740">U8</text>
<rect class="box" x="16" y="762" width="50" height="58"/>
<text class="label" x="26" y="787">I14</text>
<rect class="box" x="192" y="762" width="640" height="58"/>
<text class="label" x="202" y="787">AI には読む欄 ・ term ・ 参照先の値の写しだけを渡す。根拠が空か読んだ値に無い答えと、</text>
<text class="label" x="202" y="804">割れた答えは unverified。</text>
<rect class="box" x="840" y="762" width="150" height="58"/>
<text class="label" x="850" y="787">U5 ・ U8</text>
<rect class="box" x="16" y="826" width="50" height="58"/>
<text class="label" x="26" y="851">I15</text>
<rect class="box" x="192" y="826" width="640" height="58"/>
<text class="label" x="202" y="851">検証役が無い ・ tool permissions に無い ・ 答えないときは、隠さず決めた値で返し、手元と CI</text>
<text class="label" x="202" y="868">で同じになる。</text>
<rect class="box" x="840" y="826" width="150" height="58"/>
<text class="label" x="850" y="851">U8 ・ U14</text>
<rect class="box" x="16" y="890" width="50" height="58"/>
<text class="label" x="26" y="915">I16</text>
<rect class="box" x="192" y="890" width="640" height="58"/>
<text class="label" x="202" y="915">AI と人の判定は判定の記録として変更に入れ、判定した値を残す。いまの値と等しければ聞き直さず、</text>
<text class="label" x="202" y="932">違えば効かない。</text>
<rect class="box" x="840" y="890" width="150" height="58"/>
<text class="label" x="850" y="915">U10 ・ U16 ・ U8</text>
<rect class="box" x="16" y="954" width="50" height="41"/>
<text class="label" x="26" y="979">I17</text>
<rect class="box" x="192" y="954" width="640" height="41"/>
<text class="label" x="202" y="979">状態は、変更に入れた判定の記録だけから導く。CI は AI に聞き直さず、記録が無ければ無いと返す。</text>
<rect class="box" x="840" y="954" width="150" height="41"/>
<text class="label" x="850" y="979">U8 ・ U13</text>
<rect class="box" x="16" y="1001" width="50" height="58"/>
<text class="label" x="26" y="1026">I18</text>
<rect class="box" x="192" y="1001" width="640" height="58"/>
<text class="label" x="202" y="1026">人が覆せるのは AI と人の rule の結果だけ。人の判定は、</text>
<text class="label" x="202" y="1043">変更の仕組みが人と約束した変更でだけ足せる。</text>
<rect class="box" x="840" y="1001" width="150" height="58"/>
<text class="label" x="850" y="1026">U16</text>
<rect class="box" x="16" y="1065" width="50" height="41"/>
<text class="label" x="26" y="1090">I19</text>
<rect class="box" x="192" y="1065" width="640" height="41"/>
<text class="label" x="202" y="1090">instance の状態は保存せず、検証結果と判定の記録から決定表で導く。</text>
<rect class="box" x="840" y="1065" width="150" height="41"/>
<text class="label" x="850" y="1090">U0 ・ U12</text>
<rect class="box" x="16" y="1112" width="50" height="58"/>
<text class="label" x="26" y="1137">I20</text>
<rect class="box" x="192" y="1112" width="640" height="58"/>
<text class="label" x="202" y="1137">変更（変更の仕組みの単位。Git ではブランチと PR。取り込みを含む）には、変更後の全 instance</text>
<text class="label" x="202" y="1154">の状態 ・ 変わったもの ・ 人が見るもの ・ 取り込めない理由を出す。</text>
<rect class="box" x="840" y="1112" width="150" height="58"/>
<text class="label" x="850" y="1137">U2 ・ U7 ・ U8 ・</text>
<text class="label" x="850" y="1154">U10 ・ U18</text>
<rect class="box" x="16" y="1176" width="50" height="58"/>
<text class="label" x="26" y="1201">I21</text>
<rect class="box" x="192" y="1176" width="640" height="58"/>
<text class="label" x="202" y="1201">AI が出した変更は、Concrete の変えてよい範囲の中だけを変える。</text>
<text class="label" x="202" y="1218">外を変えたら取り込めない理由に出る。</text>
<rect class="box" x="840" y="1176" width="150" height="58"/>
<text class="label" x="850" y="1201">U5 ・ U6</text>
<rect class="box" x="16" y="1240" width="50" height="58"/>
<text class="label" x="26" y="1265">I22</text>
<rect class="box" x="192" y="1240" width="640" height="58"/>
<text class="label" x="202" y="1265">同じ instance × rule の判定、または同じ対象の同じ欄を両方で変えた取り込みは、</text>
<text class="label" x="202" y="1282">基盤が片方を選ばず、衝突として人に出る。</text>
<rect class="box" x="840" y="1240" width="150" height="58"/>
<text class="label" x="850" y="1265">U18</text>
<rect class="box" x="16" y="1304" width="50" height="58"/>
<text class="label" x="26" y="1329">I23</text>
<rect class="box" x="192" y="1304" width="640" height="58"/>
<text class="label" x="202" y="1329">判定できなかった rule は、原因ごとにまとめて人が見るものに出る。判断されないものは</text>
<text class="label" x="202" y="1346">unverified のまま。</text>
<rect class="box" x="840" y="1304" width="150" height="58"/>
<text class="label" x="850" y="1329">U16</text>
<rect class="box" x="16" y="1368" width="50" height="58"/>
<text class="label" x="26" y="1393">I24</text>
<rect class="box" x="192" y="1368" width="640" height="58"/>
<text class="label" x="202" y="1393">探すは、いまの入力に対する判定の結果と状態だけを使い、効かなくなった判定を verified</text>
<text class="label" x="202" y="1410">として返さない。</text>
<rect class="box" x="840" y="1368" width="150" height="58"/>
<text class="label" x="850" y="1393">U5 ・ U6 ・ U12</text>
<rect class="box" x="16" y="1432" width="50" height="58"/>
<text class="label" x="26" y="1457">I25</text>
<rect class="box" x="192" y="1432" width="640" height="58"/>
<text class="label" x="202" y="1457">term は版付きの名前で一致を決め、別の版の term は別の語として探す。</text>
<text class="label" x="202" y="1474">公開された言葉は読む側の指した版で探す。</text>
<rect class="box" x="840" y="1432" width="150" height="58"/>
<text class="label" x="850" y="1457">U12 ・ U24</text>
<rect class="box" x="16" y="1496" width="50" height="41"/>
<text class="label" x="26" y="1521">I26</text>
<rect class="box" x="192" y="1496" width="640" height="41"/>
<text class="label" x="202" y="1521">描画は状態と rule ごとの結果を内容と一緒に示し、失敗したら1ページも書かない。</text>
<rect class="box" x="840" y="1496" width="150" height="41"/>
<text class="label" x="850" y="1521">U12</text>
<rect class="box" x="16" y="1543" width="50" height="58"/>
<text class="label" x="26" y="1568">I27</text>
<rect class="box" x="192" y="1543" width="640" height="58"/>
<text class="label" x="202" y="1568">Abstract の新しい版は移し方を持つ。移せない箇所は理由と一緒に返り、いまの Concrete は壊れな</text>
<text class="label" x="202" y="1585">い。</text>
<rect class="box" x="840" y="1543" width="150" height="58"/>
<text class="label" x="850" y="1568">U3 ・ U4</text>
<rect class="box" x="16" y="1607" width="50" height="58"/>
<text class="label" x="26" y="1632">I28</text>
<rect class="box" x="192" y="1607" width="640" height="58"/>
<text class="label" x="202" y="1632">判定の記録（判定した者 ・ 入力 ・ 根拠）と変更の記録（セッション ・ 理由 ・ 欄）から、</text>
<text class="label" x="202" y="1649">誰がいつ何を変え、何を判定したかが分かる。</text>
<rect class="box" x="840" y="1607" width="150" height="58"/>
<text class="label" x="850" y="1632">U13 ・ U25</text>
<rect class="box" x="16" y="1671" width="50" height="58"/>
<text class="label" x="26" y="1696">I29</text>
<rect class="box" x="192" y="1671" width="640" height="58"/>
<text class="label" x="202" y="1696">検証役は tool permissions に名前があるものだけを呼び、渡すのはその x- の場所 ・ 値 ・</text>
<text class="label" x="202" y="1713">読む欄の値だけ。</text>
<rect class="box" x="840" y="1671" width="150" height="58"/>
<text class="label" x="850" y="1696">U14 ・ U23</text>
<rect class="box" x="16" y="1735" width="50" height="58"/>
<text class="label" x="26" y="1760">I30</text>
<rect class="box" x="192" y="1735" width="640" height="58"/>
<text class="label" x="202" y="1760">作法には版があり、Concrete は従う版を申告する。出した作法の版は変えず、Core</text>
<text class="label" x="202" y="1777">を更新しても作法を保つ。</text>
<rect class="box" x="840" y="1735" width="150" height="58"/>
<text class="label" x="850" y="1760">U3 ・ U4 ・ U23</text>
<rect class="box" x="16" y="1799" width="50" height="58"/>
<text class="label" x="26" y="1824">I31</text>
<rect class="box" x="192" y="1799" width="640" height="58"/>
<text class="label" x="202" y="1824">変更の記録は理由と変更の項目を持ち、instance とは別に書く。記録と変更の前後を両方向で突き合わ</text>
<text class="label" x="202" y="1841">せ、記録の無い書き換えは「記録に無い」、書き換えの無い記録は「変更の無い記録」として出る。</text>
<rect class="box" x="840" y="1799" width="150" height="58"/>
<text class="label" x="850" y="1824">U2 ・ U5 ・ U6 ・</text>
<text class="label" x="850" y="1841">U7 ・ U10</text>
<rect class="box" x="16" y="1863" width="50" height="58"/>
<text class="label" x="26" y="1888">I32</text>
<rect class="box" x="192" y="1863" width="640" height="58"/>
<text class="label" x="202" y="1888">理由の無い変更も保存は断らず、「理由が無い」変更の例外として出る。書いた記録は書き換えず、</text>
<text class="label" x="202" y="1905">書き換え ・ 削除は「記録の書き換え」として出る。</text>
<rect class="box" x="840" y="1863" width="150" height="58"/>
<text class="label" x="850" y="1888">U25 ・ U13</text>
<rect class="box" x="16" y="1927" width="50" height="58"/>
<text class="label" x="26" y="1952">I33</text>
<rect class="box" x="192" y="1927" width="640" height="58"/>
<text class="label" x="202" y="1952">理由と変更の項目が合っているかは Core の rule で、変更を書いた AI と別のセッションの AI</text>
<text class="label" x="202" y="1969">が判定し、violated ・ unverified を変更の例外に出す。</text>
<rect class="box" x="840" y="1927" width="150" height="58"/>
<text class="label" x="850" y="1952">U25</text>
<rect class="box" x="16" y="1991" width="50" height="41"/>
<text class="label" x="26" y="2016">I34</text>
<rect class="box" x="192" y="1991" width="640" height="41"/>
<text class="label" x="202" y="2016">セッションの参照は呼ぶ側の申告なので、経緯にだけ使い、I18 の権限の判定には使わない。</text>
<rect class="box" x="840" y="1991" width="150" height="41"/>
<text class="label" x="850" y="2016">U13 ・ U16</text>
<rect class="box" x="16" y="2038" width="50" height="58"/>
<text class="label" x="26" y="2063">I35</text>
<rect class="box" x="192" y="2038" width="640" height="58"/>
<text class="label" x="202" y="2063">まとまりは保存しない。出すたびにセッション ・ 目的の参照 ・ 対象の id で記録を引いて組み立て、</text>
<text class="label" x="202" y="2080">1つの変更の記録は1回の出力で1回だけ出る。親のセッションで引くと子孫のセッションも含む。</text>
<rect class="box" x="840" y="2038" width="150" height="58"/>
<text class="label" x="850" y="2063">U25 ・ U13</text>
<rect class="box" x="16" y="2102" width="50" height="58"/>
<text class="label" x="26" y="2127">I36</text>
<rect class="box" x="192" y="2102" width="640" height="58"/>
<text class="label" x="202" y="2127">変更の例外を件数と一緒に先頭に出し、見ていないもの（ソースコード ・ テストのコード）を示す。</text>
<text class="label" x="202" y="2144">x-ref ・ x-derive で一緒に変わった欄は原因の変更の下へまとめる。</text>
<rect class="box" x="840" y="2102" width="150" height="58"/>
<text class="label" x="850" y="2127">U25</text>
<rect class="box" x="16" y="2166" width="50" height="58"/>
<text class="label" x="26" y="2191">I37</text>
<rect class="box" x="192" y="2166" width="640" height="58"/>
<text class="label" x="202" y="2191">変更の記録の id は、ほかの書き手と打ち合わせずに一意に決まる値にし、</text>
<text class="label" x="202" y="2208">別の変更で足した記録どうしが取り込みで衝突しない。</text>
<rect class="box" x="840" y="2166" width="150" height="58"/>
<text class="label" x="850" y="2191">U18 ・ U25</text>
</svg>