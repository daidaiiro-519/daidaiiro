<svg viewBox="0 0 1022 1685" style="min-width:900px" role="img" aria-label="不変条件：概念ごとに固め、確かめる試験を付けた表">
<text class="note" x="20" y="22">#</text>
<text class="note" x="84" y="22">概念</text>
<text class="note" x="262" y="22">不変条件</text>
<text class="note" x="830" y="22">確かめる試験</text>
<rect class="box focus" x="80" y="32" width="170" height="122"/>
<text class="title" x="90" y="57">版と語（値オブジェク</text>
<text class="title" x="90" y="74">ト）</text>
<rect class="box focus" x="80" y="160" width="170" height="378"/>
<text class="title" x="90" y="185">承認を通すもの（</text>
<text class="title" x="90" y="202">Concrete の集約）</text>
<rect class="box focus" x="80" y="544" width="170" height="58"/>
<text class="title" x="90" y="569">rule（Concrete の集</text>
<text class="title" x="90" y="586">約）</text>
<rect class="box focus" x="80" y="608" width="170" height="280"/>
<text class="title" x="90" y="633">instance（集約）</text>
<rect class="box focus" x="80" y="894" width="170" height="250"/>
<text class="title" x="90" y="919">検証の記録（集約）</text>
<rect class="box focus" x="80" y="1150" width="170" height="233"/>
<text class="title" x="90" y="1175">人の判断（集約）</text>
<rect class="box focus" x="80" y="1389" width="170" height="186"/>
<text class="title" x="90" y="1414">状態を導く（ドメインサ</text>
<text class="title" x="90" y="1431">ービス）</text>
<rect class="box focus" x="80" y="1581" width="170" height="88"/>
<text class="title" x="90" y="1606">集約に共通</text>
<rect class="box" x="16" y="32" width="56" height="58"/>
<text class="label" x="26" y="57">J1</text>
<rect class="box" x="258" y="32" width="560" height="58"/>
<text class="label" x="268" y="57">公開した Concrete の版 ・ 割り当て ・ term ・ Abstract は中身を変えない。</text>
<text class="label" x="268" y="74">変えるときは新しい版を並べて出す。</text>
<rect class="box" x="826" y="32" width="180" height="58"/>
<text class="label" x="836" y="57">S21 ・ T1 ・ T3</text>
<rect class="box" x="16" y="96" width="56" height="58"/>
<text class="label" x="26" y="121">J2</text>
<rect class="box" x="258" y="96" width="560" height="58"/>
<text class="label" x="268" y="121">term の版付きの名前は、どの文脈から指しても定義1つに決まる。</text>
<rect class="box" x="826" y="96" width="180" height="58"/>
<text class="label" x="836" y="121">承認の依頼で検査する（モ</text>
<text class="label" x="836" y="138">デルの外）</text>
<rect class="box" x="16" y="160" width="56" height="58"/>
<text class="label" x="26" y="185">J3</text>
<rect class="box" x="258" y="160" width="560" height="58"/>
<text class="label" x="268" y="185">Concrete の版と validator の割り当ては、人が承認したものだけが検証に使われる。</text>
<rect class="box" x="826" y="160" width="180" height="58"/>
<text class="label" x="836" y="185">S3 ・ T3 ・ T4</text>
<rect class="box" x="16" y="224" width="56" height="58"/>
<text class="label" x="26" y="249">J4</text>
<rect class="box" x="258" y="224" width="560" height="58"/>
<text class="label" x="268" y="249">承認は依頼した時点の中身のハッシュに結び付き、いまの中身と違えば断られる。</text>
<text class="label" x="268" y="266">依頼のあとに書けば依頼は取り下げになる。</text>
<rect class="box" x="826" y="224" width="180" height="58"/>
<text class="label" x="836" y="249">S3 ・ T3：承認待ち ×</text>
<text class="label" x="836" y="266">書く</text>
<rect class="box" x="16" y="288" width="56" height="58"/>
<text class="label" x="26" y="313">J5</text>
<rect class="box" x="258" y="288" width="560" height="58"/>
<text class="label" x="268" y="313">承認の依頼は、試した結果（結果が変わる instance）と、AI の rule</text>
<text class="label" x="268" y="330">ごとに決めた件数の抜き取りへの人の判断を持つ。</text>
<rect class="box" x="826" y="288" width="180" height="58"/>
<text class="label" x="836" y="313">S16 ・ S17 ・ T3 ・ T4</text>
<rect class="box" x="16" y="352" width="56" height="58"/>
<text class="label" x="26" y="377">J6</text>
<rect class="box" x="258" y="352" width="560" height="58"/>
<text class="label" x="268" y="377">承認 ・ 差し戻し ・ 人の判断 ・ 取り消し ・ 取り込みの確定は、</text>
<text class="label" x="268" y="394">人の操作の入口からだけ行える。</text>
<rect class="box" x="826" y="352" width="180" height="58"/>
<text class="label" x="836" y="377">S15 ・ S19 ・ T1 ・</text>
<text class="label" x="836" y="394">T3 ・ T4 ・ T5</text>
<rect class="box" x="16" y="416" width="56" height="58"/>
<text class="label" x="26" y="441">J7</text>
<rect class="box" x="258" y="416" width="560" height="58"/>
<text class="label" x="268" y="441">validator の割り当ては Concrete に1つで、公開したすべての版に効く。</text>
<rect class="box" x="826" y="416" width="180" height="58"/>
<text class="label" x="836" y="441">S2 ・ T4</text>
<rect class="box" x="16" y="480" width="56" height="58"/>
<text class="label" x="26" y="505">J8</text>
<rect class="box" x="258" y="480" width="560" height="58"/>
<text class="label" x="268" y="505">版を引退させるのは従う instance が無いときだけで、引退した版に従う instance</text>
<text class="label" x="268" y="522">は下書きとして返る。</text>
<rect class="box" x="826" y="480" width="180" height="58"/>
<text class="label" x="836" y="505">T3：引退させる ・ D</text>
<rect class="box" x="16" y="544" width="56" height="58"/>
<text class="label" x="26" y="569">J9</text>
<rect class="box" x="258" y="544" width="560" height="58"/>
<text class="label" x="268" y="569">AI と人が判定する rule は読む欄を持ち、AI には読む欄 ・ term ・</text>
<text class="label" x="268" y="586">参照先の値だけを渡す。</text>
<rect class="box" x="826" y="544" width="180" height="58"/>
<text class="label" x="836" y="569">S11 ・ T3</text>
<rect class="box" x="16" y="608" width="56" height="58"/>
<text class="label" x="26" y="633">J10</text>
<rect class="box" x="258" y="608" width="560" height="58"/>
<text class="label" x="268" y="633">instance は公開した版1つに従い、版を変えるのは移すだけである。</text>
<text class="label" x="268" y="650">移すと下書きか検証待ちになるなら元の版に残る。</text>
<rect class="box" x="826" y="608" width="180" height="58"/>
<text class="label" x="836" y="633">S8 ・ T5</text>
<rect class="box" x="16" y="672" width="56" height="58"/>
<text class="label" x="26" y="697">J11</text>
<rect class="box" x="258" y="672" width="560" height="58"/>
<text class="label" x="268" y="697">instance の保存は、読んだ時点のハッシュが一致し、</text>
<text class="label" x="268" y="714">変える欄が版の決めた変えてよい範囲の中にあるときだけ成り立つ。</text>
<rect class="box" x="826" y="672" width="180" height="58"/>
<text class="label" x="836" y="697">S22 ・ T5</text>
<rect class="box" x="16" y="736" width="56" height="41"/>
<text class="label" x="26" y="761">J12</text>
<rect class="box" x="258" y="736" width="560" height="41"/>
<text class="label" x="268" y="761">消すのは、ほかの instance が x-ref で指していない instance だけである。</text>
<rect class="box" x="826" y="736" width="180" height="41"/>
<text class="label" x="836" y="761">S18 ・ T5</text>
<rect class="box" x="16" y="783" width="56" height="41"/>
<text class="label" x="26" y="808">J13</text>
<rect class="box" x="258" y="783" width="560" height="41"/>
<text class="label" x="268" y="808">消した ID と無い ID へのコマンドは断られ、消した ID は使い直さない。</text>
<rect class="box" x="826" y="783" width="180" height="41"/>
<text class="label" x="836" y="808">S9 ・ T5</text>
<rect class="box" x="16" y="830" width="56" height="58"/>
<text class="label" x="26" y="855">J14</text>
<rect class="box" x="258" y="830" width="560" height="58"/>
<text class="label" x="268" y="855">基盤を通らずに、変えてよい範囲の外か $schema が変わった instance と、消した ID</text>
<text class="label" x="268" y="872">を持つファイルは違反として返る。</text>
<rect class="box" x="826" y="830" width="180" height="58"/>
<text class="label" x="836" y="855">T5 ・ D</text>
<rect class="box" x="16" y="894" width="56" height="58"/>
<text class="label" x="26" y="919">J15</text>
<rect class="box" x="258" y="894" width="560" height="58"/>
<text class="label" x="268" y="919">rule の入力は、rule の宣言 ・ 読む欄の値 ・ term ・ 参照先 ・ その rule の</text>
<text class="label" x="268" y="936">validator である。版の番号は入れない。</text>
<rect class="box" x="826" y="894" width="180" height="58"/>
<text class="label" x="836" y="919">S1 ・ S2 ・ T1</text>
<rect class="box" x="16" y="958" width="56" height="58"/>
<text class="label" x="26" y="983">J16</text>
<rect class="box" x="258" y="958" width="560" height="58"/>
<text class="label" x="268" y="983">AI の答えの根拠が読む欄の値に無ければ、verified ・ violated でも unverified</text>
<text class="label" x="268" y="1000">として記録する。</text>
<rect class="box" x="826" y="958" width="180" height="58"/>
<text class="label" x="836" y="983">S11 ・ T1</text>
<rect class="box" x="16" y="1022" width="56" height="58"/>
<text class="label" x="26" y="1047">J17</text>
<rect class="box" x="258" y="1022" width="560" height="58"/>
<text class="label" x="268" y="1047">rule のいまの結果は、入力がいまと一致する最後の記録の結果。無ければ検証待ち。</text>
<text class="label" x="268" y="1064">error は検証待ちで、AI の rule だけ3回続けば unverified。</text>
<rect class="box" x="826" y="1022" width="180" height="58"/>
<text class="label" x="836" y="1047">S7 ・ S20 ・ T1</text>
<rect class="box" x="16" y="1086" width="56" height="58"/>
<text class="label" x="26" y="1111">J18</text>
<rect class="box" x="258" y="1086" width="560" height="58"/>
<text class="label" x="268" y="1111">検証するは検証待ちの rule だけを渡す。人が判定する rule は渡さずに unverified、</text>
<text class="label" x="268" y="1128">validator の無い rule は unsupported にする。</text>
<rect class="box" x="826" y="1086" width="180" height="58"/>
<text class="label" x="836" y="1111">S2 ・ T1</text>
<rect class="box" x="16" y="1150" width="56" height="58"/>
<text class="label" x="26" y="1175">J19</text>
<rect class="box" x="258" y="1150" width="560" height="58"/>
<text class="label" x="268" y="1175">人の判断は「合っている」か「合っていない」を持ち、判定した者を人にした verified</text>
<text class="label" x="268" y="1192">か violated として返る。</text>
<rect class="box" x="826" y="1150" width="180" height="58"/>
<text class="label" x="836" y="1175">S6 ・ T1</text>
<rect class="box" x="16" y="1214" width="56" height="58"/>
<text class="label" x="26" y="1239">J20</text>
<rect class="box" x="258" y="1214" width="560" height="58"/>
<text class="label" x="268" y="1239">人の判断を付けられるのは、いまの結果が unverified ・ unsupported の rule と、</text>
<text class="label" x="268" y="1256">AI が判定した rule だけである。</text>
<rect class="box" x="826" y="1214" width="180" height="58"/>
<text class="label" x="836" y="1239">S10 ・ T1</text>
<rect class="box" x="16" y="1278" width="56" height="58"/>
<text class="label" x="26" y="1303">J21</text>
<rect class="box" x="258" y="1278" width="560" height="58"/>
<text class="label" x="268" y="1303">人の判断は人に示した時点の入力（validator を除く）に結び付く。</text>
<text class="label" x="268" y="1320">示した入力がいまと違えば断られ、あとで変われば効かない。</text>
<rect class="box" x="826" y="1278" width="180" height="58"/>
<text class="label" x="836" y="1303">S13 ・ T2</text>
<rect class="box" x="16" y="1342" width="56" height="41"/>
<text class="label" x="26" y="1367">J22</text>
<rect class="box" x="258" y="1342" width="560" height="41"/>
<text class="label" x="268" y="1367">まとめて判断しても、判断は instance ごとに別に保存され、断ったものの一覧が返る。</text>
<rect class="box" x="826" y="1342" width="180" height="41"/>
<text class="label" x="836" y="1367">S14</text>
<rect class="box" x="16" y="1389" width="56" height="58"/>
<text class="label" x="26" y="1414">J23</text>
<rect class="box" x="258" y="1389" width="560" height="58"/>
<text class="label" x="268" y="1414">rule の効いている結果は、読む欄に未記入があれば未記入、</text>
<text class="label" x="268" y="1431">効いている判断があればその結果、無ければいまの結果である。</text>
<rect class="box" x="826" y="1389" width="180" height="58"/>
<text class="label" x="836" y="1414">S5 ・ T1</text>
<rect class="box" x="16" y="1453" width="56" height="58"/>
<text class="label" x="26" y="1478">J24</text>
<rect class="box" x="258" y="1453" width="560" height="58"/>
<text class="label" x="268" y="1478">instance の状態は、読むたびに決定表 D で導く。</text>
<rect class="box" x="826" y="1453" width="180" height="58"/>
<text class="label" x="836" y="1478">D の全行</text>
<rect class="box" x="16" y="1517" width="56" height="58"/>
<text class="label" x="26" y="1542">J25</text>
<rect class="box" x="258" y="1517" width="560" height="58"/>
<text class="label" x="268" y="1542">前の版で検証済みは、従う版が最新でなく、最新の版を試した結果で結果が変わる</text>
<text class="label" x="268" y="1559">instance だけである。</text>
<rect class="box" x="826" y="1517" width="180" height="58"/>
<text class="label" x="836" y="1542">S12 ・ D</text>
<rect class="box" x="16" y="1581" width="56" height="41"/>
<text class="label" x="26" y="1606">J26</text>
<rect class="box" x="258" y="1581" width="560" height="41"/>
<text class="label" x="268" y="1606">記録（承認 ・ 検証 ・ 人の判断）は足すだけで、書き換えた記録と判断は効かない。</text>
<rect class="box" x="826" y="1581" width="180" height="41"/>
<text class="label" x="836" y="1606">S5 ・ T1 ・ T2</text>
<rect class="box" x="16" y="1628" width="56" height="41"/>
<text class="label" x="26" y="1653">J27</text>
<rect class="box" x="258" y="1628" width="560" height="41"/>
<text class="label" x="268" y="1653">集約は文脈の中で一意の ID を持ち、ほかの集約からは ID とハッシュで指される。</text>
<rect class="box" x="826" y="1628" width="180" height="41"/>
<text class="label" x="836" y="1653">T5：在る × 作る</text>
</svg>