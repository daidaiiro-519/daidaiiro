<svg viewBox="0 0 924 1184" style="min-width:900px" role="img" aria-label="Semantic Domain Schema の不変条件22行と、実現する実装の行と、検査するコマンド">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">概念</text>
<text class="note" x="216" y="22">不変条件</text>
<text class="note" x="564" y="22">実装の行</text>
<text class="note" x="742" y="22">検査</text>
<rect class="box" x="16" y="32" width="40" height="46"/>
<text class="label" x="26" y="60">1</text>
<rect class="box focus" x="64" y="32" width="140" height="46"/>
<text class="title" x="74" y="60">Abstract スキーマ</text>
<rect class="box" x="212" y="32" width="340" height="46"/>
<text class="label" x="222" y="51">Abstract の版は名前で1つに決まり、</text>
<text class="label" x="222" y="67">公開した版は中身を変えない</text>
<rect class="box" x="560" y="32" width="170" height="46"/>
<text class="label" x="570" y="60">S1 ・ S2</text>
<rect class="box" x="738" y="32" width="170" height="46"/>
<text class="label" x="748" y="60">check-schemas</text>
<rect class="box" x="16" y="84" width="40" height="46"/>
<text class="label" x="26" y="112">2</text>
<rect class="box focus" x="64" y="84" width="140" height="46"/>
<text class="title" x="74" y="112">Concrete スキーマ</text>
<rect class="box" x="212" y="84" width="340" height="46"/>
<text class="label" x="222" y="103">1つの Abstract の版を申告し、</text>
<text class="label" x="222" y="119">その版の契約を満たす</text>
<rect class="box" x="560" y="84" width="170" height="46"/>
<text class="label" x="570" y="112">M（版の行）</text>
<rect class="box" x="738" y="84" width="170" height="46"/>
<text class="label" x="748" y="112">check-schemas</text>
<rect class="box" x="16" y="136" width="40" height="46"/>
<text class="label" x="26" y="164">3</text>
<rect class="box focus" x="64" y="136" width="140" height="46"/>
<text class="title" x="74" y="164">Concrete スキーマ</text>
<rect class="box" x="212" y="136" width="340" height="46"/>
<text class="label" x="222" y="155">$id は &lt;名>/&lt;種類>@v&lt;n> で、</text>
<text class="label" x="222" y="171">文脈の中で一意で、変えない</text>
<rect class="box" x="560" y="136" width="170" height="46"/>
<text class="label" x="570" y="164">M（$id）・ S11</text>
<rect class="box" x="738" y="136" width="170" height="46"/>
<text class="label" x="748" y="164">check-schemas</text>
<rect class="box" x="16" y="188" width="40" height="46"/>
<text class="label" x="26" y="216">4</text>
<rect class="box focus" x="64" y="188" width="140" height="46"/>
<text class="title" x="74" y="216">Concrete スキーマ</text>
<rect class="box" x="212" y="188" width="340" height="46"/>
<text class="label" x="222" y="216">title と description を持つ</text>
<rect class="box" x="560" y="188" width="170" height="46"/>
<text class="label" x="570" y="216">M</text>
<rect class="box" x="738" y="188" width="170" height="46"/>
<text class="label" x="748" y="216">check-schemas</text>
<rect class="box" x="16" y="240" width="40" height="46"/>
<text class="label" x="26" y="268">5</text>
<rect class="box focus" x="64" y="240" width="140" height="46"/>
<text class="title" x="74" y="268">Concrete スキーマ</text>
<rect class="box" x="212" y="240" width="340" height="46"/>
<text class="label" x="222" y="259">instance を作る Concrete は、</text>
<text class="label" x="222" y="275">kind と $schema の const を持つ</text>
<rect class="box" x="560" y="240" width="170" height="46"/>
<text class="label" x="570" y="268">M ・ F7（未検査）</text>
<rect class="box" x="738" y="240" width="170" height="46"/>
<text class="label" x="748" y="259">check-schemas</text>
<text class="label" x="748" y="275">置き場所は検査を足す</text>
<rect class="box" x="16" y="292" width="40" height="46"/>
<text class="label" x="26" y="320">6</text>
<rect class="box focus" x="64" y="292" width="140" height="46"/>
<text class="title" x="74" y="320">Concrete スキーマ</text>
<rect class="box" x="212" y="292" width="340" height="46"/>
<text class="label" x="222" y="311">書く単位ごとに description と</text>
<text class="label" x="222" y="327">x-prompt を持ち、葉には書かない</text>
<rect class="box" x="560" y="292" width="170" height="46"/>
<text class="label" x="570" y="320">M ・ S4 ・ W7（未検査）</text>
<rect class="box" x="738" y="292" width="170" height="46"/>
<text class="label" x="748" y="311">check-schemas</text>
<text class="label" x="748" y="327">葉は検査を足す</text>
<rect class="box" x="16" y="344" width="40" height="46"/>
<text class="label" x="26" y="372">7</text>
<rect class="box focus" x="64" y="344" width="140" height="46"/>
<text class="title" x="74" y="372">Concrete スキーマ</text>
<rect class="box" x="212" y="344" width="340" height="46"/>
<text class="label" x="222" y="363">申告していない x- を使わず、</text>
<text class="label" x="222" y="379">基盤の名前を申告しない</text>
<rect class="box" x="560" y="344" width="170" height="46"/>
<text class="label" x="570" y="372">S3 ・ F9（未検査）</text>
<rect class="box" x="738" y="344" width="170" height="46"/>
<text class="label" x="748" y="363">check-schemas</text>
<text class="label" x="748" y="379">申告は検査を足す</text>
<rect class="box" x="16" y="396" width="40" height="46"/>
<text class="label" x="26" y="424">8</text>
<rect class="box focus" x="64" y="396" width="140" height="46"/>
<text class="title" x="74" y="424">Concrete スキーマ</text>
<rect class="box" x="212" y="396" width="340" height="46"/>
<text class="label" x="222" y="415">参照 ・ 導出 ・ 描画の宣言は、</text>
<text class="label" x="222" y="431">読める形である</text>
<rect class="box" x="560" y="396" width="170" height="46"/>
<text class="label" x="570" y="424">S6〜S10</text>
<rect class="box" x="738" y="396" width="170" height="46"/>
<text class="label" x="748" y="424">check-schemas</text>
<rect class="box" x="16" y="448" width="40" height="46"/>
<text class="label" x="26" y="476">9</text>
<rect class="box focus" x="64" y="448" width="140" height="46"/>
<text class="title" x="74" y="476">Concrete スキーマ</text>
<rect class="box" x="212" y="448" width="340" height="46"/>
<text class="label" x="222" y="476">参照される種類は id を持つ</text>
<rect class="box" x="560" y="448" width="170" height="46"/>
<text class="label" x="570" y="476">S12</text>
<rect class="box" x="738" y="448" width="170" height="46"/>
<text class="label" x="748" y="476">check-schemas</text>
<rect class="box" x="16" y="500" width="40" height="46"/>
<text class="label" x="26" y="528">10</text>
<rect class="box focus" x="64" y="500" width="140" height="46"/>
<text class="title" x="74" y="528">rule</text>
<rect class="box" x="212" y="500" width="340" height="46"/>
<text class="label" x="222" y="519">id ・ rule ・ why ・ test を持ち、</text>
<text class="label" x="222" y="535">id はスキーマの中で一意である</text>
<rect class="box" x="560" y="500" width="170" height="46"/>
<text class="label" x="570" y="528">M22〜M26 ・ S5</text>
<rect class="box" x="738" y="500" width="170" height="46"/>
<text class="label" x="748" y="528">check-schemas</text>
<rect class="box" x="16" y="552" width="40" height="46"/>
<text class="label" x="26" y="580">11</text>
<rect class="box focus" x="64" y="552" width="140" height="46"/>
<text class="title" x="74" y="580">term</text>
<rect class="box" x="212" y="552" width="340" height="46"/>
<text class="label" x="222" y="571">欄の意味は term への $ref で決まり、</text>
<text class="label" x="222" y="587">1つの term を2つの意味で使わない</text>
<rect class="box" x="560" y="552" width="170" height="46"/>
<text class="label" x="570" y="580">いま無い</text>
<rect class="box" x="738" y="552" width="170" height="46"/>
<text class="label" x="748" y="580">検査を足す</text>
<rect class="box" x="16" y="604" width="40" height="46"/>
<text class="label" x="26" y="632">12</text>
<rect class="box focus" x="64" y="604" width="140" height="46"/>
<text class="title" x="74" y="632">公開した版</text>
<rect class="box" x="212" y="604" width="340" height="46"/>
<text class="label" x="222" y="623">書き換えない ・ 消さない ・</text>
<text class="label" x="222" y="639">末尾に足すだけ</text>
<rect class="box" x="560" y="604" width="170" height="46"/>
<text class="label" x="570" y="632">P1〜P5</text>
<rect class="box" x="738" y="604" width="170" height="46"/>
<text class="label" x="748" y="623">check-schemas</text>
<text class="label" x="748" y="639">P3〜P5 は検査を足す</text>
