<svg viewBox="0 0 846 1184" style="min-width:846px" role="img" aria-label="Semantic Schema Core の不変条件22行を概念ごとに固めた表と、守る command">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">概念</text>
<text class="note" x="216" y="22">不変条件</text>
<text class="note" x="644" y="22">command</text>
<rect class="box focus" x="64" y="32" width="140" height="46"/><text class="title" x="74" y="60">Abstract スキーマ</text>
<rect class="box focus" x="64" y="84" width="140" height="410"/><text class="title" x="74" y="294">Concrete スキーマ</text>
<rect class="box focus" x="64" y="500" width="140" height="46"/><text class="title" x="74" y="528">rule</text>
<rect class="box focus" x="64" y="552" width="140" height="46"/><text class="title" x="74" y="580">term</text>
<rect class="box focus" x="64" y="604" width="140" height="46"/><text class="title" x="74" y="632">公開した版</text>
<rect class="box focus" x="64" y="656" width="140" height="358"/><text class="title" x="74" y="840">instance</text>
<rect class="box focus" x="64" y="1020" width="140" height="46"/><text class="title" x="74" y="1048">承認の記録</text>
<rect class="box focus" x="64" y="1072" width="140" height="46"/><text class="title" x="74" y="1100">検証結果</text>
<rect class="box focus" x="64" y="1124" width="140" height="46"/><text class="title" x="74" y="1152">view</text>
<rect class="box" x="16" y="32" width="40" height="46"/>
<text class="label" x="26" y="60">1</text>
<rect class="box" x="212" y="32" width="420" height="46"/>
<text class="label" x="222" y="51">Abstract の版は名前で1つに決まり、</text>
<text class="label" x="222" y="67">公開した版は中身を変えない</text>
<rect class="box" x="640" y="32" width="190" height="46"/>
<text class="label" x="650" y="60">check-schemas</text>
<rect class="box" x="16" y="84" width="40" height="46"/>
<text class="label" x="26" y="112">2</text>
<rect class="box" x="212" y="84" width="420" height="46"/>
<text class="label" x="222" y="103">1つの Abstract の版を申告し、</text>
<text class="label" x="222" y="119">その版の契約を満たす</text>
<rect class="box" x="640" y="84" width="190" height="46"/>
<text class="label" x="650" y="112">check-schemas</text>
<rect class="box" x="16" y="136" width="40" height="46"/>
<text class="label" x="26" y="164">3</text>
<rect class="box" x="212" y="136" width="420" height="46"/>
<text class="label" x="222" y="155">$id は &lt;名>/&lt;種類>@v&lt;n> で、</text>
<text class="label" x="222" y="171">文脈の中で一意で、変えない</text>
<rect class="box" x="640" y="136" width="190" height="46"/>
<text class="label" x="650" y="164">check-schemas</text>
<rect class="box" x="16" y="188" width="40" height="46"/>
<text class="label" x="26" y="216">4</text>
<rect class="box" x="212" y="188" width="420" height="46"/>
<text class="label" x="222" y="216">title と description を持つ</text>
<rect class="box" x="640" y="188" width="190" height="46"/>
<text class="label" x="650" y="216">check-schemas</text>
<rect class="box" x="16" y="240" width="40" height="46"/>
<text class="label" x="26" y="268">5</text>
<rect class="box" x="212" y="240" width="420" height="46"/>
<text class="label" x="222" y="259">instance を作る Concrete は、</text>
<text class="label" x="222" y="275">kind と $schema の const を持つ</text>
<rect class="box" x="640" y="240" width="190" height="46"/>
<text class="label" x="650" y="268">check-schemas</text>
<rect class="box" x="16" y="292" width="40" height="46"/>
<text class="label" x="26" y="320">6</text>
<rect class="box" x="212" y="292" width="420" height="46"/>
<text class="label" x="222" y="311">書く単位ごとに description と</text>
<text class="label" x="222" y="327">x-prompt を持ち、葉には書かない</text>
<rect class="box" x="640" y="292" width="190" height="46"/>
<text class="label" x="650" y="320">check-schemas</text>
<rect class="box" x="16" y="344" width="40" height="46"/>
<text class="label" x="26" y="372">7</text>
<rect class="box" x="212" y="344" width="420" height="46"/>
<text class="label" x="222" y="363">申告していない x- を使わず、</text>
<text class="label" x="222" y="379">基盤の名前を申告しない</text>
<rect class="box" x="640" y="344" width="190" height="46"/>
<text class="label" x="650" y="372">check-schemas</text>
<rect class="box" x="16" y="396" width="40" height="46"/>
<text class="label" x="26" y="424">8</text>
<rect class="box" x="212" y="396" width="420" height="46"/>
<text class="label" x="222" y="415">参照 ・ 導出 ・ 描画の宣言は、</text>
<text class="label" x="222" y="431">読める形である</text>
<rect class="box" x="640" y="396" width="190" height="46"/>
<text class="label" x="650" y="424">check-schemas</text>
<rect class="box" x="16" y="448" width="40" height="46"/>
<text class="label" x="26" y="476">9</text>
<rect class="box" x="212" y="448" width="420" height="46"/>
<text class="label" x="222" y="476">参照される種類は id を持つ</text>
<rect class="box" x="640" y="448" width="190" height="46"/>
<text class="label" x="650" y="476">check-schemas</text>
<rect class="box" x="16" y="500" width="40" height="46"/>
<text class="label" x="26" y="528">10</text>
<rect class="box" x="212" y="500" width="420" height="46"/>
<text class="label" x="222" y="519">id ・ rule ・ why ・ test を持ち、</text>
<text class="label" x="222" y="535">id はスキーマの中で一意である</text>
<rect class="box" x="640" y="500" width="190" height="46"/>
<text class="label" x="650" y="528">check-schemas</text>
<rect class="box" x="16" y="552" width="40" height="46"/>
<text class="label" x="26" y="580">11</text>
<rect class="box" x="212" y="552" width="420" height="46"/>
<text class="label" x="222" y="571">欄の意味は term への $ref で決まり、</text>
<text class="label" x="222" y="587">1つの term を2つの意味で使わない</text>
<rect class="box" x="640" y="552" width="190" height="46"/>
<text class="label" x="650" y="580">（いま無い）</text>
<rect class="box" x="16" y="604" width="40" height="46"/>
<text class="label" x="26" y="632">12</text>
<rect class="box" x="212" y="604" width="420" height="46"/>
<text class="label" x="222" y="623">書き換えない ・ 消さない ・</text>
<text class="label" x="222" y="639">末尾に足すだけ</text>
<rect class="box" x="640" y="604" width="190" height="46"/>
<text class="label" x="650" y="632">check-schemas</text>
<rect class="box" x="16" y="656" width="40" height="46"/>
<text class="label" x="26" y="684">13</text>
<rect class="box" x="212" y="656" width="420" height="46"/>
<text class="label" x="222" y="675">$schema の名前で、</text>
<text class="label" x="222" y="691">Concrete 1つに解決する</text>
<rect class="box" x="640" y="656" width="190" height="46"/>
<text class="label" x="650" y="675">create ・ update ・</text>
<text class="label" x="650" y="691">check</text>
<rect class="box" x="16" y="708" width="40" height="46"/>
<text class="label" x="26" y="736">14</text>
<rect class="box" x="212" y="708" width="420" height="46"/>
<text class="label" x="222" y="736">同じ場所に2つ作らない</text>
<rect class="box" x="640" y="708" width="190" height="46"/>
<text class="label" x="650" y="736">create</text>
<rect class="box" x="16" y="760" width="40" height="46"/>
<text class="label" x="26" y="788">15</text>
<rect class="box" x="212" y="760" width="420" height="46"/>
<text class="label" x="222" y="779">更新は、読んだ時点のハッシュと</text>
<text class="label" x="222" y="795">一致するときだけ成り立つ</text>
<rect class="box" x="640" y="760" width="190" height="46"/>
<text class="label" x="650" y="788">update</text>
<rect class="box" x="16" y="812" width="40" height="46"/>
<text class="label" x="26" y="840">16</text>
<rect class="box" x="212" y="812" width="420" height="46"/>
<text class="label" x="222" y="831">Concrete を満たし、</text>
<text class="label" x="222" y="847">未記入は違反と分けて持つ</text>
<rect class="box" x="640" y="812" width="190" height="46"/>
<text class="label" x="650" y="840">update ・ check</text>
<rect class="box" x="16" y="864" width="40" height="46"/>
<text class="label" x="26" y="892">17</text>
<rect class="box" x="212" y="864" width="420" height="46"/>
<text class="label" x="222" y="883">x-ref の指す先があり、1つに決まり、</text>
<text class="label" x="222" y="899">受け付ける値である</text>
<rect class="box" x="640" y="864" width="190" height="46"/>
<text class="label" x="650" y="892">check</text>
<rect class="box" x="16" y="916" width="40" height="46"/>
<text class="label" x="26" y="944">18</text>
<rect class="box" x="212" y="916" width="420" height="46"/>
<text class="label" x="222" y="935">関係の数の制約（covered_by ・</text>
<text class="label" x="222" y="951">unique ・ inverse）を満たす</text>
<rect class="box" x="640" y="916" width="190" height="46"/>
<text class="label" x="650" y="944">check</text>
<rect class="box" x="16" y="968" width="40" height="46"/>
<text class="label" x="26" y="996">19</text>
<rect class="box" x="212" y="968" width="420" height="46"/>
<text class="label" x="222" y="987">x-derive の宣言値が導出値と</text>
<text class="label" x="222" y="1003">一致し、expect を満たす</text>
<rect class="box" x="640" y="968" width="190" height="46"/>
<text class="label" x="650" y="996">check</text>
<rect class="box" x="16" y="1020" width="40" height="46"/>
<text class="label" x="26" y="1048">20</text>
<rect class="box" x="212" y="1020" width="420" height="46"/>
<text class="label" x="222" y="1039">検証エラー ・ ずれ ・ 未記入が無いときだけ</text>
<text class="label" x="222" y="1055">承認し、承認した時点のハッシュを持つ</text>
<rect class="box" x="640" y="1020" width="190" height="46"/>
<text class="label" x="650" y="1048">approve ・ check</text>
<rect class="box" x="16" y="1072" width="40" height="46"/>
<text class="label" x="26" y="1100">21</text>
<rect class="box" x="212" y="1072" width="420" height="46"/>
<text class="label" x="222" y="1091">rule 1件ごとに5つの値のどれかを返し、</text>
<text class="label" x="222" y="1107">検証できなかった rule も返す</text>
<rect class="box" x="640" y="1072" width="190" height="46"/>
<text class="label" x="650" y="1100">（いま無い）</text>
<rect class="box" x="16" y="1124" width="40" height="46"/>
<text class="label" x="26" y="1152">22</text>
<rect class="box" x="212" y="1124" width="420" height="46"/>
<text class="label" x="222" y="1143">形とコントラストを満たし、</text>
<text class="label" x="222" y="1159">失敗したら1ページも書かない</text>
<rect class="box" x="640" y="1124" width="190" height="46"/>
<text class="label" x="650" y="1152">render</text>
</svg>