<text class="label" x="222" y="691">Concrete 1つに解決する</text>
<rect class="box" x="560" y="656" width="170" height="46"/>
<text class="label" x="570" y="684">I1〜I4</text>
<rect class="box" x="738" y="656" width="170" height="46"/>
<text class="label" x="748" y="675">create ・ update ・</text>
<text class="label" x="748" y="691">check</text>
<rect class="box" x="16" y="708" width="40" height="46"/>
<text class="label" x="26" y="736">14</text>
<rect class="box focus" x="64" y="708" width="140" height="46"/>
<text class="title" x="74" y="736">instance</text>
<rect class="box" x="212" y="708" width="340" height="46"/>
<text class="label" x="222" y="736">同じ場所に2つ作らない</text>
<rect class="box" x="560" y="708" width="170" height="46"/>
<text class="label" x="570" y="736">I6</text>
<rect class="box" x="738" y="708" width="170" height="46"/>
<text class="label" x="748" y="736">create</text>
<rect class="box" x="16" y="760" width="40" height="46"/>
<text class="label" x="26" y="788">15</text>
<rect class="box focus" x="64" y="760" width="140" height="46"/>
<text class="title" x="74" y="788">instance</text>
<rect class="box" x="212" y="760" width="340" height="46"/>
<text class="label" x="222" y="779">更新は、読んだ時点のハッシュと</text>
<text class="label" x="222" y="795">一致するときだけ成り立つ</text>
<rect class="box" x="560" y="760" width="170" height="46"/>
<text class="label" x="570" y="788">I8</text>
<rect class="box" x="738" y="760" width="170" height="46"/>
<text class="label" x="748" y="788">update</text>
<rect class="box" x="16" y="812" width="40" height="46"/>
<text class="label" x="26" y="840">16</text>
<rect class="box focus" x="64" y="812" width="140" height="46"/>
<text class="title" x="74" y="840">instance</text>
<rect class="box" x="212" y="812" width="340" height="46"/>
<text class="label" x="222" y="831">Concrete を満たし、</text>
<text class="label" x="222" y="847">未記入は違反と分けて持つ</text>
<rect class="box" x="560" y="812" width="170" height="46"/>
<text class="label" x="570" y="840">I10</text>
<rect class="box" x="738" y="812" width="170" height="46"/>
<text class="label" x="748" y="840">update ・ check</text>
<rect class="box" x="16" y="864" width="40" height="46"/>
<text class="label" x="26" y="892">17</text>
<rect class="box focus" x="64" y="864" width="140" height="46"/>
<text class="title" x="74" y="892">instance</text>
<rect class="box" x="212" y="864" width="340" height="46"/>
<text class="label" x="222" y="883">x-ref の指す先があり、1つに決まり、</text>
<text class="label" x="222" y="899">受け付ける値である</text>
<rect class="box" x="560" y="864" width="170" height="46"/>
<text class="label" x="570" y="892">R1〜R5</text>
<rect class="box" x="738" y="864" width="170" height="46"/>
<text class="label" x="748" y="892">check</text>
<rect class="box" x="16" y="916" width="40" height="46"/>
<text class="label" x="26" y="944">18</text>
<rect class="box focus" x="64" y="916" width="140" height="46"/>
<text class="title" x="74" y="944">instance</text>
<rect class="box" x="212" y="916" width="340" height="46"/>
<text class="label" x="222" y="935">関係の数の制約（covered_by ・</text>
<text class="label" x="222" y="951">unique ・ inverse）を満たす</text>
<rect class="box" x="560" y="916" width="170" height="46"/>
<text class="label" x="570" y="944">R6〜R10</text>
<rect class="box" x="738" y="916" width="170" height="46"/>
<text class="label" x="748" y="944">check</text>
<rect class="box" x="16" y="968" width="40" height="46"/>
<text class="label" x="26" y="996">19</text>
<rect class="box focus" x="64" y="968" width="140" height="46"/>
<text class="title" x="74" y="996">instance</text>
<rect class="box" x="212" y="968" width="340" height="46"/>
<text class="label" x="222" y="987">x-derive の宣言値が導出値と</text>
<text class="label" x="222" y="1003">一致し、expect を満たす</text>
<rect class="box" x="560" y="968" width="170" height="46"/>
<text class="label" x="570" y="996">D1 ・ D2</text>
<rect class="box" x="738" y="968" width="170" height="46"/>
<text class="label" x="748" y="996">check</text>
<rect class="box" x="16" y="1020" width="40" height="46"/>
<text class="label" x="26" y="1048">20</text>
<rect class="box focus" x="64" y="1020" width="140" height="46"/>
<text class="title" x="74" y="1048">承認の記録</text>
<rect class="box" x="212" y="1020" width="340" height="46"/>
<text class="label" x="222" y="1039">検証エラー ・ ずれ ・ 未記入が無いときだけ</text>
<text class="label" x="222" y="1055">承認し、承認した時点のハッシュを持つ</text>
<rect class="box" x="560" y="1020" width="170" height="46"/>
<text class="label" x="570" y="1048">A1〜A6 ・ R11</text>
<rect class="box" x="738" y="1020" width="170" height="46"/>
<text class="label" x="748" y="1048">approve ・ check</text>
<rect class="box" x="16" y="1072" width="40" height="46"/>
<text class="label" x="26" y="1100">21</text>
<rect class="box focus" x="64" y="1072" width="140" height="46"/>
<text class="title" x="74" y="1100">検証結果</text>
<rect class="box" x="212" y="1072" width="340" height="46"/>
<text class="label" x="222" y="1091">rule 1件ごとに5つの値のどれかを返し、</text>
<text class="label" x="222" y="1107">検証できなかった rule も返す</text>
<rect class="box" x="560" y="1072" width="170" height="46"/>
<text class="label" x="570" y="1100">いま無い</text>
<rect class="box" x="738" y="1072" width="170" height="46"/>
<text class="label" x="748" y="1100">検査を足す</text>
<rect class="box" x="16" y="1124" width="40" height="46"/>
<text class="label" x="26" y="1152">22</text>
<rect class="box focus" x="64" y="1124" width="140" height="46"/>
<text class="title" x="74" y="1152">view</text>
<rect class="box" x="212" y="1124" width="340" height="46"/>
<text class="label" x="222" y="1143">形とコントラストを満たし、</text>
<text class="label" x="222" y="1159">失敗したら1ページも書かない</text>
<rect class="box" x="560" y="1124" width="170" height="46"/>
<text class="label" x="570" y="1152">V1〜V21</text>
<rect class="box" x="738" y="1124" width="170" height="46"/>
