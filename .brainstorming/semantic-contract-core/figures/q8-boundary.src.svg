<svg viewBox="0 0 996 362" style="min-width:900px" role="img" aria-label="基盤が受け持つか（In）、上に載るものが受け持つか（Out）">
<text class="note" x="20" y="22">#</text>
<text class="note" x="68" y="22">迷う点</text>
<text class="note" x="436" y="22">受け持つ側</text>
<text class="note" x="654" y="22">理由</text>
<rect class="box" x="16" y="32" width="40" height="40"/>
<text class="label" x="26" y="57">1</text>
<rect class="box" x="64" y="32" width="360" height="40"/>
<text class="label" x="74" y="57">提供側が Abstract の新しい版を公開する（U4）</text>
<rect class="box focus" x="432" y="32" width="210" height="40"/>
<text class="title" x="442" y="57">In</text>
<rect class="box" x="650" y="32" width="330" height="40"/>
<text class="label" x="660" y="57">版と移し方の案内は、基盤の契約の一部</text>
<rect class="box" x="16" y="78" width="40" height="40"/>
<text class="label" x="26" y="103">2</text>
<rect class="box" x="64" y="78" width="360" height="40"/>
<text class="label" x="74" y="103">文脈をまたぐ x-relationship の解決</text>
<rect class="box focus" x="432" y="78" width="210" height="40"/>
<text class="title" x="442" y="103">In</text>
<rect class="box" x="650" y="78" width="330" height="40"/>
<text class="label" x="660" y="103">公開された言葉として指せるようにする</text>
<rect class="box" x="16" y="124" width="40" height="40"/>
<text class="label" x="26" y="149">3</text>
<rect class="box" x="64" y="124" width="360" height="40"/>
<text class="label" x="74" y="149">違反のある変更のマージを止める</text>
<rect class="box focus" x="432" y="124" width="210" height="40"/>
<text class="title" x="442" y="149">Out（harness ・ CI）</text>
<rect class="box" x="650" y="124" width="330" height="40"/>
<text class="label" x="660" y="149">基盤は結果を返すまで</text>
<rect class="box" x="16" y="170" width="40" height="40"/>
<text class="label" x="26" y="195">4</text>
<rect class="box" x="64" y="170" width="360" height="40"/>
<text class="label" x="74" y="195">直すループを回し、収束を測る</text>
<rect class="box focus" x="432" y="170" width="210" height="40"/>
<text class="title" x="442" y="195">Out（Agent ・ harness）</text>
<rect class="box" x="650" y="170" width="330" height="40"/>
<text class="label" x="660" y="195">基盤は指摘と、人が決める欄（決定権）を返す</text>
<rect class="box" x="16" y="216" width="40" height="40"/>
<text class="label" x="26" y="241">5</text>
<rect class="box" x="64" y="216" width="360" height="40"/>
<text class="label" x="74" y="241">判定した人の本人確認</text>
<rect class="box focus" x="432" y="216" width="210" height="40"/>
<text class="title" x="442" y="241">Out（変更の仕組み）</text>
<rect class="box" x="650" y="216" width="330" height="40"/>
<text class="label" x="660" y="241">基盤は判定した者を記録するだけ</text>
<rect class="box" x="16" y="262" width="40" height="40"/>
<text class="label" x="26" y="287">6</text>
<rect class="box" x="64" y="262" width="360" height="40"/>
<text class="label" x="74" y="287">基盤を通らずにファイルを直接書き換える Agent</text>
<rect class="box focus" x="432" y="262" width="210" height="40"/>
<text class="title" x="442" y="287">In（検出だけ）</text>
<rect class="box" x="650" y="262" width="330" height="40"/>
<text class="label" x="660" y="287">読むたびに入力を比べて見つける</text>
<rect class="box" x="16" y="308" width="40" height="40"/>
<text class="label" x="26" y="333">7</text>
<rect class="box" x="64" y="308" width="360" height="40"/>
<text class="label" x="74" y="333">どの AI を validator に使うか</text>
<rect class="box focus" x="432" y="308" width="210" height="40"/>
<text class="title" x="442" y="333">Out（harness が選ぶ）</text>
<rect class="box" x="650" y="308" width="330" height="40"/>
<text class="label" x="660" y="333">Agents 契約の形は基盤が持つ</text>
</svg>