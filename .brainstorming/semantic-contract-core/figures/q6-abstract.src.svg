<rect class="box" x="402" y="177" width="290" height="58"/>
<text class="label" x="412" y="202">kind ごとの節 ・ 部品 ・ 値を取る式</text>
<rect class="box" x="700" y="177" width="210" height="58"/>
<text class="label" x="710" y="202">文脈がコミットする</text>
<rect class="box" x="918" y="177" width="190" height="58"/>
