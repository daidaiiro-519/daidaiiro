<text class="label" x="710" y="330">文脈がコミットする</text>
<rect class="box" x="918" y="305" width="190" height="58"/>
<text class="label" x="928" y="330">一員ごとに名前@vN</text>
<rect class="box" x="164" y="369" width="230" height="58"/>
<text class="label" x="174" y="394">glossary（用語集）</text>
<rect class="box" x="402" y="369" width="290" height="58"/>
<text class="label" x="412" y="394">term の id ・ 意味 ・ 値の形 ・ 単位</text>
<rect class="box" x="700" y="369" width="210" height="58"/>
<text class="label" x="710" y="394">文脈がコミットする</text>
<rect class="box" x="918" y="369" width="190" height="58"/>
<text class="label" x="928" y="394">一員ごとに名前@vN</text>
<rect class="box" x="164" y="433" width="230" height="75"/>
<text class="label" x="174" y="458">判定の記録</text>
<rect class="box" x="402" y="433" width="290" height="75"/>
<text class="label" x="412" y="458">判定した値 ・ 結果（protocol</text>
<text class="label" x="412" y="475">の検証結果を $ref で指す）・ 根拠 ・</text>
<text class="label" x="412" y="492">判定した者。1件1ファイル</text>
<rect class="box" x="700" y="433" width="210" height="75"/>
<text class="label" x="710" y="458">文脈がコミットする</text>
<rect class="box" x="918" y="433" width="190" height="75"/>
<text class="label" x="928" y="458">各記録が $schema を持</text>
<text class="label" x="928" y="475">ち、エンジンは出した版をす</text>
<text class="label" x="928" y="492">べて読む</text>
