<rect class="box" x="700" y="241" width="210" height="58"/>
<text class="label" x="710" y="266">文脈がコミットする</text>
<rect class="box" x="918" y="241" width="190" height="58"/>
<text class="label" x="928" y="266">一員ごとに名前@vN</text>
<rect class="box" x="164" y="305" width="230" height="58"/>
