<rect class="box" x="700" y="595" width="210" height="58"/>
<text class="label" x="710" y="620">Core の版は Core が、</text>
<text class="label" x="710" y="637">文脈の版は文脈がコミットする</text>
<rect class="box" x="918" y="595" width="190" height="58"/>
<text class="label" x="928" y="620">同上</text>
<rect class="box" x="164" y="659" width="230" height="58"/>
