<text class="note" x="20" y="386" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">AI ツールは利用者ごとに違うので、outbound adapterで差し替える。ポートから見た呼ぶ契約は1つである。</text>
<text class="note" x="20" y="406" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">描画の契約は abstract が持ち、concrete はテンプレート ・ カタログ ・ デザインシステムを用意して基盤の render で描く。</text>
