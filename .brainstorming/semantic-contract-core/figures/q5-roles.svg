<svg viewBox="0 0 760 346" style="min-width:640px" role="img" aria-label="Semantic Schema Resolver が解決し、Semantic Schema Validator と描画が使う。Semantic Schema Validator はルールごとに validator を選ぶ" class="dsvg"><style data-dsvg="dark">.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .area{stroke:var(--dsvg-line,#7C8C86)}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg #dsvg-c802bbbc-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-box-fill:#16211E;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}}:root[data-theme="dark"] .dsvg{--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-box-fill:#16211E;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}</style><defs data-dsvg="marker"><marker id="dsvg-c802bbbc-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs>
<rect class="box focus" x="20" y="20" width="720" height="62" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title" x="34" y="46" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">Semantic Schema Resolver</text><text class="label" x="34" y="68" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-ref の指す先 ・ x-derive の導出値 ・ 語彙を解決する（いまの graph()）</text>
