<rect class="box" x="194" y="180" width="150" height="56" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="206" y="204" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">基盤のエンジン</text><text class="note" x="206" y="224" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">関係と数</text>
