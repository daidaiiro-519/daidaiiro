<rect class="box" x="642" y="126" width="400" height="58"/>
<text class="label" x="652" y="151">5つの値のどれかと根拠。根拠が渡した値に無い答えと、</text>
<text class="label" x="652" y="168">割れた答えは unverified</text>
<rect class="box" x="154" y="190" width="480" height="41"/>
