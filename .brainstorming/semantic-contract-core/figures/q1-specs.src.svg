<svg viewBox="0 0 940 360" style="min-width:780px" role="img" aria-label="抽象の仕様に採る概念と名前と、いまの基盤の対応">
<text class="note" x="20" y="22">採る概念</text>
<text class="note" x="210" y="22">名前</text>
<text class="note" x="450" y="22">いまの基盤にあるもの</text>
<text class="note" x="670" y="22">判定</text>
<text class="note" x="760" y="22">構想 v0.3（参考）</text>
<rect class="box" x="16" y="32" width="180" height="52"/><text class="label" x="26" y="54">データの1件と、</text><text class="label" x="26" y="72">プロパティと型</text>
<rect class="box focus" x="206" y="32" width="230" height="52"/><text class="title" x="216" y="63">インスタンス（インスタンス）</text>
<rect class="box" x="446" y="32" width="210" height="52"/><text class="label" x="456" y="63">kind と id ・ プロパティと型</text>
<rect class="badge" x="666" y="46" width="80" height="24"/><text class="note" x="706" y="63" text-anchor="middle">一部ある</text>
<rect class="boundary" x="756" y="32" width="170" height="52"/><text class="note" x="766" y="63">Semantic Model</text>
<rect class="box" x="16" y="94" width="180" height="52"/><text class="label" x="26" y="125">共有する語の意味</text>
<rect class="box focus" x="206" y="94" width="230" height="52"/><text class="title" x="216" y="125">vocabulary（語彙）</text>
<rect class="box" x="446" y="94" width="210" height="52"/><text class="label" x="456" y="125">$ref で形だけ共有</text>
<rect class="badge warn" x="666" y="108" width="80" height="24"/><text class="note" x="706" y="125" text-anchor="middle">無い</text>
<rect class="boundary" x="756" y="94" width="170" height="52"/><text class="note" x="766" y="125">Vocabulary Spec</text>
<rect class="box" x="16" y="156" width="180" height="52"/><text class="label" x="26" y="187">JSON での書き方</text>
<rect class="box focus" x="206" y="156" width="230" height="52"/><text class="title" x="216" y="187">JSON Schema 2020-12</text>
<rect class="box" x="446" y="156" width="210" height="52"/><text class="label" x="456" y="178">JSON Schema 2020-12</text><text class="label" x="456" y="196">と注釈</text>
<rect class="badge" x="666" y="170" width="80" height="24"/><text class="note" x="706" y="187" text-anchor="middle">同じ</text>
<rect class="boundary" x="756" y="156" width="170" height="52"/><text class="note" x="766" y="187">JSON Representation</text>
<rect class="box" x="16" y="218" width="180" height="52"/><text class="label" x="26" y="240">構造 ・ 値 ・ 関係</text><text class="label" x="26" y="258">・ 意味の条件</text>
<rect class="box focus" x="206" y="218" width="230" height="52"/><text class="title" x="216" y="249">rule（ルール）</text>
<rect class="box" x="446" y="218" width="210" height="52"/><text class="label" x="456" y="249">形 ・ x-ref ・ x-derive</text>
<rect class="badge" x="666" y="232" width="80" height="24"/><text class="note" x="706" y="249" text-anchor="middle">一部ある</text>
<rect class="boundary" x="756" y="218" width="170" height="52"/><text class="note" x="766" y="249">Constraint Spec</text>
<rect class="box" x="16" y="280" width="180" height="52"/><text class="label" x="26" y="302">検証できることと</text><text class="label" x="26" y="320">結果の返し方</text>
<rect class="box focus" x="206" y="280" width="230" height="52"/><text class="title" x="216" y="302">capability と</text><text class="title" x="216" y="320">validation result</text>
<rect class="box" x="446" y="280" width="210" height="52"/><text class="label" x="456" y="311">結果の形だけ</text>
<rect class="badge" x="666" y="294" width="80" height="24"/><text class="note" x="706" y="311" text-anchor="middle">一部ある</text>
<rect class="boundary" x="756" y="280" width="170" height="52"/><text class="note" x="766" y="311">Interpreter Protocol</text>
<text class="note" x="20" y="348">足すものは abstract@v1 に足す（まだ公開していないので、版は上げない）</text>
</svg>