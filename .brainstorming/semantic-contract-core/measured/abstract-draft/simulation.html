<script>
const S=[{"a": [1], "actor": "目的のセッション（目的：ACDR の Concrete を作る。使う場面の「作者」）", "op": "Abstract の本体から、ACDR の Concrete の雛形を作る", "pre": ["Abstract の本体（基盤が持つ。この流れでは変わらない）がある", "ACDR の Concrete はまだ無い"], "post": ["Concrete の雛形ができる。インスタンスを作るので kind と $schema を const で持つ"], "beh": ["基盤の入口「意味を宣言する（作成）」が、Abstract の本体から雛形を返す（Q6 #3）", "Abstract の根の x-prompt（Concrete の書き方）を、型1と同じ形で作者に見せる"], "files": [{"f": "semantic-abstract-schema.json（Abstract の本体）", "why": "参照するだけで変えない。全体はここで一度だけ見せる", "before": "{\n  \"$schema\": \"urn:semantic-agent-schema:base:semantic-abstract-schema:v1\",\n  \"$id\": \"urn:semantic-agent-schema:base:semantic-abstract-schema:v1\",\n  \"$vocabulary\": {\n    \"https://json-schema.org/draft/2020-12/vocab/core\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/applicator\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/unevaluated\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/validation\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/meta-data\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/format-annotation\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/content\": true,\n    \"urn:semantic-agent-schema:base:vocab:v1\": true\n  },\n  \"title\": \"Semantic Abstract Schema v1 の本体\",\n  \"description\": \"Semantic Concrete Schema が従う契約の版 v1。本体自身もこの契約で検査する（$schema は自分の $id）。x- は、本体のものも Concrete が足すものも、x-extensions の一覧で定義する。\",\n  \"allOf\": [\n    {\n      \"$ref\": \"https://json-schema.org/draft/2020-12/schema\"\n    }\n  ],\n  \"x-extensions\": {\n    \"x-instance-path\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/instance-path\"\n      },\n      \"description\": \"このスキーマのインスタンスを置く場所。名前の入る所は {id} のように書く（RFC 6570 のレベル1）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマのインスタンスを置く場所である。\",\n          \"parse\": \"{…} の部分は、id などの欄の値が入る所である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"level1-template\",\n            \"rule\": \"名前の入る所を {欄の名前} にして、インスタンスのファイルの置き場所を書く。\",\n            \"why\": \"読む人とツールが、同じ置き場所に作る。\",\n            \"test\": \"{…} の中が根の properties にある欄の名前で、ほかの部分が実際の置き場所と同じかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"only-for-instances\",\n            \"rule\": \"インスタンスを作らない部品のスキーマには書かない。\",\n            \"why\": \"書くと、作られないインスタンスの kind を探すことになる。\",\n            \"test\": \"$defs だけを持つスキーマに x-instance-path が無いかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-instance-label\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/instance-label\"\n      },\n      \"description\": \"他から指されたときと、変更を見せるときのインスタンスの名前の型。{…} の中は欄の名前\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスを名前で見せるときの型である。\",\n          \"shown\": \"他から指された所と、変更を見せる画面に出る。\",\n          \"parse\": \"{…} の部分に、その欄の値が入る。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"label-fields-exist\",\n            \"rule\": \"{…} の中には、根の properties にある欄の名前だけを書く。\",\n            \"why\": \"無い欄を書くと、名前を作れない。\",\n            \"test\": \"{…} の中の名前が、根の properties にあるかを見る。\",\n            \"by\": \"machine\",\n            \"bad\": \"論点 {番号}\",\n            \"good\": \"論点 {id}「{name}」\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-delegates\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/delegates\"\n      },\n      \"description\": \"任せる先。名前から、その任せる先の定義（立場 ・ 答えの形 ・ 起動のしかた）を引く（案）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この Concrete が任せる先の一覧である。名前から、立場 ・ 答えの形 ・ 起動のしかたを引く。\",\n          \"parse\": \"kind が judging なら判定させ、working なら作業させる。argv があればその CLI をプロセスとして起動し、無ければ AI ツールで起動する。\",\n          \"when\": \"行の agent が指す先を確かめるときと、基盤が任せる先を起動するときに読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"own-only\",\n            \"rule\": \"この Concrete が任せる自分の定義だけを書き、ほかの Concrete の URN を書かない。\",\n            \"why\": \"ほかの文脈を名指しすると、文脈どうしが依存する。\",\n            \"test\": \"各項目に Concrete の URN が無いかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"by-matches-kind\",\n            \"rule\": \"by が ai の行が指す先は、kind が judging で argv の無いもの。by が machine の行が指す先は、kind が judging で argv のあるもの。\",\n            \"why\": \"判定する者と起動のしかたが食い違うと、基盤が起動できない。\",\n            \"test\": \"行の by と、指す先の kind と argv の有無の組を見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-extensions\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/extensions\"\n      },\n      \"description\": \"Concrete が足す x- の定義。名前から、値の形 ・ 説明 ・ prompt ・ 公開するか（published）を引く\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが足した x- の、値の形 ・ 意味 ・ 書き方と判定の決まりである。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"no-abstract-names\",\n            \"rule\": \"Abstract の9つの x- と同じ名前を使わない。\",\n            \"why\": \"Abstract の x- とぶつかると、どちらの意味で読むかが決まらない。\",\n            \"test\": \"名前が Abstract の9つと重なっていないかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"no-ref-into-extensions\",\n            \"rule\": \"x-extensions の中の schema を、$ref の指す先にしない。\",\n            \"why\": \"知らないキーワードの中にある指す先は、JSON Schema の実装ごとに振る舞いが決まっていない。\",\n            \"test\": \"どの $ref も x-extensions の中を指していないかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-prompt\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/prompt\"\n      },\n      \"description\": \"x-prompt。read は値の読み方を観点ごとに、write は書くときの決まり（rule）を1件ずつ持つ\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"その書く単位を、何として読み、どう書くかのプロンプトである。\",\n          \"parse\": \"read は観点ごとの1文、write は決まり（rule）の並びとして読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"read-and-write\",\n            \"rule\": \"read と write の両方を書き、write には少なくとも1つの決まりを書く。\",\n            \"why\": \"読み方だけでは、書く人が守ることが決まらない。\",\n            \"test\": \"read と write があり、write が1件以上かを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-relationship\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/relationship\"\n      },\n      \"description\": \"x-relationship。この欄が指すインスタンスの種類。to は Concrete の URN で、指す先のインスタンスが在ることを検査する\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄の値が、to の種類のインスタンスの id を指すことの宣言である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"target-exists\",\n            \"rule\": \"to には、閉じた一覧か公開された版にある Concrete の URN を書く。\",\n            \"why\": \"指す先の種類が引けないと、インスタンスが在るかを確かめられない。\",\n            \"test\": \"to の URN が引けて、値の指すインスタンスが在るかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-derived-from\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/derived\"\n      },\n      \"description\": \"x-derived-from。この欄の値を、何からどう導くか（rules ・ otherwise ・ declared）。依存は rules の when のキーから引ける\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"ほかの欄の答えから、この欄の値を導く決まりである。\",\n          \"parse\": \"rules を上から見て最初に当たった then を導出値とし、どれにも当たらなければ otherwise を導出値とする。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"only-mechanical\",\n            \"rule\": \"答えの組み合わせから、値を機械的に決める決まりがあるときに書く。\",\n            \"why\": \"人の判断が入る値は、決まりで導けない。\",\n            \"test\": \"答えの組み合わせから、値が1つに決まるかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-decided-by\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/decided\"\n      },\n      \"description\": \"x-decided-by。\\\"human\\\" のとき、この欄の値を決めるのは人である（決定権）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄の値は人が決め、人の入口から来たものでなければならない、という宣言である。\",\n          \"when\": \"AI がインスタンスを書く前と、変更を取り込む前に読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"human-entry-only\",\n            \"rule\": \"AI はこの欄の値を書き写してよいが、人の入口から来た値と違う値にしない。\",\n            \"why\": \"人の入口を通らずに変えた変更は、取り込めない理由に出る。\",\n            \"test\": \"変更の記録で、この欄が人の入口を通らずに変わっていないかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-published\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/published\"\n      },\n      \"description\": \"x-published。true のとき、この欄を他の文脈へ見せる。版は $id の v<版> が表す\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄を他の文脈へ見せるかの宣言である。\",\n          \"when\": \"ほかの文脈から指されたときと、公開する版を出すときに読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"publish-only-needed\",\n            \"rule\": \"ほかの文脈が読む欄だけを true にする。\",\n            \"why\": \"見せた欄は、版を上げずに変えられなくなる。\",\n            \"test\": \"true の欄を、ほかの文脈が指しているかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      },\n      \"published\": true\n    }\n  },\n  \"x-delegates\": {\n    \"judge\": {\n      \"role\": \"意味の判定役\",\n      \"run\": {\n        \"kind\": \"judging\"\n      }\n    }\n  },\n  \"x-prompt\": {\n    \"read\": {\n      \"means\": \"Concrete を書く人が従う契約で、従っていれば基盤が中身を知らずに使える。\",\n      \"parse\": \"根の properties は Concrete の根に書けるもの、$defs/field は欄1つの形（description と x-prompt が要る）、$defs/rule は write の行1つの形として読む。\",\n      \"shown\": \"作者が「案内する」で受け取る Concrete の書き方と、Concrete を照らした指摘に出る。\",\n      \"when\": \"Concrete を書く前と、Concrete を照らした指摘を直すときに読む。\"\n    },\n    \"write\": [\n      {\n        \"id\": \"instance-path-and-kind\",\n        \"rule\": \"インスタンスを作るスキーマには x-instance-path を書き、根の properties に kind（const）を置く。\",\n        \"why\": \"基盤は kind でインスタンスの種類を判定する。\",\n        \"test\": \"x-instance-path を持つスキーマの根に、kind の const があるかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"instance-schema-name\",\n        \"rule\": \"インスタンスを作るスキーマは、根の properties に $schema を置き、const にこのスキーマの $id を書く。\",\n        \"why\": \"インスタンスの $schema に、このスキーマの名前以外が書かれるのを、書いたその場で止める。\",\n        \"test\": \"properties.$schema.const が $id と同じかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"prompt-per-unit\",\n        \"rule\": \"欄には description と x-prompt を書く。x- のキーワードの説明と prompt は x-extensions に書く。入れ物（根の x-prompt ・ properties ・ $defs）には書かない。\",\n        \"why\": \"作成は、書く単位ごとの x-prompt を返す。\",\n        \"test\": \"根の properties の各欄に description と x-prompt があり、x- のキーワードが x-extensions に description と prompt を持つかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"read-perspectives\",\n        \"rule\": \"値の形だけで解き方が決まらない欄には parse を、画面に出る欄には shown を、読む時が決まっている欄には when を書く。\",\n        \"why\": \"means だけでは、同じ値を人と AI が別の意味に読む。\",\n        \"test\": \"欄の値の形と使われ方から、parse ・ shown ・ when が要るのに無い欄が無いかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\"\n      },\n      {\n        \"id\": \"no-prompt-on-leaf\",\n        \"rule\": \"入れ子の奥の葉には x-prompt を書かない。\",\n        \"why\": \"親の x-prompt が葉まで案内するので、葉にも書くと同じ決まりが2か所に並ぶ。\",\n        \"test\": \"x-prompt を持つ葉の親が、同じ決まりを持っていないかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\",\n        \"bad\": \"verification.passed[].option に x-prompt を書く。\",\n        \"good\": \"verification.passed の x-prompt に、option の書き方も書く。\"\n      },\n      {\n        \"id\": \"list-as-array\",\n        \"rule\": \"並びになる値は、文字列に詰めず配列の型にする。\",\n        \"why\": \"型で配列にしておけば、インスタンスを書く人が文字列に詰めることができない。\",\n        \"test\": \"区切りの記号で並びを書かせる文字列の欄が無いかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\"\n      },\n      {\n        \"id\": \"abstract-keywords-closed\",\n        \"rule\": \"x- で始まるキーは、本体の x-extensions か、このスキーマの x-extensions にある名前だけを使う。\",\n        \"why\": \"知らない x- を通すと、検証されない宣言が合格に見え、保存の形（DB ・ テーブル）の宣言も通る。\",\n        \"test\": \"x- で始まるキーが、本体の x-extensions かこのスキーマの x-extensions にあるかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"term-by-ref\",\n        \"rule\": \"欄が glossary の term を指すときは、標準の $ref で glossary の URN と $anchor を指す。\",\n        \"why\": \"Semantic Schema Resolver は、$ref の指す先から欄の term を静的にたどる。\",\n        \"test\": \"term を指す $ref の先が、閉じた一覧の glossary の $anchor かを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"rule-agent\",\n        \"rule\": \"どの決まりにも by を書く。by が ai なら agent に、argv の無い judging の任せる先を、by が machine で CLI に任せるなら argv のある judging の任せる先を書く。\",\n        \"why\": \"agent の名前から、基盤が任せる先を引く。\",\n        \"test\": \"agent が x-delegates にあり、by と kind が対応しているかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"nested-fields\",\n        \"rule\": \"入れ子の欄（items ・ allOf ・ 入れ子の properties）でも、x- と rule の決まりを守る。\",\n        \"why\": \"本体は $dynamicAnchor を書かないので、入れ子の欄には本体の形の決まりが掛からず、基盤が確かめる。\",\n        \"test\": \"入れ子の欄の x- が Abstract の9つか x-extensions にあり、rule が $defs/rule の形かを見る。\",\n        \"by\": \"machine\"\n      }\n    ]\n  },\n  \"type\": \"object\",\n  \"required\": [\n    \"$schema\",\n    \"title\",\n    \"description\"\n  ],\n  \"properties\": {\n    \"$schema\": {\n      \"type\": \"string\",\n      \"format\": \"uri\",\n      \"description\": \"従う Abstract の版\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが従う Abstract の版と作法の版で、閉じた一覧のどれかである。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"closed-list\",\n            \"rule\": \"Abstract の版の $id を書く。\",\n            \"why\": \"基盤は閉じた一覧に無い $schema を取りに行かずに断る。\",\n            \"test\": \"値が閉じた一覧のどれかと同じかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      }\n    },\n    \"$id\": {\n      \"type\": \"string\",\n      \"pattern\": \"^urn:semantic-agent-schema:[a-z0-9][a-z0-9-]*:[a-z0-9][a-z0-9-]*:v[0-9]+$\",\n      \"description\": \"スキーマの名前\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスが $schema で指す、このスキーマの名前である。\",\n          \"parse\": \"urn:semantic-agent-schema:<持ち主>:<種類>:v<版> の形で、版は v と数字である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"owner-kind-version\",\n            \"rule\": \"urn:semantic-agent-schema:<持ち主>:<種類>:v<版> の形で書く。持ち主は 基盤の一員なら base、文脈なら Skill か Agent の名前にする。\",\n            \"why\": \"Semantic Schema Resolver は、Skill と Agent の置き場所から、この名前でスキーマを引く。\",\n            \"test\": \"持ち主が base（基盤の一員）か、このスキーマを持つ Skill か Agent のフォルダの名前かを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"never-reuse\",\n            \"rule\": \"公開した版の中身を変えるときは、版を上げた新しい名前で足す。\",\n            \"why\": \"同じ名前で中身が変わると、前に書いたインスタンスが別のスキーマで検査される。\",\n            \"test\": \"公開した版の名前の中身が、公開した時と同じかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      }\n    },\n    \"title\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"スキーマの名前\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが表すものの名前である。\",\n          \"shown\": \"描画したページの題と、Concrete を照らした結果に出る。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"noun\",\n            \"rule\": \"インスタンスが何であるかを、名詞で書く。\",\n            \"why\": \"読む人は題だけで、何のインスタンスかを判断する。\",\n            \"test\": \"題が名詞で終わっているかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\",\n            \"bad\": \"意思決定を記録するためのもの\",\n            \"good\": \"意思決定の記録\"\n          }\n        ]\n      }\n    },\n    \"description\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"スキーマの説明\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスが何で、何を書かないかの説明である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"what-and-not\",\n            \"rule\": \"インスタンスが何であるかと、書かないもの（ほかのスキーマが持つもの）を書く。\",\n            \"why\": \"書かないものが分からないと、ほかのスキーマと同じことを2か所に書く。\",\n            \"test\": \"説明に、書かないものが1つ以上あるかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      }\n    },\n    \"x-instance-path\": {\n      \"$ref\": \"#/$defs/instance-path\"\n    },\n    \"x-instance-label\": {\n      \"$ref\": \"#/$defs/instance-label\"\n    },\n    \"x-delegates\": {\n      \"$ref\": \"#/$defs/delegates\"\n    },\n    \"x-extensions\": {\n      \"$ref\": \"#/$defs/extensions\"\n    },\n    \"x-prompt\": {\n      \"$ref\": \"#/$defs/prompt\"\n    },\n    \"properties\": {\n      \"$ref\": \"#/$defs/fields\"\n    },\n    \"$defs\": {\n      \"type\": \"object\",\n      \"additionalProperties\": {\n        \"$ref\": \"#/$defs/shape\"\n      }\n    }\n  },\n  \"if\": {\n    \"required\": [\n      \"x-instance-path\"\n    ]\n  },\n  \"then\": {\n    \"required\": [\n      \"properties\",\n      \"$id\"\n    ],\n    \"properties\": {\n      \"properties\": {\n        \"required\": [\n          \"kind\",\n          \"$schema\"\n        ],\n        \"properties\": {\n          \"kind\": {\n            \"required\": [\n              \"const\"\n            ]\n          },\n          \"$schema\": {\n            \"required\": [\n              \"const\"\n            ]\n          }\n        }\n      }\n    }\n  },\n  \"$defs\": {\n    \"shape\": {\n      \"type\": \"object\",\n      \"description\": \"$defs の形1つ。プロパティを持つなら、その書く単位に説明と案内を求める\",\n      \"properties\": {\n        \"properties\": {\n          \"$ref\": \"#/$defs/fields\"\n        }\n      }\n    },\n    \"fields\": {\n      \"type\": \"object\",\n      \"description\": \"書く単位の並び。$schema と入れ物（properties ・ $defs）と、x-extensions が説明する x- のキーは、書く単位として扱わない（Q7 #7）\",\n      \"properties\": {\n        \"$schema\": true,\n        \"properties\": true,\n        \"$defs\": true\n      },\n      \"additionalProperties\": {\n        \"$ref\": \"#/$defs/field\"\n      },\n      \"patternProperties\": {\n        \"^x-\": true\n      }\n    },\n    \"field\": {\n      \"type\": \"object\",\n      \"description\": \"書く単位1つ。欄に書く Abstract の x- は x-prompt ・ x-relationship ・ x-derived-from ・ x-decided-by ・ x-published の5つ\",\n      \"required\": [\n        \"description\",\n        \"x-prompt\"\n      ],\n      \"properties\": {\n        \"description\": {\n          \"type\": \"string\",\n          \"minLength\": 1,\n          \"description\": \"欄の説明\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"この欄に何を入れるかの1文である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"what-goes-here\",\n                \"rule\": \"何を入れる欄かを名詞で書く。\",\n                \"why\": \"読む人は説明で、欄の中身を判断する。\",\n                \"test\": \"説明が名詞で、欄の値と合っているかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"x-prompt\": {\n          \"$ref\": \"#/$defs/prompt\"\n        },\n        \"x-relationship\": {\n          \"$ref\": \"#/$defs/relationship\"\n        },\n        \"x-derived-from\": {\n          \"$ref\": \"#/$defs/derived\"\n        },\n        \"x-decided-by\": {\n          \"$ref\": \"#/$defs/decided\"\n        },\n        \"x-published\": {\n          \"$ref\": \"#/$defs/published\"\n        }\n      }\n    },\n    \"relationship\": {\n      \"$ref\": \"urn:semantic-agent-schema:base:annotations:v1#/$defs/relationship\"\n    },\n    \"derived\": {\n      \"type\": \"object\",\n      \"required\": [\n        \"rules\",\n        \"otherwise\"\n      ],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"rules\": {\n          \"type\": \"array\",\n          \"minItems\": 1,\n          \"description\": \"導く決まりの並び\",\n          \"items\": {\n            \"type\": \"object\",\n            \"required\": [\n              \"when\",\n              \"then\"\n            ],\n            \"additionalProperties\": false,\n            \"properties\": {\n              \"when\": {\n                \"type\": \"object\",\n                \"minProperties\": 1\n              },\n              \"then\": {\n                \"type\": [\n                  \"string\",\n                  \"number\",\n                  \"boolean\"\n                ]\n              }\n            }\n          },\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"上から当て、最初に当たった決まりの then が導出値になる。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"first-match\",\n                \"rule\": \"上の決まりほど条件を狭くする。\",\n                \"why\": \"広い条件が上にあると、下の決まりに届かない。\",\n                \"test\": \"上の決まりの when が、下の決まりの when を含んでいないかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"otherwise\": {\n          \"type\": [\n            \"string\",\n            \"number\",\n            \"boolean\"\n          ],\n          \"description\": \"どれにも当たらないときの値\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"どの決まりにも当たらないときの導出値である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"explicit-default\",\n                \"rule\": \"どれにも当たらないときの値を、決まりの結果と同じ種類の値で書く。\",\n                \"why\": \"種類が違うと、導出値を比べられない。\",\n                \"test\": \"otherwise の型が then と同じかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        },\n        \"declared\": {\n          \"type\": \"string\",\n          \"minLength\": 1,\n          \"description\": \"比べる欄の名前\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"導出値と比べる、同じオブジェクトの中の欄の名前である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"declared-exists\",\n                \"rule\": \"同じオブジェクトにある欄の名前を書く。\",\n                \"why\": \"無い欄とは比べられない。\",\n                \"test\": \"名前の欄が同じオブジェクトにあるかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        }\n      }\n    },\n    \"decided\": {\n      \"const\": \"human\"\n    },\n    \"published\": {\n      \"type\": \"boolean\"\n    },\n    \"prompt\": {\n      \"type\": \"object\",\n      \"required\": [\n        \"read\",\n        \"write\"\n      ],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"read\": {\n          \"$ref\": \"#/$defs/reading\",\n          \"description\": \"読み方\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その書く単位を何として読むかを、観点ごとに書く。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"means-first\",\n                \"rule\": \"means には、何を表すかを1文で書く。\",\n                \"why\": \"means が無いと、ほかの観点の前提が決まらない。\",\n                \"test\": \"means があるかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        },\n        \"write\": {\n          \"type\": \"array\",\n          \"minItems\": 1,\n          \"items\": {\n            \"$ref\": \"#/$defs/rule\"\n          },\n          \"description\": \"書き方の決まりの並び\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その書く単位を書くときに守る決まり（rule）の並びである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"one-rule-per-item\",\n                \"rule\": \"1つの決まりに1つのことだけを書く。\",\n                \"why\": \"2つ混ぜると、どちらで違反したかが分からない。\",\n                \"test\": \"rule の文に、2つの決まりが並んでいないかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        }\n      }\n    },\n    \"reading\": {\n      \"type\": \"object\",\n      \"description\": \"値の読み方。観点ごとに1文\",\n      \"required\": [\n        \"means\"\n      ],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"means\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"何を表すか\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その値が何を表すかの1文である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"noun-sentence\",\n                \"rule\": \"値が何であるかを、名詞で終わる1文で書く。\",\n                \"why\": \"読む人は、まず何の値かで判断する。\",\n                \"test\": \"1文で、値の中身と合っているかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"shown\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"どこにどう出るか\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その値が、画面や記録のどこにどう出るかである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"where-shown\",\n                \"rule\": \"人や AI がその値を見る場所を書く。\",\n                \"why\": \"見える場所が分かれば、書く長さと形が決まる。\",\n                \"test\": \"書いた場所に、実際にその値が出るかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"parse\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"値をどう解くか\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"値の形だけでは決まらない、解き方である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"ambiguity-only\",\n                \"rule\": \"形だけでは読み違えうる点だけを書く。\",\n                \"why\": \"形で分かることまで書くと、要る点が埋もれる。\",\n                \"test\": \"書いた点が、型や pattern で決まっていないことかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"when\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"いつ読むか\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その値を、いつ、何のために読むかである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"trigger\",\n                \"rule\": \"読む時と、そのとき決めることを書く。\",\n                \"why\": \"読む時が分かれば、読み手が決まる。\",\n                \"test\": \"時と決めることの両方があるかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        }\n      }\n    },\n    \"rule\": {\n      \"type\": \"object\",\n      \"description\": \"書くときの決まり1件\",\n      \"required\": [\n        \"id\",\n        \"rule\",\n        \"why\",\n        \"test\",\n        \"by\"\n      ],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"id\": {\n          \"type\": \"string\",\n          \"pattern\": \"^[a-z0-9]+(-[a-z0-9]+)*$\",\n          \"description\": \"決まりの名前\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その決まりを指す、英小文字とハイフンの名前である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"unique-id\",\n                \"rule\": \"同じスキーマの中で、ほかの決まりと名前を重ねない。\",\n                \"why\": \"判定の記録は、名前で決まりを指す。\",\n                \"test\": \"同じスキーマに同じ id が無いかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        },\n        \"rule\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"決まりの文\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"書くときに守ることの1文である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"state-based\",\n                \"rule\": \"決まりは、ある時点のインスタンスを見れば判定できる状態として書き、操作（手段）を書かない。\",\n                \"why\": \"状態で書けば、どの経路でその状態になったかに判定が左右されない（TLA+ の invariant の考え方）。\",\n                \"test\": \"文が「〜するときは」ではなく「〜なら、〜である」の形かを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"why\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"なぜ\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その決まりを守らないと何が起きるかである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"consequence\",\n                \"rule\": \"守らないと何が起きるかを書く。\",\n                \"why\": \"理由が無いと、決まりを直してよいかを判断できない。\",\n                \"test\": \"起きることが書かれているかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"test\": {\n          \"$ref\": \"#/$defs/sentence\",\n          \"description\": \"確かめ方\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"その決まりが守られているかを、どう確かめるかである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"checkable\",\n                \"rule\": \"何を見れば合否が決まるかを書く。\",\n                \"why\": \"確かめ方が無いと、判定する人で結果が変わる。\",\n                \"test\": \"見る場所と、合否の分かれ目があるかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"by\": {\n          \"enum\": [\n            \"machine\",\n            \"ai\",\n            \"human\"\n          ],\n          \"description\": \"判定する者\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"machine ・ ai ・ human のどれが判定するかである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"json-schema-first\",\n                \"rule\": \"値だけで決まる決まりは、行ではなく JSON Schema のキーワードで書き、行には書けないものだけを残す。\",\n                \"why\": \"JSON Schema で書けば、AI もエンジンも要らず、毎回同じ答えになる（Q0 #8）。\",\n                \"test\": \"by: machine の行が、if ・ then や pattern で書けないかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"reads\": {\n          \"type\": \"array\",\n          \"items\": {\n            \"type\": \"string\",\n            \"format\": \"json-pointer\"\n          },\n          \"description\": \"読む欄\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"判定するときに読む欄の場所（JSON Pointer）の並びである。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"minimal-reads\",\n                \"rule\": \"判定に要る欄だけを並べる。\",\n                \"why\": \"読む範囲を絞ると、意味の判定がぶれない（Q0 #2）。\",\n                \"test\": \"並べた欄が、決まりの文に出てくるかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"agent\": {\n          \"type\": \"string\",\n          \"pattern\": \"^[a-z0-9]+(-[a-z0-9]+)*$\",\n          \"description\": \"任せる先\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"この決まりを判定する、x-delegates の名前である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"agent-exists\",\n                \"rule\": \"x-delegates にある名前を書く。\",\n                \"why\": \"無い名前は起動できない。\",\n                \"test\": \"名前が x-delegates にあるかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        },\n        \"bad\": {\n          \"type\": \"string\",\n          \"minLength\": 1,\n          \"description\": \"破る例\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"この決まりを破る値の例である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"bad-violates\",\n                \"rule\": \"この決まりで violated になる値を書く。\",\n                \"why\": \"破らない例は、決まりの意味を示さない。\",\n                \"test\": \"例がこの決まりで violated になるかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"good\": {\n          \"type\": \"string\",\n          \"minLength\": 1,\n          \"description\": \"守る例\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"この決まりを守る値の例である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"good-passes\",\n                \"rule\": \"この決まりで verified になる値を書く。\",\n                \"why\": \"守らない例は、決まりの意味を示さない。\",\n                \"test\": \"例がこの決まりで verified になるかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        }\n      },\n      \"dependentRequired\": {\n        \"bad\": [\n          \"good\"\n        ],\n        \"good\": [\n          \"bad\"\n        ]\n      },\n      \"if\": {\n        \"properties\": {\n          \"by\": {\n            \"const\": \"ai\"\n          }\n        }\n      },\n      \"then\": {\n        \"required\": [\n          \"agent\"\n        ]\n      }\n    },\n    \"sentence\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"maxLength\": 120\n    },\n    \"delegate\": {\n      \"type\": \"object\",\n      \"description\": \"任せる先1件。目的（kind）と起動のしかた（argv の有無）を持つ（案）\",\n      \"required\": [\n        \"role\",\n        \"run\"\n      ],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"role\": {\n          \"type\": \"string\",\n          \"minLength\": 1,\n          \"description\": \"立場\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"任せる先が働く立場の文である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"one-stance\",\n                \"rule\": \"立場を1つだけ、名詞で書く。\",\n                \"why\": \"立場が2つあると、どちらで判断したかが決まらない。\",\n                \"test\": \"読点や「と」で2つの立場を並べていないかを見る。\",\n                \"by\": \"ai\",\n                \"agent\": \"judge\"\n              }\n            ]\n          }\n        },\n        \"answer\": {\n          \"type\": \"object\",\n          \"description\": \"答えの形\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"AI の任せる先が返す本体の形（JSON Schema）である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"answer-for-ai\",\n                \"rule\": \"argv の無い任せる先にだけ書く。\",\n                \"why\": \"CLI の答えは protocol の検証結果で決まっている。\",\n                \"test\": \"answer を持つ項目に argv が無いかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        },\n        \"run\": {\n          \"type\": \"object\",\n          \"required\": [\n            \"kind\"\n          ],\n          \"properties\": {\n            \"kind\": {\n              \"enum\": [\n                \"judging\",\n                \"working\"\n              ],\n              \"description\": \"目的：判定させるか、作業させるか（Q0 #19）\"\n            },\n            \"argv\": {\n              \"type\": \"array\",\n              \"items\": {\n                \"type\": \"string\"\n              },\n              \"description\": \"起動のしかた：あればプロセス（CLI）として起動し、無ければ AI ツールで起動する\"\n            }\n          },\n          \"description\": \"起動のしかた\",\n          \"x-prompt\": {\n            \"read\": {\n              \"means\": \"目的（judging ・ working）と、CLI なら argv である。\"\n            },\n            \"write\": [\n              {\n                \"id\": \"argv-no-shell\",\n                \"rule\": \"argv はシェルを通さない引数の配列で書く。\",\n                \"why\": \"シェルを通すと、展開が実行する環境で変わる。\",\n                \"test\": \"argv の各要素に、シェルの記号（| ・ ; ・ &）が無いかを見る。\",\n                \"by\": \"machine\"\n              }\n            ]\n          }\n        }\n      }\n    },\n    \"instance-path\": {\n      \"type\": \"string\",\n      \"minLength\": 1\n    },\n    \"instance-label\": {\n      \"type\": \"string\",\n      \"minLength\": 1\n    },\n    \"delegates\": {\n      \"type\": \"object\",\n      \"propertyNames\": {\n        \"pattern\": \"^[a-z0-9]+(-[a-z0-9]+)*$\"\n      },\n      \"additionalProperties\": {\n        \"$ref\": \"#/$defs/delegate\"\n      }\n    },\n    \"extensions\": {\n      \"type\": \"object\",\n      \"propertyNames\": {\n        \"pattern\": \"^x-[a-z0-9-]+$\"\n      },\n      \"additionalProperties\": {\n        \"type\": \"object\",\n        \"required\": [\n          \"schema\",\n          \"description\",\n          \"prompt\"\n        ],\n        \"additionalProperties\": false,\n        \"properties\": {\n          \"schema\": {\n            \"$ref\": \"https://json-schema.org/draft/2020-12/schema\",\n            \"description\": \"x- の値の形（JSON Schema）。$ref の指す先にしない\"\n          },\n          \"description\": {\n            \"type\": \"string\",\n            \"minLength\": 1\n          },\n          \"prompt\": {\n            \"$ref\": \"#/$defs/prompt\",\n            \"description\": \"この x- の読み方と書き方のプロンプト（x-prompt と同じ形）。判定はその write に rule として書く\"\n          },\n          \"published\": {\n            \"type\": \"boolean\",\n            \"description\": \"true のとき、この x- の定義を他の文脈へ見せる\"\n          }\n        }\n      }\n    }\n  }\n}", "after": "{\n  \"$schema\": \"urn:semantic-agent-schema:base:semantic-abstract-schema:v1\",\n  \"$id\": \"urn:semantic-agent-schema:base:semantic-abstract-schema:v1\",\n  \"$vocabulary\": {\n    \"https://json-schema.org/draft/2020-12/vocab/core\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/applicator\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/unevaluated\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/validation\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/meta-data\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/format-annotation\": true,\n    \"https://json-schema.org/draft/2020-12/vocab/content\": true,\n    \"urn:semantic-agent-schema:base:vocab:v1\": true\n  },\n  \"title\": \"Semantic Abstract Schema v1 の本体\",\n  \"description\": \"Semantic Concrete Schema が従う契約の版 v1。本体自身もこの契約で検査する（$schema は自分の $id）。x- は、本体のものも Concrete が足すものも、x-extensions の一覧で定義する。\",\n  \"allOf\": [\n    {\n      \"$ref\": \"https://json-schema.org/draft/2020-12/schema\"\n    }\n  ],\n  \"x-extensions\": {\n    \"x-instance-path\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/instance-path\"\n      },\n      \"description\": \"このスキーマのインスタンスを置く場所。名前の入る所は {id} のように書く（RFC 6570 のレベル1）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマのインスタンスを置く場所である。\",\n          \"parse\": \"{…} の部分は、id などの欄の値が入る所である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"level1-template\",\n            \"rule\": \"名前の入る所を {欄の名前} にして、インスタンスのファイルの置き場所を書く。\",\n            \"why\": \"読む人とツールが、同じ置き場所に作る。\",\n            \"test\": \"{…} の中が根の properties にある欄の名前で、ほかの部分が実際の置き場所と同じかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"only-for-instances\",\n            \"rule\": \"インスタンスを作らない部品のスキーマには書かない。\",\n            \"why\": \"書くと、作られないインスタンスの kind を探すことになる。\",\n            \"test\": \"$defs だけを持つスキーマに x-instance-path が無いかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-instance-label\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/instance-label\"\n      },\n      \"description\": \"他から指されたときと、変更を見せるときのインスタンスの名前の型。{…} の中は欄の名前\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスを名前で見せるときの型である。\",\n          \"shown\": \"他から指された所と、変更を見せる画面に出る。\",\n          \"parse\": \"{…} の部分に、その欄の値が入る。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"label-fields-exist\",\n            \"rule\": \"{…} の中には、根の properties にある欄の名前だけを書く。\",\n            \"why\": \"無い欄を書くと、名前を作れない。\",\n            \"test\": \"{…} の中の名前が、根の properties にあるかを見る。\",\n            \"by\": \"machine\",\n            \"bad\": \"論点 {番号}\",\n            \"good\": \"論点 {id}「{name}」\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-delegates\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/delegates\"\n      },\n      \"description\": \"任せる先。名前から、その任せる先の定義（立場 ・ 答えの形 ・ 起動のしかた）を引く（案）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この Concrete が任せる先の一覧である。名前から、立場 ・ 答えの形 ・ 起動のしかたを引く。\",\n          \"parse\": \"kind が judging なら判定させ、working なら作業させる。argv があればその CLI をプロセスとして起動し、無ければ AI ツールで起動する。\",\n          \"when\": \"行の agent が指す先を確かめるときと、基盤が任せる先を起動するときに読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"own-only\",\n            \"rule\": \"この Concrete が任せる自分の定義だけを書き、ほかの Concrete の URN を書かない。\",\n            \"why\": \"ほかの文脈を名指しすると、文脈どうしが依存する。\",\n            \"test\": \"各項目に Concrete の URN が無いかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"by-matches-kind\",\n            \"rule\": \"by が ai の行が指す先は、kind が judging で argv の無いもの。by が machine の行が指す先は、kind が judging で argv のあるもの。\",\n            \"why\": \"判定する者と起動のしかたが食い違うと、基盤が起動できない。\",\n            \"test\": \"行の by と、指す先の kind と argv の有無の組を見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-extensions\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/extensions\"\n      },\n      \"description\": \"Concrete が足す x- の定義。名前から、値の形 ・ 説明 ・ prompt ・ 公開するか（published）を引く\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが足した x- の、値の形 ・ 意味 ・ 書き方と判定の決まりである。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"no-abstract-names\",\n            \"rule\": \"Abstract の9つの x- と同じ名前を使わない。\",\n            \"why\": \"Abstract の x- とぶつかると、どちらの意味で読むかが決まらない。\",\n            \"test\": \"名前が Abstract の9つと重なっていないかを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"no-ref-into-extensions\",\n            \"rule\": \"x-extensions の中の schema を、$ref の指す先にしない。\",\n            \"why\": \"知らないキーワードの中にある指す先は、JSON Schema の実装ごとに振る舞いが決まっていない。\",\n            \"test\": \"どの $ref も x-extensions の中を指していないかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-prompt\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/prompt\"\n      },\n      \"description\": \"x-prompt。read は値の読み方を観点ごとに、write は書くときの決まり（rule）を1件ずつ持つ\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"その書く単位を、何として読み、どう書くかのプロンプトである。\",\n          \"parse\": \"read は観点ごとの1文、write は決まり（rule）の並びとして読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"read-and-write\",\n            \"rule\": \"read と write の両方を書き、write には少なくとも1つの決まりを書く。\",\n            \"why\": \"読み方だけでは、書く人が守ることが決まらない。\",\n            \"test\": \"read と write があり、write が1件以上かを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-relationship\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/relationship\"\n      },\n      \"description\": \"x-relationship。この欄が指すインスタンスの種類。to は Concrete の URN で、指す先のインスタンスが在ることを検査する\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄の値が、to の種類のインスタンスの id を指すことの宣言である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"target-exists\",\n            \"rule\": \"to には、閉じた一覧か公開された版にある Concrete の URN を書く。\",\n            \"why\": \"指す先の種類が引けないと、インスタンスが在るかを確かめられない。\",\n            \"test\": \"to の URN が引けて、値の指すインスタンスが在るかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-derived-from\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/derived\"\n      },\n      \"description\": \"x-derived-from。この欄の値を、何からどう導くか（rules ・ otherwise ・ declared）。依存は rules の when のキーから引ける\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"ほかの欄の答えから、この欄の値を導く決まりである。\",\n          \"parse\": \"rules を上から見て最初に当たった then を導出値とし、どれにも当たらなければ otherwise を導出値とする。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"only-mechanical\",\n            \"rule\": \"答えの組み合わせから、値を機械的に決める決まりがあるときに書く。\",\n            \"why\": \"人の判断が入る値は、決まりで導けない。\",\n            \"test\": \"答えの組み合わせから、値が1つに決まるかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-decided-by\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/decided\"\n      },\n      \"description\": \"x-decided-by。\\\"human\\\" のとき、この欄の値を決めるのは人である（決定権）\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄の値は人が決め、人の入口から来たものでなければならない、という宣言である。\",\n          \"when\": \"AI がインスタンスを書く前と、変更を取り込む前に読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"human-entry-only\",\n            \"rule\": \"AI はこの欄の値を書き写してよいが、人の入口から来た値と違う値にしない。\",\n            \"why\": \"人の入口を通らずに変えた変更は、取り込めない理由に出る。\",\n            \"test\": \"変更の記録で、この欄が人の入口を通らずに変わっていないかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      },\n      \"published\": true\n    },\n    \"x-published\": {\n      \"schema\": {\n        \"$ref\": \"#/$defs/published\"\n      },\n      \"description\": \"x-published。true のとき、この欄を他の文脈へ見せる。版は $id の v<版> が表す\",\n      \"prompt\": {\n        \"read\": {\n          \"means\": \"この欄を他の文脈へ見せるかの宣言である。\",\n          \"when\": \"ほかの文脈から指されたときと、公開する版を出すときに読む。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"publish-only-needed\",\n            \"rule\": \"ほかの文脈が読む欄だけを true にする。\",\n            \"why\": \"見せた欄は、版を上げずに変えられなくなる。\",\n            \"test\": \"true の欄を、ほかの文脈が指しているかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      },\n      \"published\": true\n    }\n  },\n  \"x-delegates\": {\n    \"judge\": {\n      \"role\": \"意味の判定役\",\n      \"run\": {\n        \"kind\": \"judging\"\n      }\n    }\n  },\n  \"x-prompt\": {\n    \"read\": {\n      \"means\": \"Concrete を書く人が従う契約で、従っていれば基盤が中身を知らずに使える。\",\n      \"parse\": \"根の properties は Concrete の根に書けるもの、$defs/field は欄1つの形（description と x-prompt が要る）、$defs/rule は write の行1つの形として読む。\",\n      \"shown\": \"作者が「案内する」で受け取る Concrete の書き方と、Concrete を照らした指摘に出る。\",\n      \"when\": \"Concrete を書く前と、Concrete を照らした指摘を直すときに読む。\"\n    },\n    \"write\": [\n      {\n        \"id\": \"instance-path-and-kind\",\n        \"rule\": \"インスタンスを作るスキーマには x-instance-path を書き、根の properties に kind（const）を置く。\",\n        \"why\": \"基盤は kind でインスタンスの種類を判定する。\",\n        \"test\": \"x-instance-path を持つスキーマの根に、kind の const があるかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"instance-schema-name\",\n        \"rule\": \"インスタンスを作るスキーマは、根の properties に $schema を置き、const にこのスキーマの $id を書く。\",\n        \"why\": \"インスタンスの $schema に、このスキーマの名前以外が書かれるのを、書いたその場で止める。\",\n        \"test\": \"properties.$schema.const が $id と同じかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"prompt-per-unit\",\n        \"rule\": \"欄には description と x-prompt を書く。x- のキーワードの説明と prompt は x-extensions に書く。入れ物（根の x-prompt ・ properties ・ $defs）には書かない。\",\n        \"why\": \"作成は、書く単位ごとの x-prompt を返す。\",\n        \"test\": \"根の properties の各欄に description と x-prompt があり、x- のキーワードが x-extensions に description と prompt を持つかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"read-perspectives\",\n        \"rule\": \"値の形だけで解き方が決まらない欄には parse を、画面に出る欄には shown を、読む時が決まっている欄には when を書く。\",\n        \"why\": \"means だけでは、同じ値を人と AI が別の意味に読む。\",\n        \"test\": \"欄の値の形と使われ方から、parse ・ shown ・ when が要るのに無い欄が無いかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\"\n      },\n      {\n        \"id\": \"no-prompt-on-leaf\",\n        \"rule\": \"入れ子の奥の葉には x-prompt を書かない。\",\n        \"why\": \"親の x-prompt が葉まで案内するので、葉にも書くと同じ決まりが2か所に並ぶ。\",\n        \"test\": \"x-prompt を持つ葉の親が、同じ決まりを持っていないかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\",\n        \"bad\": \"verification.passed[].option に x-prompt を書く。\",\n        \"good\": \"verification.passed の x-prompt に、option の書き方も書く。\"\n      },\n      {\n        \"id\": \"list-as-array\",\n        \"rule\": \"並びになる値は、文字列に詰めず配列の型にする。\",\n        \"why\": \"型で配列にしておけば、インスタンスを書く人が文字列に詰めることができない。\",\n        \"test\": \"区切りの記号で並びを書かせる文字列の欄が無いかを見る。\",\n        \"by\": \"ai\",\n        \"agent\": \"judge\"\n      },\n      {\n        \"id\": \"abstract-keywords-closed\",\n        \"rule\": \"x- で始まるキーは、本体の x-extensions か、このスキーマの x-extensions にある名前だけを使う。\",\n        \"why\": \"知らない x- を通すと、検証されない宣言が合格に見え、保存の形（DB ・ テーブル）の宣言も通る。\",\n        \"test\": \"x- で始まるキーが、本体の x-extensions かこのスキーマの x-extensions にあるかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"term-by-ref\",\n        \"rule\": \"欄が glossary の term を指すときは、標準の $ref で glossary の URN と $anchor を指す。\",\n        \"why\": \"Semantic Schema Resolver は、$ref の指す先から欄の term を静的にたどる。\",\n        \"test\": \"term を指す $ref の先が、閉じた一覧の glossary の $anchor かを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"rule-agent\",\n        \"rule\": \"どの決まりにも by を書く。by が ai なら agent に、argv の無い judging の任せる先を、by が machine で CLI に任せるなら argv のある judging の任せる先を書く。\",\n        \"why\": \"agent の名前から、基盤が任せる先を引く。\",\n        \"test\": \"agent が x-delegates にあり、by と kind が対応しているかを見る。\",\n        \"by\": \"machine\"\n      },\n      {\n        \"id\": \"nested-fields\",\n        \"rule\": \"入れ子の欄（items ・ allOf ・ 入れ子の properties）でも、x- と rule の決まりを守る。\",\n        \"why\": \"本体は $dynamicAnchor を書かないので、入れ子の欄には本体の形の決まりが掛からず、基盤が確かめる。\",\n        \"test\": \"入れ子の欄の x- が Abstract の9つか x-extensions にあり、rule が $defs/rule の形かを見る。\",\n        \"by\": \"machine\"\n      }\n    ]\n  },\n  \"type\": \"object\",\n  \"required\": [\n    \"$schema\",\n    \"title\",\n    \"description\"\n  ],\n  \"properties\": {\n    \"$schema\": {\n      \"type\": \"string\",\n      \"format\": \"uri\",\n      \"description\": \"従う Abstract の版\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが従う Abstract の版と作法の版で、閉じた一覧のどれかである。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"closed-list\",\n            \"rule\": \"Abstract の版の $id を書く。\",\n            \"why\": \"基盤は閉じた一覧に無い $schema を取りに行かずに断る。\",\n            \"test\": \"値が閉じた一覧のどれかと同じかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      }\n    },\n    \"$id\": {\n      \"type\": \"string\",\n      \"pattern\": \"^urn:semantic-agent-schema:[a-z0-9][a-z0-9-]*:[a-z0-9][a-z0-9-]*:v[0-9]+$\",\n      \"description\": \"スキーマの名前\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスが $schema で指す、このスキーマの名前である。\",\n          \"parse\": \"urn:semantic-agent-schema:<持ち主>:<種類>:v<版> の形で、版は v と数字である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"owner-kind-version\",\n            \"rule\": \"urn:semantic-agent-schema:<持ち主>:<種類>:v<版> の形で書く。持ち主は 基盤の一員なら base、文脈なら Skill か Agent の名前にする。\",\n            \"why\": \"Semantic Schema Resolver は、Skill と Agent の置き場所から、この名前でスキーマを引く。\",\n            \"test\": \"持ち主が base（基盤の一員）か、このスキーマを持つ Skill か Agent のフォルダの名前かを見る。\",\n            \"by\": \"machine\"\n          },\n          {\n            \"id\": \"never-reuse\",\n            \"rule\": \"公開した版の中身を変えるときは、版を上げた新しい名前で足す。\",\n            \"why\": \"同じ名前で中身が変わると、前に書いたインスタンスが別のスキーマで検査される。\",\n            \"test\": \"公開した版の名前の中身が、公開した時と同じかを見る。\",\n            \"by\": \"machine\"\n          }\n        ]\n      }\n    },\n    \"title\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"スキーマの名前\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"このスキーマが表すものの名前である。\",\n          \"shown\": \"描画したページの題と、Concrete を照らした結果に出る。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"noun\",\n            \"rule\": \"インスタンスが何であるかを、名詞で書く。\",\n            \"why\": \"読む人は題だけで、何のインスタンスかを判断する。\",\n            \"test\": \"題が名詞で終わっているかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\",\n            \"bad\": \"意思決定を記録するためのもの\",\n            \"good\": \"意思決定の記録\"\n          }\n        ]\n      }\n    },\n    \"description\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"スキーマの説明\",\n      \"x-prompt\": {\n        \"read\": {\n          \"means\": \"インスタンスが何で、何を書かないかの説明である。\"\n        },\n        \"write\": [\n          {\n            \"id\": \"what-and-not\",\n            \"rule\": \"インスタンスが何であるかと、書かないもの（ほかのスキーマが持つもの）を書く。\",\n            \"why\": \"書かないものが分からないと、ほかのスキーマと同じことを2か所に書く。\",\n            \"test\": \"説明に、書かないものが1つ以上あるかを見る。\",\n            \"by\": \"ai\",\n            \"agent\": \"judge\"\n          }\n        ]\n      }\n    },\n    \"x-instance-path\": {\n      \"$ref\": \"#/$defs/instance-path\"\n    },\n    \"x-instance-label\": {\n      \"$ref\": \"#/$defs/instance-label\"\n    },\n    \"x-delegates\": {\n      \"$ref\": \"#/$defs/delegates\"\n    },\n    \"x-extensions\": {\n      \"$ref\": \"#/$defs/extensions\"\n    },\n    \"x-prompt\": {\n      \"$ref\": \"#/$defs/prompt\"\n    },\n    \"properties\": {\n      \"$ref\": \"#/$defs/fields\"\n    },\n    \"$defs\": {\n      \"type\": \"object\",\n      \"additionalProperties\": {\n        \"$ref\": \"#/$defs/shape\"\n      }\n    }\n  },\n  \"if\": {\n    \"required\": [\n      \"x-instance-path\"\n    ]\n  },\n  \"then\": {\n    \"required\": [\n      \"properties\",\n      \"$id\"\n    ],\n    \"properties\": {\n      \"properties\": {\n        \"required\": [\n          \"kind\",\n          \"$schema\"\n        ],\n        \"properties\": {\n          \"kind\": {\n            \"required\": [\n              \"const\"\n            ]\n          },\n          \"$schema\": {\n            \"required\": [\n              \"const\"\n            ]\n          }\n        }\n      }\n    }\n  },\n  \"$defs\": {\n    \"shape\": {\n      \"type\": \"object\",\n      \"description\": \"$defs の形1つ。プロパティを持つなら、その書く単位に説明と案内を求める\",\n      \"properties\": {\n        \"properties\": {\n          \"$ref\": \"#/$defs/fields\"\n        }\n      }\n    },\n    \"fields\": {\n      \"type\": \"object\",\n      \"description\": \"書く単位の並び。$schema と入れ物（properties ・ $defs）と、x-extensions が説明する x- のキーは
