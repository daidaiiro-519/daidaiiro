<svg viewBox="0 0 1000 420" style="min-width:880px" role="img" aria-label="Semantic Read と Semantic Write の繰り返し" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .area{fill:var(--dsvg-area-fill,#FFFFFF);stroke:var(--dsvg-line,#7C8C86)}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .box.kind-3{fill:var(--dsvg-kind-3-bg,#E8ECD3);stroke:var(--dsvg-kind-3,#566318)}.dsvg .title.kind-3{fill:var(--dsvg-kind-3,#566318);font-size:13px;font-weight:700}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .title.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg #dsvg-ef4b14f6-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-ink-soft:#9DADA8;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-ink-soft:#9DADA8;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8}</style><defs data-dsvg="marker"><marker id="dsvg-ef4b14f6-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="1000.0" height="420.0" fill="#FFFFFF" rx="8"/>
<text class="title" x="10" y="24" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">繰り返すのは AI（目的のセッション）。基盤は1回ずつの Read と Write に答える</text>
<rect class="area" x="10" y="40" width="300" height="330" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="note small" x="22" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">AI（目的のセッション ・ 任せる先）</text>
<rect class="area" x="400" y="40" width="590" height="330" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="note small" x="412" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">基盤</text>
<rect class="box kind-3" x="30" y="76" width="260" height="56" fill="#E8ECD3" stroke="#566318" stroke-width="1.5" rx="5"/><text class="title kind-3" x="42" y="98" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#566318">① 読む</text><text class="note small" x="42" y="118" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">欄を JSON Pointer で指す</text>
<rect class="box kind-3" x="30" y="176" width="260" height="56" fill="#E8ECD3" stroke="#566318" stroke-width="1.5" rx="5"/><text class="title kind-3" x="42" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#566318">② JSON Patch を作る</text><text class="note small" x="42" y="218" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">x-prompt の rule に合わせて書く</text>
<rect class="box kind-3" x="30" y="290" width="260" height="56" fill="#E8ECD3" stroke="#566318" stroke-width="1.5" rx="5"/><text class="title kind-3" x="42" y="312" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#566318">④ 止めてよいか見る</text><text class="note small" x="42" y="332" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">止めない → ① へ ／ needs → 親へ</text>
<rect class="box kind-2" x="420" y="76" width="550" height="56" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="title kind-2" x="432" y="98" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">Semantic Read</text><text class="note small" x="432" y="118" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">x-prompt（read と write の rule）・ いまの値 ・ reads の値 ・ rule ごとの結果 ・ 版</text>
<rect class="box kind-2" x="420" y="176" width="550" height="96" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="title kind-2" x="432" y="198" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">③ Semantic Write</text><text class="note small" x="432" y="218" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">Patch を全部適用するか、何も適用しない（版の不一致 ・ id と $schema ・ 文書全体は断る）</text><text class="note small" x="432" y="238" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">保存する → 機械の rule と JSON Schema で検証する（violated は断らずに返す）</text><text class="note small" x="432" y="258" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">rule ごとの結果と「止めてよいか」・ needs を返す</text>
<rect class="box" x="420" y="296" width="550" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="432" y="318" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">変更を記録する（止めたあとに1回）</text><text class="note small" x="432" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">意図と目的の参照で、最後に確定した姿 → いまの前後から作る</text>
<path class="flow" d="M290,104 H418" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<path class="flow" d="M160,132 V174" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<path class="flow" d="M290,204 H418" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<path class="flow" d="M418,250 H350 V318 H292" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<path class="flow" d="M290,330 H418" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<path class="flow" d="M30,318 H20 V104 H28" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-ef4b14f6-arrow-5B6B66)"/>
<text class="note" x="10" y="398" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">止める条件：機械の rule の violated が0。error ・ unverified ・ 人が決める欄 ・ AI の rule は needs として返し、繰り返しでは消そうとしない</text>
</svg>