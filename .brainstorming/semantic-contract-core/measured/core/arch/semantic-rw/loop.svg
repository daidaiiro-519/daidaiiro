<path class="flow" d="M418,256 H350 V328 H292" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-495b19da-arrow-5B6B66)"/>
<path class="flow" d="M290,340 H418" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-495b19da-arrow-5B6B66)"/>
<path class="flow" d="M30,328 H20 V104 H28" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-495b19da-arrow-5B6B66)"/>
<text class="note" x="10" y="412" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">止める条件：機械の rule の violated が0。error ・ unverified ・ 人が決める欄 ・ AI の rule は needs として返し、繰り返しでは消そうとしない</text>
<text class="note" x="10" y="432" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">まとめ（change-summary）は、コミットの前に基盤が手元の変更の記録から機械的に作る</text>
</svg>