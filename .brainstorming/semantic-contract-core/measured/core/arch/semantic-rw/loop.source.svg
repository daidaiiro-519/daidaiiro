<svg viewBox="0 0 1000 420" style="min-width:880px" role="img" aria-label="Semantic Read と Semantic Write の繰り返し">
<text class="title" x="10" y="24">繰り返すのは AI（目的のセッション）。基盤は1回ずつの Read と Write に答える</text>
<rect class="area" x="10" y="40" width="300" height="330"/><text class="note small" x="22" y="58">AI（目的のセッション ・ 任せる先）</text>
<rect class="area" x="400" y="40" width="590" height="330"/><text class="note small" x="412" y="58">基盤</text>
<rect class="box kind-3" x="30" y="76" width="260" height="56"/><text class="title kind-3" x="42" y="98">① 読む</text><text class="note small" x="42" y="118">欄を JSON Pointer で指す</text>
<rect class="box kind-3" x="30" y="176" width="260" height="56"/><text class="title kind-3" x="42" y="198">② JSON Patch を作る</text><text class="note small" x="42" y="218">x-prompt の rule に合わせて書く</text>
<rect class="box kind-3" x="30" y="290" width="260" height="56"/><text class="title kind-3" x="42" y="312">④ 止めてよいか見る</text><text class="note small" x="42" y="332">止めない → ① へ ／ needs → 親へ</text>
<rect class="box kind-2" x="420" y="76" width="550" height="56"/><text class="title kind-2" x="432" y="98">Semantic Read</text><text class="note small" x="432" y="118">x-prompt（read と write の rule）・ いまの値 ・ reads の値 ・ rule ごとの結果 ・ 版</text>
<rect class="box kind-2" x="420" y="176" width="550" height="96"/><text class="title kind-2" x="432" y="198">③ Semantic Write</text><text class="note small" x="432" y="218">Patch を全部適用するか、何も適用しない（版の不一致 ・ id と $schema ・ 文書全体は断る）</text><text class="note small" x="432" y="238">保存する → 機械の rule と JSON Schema で検証する（violated は断らずに返す）</text><text class="note small" x="432" y="258">rule ごとの結果と「止めてよいか」・ needs を返す</text>
<rect class="box" x="420" y="296" width="550" height="56"/><text class="title" x="432" y="318">変更を記録する（止めたあとに1回）</text><text class="note small" x="432" y="338">意図と目的の参照で、最後に確定した姿 → いまの前後から作る</text>
<path class="flow" d="M290,104 H418"/>
<path class="flow" d="M160,132 V174"/>
<path class="flow" d="M290,204 H418"/>
<path class="flow" d="M418,250 H350 V318 H292"/>
<path class="flow" d="M290,330 H418"/>
<path class="flow" d="M30,318 H20 V104 H28"/>
<text class="note" x="10" y="398">止める条件：機械の rule の violated が0。error ・ unverified ・ 人が決める欄 ・ AI の rule は needs として返し、繰り返しでは消そうとしない</text>
</svg>
