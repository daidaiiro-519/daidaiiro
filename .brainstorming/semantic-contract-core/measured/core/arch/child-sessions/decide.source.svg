<svg viewBox="0 0 960 330" style="min-width:860px" role="img" aria-label="型の決め方">
<text class="title" x="10" y="24">作業の型の決め方</text>
<rect class="box" x="20" y="135" width="110" height="50"/><text class="title" x="34" y="165">作業</text>
<rect class="box" x="170" y="125" width="190" height="70"/><text class="title" x="184" y="152">1回で終わる？</text><text class="note small" x="184" y="174">積み上げるなら継続</text>
<rect class="box" x="420" y="45" width="250" height="70"/><text class="title" x="434" y="72">会話の意図で決まる？</text><text class="note small" x="434" y="94">反証は意図との差を見る</text>
<rect class="box" x="420" y="205" width="250" height="70"/><text class="title" x="434" y="232">意図を指示に書ける？</text><text class="note small" x="434" y="254">書けるなら引き継がない</text>
<rect class="box kind-2" x="730" y="35" width="210" height="40"/><text class="title kind-2" x="742" y="61">単発 ・ 引き継ぐ</text>
<rect class="box" x="730" y="85" width="210" height="40"/><text class="title" x="742" y="111">単発 ・ 引き継がない</text>
<rect class="box kind-3" x="730" y="195" width="210" height="40"/><text class="title kind-3" x="742" y="221">継続 ・ 引き継がない</text>
<rect class="box kind-1" x="730" y="245" width="210" height="40"/><text class="title kind-1" x="742" y="271">継続 ・ 引き継ぐ</text>
<path class="flow" d="M130,160 H168"/>
<path class="flow" d="M360,145 H390 V80 H418"/><text class="label small" x="372" y="70">はい</text>
<path class="flow" d="M360,175 H390 V240 H418"/><text class="label small" x="366" y="258">いいえ</text>
<path class="flow" d="M670,70 H700 V55 H728"/><text class="label small" x="680" y="48">はい</text>
<path class="flow" d="M670,90 H700 V105 H728"/><text class="label small" x="676" y="122">いいえ</text>
<path class="flow" d="M670,230 H700 V215 H728"/><text class="label small" x="680" y="208">はい</text>
<path class="flow" d="M670,250 H700 V265 H728"/><text class="label small" x="676" y="282">いいえ</text>
<text class="note" x="10" y="318">迷ったら引き継がない側（文脈がきれいで、発散しにくい）</text>
