<svg viewBox="0 0 960 470" style="min-width:860px" role="img" aria-label="2つの軸と4つの型">
<text class="title" x="10" y="24">目的のセッションの中の作業は、2つの軸で4つの型になる</text>
<text class="title" x="290" y="58">親の文脈を引き継ぐ</text>
<text class="title" x="650" y="58">引き継がない</text>
<text class="title" x="20" y="150">単発</text><text class="note small" x="20" y="170">1回で終わる</text><text class="note small" x="20" y="186">残さない</text>
<text class="title" x="20" y="340">継続</text><text class="note small" x="20" y="360">目的の間つづく</text><text class="note small" x="20" y="376">役割ごとに1つ</text>
<rect class="box kind-2" x="160" y="72" width="380" height="170"/>
<text class="title kind-2" x="176" y="98">単発 ・ 引き継ぐ</text>
<text class="note" x="176" y="124">例：反証、Semantic Search の整形</text>
<text class="note" x="176" y="148">手段：fork のサブエージェント</text>
<text class="note small" x="176" y="176">決め手：良し悪しがこの会話の意図で決まる</text>
<rect class="box" x="560" y="72" width="380" height="170"/>
<text class="title" x="576" y="98">単発 ・ 引き継がない</text>
<text class="note" x="576" y="124">例：原文の調査、AI の rule の判定</text>
<text class="note" x="576" y="148">手段：通常のサブエージェント</text>
<text class="note small" x="576" y="176">決め手：外の事実だけで決まる ／ 会話を見せない</text>
<rect class="box kind-1" x="160" y="262" width="380" height="170"/>
<text class="title kind-1" x="176" y="288">継続 ・ 引き継ぐ</text>
<text class="note" x="176" y="314">例：議論の意図を踏まえた長い実装</text>
<text class="note" x="176" y="338">手段：親から分けたセッションを再開</text>
<text class="note small" x="176" y="366">決め手：意図を指示に書き切れないときだけ</text>
<text class="note small" x="176" y="384">注意：横道も背負うので発散しやすい</text>
<rect class="box kind-3" x="560" y="262" width="380" height="170"/>
<text class="title kind-3" x="576" y="288">継続 ・ 引き継がない（既定）</text>
<text class="note" x="576" y="314">例：決まった設計どおりの長い実装</text>
<text class="note" x="576" y="338">手段：新しいセッションを再開</text>
<text class="note small" x="576" y="366">決め手：意図を指示に書き切れる</text>
<text class="note" x="10" y="458">要件整理 ・ 設計 ・ 実装そのものは子にせず、目的のセッションの中で進める</text>
</svg>
