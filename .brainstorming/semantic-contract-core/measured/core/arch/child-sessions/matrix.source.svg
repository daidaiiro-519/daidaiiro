<svg viewBox="0 0 960 360" style="min-width:860px" role="img" aria-label="親の文脈を引き継ぐ手段とキャッシュ">
<text class="title" x="10" y="24">親の文脈は4つのツールとも引き継げる。違うのはキャッシュ（費用）だけ（2026-10-25）</text>
<text class="title" x="250" y="58">Claude Code</text><text class="title" x="430" y="58">Codex</text><text class="title" x="610" y="58">Copilot</text><text class="title" x="790" y="58">Kiro</text>
<text class="title" x="20" y="100">単発 ・ 引き継ぐ</text><text class="note small" x="20" y="118">1回だけ</text>
<text class="title" x="20" y="190">継続 ・ 引き継ぐ</text><text class="note small" x="20" y="208">作るとき</text>
<text class="title" x="20" y="280">継続（両方）</text><text class="note small" x="20" y="298">2回目からの再開</text>
<rect class="box kind-2" x="240" y="72" width="170" height="70"/><text class="title kind-2" x="252" y="97">効く 96%</text><text class="note small" x="252" y="117">fork（サブエージェント</text><text class="note small" x="252" y="133">か --fork-session）</text>
<rect class="box kind-2" x="420" y="72" width="170" height="70"/><text class="title kind-2" x="432" y="97">効く 94%</text><text class="note small" x="432" y="117">spawn_agent</text><text class="note small" x="432" y="133">外から fork：64%</text>
<rect class="box kind-2" x="600" y="72" width="170" height="70"/><text class="title kind-2" x="612" y="97">効く 96%</text><text class="note small" x="612" y="117">親のセッション自身</text><text class="note small" x="612" y="133">で行う（--resume）</text>
<rect class="box kind-1" x="780" y="72" width="170" height="70"/><text class="title kind-1" x="792" y="97">効かない</text><text class="note small" x="792" y="117">ACP の session/fork</text><text class="note small" x="792" y="133">（推測）</text>
<rect class="box kind-2" x="240" y="162" width="170" height="70"/><text class="title kind-2" x="252" y="187">効く 87%</text><text class="note small" x="252" y="207">--fork-session</text>
<rect class="box kind-2" x="420" y="162" width="170" height="70"/><text class="title kind-2" x="432" y="187">効く 94%</text><text class="note small" x="432" y="207">spawn_agent</text><text class="note small" x="432" y="223">外から fork：29%</text>
<rect class="box kind-1" x="600" y="162" width="170" height="70"/><text class="title kind-1" x="612" y="187">効かない 36%</text><text class="note small" x="612" y="207">sessions import に</text><text class="note small" x="612" y="223">親の会話を写す</text>
<rect class="box kind-1" x="780" y="162" width="170" height="70"/><text class="title kind-1" x="792" y="187">効かない</text><text class="note small" x="792" y="207">ACP の session/fork</text><text class="note small" x="792" y="223">（推測）</text>
<rect class="box kind-2" x="240" y="252" width="170" height="60"/><text class="title kind-2" x="252" y="277">効く 100%</text><text class="note small" x="252" y="297">--resume</text>
<rect class="box kind-2" x="420" y="252" width="170" height="60"/><text class="title kind-2" x="432" y="277">効く 64%</text><text class="note small" x="432" y="297">exec resume</text>
<rect class="box kind-2" x="600" y="252" width="170" height="60"/><text class="title kind-2" x="612" y="277">効く 96%</text><text class="note small" x="612" y="297">--resume</text>
<rect class="box kind-2" x="780" y="252" width="170" height="60"/><text class="title kind-2" x="792" y="277">効く</text><text class="note small" x="792" y="297">--resume-id（推測）</text>
<text class="note" x="10" y="340">「効かない」は、作るときに親の会話の分を1回払うという意味。引き継ぐことはできる</text>
</svg>
