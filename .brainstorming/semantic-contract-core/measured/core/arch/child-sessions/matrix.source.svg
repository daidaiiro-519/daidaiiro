<svg viewBox="0 0 960 410" style="min-width:860px" role="img" aria-label="AI ツールごとにキャッシュが効くか">
<text class="title" x="10" y="24">親の文脈を引き継ぐ手段で、キャッシュが効くか（実測は 2026-10-25）</text>
<text class="title" x="250" y="58">Claude Code</text><text class="title" x="430" y="58">Codex</text><text class="title" x="610" y="58">Copilot</text><text class="title" x="790" y="58">Kiro</text>
<text class="title" x="20" y="100">単発 ・ 引き継ぐ</text><text class="note small" x="20" y="118">AI の中から</text>
<text class="title" x="20" y="180">単発 ・ 引き継ぐ</text><text class="note small" x="20" y="198">外からコマンド</text>
<text class="title" x="20" y="260">継続 ・ 引き継ぐ</text><text class="note small" x="20" y="278">作るとき</text>
<text class="title" x="20" y="340">継続（両方）</text><text class="note small" x="20" y="358">2回目からの再開</text>
<rect class="box kind-2" x="240" y="75" width="170" height="60"/><text class="title kind-2" x="252" y="100">効く</text><text class="note small" x="252" y="120">fork（原典）</text>
<rect class="box kind-2" x="420" y="75" width="170" height="60"/><text class="title kind-2" x="432" y="100">効く 94%</text><text class="note small" x="432" y="120">spawn_agent</text>
<rect class="box kind-1" x="600" y="75" width="170" height="60"/><text class="title kind-1" x="612" y="100">できない</text><text class="note small" x="612" y="120">子は引き継がない</text>
<rect class="box kind-1" x="780" y="75" width="170" height="60"/><text class="title kind-1" x="792" y="100">できない</text><text class="note small" x="792" y="120">子は文脈を分ける</text>
<rect class="box kind-2" x="240" y="155" width="170" height="60"/><text class="title kind-2" x="252" y="180">効く 96%</text><text class="note small" x="252" y="200">fork-session ・ 残さない</text>
<rect class="box kind-2" x="420" y="155" width="170" height="60"/><text class="title kind-2" x="432" y="180">効く 64%</text><text class="note small" x="432" y="200">exec fork --ephemeral</text>
<rect class="box kind-1" x="600" y="155" width="170" height="60"/><text class="title kind-1" x="612" y="180">できない</text><text class="note small" x="612" y="200">/fork は対話だけ</text>
<rect class="box kind-1" x="780" y="155" width="170" height="60"/><text class="title kind-1" x="792" y="180">効かない</text><text class="note small" x="792" y="200">session/fork（推測）</text>
<rect class="box kind-2" x="240" y="235" width="170" height="60"/><text class="title kind-2" x="252" y="260">効く 87%</text><text class="note small" x="252" y="280">--fork-session</text>
<rect class="box kind-2" x="420" y="235" width="170" height="60"/><text class="title kind-2" x="432" y="260">効く 94%</text><text class="note small" x="432" y="280">外からは 29%</text>
<rect class="box kind-1" x="600" y="235" width="170" height="60"/><text class="title kind-1" x="612" y="260">できない</text><text class="note small" x="612" y="280">/fork は対話だけ</text>
<rect class="box kind-1" x="780" y="235" width="170" height="60"/><text class="title kind-1" x="792" y="260">効かない</text><text class="note small" x="792" y="280">session/fork（推測）</text>
<rect class="box kind-2" x="240" y="315" width="170" height="60"/><text class="title kind-2" x="252" y="340">効く 100%</text><text class="note small" x="252" y="360">--resume</text>
<rect class="box kind-2" x="420" y="315" width="170" height="60"/><text class="title kind-2" x="432" y="340">効く 64%</text><text class="note small" x="432" y="360">exec resume</text>
<rect class="box kind-2" x="600" y="315" width="170" height="60"/><text class="title kind-2" x="612" y="340">効く 96%</text><text class="note small" x="612" y="360">--resume</text>
<rect class="box kind-2" x="780" y="315" width="170" height="60"/><text class="title kind-2" x="792" y="340">効く</text><text class="note small" x="792" y="360">--resume-id（推測）</text>
<text class="note" x="10" y="398">できない ・ 効かないところは、いまのセッションで行うか、引き継がない型にする（下の表）</text>
</svg>
