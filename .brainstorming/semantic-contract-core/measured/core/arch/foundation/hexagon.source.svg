<svg viewBox="0 0 1190 640" width="100%" style="min-width:1040px;max-width:1190px;display:block;margin:0 auto" role="img" aria-label="ヘキサゴナル：駆動する側と駆動される側のポート"><path class="area" d="M250,320 L350,40 L660,40 L760,320 L660,600 L350,600 Z"/><text class="note" x="505" y="66" text-anchor="middle">基盤（application と domain）</text><rect class="box focus" x="330" y="150" width="350" height="120"/><text class="title focus" x="345" y="174" text-anchor="start">使う場面（application）</text><text class="label" x="345" y="196" text-anchor="start">create ・ patch ・ get ・ validate ・ record</text><text class="label" x="345" y="213" text-anchor="start">judge ・ history（いまある）</text><text class="label" x="345" y="230" text-anchor="start">search ・ import ・ render ・ session</text><text class="label" x="345" y="247" text-anchor="start">release（ステップ6〜9）</text><rect class="box kind-2" x="360" y="320" width="290" height="96"/><text class="title kind-2" x="375" y="344" text-anchor="start">ドメイン</text><text class="label" x="375" y="366" text-anchor="start">集約 ・ 値 ・ ドメインサービス</text><text class="label" x="375" y="384" text-anchor="start">ポートを知らない。値を受け取り、値を返す</text><path class="flow" d="M480,270 V318"/><path class="flow" d="M530,318 V272"/><text class="note" x="95" y="110" text-anchor="middle">駆動する側（driving）</text><rect class="box" x="10" y="160" width="170" height="56"/><text class="title" x="22" y="182" text-anchor="start">CLI</text><text class="label small" x="22" y="202" text-anchor="start">人 ・ 子のセッション ・ CI</text><path class="flow" d="M180,188 H328"/><rect class="boundary" x="10" y="250" width="170" height="56"/><text class="title" x="22" y="272" text-anchor="start">MCP</text><text class="label small" x="22" y="292" text-anchor="start">子のセッション（ステップ5）</text><path class="flow" d="M180,278 H328"/><text class="label small" x="10" y="140" text-anchor="start">コマンド ＝ 使う場面を呼ぶ</text><text class="note" x="885" y="26" text-anchor="middle">駆動される側のポート（会話の目的）</text><text class="note" x="1110" y="26" text-anchor="middle">アダプター</text><rect class="box" x="770" y="40" width="230" height="48"/><text class="label" x="782" y="60" text-anchor="start">文書を保管する</text><text class="label small" x="782" y="78" text-anchor="start">StoreDocuments</text><rect class="box" x="1040" y="46" width="140" height="36"/><text class="label small" x="1110" y="68" text-anchor="middle">fs</text><path class="flow" d="M1040,64 H1002"/><rect class="box" x="770" y="96" width="230" height="48"/><text class="label" x="782" y="116" text-anchor="start">変更の記録と承認を残し、たどる</text><text class="label small" x="782" y="134" text-anchor="start">KeepChangeRecords</text><rect class="box" x="1040" y="102" width="140" height="36"/><text class="label small" x="1110" y="124" text-anchor="middle">sqlite</text><path class="flow" d="M1040,120 H1002"/><rect class="box" x="770" y="152" width="230" height="48"/><text class="label" x="782" y="172" text-anchor="start">rule の判定を残し、使い直す</text><text class="label small" x="782" y="190" text-anchor="start">KeepRuleJudgments</text><rect class="box" x="1040" y="158" width="140" height="36"/><text class="label small" x="1110" y="180" text-anchor="middle">fs</text><path class="flow" d="M1040,176 H1002"/><rect class="box" x="770" y="208" width="230" height="48"/><text class="label" x="782" y="228" text-anchor="start">確定した姿と比べる</text><text class="label small" x="782" y="246" text-anchor="start">CompareWithCommit</text><rect class="box" x="1040" y="214" width="140" height="36"/><text class="label small" x="1110" y="236" text-anchor="middle">git</text><path class="flow" d="M1040,232 H1002"/><rect class="box" x="770" y="264" width="230" height="48"/><text class="label" x="782" y="284" text-anchor="start">任せる先に依頼する</text><text class="label small" x="782" y="302" text-anchor="start">CallDelegates</text><rect class="box" x="1040" y="270" width="140" height="36"/><text class="label small" x="1110" y="292" text-anchor="middle">tools ・ coding-agents</text><path class="flow" d="M1040,288 H1002"/><rect class="boundary" x="770" y="320" width="230" height="48"/><text class="label" x="782" y="340" text-anchor="start">公開された言葉を取り寄せる</text><text class="label small" x="782" y="358" text-anchor="start">FetchPublished</text><rect class="boundary" x="1040" y="326" width="140" height="36"/><text class="label small" x="1110" y="348" text-anchor="middle">（ステップ7b）</text><path class="flow" d="M1040,344 H1002"/><rect class="boundary" x="770" y="376" width="230" height="48"/><text class="label" x="782" y="396" text-anchor="start">描いたものを書き出す</text><text class="label small" x="782" y="414" text-anchor="start">WriteRendered</text><rect class="boundary" x="1040" y="382" width="140" height="36"/><text class="label small" x="1110" y="404" text-anchor="middle">（ステップ8）</text><path class="flow" d="M1040,400 H1002"/><rect class="boundary" x="770" y="432" width="230" height="48"/><text class="label" x="782" y="452" text-anchor="start">セッションを残し、選ぶ</text><text class="label small" x="782" y="470" text-anchor="start">KeepSessions</text><rect class="boundary" x="1040" y="438" width="140" height="36"/><text class="label small" x="1110" y="460" text-anchor="middle">（ステップ9）</text><path class="flow" d="M1040,456 H1002"/><rect class="boundary" x="770" y="488" width="230" height="48"/><text class="label" x="782" y="508" text-anchor="start">セッションを続けられるか問う</text><text class="label small" x="782" y="526" text-anchor="start">AskSessionState</text><rect class="boundary" x="1040" y="494" width="140" height="36"/><text class="label small" x="1110" y="516" text-anchor="middle">（ステップ9）</text><path class="flow" d="M1040,512 H1002"/><rect class="boundary" x="770" y="544" width="230" height="48"/><text class="label" x="782" y="564" text-anchor="start">設定を読む</text><text class="label small" x="782" y="582" text-anchor="start">ReadSettings</text><rect class="boundary" x="1040" y="550" width="140" height="36"/><text class="label small" x="1110" y="572" text-anchor="middle">（ステップ9）</text><path class="flow" d="M1040,568 H1002"/><path class="flow" d="M680,210 H768"/><text class="label small" x="10" y="620" text-anchor="start">実線はいまある ・ ステップ4 で使うもの、破線はこれからのステップで足すもの。アダプターはポートを実装し、矢印はアダプター → ポート（実装する向き）</text></svg>