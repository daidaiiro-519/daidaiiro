<svg viewBox="0 0 1122 676" width="100%" style="min-width:1042px;max-width:1122px;display:block;margin:0 auto" role="img" aria-label="validate の1回が、どの役割を通るか"><rect class="box kind-1" x="44" y="10" width="168" height="46"/><text class="title kind-1" x="128.0" y="30" text-anchor="middle">主体</text><text class="label small" x="128.0" y="48" text-anchor="middle">CI ・ 本人</text><path class="grid" d="M128.0,56 V632"/><rect class="box" x="224" y="10" width="168" height="46"/><text class="title" x="308.0" y="30" text-anchor="middle">入口のアダプター</text><text class="label small" x="308.0" y="48" text-anchor="middle">CLI</text><path class="grid" d="M308.0,56 V632"/><rect class="box focus" x="404" y="10" width="168" height="46"/><text class="title focus" x="488.0" y="30" text-anchor="middle">ユースケース validate</text><text class="label small" x="488.0" y="48" text-anchor="middle">の中の手順（1歩ずつ）</text><path class="grid" d="M488.0,56 V632"/><rect class="box kind-2" x="584" y="10" width="168" height="46"/><text class="title kind-2" x="668.0" y="30" text-anchor="middle">ドメイン</text><text class="label small" x="668.0" y="48" text-anchor="middle">Validator</text><path class="grid" d="M668.0,56 V632"/><rect class="box" x="764" y="10" width="168" height="46"/><text class="title" x="848.0" y="30" text-anchor="middle">駆動される側のポート</text><text class="label small" x="848.0" y="48" text-anchor="middle">約束（trait）</text><path class="grid" d="M848.0,56 V632"/><rect class="box" x="944" y="10" width="168" height="46"/><text class="title" x="1028.0" y="30" text-anchor="middle">アダプター</text><text class="label small" x="1028.0" y="48" text-anchor="middle">fs ・ sqlite ・ ほか</text><path class="grid" d="M1028.0,56 V632"/><rect class="box kind-1" x="50" y="70" width="156" height="40"/><text class="label small" x="128.0" y="94" text-anchor="middle">validate を打つ</text><rect class="badge" x="10" y="80" width="24" height="20"/><text class="label small" x="22" y="94" text-anchor="middle">1</text><rect class="box" x="230" y="120" width="156" height="40"/><text class="label small" x="308.0" y="144" text-anchor="middle">引数を読み、ポートを組んで呼ぶ</text><rect class="badge" x="10" y="130" width="24" height="20"/><text class="label small" x="22" y="144" text-anchor="middle">2</text><rect class="box focus" x="410" y="170" width="156" height="40"/><text class="label small" x="488.0" y="194" text-anchor="middle">文書を読みたい</text><rect class="box" x="770" y="170" width="156" height="40"/><text class="label small" x="848.0" y="194" text-anchor="middle">StoreDocuments.read</text><path class="flow" d="M566,190 H768"/><rect class="box" x="950" y="170" width="156" height="40"/><text class="label small" x="1028.0" y="194" text-anchor="middle">fs：ファイルを読む</text><path class="flow" d="M926,190 H948"/><rect class="badge" x="10" y="180" width="24" height="20"/><text class="label small" x="22" y="194" text-anchor="middle">3</text><rect class="box focus" x="410" y="220" width="156" height="40"/><text class="label small" x="488.0" y="244" text-anchor="middle">承認済みの欄を知りたい</text><rect class="box" x="770" y="220" width="156" height="40"/><text class="label small" x="848.0" y="237" text-anchor="middle">KeepChangeRecords</text><text class="label small" x="848.0" y="252" text-anchor="middle">approved_fields</text><path class="flow" d="M566,240 H768"/><rect class="box" x="950" y="220" width="156" height="40"/><text class="label small" x="1028.0" y="244" text-anchor="middle">sqlite：DB を引く</text><path class="flow" d="M926,240 H948"/><rect class="badge" x="10" y="230" width="24" height="20"/><text class="label small" x="22" y="244" text-anchor="middle">4</text><rect class="box focus" x="410" y="270" width="156" height="40"/><text class="label small" x="488.0" y="294" text-anchor="middle">検証を頼む</text><rect class="box kind-2" x="590" y="270" width="156" height="40"/><text class="label small" x="668.0" y="294" text-anchor="middle">rule ごとに検証する</text><path class="flow" d="M566,290 H588"/><rect class="badge" x="10" y="280" width="24" height="20"/><text class="label small" x="22" y="294" text-anchor="middle">5</text><rect class="box kind-2" x="590" y="320" width="156" height="40"/><text class="label small" x="668.0" y="344" text-anchor="middle">任せる先への call を作る</text><rect class="badge" x="10" y="330" width="24" height="20"/><text class="label small" x="22" y="344" text-anchor="middle">6</text><rect class="box focus" x="410" y="370" width="156" height="40"/><text class="label small" x="488.0" y="387" text-anchor="middle">判断：同じ読む値の</text><text class="label small" x="488.0" y="402" text-anchor="middle">判定は使い直す</text><rect class="box" x="770" y="370" width="156" height="40"/><text class="label small" x="848.0" y="387" text-anchor="middle">KeepRuleJudgments</text><text class="label small" x="848.0" y="402" text-anchor="middle">reusable</text><path class="flow" d="M566,390 H768"/><rect class="box" x="950" y="370" width="156" height="40"/><text class="label small" x="1028.0" y="394" text-anchor="middle">fs：判定の記録を探す</text><path class="flow" d="M926,390 H948"/><rect class="badge" x="10" y="380" width="24" height="20"/><text class="label small" x="22" y="394" text-anchor="middle">7</text><rect class="box focus" x="410" y="420" width="156" height="40"/><text class="label small" x="488.0" y="444" text-anchor="middle">残りを任せる先に頼む</text><rect class="box" x="770" y="420" width="156" height="40"/><text class="label small" x="848.0" y="444" text-anchor="middle">CallDelegates.call</text><path class="flow" d="M566,440 H768"/><rect class="box" x="950" y="420" width="156" height="40"/><text class="label small" x="1028.0" y="437" text-anchor="middle">coding-agents：</text><text class="label small" x="1028.0" y="452" text-anchor="middle">Claude Code を起動</text><path class="flow" d="M926,440 H948"/><rect class="badge" x="10" y="430" width="24" height="20"/><text class="label small" x="22" y="444" text-anchor="middle">8</text><rect class="box kind-2" x="590" y="470" width="156" height="40"/><text class="label small" x="668.0" y="494" text-anchor="middle">答えを5つの値にまとめる</text><rect class="badge" x="10" y="480" width="24" height="20"/><text class="label small" x="22" y="494" text-anchor="middle">9</text><rect class="box focus" x="410" y="520" width="156" height="40"/><text class="label small" x="488.0" y="544" text-anchor="middle">新しい判定を残す</text><rect class="box" x="770" y="520" width="156" height="40"/><text class="label small" x="848.0" y="544" text-anchor="middle">KeepRuleJudgments.keep</text><path class="flow" d="M566,540 H768"/><rect class="box" x="950" y="520" width="156" height="40"/><text class="label small" x="1028.0" y="544" text-anchor="middle">fs：記録を書く</text><path class="flow" d="M926,540 H948"/><rect class="badge" x="10" y="530" width="24" height="20"/><text class="label small" x="22" y="544" text-anchor="middle">10</text><rect class="box" x="230" y="570" width="156" height="40"/><text class="label small" x="308.0" y="594" text-anchor="middle">結果を表示する</text><rect class="box kind-1" x="50" y="570" width="156" height="40"/><text class="label small" x="128.0" y="594" text-anchor="middle">結果を受け取る</text><path class="flow" d="M230,590 H208"/><rect class="badge" x="10" y="580" width="24" height="20"/><text class="label small" x="22" y="594" text-anchor="middle">11</text><text class="note" x="10" y="652" text-anchor="start">ユースケースは validate の1つ。その列の箱は validate の手順の1歩で、別のユースケースではない。</text><text class="note" x="10" y="668" text-anchor="start">ドメインとは値をやりとりし、外とはポートを通して1回ずつやりとりする。アダプターはその1回を技術で実現する</text></svg>