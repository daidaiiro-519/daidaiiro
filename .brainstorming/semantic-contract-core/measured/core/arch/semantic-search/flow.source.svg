<svg viewBox="0 0 1000 380" style="min-width:880px" role="img" aria-label="Semantic Search の流れ">
<text class="title" x="10" y="24">Semantic Search（U28）：AI は整形と選ぶことだけ。処理は基盤の機械的なコマンド</text>
<rect class="area" x="10" y="40" width="330" height="300"/><text class="note small" x="22" y="58">AI（問う者のセッション）・ セマンティック</text>
<rect class="area" x="420" y="40" width="570" height="300"/><text class="note small" x="432" y="58">基盤 ・ 機械的</text>
<rect class="box kind-3" x="30" y="72" width="290" height="50"/><text class="title kind-3" x="42" y="93">① 問いを解釈する</text><text class="note small" x="42" y="112">「探す条件」の x-prompt を読み、JSON に</text>
<rect class="box kind-3" x="30" y="142" width="290" height="50"/><text class="title kind-3" x="42" y="163">③ 読んで選ぶ</text><text class="note small" x="42" y="182">x-prompt の means で意味を確かめる</text>
<rect class="box kind-3" x="30" y="212" width="290" height="50"/><text class="title kind-3" x="42" y="233">⑤ 答えを作る</text><text class="note small" x="42" y="252">答えのスキーマの形で書き、出どころを付ける</text>
<rect class="box kind-2" x="440" y="72" width="530" height="50"/><text class="title kind-2" x="452" y="93">② Search</text><text class="note small" x="452" y="112">候補の位置の一覧 ・ 探した範囲 ・ 使った条件を返す</text>
<rect class="box kind-2" x="440" y="142" width="530" height="50"/><text class="title kind-2" x="452" y="163">④ Get</text><text class="note small" x="452" y="182">候補の欄の x-prompt ・ 値 ・ 版を返す</text>
<rect class="box kind-2" x="440" y="212" width="530" height="50"/><text class="title kind-2" x="452" y="233">⑥ Validate（渡した値。保存しない）</text><text class="note small" x="452" y="252">出どころが ② の範囲の中 ・ 値の一致 ・ 版 → 結果と needs</text>
<rect class="box" x="440" y="276" width="530" height="50"/><text class="title" x="452" y="297">⑦ 根拠の判定（AI の rule）</text><text class="note small" x="452" y="316">答えを使う前に、問う者が needs をまとめて依頼する</text>
<path class="flow" d="M320,97 H438"/>
<path class="flow" d="M175,122 V140"/>
<path class="flow" d="M320,167 H438"/>
<path class="flow" d="M175,192 V210"/>
<path class="flow" d="M320,237 H438"/>
<path class="flow" d="M380,237 V301 H438"/>
<text class="note" x="10" y="362">基盤は AI を起動しない。AI がするのは ① ③ ⑤。決定論的と言えるのは条件の JSON から先で、何も保存しない</text>
</svg>
