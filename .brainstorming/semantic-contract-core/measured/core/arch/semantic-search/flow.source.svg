<svg viewBox="0 0 1000 420" style="min-width:880px" role="img" aria-label="Semantic Search の流れ">
<text class="title" x="10" y="24">Semantic Search（U28）：手順を受け取り、AI は整形だけ。処理は機械的なコマンド</text>
<rect class="area" x="10" y="40" width="330" height="340"/><text class="note small" x="22" y="58">AI（問う者のセッション）</text>
<rect class="area" x="420" y="40" width="570" height="340"/><text class="note small" x="432" y="58">基盤</text>
<rect class="box kind-3" x="30" y="72" width="290" height="50"/><text class="title kind-3" x="42" y="93">① 手順を受け取る</text><text class="note small" x="42" y="112">問いと答えのスキーマを渡す</text>
<rect class="box kind-3" x="30" y="152" width="290" height="50"/><text class="title kind-3" x="42" y="173">② 問いを条件に整形する</text><text class="note small" x="42" y="192">JMESPath の where と select</text>
<rect class="box kind-3" x="30" y="232" width="290" height="50"/><text class="title kind-3" x="42" y="253">④ 答えに整形する</text><text class="note small" x="42" y="272">答えのスキーマの形で、出どころを付ける</text>
<rect class="box kind-2" x="440" y="72" width="530" height="50"/><text class="title kind-2" x="452" y="93">semantic-search（手順を返す）</text><text class="note small" x="452" y="112">条件のスキーマ ・ 使ってよいコマンド ・ 答えのスキーマ ・ 書き方の rule</text>
<rect class="box kind-2" x="440" y="152" width="530" height="50"/><text class="title kind-2" x="452" y="173">③ search（機械的）</text><text class="note small" x="452" y="192">インスタンスごとに where を評価し、id ・ 版 ・ 式 ・ select の値を返す</text>
<rect class="box kind-2" x="440" y="232" width="530" height="50"/><text class="title kind-2" x="452" y="253">⑤ validate（機械的 ・ 保存しない）</text><text class="note small" x="452" y="272">答えのスキーマ ・ 出どころの版で式を評価し直し、写した値と一致するか</text>
<rect class="box" x="440" y="312" width="530" height="50"/><text class="title" x="452" y="333">⑥ 根拠の判定（要約を含むときだけ）</text><text class="note small" x="452" y="352">写した値でない要約 ・ 組み合わせを答えに入れたとき。needs を問う者が依頼する</text>
<path class="flow" d="M320,97 H438"/>
<path class="flow" d="M175,122 V150"/>
<path class="flow" d="M320,177 H438"/>
<path class="flow" d="M175,202 V230"/>
<path class="flow" d="M320,257 H438"/>
<path class="flow" d="M380,257 V337 H438"/>
<text class="note" x="10" y="404">決定論的と言えるのは、条件（式）から先。式と版を出どころに残すので、同じ結果を何度でも確かめられる</text>
</svg>
