<rect class="box kind-2" x="440" y="232" width="530" height="50" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="title kind-2" x="452" y="253" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">⑤ validate（機械的 ・ 保存しない）</text><text class="note small" x="452" y="272" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">答えのスキーマ ・ 出どころの版で式を評価し直し、写した値と一致するか</text>
<rect class="box" x="440" y="312" width="530" height="50" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="452" y="333" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">⑥ 根拠の判定（要約を含むときだけ）</text><text class="note small" x="452" y="352" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">写した値でない要約 ・ 組み合わせを答えに入れたとき。needs を問う者が依頼する</text>
