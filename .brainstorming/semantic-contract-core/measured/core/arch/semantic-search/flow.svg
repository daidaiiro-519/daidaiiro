<path class="flow" d="M320,237 H438" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b3117f42-arrow-5B6B66)"/>
<path class="flow" d="M380,237 V301 H438" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b3117f42-arrow-5B6B66)"/>
<text class="note" x="10" y="362" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">基盤が起動するのは ⑦ の判定させる AI だけ。作業する AI（①③⑤）は問う者のセッションで、何も保存しない</text>
