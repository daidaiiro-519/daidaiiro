<path class="flow" d="M175,192 V210" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b84029b3-arrow-5B6B66)"/>
<path class="flow" d="M320,237 H438" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b84029b3-arrow-5B6B66)"/>
<path class="flow" d="M380,237 V301 H438" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b84029b3-arrow-5B6B66)"/>
<text class="note" x="10" y="362" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">基盤は AI を起動しない。AI がするのは ① ③ ⑤。決定論的と言えるのは条件の JSON から先で、何も保存しない</text>
