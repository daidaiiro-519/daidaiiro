<svg viewBox="0 0 1000 520" style="min-width:900px" role="img" aria-label="ポートの置き場所の変更前と変更後">
<text class="title" x="10" y="24">変更前：ポートは domain の各 crate</text>
<text class="title kind-2" x="520" y="24">変更後：ポートは application</text>
<rect class="box kind-3" x="20" y="40" width="380" height="46"/><text class="title kind-3" x="30" y="60">inbound（CLI ・ MCP）</text><text class="note small" x="30" y="77">使う場面を呼ぶ</text>
<rect class="box kind-2" x="20" y="120" width="380" height="46"/><text class="title kind-2" x="30" y="140">application</text><text class="note small" x="30" y="157">使う場面10</text>
<rect class="area" x="20" y="200" width="380" height="180"/><text class="note small" x="30" y="216">domain/</text>
<rect class="box" x="35" y="228" width="170" height="60"/><text class="title" x="45" y="249">validation</text><text class="note small" x="45" y="266">Validator ・ Resolver</text><text class="note small" x="45" y="280">ports.rs（AI ・ 取りに行く）</text>
<rect class="box" x="215" y="228" width="170" height="60"/><text class="title" x="225" y="249">change</text><text class="note small" x="225" y="266">変更を見せる</text><text class="note small" x="225" y="280">ports.rs（変更の仕組み）</text>
<rect class="box" x="35" y="300" width="170" height="60"/><text class="title" x="45" y="321">session</text><text class="note small" x="45" y="338">再開か新規か</text><text class="note small" x="45" y="352">ports.rs（索引 ・ AI）</text>
<text class="note small" x="215" y="320">ドメインサービスが</text><text class="note small" x="215" y="336">計算の途中で trait を呼ぶ</text><text class="note small" x="215" y="352">（入出力が domain の中で起きる）</text>
<rect class="box kind-1" x="20" y="420" width="380" height="46"/><text class="title kind-1" x="30" y="440">adapters</text><text class="note small" x="30" y="457">domain の ports.rs を実装する</text>
<path class="flow" d="M210,86 V118"/>
<path class="flow" d="M210,166 V198"/>
<path class="flow" d="M210,420 V382"/>
<rect class="box kind-3" x="540" y="40" width="380" height="46"/><text class="title kind-3" x="550" y="60">inbound（CLI ・ MCP）</text><text class="note small" x="550" y="77">使う場面を呼ぶ</text>
<rect class="box kind-2" x="540" y="120" width="380" height="46"/><text class="title kind-2" x="550" y="140">application</text><text class="note small" x="550" y="157">使う場面10 ＋ ports/（駆動される側12）</text>
<rect class="area" x="540" y="200" width="380" height="180"/><text class="note small" x="550" y="216">domain/（値を受け取り、値を返す）</text>
<rect class="box" x="555" y="228" width="170" height="60"/><text class="title" x="565" y="249">validation</text><text class="note small" x="565" y="266">Validator ・ Resolver</text><text class="note small" x="565" y="280">関数だけ</text>
<rect class="box" x="735" y="228" width="170" height="60"/><text class="title" x="745" y="249">change</text><text class="note small" x="745" y="266">変更を見せる</text><text class="note small" x="745" y="280">関数だけ</text>
<rect class="box" x="555" y="300" width="170" height="60"/><text class="title" x="565" y="321">session</text><text class="note small" x="565" y="338">再開か新規か</text><text class="note small" x="565" y="352">関数だけ</text>
<text class="note small" x="735" y="320">application が読んでから渡し、</text><text class="note small" x="735" y="336">返った値を書く</text><text class="note small" x="735" y="352">（入出力は application の中）</text>
<rect class="box kind-1" x="540" y="420" width="380" height="46"/><text class="title kind-1" x="550" y="440">outbound</text><text class="note small" x="550" y="457">application の ports/ を実装する</text>
<path class="flow" d="M730,86 V118"/>
<path class="flow" d="M730,166 V198"/>
<path class="flow" d="M920,443 H960 V143 H922"/><text class="label small" x="932" y="300">実装</text>
