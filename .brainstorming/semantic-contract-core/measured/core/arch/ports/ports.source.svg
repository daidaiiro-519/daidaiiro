<svg viewBox="0 0 1000 500" style="min-width:860px" role="img" aria-label="ポートの置き場所">
<text class="title" x="10" y="24">ポートは application の ports/。domain は値を受け取り値を返す</text>
<rect class="box kind-3" x="140" y="40" width="600" height="50"/><text class="title kind-3" x="152" y="61">inbound（CLI ・ MCP）</text><text class="note small" x="152" y="80">セマンティック7つ（procedure を返す）・ 機械的なコマンド</text>
<rect class="box kind-2" x="140" y="124" width="600" height="50"/><text class="title kind-2" x="152" y="145">application</text><text class="note small" x="152" y="164">使う場面（コマンドの組ごと）＋ ports/（駆動される側13）</text>
<rect class="area" x="140" y="208" width="600" height="196"/><text class="note small" x="152" y="226">domain/（値を受け取り、値を返す。入出力をしない ・ ポートを持たない）</text>
<rect class="box" x="160" y="240" width="270" height="66"/><text class="title" x="172" y="262">Semantic Schema Resolver</text><text class="note small" x="172" y="281">application が先に読んだ契約 ・ glossary ・</text><text class="note small" x="172" y="296">公開された言葉の版だけで解決する</text>
<rect class="box" x="450" y="240" width="270" height="66"/><text class="title" x="462" y="262">Semantic Schema Validator</text><text class="note small" x="462" y="281">①依頼の一覧を値で返す</text><text class="note small" x="462" y="296">②semantic-judge の答えを5つの値にまとめる</text>
<rect class="box" x="160" y="320" width="270" height="66"/><text class="title" x="172" y="342">Session Selector</text><text class="note small" x="172" y="361">渡された索引 ・ AI ツールの答え ・ 設定から</text><text class="note small" x="172" y="376">再開する ID か「新しく立てる」を返す</text>
<rect class="box" x="450" y="320" width="270" height="66"/><text class="title" x="462" y="342">Semantic Schema Renderer</text><text class="note small" x="462" y="361">渡されたビュー（既定か Concrete の）で</text><text class="note small" x="462" y="376">状態と rule ごとの結果を描く</text>
<rect class="box kind-1" x="140" y="430" width="600" height="50"/><text class="title kind-1" x="152" y="451">outbound</text><text class="note small" x="152" y="470">application の ports/ を実装する（ファイル ・ SQLite ・ Git ・ AI の CLI ・ 外のツール）</text>
<path class="flow" d="M440,90 V122"/>
<path class="flow" d="M440,174 V206"/>
<path class="flow" d="M740,455 H800 V149 H742"/><text class="label small" x="812" y="300">実装する</text>
<text class="note" x="10" y="496">矢印：依存する。domain に向かう矢印は application からの1本だけ</text>
</svg>
