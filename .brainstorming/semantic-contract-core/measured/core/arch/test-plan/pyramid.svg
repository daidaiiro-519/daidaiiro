<svg viewBox="0 0 1000 370" style="min-width:860px" role="img" aria-label="テストピラミッド" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .title.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:13px;font-weight:700}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg .title.kind-1{fill:var(--dsvg-kind-1,#7A3B6D);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .box.kind-3{fill:var(--dsvg-kind-3-bg,#E8ECD3);stroke:var(--dsvg-kind-3,#566318)}.dsvg .title.kind-3{fill:var(--dsvg-kind-3,#566318);font-size:13px;font-weight:700}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-ink-soft:#9DADA8;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-ink-soft:#9DADA8;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-kind-3-bg:#262A18;--dsvg-kind-3:#BACB78}</style><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="1000.0" height="370.0" fill="#FFFFFF" rx="8"/>
<text class="title" x="10" y="24" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">テストピラミッド（上ほど件数が少なく遅い。下ほど多く速い）</text>
<rect class="box kind-2" x="330" y="40" width="340" height="56" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="title kind-2" x="342" y="62" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">システムテスト</text><text class="note small" x="342" y="82" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">バイナリを起動 ・ 約21場面 ・ protocol だけで動かす</text>
<rect class="box kind-1" x="180" y="106" width="640" height="56" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/><text class="title kind-1" x="192" y="128" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#7A3B6D">コンポーネント統合テスト</text><text class="note small" x="192" y="148" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">application（ポートをテストダブルに）・ outbound（本物を一時ディレクトリで）・ schemas/v1（24場面）</text>
<rect class="box" x="40" y="172" width="920" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="52" y="194" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">単体テスト（最も厚い）</text><text class="note small" x="52" y="214" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">domain の値の関数。決定表 ・ 状態遷移 ・ 5つの値へのまとめ。テストダブルを使わない</text>
<rect class="box kind-3" x="40" y="246" width="920" height="56" fill="#E8ECD3" stroke="#566318" stroke-width="1.5" rx="5"/><text class="title kind-3" x="52" y="268" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#566318">静的テスト（CI の最初の段 ・ コードを動かさない）</text><text class="note small" x="52" y="288" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">依存の辺の種類 ・ 外の crate の表 ・ feature ・ clippy の forbid（domain の時刻 ・ 乱数を含む）・ test-suite/ の形を JSON Schema で</text>
<text class="note" x="10" y="330" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">同じことを2つのレベルで確かめない。決まりは「守る側1つにテスト1か所」（例：セッションの不変条件は domain と SQLite の DDL の2つが守るので、2か所）</text>
<text class="note" x="10" y="352" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">CI は毎回の push で、静的 → 単体とコンポーネント統合 → システム の順に全部を回す</text>
</svg>