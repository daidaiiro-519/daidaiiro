<svg viewBox="0 0 960 380" style="min-width:860px" role="img" aria-label="セッションの DB の表の変更">
<text class="title" x="10" y="24">手元の DB（SQLite）：セッションの表に「親の文脈」を足す。単発は登録しない</text>
<rect class="box" x="30" y="50" width="400" height="300"/>
<text class="title" x="46" y="76">sessions（DB の表）</text>
<text class="note" x="46" y="104">tool ・ id（主キー）</text>
<text class="note" x="46" y="128">purpose_ref（目的の参照）</text>
<text class="note" x="46" y="152">parent_tool ・ parent_id（親）</text>
<text class="note" x="46" y="176">role（役割。継続の子だけ）</text>
<rect class="box kind-2" x="40" y="190" width="380" height="50"/>
<text class="title kind-2" x="52" y="212">context（新しく足す）</text>
<text class="note small" x="52" y="230">fresh（引き継がない）・ inherited（引き継ぐ）。継続の子だけ</text>
<text class="note" x="46" y="268">state（open ・ closed）</text>
<text class="note" x="46" y="292">last_used_at</text>
<text class="note small" x="46" y="322">同じ親と役割で開いているのは1つまで（一意の索引）</text>
<rect class="box" x="540" y="50" width="390" height="150"/>
<text class="title" x="556" y="76">session_changes（DB の表）</text>
<text class="note" x="556" y="104">tool ・ id（セッション）</text>
<text class="note" x="556" y="128">change_id（変更の記録の id。ULID）</text>
<text class="note small" x="556" y="158">手元のセッションの索引。確定しない</text>
<path class="flow" d="M538,115 H432"/><text class="label small" x="446" y="106">セッションごと</text>
<rect class="box kind-1" x="540" y="230" width="390" height="120"/>
<text class="title kind-1" x="556" y="256">登録しないもの</text>
<text class="note" x="556" y="282">単発（引き継ぐ ・ 引き継がない）</text>
<text class="note" x="556" y="306">判定させる AI の呼び出し</text>
<text class="note small" x="556" y="332">1回で終わり、セッションとして残さない</text>
<text class="note" x="10" y="372">変わるのは context の1列と、それに合わせた CHECK（role があるときだけ context を持つ）だけ</text>
</svg>
