<svg viewBox="0 0 960 420" style="min-width:860px" role="img" aria-label="変更後の domain の crate の依存の向き">
<text class="title" x="10" y="24">変更後の domain の crate（8つ）と依存の向き（矢印：依存する。上が下を使う）</text>
<rect class="box" x="40" y="50" width="160" height="50"/><text class="title" x="52" y="71">render</text><text class="note small" x="52" y="90">Renderer ・ ビュー</text>
<rect class="box" x="240" y="50" width="160" height="50"/><text class="title" x="252" y="71">validation</text><text class="note small" x="252" y="90">Validator</text>
<rect class="box" x="520" y="50" width="160" height="50"/><text class="title" x="532" y="71">search</text><text class="note small" x="532" y="90">探す条件 ・ 出どころ</text>
<rect class="box" x="760" y="50" width="160" height="50"/><text class="title" x="772" y="71">session</text><text class="note small" x="772" y="90">どこにも依存しない</text>
<rect class="box kind-2" x="140" y="150" width="160" height="50"/><text class="title kind-2" x="152" y="171">resolver</text><text class="note small" x="152" y="190">Resolver（分けた）</text>
<rect class="box" x="520" y="150" width="160" height="50"/><text class="title" x="532" y="171">change</text><text class="note small" x="532" y="190">判定 ・ 変更の記録</text>
<rect class="box" x="140" y="250" width="160" height="50"/><text class="title" x="152" y="271">instance</text><text class="note small" x="152" y="290">インスタンス</text>
<rect class="box" x="40" y="340" width="880" height="50"/><text class="title" x="52" y="361">declaration</text><text class="note small" x="52" y="380">Abstract ・ Concrete ・ glossary（移す ・ 版を出すもここ。migration と publish の crate は無くした）</text>
<path class="flow" d="M180,100 V148"/>
<path class="flow" d="M260,100 V148"/>
<path class="flow" d="M380,100 V115 H560 V148"/>
<path class="flow" d="M60,100 V128 H540 V148"/>
<path class="flow" d="M620,100 V148"/>
