<svg viewBox="0 0 960 380" style="min-width:860px" role="img" aria-label="セッションの DB の表の変更" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .title.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:13px;font-weight:700}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A);font-size:10px}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg .title.kind-1{fill:var(--dsvg-kind-1,#7A3B6D);font-size:13px;font-weight:700}.dsvg #dsvg-966be12f-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}</style><defs data-dsvg="marker"><marker id="dsvg-966be12f-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="960.0" height="380.0" fill="#FFFFFF" rx="8"/>
<text class="title" x="10" y="24" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">手元の DB（SQLite）：セッションの表に「親の文脈」を足す。単発は登録しない</text>
<rect class="box" x="30" y="50" width="400" height="300" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="46" y="76" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">sessions（DB の表）</text>
<text class="note" x="46" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">tool ・ id（主キー）</text>
<text class="note" x="46" y="128" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">purpose_ref（目的の参照）</text>
<text class="note" x="46" y="152" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">parent_tool ・ parent_id（親）</text>
<text class="note" x="46" y="176" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">role（役割。継続の子だけ）</text>
<rect class="box kind-2" x="40" y="190" width="380" height="50" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/>
<text class="title kind-2" x="52" y="212" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">context（新しく足す）</text>
<text class="note small" x="52" y="230" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">fresh（引き継がない）・ inherited（引き継ぐ）。継続の子だけ</text>
<text class="note" x="46" y="268" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">state（open ・ closed）</text>
<text class="note" x="46" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">last_used_at</text>
<text class="note small" x="46" y="322" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">同じ親と役割で開いているのは1つまで（一意の索引）</text>
<rect class="box" x="540" y="50" width="390" height="150" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="556" y="76" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">session_changes（DB の表）</text>
<text class="note" x="556" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">tool ・ id（セッション）</text>
<text class="note" x="556" y="128" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">change_id（変更の記録の id。ULID）</text>
<text class="note small" x="556" y="158" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">手元のセッションの索引。確定しない</text>
<path class="flow" d="M538,115 H432" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-966be12f-arrow-5B6B66)"/><text class="label small" x="446" y="106" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">セッションごと</text>
<rect class="box kind-1" x="540" y="230" width="390" height="120" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/>
<text class="title kind-1" x="556" y="256" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#7A3B6D">登録しないもの</text>
<text class="note" x="556" y="282" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">単発（引き継ぐ ・ 引き継がない）</text>
<text class="note" x="556" y="306" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">判定させる AI の呼び出し</text>
<text class="note small" x="556" y="332" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">1回で終わり、セッションとして残さない</text>
<text class="note" x="10" y="372" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変わるのは context の1列と、それに合わせた CHECK（role があるときだけ context を持つ）だけ</text>
</svg>