<svg viewBox="0 0 1000 720" style="min-width:900px" role="img" aria-label="基盤のデータの関係（ER 図）">
<text class="title" x="10" y="24">基盤のデータの関係（ER 図）</text>
<rect class="badge kind-1" x="10" y="34" width="66" height="18"/><text class="label small kind-1" x="43" y="47" font-weight="700" text-anchor="middle">スキーマ</text><rect class="badge kind-2" x="86" y="34" width="66" height="18"/><text class="label small kind-2" x="119" y="47" font-weight="700" text-anchor="middle">データ</text><rect class="badge kind-3" x="162" y="34" width="66" height="18"/><text class="label small kind-3" x="195" y="47" font-weight="700" text-anchor="middle">DB の表</text><text class="note small" x="244" y="47">スキーマ：形を決めるファイル　データ：スキーマに従うファイル（確定して共有）　DB の表：手元の SQLite（確定しない）</text>
<rect class="area" x="10" y="62" width="980" height="370"/><text class="note small" x="20" y="78">リポジトリのファイル（変更の仕組みで確定して共有する）</text>
<rect class="area" x="10" y="450" width="980" height="214"/><text class="note small" x="20" y="466">手元の DB（SQLite。確定しない）</text>
<rect class="box kind-1" x="30" y="90" width="240" height="120"/><rect class="badge kind-1" x="194" y="99" width="66" height="18"/><text class="label small kind-1" x="227" y="112" font-weight="700" text-anchor="middle">スキーマ</text><text class="title kind-1" x="42" y="113">Abstract（本体）</text><line class="grid" x1="30" y1="124" x2="270" y2="124"/><text class="label small" x="42" y="142">PK $id</text><text class="note small" x="42" y="160">x-extensions（9つの x-）</text><text class="note small" x="42" y="178">x-delegates（judge）</text><text class="note small" x="42" y="196">$defs（欄 ・ rule ・ prompt …）</text>
<rect class="box kind-1" x="390" y="90" width="240" height="138"/><rect class="badge kind-1" x="554" y="99" width="66" height="18"/><text class="label small kind-1" x="587" y="112" font-weight="700" text-anchor="middle">スキーマ</text><text class="title kind-1" x="402" y="113">Concrete（文脈）</text><line class="grid" x1="390" y1="124" x2="630" y2="124"/><text class="label small" x="402" y="142">PK $id</text><text class="label small" x="402" y="160">FK $schema → Abstract</text><text class="note small" x="402" y="178">x-delegates（任せる先）</text><text class="note small" x="402" y="196">x-extensions（足した x-）</text><text class="note small" x="402" y="214">properties（欄 ・ x-prompt）</text>
<rect class="box kind-2" x="750" y="90" width="220" height="102"/><rect class="badge kind-2" x="894" y="99" width="66" height="18"/><text class="label small kind-2" x="927" y="112" font-weight="700" text-anchor="middle">データ</text><text class="title kind-2" x="762" y="113">インスタンス</text><line class="grid" x1="750" y1="124" x2="970" y2="124"/><text class="label small" x="762" y="142">PK id ・ kind</text><text class="label small" x="762" y="160">FK $schema → Concrete</text><text class="note small" x="762" y="178">欄の値</text>
<rect class="box kind-2" x="30" y="262" width="240" height="156"/><rect class="badge kind-2" x="194" y="271" width="66" height="18"/><text class="label small kind-2" x="227" y="284" font-weight="700" text-anchor="middle">データ</text><text class="title kind-2" x="42" y="285">変更の記録</text><line class="grid" x1="30" y1="296" x2="270" y2="296"/><text class="label small" x="42" y="314">PK id（ULID）</text><text class="note small" x="42" y="332">purpose_ref（外の目的）</text><text class="note small" x="42" y="350">intent（意図1つ）</text><text class="note small" x="42" y="368">writer_kind</text><text class="note small" x="42" y="386">items（対象 ・ 欄）</text><text class="label small" x="42" y="404">FK replaces → 変更の記録</text>
<rect class="box kind-2" x="390" y="262" width="270" height="138"/><rect class="badge kind-2" x="584" y="271" width="66" height="18"/><text class="label small kind-2" x="617" y="284" font-weight="700" text-anchor="middle">データ</text><text class="title kind-2" x="402" y="285">判定の記録</text><line class="grid" x1="390" y1="296" x2="660" y2="296"/><text class="label small" x="402" y="314">PK key（対象 × rule）</text><text class="label small" x="402" y="332">FK target → インスタンス か 変更の記録</text><text class="label small" x="402" y="350">FK rule → Concrete か本体の rule</text><text class="note small" x="402" y="368">result（5つの値）</text><text class="note small" x="402" y="386">judged_values</text>
<rect class="box kind-2" x="750" y="342" width="220" height="84"/><rect class="badge kind-2" x="894" y="351" width="66" height="18"/><text class="label small kind-2" x="927" y="364" font-weight="700" text-anchor="middle">データ</text><text class="title kind-2" x="762" y="365">設定</text><line class="grid" x1="750" y1="376" x2="970" y2="376"/><text class="label small" x="762" y="394">PK id（user ・ project ・ local）</text><text class="note small" x="762" y="412">session の値</text>
<rect class="box kind-3" x="30" y="484" width="240" height="138"/><rect class="badge kind-3" x="194" y="493" width="66" height="18"/><text class="label small kind-3" x="227" y="506" font-weight="700" text-anchor="middle">DB の表</text><text class="title kind-3" x="42" y="507">sessions</text><line class="grid" x1="30" y1="518" x2="270" y2="518"/><text class="label small" x="42" y="536">PK tool ・ id</text><text class="note small" x="42" y="554">purpose_ref</text><text class="label small" x="42" y="572">FK parent → sessions</text><text class="note small" x="42" y="590">role</text><text class="note small" x="42" y="608">state ・ last_used_at</text>
<rect class="box kind-3" x="390" y="484" width="270" height="102"/><rect class="badge kind-3" x="584" y="493" width="66" height="18"/><text class="label small kind-3" x="617" y="506" font-weight="700" text-anchor="middle">DB の表</text><text class="title kind-3" x="402" y="507">session_changes</text><line class="grid" x1="390" y1="518" x2="660" y2="518"/><text class="label small" x="402" y="536">PK tool ・ id ・ change_id</text><text class="label small" x="402" y="554">FK tool ・ id → sessions</text><text class="note small" x="402" y="572">change_id → 変更の記録（論理）</text>
<path class="link" d="M270,126 H390"/><text class="label small" x="276" y="120">1</text><text class="label small" x="370" y="120">多</text>
<path class="link" d="M630,126 H750"/><text class="label small" x="636" y="120">1</text><text class="label small" x="730" y="120">多</text>
<path class="link" d="M860,196 V320 H660"/><text class="label small" x="866" y="212">1</text><text class="label small" x="666" y="314">多</text>
<path class="link" d="M270,352 H390"/><text class="label small" x="276" y="346">1</text><text class="label small" x="350" y="346">0..1</text><text class="note small" x="282" y="368">I33</text>
<path class="link" d="M200,262 V248 H740 V172 H750"/><text class="note small" x="420" y="242">items の対象（インスタンスか、それ以外はパス）</text>
<path class="link" d="M270,574 H390"/><text class="label small" x="276" y="568">1</text><text class="label small" x="370" y="568">多</text>
<path class="link" d="M450,484 V444 H140 V416"/><text class="note small" x="150" y="440">change_id（ファイルの id を引く）</text>
<text class="note" x="10" y="700">1 と 多：関連の数。PK は主キー、FK は外部キー。sessions の parent は同じ表を指す（オーケストレーター → 目的 → 任せる先）</text>
