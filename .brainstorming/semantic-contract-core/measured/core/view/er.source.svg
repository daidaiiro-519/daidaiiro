<svg viewBox="0 0 1000 690" style="min-width:900px" role="img" aria-label="基盤のデータの関係：確定するファイルと手元の DB">
<text class="title" x="10" y="24">基盤のデータの関係（ER 図）</text>
<rect class="area" x="10" y="40" width="980" height="378"/><text class="note small" x="20" y="56">確定するファイル（変更の仕組みで共有する）</text>
<rect class="area" x="10" y="436" width="980" height="214"/><text class="note small" x="20" y="452">手元の DB（SQLite。確定しない）</text>
<rect class="box" x="30" y="70" width="220" height="120"/><text class="title" x="42" y="92">Abstract（本体）</text><line class="grid" x1="30" y1="102" x2="250" y2="102"/><text class="label small" x="42" y="120">PK $id</text><text class="note small" x="42" y="138">x-extensions（9つの x-）</text><text class="note small" x="42" y="156">x-delegates（judge）</text><text class="note small" x="42" y="174">$defs（欄 ・ rule ・ prompt …）</text>
<rect class="box" x="390" y="70" width="220" height="138"/><text class="title" x="402" y="92">Concrete（文脈）</text><line class="grid" x1="390" y1="102" x2="610" y2="102"/><text class="label small" x="402" y="120">PK $id</text><text class="label small" x="402" y="138">FK $schema → Abstract</text><text class="note small" x="402" y="156">x-delegates（任せる先）</text><text class="note small" x="402" y="174">x-extensions（足した x-）</text><text class="note small" x="402" y="192">properties（欄 ・ x-prompt）</text>
<rect class="box" x="750" y="70" width="220" height="102"/><text class="title" x="762" y="92">インスタンス</text><line class="grid" x1="750" y1="102" x2="970" y2="102"/><text class="label small" x="762" y="120">PK id ・ kind</text><text class="label small" x="762" y="138">FK $schema → Concrete</text><text class="note small" x="762" y="156">欄の値</text>
<rect class="box" x="30" y="240" width="220" height="156"/><text class="title" x="42" y="262">変更の記録</text><line class="grid" x1="30" y1="272" x2="250" y2="272"/><text class="label small" x="42" y="290">PK id（ULID）</text><text class="note small" x="42" y="308">purpose_ref（外の目的）</text><text class="note small" x="42" y="326">intent（意図1つ）</text><text class="note small" x="42" y="344">writer_kind</text><text class="note small" x="42" y="362">items（対象 ・ 欄）</text><text class="label small" x="42" y="380">FK replaces → 変更の記録</text>
<rect class="box" x="390" y="240" width="260" height="138"/><text class="title" x="402" y="262">判定の記録</text><line class="grid" x1="390" y1="272" x2="650" y2="272"/><text class="label small" x="402" y="290">PK key（対象 × rule）</text><text class="label small" x="402" y="308">FK target → インスタンス か 変更の記録</text><text class="label small" x="402" y="326">FK rule → Concrete か本体の rule</text><text class="note small" x="402" y="344">result（5つの値）</text><text class="note small" x="402" y="362">judged_values</text>
<rect class="box" x="750" y="320" width="220" height="84"/><text class="title" x="762" y="342">設定</text><line class="grid" x1="750" y1="352" x2="970" y2="352"/><text class="label small" x="762" y="370">PK id（user ・ project ・ local）</text><text class="note small" x="762" y="388">session の値</text>
<rect class="box" x="30" y="470" width="220" height="138"/><text class="title" x="42" y="492">sessions</text><line class="grid" x1="30" y1="502" x2="250" y2="502"/><text class="label small" x="42" y="520">PK tool ・ id</text><text class="note small" x="42" y="538">purpose_ref</text><text class="label small" x="42" y="556">FK parent → sessions</text><text class="note small" x="42" y="574">role</text><text class="note small" x="42" y="592">state ・ last_used_at</text>
<rect class="box" x="390" y="470" width="220" height="102"/><text class="title" x="402" y="492">session_changes</text><line class="grid" x1="390" y1="502" x2="610" y2="502"/><text class="label small" x="402" y="520">PK tool ・ id ・ change_id</text><text class="label small" x="402" y="538">FK tool ・ id → sessions</text><text class="note small" x="402" y="556">change_id → 変更の記録（論理）</text>
<path class="link" d="M250,104 H390"/><text class="label small" x="256" y="98">1</text><text class="label small" x="370" y="98">多</text>
<path class="link" d="M610,104 H750"/><text class="label small" x="616" y="98">1</text><text class="label small" x="730" y="98">多</text>
<path class="link" d="M840,174 V300 H650"/><text class="label small" x="846" y="190">1</text><text class="label small" x="656" y="294">多</text>
<path class="link" d="M250,330 H390"/><text class="label small" x="256" y="324">1</text><text class="label small" x="350" y="324">0..1</text><text class="note small" x="262" y="346">I33</text>
<path class="link" d="M200,240 V226 H740 V150 H750"/><text class="note small" x="420" y="220">items の対象（インスタンスか、それ以外はパス）</text>
<path class="link" d="M250,560 H390"/><text class="label small" x="256" y="554">1</text><text class="label small" x="370" y="554">多</text>
<path class="link" d="M450,470 V430 H140 V398"/><text class="note small" x="150" y="426">change_id（ファイルの id を引く）</text>
<text class="note" x="10" y="680">1 と 多：関連の数。PK は主キー、FK は外部キー。sessions の parent は同じ表を指す（オーケストレーター → 目的 → 任せる先）。目的と確定の単位の参照は外（基盤は解釈しない）</text>
</svg>