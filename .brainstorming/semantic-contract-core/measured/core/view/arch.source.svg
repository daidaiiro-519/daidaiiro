<svg viewBox="0 0 1000 640" style="min-width:900px" role="img" aria-label="crate の依存の向き">
<text class="title" x="10" y="24">crate の依存の向き（矢印：依存する。上の段が下の段を使う）</text>
<rect class="box kind-3" x="300" y="40" width="300" height="50"/><text class="title kind-3" x="310" y="61">crates/inbound/cli</text><text class="note small" x="310" y="80">起動と結びつけ（compose）</text>
<rect class="box kind-2" x="300" y="120" width="300" height="50"/><text class="title kind-2" x="310" y="141">crates/application</text><text class="note small" x="310" y="160">使う場面10 ・ ports/（駆動される側12）</text>
<rect class="box kind-1" x="700" y="120" width="260" height="50"/><text class="title kind-1" x="710" y="141">crates/outbound/*</text><text class="note small" x="710" y="160">ports/ を実装する</text>
<path class="flow" d="M450,90 V118"/>
<path class="flow" d="M698,145 H602"/><text class="label small" x="635" y="138">実装</text>
<path class="flow" d="M600,65 H830 V118"/><text class="label small" x="690" y="58">結びつける</text>
<path class="flow" d="M450,170 V198"/>
<rect class="area" x="10" y="200" width="980" height="390"/><text class="note small" x="20" y="218">crates/domain/（値を受け取り値を返す。入出力をしない ・ ポートを持たない）</text>
<rect class="box" x="40" y="240" width="160" height="50"/><text class="title" x="50" y="261">render</text><text class="note small" x="50" y="280">描画</text>
<rect class="box" x="760" y="240" width="140" height="50"/><text class="title" x="770" y="261">session</text><text class="note small" x="770" y="280">どこにも依存しない</text>
<rect class="box" x="40" y="330" width="160" height="50"/><text class="title" x="50" y="351">validation</text><text class="note small" x="50" y="370">意味の検証</text>
<rect class="box" x="240" y="330" width="160" height="50"/><text class="title" x="250" y="351">search</text><text class="note small" x="250" y="370">意味で探す</text>
<rect class="box" x="140" y="420" width="160" height="50"/><text class="title" x="150" y="441">change</text><text class="note small" x="150" y="460">判定の記録 ・ 変更の記録</text>
<rect class="box" x="420" y="420" width="140" height="50"/><text class="title" x="430" y="441">instance</text><text class="note small" x="430" y="460">作成と変更</text>
<rect class="box" x="590" y="420" width="140" height="50"/><text class="title" x="600" y="441">migration</text><text class="note small" x="600" y="460">移す</text>
<rect class="box" x="760" y="420" width="140" height="50"/><text class="title" x="770" y="441">publish</text><text class="note small" x="770" y="460">公開</text>
<rect class="box" x="140" y="510" width="760" height="50"/><text class="title" x="150" y="531">declaration</text><text class="note small" x="150" y="550">Abstract ・ Concrete ・ glossary（Abstract が決める値の型も）</text>
<path class="flow" d="M120,290 V328"/>
<path class="flow" d="M170,380 V418"/>
<path class="flow" d="M270,380 V418"/>
<path class="flow" d="M220,470 V508"/>
<path class="flow" d="M490,470 V508"/>
<path class="flow" d="M660,470 V508"/>
<path class="flow" d="M830,470 V508"/>
<text class="note" x="10" y="612">矢印の先の先も直接使ってよい（render → change ・ declaration、validation ・ search → declaration）。辺の全部は下の表が持つ</text>
<text class="note" x="10" y="630">application は domain/ のすべてに依存する</text>
</svg>