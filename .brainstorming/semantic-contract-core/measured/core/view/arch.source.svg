<svg viewBox="0 0 1000 640" style="min-width:900px" role="img" aria-label="crate の依存の向き">
<text class="title" x="10" y="24">crate の依存の向き（矢印：依存する ・ 外から中へ）</text>
<rect class="box kind-3" x="380" y="40" width="240" height="50"/><text class="title kind-3" x="390" y="61">crates/entry/cli</text><text class="note small" x="390" y="80">起動と結びつけ（compose）</text>
<rect class="box kind-2" x="330" y="130" width="340" height="50"/><text class="title kind-2" x="340" y="151">crates/application</text><text class="note small" x="340" y="170">駆動する側のポート10（使う場面）</text>
<rect class="area" x="10" y="212" width="690" height="370"/><text class="note small" x="20" y="228">crates/domain/（業務領域ごとの crate。入出力をしない）</text>
<rect class="box" x="30" y="240" width="150" height="50"/><text class="title" x="40" y="261">search</text><text class="note small" x="40" y="280">意味で探す</text>
<rect class="box" x="210" y="240" width="150" height="50"/><text class="title" x="220" y="261">change</text><text class="note small" x="220" y="280">変更の確かめ</text>
<rect class="box" x="390" y="240" width="150" height="50"/><text class="title" x="400" y="261">instance</text><text class="note small" x="400" y="280">作成と変更</text>
<rect class="box" x="560" y="240" width="120" height="50"/><text class="title" x="570" y="261">session</text><text class="note small" x="570" y="280">セッション</text>
<rect class="box" x="30" y="340" width="150" height="50"/><text class="title" x="40" y="361">render</text><text class="note small" x="40" y="380">描画</text>
<rect class="box" x="210" y="340" width="150" height="50"/><text class="title" x="220" y="361">validation</text><text class="note small" x="220" y="380">意味の検証</text>
<rect class="box" x="390" y="340" width="150" height="50"/><text class="title" x="400" y="361">migration</text><text class="note small" x="400" y="380">移す</text>
<rect class="box" x="560" y="340" width="120" height="50"/><text class="title" x="570" y="361">publish</text><text class="note small" x="570" y="380">公開</text>
<rect class="box" x="210" y="440" width="150" height="50"/><text class="title" x="220" y="461">declaration</text><text class="note small" x="220" y="480">意味の宣言</text>
<rect class="box" x="30" y="524" width="650" height="40"/><text class="title" x="40" y="549">values</text><text class="note small" x="110" y="549">2つ以上の領域が使う値（5つの値 ・ 状態 ・ URN ・ 対象 ・ id）。domain の全部が依存する</text>
<path class="flow" d="M180,265 H208"/>
<path class="flow" d="M285,290 V338"/>
<path class="flow" d="M235,290 V305 H140 V338"/>
<path class="flow" d="M430,290 V320 H330 V338"/>
<path class="flow" d="M285,390 V438"/>
<path class="flow" d="M105,390 V465 H208"/>
<path class="flow" d="M465,390 V465 H362"/>
<path class="flow" d="M615,390 V480 H362"/>
<path class="flow" d="M500,90 V128"/>
<path class="flow" d="M500,180 V210"/><text class="label small" x="508" y="202">領域を呼ぶ</text>
<rect class="area" x="730" y="212" width="260" height="370"/><text class="note small" x="740" y="228">crates/adapters/（外の技術。ポートを実装）</text>
<rect class="box kind-1" x="750" y="240" width="220" height="50"/><text class="title kind-1" x="760" y="261">agents-contract</text><text class="note small" x="760" y="280">腐敗防止層（Agents 契約）</text>
<rect class="box kind-1" x="750" y="300" width="220" height="50"/><text class="title kind-1" x="760" y="321">ai-cli</text><text class="note small" x="760" y="340">5つの AI ツール（モジュール）</text>
<rect class="box kind-1" x="750" y="360" width="220" height="50"/><text class="title kind-1" x="760" y="381">git</text><text class="note small" x="760" y="400">変更の仕組み（Git）</text>
<rect class="box kind-1" x="750" y="420" width="220" height="50"/><text class="title kind-1" x="760" y="441">fs</text><text class="note small" x="760" y="460">ファイル ・ 設定 ・ スナップショット</text>
<rect class="box kind-1" x="750" y="480" width="220" height="50"/><text class="title kind-1" x="760" y="501">sqlite</text><text class="note small" x="760" y="520">手元の DB（rusqlite）</text>
<path class="flow" d="M730,330 H702"/><text class="label small" x="703" y="350">実装</text>
<path class="flow" d="M620,65 H860 V210"/><text class="label small" x="700" y="58">結びつける</text>
<text class="note" x="10" y="620">search → validation ・ instance → declaration など、矢印の先の先を直接使う辺は表に書く。session は values だけに依存する</text>
</svg>