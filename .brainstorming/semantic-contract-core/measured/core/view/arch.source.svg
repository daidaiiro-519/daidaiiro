<svg viewBox="0 0 1000 720" style="min-width:900px" role="img" aria-label="crate の依存の向き">
<text class="title" x="10" y="24">crate の依存の向き（矢印：依存する。どの矢印も上から下 ＝ 外から中心へ向かう）</text>
<rect class="area" x="10" y="36" width="940" height="76"/><text class="note small" x="20" y="52">外側：入口（inbound）。outbound を application へ結びつける</text>
<rect class="area" x="10" y="120" width="940" height="76"/><text class="note small" x="20" y="136">外側：外の技術（outbound）。application の ports/ を実装する</text>
<rect class="area" x="10" y="204" width="940" height="76"/><text class="note small" x="20" y="220">使う場面とポート</text>
<rect class="area" x="10" y="288" width="940" height="382"/><text class="note small" x="20" y="304">中心：業務（domain）。値を受け取り値を返す。入出力をしない ・ ポートを持たない</text>
<rect class="box kind-3" x="250" y="58" width="400" height="50"/><text class="title kind-3" x="260" y="79">crates/inbound/cli</text><text class="note small" x="260" y="98">コマンド：セマンティック7つ ・ 機械的 ・ compose</text>
<rect class="box kind-1" x="250" y="142" width="400" height="50"/><text class="title kind-1" x="260" y="163">crates/outbound/*</text><text class="note small" x="260" y="182">agents-contract ・ ai-cli ・ git ・ fs ・ tools ・ sqlite</text>
<rect class="box kind-2" x="300" y="226" width="300" height="50"/><text class="title kind-2" x="310" y="247">crates/application</text><text class="note small" x="310" y="266">使う場面 ・ ports/（駆動される側13）</text>
<path class="flow" d="M450,108 V140"/>
<path class="flow" d="M450,192 V224"/>
<path class="flow" d="M650,83 H700 V251 H602"/><text class="label small" x="708" y="166">使う</text>
<path class="flow" d="M450,276 V306"/>
<text class="label small" x="460" y="300">domain/ のすべてを使う</text>
<rect class="box" x="40" y="320" width="160" height="50"/><text class="title" x="50" y="341">validation</text><text class="note small" x="50" y="360">Validator</text>
<rect class="box" x="240" y="320" width="160" height="50"/><text class="title" x="250" y="341">render</text><text class="note small" x="250" y="360">Renderer</text>
<rect class="box" x="760" y="320" width="140" height="50"/><text class="title" x="770" y="341">session</text><text class="note small" x="770" y="360">どこにも依存しない</text>
<rect class="box" x="240" y="410" width="160" height="50"/><text class="title" x="250" y="431">search</text><text class="note small" x="250" y="450">探す条件 ・ 出どころ</text>
<rect class="box" x="480" y="410" width="160" height="50"/><text class="title" x="490" y="431">resolver</text><text class="note small" x="490" y="450">Resolver</text>
<rect class="box" x="140" y="500" width="160" height="50"/><text class="title" x="150" y="521">change</text><text class="note small" x="150" y="540">判定 ・ 変更の記録 ・ まとめ</text>
<rect class="box" x="420" y="500" width="180" height="50"/><text class="title" x="430" y="521">instance</text><text class="note small" x="430" y="540">インスタンス</text>
<rect class="box" x="140" y="590" width="760" height="50"/><text class="title" x="150" y="611">declaration</text><text class="note small" x="150" y="630">Abstract ・ Concrete ・ glossary ・ procedure（Abstract が決める値の型も）</text>
<path class="link" d="M120,370 V390 M320,370 V390 M120,390 H560"/>
<text class="label small" x="660" y="430">validation と render は、どちらも</text><text class="label small" x="660" y="448">resolver と change を使う</text>
<path class="flow" d="M200,390 V498"/>
<path class="flow" d="M560,390 V408"/>
<path class="flow" d="M280,460 V498"/>
<path class="flow" d="M360,460 V480 H460 V498"/>
<path class="flow" d="M560,460 V498"/>
<path class="flow" d="M220,550 V588"/>
<path class="flow" d="M510,550 V588"/>
<path class="flow" d="M975,40 V666"/><text class="label small" x="958" y="34">外</text><text class="label small" x="952" y="690">中心</text>
<text class="note" x="10" y="708">矢印の先の先も直接使ってよい（例：validation → instance ・ declaration）。辺の全部は下の表が持つ</text>
</svg>