<svg viewBox="0 0 740 430" style="min-width:600px" role="img" aria-label="機械的な検証と意味の検証の比べ" class="dsvg"><style data-dsvg="dark">.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .area{stroke:var(--dsvg-line,#7C8C86)}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg #dsvg-0b9ab7c0-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}}:root[data-theme="dark"] .dsvg{--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}</style><defs data-dsvg="marker"><marker id="dsvg-0b9ab7c0-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect class="box" x="10" y="10" width="720" height="74" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="22" y="30" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">見本の論点（実測で使ったもの）</text><text class="label" x="22" y="50" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">問い「練習の Skill の入口をどこに置くか」</text><text class="label" x="22" y="68" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">答え「SKILL.md は日本語で書く。」 ・ 外した案なし</text><rect class="area" x="10" y="100" width="350" height="240" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="26" y="124" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">変更前：機械的な検証だけ</text><rect class="area" x="380" y="100" width="350" height="240" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title focus" x="396" y="124" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">変更後：意味の検証を足す</text><rect class="box" x="30" y="140" width="310" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="185.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">check　形 ・ 参照 ・ 導出値 → 合格</text><rect class="box" x="30" y="196" width="310" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="185.0" y="216" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">inspect　1文の長さ ・ depends → 0件</text><rect class="box warn" x="30" y="256" width="310" height="64" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="185.0" y="276" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">問いに答えていないことは</text><text class="label warn" x="185.0" y="294" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">人が全文を読むまで見つからない</text><rect class="box" x="400" y="140" width="310" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="555.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">check　いまと同じ → 合格（毎回同じ）</text><rect class="box focus" x="400" y="196" width="310" height="64" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="555.0" y="216" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">答えの決まり one-sentence-first</text><text class="label focus" x="555.0" y="234" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">→ 守れていない（問いに答えていない）</text><rect class="box" x="400" y="270" width="310" height="50" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="555.0" y="290" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">リポジトリの決まり fits-repo</text><text class="label" x="555.0" y="308" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">→ 判断できない（文脈を渡していない）</text><path class="flow" d="M185,240 V254" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-0b9ab7c0-arrow-5B6B66)"/><rect class="box" x="10" y="356" width="350" height="64" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="185.0" y="376" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">機械的な検証：値を見れば決まる</text><text class="label" x="185.0" y="394" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">合否に使う（外した案が1件以上 など）</text><rect class="box focus" x="380" y="356" width="350" height="64" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="555.0" y="376" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">意味の検証：読まないと決まらない</text><text class="label focus" x="555.0" y="394" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">合否に使わず、人が指された場所から読む</text></svg>