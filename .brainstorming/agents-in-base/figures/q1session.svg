<svg viewBox="0 0 740 290" style="min-width:600px" role="img" aria-label="親セッションと子セッション" class="dsvg"><style data-dsvg="dark">.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg #dsvg-4d2cbb8c-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-ink:#E6EEEB}}:root[data-theme="dark"] .dsvg{--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-ink:#E6EEEB}</style><defs data-dsvg="marker"><marker id="dsvg-4d2cbb8c-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect class="box focus" x="230" y="10" width="280" height="80" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title focus" x="370.0" y="30" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">親セッション</text><text class="label focus" x="370.0" y="50" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">作業を始めたセッション</text><text class="label focus" x="370.0" y="68" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">チャットとは限らない（CI ・ 別の AI も）</text><path class="flow" d="M300,90 V120 H120 V138" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-4d2cbb8c-arrow-5B6B66)"/><path class="flow" d="M370,90 V138" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-4d2cbb8c-arrow-5B6B66)"/><path class="flow" d="M440,90 V120 H620 V138" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-4d2cbb8c-arrow-5B6B66)"/><rect class="box" x="10" y="140" width="220" height="110" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="120.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">子：検証</text><text class="label" x="120.0" y="180" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">親の文脈を引き継がない</text><text class="label" x="120.0" y="198" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">毎回新しい ・ 読むだけ</text><text class="label" x="120.0" y="216" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">決まりと渡した文脈だけ</text><rect class="box" x="260" y="140" width="220" height="110" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="370.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">子：会話</text><text class="label" x="370.0" y="180" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">親から分かれて続く</text><text class="label" x="370.0" y="198" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">対象ごとに同じ子を続ける</text><text class="label" x="370.0" y="216" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">決めた入口と Skill で書く</text><rect class="box" x="510" y="140" width="220" height="110" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="620.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">子：分けて呼ぶ</text><text class="label" x="620.0" y="180" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">親の文脈を写して分かれる</text><text class="label" x="620.0" y="198" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Claude Code の fork だけ</text><text class="label" x="620.0" y="216" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">下書きを作らせるとき</text><text class="note" x="10" y="280" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">基盤は親と子の ID を、意味の検証の記録とチャットの記録に残す。子の文脈は、親に対して分けたものとして扱う</text></svg>