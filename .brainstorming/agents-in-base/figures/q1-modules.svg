<svg viewBox="0 0 760 420" style="min-width:620px" role="img" aria-label="基盤の中の分け方" class="dsvg"><style data-dsvg="dark">.dsvg .area{stroke:var(--dsvg-line,#7C8C86)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg #dsvg-6f6aaadf-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-line:#62756F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-line:#62756F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330}</style><defs data-dsvg="marker"><marker id="dsvg-6f6aaadf-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect class="area" x="10" y="10" width="740" height="250" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="24" y="34" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">基盤 schema-driven（全部の Skill に配る）</text><rect class="box" x="26" y="50" width="230" height="120" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="38" y="72" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">いまの操作</text><text class="note small" x="38" y="92" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">check ・ approve ・ render</text><text class="note small" x="38" y="109" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">同じ入力から同じ結果</text><text class="note small" x="38" y="126" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">AI を呼ばない</text><rect class="box focus" x="270" y="50" width="230" height="140" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title" x="282" y="72" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">意味の検証</text><text class="note small" x="282" y="92" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">x-prompt と文脈を渡す</text><text class="note small" x="282" y="109" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">AI の答えを基盤が検査</text><text class="note small" x="282" y="126" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">意味の検証の記録を足す</text><text class="note small" x="282" y="143" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">AI は読むだけの権限で呼ぶ</text><rect class="box" x="514" y="50" width="220" height="190" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="526" y="72" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">AI の呼び出し</text><text class="note small" x="526" y="92" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">渡すもの</text><text class="note small" x="526" y="109" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">許す範囲（読むだけ／書く）</text><text class="note small" x="526" y="126" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">返る出来事（共通の形）</text><text class="note small" x="526" y="143" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">止め方と時間切れ</text><text class="note small" x="526" y="160" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">CLI ごとの差を隠す</text><text class="note small" x="526" y="177" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">範囲の検査</text><path class="flow" d="M500,110 H512" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-6f6aaadf-arrow-5B6B66)"/><rect class="area" x="10" y="290" width="740" height="110" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="24" y="314" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">各 Skill</text><rect class="box" x="394" y="326" width="340" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="406" y="348" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">brainstorming の AI に聞く</text><text class="note small" x="406" y="368" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">会話 ・ 中継 ・ serve ・ 描き直しは Skill に残す</text><rect class="box" x="26" y="326" width="340" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="38" y="348" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">ACDR（作り直すときに使う）</text><text class="note small" x="38" y="368" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">承認の前に意味の検証を行う</text><path class="flow" d="M620,326 V242" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-6f6aaadf-arrow-5B6B66)"/><path class="flow" d="M200,326 V300 H385 V192" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-6f6aaadf-arrow-5B6B66)"/></svg>