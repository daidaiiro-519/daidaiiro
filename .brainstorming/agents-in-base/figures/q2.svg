<svg viewBox="0 0 730 302" style="min-width:600px" role="img" aria-label="意味の検証の流れ" class="dsvg"><style data-dsvg="dark">.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .flow.warn{stroke:var(--dsvg-warn,#8F5410)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg #dsvg-dcdc152c-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}.dsvg #dsvg-dcdc152c-arrow-8F5410 path{fill:var(--dsvg-warn,#8F5410)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}}:root[data-theme="dark"] .dsvg{--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}</style><defs data-dsvg="marker"><marker id="dsvg-dcdc152c-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker><marker id="dsvg-dcdc152c-arrow-8F5410" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8F5410"/></marker></defs><rect class="box" x="10" y="20" width="200" height="70" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="110.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">インスタンス</text><text class="label" x="110.0" y="58" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">意味の側の決まり</text><text class="label" x="110.0" y="76" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">渡した文脈</text><rect class="box" x="250" y="20" width="200" height="70" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="350.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">依頼の文と</text><text class="label" x="350.0" y="58" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">答えの形（JSON Schema）</text><rect class="box focus" x="490" y="10" width="230" height="90" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="605.0" y="30" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">判断する役</text><text class="label focus" x="605.0" y="48" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">プロセスで呼ぶ CLI</text><text class="label focus" x="605.0" y="66" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">呼ぶ側のサブエージェント ・ 人</text><path class="flow" d="M210,55 H248" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-dcdc152c-arrow-5B6B66)"/><path class="flow" d="M450,55 H488" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-dcdc152c-arrow-5B6B66)"/><rect class="box" x="490" y="140" width="230" height="90" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="605.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">基盤が検査する</text><text class="label" x="605.0" y="178" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">決まりの id と場所が在るか</text><text class="label" x="605.0" y="196" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">引用が文字どおり在るか</text><path class="flow" d="M605,100 V138" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-dcdc152c-arrow-5B6B66)"/><rect class="box focus" x="250" y="150" width="200" height="70" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="350.0" y="170" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">意味の検証の記録</text><text class="label focus" x="350.0" y="188" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">追記だけ ・ ハッシュ付き</text><path class="flow" d="M490,185 H452" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-dcdc152c-arrow-5B6B66)"/><rect class="box warn" x="10" y="150" width="200" height="70" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="110.0" y="170" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">処理の失敗</text><text class="label warn" x="110.0" y="188" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">エラーで返し、記録は作らない</text><path class="flow warn" d="M605,230 V262 H110 V222" fill="none" stroke="#8F5410" stroke-width="1.5" marker-end="url(#dsvg-dcdc152c-arrow-8F5410)"/><text class="note" x="10" y="292" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">判定の語は 守れている ・ 守れていない ・ 判断できない。approve の合否には使わない</text></svg>