<svg viewBox="0 0 720 300" style="min-width:600px" role="img" aria-label="外からの文脈の渡し方" class="dsvg"><style data-dsvg="dark">.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .flow.warn{stroke:var(--dsvg-warn,#8F5410)}.dsvg .note.warn{fill:var(--dsvg-warn,#8F5410);font-size:11px}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg #dsvg-af232ca2-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}.dsvg #dsvg-af232ca2-arrow-8F5410 path{fill:var(--dsvg-warn,#8F5410)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}}:root[data-theme="dark"] .dsvg{--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F}</style><defs data-dsvg="marker"><marker id="dsvg-af232ca2-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker><marker id="dsvg-af232ca2-arrow-8F5410" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8F5410"/></marker></defs><rect class="box" x="10" y="20" width="220" height="70" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="120.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">スキーマが宣言する</text><text class="label" x="120.0" y="58" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">x-context（名前 ・ 必須か）</text><rect class="box" x="270" y="20" width="200" height="70" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="370.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">呼ぶ側が渡す</text><text class="label" x="370.0" y="58" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">--context 名前=場所</text><rect class="box focus" x="510" y="20" width="200" height="70" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="610.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">足りているか</text><text class="label focus" x="610.0" y="58" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">必須の文脈がそろうか</text><path class="flow" d="M230,55 H268" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-af232ca2-arrow-5B6B66)"/><path class="flow" d="M470,55 H508" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-af232ca2-arrow-5B6B66)"/><rect class="box warn" x="510" y="140" width="200" height="70" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="610.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">AI を呼ばずに止める</text><text class="label warn" x="610.0" y="178" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">記録は作らない</text><path class="flow warn" d="M610,90 V138" fill="none" stroke="#8F5410" stroke-width="1.5" marker-end="url(#dsvg-af232ca2-arrow-8F5410)"/><text class="note warn" x="618" y="122" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#8F5410">足りない</text><rect class="box focus" x="160" y="140" width="300" height="70" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="310.0" y="160" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">AI に送るのはインスタンスと</text><text class="label focus" x="310.0" y="178" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">一覧に出したファイルだけ</text><path class="flow" d="M560,90 V112 H310 V138" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-af232ca2-arrow-5B6B66)"/><text class="note" x="318" y="108" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">足りる</text><rect class="box" x="160" y="240" width="300" height="50" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="310.0" y="260" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">記録に 名前 ・ 場所 ・ ハッシュ を残す</text><path class="flow" d="M310,210 V238" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-af232ca2-arrow-5B6B66)"/></svg>