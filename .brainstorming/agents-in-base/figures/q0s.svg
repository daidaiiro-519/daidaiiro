="565.0" y="220" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">食い違う所を引用付きで指す</text><path class="flow" d="M420,213 H433" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-6792b22c-arrow-5B6B66)"/><rect class="box" x="10" y="256" width="140" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="80.0" y="276" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ACDR から </text><text class="label" x="80.0" y="294" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI に聞く</text><rect class="box warn" x="160" y="256" width="260" height="62" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="290.0" y="276" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">AI に聞く画面は brainstorming</text><text class="label warn" x="290.0" y="294" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">にしか無い</text><rect class="box focus" x="435" y="256" width="260" height="62" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="565.0" y="276" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">ACDR も基盤の呼び出しで</text><text class="label focus" x="565.0" y="294" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">同じ画面を持てる</text><path class="flow" d="M420,287 H433" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-6792b22c-arrow-5B6B66)"/><text class="note" x="10" y="340" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変わらないこと：check ・ approve ・ render の結果と