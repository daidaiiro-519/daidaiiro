<svg viewBox="0 0 720 170" style="min-width:600px" role="img" aria-label="完成の条件の3つの段" class="dsvg"><style data-dsvg="dark">.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg #dsvg-07bf6f9b-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}}:root[data-theme="dark"] .dsvg{--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}</style><defs data-dsvg="marker"><marker id="dsvg-07bf6f9b-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect class="box" x="10" y="20" width="220" height="110" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="120.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">段A ・ CI の合否</text><text class="label" x="120.0" y="60" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">本物の CLI の代わりの代役で</text><text class="label" x="120.0" y="78" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">呼び方の契約を確かめる</text><text class="label" x="120.0" y="96" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">（起動 ・ 出来事 ・ 権限 ・</text><text class="label" x="120.0" y="114" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">範囲 ・ 止め方 ・ 時間切れ）</text><rect class="box" x="250" y="20" width="220" height="110" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="360.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">段B ・ CI の合否</text><text class="label" x="360.0" y="60" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">基盤が作る記録を</text><text class="label" x="360.0" y="78" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">形 ・ id ・ 場所 ・ 引用 ・</text><text class="label" x="360.0" y="96" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ハッシュで確かめる</text><rect class="box focus" x="490" y="20" width="220" height="110" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title focus" x="600.0" y="40" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">段C ・ 手元で測る</text><text class="label focus" x="600.0" y="60" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">本物の3つの CLI に</text><text class="label focus" x="600.0" y="78" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">bad と good の見本を回し</text><text class="label focus" x="600.0" y="96" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">指せた割合を測る</text><path class="flow" d="M230,75 H248" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-07bf6f9b-arrow-5B6B66)"/><path class="flow" d="M470,75 H488" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-07bf6f9b-arrow-5B6B66)"/><text class="note" x="10" y="160" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">段A と段B は毎回同じ結果になるので CI に入れる。段C は結果が揺れるので CI に入れず、基準の割合で受け入れる</text></svg>