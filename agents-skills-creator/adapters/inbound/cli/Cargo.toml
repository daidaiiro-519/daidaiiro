[package]
name = "inbound-cli"
description = "入口。実行ファイル agents-skills-creator。サブコマンド skills ・ agents を、それぞれの文脈の入口のモジュール（skills ・ agents）へ振り分け、approve は skill.json か agent.json かで振り分ける。コンポジションルートを持つ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
skills-application = { path = "../../../skills/application" }
agents-application = { path = "../../../agents/application" }
outbound-semantic-agent-schema = { path = "../../outbound/semantic-agent-schema" }
outbound-filesystem = { path = "../../outbound/filesystem" }
outbound-jsonschema = { path = "../../outbound/jsonschema" }
outbound-skills = { path = "../../outbound/skills" }


[[bin]]
name = "agents-skills-creator"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
