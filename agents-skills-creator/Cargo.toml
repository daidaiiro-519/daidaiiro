# 事業領域 agents-skills-creator のワークスペース（virtual manifest）。SAS と同じヘキサゴナルの形。
# 文脈は skills/（上流。Skill を作り、公開された言葉を出す）と agents/（下流。skills の公開された言葉だけに従う）の2つ。文脈の中は domain と application だけ。
# アダプターは文脈の外の adapters/ に、入口（inbound）と出口（outbound）に分けて1つずつ置く。crate の名前は <inbound|outbound>-<技術>。
# adapters/inbound/cli は実行ファイル agents-skills-creator（PATH に置く1つのコマンド）。サブコマンド skills ・ agents を、それぞれの文脈の入口のモジュールへ振り分ける。
# 公開された言葉は published-language/v1/、システムテストは system-tests/ に、文脈の外に1つずつ置く。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "skills/domain",
    "skills/application",
    "agents/domain",
    "agents/application",
    "adapters/inbound/cli",
    "adapters/outbound/semantic-agent-schema",
    "adapters/outbound/filesystem",
    "adapters/outbound/jsonschema",
    "adapters/outbound/skills",
    "test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.58.6", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
