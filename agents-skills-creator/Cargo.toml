# 事業領域 agents-skills-creator のワークスペース（virtual manifest）。
# 文脈は skills/（上流。Skill を作り、公開された言葉を出す）と agents/（下流。skills の公開された言葉だけに従う）の2つ。
# 中は domain ・ application と adapters（業務領域のモジュールはまだ作らない）。adapters の crate は <文脈>-<inbound|outbound>-<技術>。
# cli/ は実行ファイル agents-skills-creator（PATH に置く1つのコマンド）。サブコマンド skills ・ agents を、それぞれの文脈の入口へ振り分ける。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "skills/domain",
    "skills/application",
    "skills/adapters/inbound/cli",
    "skills/adapters/outbound/sas",
    "skills/adapters/outbound/filesystem",
    "skills/adapters/outbound/jsonschema",
    "skills/test-support",
    "agents/domain",
    "agents/application",
    "agents/adapters/inbound/cli",
    "agents/adapters/outbound/sas",
    "agents/adapters/outbound/filesystem",
    "agents/adapters/outbound/skills",
    "cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.58.6", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
