# 事業領域 agents-skills-creator のワークスペース（virtual manifest）。
# 文脈は skills/ と agents/ の2つの予定で、いまは skills/ だけ。中は domain ・ application と adapters（業務領域のモジュールはまだ作らない）。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "skills/domain",
    "skills/application",
    "skills/adapters/inbound/cli",
    "skills/adapters/outbound/sas",
    "skills/adapters/outbound/filesystem",
    "skills/adapters/outbound/jsonschema",
    "skills/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.58.6", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
