<path class="link" d="M20,232 H800" fill="none" stroke="#5B6B66" stroke-width="1"/>
<text class="note" x="20" y="256" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">基盤は②の中身も③の値も作らない。同じ共通ツールで、どの concrete にも同じ操作をする</text>
<text class="note" x="20" y="276" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">concrete の側は、中身（スキーマ ・ ページテンプレート ・ 固有のツール）を持つ</text>
