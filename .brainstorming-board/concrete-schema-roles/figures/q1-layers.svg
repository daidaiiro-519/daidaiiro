<rect class="box focus" x="400" y="68" width="165" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="412" y="87" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">基盤</text>
<rect class="box focus" x="580" y="68" width="220" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="592" y="87" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">契約そのもの</text>
<text class="note" x="20" y="132" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">② concrete スキーマ</text>
<rect class="box" x="170" y="110" width="215" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="182" y="129" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">①のインスタンス</text><text class="label" x="182" y="147" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">例：ボードの型</text>
<rect class="box" x="400" y="110" width="165" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="412" y="129" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">concrete の側</text><text class="label" x="412" y="147" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">（Skill を作る人）</text>
<rect class="box" x="580" y="110" width="220" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="592" y="129" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">枠 ・ 書き方の案内</text><text class="label" x="592" y="147" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">・ 契約の検査</text>
<text class="note" x="20" y="190" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">③ エンティティ</text>
<rect class="box" x="170" y="168" width="215" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="182" y="187" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">②のインスタンス</text><text class="label" x="182" y="205" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">例：1枚のボード</text>
<rect class="box" x="400" y="168" width="165" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="412" y="187" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">concrete の側</text><text class="label" x="412" y="205" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">（使う人 ・ AI）</text>
