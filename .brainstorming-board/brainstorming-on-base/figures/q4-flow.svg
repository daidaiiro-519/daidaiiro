#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-5B6B66)"/><text class="label" x="320" text-anchor="start" y="159" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">3 CLI を起動する</text><path class="flow" d="M522,204 L727,204" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-5B6B66)"/><text class="label" x="530" text-anchor="start" y="197" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">4 入口で読み書き</text><path class="flow" d="M518,242 L313,242" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-5B6B66)"/><text class="label" x="510" text-anchor="end" y="235" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">5 出来事を送る</text><path class="flow" d="M308,280 L103,280" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-5B6B66)"/><text class="label" x="300" text-anchor="end" y="273" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">6 共通の形で中継</text><path class="flow" d="M312,318 L727,318" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-5B6B66)"/><text class="label" x="320" text-anchor="start" y="311" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">7 check を走らせる</text><path class="flow warn" d="M308,356 L103,356" fill="none" stroke="#8F5410" stroke-width="1.5" marker-end="url(#dsvg-b9116f40-arrow-8F5410)"/><text class="note warn" x="300" text-anchor="end" y="349" font-weight="700" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#8F5410">8 検査の結果を出す</text><text class="note" x="20" y="400" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">3：新しいセッションなら「SKILL.md を読む」1文を付け、続きならセッションの ID で再開する</text><text class="note" x="20" y="420" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">7：AI の「検査した」は使わず、serve が自分で検査する。範囲の外の変更も探す</text><text class="note" x="20" y="440" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">8：範囲の外の変更が在れば、2 の写しへ戻すかをあなたに聞く</text></svg>