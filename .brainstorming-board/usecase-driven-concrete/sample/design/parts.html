<!-- 見本の部品の HTML の雛形。{{名前}} に値を差し込む。差し込む値は、呼ぶ側が文字を逃がしてから渡す -->
<template id="id"><span class="id">{{id}}</span></template>
<template id="ref"><a class="ref" href="#{{id}}">{{name}}</a></template>
<template id="ref-missing"><span class="missing">{{id}}（未作成）</span></template>
<template id="help"><button class="help" popovertarget="{{hid}}" aria-label="{{title}}の説明">?</button><div class="pop" id="{{hid}}" popover><b>{{title}}</b><p>{{text}}</p></div></template>
<template id="pill"><span class="pill {{tone}}">{{text}}</span></template>
<template id="table"><div class="tw"><table class="st"><thead><tr>{{head}}</tr></thead><tbody>{{body}}</tbody></table></div></template>
<template id="th"><th>{{text}}</th></template>
<template id="tr"><tr>{{cells}}</tr></template>
<template id="td"><td data-label="{{label}}">{{text}}</td></template>
<template id="ftable"><div class="fwrap"><div class="filt" role="group" aria-label="{{label}}で絞る">{{head}}{{groups}}</div><div class="tw"><table class="st"><thead><tr>{{cols}}</tr></thead><tbody>{{body}}</tbody></table></div></div></template>
<template id="ftable-head"><div class="fh"><span class="ft">{{label}}で絞る<span class="fs">複数選べる</span></span><span class="fc" aria-live="polite" data-unit="{{unit}}">{{count}}</span><button type="button" class="fclear" hidden>絞り込みを外す</button></div></template>
<template id="ftable-group"><div class="fg">{{name}}<div class="fb">{{buttons}}</div></div></template>
<template id="ftable-group-name"><span class="fl">{{name}}</span></template>
<template id="ftable-button"><button type="button" aria-pressed="false" data-f="{{key}}">{{key}}<span class="n">{{n}}</span></button></template>
<template id="ftr"><tr data-k="{{key}}">{{cells}}</tr></template>
<template id="block"><section class="blk"><h2>{{title}}{{help}}</h2>{{body}}</section></template>
<template id="kv"><dl class="kv">{{rows}}</dl></template>
<template id="kv-row"><div class="kvr"><dt>{{label}}</dt><dd>{{value}}</dd></div></template>
<template id="card"><div class="card {{cls}}"><h3>{{title}}</h3>{{body}}</div></template>
<template id="cards"><div class="cards">{{items}}</div></template>
<template id="item"><div class="item"><b>{{name}}</b>{{text}}{{extra}}</div></template>
<template id="item-text"><span class="txt">{{text}}</span></template>
<template id="tchip"><span class="tc">{{id}}</span></template>
<template id="design-only"><div class="mx">{{body}}</div></template>
<template id="page-head"><label class="mt top"><input type="checkbox" class="mtog"> 宣言の欄を表示（ID ・ 参照 ・ テスト条件 ・ JSON）</label><header class="ph"><p class="kind">{{side}} {{kind}}{{badges}}</p><h1>{{title}}{{id}}</h1></header>{{lead}}</template>
<template id="lead"><p class="lead">{{text}}</p></template>
<template id="yes"><span class="yes">はい</span></template>
<template id="no"><span class="no-ans">いいえ</span></template>
<template id="json"><details class="fold mx"><summary>{{label}}</summary><div class="fbody"><pre class="code">{{json}}</pre></div></details></template>
