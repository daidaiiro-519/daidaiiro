<title>advisor 完成イメージ一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#eef1ef;--panel:#f8faf9;--ink:#111d1a;--dim:#5b6b66;--line:#ccd8d4;--accent:#0d5c55;--accent-bg:#d5e6e3;--ok:#0d5c55;--ok-bg:#d5e6e3;--warn:#8f5410;--warn-bg:#f0e2cd;--sel:#7a3b6d;--sel-bg:#f1e3ee;--wf:#93a29d;--wf-fill:#e7ecea;--inset:#FFFFFF;--rule:#B9C7C2;--thead:#D5E6E3;--row:#CCD8D4;--shadow:0 1px 0 rgba(17,29,26,.05),0 6px 18px -12px rgba(17,29,26,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--panel:#16211e;--ink:#e6eeeb;--dim:#9dada8;--line:#2a3936;--accent:#6cc9b8;--accent-bg:#173330;--ok:#6cc9b8;--ok-bg:#173330;--warn:#d9a35f;--warn-bg:#33281a;--sel:#d094c2;--sel-bg:#2e1f2b;--wf:#556561;--wf-fill:#22302d;--inset:#16211E;--rule:#354642;--thead:#173330;--row:#2A3936;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -14px #000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1614;--panel:#16211e;--ink:#e6eeeb;--dim:#9dada8;--line:#2a3936;--accent:#6cc9b8;--accent-bg:#173330;--ok:#6cc9b8;--ok-bg:#173330;--warn:#d9a35f;--warn-bg:#33281a;--sel:#d094c2;--sel-bg:#2e1f2b;--wf:#556561;--wf-fill:#22302d;--inset:#16211E;--rule:#354642;--thead:#173330;--row:#2A3936;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -14px #000;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.7;padding-inline:16px;padding-block:20px 48px;font-size:15px}

main>*,.grid2>*{min-width:0}
.sim{font-size:.78rem;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:6px 10px;justify-self:start}
h1{font-size:1.3rem;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;text-wrap:balance}
h2 .tag{white-space:nowrap;flex:none;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-bg);padding:1px 8px;border-radius:9px}
h3{font-size:.95rem;margin:14px 0 6px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
p{margin:6px 0}
.q{border-left:3px solid var(--line);padding-left:10px;color:var(--dim)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
th,td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:.8rem}
.k{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap}
.k.rule{color:var(--ok);background:var(--ok-bg)}
.k.sel{color:var(--sel);background:var(--sel-bg)}
.k.und{color:var(--warn);background:var(--warn-bg)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.82rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
ol.flow{margin:6px 0;padding-left:1.4em}
ol.flow li{margin:3px 0}
.back{color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mail{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.86rem;background:var(--wf-fill)}
.mail .h{color:var(--dim);font-size:.78rem}
svg text{font-family:"Noto Sans JP",sans-serif}
.note{font-size:.82rem;color:var(--dim)}
.none li{color:var(--dim)}
.sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.swc{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:2px;font-size:.8rem}
.chip{height:52px;border-radius:6px;display:flex;align-items:center;padding-left:10px}
.chip span{color:#fff;font-weight:700;font-size:1.1rem}
.pass{color:var(--ok);font-size:.74rem}
.type{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px}
.space{display:grid;gap:6px}
.space div{display:flex;align-items:center;gap:10px}
.space i{display:inline-block;height:14px;background:var(--accent);border-radius:2px}
.states{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.states div{display:grid;gap:4px;justify-items:start}
.states small{font-size:.74rem;color:var(--dim)}
.states small.er{color:var(--warn)}
.b{min-height:44px;padding:0 18px;border-radius:8px;border:0;background:#0D5C55;color:#fff;font:inherit;font-weight:700}
.b.f{outline:3px solid #111D1A;outline-offset:2px}
.b.d{background:#C9CDD2;color:#4A4F55}
.in{display:inline-block;min-width:150px;min-height:40px;line-height:40px;padding:0 10px;border:1px solid #5B6B66;border-radius:8px;background:var(--panel);color:var(--dim)}
.in.e{border:2px solid #B3261E}
pre.code{background:var(--wf-fill);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font-size:.78rem;line-height:1.5;margin:6px 0}

body{padding-inline:0;padding-block:0}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;align-self:start;height:100vh;box-sizing:border-box;display:grid;align-content:start;gap:14px}
.side .title{font-weight:700;font-size:.95rem;line-height:1.4}
.side .sim{font-size:.7rem}
.side nav{display:grid;gap:2px}
.side nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.92rem}
.side nav a .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:var(--line);color:var(--dim);font-variant-numeric:tabular-nums}
.side nav a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.side nav a[aria-current="page"] .n{background:var(--accent);color:#fff}
.side nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.content{padding:24px 28px 56px;max-width:860px;display:grid;gap:16px;align-content:start}
.content header{display:grid;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h2{font-size:1.1rem}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;position:sticky;top:0;background:var(--panel);padding:6px 0;z-index:1}
.subnav a{font-size:.8rem;padding:4px 10px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none}
.subnav a:hover,.subnav a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
h3[id]{scroll-margin-top:52px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pager a{font-size:.85rem;color:var(--accent);text-decoration:none;padding:6px 0}
@media (max-width:720px){
 .app{grid-template-columns:minmax(0,1fr);align-content:start}
 .side nav .grp{white-space:nowrap;align-self:center;padding:0 4px 0 10px;border-left:1px solid var(--line)}
 .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px;z-index:5}
 .side .sim{display:none}
 .side nav{display:flex;overflow-x:auto;gap:4px}
 .side nav a{white-space:nowrap;padding:7px 10px;font-size:.85rem}
 .content{padding:16px 16px 48px}
 .subnav{position:static}
 table{min-width:0}
 .content header h1{font-size:1.1rem}
}
h1,h2,.side .title{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif}
svg text{font-family:"Zen Kaku Gothic New",sans-serif}
.files{border:1px solid var(--line);border-radius:8px;padding:8px}
.ftabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.ft{font:inherit;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
.ft[aria-selected="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:700}
.copy{font:inherit;font-size:.8rem;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;min-height:32px}
.copy:focus-visible,.ft:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
pre.code{max-height:420px}
.concl{font-size:1rem;line-height:1.8;border-left:3px solid var(--accent);padding-left:12px;margin:8px 0}
.panel table th{white-space:nowrap}
.pts{display:grid;gap:8px}
.pt{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.pt b{color:var(--accent)}
.pt p{margin:4px 0}
.gr{font-size:.78rem;color:var(--dim)}
table.sem{min-width:760px}
table.sem td{font-size:.84rem}
@media (max-width:720px){table.sem{min-width:680px}}
.bulk{display:grid;gap:4px;justify-items:start;border:1px solid var(--accent);background:var(--accent-bg);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.copy.big{font-size:.92rem;padding:8px 16px;min-height:40px}
.pv{width:236px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0;display:grid;gap:3px}
.pair figcaption{font-size:.7rem;color:var(--dim)}
table.semc{min-width:780px}
.blk{height:64px;border-radius:8px 8px 0 0;display:flex;flex-direction:column;justify-content:space-between;padding:7px 9px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.blk span{font-size:.72rem;font-weight:700}
.blk code{font-size:.78rem;color:inherit}
.pw{border-radius:0 0 8px 8px;padding:8px;display:flex;justify-content:center;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.pc{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.8rem;white-space:nowrap}
.tks{display:grid;gap:12px}
.tk{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.tk-sw .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk-sw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0}
.tk-sw figure{min-width:0;overflow:hidden}
.tk-sw .pc{white-space:normal;text-align:center;font-size:.74rem}
.tk-sw figure{margin:0}
.tk-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tk-name{font-size:.95rem;font-weight:700;color:var(--ink)}
.tk-role{margin:6px 0 8px}
.tk dl{margin:0;display:grid;gap:6px}
.tk dl div{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:8px;font-size:.86rem}
.tk dt{color:var(--dim);font-size:.78rem;padding-top:2px}
.tk dt.no{color:var(--warn);font-weight:700}
.tk dd{margin:0}
.cps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.cp h4{margin:0 0 4px;font-size:.95rem;color:var(--accent)}
.cp p{margin:4px 0;font-size:.86rem}
.cp-not span{display:inline-block;font-size:.7rem;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:9px;padding:0 7px;margin-right:6px}
@media (max-width:720px){.tk{grid-template-columns:minmax(0,1fr)}}
.kv{margin:4px 0 0;display:grid;gap:8px}
.kv div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.kv dt{color:var(--dim);font-size:.8rem;padding-top:2px}
.kv dd{margin:0}
.dcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:6px}
.dc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);display:grid;gap:6px;align-content:start}
.dc h4{margin:0;font-size:.95rem;line-height:1.5}
.dc p{margin:0;font-size:.86rem;display:grid;gap:2px}
.dc p span{font-size:.72rem;color:var(--dim)}
.dc-gr{color:var(--accent)}
.dc.und{border-color:var(--warn);background:var(--warn-bg)}
.dc.und h4{color:var(--warn)}
/* 境界：画面の囲み（panel）の中の要素は inset の地と rule の線で分ける */
.tk,.cp,.pt,.swc,.files,.type,.mail{background:var(--inset)!important;border:1px solid var(--rule)!important}
.panel{border-color:var(--rule)}
.tw{border:1px solid var(--rule);border-radius:10px;overflow:hidden;overflow-x:auto;background:var(--inset);margin-top:6px}
table.t{border-collapse:separate;border-spacing:0;width:100%;min-width:0;font-size:.9rem}
table.t th,table.t td{border:0;padding:10px 14px;text-align:left;vertical-align:top;line-height:1.6}
table.t thead th{background:var(--thead);color:var(--dim);font-size:.78rem;font-weight:700;letter-spacing:.04em}
table.t tbody tr+tr td,table.kvt tr+tr th,table.kvt tr+tr td{border-top:1px solid var(--line)}
table.t td.lead{font-weight:700}
table.t td.gr2{color:var(--accent);font-size:.84rem}
table.kvt th{background:var(--thead);color:var(--dim);font-size:.8rem;width:6em;white-space:nowrap}
@media (max-width:720px){table.t{min-width:560px}table.kvt{min-width:0}}
/* 境界 v2：頁の地の上に、白い要素を線と影で浮かせる */
.panel{background:transparent!important;border:0!important;padding:4px 0!important}
.tk,.cp,.pt,.swc,.files,.type,.mail,.tw,.kvt{background:var(--inset)!important;border:1px solid var(--rule)!important;box-shadow:var(--shadow)}
.tw{border-radius:10px}
.blk{box-shadow:none!important;border:1px solid var(--rule);border-bottom:0}
.pw{box-shadow:none!important;border:1px solid var(--rule)}
table.t thead th,table.kvt th{background:var(--thead)!important;color:var(--ink)!important}
table.t tbody tr+tr td,table.kvt tr+tr th,table.kvt tr+tr td{border-top:1px solid var(--row)!important}
table.t td,table.kvt td{background:var(--inset)}
.subnav{background:var(--bg)!important}
.tk2{background:var(--inset);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tk-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--thead);border-bottom:1px solid var(--rule)}
.tk-h code{font-size:.95rem;font-weight:700;color:var(--ink)}
.tk-r{font-weight:700}
.tk-b{display:grid;grid-template-columns:240px minmax(0,1fr)}
.tk2 .tk-sw{display:grid;gap:6px;align-content:start;padding:12px 14px;border-right:1px solid var(--rule)}
.tk2 .lab{font-size:.72rem;color:var(--dim);font-weight:700}
.tk2 .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.blk.solo{border-radius:8px!important;border:1px solid var(--rule)!important;height:58px}
.pw.solo{border-radius:8px!important;min-height:40px;align-items:center}
.tk-d{margin:0;display:grid;align-content:start}
.tk-d div{display:grid;grid-template-columns:6em minmax(0,1fr);gap:10px;padding:9px 14px;border-top:1px solid var(--row)}
.tk-d div:first-child{border-top:0}
.tk-d dt{font-size:.78rem;color:var(--dim);font-weight:700;padding-top:2px}
.tk-d dd{margin:0;font-size:.88rem}
.tk-d div.no{background:var(--warn-bg)}
.tk-d div.no dt{color:var(--warn)}
@media (max-width:720px){.tk-b{grid-template-columns:minmax(0,1fr)}.tk2 .tk-sw{border-right:0;border-bottom:1px solid var(--rule)}}
.content .tk2 .tk-h{display:flex!important;flex-wrap:wrap;align-items:center;gap:10px}
.tk2 .tk-h .k{flex:none}
.tk2 .tk-sw{grid-template-columns:minmax(0,1fr)!important;min-width:0}
.tk2 .two{min-width:0}
.tk2 .two>*{min-width:0}
.tk2 .pw.solo .pc{white-space:nowrap}
.tk2 .tk-h .k{background:var(--inset);border:1px solid currentColor}

/* ==== デザインシステムの画面（組み直し） ==== */
.ds{display:grid;gap:40px;grid-template-columns:minmax(0,1fr)}
.ds>*{min-width:0}
.ds h2{margin:0 0 8px}
.ds h3{font-size:1.02rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.ds-lead,.ds-desc{margin:0 0 14px;color:var(--dim);font-size:.9rem;line-height:1.7}
.ds-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.84rem;color:var(--dim);margin-bottom:14px}
.ds-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;background:var(--inset);line-height:1.5}
.ds-badge.rule{color:var(--ok)} .ds-badge.sel{color:var(--sel)}
.ds .subnav{position:static;background:none!important;padding:0;margin:0}
.ds-cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.ds-cand{background:var(--inset);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ds-cand-chip{height:84px;display:flex;align-items:flex-end;padding:12px 16px;color:#fff;font-size:1.3rem;font-weight:700}
.ds-cand-txt{display:grid;gap:4px;padding:14px 16px 16px;font-size:.88rem}
.ds-cand-txt span{color:var(--ok);font-size:.8rem}
.ds-tokens{display:grid;gap:16px}
.ds-token{background:var(--inset);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ds-token header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--thead)}
.ds-token header code{font-weight:700;font-size:.95rem}
.ds-token-body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:20px}
.ds-sws{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.ds-sw{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.ds-chip{height:72px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px}
.ds-chip span{font-size:.72rem;font-weight:700} .ds-chip code{font-size:.8rem;color:inherit}
.ds-exrow{display:flex;justify-content:center;padding:12px 8px;border-top:1px solid var(--rule)}
.ds-ex{display:inline-block;padding:5px 12px;border-radius:6px;font-size:.8rem;white-space:nowrap}
.ds-token dl{margin:0;display:grid;align-content:start}
.ds-token dl div{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--row)}
.ds-token dl div:first-child{border-top:0;padding-top:2px}
.ds-token dt{font-size:.8rem;color:var(--dim);font-weight:700}
.ds-token dd{margin:0;font-size:.9rem;line-height:1.7}
.ds-token dl div.no dt{color:var(--warn)}
.ds-box{background:var(--inset);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:8px 20px}
.ds-type-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--row)}
.ds-type-row:first-child{border-top:0}
.ds-type-meta{display:grid;gap:2px;font-size:.84rem} .ds-type-meta span{color:var(--dim);font-size:.78rem}
.ds-space-row{display:grid;grid-template-columns:110px 150px 56px minmax(0,1fr);align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--row);font-size:.86rem}
.ds-space-row:first-child{border-top:0}
.ds-bar{display:block;height:14px;background:var(--accent);border-radius:3px}
.ds-space-v{font-variant-numeric:tabular-nums} .ds-space-k{color:var(--dim);font-size:.8rem}
.ds-states{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.ds-state{margin:0;background:var(--inset);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.ds-state-view{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px}
.ds-state figcaption{padding:10px 16px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--dim)}
