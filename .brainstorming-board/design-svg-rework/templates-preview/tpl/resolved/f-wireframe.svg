<svg viewBox="0 0 300 360" width="100%" role="img" aria-label="診察の予約" class="dsvg"><style data-dsvg="dark">.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A)}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66)}.dsvg .area{stroke:var(--dsvg-line,#7C8C86)}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A)}.dsvg .label{fill:var(--dsvg-ink,#111D1A)}.dsvg .label.warn.small{fill:var(--dsvg-warn,#8F5410)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-line:#62756F;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}</style>
<rect class="box" x="1" y="1" width="298" height="358" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="16" y="30" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">診察の予約</text>
<text class="note small" x="16" y="50" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">手順 2 / 3　入力する</text>
<rect class="area" x="16" y="62" width="268" height="40" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/>
<text class="label small" x="26" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">選んだ枠：11月5日（水）10:30</text>
<text class="note small" x="26" y="94" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">残り 2 枠　［枠を変える］</text>
<text class="label" x="16" y="124" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">氏名（必須）</text>
<rect class="box" x="16" y="130" width="268" height="32" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="16" y="182" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">診察券番号（必須）</text>
<rect class="box" x="16" y="188" width="268" height="32" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label small warn" x="16" y="240" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#8F5410">！ 診察券番号を入れてください</text>
<rect class="box focus" x="16" y="262" width="268" height="44" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label focus" x="150" y="289" font-weight="700" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">予約内容を確かめる</text>
<text class="note small" x="150" y="332" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">［一覧に戻る］</text>
</svg>