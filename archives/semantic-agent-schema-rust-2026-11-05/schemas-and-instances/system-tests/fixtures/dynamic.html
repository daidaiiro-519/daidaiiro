<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>{{value.id}}</title></head>
<body><h1>{{value.goal}}</h1>
<script type="application/json" id="semantic-agent-schema-data">{{{json}}}</script>
<script>
  const data = JSON.parse(document.getElementById('semantic-agent-schema-data').textContent);
  const field = location.hash.slice(1) || 'goal';
  document.title = data[field];
</script>
</body></html>
