[package]
name = "validation-application"
description = "業務領域「書いて検証する」の検証のモジュールのユースケースとポート。Concrete とインスタンスを検証する"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# tests/support.rs は代役の置き場所で、試験の実体ではない（書くモジュールの試験も #[path] で読む）
autotests = false

[dependencies]
serde_json.workspace = true
writing-domain = { path = "../../writing/domain" }
validation-domain = { path = "../domain" }

[lints]
workspace = true

[[test]]
name = "validate"
path = "tests/validate.rs"

[[test]]
name = "meaning"
path = "tests/meaning.rs"
