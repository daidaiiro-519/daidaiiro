<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 556 216" style="min-width:420px" role="img" aria-label="左の本来の制限と右の今回の実装を別々の枠で比較する。それぞれ同じ申請、上長承認、経理承認の流れを示す。本来は上長承認後から変更不可だが、今回の実装では経理承認後から変更不可で、上長承認後の変更を保存できてしまう。">
<rect class="field" x="6" y="4" width="262" height="180"/>
<text class="title" x="20" y="25">本来の制限</text>
<text class="label" x="20" y="44">上長承認後から変更不可</text>
<rect class="badge" x="18" y="57" width="68" height="59"/>
<text class="label" x="52" y="75" text-anchor="middle">申請</text>
<path class="link" d="M47 92 v-5 a5 5 0 0 1 10 0 M45 92 h14 v10 h-14 z"/>
<text class="note" x="52" y="111" text-anchor="middle">変更可</text>
<path class="flow" d="M88 84 H98"/>
<rect class="badge" x="100" y="57" width="68" height="59"/>
<text class="label" x="134" y="75" text-anchor="middle">上長承認</text>
<path class="link" d="M129 92 v-5 a5 5 0 0 1 10 0 v5 M127 92 h14 v10 h-14 z"/>
<text class="note" x="134" y="111" text-anchor="middle">変更不可</text>
<path class="flow" d="M170 84 H180"/>
<rect class="badge" x="182" y="57" width="68" height="59"/>
<text class="label" x="216" y="75" text-anchor="middle">経理承認</text>
<path class="link" d="M211 92 v-5 a5 5 0 0 1 10 0 v5 M209 92 h14 v10 h-14 z"/>
<text class="note" x="216" y="111" text-anchor="middle">変更不可</text>
<text class="note" x="20" y="135">上長承認後に、申請者が金額を変更</text>
<rect class="badge" x="18" y="144" width="238" height="30"/>
<text class="label" x="28" y="164">12,000円のまま</text>
<rect class="badge" x="185" y="149" width="63" height="20"/>
<text class="note" x="216" y="164" text-anchor="middle">保存不可</text>
<rect class="field" x="288" y="4" width="262" height="180"/>
<text class="title" x="302" y="25">今回の実装</text>
<text class="label" x="302" y="44">経理承認後から変更不可</text>
<rect class="badge" x="300" y="57" width="68" height="59"/>
<text class="label" x="334" y="75" text-anchor="middle">申請</text>
<path class="link" d="M329 92 v-5 a5 5 0 0 1 10 0 M327 92 h14 v10 h-14 z"/>
<text class="note" x="334" y="111" text-anchor="middle">変更可</text>
<path class="flow" d="M370 84 H380"/>
<rect class="box focus" x="382" y="57" width="68" height="59"/>
<text class="label" x="416" y="75" text-anchor="middle">上長承認</text>
<path class="link" d="M411 92 v-5 a5 5 0 0 1 10 0 M409 92 h14 v10 h-14 z"/>
<text class="note" x="416" y="111" text-anchor="middle">変更可</text>
<path class="flow" d="M452 84 H462"/>
<rect class="badge" x="464" y="57" width="68" height="59"/>
<text class="label" x="498" y="75" text-anchor="middle">経理承認</text>
<path class="link" d="M493 92 v-5 a5 5 0 0 1 10 0 v5 M491 92 h14 v10 h-14 z"/>
<text class="note" x="498" y="111" text-anchor="middle">変更不可</text>
<text class="note" x="302" y="135">上長承認後に、申請者が金額を変更</text>
<rect class="badge" x="300" y="144" width="238" height="30"/>
<text class="label" x="310" y="164">18,000円に変更</text>
<rect class="badge" x="467" y="149" width="63" height="20"/>
<text class="note" x="498" y="164" text-anchor="middle">保存完了</text>
<rect class="badge" x="6" y="192" width="544" height="22"/>
<text class="label" x="278" y="207" text-anchor="middle">不具合が発覚 → 修正・再テスト・再レビューが必要に</text>
</svg>