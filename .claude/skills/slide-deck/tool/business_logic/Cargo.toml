[package]
name = "sd_business_logic"
description = "業務ロジック層。入出力を持たず、データアクセス層だけを参照する"
version.workspace = true
edition.workspace = true
license.workspace = true

# **同じ workspace の crate は、データアクセス層だけを参照する。** 上の層を参照した時点でコンパイルが通らない
[dependencies]
sd_data_access = { path = "../data_access" }
jsonschema = { version = "0.34", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
