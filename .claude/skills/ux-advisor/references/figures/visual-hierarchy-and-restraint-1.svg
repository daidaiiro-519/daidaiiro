<svg class="wf-fig" viewBox="0 0 838 236" width="838" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M394.0,32.6 L194.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="194.0,95.4 199.7,91.0 201.2,95.7" fill="#C3CAD2"/><rect x="185.0" y="54.0" width="218.0" height="16.0" fill="#F5F7F9"/><text x="294.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（なんとなく一般的な既定値を選んだ）</text><path d="M394.0,32.6 L594.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="594.0,95.4 586.8,95.7 588.3,91.0" fill="#C3CAD2"/><rect x="420.0" y="54.0" width="148.0" height="16.0" fill="#F5F7F9"/><text x="494.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい（題材固有の理由がある）</text><path d="M594.0,128.6 L448.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="448.0,191.4 453.2,186.5 455.2,191.0" fill="#C3CAD2"/><rect x="502.0" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="521.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M594.0,128.6 L740.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="740.0,191.4 732.8,191.0 734.8,186.5" fill="#C3CAD2"/><rect x="653.0" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="667.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(218.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="352.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="176.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この視覚的決定は、この題材固有の理由に基づいて選んだか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="388.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="194.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">紋切り型に陥っている可能性が高い。題材に立ち返って再検討する</text></g></g><g class="wf-node" transform="translate(412.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="364.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="182.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">選んだ方向性の作り込み度は、実装の細部まで一貫しているか</text></g></g><g class="wf-node" transform="translate(266.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="364.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="182.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">中途半端な仕上がりになる。方向性に見合う細部まで仕上げる</text></g></g><g class="wf-node" transform="translate(654.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">良い判断（採用してよい）</text></g></g></g></svg>