<svg class="wf-fig" viewBox="0 0 893 851" width="893" height="851" role="img"><g transform="translate(6.0,6.0)"><path d="M545.9,256.4 L777.9,174.6" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="777.9,174.6 772.3,179.2 770.7,174.5" fill="#C3CAD2"/><rect x="552.9" y="205.5" width="218.0" height="16.0" fill="#F5F7F9"/><text x="661.9" y="219.1" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（なんとなく一般的な既定値を選んだ）</text><path d="M547.5,307.6 L315.6,389.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="315.6,389.4 321.1,384.8 322.8,389.5" fill="#C3CAD2"/><rect x="357.5" y="338.5" width="148.0" height="16.0" fill="#F5F7F9"/><text x="431.5" y="352.1" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい（題材固有の理由がある）</text><path d="M317.2,440.6 L545.9,788.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="545.9,788.4 540.1,784.1 544.3,781.4" fill="#C3CAD2"/><rect x="412.5" y="604.5" width="38.0" height="16.0" fill="#F5F7F9"/><text x="431.5" y="618.1" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M315.6,389.4 L86.0,32.6" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="86.0,32.6 91.7,37.0 87.6,39.6" fill="#C3CAD2"/><rect x="186.8" y="201.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="200.8" y="214.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(448.7,257.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="196.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="98.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この視覚的決定は、この題材固</text><text x="98.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">有の理由に基づいて選んだか</text></g></g><g class="wf-node" transform="translate(673.1,124.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="208.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="104.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">紋切り型に陥っている可能性が高</text><text x="104.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">い。題材に立ち返って再検討する</text></g></g><g class="wf-node" transform="translate(218.4,390.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="196.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="98.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">選んだ方向性の作り込み度は、</text><text x="98.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">実装の細部まで一貫しているか</text></g></g><g class="wf-node" transform="translate(448.7,789.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="196.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="98.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">中途半端な仕上がりになる。方</text><text x="98.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">向性に見合う細部まで仕上げる</text></g></g><g class="wf-node" transform="translate(0.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">良い判断（採用してよい）</text></g></g></g></svg>