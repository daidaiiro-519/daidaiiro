[package]
name = "acd_business_logic"
description = "業務ロジック層。入出力を持たず、データアクセス層だけを参照する"
version.workspace = true
edition.workspace = true
license.workspace = true

# **同じ workspace の crate は、データアクセス層だけを参照する。** 上の層を参照した時点でコンパイルが通らない
[dependencies]
acd_data_access = { path = "../data_access" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonschema = { version = "0.34", default-features = false }
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
