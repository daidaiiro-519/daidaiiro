<svg class="wf-fig" viewBox="0 0 964 236" width="964" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M454.0,32.6 L218.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="218.0,95.4 223.9,91.3 225.2,96.0" fill="#C3CAD2"/><rect x="322.0" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="336.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M454.0,32.6 L690.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="690.0,95.4 682.8,96.0 684.1,91.3" fill="#C3CAD2"/><rect x="553.0" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="572.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M690.0,128.6 L538.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="538.0,191.4 543.3,186.5 545.2,191.1" fill="#C3CAD2"/><rect x="600.0" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="614.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M690.0,128.6 L842.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="842.0,191.4 834.8,191.1 836.7,186.5" fill="#C3CAD2"/><rect x="747.0" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="766.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><g class="wf-node" transform="translate(278.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="352.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="176.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このコードは「どのアダプターを使うか」を決定しているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="436.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="218.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">コンポジションルートに置く。他の場所に同種の配線コードを重複させない</text></g></g><g class="wf-node" transform="translate(460.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="460.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="230.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">コンポジションルート以外の場所で、特定の具体的アダプター型を知っているか</text></g></g><g class="wf-node" transform="translate(368.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">アンチパターン。依存方向が守られていない可能性が高い</text></g></g><g class="wf-node" transform="translate(732.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="220.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">通常のレイヤー境界のルールに従う</text></g></g></g></svg>