<svg class="wf-fig" viewBox="0 0 688 422" width="688" height="422" role="img"><g transform="translate(6.0,6.0)"><path d="M268.8,50.6 L127.2,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="127.2,113.4 132.4,108.4 134.4,112.9" fill="#C3CAD2"/><rect x="179.0" y="72.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="198.0" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M268.8,50.6 L408.0,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="408.0,113.4 400.8,112.9 402.8,108.4" fill="#C3CAD2"/><rect x="324.4" y="72.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="338.4" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M408.0,182.6 L267.2,245.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="267.2,245.4 272.4,240.4 274.4,244.9" fill="#C3CAD2"/><rect x="323.6" y="204.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="337.6" y="217.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M408.0,182.6 L547.2,245.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="547.2,245.4 540.0,244.9 542.0,240.4" fill="#C3CAD2"/><rect x="458.6" y="204.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="477.6" y="217.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M548.8,296.6 L547.2,359.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="547.2,359.4 544.9,352.6 549.8,352.7" fill="#C3CAD2"/><rect x="534.0" y="318.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="548.0" y="331.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(140.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この例外はレイヤー境界を越えて内側の層</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">に伝播しようとしているか</text></g></g><g class="wf-node" transform="translate(0.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その層の中で処理する。境界を越えないの</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">で翻訳は不要</text></g></g><g class="wf-node" transform="translate(280.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この例外は業務ルール違反として意味を持</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">つか（呼び出し元が業務判断として処理で</text><text x="128.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">きるか）</text></g></g><g class="wf-node" transform="translate(140.0,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメインの語彙による専用の例外型に変換</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">してから投げる</text></g></g><g class="wf-node" transform="translate(420.0,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">回復不能な致命的失敗で、翻訳しても呼び</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">出し元に業務的な意味を提供できないか</text></g></g><g class="wf-node" transform="translate(420.0,360.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">翻訳せず、抽象化した失敗として上位に伝</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">播させ、システム全体の一括処理に委ねる</text></g></g></g></svg>