<svg class="wf-fig" viewBox="0 0 1087 332" width="1087" height="332" role="img"><g transform="translate(6.0,6.0)"><path d="M391.0,32.6 L164.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="164.0,95.4 169.9,91.2 171.2,96.0" fill="#C3CAD2"/><rect x="258.5" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="277.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M391.0,32.6 L618.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="618.0,95.4 610.8,96.0 612.1,91.2" fill="#C3CAD2"/><rect x="490.5" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="504.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M618.0,128.6 L403.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="403.0,191.4 408.8,187.1 410.2,191.9" fill="#C3CAD2"/><rect x="496.5" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="510.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M618.0,128.6 L833.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="833.0,191.4 825.8,191.9 827.2,187.1" fill="#C3CAD2"/><rect x="706.5" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="725.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M833.0,224.6 L833.0,287.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="833.0,287.4 830.5,280.6 835.5,280.6" fill="#C3CAD2"/><rect x="819.0" y="246.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="833.0" y="259.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(191.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="400.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="200.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この例外はレイヤー境界を越えて内側の層に伝播しようとしているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="328.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="164.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その層の中で処理する。境界を越えないので翻訳は不要</text></g></g><g class="wf-node" transform="translate(352.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="532.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="266.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この例外は業務ルール違反として意味を持つか（呼び出し元が業務判断として処理できるか）</text></g></g><g class="wf-node" transform="translate(233.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメインの語彙による専用の例外型に変換してから投げる</text></g></g><g class="wf-node" transform="translate(597.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="472.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="236.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">回復不能な致命的失敗で、翻訳しても呼び出し元に業務的な意味を提供できないか</text></g></g><g class="wf-node" transform="translate(591.0,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="484.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="242.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">翻訳せず、抽象化した失敗として上位に伝播させ、システム全体の一括処理に委ねる</text></g></g></g></svg>