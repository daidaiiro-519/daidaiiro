<svg class="wf-fig" viewBox="0 0 1012 290" width="1012" height="290" role="img"><g transform="translate(6.0,6.0)"><path d="M467.8,50.6 L202.0,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="202.0,113.4 208.0,109.4 209.2,114.2" fill="#C3CAD2"/><rect x="285.9" y="72.0" width="98.0" height="16.0" fill="#F5F7F9"/><text x="334.9" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">宣言のとおりでない</text><path d="M467.8,50.6 L732.0,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="732.0,113.4 724.8,114.2 726.0,109.4" fill="#C3CAD2"/><rect x="555.9" y="72.0" width="88.0" height="16.0" fill="#F5F7F9"/><text x="599.9" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">宣言が誤っている</text><path d="M202.0,146.6 L86.0,227.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="86.0,227.4 90.1,221.5 93.0,225.6" fill="#C3CAD2"/><rect x="120.0" y="177.0" width="48.0" height="16.0" fill="#F5F7F9"/><text x="144.0" y="190.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">成立する</text><path d="M202.0,146.6 L318.0,227.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="318.0,227.4 311.0,225.6 313.9,221.5" fill="#C3CAD2"/><rect x="196.0" y="177.0" width="128.0" height="16.0" fill="#F5F7F9"/><text x="260.0" y="190.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">補った読みに依存している</text><path d="M732.0,164.6 L591.2,227.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="591.2,227.4 596.4,222.4 598.4,226.9" fill="#C3CAD2"/><rect x="632.6" y="186.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="661.6" y="199.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">指している</text><path d="M732.0,164.6 L871.2,227.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="871.2,227.4 864.0,226.9 866.0,222.4" fill="#C3CAD2"/><rect x="767.6" y="186.0" width="68.0" height="16.0" fill="#F5F7F9"/><text x="801.6" y="199.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">指していない</text><g class="wf-node" transform="translate(339.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その主張は「宣言のとおりでない」か「宣</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">言が誤っている」か？</text></g></g><g class="wf-node" transform="translate(74.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">宣言の文言をそのまま読んで成立するか？</text></g></g><g class="wf-node" transform="translate(603.1,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="257.8" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">どの knowledge のどの原則によるかを</text><text x="128.9" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">指しているか？</text></g></g><g class="wf-node" transform="translate(0.0,228.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">適合の主張として受け取る</text></g></g><g class="wf-node" transform="translate(196.0,228.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="244.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="122.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">成立しない。ただし他の指摘は別に扱う</text></g></g><g class="wf-node" transform="translate(464.0,228.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">宣言を直す議論へ移す（実装を宣言から外</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">す道は開かない）</text></g></g><g class="wf-node" transform="translate(744.0,228.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">根拠を確認する。指せないなら個人の見解</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">として扱う</text></g></g></g></svg>