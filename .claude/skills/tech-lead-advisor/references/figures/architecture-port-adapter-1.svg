t></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="505.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="252.5" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Primary/Drivingアダプターとして扱う。コアが公開するポートに合わせて実装する</text></g></g><g class="wf-node" transform="translate(529.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="400.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="200.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このコンポーネントは、コアが外部の技術を呼び出すために使う側か</text></g></g><g class="wf-node" transform="translate(124.4,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="584.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="292.4" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Secondary/Drivenアダプターとして扱う。コアが定義したポート（インターフェース）を実装する</text></g></g><g class="wf-node" transform="translate(733.2,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="616.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="308.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">どちらでもない場合、アプリケーションコア自体（ドメイン層・アプリケーション層）に属する可能性が高い</text></g></g></g></svg>