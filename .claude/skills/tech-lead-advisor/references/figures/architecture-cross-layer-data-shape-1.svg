le" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このデータはレイヤー境界を越えて渡されるか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">変換不要。ドメインオブジェクトのまま層内で扱ってよい</text></g></g><g class="wf-node" transform="translate(364.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">受け取る側はこのデータを読み取るだけか</text></g></g><g class="wf-node" transform="translate(209.5,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="279.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="139.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">必要な値だけをコピーしたDTOに変換して渡す</text></g></g><g class="wf-node" transform="translate(512.9,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="244.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="122.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">受け取る側が状態の変更を要求する場合</text></g></g><g class="wf-node" transform="translate(302.9,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="664.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="332.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">生のオブジェクトを渡すのではなく、変更の意図を表すコマンドを渡し、内側の層のメソッド呼び出しとして実行する</text></g></g></g></svg>