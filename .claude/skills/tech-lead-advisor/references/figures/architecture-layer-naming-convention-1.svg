le="plain"><rect x="0" y="0" width="315.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="157.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この識別子はレイヤー境界を越えるデータ（DTO）か</text></g></g><g class="wf-node" transform="translate(267.0,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">層の外に出るための入れ物であることが分かる名前にする</text></g></g><g class="wf-node" transform="translate(631.0,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="436.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="218.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">アプリケーション層の識別子として、業務操作（動詞＋目的語）で命名する</text></g></g></g></svg>