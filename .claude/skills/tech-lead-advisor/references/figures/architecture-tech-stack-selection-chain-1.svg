<svg class="wf-fig" viewBox="0 0 1153 236" width="1153" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M364.2,32.6 L190.3,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="190.3,95.4 195.8,90.8 197.5,95.4" fill="#C3CAD2"/><rect x="258.3" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="277.3" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M364.2,32.6 L537.6,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="537.6,95.4 530.4,95.4 532.1,90.8" fill="#C3CAD2"/><rect x="436.9" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="450.9" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M537.6,128.6 L260.4,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="260.4,191.4 266.5,187.5 267.6,192.3" fill="#C3CAD2"/><rect x="385.0" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="399.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M537.6,128.6 L815.8,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="815.8,191.4 808.7,192.3 809.8,187.5" fill="#C3CAD2"/><rect x="657.7" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="676.7" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><g class="wf-node" transform="translate(95.9,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="535.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="267.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">技術方式は既に決まっているか（サブドメイン分類→実装方法→技術方式の連鎖を経ているか）</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="379.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="189.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">先に連鎖（サブドメイン分類→実装方法→技術方式）を確定させる</text></g></g><g class="wf-node" transform="translate(403.6,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="268.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="134.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その技術方式が要求する技術的性質は明確か</text></g></g><g class="wf-node" transform="translate(54.2,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="411.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="205.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その性質を満たす製品候補を複数挙げ、ADRとして選定理由を記録する</text></g></g><g class="wf-node" transform="translate(489.6,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="651.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="325.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この判断基準の範囲外。プロジェクト固有の制約（チームの習熟度・既存資産・コスト）で判断し、ADRに保存する</text></g></g></g></svg>