="12.0" font-weight="400" fill="#171B23">Rとして選定理由を記録する</text></g></g><g class="wf-node" transform="translate(424.5,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この判断基準の範囲外。プロジェクト固有</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">の制約（チームの習熟度・既存資産・コス</text><text x="128.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ト）で判断し、ADRに保存する</text></g></g></g></svg>