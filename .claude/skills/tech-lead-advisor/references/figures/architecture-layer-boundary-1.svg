<svg class="wf-fig" viewBox="0 0 1423 128" width="1423" height="128" role="img"><g transform="translate(6.0,6.0)"><path d="M232.0,44.0 L294.8,16.0" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="294.8,16.0 289.6,21.0 287.6,16.5" fill="#C3CAD2"/><rect x="249.4" y="20.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="263.4" y="33.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M232.0,44.0 L294.8,72.0" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="294.8,72.0 287.6,71.5 289.6,67.0" fill="#C3CAD2"/><rect x="244.4" y="48.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="263.4" y="61.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M636.0,72.0 L958.6,44.0" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="958.6,44.0 952.1,47.0 951.6,42.1" fill="#C3CAD2"/><rect x="783.3" y="48.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="797.3" y="61.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M636.0,72.0 L958.6,100.0" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="958.6,100.0 951.6,101.9 952.1,97.0" fill="#C3CAD2"/><rect x="778.3" y="76.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="797.3" y="89.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><g class="wf-node" transform="translate(0.0,28.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="231.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="115.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このサブドメインはDDD分類で中核か</text></g></g><g class="wf-node" transform="translate(295.4,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="599.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="299.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">3層（ドメイン／アプリケーション／インフラ）を明確に分離し、ドメイン層に業務ルールを厚く実装する</text></g></g><g class="wf-node" transform="translate(295.4,56.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">一般サブドメイン（差別化に寄与しないが必須の機能）か</text></g></g><g class="wf-node" transform="translate(959.2,28.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="340.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">層分離は緩めてよい。既存ライブラリ・標準実装に委ねる</text></g></g><g class="wf-node" transform="translate(959.2,84.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="451.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="225.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">補完サブドメイン: 最小限の層構成（トランザクションスクリプト等）で十分</text></g></g></g></svg>