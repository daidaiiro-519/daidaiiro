<svg class="wf-fig" viewBox="0 0 1354 236" width="1354" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M640.0,32.6 L338.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="338.0,95.4 344.1,91.6 345.1,96.4" fill="#C3CAD2"/><rect x="470.0" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="489.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">技術的</text><path d="M640.0,32.6 L942.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="942.0,95.4 934.9,96.4 935.9,91.6" fill="#C3CAD2"/><rect x="767.0" y="54.0" width="48.0" height="16.0" fill="#F5F7F9"/><text x="791.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">業務要件</text><path d="M942.0,128.6 L700.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="700.0,191.4 705.9,187.3 707.2,192.1" fill="#C3CAD2"/><rect x="807.0" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="821.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M942.0,128.6 L1184.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="1184.0,191.4 1176.8,192.1 1178.1,187.3" fill="#C3CAD2"/><rect x="1044.0" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="1063.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><g class="wf-node" transform="translate(338.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="604.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="302.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この関心事は業務要件（誰が・何をしたかを業務上追跡・制御する必要がある）か、純粋に技術的な制御か</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="676.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="338.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">純粋に技術的：外側（デコレーター／ミドルウェア）に置く。ドメイン・アプリケーション層のコードには一切書かない</text></g></g><g class="wf-node" transform="translate(700.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="484.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="242.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">業務要件の場合、この関心事の判断（何を・いつ）はドメインの知識を必要とするか</text></g></g><g class="wf-node" transform="translate(398.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="604.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="302.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメイン・アプリケーション層が「何をすべきか」を決め、実行手段はポート経由でアダプターに委譲する</text></g></g><g class="wf-node" transform="translate(1026.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="316.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="158.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメインの知識が不要なら、外側で一括処理してよい</text></g></g></g></svg>