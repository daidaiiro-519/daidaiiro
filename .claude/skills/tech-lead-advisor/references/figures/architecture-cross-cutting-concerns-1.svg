<svg class="wf-fig" viewBox="0 0 694 344" width="694" height="344" role="img"><g transform="translate(6.0,6.0)"><path d="M271.0,68.6 L128.0,131.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="128.0,131.4 133.2,126.4 135.2,130.9" fill="#C3CAD2"/><rect x="180.5" y="90.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="199.5" y="103.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">技術的</text><path d="M271.0,68.6 L413.2,131.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="413.2,131.4 406.0,130.9 408.0,126.4" fill="#C3CAD2"/><rect x="318.1" y="90.0" width="48.0" height="16.0" fill="#F5F7F9"/><text x="342.1" y="103.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">業務要件</text><path d="M414.8,182.6 L274.0,263.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="274.0,263.4 278.6,257.9 281.1,262.2" fill="#C3CAD2"/><rect x="330.4" y="213.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="344.4" y="226.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M414.8,182.6 L553.2,263.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="553.2,263.4 546.1,262.1 548.6,257.9" fill="#C3CAD2"/><rect x="465.0" y="213.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="484.0" y="226.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><g class="wf-node" transform="translate(143.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この関心事は業務要件（誰が・何をしたか</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">を業務上追跡・制御する必要がある）か、</text><text x="128.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">純粋に技術的な制御か</text></g></g><g class="wf-node" transform="translate(0.0,132.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">純粋に技術的：外側（デコレーター／ミド</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ルウェア）に置く。ドメイン・アプリケー</text><text x="128.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ション層のコードには一切書かない</text></g></g><g class="wf-node" transform="translate(280.0,132.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="268.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="134.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">業務要件の場合、この関心事の判断（何を・</text><text x="134.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">いつ）はドメインの知識を必要とするか</text></g></g><g class="wf-node" transform="translate(146.0,264.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメイン・アプリケーション層が「何をす</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">べきか」を決め、実行手段はポート経由で</text><text x="128.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">アダプターに委譲する</text></g></g><g class="wf-node" transform="translate(426.0,264.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ドメインの知識が不要なら、外側で一括処</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">理してよい</text></g></g></g></svg>