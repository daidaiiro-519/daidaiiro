<!-- 基盤の文書（document.schema.json）の決まったデザインの部品。何も指定が無いときに使う（UC-6）。{{名前}} はプレースホルダー。/*STYLE*/ は document.css に置き換わる。{{tokens}} は design-system.json のトークンから基盤が作る CSS の変数 -->
<template id="page"><div class="sd-doc"><style>{{tokens}}</style><style>/*STYLE*/</style><header class="sd-head"><div class="sd-badges">{{badges}}</div><h1>{{title}}</h1>{{lead}}</header><main class="sd-sections">{{sections}}</main></div></template>
<template id="lead"><p class="sd-lead">{{text}}</p></template>
<template id="badge"><span class="sd-badge">{{text}}</span></template>
<template id="section"><section class="sd-section" id="{{anchor}}"><h2>{{heading}}</h2><div class="sd-blocks">{{blocks}}</div></section></template>
<template id="paragraph"><p class="sd-p">{{text}}</p></template>
<template id="paragraph-strong"><p class="sd-p sd-strong">{{text}}</p></template>
<template id="properties"><dl class="sd-kv">{{rows}}</dl></template>
<template id="property"><div class="sd-kv-row"><dt>{{label}}</dt><dd>{{value}}</dd></div></template>
<template id="table"><figure class="sd-table-wrap">{{caption}}<div class="sd-scroll"><table class="sd-table"><thead><tr>{{head}}</tr></thead><tbody>{{rows}}</tbody></table></div></figure></template>
<template id="caption"><figcaption>{{text}}</figcaption></template>
<template id="th"><th>{{text}}</th></template>
<template id="th-right"><th class="sd-right">{{text}}</th></template>
<template id="tr"><tr>{{cells}}</tr></template>
<template id="tr-emphasis"><tr class="sd-emphasis">{{cells}}</tr></template>
<template id="td"><td>{{text}}</td></template>
<template id="td-right"><td class="sd-right">{{text}}</td></template>
<template id="cell-badge"><span class="sd-cell-badge sd-tone-{{tone}}">{{text}}</span></template>
<template id="change"><div class="sd-change">{{rows}}</div></template>
<template id="change-row"><div class="sd-change-row"><div class="sd-change-what">{{what}}</div><div class="sd-before"><span class="sd-tag">前</span>{{before}}</div><div class="sd-after"><span class="sd-tag">後</span>{{after}}</div></div></template>
<template id="steps"><ol class="sd-steps">{{items}}</ol></template>
<template id="step"><li class="sd-step">{{actor}}<span class="sd-step-text">{{text}}</span>{{branches}}</li></template>
<template id="actor"><span class="sd-actor">{{text}}</span></template>
<template id="branch"><div class="sd-branch"><div class="sd-branch-when">{{condition}}</div>{{steps}}{{ending}}</div></template>
<template id="ending"><div class="sd-ending">{{text}}</div></template>
<template id="status"><ul class="sd-status">{{items}}</ul></template>
<template id="status-item"><li><span class="sd-state sd-state-{{state}}">{{label_state}}</span><span class="sd-status-label">{{label}}</span>{{note}}</li></template>
<template id="status-note"><span class="sd-status-note">{{text}}</span></template>
<template id="bars"><div class="sd-bars">{{items}}{{unit}}</div></template>
<template id="bar"><div class="sd-bar-row"><span class="sd-bar-label">{{label}}</span><span class="sd-bar-track"><span class="sd-bar" style="width:{{width}}%"></span></span><span class="sd-bar-value">{{value}}</span></div></template>
<template id="bar-target"><div class="sd-bar-row sd-bar-target"><span class="sd-bar-label">{{label}}</span><span class="sd-bar-track"><span class="sd-target-line" style="left:{{width}}%"></span></span><span class="sd-bar-value">{{value}}</span></div></template>
<template id="unit"><div class="sd-unit">単位：{{text}}</div></template>
<template id="quote"><blockquote class="sd-quote"><p>{{text}}</p><cite>{{source}}</cite></blockquote></template>
<template id="note"><div class="sd-note sd-note-{{level}}">{{text}}</div></template>
<template id="fold"><details class="sd-fold"><summary>{{summary}}</summary><div class="sd-blocks">{{blocks}}</div></details></template>
<template id="figure"><figure class="sd-figure"><img src="{{src}}" alt="{{alt}}"><figcaption>{{caption}}</figcaption></figure></template>
<template id="figure-inline"><figure class="sd-figure"><div class="sd-svg">{{svg}}</div><figcaption>{{caption}}</figcaption></figure></template>
<template id="code"><pre class="sd-code"><code>{{text}}</code></pre></template>
<template id="list"><ul class="sd-list">{{items}}</ul></template>
<template id="item"><li>{{text}}</li></template>
<template id="strong"><strong>{{text}}</strong></template>
<template id="code-inline"><code class="sd-code-inline">{{text}}</code></template>
<template id="link"><a href="{{href}}">{{text}}</a></template>
<template id="toc"><nav class="sd-toc"><div class="sd-toc-title">目次</div><ol>{{items}}</ol></nav></template>
<template id="toc-item"><li><a href="#{{anchor}}">{{text}}</a></li></template>
<template id="sources"><section class="sd-section sd-sources" id="sources"><h2>出どころ</h2><ol class="sd-source-list">{{items}}</ol></section></template>
<template id="source-item"><li id="source-{{id}}">{{label}}{{url}}</li></template>
<template id="source-url"><a class="sd-source-url" href="{{href}}">{{text}}</a></template>
<template id="timeline"><ol class="sd-timeline">{{items}}</ol></template>
<template id="timeline-item"><li class="sd-timeline-item"><time class="sd-time">{{time}}</time><div class="sd-timeline-body"><span>{{text}}</span>{{branches}}</div></li></template>
