# core ではファイルを直接読み書きしない（ACDR 0121）。入出力は ports の trait を通す
disallowed-methods = [
  "std::fs::read", "std::fs::read_to_string", "std::fs::read_dir", "std::fs::write",
  "std::fs::copy", "std::fs::rename", "std::fs::remove_file", "std::fs::remove_dir_all",
  "std::fs::create_dir", "std::fs::create_dir_all", "std::fs::metadata",
  "std::fs::File::open", "std::fs::File::create", "std::fs::OpenOptions::open",
]
disallowed-types = ["std::fs::File", "std::fs::OpenOptions"]
