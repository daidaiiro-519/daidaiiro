[package]
name = "schema-driven-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# core はファイルも通信も直接扱わない。入出力は ports の trait を通す（clippy.toml が std::fs を禁じる）
[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
jsonschema = { version = "0.58.5", default-features = false }
json-patch = "4.2.0"
sha2 = "0.11.0"
