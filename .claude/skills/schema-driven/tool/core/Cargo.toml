[package]
name = "schema-driven-core"
# 利用側の Skill へそのまま転写して使うので、ワークスペースの設定を受け継がない（UC-9）
version = "0.1.0"
edition = "2021"
license = "MIT"

# core はファイルも通信も直接扱わない。入出力は ports の trait を通す（clippy.toml が std::fs を禁じる）
[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
jsonschema = { version = "0.58.5", default-features = false }
json-patch = "4.2.0"
sha2 = "0.11.0"
