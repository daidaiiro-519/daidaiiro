[package]
name = "schema-driven-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "schema-driven-mcp"
path = "src/main.rs"

# ネットワークに出る機能を外す（ACDR 0122）
[dependencies]
schema-driven-core = { path = "../core" }
schema-driven-adapters = { path = "../adapters" }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.2", features = ["rt", "io-std", "macros"] }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
