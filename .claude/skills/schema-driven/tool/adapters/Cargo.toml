[package]
name = "schema-driven-adapters"
# 利用側の Skill へそのまま転写して使うので、ワークスペースの設定を受け継がない（UC-9）
version = "0.1.0"
edition = "2021"
license = "MIT"

# adapters から core への一方向だけを持つ
[dependencies]
schema-driven-core = { path = "../core" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
jmespath = "0.5.0"
