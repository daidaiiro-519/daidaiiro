[package]
name = "schema-driven-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "schema-driven"
path = "src/main.rs"

[dependencies]
schema-driven-core = { path = "../core" }
schema-driven-adapters = { path = "../adapters" }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# テストは基盤の内部も確かめるので、内部を開く
schema-driven-core = { path = "../core", features = ["internals"] }
