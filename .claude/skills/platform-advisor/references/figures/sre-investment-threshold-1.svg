rif" font-size="12.0" font-weight="400" fill="#171B23">引き続き保留してよい（利用者側の対応で</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">十分）</text></g></g><g class="wf-node" transform="translate(425.2,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="259.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="129.5" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">各論（reliability-targets-and-e</text><text x="129.5" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">rror-budgets等）の検討に進む</text></g></g></g></svg>