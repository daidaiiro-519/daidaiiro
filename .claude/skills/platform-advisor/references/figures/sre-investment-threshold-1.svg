<svg class="wf-fig" viewBox="0 0 1273 236" width="1273" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M548.5,32.6 L257.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="257.0,95.4 263.1,91.6 264.1,96.4" fill="#C3CAD2"/><rect x="383.8" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="402.8" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M548.5,32.6 L840.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="840.0,95.4 832.9,96.4 833.9,91.6" fill="#C3CAD2"/><rect x="680.2" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="694.2" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M840.0,128.6 L642.9,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="642.9,191.4 648.5,187.0 650.0,191.7" fill="#C3CAD2"/><rect x="722.4" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="741.4" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M840.0,128.6 L1037.2,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="1037.2,191.4 1030.0,191.7 1031.5,187.0" fill="#C3CAD2"/><rect x="924.6" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="938.6" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(312.5,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="472.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="236.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この対象は複数の利用者・チームから継続的に呼び出される状態で稼働し続けるか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="514.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="257.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">SRE投資の前提を満たさない。SLI/SLO・アクセス制御・可観測性基盤の整備は保留する</text></g></g><g class="wf-node" transform="translate(538.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="604.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="302.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">障害・性能劣化が発生したとき、利用者自身の再起動では対応できず外部から検知・対応する必要があるか</text></g></g><g class="wf-node" transform="translate(496.9,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="292.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="146.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">引き続き保留してよい（利用者側の対応で十分）</text></g></g><g class="wf-node" transform="translate(812.9,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="448.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="224.3" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">各論（reliability-targets-and-error-budgets等）の検討に進む</text></g></g></g></svg>