<svg class="wf-fig" viewBox="0 0 464 308" width="464" height="308" role="img"><g transform="translate(6.0,6.0)"><path d="M211.0,50.6 L91.2,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="91.2,113.4 96.0,108.1 98.3,112.4" fill="#C3CAD2"/><rect x="132.1" y="72.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="151.1" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M211.0,50.6 L330.0,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="330.0,113.4 322.9,112.4 325.2,108.1" fill="#C3CAD2"/><rect x="256.5" y="72.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="270.5" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M330.0,182.6 L330.0,245.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="330.0,245.4 327.5,238.6 332.5,238.6" fill="#C3CAD2"/><rect x="301.0" y="204.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="330.0" y="217.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">特定できた</text><g class="wf-node" transform="translate(89.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="244.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="122.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この監視項目は、実際に何らかの意思決</text><text x="122.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">定（対応するかしないか）に使われるか</text></g></g><g class="wf-node" transform="translate(0.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="184.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="92.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">収集を見送るか、既存の指標</text><text x="92.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">に統合できないか検討する</text></g></g><g class="wf-node" transform="translate(208.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="244.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="122.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その意思決定に必要なのは、状態の把握</text><text x="122.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">（メトリクス）か、出来事の記録（ロ</text><text x="122.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">グ）か、経路の特定（トレース）か</text></g></g><g class="wf-node" transform="translate(250.0,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="160.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="80.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">必要な種類の可観測性</text><text x="80.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">データを設計し収集する</text></g></g></g></svg>