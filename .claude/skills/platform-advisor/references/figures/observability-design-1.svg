<svg class="wf-fig" viewBox="0 0 1004 236" width="1004" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M418.0,32.6 L164.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="164.0,95.4 170.0,91.4 171.2,96.2" fill="#C3CAD2"/><rect x="272.0" y="54.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="291.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M418.0,32.6 L672.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="672.0,95.4 664.8,96.2 666.0,91.4" fill="#C3CAD2"/><rect x="531.0" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="545.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M672.0,128.6 L672.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="672.0,191.4 669.5,184.6 674.5,184.6" fill="#C3CAD2"/><rect x="643.0" y="150.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="672.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">特定できた</text><g class="wf-node" transform="translate(188.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="460.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="230.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この監視項目は、実際に何らかの意思決定（対応するかしないか）に使われるか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="328.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="164.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">収集を見送るか、既存の指標に統合できないか検討する</text></g></g><g class="wf-node" transform="translate(352.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="640.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="320.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その意思決定に必要なのは、状態の把握（メトリクス）か、出来事の記録（ログ）か、経路の特定（トレース）か</text></g></g><g class="wf-node" transform="translate(532.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="280.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="140.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">必要な種類の可観測性データを設計し収集する</text></g></g></g></svg>