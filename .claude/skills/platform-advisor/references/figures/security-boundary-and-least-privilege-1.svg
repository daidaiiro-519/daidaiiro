<svg class="wf-fig" viewBox="0 0 534 326" width="534" height="326" role="img"><g transform="translate(6.0,6.0)"><path d="M202.9,50.6 L86.0,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="86.0,113.4 90.8,108.0 93.1,112.4" fill="#C3CAD2"/><rect x="80.4" y="72.0" width="128.0" height="16.0" fill="#F5F7F9"/><text x="144.4" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（必要以上に広い）</text><path d="M202.9,50.6 L319.8,113.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="319.8,113.4 312.7,112.4 315.0,108.0" fill="#C3CAD2"/><rect x="247.4" y="72.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="261.4" y="85.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M319.8,182.6 L208.7,245.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="208.7,245.4 213.4,239.9 215.8,244.2" fill="#C3CAD2"/><rect x="217.0" y="204.0" width="94.5" height="16.0" fill="#F5F7F9"/><text x="264.3" y="217.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（1層のみ）</text><path d="M319.8,182.6 L429.8,245.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="429.8,245.4 422.7,244.2 425.1,239.9" fill="#C3CAD2"/><rect x="335.8" y="204.0" width="78.0" height="16.0" fill="#F5F7F9"/><text x="374.8" y="217.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい（複数層）</text><g class="wf-node" transform="translate(86.9,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="232.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="116.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このアクセス権は、対象の役割が実際</text><text x="116.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">に必要とする範囲に絞られているか</text></g></g><g class="wf-node" transform="translate(0.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">必要な範囲まで絞り込む。</text><text x="86.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">既定で広い権限を与えない</text></g></g><g class="wf-node" transform="translate(196.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="247.6" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="123.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このセキュリティ対策は、複数の層（ネ</text><text x="123.8" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ットワーク/インスタンス/アプリケーシ</text><text x="123.8" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ョン等）に重ねて配置されているか</text></g></g><g class="wf-node" transform="translate(105.8,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="208.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="104.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">単一の層に頼っている。他の層に</text><text x="104.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">も対策を追加し、1つの突破で全</text><text x="104.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">体が無防備にならないようにする</text></g></g><g class="wf-node" transform="translate(337.8,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="184.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="92.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">妥当な境界設計と判定できる</text></g></g></g></svg>