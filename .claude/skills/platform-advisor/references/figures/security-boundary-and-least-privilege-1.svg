<svg class="wf-fig" viewBox="0 0 1008 236" width="1008" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M412.9,32.6 L158.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="158.0,95.4 164.0,91.4 165.2,96.2" fill="#C3CAD2"/><rect x="221.4" y="54.0" width="128.0" height="16.0" fill="#F5F7F9"/><text x="285.4" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（必要以上に広い）</text><path d="M412.9,32.6 L667.3,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="667.3,95.4 660.1,96.2 661.3,91.4" fill="#C3CAD2"/><rect x="526.1" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="540.1" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M667.3,128.6 L468.3,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="468.3,191.4 474.0,187.0 475.5,191.7" fill="#C3CAD2"/><rect x="520.6" y="150.0" width="94.5" height="16.0" fill="#F5F7F9"/><text x="567.8" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（1層のみ）</text><path d="M667.3,128.6 L866.8,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="866.8,191.4 859.6,191.7 861.0,187.0" fill="#C3CAD2"/><rect x="728.0" y="150.0" width="78.0" height="16.0" fill="#F5F7F9"/><text x="767.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい（複数層）</text><g class="wf-node" transform="translate(200.9,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="424.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="212.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このアクセス権は、対象の役割が実際に必要とする範囲に絞られているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="316.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="158.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">必要な範囲まで絞り込む。既定で広い権限を与えない</text></g></g><g class="wf-node" transform="translate(340.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="655.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="327.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このセキュリティ対策は、複数の層（ネットワーク/インスタンス/アプリケーション等）に重ねて配置されているか</text></g></g><g class="wf-node" transform="translate(186.9,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="563.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="281.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">単一の層に頼っている。他の層にも対策を追加し、1つの突破で全体が無防備にならないようにする</text></g></g><g class="wf-node" transform="translate(774.8,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="184.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="92.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">妥当な境界設計と判定できる</text></g></g></g></svg>