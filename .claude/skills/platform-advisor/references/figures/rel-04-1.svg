<svg class="wf-fig" viewBox="0 0 1150 500" width="1150" height="500" role="img"><g transform="translate(20.0,24.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="74.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="37.4" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Client</text></g></g><g transform="translate(640.0,24.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="121.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="60.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">EC2 instance</text></g></g><g><path d="M94.8,40.0 L640.0,40.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,40.0 633.2,42.5 633.2,37.5" fill="#79828F"/></g><g transform="translate(790.0,20.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="700" fill="#171B23">Tight Coupling (Synchronous)</text></g></g><g transform="translate(790.0,40.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">A failure on the EC2 instance</text><text x="0.0" y="27.8" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">directly impacts the client</text></g></g><g transform="translate(20.0,150.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="137.2" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="68.6" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Event Producer</text></g></g><g transform="translate(200.0,150.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="74.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="37.4" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Events</text></g></g><g transform="translate(320.0,150.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="168.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="84.2" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Amazon EventBridge</text></g></g><g transform="translate(520.0,150.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="67.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="33.5" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Rules</text></g></g><g transform="translate(640.0,100.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 1</text></g></g><g transform="translate(640.0,150.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 2</text></g></g><g transform="translate(640.0,200.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 3</text></g></g><g><path d="M157.2,166.0 L200.0,166.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="200.0,166.0 193.2,168.5 193.2,163.5" fill="#79828F"/></g><g><path d="M274.8,166.0 L320.0,166.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="320.0,166.0 313.2,168.5 313.2,163.5" fill="#79828F"/></g><g><path d="M488.4,166.0 L520.0,166.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="520.0,166.0 513.2,168.5 513.2,163.5" fill="#79828F"/></g><g><path d="M587.0,166.0 L640.0,166.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,166.0 633.2,168.5 633.2,163.5" fill="#79828F"/></g><g><path d="M587.0,166.0 Q607.0,166.0 608.5,166.0 Q610.0,166.0 610.0,164.5 Q610.0,163.0 610.0,141.0 Q610.0,119.0 610.0,117.5 Q610.0,116.0 611.5,116.0 Q613.0,116.0 626.5,116.0 L640.0,116.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,116.0 633.2,118.5 633.2,113.5" fill="#79828F"/></g><g><path d="M587.0,166.0 Q607.0,166.0 608.5,166.0 Q610.0,166.0 610.0,167.5 Q610.0,169.0 610.0,191.0 Q610.0,213.0 610.0,214.5 Q610.0,216.0 611.5,216.0 Q613.0,216.0 626.5,216.0 L640.0,216.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,216.0 633.2,218.5 633.2,213.5" fill="#79828F"/></g><g transform="translate(790.0,120.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="700" fill="#171B23">Loose Coupling (Asynchronous)</text></g></g><g transform="translate(790.0,140.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumers/components in this</text><text x="0.0" y="27.8" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">architecture are triggered by events, if</text><text x="0.0" y="47.0" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">one consumer is not available, doesn&#x27;t</text><text x="0.0" y="66.2" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">affect the availability of other consumers</text></g></g><g transform="translate(20.0,340.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="152.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="76.4" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Message Producer</text></g></g><g transform="translate(220.0,340.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="230.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="115.4" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Message Queue (Amazon SQS)</text></g></g><g transform="translate(640.0,290.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 1</text></g></g><g transform="translate(640.0,340.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 2</text></g></g><g transform="translate(640.0,390.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="106.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="53.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumer 3</text></g></g><g><path d="M172.8,356.0 L220.0,356.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="220.0,356.0 213.2,358.5 213.2,353.5" fill="#79828F"/></g><g><path d="M610.0,356.0 L450.8,356.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="450.8,356.0 457.6,353.5 457.6,358.5" fill="#79828F"/><rect x="503.2" y="346.0" width="53.5" height="16.0" fill="#F5F7F9"/><text x="530.0" y="359.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">Message</text></g><g><path d="M450.8,356.0 L640.0,356.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,356.0 633.2,358.5 633.2,353.5" fill="#79828F"/></g><g><path d="M610.0,356.0 Q610.0,309.0 610.0,307.5 Q610.0,306.0 611.5,306.0 Q613.0,306.0 626.5,306.0 L640.0,306.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,306.0 633.2,308.5 633.2,303.5" fill="#79828F"/></g><g><path d="M610.0,356.0 Q610.0,403.0 610.0,404.5 Q610.0,406.0 611.5,406.0 Q613.0,406.0 626.5,406.0 L640.0,406.0" fill="none" stroke="#79828F" stroke-width="1.2"/><polygon points="640.0,406.0 633.2,408.5 633.2,403.5" fill="#79828F"/></g><g transform="translate(790.0,270.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="700" fill="#171B23">Loose Coupling (Asynchronous)</text></g></g><g transform="translate(790.0,290.0)"><g><text x="0.0" y="8.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">Consumers pick up requests as messages</text><text x="0.0" y="27.8" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">in the queue. If a failure occurs, the</text><text x="0.0" y="47.0" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">message stays in the queue and another</text><text x="0.0" y="66.2" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">consumer can pick it (or it can receive</text><text x="0.0" y="85.4" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">special processing in a Dead Letter Queue)</text><text x="0.0" y="104.6" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23"></text><text x="0.0" y="123.8" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">If request rate exceeds the ability to</text><text x="0.0" y="143.0" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">process them, requests can still be fulfilled</text><text x="0.0" y="162.2" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">as they are stored in the queue until</text><text x="0.0" y="181.4" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">processed.</text></g></g></svg>