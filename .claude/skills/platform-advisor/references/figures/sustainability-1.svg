<svg class="wf-fig" viewBox="0 0 979 236" width="979" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M424.0,32.6 L200.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="200.0,95.4 205.8,91.2 207.2,95.9" fill="#C3CAD2"/><rect x="223.0" y="54.0" width="178.0" height="16.0" fill="#F5F7F9"/><text x="312.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（稼働率が低い時間帯がある）</text><path d="M424.0,32.6 L648.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="648.0,95.4 640.8,95.9 642.2,91.2" fill="#C3CAD2"/><rect x="522.0" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="536.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M648.0,128.6 L457.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="457.0,191.4 462.7,186.9 464.2,191.6" fill="#C3CAD2"/><rect x="533.5" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="552.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M648.0,128.6 L839.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="839.0,191.4 831.8,191.6 833.3,186.9" fill="#C3CAD2"/><rect x="729.5" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="743.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><g class="wf-node" transform="translate(278.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="292.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="146.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このリソースは常時高い使用率で稼働しているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="400.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="200.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">需要平準化・スケールダウンの仕組みを導入し、不要な稼働を減らす</text></g></g><g class="wf-node" transform="translate(424.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="448.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="224.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">保持しているデータは、アクセス頻度に応じたストレージ層に置かれているか</text></g></g><g class="wf-node" transform="translate(227.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="460.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="230.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ライフサイクル管理で、アクセス頻度の低いデータをより効率的な層へ移行する</text></g></g><g class="wf-node" transform="translate(711.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">現状の配置は持続可能性の観点からも妥当</text></g></g></g></svg>