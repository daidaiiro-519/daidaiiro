28F">定型的な運用作業</text><path d="M434.0,296.6 L547.0,359.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="547.0,359.4 539.9,358.3 542.3,354.0" fill="#C3CAD2"/><rect x="461.5" y="318.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="490.5" y="331.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">差別化要因</text><g class="wf-node" transform="translate(107.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="220.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このリソースは実際の使用量に応じ</text><text x="110.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">て支払う消費モデルになっているか</text></g></g><g class="wf-node" transform="translate(0.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="208.0" height="68.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="104.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">需要が不確実な場合は消費モデル</text><text x="104.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">に近い選択肢（従量課金・オート</text><text x="104.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">スケーリング等）を検討する</text></g></g><g class="wf-node" transform="translate(232.0,114.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="196.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="98.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このコストは、どの事業成果・</text><text x="98.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">部門に対応するか説明できるか</text></g></g><g class="wf-node" transform="translate(128.0,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="196.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="98.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">コストの帰属を明確にする仕組</text><text x="98.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">み（タグ付け等）を導入する</text></g></g><g class="wf-node" transform="translate(348.0,246.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この作業は事業の差別化要</text><text x="86.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">因か、定型的な運用作業か</text></g></g><g class="wf-node" transform="translate(247.0,360.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="148.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="74.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">マネージドサービスへ</text><text x="74.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">の切り替えを検討する</text></g></g><g class="wf-node" transform="tran