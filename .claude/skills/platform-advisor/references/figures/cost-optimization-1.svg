<svg class="wf-fig" viewBox="0 0 1212 332" width="1212" height="332" role="img"><g transform="translate(6.0,6.0)"><path d="M511.0,32.6 L272.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="272.0,95.4 277.9,91.3 279.2,96.1" fill="#C3CAD2"/><rect x="292.5" y="54.0" width="198.0" height="16.0" fill="#F5F7F9"/><text x="391.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（あらかじめ大きく確保している）</text><path d="M511.0,32.6 L750.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="750.0,95.4 742.8,96.1 744.1,91.3" fill="#C3CAD2"/><rect x="616.5" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="630.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M750.0,128.6 L571.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="571.0,191.4 576.6,186.8 578.2,191.5" fill="#C3CAD2"/><rect x="641.5" y="150.0" width="38.0" height="16.0" fill="#F5F7F9"/><text x="660.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ</text><path d="M750.0,128.6 L929.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="929.0,191.4 921.8,191.5 923.4,186.8" fill="#C3CAD2"/><rect x="825.5" y="150.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="839.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M929.0,224.6 L786.0,287.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="786.0,287.4 791.2,282.4 793.2,286.9" fill="#C3CAD2"/><rect x="813.5" y="246.0" width="88.0" height="16.0" fill="#F5F7F9"/><text x="857.5" y="259.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">定型的な運用作業</text><path d="M929.0,224.6 L1072.0,287.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="1072.0,287.4 1064.8,286.9 1066.8,282.4" fill="#C3CAD2"/><rect x="971.5" y="246.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="1000.5" y="259.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">差別化要因</text><g class="wf-node" transform="translate(305.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="412.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="206.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このリソースは実際の使用量に応じて支払う消費モデルになっているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="544.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="272.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">需要が不確実な場合は消費モデルに近い選択肢（従量課金・オートスケーリング等）を検討する</text></g></g><g class="wf-node" transform="translate(568.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="364.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="182.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">このコストは、どの事業成果・部門に対応するか説明できるか</text></g></g><g class="wf-node" transform="translate(395.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="352.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="176.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">コストの帰属を明確にする仕組み（タグ付け等）を導入する</text></g></g><g class="wf-node" transform="translate(771.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="316.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="158.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">この作業は事業の差別化要因か、定型的な運用作業か</text></g></g><g class="wf-node" transform="translate(652.0,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="268.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="134.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">マネージドサービスへの切り替えを検討する</text></g></g><g class="wf-node" transform="translate(944.0,288.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">自前でコストをかけて磨き込む価値がある</text></g></g></g></svg>