[package]
name = "pa_business_logic"
description = "業務ロジック層。サービス層とプレゼンテーション層を参照しない"
version.workspace = true
edition.workspace = true
license.workspace = true

# **同じ workspace の crate を1件も参照しない。** 外側の層を参照した時点でコンパイルが通らない。
# 外の crate は、references の実装（refs）が使う2つだけである
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.34", default-features = false }
