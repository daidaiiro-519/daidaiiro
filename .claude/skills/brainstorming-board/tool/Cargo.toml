# ブレストボード。schema-driven を転写して持ち（tool/schema-driven/）、その上にボードの Design を置く
# （ボード board-on-schema-driven の論点3、ACDR 0143）。版は Cargo.lock の1か所で決める。
[workspace]
members = ["schema-driven/tool/core", "schema-driven/tool/adapters", "board", "cli", "mcp"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
