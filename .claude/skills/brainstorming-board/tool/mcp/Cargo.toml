[package]
name = "brainstorming-board-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "brainstorming-board-mcp"
path = "src/main.rs"

# ネットワークに出る機能を外す（ACDR 0122）
[dependencies]
schema-driven-core = { path = "../schema-driven/tool/core" }
schema-driven-adapters = { path = "../schema-driven/tool/adapters" }
brainstorming-board = { path = "../board" }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.2", features = ["rt", "io-std", "macros"] }
