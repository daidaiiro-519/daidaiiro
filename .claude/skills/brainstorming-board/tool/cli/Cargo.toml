[package]
name = "brainstorming-board-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "brainstorming-board"
path = "src/main.rs"

[dependencies]
schema-driven-core = { path = "../schema-driven/tool/core" }
schema-driven-adapters = { path = "../schema-driven/tool/adapters" }
brainstorming-board = { path = "../board" }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
