<svg class="wf-fig" viewBox="0 0 711 236" width="711" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M334.6,32.6 L334.1,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="334.1,95.4 331.7,88.6 336.6,88.7" fill="#C3CAD2"/><rect x="260.3" y="54.0" width="148.0" height="16.0" fill="#F5F7F9"/><text x="334.3" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">抽象化を追加しようとしている</text><path d="M335.1,128.6 L153.3,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="153.3,191.4 158.9,186.9 160.5,191.5" fill="#C3CAD2"/><rect x="153.7" y="150.0" width="181.0" height="16.0" fill="#F5F7F9"/><text x="244.2" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい(テスト容易性以外の理由もある)</text><path d="M335.1,128.6 L515.9,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="515.9,191.4 508.7,191.5 510.3,186.9" fill="#C3CAD2"/><rect x="340.0" y="150.0" width="171.0" height="16.0" fill="#F5F7F9"/><text x="425.5" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ(テストのためだけの抽象化)</text><g class="wf-node" transform="translate(62.3,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="544.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="272.3" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">テスト容易性のための抽象化(interface抽出・DI・mock境界の追加等)を検討しているか？</text></g></g><g class="wf-node" transform="translate(30.8,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="607.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="303.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その抽象化は、テスト容易性以外の設計上の理由(実際の可変性・置換可能性の要求)でも正当化できるか？</text></g></g><g class="wf-node" transform="translate(0.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="307.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="153.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">採用する——テスト容易性以外の理由でも妥当な設計</text></g></g><g class="wf-node" transform="translate(331.6,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="367.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="183.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">再検討する——テストのためだけの間接化になっていないか疑う</text></g></g></g></svg>