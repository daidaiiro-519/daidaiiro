<svg class="wf-fig" viewBox="0 0 891 236" width="891" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M215.0,32.6 L215.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="215.0,95.4 212.5,88.6 217.5,88.6" fill="#C3CAD2"/><rect x="51.0" y="54.0" width="328.0" height="16.0" fill="#F5F7F9"/><text x="215.0" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">高カバレッジだが、それが検出力を意味するとは限らないため検証する</text><path d="M215.0,128.6 L215.5,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="215.5,191.4 213.0,184.7 217.9,184.6" fill="#C3CAD2"/><rect x="91.3" y="150.0" width="248.0" height="16.0" fill="#F5F7F9"/><text x="215.3" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">survived率が低い(mutantの大半がkillされた)</text><path d="M430.6,112.0 Q666.6,112.0 666.6,112.0 Q666.6,112.0 666.9,151.7 L667.1,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="667.1,191.4 664.6,184.7 669.5,184.6" fill="#C3CAD2"/><rect x="472.3" y="102.0" width="232.0" height="16.0" fill="#F5F7F9"/><text x="588.3" y="115.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">survived率が高い(mutantが多く生き残った)</text><g class="wf-node" transform="translate(105.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="220.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">対象コードのカバレッジは高いか？</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="430.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="215.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">mutation testingを実行し、survivedなmutantの割合を確認する</text></g></g><g class="wf-node" transform="translate(27.3,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="375.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="187.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">カバレッジを信頼してよい(高カバレッジ=高検出力とみなせる)</text></g></g><g class="wf-node" transform="translate(454.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="425.2" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="212.6" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">survivedしたmutant周辺のテストを見直し、アサーションを強化する</text></g></g></g></svg>