<text class="note small" x="32" y="144">属性2</text>
<rect class="box focus" x="270" y="60" width="180" height="90"/><text class="title focus" x="282" y="82">エンティティB</text><line class="grid" x1="270" y1="92" x2="450" y2="92"/>
