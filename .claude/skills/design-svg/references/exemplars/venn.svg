<svg viewBox="0 0 520 412" style="min-width:440px;max-width:560px" role="img" aria-label="集合の重なり">
<text class="title" x="10" y="24">集合の重なり</text>
<circle class="set kind-1" cx="200" cy="150" r="100"/>
<circle class="set kind-2" cx="320" cy="150" r="100"/>
<circle class="set kind-3" cx="260" cy="250" r="100"/>
<text class="title kind-1" x="110" y="56" text-anchor="end">集合A</text>
<text class="title kind-2" x="410" y="56" text-anchor="start">集合B</text>
<text class="title kind-3" x="260" y="374" text-anchor="middle">集合C</text>
<text class="label" x="170" y="150" text-anchor="middle">A だけ</text>
<text class="label" x="350" y="150" text-anchor="middle">B だけ</text>
<text class="label" x="260" y="300" text-anchor="middle">C だけ</text>
<text class="label" x="260" y="128" text-anchor="middle">A と B</text>
<text class="label" x="215" y="215" text-anchor="middle">A と C</text>
<text class="label" x="305" y="215" text-anchor="middle">B と C</text>
<text class="label" x="260" y="190" text-anchor="middle">3つとも</text>
<text class="note small" x="10" y="404">円の重なりが、両方に属する要素を示す</text></svg>