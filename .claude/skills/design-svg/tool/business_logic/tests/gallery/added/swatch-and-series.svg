<rect class="swatch" x="10" y="34" width="44" height="28" fill="#0D5C55"/><text class="note small" x="32" y="76" text-anchor="middle">主色</text>
<rect class="swatch" x="64" y="34" width="44" height="28" fill="#8F5410"/><text class="note small" x="86" y="76" text-anchor="middle">注意</text>
<rect class="swatch" x="118" y="34" width="44" height="28" fill="#7A3B6D"/><text class="note small" x="140" y="76" text-anchor="middle">選択</text>
