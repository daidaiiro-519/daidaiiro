<rect class="series-2" x="150" y="150" width="50" height="30"/><text class="label small" x="175" y="144" text-anchor="middle">7</text>
<rect class="series-3" x="240" y="160" width="50" height="20"/><text class="label small" x="265" y="154" text-anchor="middle">5</text>
<text class="note small" x="85" y="194" text-anchor="middle">文書</text><text class="note small" x="175" y="194" text-anchor="middle">図</text><text class="note small" x="265" y="194" text-anchor="middle">表</text>
</svg>
