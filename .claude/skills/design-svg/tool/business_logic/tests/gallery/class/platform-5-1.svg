<svg viewBox="0 0 320 330" width="100%" style="max-width:380px" role="img" aria-label="AWS Organizations の4つのアカウントと、人と CI が入る経路">

<rect class="boundary" x="10" y="10" width="300" height="200"/>
<text class="note" x="22" y="30" font-weight="700">AWS Organizations（SCP で制限）</text>
<rect class="box" x="22" y="42" width="134" height="48"/><text class="label" x="89" y="63" font-weight="700" text-anchor="middle">管理</text><text class="note" x="89" y="80" text-anchor="middle">請求と SCP だけ</text>
<rect class="box" x="164" y="42" width="134" height="48"/><text class="label" x="231" y="63" font-weight="700" text-anchor="middle">ログ保管</text><text class="note" x="231" y="80" text-anchor="middle">CloudTrail を集める</text>
<rect class="box" x="22" y="100" width="134" height="48"/><text class="label" x="89" y="121" font-weight="700" text-anchor="middle">検証</text><text class="note" x="89" y="138" text-anchor="middle">開発者は変更可</text>
<rect class="box warn" x="164" y="100" width="134" height="48"/><text class="label warn" x="231" y="121" font-weight="700" text-anchor="middle">本番</text><text class="note warn" x="231" y="138" text-anchor="middle">人は読み取りだけ</text>
<text class="note" x="22" y="176">本番を変えるのは CI だけ</text>
<text class="note" x="22" y="194">ログは本番から消せない</text>
<rect class="box" x="10" y="246" width="140" height="48"/><text class="label" x="80" y="267" font-weight="700" text-anchor="middle">運用担当</text><text class="note small" x="80" y="284" text-anchor="middle">Identity Center ＋ MFA</text>
<rect class="box" x="170" y="246" width="140" height="48"/><text class="label" x="240" y="267" font-weight="700" text-anchor="middle">CI（GitHub）</text><text class="note" x="240" y="284" text-anchor="middle">OIDC で一時認証</text>
<path class="flow" d="M80,246 L80,228 L200,228 L200,150"/>
<line class="flow focus" x1="240" y1="246" x2="240" y2="150"/>
<text class="note" x="80" y="316" text-anchor="middle">読み取りのロール</text>
<text class="note focus" x="240" y="316" text-anchor="middle">デプロイのロール</text>
</svg>