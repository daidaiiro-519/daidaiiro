<svg viewBox="0 0 400 372" width="100%" style="max-width:520px" role="img" aria-label="依頼を魚 ・ 釣り方 ・ 川の構造の3つの層に置いた図">

<text class="label" x="22" y="20" font-weight="700" text-anchor="middle">抽象</text>
<line class="flow" x1="22" y1="186" x2="22" y2="30"/><line class="flow" x1="22" y1="186" x2="22" y2="342"/>
<text class="label" x="22" y="362" font-weight="700" text-anchor="middle">具体</text>
<rect class="box" x="48" y="10" width="342" height="96"/>
<rect class="badge focus" x="60" y="20" width="72" height="20"/>
<text class="note focus" x="96" y="34" font-weight="700" text-anchor="middle">川の構造</text>
<text class="note" x="142" y="34">打ち手を成り立たせる仕組み</text>
<text class="label" x="60" y="66">データは、業務の量に応じてたまっていく。</text>
<text class="label" x="60" y="88">余裕は「容量」と「データの量」の差で決まる</text>
<line class="link" x1="219" y1="108" x2="219" y2="132"/>
<rect class="box" x="48" y="134" width="342" height="96"/>
<rect class="badge focus" x="60" y="144" width="72" height="20"/>
<text class="note focus" x="96" y="158" font-weight="700" text-anchor="middle">釣り方</text>
<text class="note" x="142" y="158">打ち手をまとめた方法</text>
<text class="label" x="60" y="190">容量に余裕を持たせる3つの方法：</text>
<text class="label" x="60" y="212">容量を増やす ・ データを減らす ・ 増え方を見張る</text>
<line class="link" x1="219" y1="232" x2="219" y2="256"/>
<rect class="box warn" x="48" y="258" width="342" height="96"/>
<rect class="badge warn" x="60" y="268" width="72" height="20"/>
<text class="note warn" x="96" y="282" font-weight="700" text-anchor="middle">魚</text>
<text class="note" x="142" y="282">すぐ使える打ち手</text>
<text class="note warn" x="378" y="282" font-weight="700" text-anchor="end">依頼はこの層</text>
<text class="label" x="60" y="314">依頼どおり、サーバーにディスクを足す</text>
<text class="note" x="60" y="336">すぐ効くが、データが増えれば、また足りなくなる</text>
</svg>