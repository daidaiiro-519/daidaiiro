<svg viewBox="0 0 640 300" width="100%" style="min-width:560px;max-width:700px;display:block;margin:0 auto" role="img" aria-label="障害の範囲ごとの復旧の方法と RTO ・ RPO">

<text class="note" x="80" y="20" font-weight="700" text-anchor="middle">障害の範囲</text>
<text class="note" x="300" y="20" font-weight="700" text-anchor="middle">復旧の方法</text>
<text class="note" x="555" y="20" font-weight="700" text-anchor="middle">目標</text>
<rect class="box kind-1" x="10" y="34" width="140" height="64"/><text class="title kind-1" x="80" y="62" text-anchor="middle">インスタンス</text><text class="label small kind-1" x="80" y="80" text-anchor="middle">1台が止まる</text>
<line class="flow" x1="150" y1="66" x2="186" y2="66"/>
<rect class="box" x="188" y="34" width="290" height="64"/><text class="label" x="200" y="58">ALB のヘルスチェックが外し、</text><text class="label" x="200" y="78">Auto Scaling が新しい1台を起動する</text>
<line class="flow" x1="478" y1="66" x2="494" y2="66"/>
<rect class="box kind-1" x="496" y="34" width="134" height="64"/><text class="label" x="510" y="60" font-weight="700">RTO 1分</text><text class="label" x="510" y="80" font-weight="700">RPO 0</text>
<rect class="box kind-2" x="10" y="122" width="140" height="64"/><text class="title kind-2" x="80" y="150" text-anchor="middle">AZ</text><text class="label small kind-2" x="80" y="168" text-anchor="middle">1つの AZ が止まる</text>
<line class="flow" x1="150" y1="154" x2="186" y2="154"/>
<rect class="box" x="188" y="122" width="290" height="64"/><text class="label" x="200" y="146">RDS がスタンバイへフェイルオーバーし、</text><text class="label" x="200" y="166">残りの AZ でアプリ層を4台に増やす</text>
<line class="flow" x1="478" y1="154" x2="494" y2="154"/>
<rect class="box kind-2" x="496" y="122" width="134" height="64"/><text class="label" x="510" y="148" font-weight="700">RTO 5分</text><text class="label" x="510" y="168" font-weight="700">RPO 0</text>
<rect class="box kind-3" x="10" y="210" width="140" height="64"/><text class="title kind-3" x="80" y="238" text-anchor="middle">リージョン</text><text class="label small kind-3" x="80" y="256" text-anchor="middle">東京全体が止まる</text>
<line class="flow" x1="150" y1="242" x2="186" y2="242"/>
<rect class="box" x="188" y="210" width="290" height="64"/><text class="label" x="200" y="234">大阪リージョンでパイロットライトを起こし、</text><text class="label" x="200" y="254">DNS を切り替える（手順書で人が判断）</text>
<line class="flow" x1="478" y1="242" x2="494" y2="242"/>
<rect class="box kind-3" x="496" y="210" width="134" height="64"/><text class="label" x="510" y="236" font-weight="700">RTO 6時間</text><text class="label" x="510" y="256" font-weight="700">RPO 15分</text>
