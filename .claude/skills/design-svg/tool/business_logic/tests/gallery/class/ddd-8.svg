<svg viewBox="0 0 780 390" width="100%" style="max-width:780px;min-width:630px" role="img" aria-label="サーガ：注文の確定から決済の拒否までと、補償アクションの流れ"><rect class="box" x="60" y="16" width="120" height="34"/><text class="title" x="120.0" y="37.0" text-anchor="middle">注文</text><line class="grid" x1="120" y1="50" x2="120" y2="336"/><rect class="box focus" x="240" y="16" width="120" height="34"/><text class="title" x="300.0" y="37.0" text-anchor="middle">サーガ</text><line class="grid" x1="300" y1="50" x2="300" y2="336"/><rect class="box" x="420" y="16" width="120" height="34"/><text class="title" x="480.0" y="37.0" text-anchor="middle">在庫</text><line class="grid" x1="480" y1="50" x2="480" y2="336"/><rect class="box" x="600" y="16" width="120" height="34"/><text class="title" x="660.0" y="37.0" text-anchor="middle">決済</text><line class="grid" x1="660" y1="50" x2="660" y2="336"/><path class="flow" d="M122,94 L297,94"/><text class="label" x="210.0" y="88" text-anchor="middle">1 注文が確定された</text><rect class="badge kind-2" x="74" y="86" width="40" height="16"/><text class="label small kind-2" x="94" y="98" text-anchor="middle">送信箱</text><path class="flow" d="M302,130 L477,130"/><text class="label" x="390.0" y="124" text-anchor="middle">2 在庫を引き当てる</text><rect class="badge kind-2" x="254" y="122" width="40" height="16"/><text class="label small kind-2" x="274" y="134" text-anchor="middle">送信箱</text><path class="flow" d="M478,166 L303,166"/><text class="label" x="390.0" y="160" text-anchor="middle">3 在庫が引き当てられた</text><rect class="badge kind-2" x="486" y="158" width="40" height="16"/><text class="label small kind-2" x="506" y="170" text-anchor="middle">送信箱</text><path class="flow" d="M302,202 L657,202"/><text class="label" x="480.0" y="196" text-anchor="middle">4 決済を承認する</text><rect class="badge kind-2" x="254" y="194" width="40" height="16"/><text class="label small kind-2" x="274" y="206" text-anchor="middle">送信箱</text><path class="flow warn" d="M658,238 L303,238"/><text class="note warn" x="480.0" y="232" text-anchor="middle" font-weight="700">5 決済が拒否された</text><rect class="badge kind-2" x="666" y="230" width="40" height="16"/><text class="label small kind-2" x="686" y="242" text-anchor="middle">送信箱</text><path class="flow warn" d="M302,274 L477,274"/><text class="note warn" x="390.0" y="268" text-anchor="middle" font-weight="700">6 引当を取り消す（補償）</text><rect class="badge kind-2" x="254" y="266" width="40" height="16"/><text class="label small kind-2" x="274" y="278" text-anchor="middle">送信箱</text><path class="flow warn" d="M298,310 L123,310"/><text class="note warn" x="210.0" y="304" text-anchor="middle" font-weight="700">7 注文を取り消す（補償）</text><rect class="badge kind-2" x="306" y="302" width="40" height="16"/><text class="label small kind-2" x="326" y="314" text-anchor="middle">送信箱</text><rect class="badge kind-2" x="20" y="352" width="40" height="16"/><text class="label small kind-2" x="40" y="364" text-anchor="middle">送信箱</text><text class="note" x="70" y="364" text-anchor="start">状態の更新と同じトランザクションで送信箱へ書き、中継がメッセージブローカーへ送る</text></svg>