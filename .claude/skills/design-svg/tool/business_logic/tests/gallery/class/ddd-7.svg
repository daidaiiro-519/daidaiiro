<svg viewBox="0 0 770 340" width="100%" style="max-width:770px;min-width:620px" role="img" aria-label="ポートとアダプターと、コマンド・クエリ責任分離による書き込みと読み取りの分割"><text class="label focus" x="20" y="24" text-anchor="start" font-weight="700">コマンド側（コマンド実行モデル）</text><line class="grid" x1="10" y1="228" x2="760" y2="228"/><text class="label kind-2" x="20" y="252" text-anchor="start" font-weight="700">クエリ側（読み取りモデル）</text><rect class="box" x="20" y="50" width="150" height="44"/><text class="title" x="95.0" y="67.5" text-anchor="middle">REST API</text><text class="note" x="95.0" y="84.5" text-anchor="middle">注文を確定する</text><rect class="box" x="20" y="130" width="150" height="44"/><text class="title" x="95.0" y="147.5" text-anchor="middle">メッセージ受信</text><text class="note" x="95.0" y="164.5" text-anchor="middle">決済が承認された</text><rect class="box focus" x="210" y="36" width="320" height="176"/><text class="label focus" x="370" y="58" text-anchor="middle" font-weight="700">アプリケーション（ポートを定める）</text><rect class="box" x="250" y="80" width="240" height="100"/><text class="title" x="370.0" y="117.0" text-anchor="middle">ドメインモデル</text><text class="note" x="370.0" y="134.0" text-anchor="middle">注文集約 ・ 在庫集約</text><text class="note" x="370.0" y="151.0" text-anchor="middle">データベースもフレームワークも知らない</text><rect class="box kind-2" x="204" y="62" width="12" height="20"/><rect class="box kind-2" x="524" y="62" width="12" height="20"/><rect class="box kind-2" x="204" y="142" width="12" height="20"/><rect class="box kind-2" x="524" y="142" width="12" height="20"/><rect class="box" x="570" y="50" width="170" height="44"/><text class="title" x="655.0" y="67.5" text-anchor="middle">リポジトリ</text><text class="note" x="655.0" y="84.5" text-anchor="middle">PostgreSQL（書き込み用）</text><rect class="box" x="570" y="130" width="170" height="44"/><text class="title" x="655.0" y="147.5" text-anchor="middle">送信箱の中継</text><text class="note" x="655.0" y="164.5" text-anchor="middle">メッセージブローカーへ</text><path class="flow" d="M170,72 L202,72"/><pa