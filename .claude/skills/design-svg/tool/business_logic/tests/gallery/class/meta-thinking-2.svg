<svg viewBox="0 0 300 574" width="100%" style="max-width:380px" role="img" aria-label="依頼から Why を2回たどって上位目的を見つけ、そこから手段を3つに広げた図">

<text class="label" x="10" y="18" font-weight="700">手段（依頼）</text>
<rect class="box warn" x="10" y="26" width="280" height="50"/>
<text class="title warn" x="150" y="47" text-anchor="middle">容量を増やす</text>
<text class="label" x="150" y="66" text-anchor="middle">「サーバー容量を増やしてください」</text>
<line class="flow focus" x1="60" y1="78" x2="60" y2="110"/>
<text class="title focus" x="74" y="99">Why ①　何のために？</text>
<text class="label" x="10" y="128" font-weight="700">目的</text>
<rect class="box" x="10" y="136" width="280" height="50"/>
<text class="label" x="150" y="166" text-anchor="middle">容量にいつも余裕を持たせる</text>
<line class="flow focus" x1="60" y1="188" x2="60" y2="220"/>
<text class="title focus" x="74" y="209">Why ②　何のために？</text>
<text class="label" x="10" y="238" font-weight="700">上位目的</text>
<rect class="box focus" x="10" y="246" width="280" height="56"/>
<text class="title" x="150" y="270" text-anchor="middle">運用上の不安をなくしたい</text>
<text class="label" x="150" y="290" text-anchor="middle">容量が尽きてシステムが止まる心配</text>
<line class="link" x1="30" y1="302" x2="30" y2="460"/>
<text class="label" x="42" y="326">How：目的から手段を広げる</text>
<line class="link" x1="30" y1="360" x2="50" y2="360"/>
<rect class="box warn" x="50" y="340" width="240" height="40"/>
<text class="label" x="62" y="365">容量を増やす（依頼どおり）</text>
<line class="link" x1="30" y1="410" x2="50" y2="410"/>
<rect class="box" x="50" y="390" width="240" height="40"/>
<text class="label" x="62" y="415">データの発生量を抑える</text>
<line class="link" x1="30" y1="460" x2="50" y2="460"/>
<rect class="box" x="50" y="440" width="240" height="40"/>
<text class="label" x="62" y="465">データ量を見張り、急増で知らせる</text>
<rect class="area" x="10" y="496" width="280" height="68"/>
<text class="label" x="22" y="516">「データがたまる速さが上がったから」</text>
<text class="label" x="22" y="534">は原因の Why。目的ではないので、</text>
<text class="label" x="22" y="552">目的の Why に言い換えてから進む</text>
</svg>