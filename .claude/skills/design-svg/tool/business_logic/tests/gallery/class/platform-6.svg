<svg viewBox="0 0 680 330" width="100%" style="min-width:580px;max-width:720px;display:block;margin:0 auto" role="img" aria-label="デプロイのパイプラインと、監視から事後レビューまでの流れ">

<text class="label focus" x="10" y="20" font-weight="700">デプロイのパイプライン</text>
<rect class="box" x="10" y="32" width="96" height="52"/><text class="label" x="58" y="55" font-weight="700" text-anchor="middle">コミット</text><text class="note small" x="58" y="72" text-anchor="middle">main へマージ</text>
<rect class="box" x="124" y="32" width="96" height="52"/><text class="label" x="172" y="55" font-weight="700" text-anchor="middle">ビルド</text><text class="note small" x="172" y="72" text-anchor="middle">テスト ・ 検査</text>
<rect class="box" x="238" y="32" width="96" height="52"/><text class="label" x="286" y="55" font-weight="700" text-anchor="middle">検証環境</text><text class="note small" x="286" y="72" text-anchor="middle">E2E テスト</text>
<rect class="box" x="352" y="32" width="96" height="52"/><text class="label" x="400" y="55" font-weight="700" text-anchor="middle">承認</text><text class="note small" x="400" y="72" text-anchor="middle">変更の担当者</text>
<rect class="box focus" x="466" y="32" width="96" height="52"/><text class="label focus" x="514" y="55" font-weight="700" text-anchor="middle">カナリア</text><text class="label small focus" x="514" y="72" text-anchor="middle">10% を 15分</text>
<rect class="box focus" x="580" y="32" width="90" height="52"/><text class="label focus" x="625" y="55" font-weight="700" text-anchor="middle">全台</text><text class="label small focus" x="625" y="72" text-anchor="middle">100%</text>
<line class="flow" x1="106" y1="58" x2="122" y2="58"/>
<line class="flow" x1="220" y1="58" x2="236" y2="58"/>
<line class="flow" x1="334" y1="58" x2="350" y2="58"/>
<line class="flow" x1="448" y1="58" x2="464" y2="58"/>
<line class="flow" x1="562" y1="58" x2="578" y2="58"/>
<path class="flow async warn" d="M514,84 L514,118 L300,118"/>
<text class="note warn" x="296" y="122" text-anchor="end">アラームが鳴れば前の版へ自動で戻す</text>
<line class="grid" x1="10" y1="146" x2="670" y2="146"/>
<text class="label kind-2" x="10" y="172" font-weight="700">監視と障害対応</text>
<rect class="box kind-2" x="10" y="184" width="120" height="60"/><text class="label" x="70" y="208" font-weight="700" text-anchor="middle">監視</text><text class="note small" x="70" y="226" text-anchor="middle">メトリクス ・ ログ ・</text><text class="note small" x="70" y="239" text-anchor="middle">トレース（X-Ray）</text>
<rect class="box warn" x="148" y="184" width="120" height="60"/><text class="label warn" x="208" y="208" font-weight="700" text-anchor="middle">アラーム</text><text class="label small warn" x="208" y="228" text-anchor="middle">しきい値を超えた</text>
<rect class="box kind-2" x="286" y="184" width="120" height="60"/><text class="label" x="346" y="208" font-weight="700" text-anchor="middle">当番へ通知</text><text class="note small" x="346" y="228" text-anchor="middle">電話と Slack</text>
<rect class="box kind-2" x="424" y="184" width="120" height="60"/><text class="label" x="484" y="208" font-weight="700" text-anchor="middle">ランブック</text><text class="note small" x="484" y="228" text-anchor="middle">手順どおりに戻す</text>
<rect class="box kind-2" x="562" y="184" width="108" height="60"/><text class="label" x="616" y="208" font-weight="700" text-anchor="middle">事後レビュー</text><text class="note small" x="616" y="228" text-anchor="middle">5営業日以内</text>
<line class="flow" x1="130" y1="214" x2="146" y2="214"/>
<line class="flow" x1="268" y1="214" x2="284" y2="214"/>
<line class="flow" x1="406" y1="214" x2="422" y2="214"/>
<line class="flow" x1="544" y1="214" x2="560" y2="214"/>
<path class="flow async" d="M616,244 L616,290 L70,290 L70,246"/>
<text class="note" x="343" y="310" text-anchor="middle">見つかった改善を、監視とランブックへ戻す</text>
