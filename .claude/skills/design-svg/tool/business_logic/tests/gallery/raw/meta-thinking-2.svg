<svg viewBox="0 0 300 574" width="100%" style="max-width:380px" role="img" aria-label="依頼から Why を2回たどって上位目的を見つけ、そこから手段を3つに広げた図">
<defs><marker id="mt2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
<text x="10" y="18" font-size="12" font-weight="700" fill="var(--dim)">手段（依頼）</text>
<rect x="10" y="26" width="280" height="50" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="150" y="47" font-size="13" font-weight="700" fill="var(--warn)" text-anchor="middle">容量を増やす</text>
<text x="150" y="66" font-size="12" fill="var(--ink)" text-anchor="middle">「サーバー容量を増やしてください」</text>
<line x1="60" y1="78" x2="60" y2="110" stroke="var(--accent)" stroke-width="2.4" marker-end="url(#mt2-ar)"/>
<text x="74" y="99" font-size="13" font-weight="700" fill="var(--accent)">Why ①　何のために？</text>
<text x="10" y="128" font-size="12" font-weight="700" fill="var(--dim)">目的</text>
<rect x="10" y="136" width="280" height="50" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="150" y="166" font-size="13" fill="var(--ink)" text-anchor="middle">容量にいつも余裕を持たせる</text>
<line x1="60" y1="188" x2="60" y2="220" stroke="var(--accent)" stroke-width="2.4" marker-end="url(#mt2-ar)"/>
<text x="74" y="209" font-size="13" font-weight="700" fill="var(--accent)">Why ②　何のために？</text>
<text x="10" y="238" font-size="12" font-weight="700" fill="var(--dim)">上位目的</text>
<rect x="10" y="246" width="280" height="56" rx="8" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="150" y="270" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">運用上の不安をなくしたい</text>
<text x="150" y="290" font-size="12" fill="var(--dim)" text-anchor="middle">容量が尽きてシステムが止まる心配</text>
<line x1="30" y1="302" x2="30" y2="460" stroke="var(--dim)" stroke-width="1.2"/>
<text x="42" y="326" font-size="12" fill="var(--dim)">How：目的から手段を広げる</text>
<line x1="30" y1="360" x2="50" y2="360" stroke="var(--dim)" stroke-width="1.2"/>
<rect x="50" y="340" width="240" height="40" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="62" y="365" font-size="13" fill="var(--ink)">容量を増やす（依頼どおり）</text>
<line x1="30" y1="410" x2="50" y2="410" stroke="var(--dim)" stroke-width="1.2"/>
<rect x="50" y="390" width="240" height="40" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<text x="62" y="415" font-size="13" fill="var(--ink)">データの発生量を抑える</text>
<line x1="30" y1="460" x2="50" y2="460" stroke="var(--dim)" stroke-width="1.2"/>
<rect x="50" y="440" width="240" height="40" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
<text x="62" y="465" font-size="13" fill="var(--ink)">データ量を見張り、急増で知らせる</text>
<rect x="10" y="496" width="280" height="68" rx="8" fill="none" stroke="var(--dim)" stroke-dasharray="4 3"/>
<text x="22" y="516" font-size="12" fill="var(--ink)">「データがたまる速さが上がったから」</text>
<text x="22" y="534" font-size="12" fill="var(--ink)">は原因の Why。目的ではないので、</text>
<text x="22" y="552" font-size="12" fill="var(--ink)">目的の Why に言い換えてから進む</text>
</svg>