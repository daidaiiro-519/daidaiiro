<svg viewBox="0 0 640 270" width="100%" style="min-width:560px;max-width:680px;display:block;margin:0 auto" role="img" aria-label="注文の状態遷移図：支払い待ちから配達完了まで、およびキャンセル済みへの遷移">
<defs><marker id="qa2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<circle cx="22" cy="60" r="8" fill="var(--ink)"/>
<line x1="30" y1="60" x2="64" y2="60" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/>
<text x="22" y="34" font-size="11" fill="var(--dim)">注文を確定</text>
<rect x="66" y="38" width="110" height="44" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="121" y="65" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">支払い待ち</text>
<rect x="222" y="38" width="110" height="44" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="277" y="65" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">支払い済み</text>
<rect x="378" y="38" width="110" height="44" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="433" y="65" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">発送済み</text>
<rect x="534" y="38" width="96" height="44" rx="10" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.5"/><text x="582" y="65" font-size="13" font-weight="700" fill="var(--accent)" text-anchor="middle">配達完了</text>
<line x1="176" y1="60" x2="220" y2="60" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/><text x="199" y="30" font-size="11" fill="var(--dim)" text-anchor="middle">決済が</text><text x="199" y="44" font-size="11" fill="var(--dim)" text-anchor="middle">成功</text>
<line x1="332" y1="60" x2="376" y2="60" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/><text x="355" y="30" font-size="11" fill="var(--dim)" text-anchor="middle">出荷</text>
<line x1="488" y1="60" x2="532" y2="60" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/><text x="511" y="30" font-size="11" fill="var(--dim)" text-anchor="middle">受け取り</text>
<rect x="150" y="210" width="140" height="44" rx="10" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/><text x="220" y="237" font-size="13" font-weight="700" fill="var(--warn)" text-anchor="middle">キャンセル済み</text>
<path d="M100,82 L100,232 L148,232" fill="none" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/>
<text x="92" y="160" font-size="11" fill="var(--dim)" text-anchor="end">キャンセル</text>
<path d="M142,82 L190,208" fill="none" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/>
<text x="166" y="120" font-size="11" fill="var(--dim)">支払い期限</text><text x="166" y="136" font-size="11" fill="var(--dim)">（48時間）切れ</text>
<path d="M300,82 L262,208" fill="none" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#qa2-ar)"/>
<text x="296" y="150" font-size="11" fill="var(--dim)">キャンセル（返金する）</text>
<line x1="433" y1="82" x2="433" y2="180" stroke="var(--warn)" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="443" y="150" font-size="11" fill="var(--warn)">キャンセル → 拒否する</text><text x="443" y="166" font-size="11" fill="var(--warn)">（無効な遷移）</text>
</svg>