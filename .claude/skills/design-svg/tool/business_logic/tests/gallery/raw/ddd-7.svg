<svg viewBox="0 0 770 340" width="100%" style="max-width:770px;min-width:620px" role="img" aria-label="ポートとアダプターと、コマンド・クエリ責任分離による書き込みと読み取りの分割"><defs><marker id="dd7-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker><marker id="dd7-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="dd7-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker><marker id="dd7-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sel)"/></marker></defs><text x="20" y="24" font-size="12" fill="var(--accent)" text-anchor="start" font-weight="700">コマンド側（コマンド実行モデル）</text><line x1="10" y1="228" x2="760" y2="228" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="20" y="252" font-size="12" fill="var(--sel)" text-anchor="start" font-weight="700">クエリ側（読み取りモデル）</text><rect x="20" y="50" width="150" height="44" rx="8" fill="var(--panel)" stroke="var(--dim)" stroke-width="1.5"/><text x="95.0" y="67.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">REST API</text><text x="95.0" y="84.5" font-size="11" fill="var(--dim)" text-anchor="middle">注文を確定する</text><rect x="20" y="130" width="150" height="44" rx="8" fill="var(--panel)" stroke="var(--dim)" stroke-width="1.5"/><text x="95.0" y="147.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">メッセージ受信</text><text x="95.0" y="164.5" font-size="11" fill="var(--dim)" text-anchor="middle">決済が承認された</text><rect x="210" y="36" width="320" height="176" rx="12" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.5"/><text x="370" y="58" font-size="12" fill="var(--accent)" text-anchor="middle" font-weight="700">アプリケーション（ポートを定める）</text><rect x="250" y="80" width="240" height="100" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="370.0" y="117.0" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">ドメインモデル</text><text x="370.0" y="134.0" font-size="11" fill="var(--dim)" text-anchor="middle">注文集約 ・ 在庫集約</text><text x="370.0" y="151.0" font-size="11" fill="var(--dim)" text-anchor="middle">データベースもフレームワークも知らない</text><rect x="204" y="62" width="12" height="20" rx="2" fill="var(--sel)" stroke="var(--sel)" stroke-width="1.5"/><rect x="524" y="62" width="12" height="20" rx="2" fill="var(--sel)" stroke="var(--sel)" stroke-width="1.5"/><rect x="204" y="142" width="12" height="20" rx="2" fill="var(--sel)" stroke="var(--sel)" stroke-width="1.5"/><rect x="524" y="142" width="12" height="20" rx="2" fill="var(--sel)" stroke="var(--sel)" stroke-width="1.5"/><rect x="570" y="50" width="170" height="44" rx="8" fill="var(--panel)" stroke="var(--dim)" stroke-width="1.5"/><text x="655.0" y="67.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">リポジトリ</text><text x="655.0" y="84.5" font-size="11" fill="var(--dim)" text-anchor="middle">PostgreSQL（書き込み用）</text><rect x="570" y="130" width="170" height="44" rx="8" fill="var(--panel)" stroke="var(--dim)" stroke-width="1.5"/><text x="655.0" y="147.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">送信箱の中継</text><text x="655.0" y="164.5" font-size="11" fill="var(--dim)" text-anchor="middle">メッセージブローカーへ</text><path d="M170,72 L202,72" fill="none" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#dd7-d)"/><path d="M170,152 L202,152" fill="none" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#dd7-d)"/><path d="M536,72 L568,72" fill="none" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#dd7-d)"/><path d="M536,152 L568,152" fill="none" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#dd7-d)"/><rect x="20" y="262" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--dim)" stroke-width="1.5"/><text x="95.0" y="282.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">クエリAPI</text><text x="95.0" y="299.5" font-size="11" fill="var(--dim)" text-anchor="middle">注文一覧を返す</text><rect x="390" y="262" width="170" height="50" rx="8" fill="var(--sel-bg)" stroke="var(--sel)" stroke-width="1.5"/><text x="475.0" y="282.5" font-size="13" fill="var(--ink)" text-anchor="middle" font-weight="700">読み取りモデル</text><text x="475.0" y="299.5" font-size="11" fill="var(--dim)" text-anchor="middle">注文一覧ビュー</text><path d="M655,174 L655,287 L562,287" fill="none" stroke="var(--sel)" stroke-width="1.4" marker-end="url(#dd7-s)"/><text x="664" y="252" font-size="11" fill="var(--sel)" text-anchor="start">イベントから投影</text><path d="M170,287 L388,287" fill="none" stroke="var(--dim)" stroke-width="1.4" marker-end="url(#dd7-d)"/><text x="280" y="278" font-size="11" fill="var(--dim)" text-anchor="middle">読むだけ（集約を通らない）</text><rect x="560" y="196" width="12" height="16" rx="2" fill="var(--sel)" stroke="var(--sel)" stroke-width="1.5"/><text x="578" y="209" font-size="11" fill="var(--dim)" text-anchor="start">= ポート</text></svg>