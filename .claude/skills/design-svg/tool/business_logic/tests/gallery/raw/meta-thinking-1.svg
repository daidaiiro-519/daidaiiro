<svg viewBox="0 0 400 372" width="100%" style="max-width:520px" role="img" aria-label="依頼を魚 ・ 釣り方 ・ 川の構造の3つの層に置いた図">
<defs><marker id="mt1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="22" y="20" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">抽象</text>
<line x1="22" y1="30" x2="22" y2="342" stroke="var(--dim)" stroke-width="1.5" marker-start="url(#mt1-ar)" marker-end="url(#mt1-ar)"/>
<text x="22" y="362" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">具体</text>
<rect x="48" y="10" width="342" height="96" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
<rect x="60" y="20" width="72" height="20" rx="10" fill="var(--accent)"/>
<text x="96" y="34" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">川の構造</text>
<text x="142" y="34" font-size="11" fill="var(--dim)">打ち手を成り立たせる仕組み</text>
<text x="60" y="66" font-size="12" fill="var(--ink)">データは、業務の量に応じてたまっていく。</text>
<text x="60" y="88" font-size="12" fill="var(--ink)">余裕は「容量」と「データの量」の差で決まる</text>
<line x1="219" y1="108" x2="219" y2="132" stroke="var(--dim)" stroke-width="1.3" marker-start="url(#mt1-ar)" marker-end="url(#mt1-ar)"/>
<rect x="48" y="134" width="342" height="96" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
<rect x="60" y="144" width="72" height="20" rx="10" fill="var(--accent-bg)" stroke="var(--accent)"/>
<text x="96" y="158" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="middle">釣り方</text>
<text x="142" y="158" font-size="11" fill="var(--dim)">打ち手をまとめた方法</text>
<text x="60" y="190" font-size="12" fill="var(--ink)">容量に余裕を持たせる3つの方法：</text>
<text x="60" y="212" font-size="12" fill="var(--ink)">容量を増やす ・ データを減らす ・ 増え方を見張る</text>
<line x1="219" y1="232" x2="219" y2="256" stroke="var(--dim)" stroke-width="1.3" marker-start="url(#mt1-ar)" marker-end="url(#mt1-ar)"/>
<rect x="48" y="258" width="342" height="96" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/>
<rect x="60" y="268" width="72" height="20" rx="10" fill="var(--panel)" stroke="var(--warn)"/>
<text x="96" y="282" font-size="11" font-weight="700" fill="var(--warn)" text-anchor="middle">魚</text>
<text x="142" y="282" font-size="11" fill="var(--dim)">すぐ使える打ち手</text>
<text x="378" y="282" font-size="11" font-weight="700" fill="var(--warn)" text-anchor="end">依頼はこの層</text>
<text x="60" y="314" font-size="12" fill="var(--ink)">依頼どおり、サーバーにディスクを足す</text>
<text x="60" y="336" font-size="11" fill="var(--dim)">すぐ効くが、データが増えれば、また足りなくなる</text>
</svg>