<svg viewBox="0 0 320 330" width="100%" style="max-width:380px" role="img" aria-label="AWS Organizations の4つのアカウントと、人と CI が入る経路">
<defs><marker id="pf5-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<rect x="10" y="10" width="300" height="200" rx="10" fill="none" stroke="var(--dim)" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="22" y="30" font-size="11" font-weight="700" fill="var(--dim)">AWS Organizations（SCP で制限）</text>
<rect x="22" y="42" width="134" height="48" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="89" y="63" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">管理</text><text x="89" y="80" font-size="11" fill="var(--dim)" text-anchor="middle">請求と SCP だけ</text>
<rect x="164" y="42" width="134" height="48" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="231" y="63" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">ログ保管</text><text x="231" y="80" font-size="11" fill="var(--dim)" text-anchor="middle">CloudTrail を集める</text>
<rect x="22" y="100" width="134" height="48" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="89" y="121" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">検証</text><text x="89" y="138" font-size="11" fill="var(--dim)" text-anchor="middle">開発者は変更可</text>
<rect x="164" y="100" width="134" height="48" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/><text x="231" y="121" font-size="12" font-weight="700" fill="var(--warn)" text-anchor="middle">本番</text><text x="231" y="138" font-size="11" fill="var(--warn)" text-anchor="middle">人は読み取りだけ</text>
<text x="22" y="176" font-size="11" fill="var(--dim)">本番を変えるのは CI だけ</text>
<text x="22" y="194" font-size="11" fill="var(--dim)">ログは本番から消せない</text>
<rect x="10" y="246" width="140" height="48" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="80" y="267" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">運用担当</text><text x="80" y="284" font-size="11" fill="var(--dim)" text-anchor="middle">Identity Center ＋ MFA</text>
<rect x="170" y="246" width="140" height="48" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="240" y="267" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">CI（GitHub）</text><text x="240" y="284" font-size="11" fill="var(--dim)" text-anchor="middle">OIDC で一時認証</text>
<path d="M80,246 L80,228 L200,228 L200,150" fill="none" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf5-ar)"/>
<line x1="240" y1="246" x2="240" y2="150" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#pf5-ar)"/>
<text x="80" y="316" font-size="11" fill="var(--dim)" text-anchor="middle">読み取りのロール</text>
<text x="240" y="316" font-size="11" fill="var(--accent)" text-anchor="middle">デプロイのロール</text>
</svg>