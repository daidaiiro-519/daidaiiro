<svg viewBox="0 0 300 360" width="100%" role="img" aria-label="申し込みの入力画面のワイヤーフレーム">
<rect x="1" y="1" width="298" height="358" rx="10" fill="var(--wf-fill)" stroke="var(--wf)"/>
<text x="16" y="30" font-size="13" font-weight="700" fill="var(--ink)">参加の申し込み</text>
<text x="16" y="50" font-size="10" fill="var(--dim)">手順 2 / 3　入力する</text>
<rect x="16" y="62" width="268" height="40" rx="6" fill="none" stroke="var(--wf)" stroke-dasharray="3 3"/>
<text x="26" y="80" font-size="10" fill="var(--ink)">選んだ回：10月20日（月）18:00</text>
<text x="26" y="94" font-size="10" fill="var(--dim)">残り 4 席　［回を変える］</text>
<text x="16" y="124" font-size="11" fill="var(--ink)">名前（必須）</text>
<rect x="16" y="130" width="268" height="32" rx="5" fill="var(--panel)" stroke="var(--wf)"/>
<text x="16" y="182" font-size="11" fill="var(--ink)">所属（必須）</text>
<rect x="16" y="188" width="268" height="32" rx="5" fill="var(--panel)" stroke="var(--wf)"/>
<text x="16" y="240" font-size="10" fill="var(--warn)">！ 所属を入れてください（例：開発部）</text>
<rect x="16" y="262" width="268" height="44" rx="6" fill="var(--accent)"/>
<text x="150" y="289" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">内容を確かめる</text>
<text x="150" y="332" font-size="10" fill="var(--dim)" text-anchor="middle">［一覧に戻る］</text>
</svg>