<svg viewBox="0 0 640 300" width="100%" style="min-width:560px;max-width:700px;display:block;margin:0 auto" role="img" aria-label="障害の範囲ごとの復旧の方法と RTO ・ RPO">
<defs><marker id="pf4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>
<text x="80" y="20" font-size="11" font-weight="700" fill="var(--dim)" text-anchor="middle">障害の範囲</text>
<text x="300" y="20" font-size="11" font-weight="700" fill="var(--dim)" text-anchor="middle">復旧の方法</text>
<text x="555" y="20" font-size="11" font-weight="700" fill="var(--dim)" text-anchor="middle">目標</text>
<rect x="10" y="34" width="140" height="64" rx="8" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="1.5"/><text x="80" y="62" font-size="13" font-weight="700" fill="var(--accent)" text-anchor="middle">インスタンス</text><text x="80" y="80" font-size="10" fill="var(--accent)" text-anchor="middle">1台が止まる</text>
<line x1="150" y1="66" x2="186" y2="66" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="188" y="34" width="290" height="64" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="200" y="58" font-size="12" fill="var(--ink)">ALB のヘルスチェックが外し、</text><text x="200" y="78" font-size="12" fill="var(--ink)">Auto Scaling が新しい1台を起動する</text>
<line x1="478" y1="66" x2="494" y2="66" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="496" y="34" width="134" height="64" rx="8" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/><text x="510" y="60" font-size="12" font-weight="700" fill="var(--ink)">RTO 1分</text><text x="510" y="80" font-size="12" font-weight="700" fill="var(--ink)">RPO 0</text>
<rect x="10" y="122" width="140" height="64" rx="8" fill="var(--sel-bg)" stroke="var(--sel)" stroke-width="1.5"/><text x="80" y="150" font-size="13" font-weight="700" fill="var(--sel)" text-anchor="middle">AZ</text><text x="80" y="168" font-size="10" fill="var(--sel)" text-anchor="middle">1つの AZ が止まる</text>
<line x1="150" y1="154" x2="186" y2="154" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="188" y="122" width="290" height="64" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="200" y="146" font-size="12" fill="var(--ink)">RDS がスタンバイへフェイルオーバーし、</text><text x="200" y="166" font-size="12" fill="var(--ink)">残りの AZ でアプリ層を4台に増やす</text>
<line x1="478" y1="154" x2="494" y2="154" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="496" y="122" width="134" height="64" rx="8" fill="var(--panel)" stroke="var(--sel)" stroke-width="1.5"/><text x="510" y="148" font-size="12" font-weight="700" fill="var(--ink)">RTO 5分</text><text x="510" y="168" font-size="12" font-weight="700" fill="var(--ink)">RPO 0</text>
<rect x="10" y="210" width="140" height="64" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/><text x="80" y="238" font-size="13" font-weight="700" fill="var(--warn)" text-anchor="middle">リージョン</text><text x="80" y="256" font-size="10" fill="var(--warn)" text-anchor="middle">東京全体が止まる</text>
<line x1="150" y1="242" x2="186" y2="242" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="188" y="210" width="290" height="64" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="200" y="234" font-size="12" fill="var(--ink)">大阪リージョンでパイロットライトを起こし、</text><text x="200" y="254" font-size="12" fill="var(--ink)">DNS を切り替える（手順書で人が判断）</text>
<line x1="478" y1="242" x2="494" y2="242" stroke="var(--dim)" stroke-width="1.3" marker-end="url(#pf4-ar)"/>
<rect x="496" y="210" width="134" height="64" rx="8" fill="var(--panel)" stroke="var(--warn)" stroke-width="1.5"/><text x="510" y="236" font-size="12" font-weight="700" fill="var(--ink)">RTO 6時間</text><text x="510" y="256" font-size="12" font-weight="700" fill="var(--ink)">RPO 15分</text>
</svg>