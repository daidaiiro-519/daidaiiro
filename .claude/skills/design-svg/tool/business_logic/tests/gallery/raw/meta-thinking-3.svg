<rect x="28" y="198" width="292" height="194" rx="8" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<rect x="40" y="210" width="64" height="20" rx="10" fill="var(--accent)"/>
<text x="72" y="224" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">問題発見</text>
<text x="112" y="225" font-size="12" fill="var(--ink)">増えたことに、いつ気付くか</text>
<rect x="40" y="242" width="64" height="20" rx="10" fill="var(--accent-bg)" stroke="var(--accent)"/>
<text x="72" y="256" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="middle">問題解決</text>
<text x="112" y="257" font-size="12" fill="var(--ink)">データ量を見張る仕組み</text>
<rect x="48" y="272" width="260" height="102" rx="8" fill="none" stroke="var(--dim)" stroke-dasharray="4 3"/>
<rect x="60" y="284" width="64" height="20" rx="10" fill="var(--accent)"/>
<text x="92" y="298" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">問題発見</text>
<text x="132" y="299" font-size="12" fill="var(--ink)">誰に知らせれば動けるか</text>
<rect x="60" y="316" width="64" height="20" rx="10" fill="var(--accent-bg)" stroke="var(--accent)"/>
<text x="92" y="330" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="middle">問題解決</text>
<text x="132" y="331" font-size="12" fill="var(--ink)">運用当番へアラート</text>
<text x="60" y="362" font-size="10" fill="var(--dim)">この中にも、さらに小さな組がある</text>
<text x="300" y="366" font-size="10" fill="var(--dim)" text-anchor="end">3段目</text>
<text x="312" y="386" font-size="10" fill="var(--dim)" text-anchor="end">2段目</text>
<text x="324" y="406" font-size="10" fill="var(--dim)" text-anchor="end">1段目</text>
