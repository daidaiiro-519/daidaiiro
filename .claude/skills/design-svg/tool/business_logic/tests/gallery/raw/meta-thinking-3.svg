<rect x="28" y="110" width="292" height="80" rx="8" fill="none" stroke="var(--line)" stroke-width="1.5"/>
<rect x="40" y="122" width="64" height="20" rx="10" fill="var(--accent)"/>
<text x="72" y="136" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">問題発見</text>
<text x="112" y="137" font-size="12" fill="var(--ink)">どのデータが増えているか</text>
<rect x="40" y="154" width="64" height="20" rx="10" fill="var(--accent-bg)" stroke="var(--accent)"/>
<text x="72" y="168" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="middle">問題解決</text>
<text x="112" y="169" font-size="12" fill="var(--ink)">古いログを圧縮して消す</text>
