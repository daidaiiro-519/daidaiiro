<svg viewBox="0 0 340 420" width="100%" style="max-width:460px" role="img" aria-label="問題発見と問題解決の組が入れ子になった図">
<rect x="8" y="8" width="324" height="404" rx="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="1.5"/>
<rect x="20" y="22" width="64" height="20" rx="10" fill="var(--accent)"/>
<text x="52" y="36" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">問題発見</text>
<text x="92" y="37" font-size="12" fill="var(--ink)">容量が尽きて止まる不安</text>
