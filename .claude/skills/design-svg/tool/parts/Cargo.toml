[package]
name = "ds_parts"
description = "部品。入口と宣言を参照しない"
version.workspace = true
edition.workspace = true
license.workspace = true

# **外側の層を1件も宣言しない。** 参照した時点でコンパイルが通らない
[dependencies]
regex = "1"
serde = "1"
# **小数は最後の桁まで正しく読む** ── 既定の読み方は速さのために最後の桁を丸め、同じ宣言から
# 別の座標が出る（実測 ── -90.14016796516245 を …43 と読んだ）
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
