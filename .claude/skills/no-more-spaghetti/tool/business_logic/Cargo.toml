[package]
name = "nms_business_logic"
description = "業務ロジック層。入出力を持たず、データアクセス層だけを参照する"
version.workspace = true
edition.workspace = true
license.workspace = true

# **同じ workspace の crate は、データアクセス層だけを参照する。** 上の層を参照した時点でコンパイルが通らない
[dependencies]
nms_data_access = { path = "../data_access" }
jsonschema = { version = "0.34", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1"
tree-sitter-php = "0.23"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
