<svg class="wf-fig" viewBox="0 0 1168 236" width="1168" height="236" role="img"><g transform="translate(6.0,6.0)"><path d="M510.5,32.6 L202.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="202.0,95.4 208.1,91.6 209.1,96.5" fill="#C3CAD2"/><rect x="307.2" y="54.0" width="98.0" height="16.0" fill="#F5F7F9"/><text x="356.2" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">宣言のとおりでない</text><path d="M510.5,32.6 L818.5,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="818.5,95.4 811.4,96.5 812.3,91.6" fill="#C3CAD2"/><rect x="620.5" y="54.0" width="88.0" height="16.0" fill="#F5F7F9"/><text x="664.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">宣言が誤っている</text><path d="M202.0,128.6 L86.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="86.0,191.4 90.8,186.0 93.1,190.3" fill="#C3CAD2"/><rect x="120.0" y="150.0" width="48.0" height="16.0" fill="#F5F7F9"/><text x="144.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">成立する</text><path d="M202.0,128.6 L318.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="318.0,191.4 310.9,190.3 313.2,186.0" fill="#C3CAD2"/><rect x="196.0" y="150.0" width="128.0" height="16.0" fill="#F5F7F9"/><text x="260.0" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">補った読みに依存している</text><path d="M818.5,128.6 L640.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="640.0,191.4 645.6,186.8 647.2,191.5" fill="#C3CAD2"/><rect x="700.2" y="150.0" width="58.0" height="16.0" fill="#F5F7F9"/><text x="729.2" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">指している</text><path d="M818.5,128.6 L998.0,191.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="998.0,191.4 990.8,191.5 992.4,186.8" fill="#C3CAD2"/><rect x="874.2" y="150.0" width="68.0" height="16.0" fill="#F5F7F9"/><text x="908.2" y="163.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">指していない</text><g class="wf-node" transform="translate(322.5,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="376.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="188.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">その主張は「宣言のとおりでない」か「宣言が誤っている」か？</text></g></g><g class="wf-node" transform="translate(74.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">宣言の文言をそのまま読んで成立するか？</text></g></g><g class="wf-node" transform="translate(648.1,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="341.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="170.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">どの knowledge のどの原則によるかを指しているか？</text></g></g><g class="wf-node" transform="translate(0.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="172.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="86.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">適合の主張として受け取る</text></g></g><g class="wf-node" transform="translate(196.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="244.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="122.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">成立しない。ただし他の指摘は別に扱う</text></g></g><g class="wf-node" transform="translate(464.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="352.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="176.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">宣言を直す議論へ移す（実装を宣言から外す道は開かない）</text></g></g><g class="wf-node" transform="translate(840.0,192.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="316.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="158.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">根拠を確認する。指せないなら個人の見解として扱う</text></g></g></g></svg>