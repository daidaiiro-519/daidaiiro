<svg class="wf-fig" viewBox="0 0 560 140" width="560" height="140" role="img"><g transform="translate(6.0,6.0)"><path d="M295.0,32.6 L152.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="152.0,95.4 157.2,90.4 159.2,94.9" fill="#C3CAD2"/><rect x="209.5" y="54.0" width="28.0" height="16.0" fill="#F5F7F9"/><text x="223.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">はい</text><path d="M295.0,32.6 L438.0,95.4" fill="none" stroke="#C3CAD2" stroke-width="1.2"/><polygon points="438.0,95.4 430.8,94.9 432.8,90.4" fill="#C3CAD2"/><rect x="307.5" y="54.0" width="118.0" height="16.0" fill="#F5F7F9"/><text x="366.5" y="67.6" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10.0" fill="#79828F">いいえ（独立性が高い）</text><g class="wf-node" transform="translate(113.0,0.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="364.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="182.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">対象の集約は、同じ業務領域の他の集約と強く関係しているか</text></g></g><g class="wf-node" transform="translate(0.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="304.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="152.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">単独にすると浅くなる。業務領域の単位で設計する</text></g></g><g class="wf-node" transform="translate(328.0,96.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="220.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">集約を単位にすることも検討できる</text></g></g></g></svg>