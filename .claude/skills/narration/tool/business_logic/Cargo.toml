[package]
name = "nar_business_logic"
description = "業務ロジック層。入出力を持たず、データアクセス層だけを参照する"
version.workspace = true
edition.workspace = true
license.workspace = true

# **同じ workspace の crate は、データアクセス層だけを参照する。** 上の層を参照した時点でコンパイルが通らない
[dependencies]
nar_data_access = { path = "../data_access" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
