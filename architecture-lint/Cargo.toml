[package]
name = "architecture-lint"
version = "0.1.0"
edition = "2021"
description = "許していない依存の辺を、規則（component と allow）で検出して止める CLI"
license = "Apache-2.0"

[[bin]]
name = "architecture-lint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
