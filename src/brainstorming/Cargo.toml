# ヘキサゴナル。core（domain ・ application ・ 出ていく側の port）は外の技術に依存しない。
# adapters が core の application を呼び、core の port を実装し、起動時に両方を結ぶ。
# xtask は製品に入らないツールの crate で、brainstorming の Skill のフォルダを作る。
# brainstorming の版は [workspace.package] の version の1か所で決める。依存の版は Cargo.lock の1か所で決める。
[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
