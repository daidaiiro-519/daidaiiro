# core（domain と application）はファイル ・ 通信 ・ 別のプロセス ・ 時刻に直接触らない。入出力は ports の trait を通す
disallowed-methods = [
  "std::fs::read", "std::fs::read_to_string", "std::fs::read_dir", "std::fs::write",
  "std::fs::copy", "std::fs::rename", "std::fs::remove_file", "std::fs::remove_dir_all",
  "std::fs::create_dir", "std::fs::create_dir_all", "std::fs::metadata",
  "std::fs::File::open", "std::fs::File::create", "std::fs::OpenOptions::open",
  "std::net::TcpStream::connect", "std::net::TcpListener::bind", "std::net::UdpSocket::bind",
  "std::process::Command::new", "std::process::exit",
  "std::time::SystemTime::now",
]
disallowed-types = [
  "std::fs::File", "std::fs::OpenOptions",
  "std::net::TcpStream", "std::net::TcpListener", "std::net::UdpSocket",
  "std::process::Command", "std::process::Child",
  "std::time::SystemTime",
]
