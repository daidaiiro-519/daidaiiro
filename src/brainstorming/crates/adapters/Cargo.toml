[package]
name = "brainstorming-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# adapters から core への一方向だけを持つ。外のプログラム（基盤のエンジン ・ git ・ AI の CLI）はここからだけ起動する。
[dependencies]
brainstorming-core = { path = "../core" }
serde_json.workspace = true
getrandom = "0.3.4"

[[bin]]
name = "brainstorming"
path = "src/bin/brainstorming.rs"
