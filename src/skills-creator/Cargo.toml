# skills-creator の実行ファイル。配る Skill の中身には入らず、配布物を作る段でビルドして scripts/ に入れる。
[package]
name = "skills-creator"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "skills-creator"
path = "src/main.rs"

[dependencies]
serde_json = "1"
yaml-rust2 = "0.13"
regex = "1"
sha2 = "0.10"
