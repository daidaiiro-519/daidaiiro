[package]
name = "skills-creator-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# adapters から core への一方向だけを持つ。外のプログラム（基盤のエンジン ・ gh ・ tar ・ 入口）はここからだけ起動する。
[dependencies]
skills-creator-core = { path = "../core" }
serde_json.workspace = true

[[bin]]
name = "skills-creator"
path = "src/bin/skills-creator.rs"
