[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# 製品に入らないツールの crate。基盤の Skill のフォルダを作り（skill）、展開した場所で確かめる（verify）。
# 製品の crate（core と adapters）は、この crate に依存しない。
[dependencies]
serde_json.workspace = true
sha2 = "0.11.0"
jsonschema = { version = "0.58.5", default-features = false }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1.53.2", features = ["rt", "process"] }
