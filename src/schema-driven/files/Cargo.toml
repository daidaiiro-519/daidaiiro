[package]
name = "schema-driven-files"
version.workspace = true
edition.workspace = true
license.workspace = true

# 基盤のスキーマ（schemas/）と部品のカタログ（catalog/）を、ビルドのときに実行ファイルへ取り込む。
# どのファイルを取り込むかは build.rs がフォルダから決めるので、コードにファイルの場所を書かない。
[build-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
