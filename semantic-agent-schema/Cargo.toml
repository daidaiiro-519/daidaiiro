# 事業領域 Semantic Agent Schema のワークスペース（virtual manifest）。
# 区切られた文脈は schemas-and-instances/（文脈「スキーマとインスタンス」）。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "schemas-and-instances/adapters/inbound/cli",
    "schemas-and-instances/test-support",
    "schemas-and-instances/conformance/domain",
    "schemas-and-instances/conformance/application",
    "schemas-and-instances/operation-recording/application",
    "schemas-and-instances/adapters/outbound/files",
    "schemas-and-instances/adapters/outbound/jsonschema",
    "schemas-and-instances/adapters/outbound/sqlite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.58.6", default-features = false }
sha2 = "=0.10.9"
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
