[workspace]
members = ["crates/domain/*", "crates/application", "crates/outbound/*", "crates/inbound/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
