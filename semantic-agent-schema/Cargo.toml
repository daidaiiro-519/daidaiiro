# 事業領域 Semantic Agent Schema のワークスペース（virtual manifest）。
# 区切られた文脈は contracts-and-instances/（文脈「契約とインスタンス」）。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "contracts-and-instances/adapters/inbound/cli",
    "contracts-and-instances/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
jsonschema = { version = "=0.58.6", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
