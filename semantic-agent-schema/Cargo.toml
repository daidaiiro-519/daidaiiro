# 製品 Semantic Agent Schema のワークスペース（virtual manifest）。
# 区切られた文脈は schemas-and-instances/（文脈「スキーマとインスタンス」）の1つ。中は業務領域を作るモジュール（writing ・ validation ・ recording ・ rendering ・ search）と adapters。
# crate は、ユースケースを作る中で要ると分かった時点で members に足す。
[workspace]
members = [
    "schemas-and-instances/writing/domain",
    "schemas-and-instances/writing/application",
    "schemas-and-instances/validation/domain",
    "schemas-and-instances/validation/application",
    "schemas-and-instances/recording/application",
    "schemas-and-instances/rendering/domain",
    "schemas-and-instances/rendering/application",
    "schemas-and-instances/search/application",
    "schemas-and-instances/adapters/inbound/cli",
    "schemas-and-instances/adapters/outbound/filesystem",
    "schemas-and-instances/adapters/outbound/jsonschema",
    "schemas-and-instances/adapters/outbound/sqlite",
    "schemas-and-instances/adapters/outbound/git",
    "schemas-and-instances/adapters/outbound/templates",
    "schemas-and-instances/adapters/outbound/javascript",
    "schemas-and-instances/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "=0.58.6", default-features = false }
sha2 = "=0.10.9"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
boa_parser = { version = "=0.22.0" }
boa_ast = { version = "=0.22.0" }
boa_interner = { version = "=0.22.0" }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "deny"
