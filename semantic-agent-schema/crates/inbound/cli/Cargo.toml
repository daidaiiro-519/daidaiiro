description = "入口。lib ＋ 実行ファイル2つ（CLI ・ MCP）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
semantic-agent-schema-application = { path = "../../application" }
semantic-agent-schema-agents-contract = { path = "../../outbound/agents-contract" }
semantic-agent-schema-ai-cli = { path = "../../outbound/ai-cli" }
semantic-agent-schema-git = { path = "../../outbound/git" }
semantic-agent-schema-fs = { path = "../../outbound/fs" }
semantic-agent-schema-tools = { path = "../../outbound/tools" }
semantic-agent-schema-sqlite = { path = "../../outbound/sqlite" }

[[bin]]
name = "semantic-agent-schema"
path = "src/main.rs"

[[bin]]
name = "semantic-agent-schema-mcp"
path = "src/bin/mcp.rs"

[[test]]
name = "system"
path = "tests/system/main.rs"
harness = false
