<svg viewBox="0 0 420 372" role="img" aria-label="受け持つ所と外。外の AI は入力と JSON を作り、どの対象とどの範囲かを考え、意味を判定する。外の人は承認し、人だけが決める欄を決める。Semantic Agent Schema は入力を契約で確かめ、決まった手順で処理し、足りなければ断る。中で引くのは、入力から決定論的に導けるものだけ">
<text class="title" x="10" y="22">受け持つ所と、外</text>
<rect class="box" x="10" y="34" width="250" height="84"/>
<text class="title" x="22" y="54">AI のセッション（外）</text>
<text class="label small" x="22" y="74">入力と JSON を作る</text>
<text class="label small" x="22" y="90">どの対象 ・ スキーマ ・ 範囲かを考える</text>
<text class="label small" x="22" y="106">意味を判定する</text>
<rect class="box" x="270" y="34" width="140" height="84"/>
<text class="title" x="282" y="54">人（外）</text>
<text class="label small" x="282" y="74">承認する</text>
<text class="label small" x="282" y="90">人だけが決める欄を</text>
<text class="label small" x="282" y="106">決める</text>
<path class="flow" d="M60,118 V156" fill="none"/>
<text class="note small" x="66" y="142">契約に従う入力</text>
<path class="flow" d="M170,156 V120" fill="none"/>
<text class="note small" x="176" y="142">結果 ・ 手順 ・ 断る理由</text>
<path class="flow" d="M380,118 V156" fill="none"/>
<text class="note small" x="374" y="142" text-anchor="end">人の欄の値</text>
<rect class="boundary" x="4" y="158" width="412" height="206"/>
<text class="title" x="16" y="180">Semantic Agent Schema</text>
<text class="label small" x="16" y="202">①　入力の形と値の正しさを、契約で確かめる</text>
<text class="label small" x="16" y="222">②　決まった手順で処理する（同じ入力なら同じ結果）</text>
<text class="label small" x="16" y="242">③　足りなければ、理由を付けて断る</text>
<rect class="box focus" x="16" y="256" width="388" height="96"/>
<text class="label small focus" x="28" y="276">中で引いてよいのは、入力から決定論的に導けるものだけ</text>
<text class="label small" x="28" y="298">自分の操作の記録</text>
<text class="label small" x="28" y="318">版の管理（Git）の事実</text>
<text class="label small" x="28" y="338">渡された置き場所の中の名前</text>
</svg>
