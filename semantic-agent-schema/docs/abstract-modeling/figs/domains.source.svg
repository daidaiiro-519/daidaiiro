<svg viewBox="0 0 420 352" role="img" aria-label="業務領域と区分。事業領域は、AI が扱う構造化データをスキーマに従って書き、確かめること。中核は書いて確かめる。補完は記録 ・ 描く ・ 探す。一般は版の管理 ・ JSON Schema の検証 ・ テンプレートの処理で、作らずに使う">
<text class="title" x="10" y="22">業務領域と区分</text>
<rect class="area" x="10" y="34" width="400" height="290"/>
<text class="note small" x="22" y="52">事業領域：AI が扱う構造化データを、スキーマに従って書き、確かめる</text>
<rect class="box focus" x="22" y="64" width="376" height="66"/>
<rect class="badge kind-1" x="34" y="76" width="40" height="16"/>
<text class="label small kind-1" x="54" y="88" text-anchor="middle">中核</text>
<text class="title focus" x="84" y="89">書いて確かめる</text>
<text class="note small" x="34" y="118">作る ・ 直す ・ 消す ・ 確かめる ・ 意味の判定</text>
<rect class="box" x="22" y="144" width="120" height="76"/>
<rect class="badge kind-2" x="34" y="154" width="40" height="16"/>
<text class="label small kind-2" x="54" y="166" text-anchor="middle">補完</text>
<text class="label" x="34" y="190">記録</text>
<text class="note small" x="34" y="208">追記して読むだけ</text>
<rect class="box" x="150" y="144" width="120" height="76"/>
<rect class="badge kind-2" x="162" y="154" width="40" height="16"/>
<text class="label small kind-2" x="182" y="166" text-anchor="middle">補完</text>
<text class="label" x="162" y="190">描く</text>
<text class="note small" x="162" y="208">値を置いて返すだけ</text>
<rect class="box" x="278" y="144" width="120" height="76"/>
<rect class="badge kind-2" x="290" y="154" width="40" height="16"/>
<text class="label small kind-2" x="310" y="166" text-anchor="middle">補完</text>
<text class="label" x="290" y="190">探す</text>
<text class="note small" x="290" y="208">範囲の中を探すだけ</text>
<rect class="boundary" x="22" y="234" width="120" height="76"/>
<rect class="badge kind-3" x="34" y="244" width="40" height="16"/>
<text class="label small kind-3" x="54" y="256" text-anchor="middle">一般</text>
<text class="label small" x="34" y="280">版の管理</text>
<text class="note small" x="34" y="298">作らずに使う</text>
<rect class="boundary" x="150" y="234" width="120" height="76"/>
<rect class="badge kind-3" x="162" y="244" width="40" height="16"/>
<text class="label small kind-3" x="182" y="256" text-anchor="middle">一般</text>
<text class="label small" x="162" y="280">JSON Schema の検証</text>
<text class="note small" x="162" y="298">作らずに使う</text>
<rect class="boundary" x="278" y="234" width="120" height="76"/>
<rect class="badge kind-3" x="290" y="244" width="40" height="16"/>
<text class="label small kind-3" x="310" y="256" text-anchor="middle">一般</text>
<text class="label small" x="290" y="280">テンプレートの処理</text>
<text class="note small" x="290" y="298">作らずに使う</text>
<text class="note small" x="10" y="342">中核はドメインモデルで、補完は手続きのまま書き、一般は作らずに使う</text>
</svg>
