<svg viewBox="0 0 420 372" role="img" aria-label="AI と Semantic Agent Schema の往復。作る ・ 直す：1 書く手順を依頼する、2 x-prompt から生成した手順、3 作った値、4 確かめて書き項目ごとに記録。確かめる ・ 意味の判定：5 判定の手順を依頼する、6 変わった所と rule だけの手順、7 別の文脈で判定した答え、8 突き合わせて記録した結果">
<rect class="box" x="60" y="10" width="120" height="34"/>
<text class="title" x="120" y="32" text-anchor="middle">AI のセッション</text>
<line class="grid" x1="120" y1="44" x2="120" y2="336"/>
<rect class="box focus" x="236" y="10" width="178" height="34"/>
<text class="title focus" x="325" y="32" text-anchor="middle">Semantic Agent Schema</text>
<line class="grid" x1="325" y1="44" x2="325" y2="336"/>
<text class="note small" x="222" y="66" text-anchor="middle">作る ・ 直す</text>
<path class="flow" d="M122,94 H322" fill="none"/>
<text class="label small" x="222" y="88" text-anchor="middle">1　書く手順を依頼する（対象を渡す）</text>
<path class="flow" d="M323,124 H123" fill="none"/>
<text class="label small focus" x="222" y="118" text-anchor="middle">2　x-prompt から生成した手順</text>
<path class="flow" d="M122,154 H322" fill="none"/>
<text class="label small" x="222" y="148" text-anchor="middle">3　作った値（全体か差分）</text>
<path class="flow" d="M323,184 H123" fill="none"/>
<text class="label small" x="222" y="178" text-anchor="middle">4　確かめて書き、項目ごとに記録</text>
<text class="note small" x="222" y="212" text-anchor="middle">確かめる ・ 意味の判定</text>
<path class="flow" d="M122,238 H322" fill="none"/>
<text class="label small" x="222" y="232" text-anchor="middle">5　判定の手順を依頼する</text>
<path class="flow" d="M323,268 H123" fill="none"/>
<text class="label small focus" x="222" y="262" text-anchor="middle">6　変わった所と rule だけの手順</text>
<path class="flow" d="M122,298 H322" fill="none"/>
<text class="label small" x="222" y="292" text-anchor="middle">7　別の文脈で判定した答え</text>
<path class="flow" d="M323,328 H123" fill="none"/>
<text class="label small" x="222" y="322" text-anchor="middle">8　突き合わせて記録した結果</text>
<text class="note small" x="10" y="360">作るのも確かめるのも、同じ項目の x-prompt を使う</text>
</svg>
