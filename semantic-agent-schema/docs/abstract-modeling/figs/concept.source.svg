<svg viewBox="0 0 420 340" role="img" aria-label="概念モデル。Abstract スキーマは Semantic Agent Schema のメタで作法を持つ。Concrete スキーマが用途ごとにそれを継承し、インスタンスが Concrete に従う。Semantic Agent Schema の能力は作法に基づき、Concrete の具体には依存しない。依存の注入は、決めた契約の依存だけを受け入れる">
<text class="title" x="10" y="22">概念モデル：Abstract と Concrete</text>
<rect class="box focus" x="10" y="36" width="240" height="84"/>
<text class="title focus" x="22" y="56">Abstract スキーマ</text>
<text class="label small" x="22" y="76">中核。Semantic Agent Schema のメタ</text>
<text class="label small" x="22" y="92">作法：x- の項目と x-prompt の書き方</text>
<text class="note small" x="22" y="110">Semantic Agent Schema が持つ</text>
<path class="link" d="M47,162 V146 H213 V162" fill="none"/>
<path class="flow" d="M130,146 V122" fill="none"/>
<text class="note small" x="137" y="138">継承（用途ごとに拡張）</text>
<rect class="box" x="10" y="162" width="74" height="52"/>
<text class="note small" x="47" y="180" text-anchor="middle">Concrete</text>
<text class="label" x="47" y="200" text-anchor="middle">用途A</text>
<rect class="box" x="93" y="162" width="74" height="52"/>
<text class="note small" x="130" y="180" text-anchor="middle">Concrete</text>
<text class="label" x="130" y="200" text-anchor="middle">用途B</text>
<rect class="box" x="176" y="162" width="74" height="52"/>
<text class="note small" x="213" y="180" text-anchor="middle">Concrete</text>
<text class="label" x="213" y="200" text-anchor="middle">用途C</text>
<path class="flow" d="M47,214 V244" fill="none"/>
<path class="flow" d="M130,214 V244" fill="none"/>
<path class="flow" d="M213,214 V244" fill="none"/>
<text class="note small" x="54" y="234">従う</text>
<rect class="box" x="10" y="246" width="74" height="44"/>
<text class="label small" x="47" y="264" text-anchor="middle">インスタンス</text>
<text class="note small" x="47" y="280" text-anchor="middle">JSON</text>
<rect class="box" x="93" y="246" width="74" height="44"/>
<text class="label small" x="130" y="264" text-anchor="middle">インスタンス</text>
<text class="note small" x="130" y="280" text-anchor="middle">JSON</text>
<rect class="box" x="176" y="246" width="74" height="44"/>
<text class="label small" x="213" y="264" text-anchor="middle">インスタンス</text>
<text class="note small" x="213" y="280" text-anchor="middle">JSON</text>
<rect class="box" x="272" y="36" width="138" height="150"/>
<text class="title" x="284" y="56">能力</text>
<text class="note small" x="284" y="72">作法に基づく</text>
<text class="label small" x="284" y="94">作成</text>
<text class="label small" x="284" y="110">更新</text>
<text class="label small" x="284" y="126">検証</text>
<text class="label small" x="284" y="142">描画</text>
<text class="label small" x="284" y="158">操作</text>
<text class="note small" x="284" y="176">スキーマと JSON に</text>
<path class="flow" d="M272,78 H252" fill="none"/>
<rect class="box" x="272" y="198" width="138" height="46"/>
<text class="label small" x="284" y="217">Concrete の具体には</text>
<text class="label small" x="284" y="233">依存しない</text>
<rect class="box" x="272" y="252" width="138" height="62"/>
<text class="label small" x="284" y="271">依存の注入は、</text>
<text class="label small" x="284" y="287">決めた契約の依存だけ</text>
<text class="label small" x="284" y="303">受け入れる</text>
<text class="note small" x="10" y="314">注入の一例：デザインシステム</text>
<text class="note small" x="10" y="330">（契約は Semantic Agent Schema が決め、中身は使う側が渡す）</text>
</svg>
