<svg viewBox="0 0 420 372" role="img" aria-label="AI（coding agent）。Semantic Agent Schema ・ 作成 ・ 更新 ・ 1　作成の prompt を依頼する ・ 2　x-prompt から作った prompt ・ 3　作った値（全体か JSON Patch） ・ 4　検証して書き、操作の記録に追記 ・ 検証 ・ 意味的な検証 ・ 5　判定の prompt を依頼する ・ 6　変更点の rule だけの prompt ・ 7　rule ごとに判定した response ・ 8　response を検証し、追記した結果 ・ 作成も検証も、同じサブスキーマの x-prompt を使う" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .grid{stroke:var(--dsvg-line,#7C8C86)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A);font-size:10px}.dsvg .label.focus.small{fill:var(--dsvg-accent,#0D5C55);font-size:10px}.dsvg #dsvg-02a1123f-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-line:#62756F;--dsvg-accent-bg:#173330;--dsvg-ink-soft:#9DADA8}</style><defs data-dsvg="marker"><marker id="dsvg-02a1123f-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="420.0" height="372.0" fill="#FFFFFF" rx="8"/>
