<svg viewBox="0 0 420 330" role="img" aria-label="本質。機械的な検証は JSON Schema と x- の項目のバリデーター ・ レンダラーで決定論的に行う。意味的な検証はエージェントを呼ばず、x-prompt から生成した手順を返し、AI が渡した答えを突き合わせて記録する。下に x-prompt の4つの価値">
<text class="title" x="10" y="22">本質：機械的な検証と意味的な検証</text>
<rect class="box" x="10" y="36" width="195" height="120"/>
<text class="title" x="22" y="56">機械的な検証</text>
<text class="note small" x="22" y="74">決定論的に決まる</text>
<text class="label small" x="22" y="98">JSON Schema で形を確かめる</text>
<text class="label small" x="22" y="118">x- の項目のバリデーター</text>
<text class="label small" x="22" y="138">x- の項目のレンダラー</text>
<rect class="box focus" x="215" y="36" width="195" height="120"/>
<text class="title focus" x="227" y="56">意味的な検証</text>
<text class="note small" x="227" y="74">エージェントを呼ばない</text>
<text class="label small" x="227" y="98">x-prompt から手順を生成して返す</text>
<text class="label small" x="227" y="118">AI が判定して答えを渡す</text>
<text class="label small" x="227" y="138">答えを突き合わせて記録する</text>
<rect class="box" x="10" y="172" width="400" height="128"/>
<text class="title" x="22" y="192">x-prompt の4つの価値</text>
<text class="label small" x="22" y="216">1　生成とレビューを、同じ x-prompt で担保する</text>
<text class="label small" x="22" y="236">2　項目ごとに振られ、JSON Pointer で項目と決まりを特定できる</text>
<text class="label small" x="22" y="256">3　項目ごとの変更の記録で、変わった所だけを検証できる</text>
<text class="label small" x="22" y="276">4　変更点はコマンドが決定論的に集め、AI はそれを見て動く</text>
<text class="note small" x="10" y="320">入力と出力の形は、どちらも JSON Schema の契約で決める</text>
</svg>
