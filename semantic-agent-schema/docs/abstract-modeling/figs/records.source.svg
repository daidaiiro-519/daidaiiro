<svg viewBox="0 0 420 410" role="img" aria-label="記録の概念。どれも追記だけ。セッションは誰が打ったか。変更の操作と検証の操作がセッションを指す。変更の操作は項目ごとの前後を持ち、検証の操作は項目ごとの判定を持つ。項目ごとの前後は、次の判定で変わった所を選ぶ元になる">
<text class="title" x="10" y="22">記録の概念（どれも追記だけ）</text>
<rect class="box" x="110" y="36" width="200" height="60"/>
<text class="title" x="122" y="56">セッション</text>
<text class="note small" x="122" y="78">誰が打ったか（1つに1行）</text>
<path class="flow" d="M80,128 L150,98" fill="none"/>
<path class="flow" d="M340,128 L270,98" fill="none"/>
<text class="note small" x="12" y="112">打ったセッション</text>
<text class="note small" x="408" y="112" text-anchor="end">打ったセッション</text>
<rect class="box" x="10" y="130" width="195" height="94"/>
<text class="title" x="22" y="150">変更の操作</text>
<text class="label small" x="22" y="170">対象 ・ 前後のハッシュ</text>
<text class="label small" x="22" y="188">理由</text>
<text class="label small" x="22" y="206">通したか、外の変更の取り込みか</text>
<rect class="box" x="215" y="130" width="195" height="94"/>
<text class="title" x="227" y="150">検証の操作</text>
<text class="label small" x="227" y="170">対象 ・ その時のハッシュ</text>
<text class="label small" x="227" y="188">判定の区分ごとの数</text>
<path class="flow" d="M107,256 V226" fill="none"/>
<path class="flow" d="M312,256 V226" fill="none"/>
<text class="note small" x="114" y="246">1 対 多</text>
<text class="note small" x="319" y="246">1 対 多</text>
<rect class="box focus" x="10" y="258" width="195" height="96"/>
<text class="title focus" x="22" y="278">項目ごとの前後</text>
<text class="label small" x="22" y="298">JSON Pointer</text>
<text class="label small" x="22" y="316">前の値 ・ 後の値</text>
<rect class="box focus" x="215" y="258" width="195" height="96"/>
<text class="title focus" x="227" y="278">項目ごとの判定</text>
<text class="label small" x="227" y="298">rule ・ JSON Pointer</text>
<text class="label small" x="227" y="316">区分 ・ 誰が判定したか ・ 理由</text>
<text class="label small" x="227" y="334">読んだ所のハッシュ</text>
<path class="flow" d="M107,354 V376 H312 V356" fill="none"/>
<text class="note small" x="210" y="398" text-anchor="middle">前後が、次の判定で変わった所を選ぶ元になる</text>
</svg>
