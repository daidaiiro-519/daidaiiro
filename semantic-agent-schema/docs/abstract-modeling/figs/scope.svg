<path class="flow" d="M170,156 V120" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-877f5578-arrow-5B6B66)"/>
<text class="note small" x="176" y="142" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">結果 ・ 手順 ・ 断る理由</text>
<path class="flow" d="M380,118 V156" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-877f5578-arrow-5B6B66)"/>
<text class="note small" x="374" y="142" text-anchor="end" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">人の欄の値</text>
<rect class="boundary" x="4" y="158" width="412" height="206" fill="none" stroke="#5B6B66" stroke-width="1.5" stroke-dasharray="4 3" rx="5"/>
<text class="title" x="16" y="180" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">Semantic Agent Schema</text>
<text class="label small" x="16" y="202" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">①　入力の形と値の正しさを、契約で確かめる</text>
<text class="label small" x="16" y="222" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">②　決まった手順で処理する（同じ入力なら同じ結果）</text>
<text class="label small" x="16" y="242" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">③　足りなければ、理由を付けて断る</text>
<rect class="box focus" x="16" y="256" width="388" height="96" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label small focus" x="28" y="276" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#0D5C55">中で引いてよいのは、入力から決定論的に導けるものだけ</text>
<text class="label small" x="28" y="298" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">自分の操作の記録</text>
<text class="label small" x="28" y="318" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">版の管理（Git）の事実</text>
<text class="label small" x="28" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">渡された置き場所の中の名前</text>
