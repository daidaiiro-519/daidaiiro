<svg viewBox="0 0 440 432" role="img" aria-label="Go の構成と依存の向き。cmd/semantic-agent-schema の main.go がアダプターを作り、adapters/inbound/cli へ渡す。adapters/inbound/cli は4つの application を使う。application は authoring/domain を使う。adapters/outbound の files ・ repository ・ schemacheck ・ patching ・ templates ・ recordstore は、application が宣言したポートを満たし、domain の値を作る。schemacheck は publishedlanguage を読む。authoring/domain は標準ライブラリだけを使う">
