<svg viewBox="0 0 420 680" role="img" aria-label="validate 1件の流れ。AI が対象と置き場所とセッションを付けて打つ。入口が引数を確かめ、validation の application を呼ぶ。DocumentStore で filesystem から文書を読み、SchemaValidator で jsonschema が置き場所の中から $id で引いた Concrete に照らす。validation の domain が当たる rule と組み込みの検査を当てる。ValidationLog で sqlite に記録し、入口が結果を1行で返す">
