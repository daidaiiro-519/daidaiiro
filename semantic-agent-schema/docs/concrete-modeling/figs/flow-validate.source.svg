<text class="note small" x="20" y="89">validate a.json --schemas s/ --session S</text>
<rect class="box" x="10" y="120" width="104" height="42"/>
<text class="label small" x="20" y="138">1 引数を確かめる</text>
<text class="note small" x="20" y="153">足りなければ断る</text>
<rect class="box" x="120" y="184" width="150" height="57"/>
