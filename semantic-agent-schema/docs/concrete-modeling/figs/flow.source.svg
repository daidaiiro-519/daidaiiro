<svg viewBox="0 0 340 468" role="img" aria-label="1回の流れ。AI：引数と JSON を作って実行する ・ どのファイル ・ スキーマ ・ 範囲かは AI が決める ・ 機械的に入力を検証する ・ ライブラリ（santhosh-tekuri/jsonschema） ・ 違反 ・ rejected のログイベントを返す ・ instruction ・ next ・ next ・ 通過 ・ ドメインモデルで検証 ・ 意味的な検証なら ・ prompt を返す ・ AI：ログイベントを読んで次のアクションを取る ・ 違反は指示に従って直し、next を実行する ・ prompt に従って判定し response を作る ・ response を JSON Schema で検証し、追記する ・ 操作の記録（SQLite）に追記するだけ ・ 検証した JSON ドキュメントを保存し、次の変更点の基準にする">
<text class="title" x="10" y="20">1回の流れ</text>
<rect class="box" x="10" y="34" width="320" height="46"/>
<text class="label" x="22" y="53">AI：引数と JSON を作って実行する</text>
<text class="note small" x="22" y="70">どのファイル ・ スキーマ ・ 範囲かは AI が決める</text>
<path class="flow" d="M170,80 V94"/>
<rect class="box" x="10" y="96" width="320" height="46"/>
<text class="label" x="22" y="115">機械的に入力を検証する</text>
<text class="note small" x="22" y="132">ライブラリ（santhosh-tekuri/jsonschema）</text>
<path class="flow" d="M130,142 L90,170"/>
<path class="flow" d="M210,142 L250,170"/>
<rect class="box warn" x="10" y="172" width="155" height="104"/>
<text class="label warn" x="20" y="192">違反</text>
<text class="note small" x="20" y="214">rejected を返す</text>
<text class="note small" x="20" y="232">instruction ・ next</text>
<text class="note small" x="20" y="250">（違反ごとに1行）</text>
<rect class="box focus" x="175" y="172" width="155" height="104"/>
<text class="label focus" x="185" y="192">通過</text>
<text class="note small" x="185" y="214">ドメインモデルで検証</text>
<text class="note small" x="185" y="232">意味的な検証なら</text>
<text class="note small" x="185" y="250">prompt を返す</text>
<path class="flow" d="M87,276 V300"/>
<path class="flow" d="M252,276 V300"/>
<rect class="box" x="10" y="302" width="320" height="64"/>
<text class="label" x="22" y="321">AI：ログイベントを読んで次のアクションを取る</text>
<text class="note small" x="22" y="340">違反は指示に従って直し、next を実行する</text>
<text class="note small" x="22" y="357">prompt に従って判定し response を作る</text>
<path class="flow" d="M170,366 V380"/>
<rect class="box" x="10" y="382" width="320" height="78"/>
<text class="label" x="22" y="401">response を JSON Schema で検証し、追記する</text>
<text class="note small" x="22" y="420">操作の記録（SQLite）に追記するだけ</text>
<text class="note small" x="22" y="438">検証した JSON ドキュメントを保存し、次の変更点の基準にする</text>
</svg>
