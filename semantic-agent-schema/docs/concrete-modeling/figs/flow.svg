<svg viewBox="0 0 340 468" role="img" aria-label="1回の流れ。AI：引数と JSON を作って実行する ・ どのファイル ・ スキーマ ・ 範囲かは AI が決める ・ 機械的に入力を検証する ・ ライブラリ（santhosh-tekuri/jsonschema） ・ 違反 ・ error のログイベントを返す ・ instruction ・ next ・ next ・ 通過 ・ ドメインモデルで検証 ・ 意味的な検証なら ・ procedure を返す ・ AI：ログイベントを読んで次のアクションを取る ・ 違反は指示に従って直し、next を実行する ・ procedure に従って判定し answer を作る ・ answer を JSON Schema で検証し、追記する ・ 操作の記録（SQLite）に追記するだけ ・ 検証した JSON ドキュメントを保存し、次の変更点の基準にする" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg #dsvg-f35165d4-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}</style><defs data-dsvg="marker"><marker id="dsvg-f35165d4-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="340.0" height="468.0" fill="#FFFFFF" rx="8"/>
<text class="title" x="10" y="20" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">1回の流れ</text>
<rect class="box" x="10" y="34" width="320" height="46" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="22" y="53" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI：引数と JSON を作って実行する</text>
<text class="note small" x="22" y="70" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">どのファイル ・ スキーマ ・ 範囲かは AI が決める</text>
<path class="flow" d="M170,80 V94" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<rect class="box" x="10" y="96" width="320" height="46" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="22" y="115" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">機械的に入力を検証する</text>
<text class="note small" x="22" y="132" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">ライブラリ（santhosh-tekuri/jsonschema）</text>
<path class="flow" d="M130,142 L90,170" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<path class="flow" d="M210,142 L250,170" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<rect class="box warn" x="10" y="172" width="155" height="104" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/>
<text class="label warn" x="20" y="192" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">違反</text>
<text class="note small" x="20" y="214" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">error のログイベントを返す</text>
<text class="note small" x="20" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">instruction ・ next</text>
<text class="note small" x="20" y="250" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">（違反ごとに1行）</text>
<rect class="box focus" x="175" y="172" width="155" height="104" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label focus" x="185" y="192" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">通過</text>
<text class="note small" x="185" y="214" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">ドメインモデルで検証</text>
<text class="note small" x="185" y="232" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">意味的な検証なら</text>
<text class="note small" x="185" y="250" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">procedure を返す</text>
<path class="flow" d="M87,276 V300" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<path class="flow" d="M252,276 V300" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<rect class="box" x="10" y="302" width="320" height="64" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="22" y="321" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">AI：ログイベントを読んで次のアクションを取る</text>
<text class="note small" x="22" y="340" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">違反は指示に従って直し、next を実行する</text>
<text class="note small" x="22" y="357" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">procedure に従って判定し answer を作る</text>
<path class="flow" d="M170,366 V380" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f35165d4-arrow-5B6B66)"/>
<rect class="box" x="10" y="382" width="320" height="78" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="22" y="401" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">answer を JSON Schema で検証し、追記する</text>
<text class="note small" x="22" y="420" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">操作の記録（SQLite）に追記するだけ</text>
<text class="note small" x="22" y="438" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#5B6B66">検証した JSON ドキュメントを保存し、次の変更点の基準にする</text>
</svg>