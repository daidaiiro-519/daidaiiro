<svg viewBox="0 0 420 1154" role="img" aria-label="semantic update で prompt を受け取り、AI が JSON Patch を作って update --patch で書く。semantic validate は直前の意味的な検証と比べた変更点の rule だけで prompt を返し、AI が response を validate --judgments で渡すと、検証してから操作の記録に追記する">
<text class="title" x="10" y="22">処理の流れ：prompt で更新し、変更点を判定する</text>
<text class="note small" x="110" y="44" text-anchor="middle">authoring（application ・ domain）</text>
<text class="note small" x="313" y="44" text-anchor="middle">ポート → アダプター</text>
<rect class="box kind-1" x="10" y="56" width="400" height="57"/>
<text class="label small" x="20" y="74">AI：更新の prompt を依頼する</text>
<text class="note small" x="20" y="89">semantic update a.json</text>
<text class="note small" x="20" y="104">--schemas s/</text>
<rect class="box" x="216" y="135" width="194" height="42"/>
<text class="label small" x="226" y="153">1 Documents.Read → files</text>
<text class="note small" x="226" y="168">Schemas → files</text>
<rect class="box" x="10" y="199" width="200" height="57"/>
<text class="label small" x="20" y="217">2 domain：サブスキーマを引き</text>
<text class="note small" x="20" y="232">prompt を作る。next に</text>
<text class="note small" x="20" y="247">--schemas を入れる</text>
<rect class="box kind-1" x="10" y="278" width="400" height="57"/>
<text class="label small" x="20" y="296">AI：prompt に従い JSON Patch を作る</text>
<text class="note small" x="20" y="311">update a.json --patch P</text>
<text class="note small" x="20" y="326">--schemas s/</text>
<rect class="box" x="216" y="357" width="194" height="42"/>
<text class="label small" x="226" y="375">3 Patcher → patching</text>
<text class="note small" x="226" y="390">Validator → schemacheck</text>
<rect class="box" x="10" y="421" width="200" height="57"/>
<text class="label small" x="20" y="439">4 domain：集約 JSON ドキュメント</text>
<text class="note small" x="20" y="454">読んだハッシュ</text>
<text class="note small" x="20" y="469">change を出す</text>
<rect class="box" x="216" y="500" width="194" height="57"/>
<text class="label small" x="226" y="518">5 Records.WithLock</text>
<text class="note small" x="226" y="533">→ recordstore：ロックの中で</text>
<text class="note small" x="226" y="548">追記して Documents.Write</text>
<rect class="box kind-1" x="10" y="579" width="400" height="57"/>
<text class="label small" x="20" y="597">AI：判定の prompt を依頼する</text>
<text class="note small" x="20" y="612">semantic validate a.json</text>
<text class="note small" x="20" y="627">--schemas s/</text>
<rect class="box" x="216" y="658" width="194" height="57"/>
<text class="label small" x="226" y="676">6 Records</text>
<text class="note small" x="226" y="691">.LastJudged</text>
<text class="note small" x="226" y="706">→ recordstore：直前の judged</text>
<rect class="box" x="10" y="737" width="200" height="57"/>
<text class="label small" x="20" y="755">7 domain：変更点と、検証が</text>
<text class="note small" x="20" y="770">評価した組（Evaluate）から</text>
<text class="note small" x="20" y="785">prompt を作る</text>
<rect class="box kind-1" x="10" y="816" width="400" height="57"/>
<text class="label small" x="20" y="834">AI：rule ごとに判定する</text>
<text class="note small" x="20" y="849">validate a.json --judgments J</text>
<text class="note small" x="20" y="864">--schemas s/</text>
<rect class="box" x="216" y="895" width="194" height="57"/>
<text class="label small" x="226" y="913">8 Validator → schemacheck</text>
<text class="note small" x="226" y="928">judgment-response</text>
<text class="note small" x="226" y="943">.schema.json</text>
<rect class="box" x="10" y="974" width="200" height="57"/>
<text class="label small" x="20" y="992">9 domain：集約検証</text>
<text class="note small" x="20" y="1007">hash と response の組が</text>
<text class="note small" x="20" y="1022">prompt と同じ</text>
<rect class="box" x="216" y="1053" width="194" height="42"/>
<text class="label small" x="226" y="1071">10 Records → recordstore</text>
<text class="note small" x="226" y="1086">validations ・ judgments</text>
<rect class="box kind-1" x="10" y="1117" width="400" height="27"/>
<text class="label small" x="20" y="1135">AI：judged のログイベントを読む</text>
<path class="flow" d="M313,113 V133" fill="none"/>
<path class="flow" d="M313,177 V188 H110 V197" fill="none"/>
<path class="flow" d="M110,256 V276" fill="none"/>
<path class="flow" d="M313,335 V355" fill="none"/>
<path class="flow" d="M313,399 V410 H110 V419" fill="none"/>
<path class="flow" d="M110,478 V489 H313 V498" fill="none"/>
<path class="flow" d="M313,557 V577" fill="none"/>
<path class="flow" d="M313,636 V656" fill="none"/>
<path class="flow" d="M313,715 V726 H110 V735" fill="none"/>
<path class="flow" d="M110,794 V814" fill="none"/>
<path class="flow" d="M313,873 V893" fill="none"/>
<path class="flow" d="M313,952 V963 H110 V972" fill="none"/>
<path class="flow" d="M110,1031 V1042 H313 V1051" fill="none"/>
<path class="flow" d="M313,1095 V1115" fill="none"/>
</svg>
