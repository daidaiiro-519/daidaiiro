<svg viewBox="0 0 420 498" role="img" aria-label="記録の表と結び付き。records.sqlite は Git の共通フォルダの semantic-agent-schema の下に1つ。sessions を changes と validations が session_id で指す。field_changes が changes を、rule_results が validations を指し、どちらも JSON Pointer の列を持つ。ビュー operations が changes と validations を1つの並びにする。経路は Git の根からの相対">
<text class="title" x="10" y="22">記録の表（records.sqlite）</text>
<text class="note small" x="10" y="40">置き場所：&lt;git-common-dir&gt;/semantic-agent-schema/records.sqlite</text>
<text class="note small" x="10" y="55">ワークツリーで1つ。コミットしない。どの表も追記だけ</text>
<rect class="box" x="110" y="68" width="200" height="70"/>
<text class="title" x="122" y="88">sessions</text>
<text class="label small" x="122" y="106">id ・ tool ・ folder ・ via</text>
<text class="note small" x="122" y="126">誰が打ったか（1セッション1行）</text>
<path class="flow" d="M80,168 L150,140" fill="none"/>
<text class="note small" x="12" y="156">session_id</text>
<path class="flow" d="M340,168 L270,140" fill="none"/>
<text class="note small" x="408" y="156" text-anchor="end">session_id</text>
<rect class="box" x="10" y="170" width="195" height="116"/>
<text class="title" x="22" y="190">changes</text>
<text class="label small" x="22" y="208">kind ・ target_path ・ schema</text>
<text class="label small" x="22" y="224">before_hash ・ after_hash</text>
<text class="label small" x="22" y="240">reason ・ request_id</text>
<text class="label small" x="22" y="256">source ・ worktree</text>
<text class="note small" x="22" y="276">書いた変更（1件1行）</text>
<rect class="box" x="215" y="170" width="195" height="116"/>
<text class="title" x="227" y="190">validations</text>
<text class="label small" x="227" y="208">target_path ・ hash ・ schema</text>
<text class="note small" x="227" y="276">検証（1件1行）</text>
<path class="flow" d="M107,318 V288" fill="none"/>
<text class="note small" x="114" y="308">change_id</text>
<path class="flow" d="M312,318 V288" fill="none"/>
<text class="note small" x="319" y="308">validation_id</text>
<rect class="box focus" x="10" y="320" width="195" height="100"/>
<text class="title focus" x="22" y="340">field_changes</text>
<text class="label small" x="22" y="358">pointer（JSON Pointer）</text>
<text class="label small" x="22" y="374">change ・ before ・ after</text>
<text class="label small" x="22" y="390">before_unavailable</text>
<text class="note small" x="22" y="410">項目ごとの前後</text>
<rect class="box focus" x="215" y="320" width="195" height="100"/>
<text class="title focus" x="227" y="340">rule_results</text>
<text class="label small" x="227" y="358">rule_id ・ pointer ・ by</text>
<text class="label small" x="227" y="374">result ・ reason</text>
<text class="label small" x="227" y="390">reads_hash（読んだ所のハッシュ）</text>
<text class="note small" x="227" y="410">rule と項目ごとの判定</text>
<rect class="boundary" x="10" y="434" width="400" height="56"/>
<text class="label small" x="22" y="456">ビュー operations</text>
<text class="note small" x="22" y="476">changes と validations を1つの並びにして読む（UC7）</text>
</svg>
