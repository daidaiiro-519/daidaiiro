<svg viewBox="0 0 1100 460" width="100%" style="min-width:880px;max-width:1100px;display:block;margin:0 auto" role="img" aria-label="call が読むもの、呼ぶ任せる先、できるインスタンス"><rect class="area" x="10" y="10" width="230" height="440"/><text class="title" x="24" y="36" text-anchor="start">読むもの</text><rect class="area" x="255" y="10" width="210" height="440"/><text class="title" x="269" y="36" text-anchor="start">call</text><rect class="area" x="480" y="10" width="300" height="440"/><text class="title" x="494" y="36" text-anchor="start">呼ばれるもの（任せる先）</text><rect class="area" x="795" y="10" width="295" height="440"/><text class="title" x="809" y="36" text-anchor="start">できるもの（インスタンス）</text><rect class="box kind-2" x="25" y="70" width="200" height="82"/><text class="label" x="39" y="94" text-anchor="start">Concrete</text><text class="label small" x="39" y="114" text-anchor="start">rule（x-prompt.write）</text><text class="label small" x="39" y="132" text-anchor="start">x-delegates</text><rect class="box kind-2" x="25" y="250" width="200" height="82"/><text class="label" x="39" y="274" text-anchor="start">インスタンス</text><text class="label small" x="39" y="294" text-anchor="start">読む欄の値</text><text class="label small" x="39" y="312" text-anchor="start">書かせる対象</text><rect class="box focus" x="270" y="160" width="180" height="82"/><text class="label focus" x="284" y="184" text-anchor="start">call（コマンド）</text><text class="label small" x="284" y="204" text-anchor="start">基盤が任せる先を起動する</text><text class="label small" x="284" y="222" text-anchor="start">依頼と答えは保存しない</text><rect class="box" x="495" y="70" width="270" height="102"/><text class="label" x="509" y="94" text-anchor="start">judging の任せる先</text><text class="label small" x="509" y="114" text-anchor="start">渡す：input-judging</text><text class="label small" x="509" y="132" text-anchor="start">（rules ・ inputs）</text><text class="label small" x="509" y="150" text-anchor="start">返す：output-judging</text><rect class="box" x="495" y="230" width="270" height="102"/><text class="label" x="509" y="254" text-anchor="start">working の任せる先</text><text class="label small" x="509" y="274" text-anchor="start">渡す：input-working</text><text class="label small" x="509" y="292" text-anchor="start">（target ・ task ・ handoff）</text><text class="label small" x="509" y="310" text-anchor="start">返す：output-working</text><rect class="boundary" x="495" y="370" width="270" height="62"/><text class="label" x="509" y="394" text-anchor="start">決めきれず返す点（needs）</text><text class="label small" x="509" y="414" text-anchor="start">呼んだ主体へ返す。残さない</text><rect class="box kind-2" x="810" y="50" width="265" height="82"/><text class="label" x="824" y="74" text-anchor="start">判定の記録</text><text class="label small" x="824" y="94" text-anchor="start">judgment のインスタンス</text><text class="label small" x="824" y="112" text-anchor="start">インスタンス × rule で1件</text><rect class="box kind-2" x="810" y="190" width="265" height="82"/><text class="label" x="824" y="214" text-anchor="start">書いたインスタンス</text><text class="label small" x="824" y="234" text-anchor="start">Concrete のインスタンス</text><text class="label small" x="824" y="252" text-anchor="start">基盤のコマンドで書く</text><rect class="box kind-2" x="810" y="320" width="265" height="82"/><text class="label" x="824" y="344" text-anchor="start">変更の記録</text><text class="label small" x="824" y="364" text-anchor="start">change のインスタンス</text><text class="label small" x="824" y="382" text-anchor="start">書くとき record が残す</text><path class="flow" d="M225,111 H248 V185 H268"/><path class="flow" d="M225,291 H248 V218 H268"/><path class="flow" d="M450,185 H472 V121 H493"/><path class="flow" d="M450,218 H472 V281 H493"/><path class="flow" d="M765,111 H788 V91 H808"/><path class="flow" d="M765,265 H788 V231 H808"/><path class="flow" d="M765,297 H788 V361 H808"/><path class="flow" d="M630,332 V368"/></svg>