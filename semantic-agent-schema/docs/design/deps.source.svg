<svg viewBox="0 0 760 360" width="100%" style="min-width:700px;max-width:760px;display:block;margin:0 auto" role="img" aria-label="call を delegation の domain に置いたときの依存の向き"><rect class="box focus" x="30" y="50" width="250" height="78"/><text class="label focus" x="46" y="78" text-anchor="start">validation / domain</text><text class="label small" x="46" y="100" text-anchor="start">Validator が call を作る</text><text class="label small" x="46" y="118" text-anchor="start">答えを5つの値にまとめる（judged）</text><rect class="box kind-2" x="480" y="50" width="250" height="78"/><text class="label" x="496" y="78" text-anchor="start">delegation / domain</text><text class="label small" x="496" y="100" text-anchor="start">Call（公開された言葉の形）</text><text class="label small" x="496" y="118" text-anchor="start">依存は serde_json だけ</text><rect class="box" x="480" y="220" width="250" height="78"/><text class="label" x="496" y="248" text-anchor="start">delegation / application</text><text class="label small" x="496" y="270" text-anchor="start">ポート：任せる先に依頼する</text><text class="label small" x="496" y="288" text-anchor="start">判定できない rule を返す</text><rect class="box" x="30" y="220" width="250" height="78"/><text class="label" x="46" y="248" text-anchor="start">declaration / domain</text><text class="label small" x="46" y="270" text-anchor="start">Delegate（Concrete の持ち物）</text><path class="flow" d="M280,89 H478"/><text class="label small" x="379" y="80" text-anchor="middle">Call を使う</text><path class="flow" d="M605,220 V130"/><text class="label small" x="614" y="180" text-anchor="start">Call を受け取る</text><path class="flow" d="M480,236 L282,126"/><text class="label small" x="425" y="160" text-anchor="middle">Finding を使う</text><path class="flow" d="M480,282 H282"/><text class="label small" x="381" y="274" text-anchor="middle">Delegate を引数に取る</text><text class="label small warn" x="380" y="336" text-anchor="middle">validation / domain → delegation / application の辺は禁じる（循環しない）</text></svg>
