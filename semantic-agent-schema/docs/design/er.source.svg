<svg viewBox="0 0 1300 1105" width="100%" style="min-width:1040px;max-width:1300px;display:block;margin:0 auto" role="img" aria-label="スキーマ、Concrete の中の欄 ・ rule ・ 任せる先、インスタンスと記録の関係"><rect class="area" x="10" y="10" width="1280" height="170"/><text class="title" x="26" y="36" text-anchor="start">スキーマ（形の定義）</text><text class="note" x="190" y="36" text-anchor="start">schemas/v1 は基盤が配る</text><rect class="box" x="30" y="56" width="170" height="62"/><text class="label" x="44" y="82" text-anchor="start">JSON Schema</text><text class="label small" x="44" y="104" text-anchor="start">2020-12</text><rect class="box" x="240" y="56" width="190" height="62"/><text class="label" x="254" y="82" text-anchor="start">vocab-meta ・ dialect</text><text class="label small" x="254" y="104" text-anchor="start">x- の9つの形と方言</text><rect class="box focus" x="470" y="50" width="300" height="82"/><text class="label focus" x="484" y="76" text-anchor="start">Abstract の本体</text><text class="label small" x="484" y="98" text-anchor="start">Concrete を作るための型</text><text class="label small" x="484" y="118" text-anchor="start">欄 ・ rule ・ 任せる先の入力と答えの形</text><rect class="box" x="850" y="50" width="420" height="82"/><text class="label" x="864" y="76" text-anchor="start">基盤が用意するスキーマ</text><text class="label small" x="864" y="98" text-anchor="start">glossary ・ change ・ judgment</text><text class="label small" x="864" y="118" text-anchor="start">change-summary（call は無くなる）</text><path class="flow" d="M240,85 H202"/><text class="label small" x="221" y="76" text-anchor="middle">足す</text><path class="flow" d="M470,85 H432"/><text class="label small" x="451" y="76" text-anchor="middle">方言</text><path class="flow" d="M850,85 H772"/><text class="label small" x="811" y="76" text-anchor="middle">$schema</text><rect class="area" x="10" y="195" width="1280" height="345"/><text class="title" x="26" y="221" text-anchor="start">Concrete の中（利用者が Abstract の型に従って書くスキーマ）</text><rect class="box" x="30" y="250" width="300" height="82"/><text class="label" x="44" y="276" text-anchor="start">任せる先（x-delegates）</text><text class="label small" x="44" y="298" text-anchor="start">role ・ run.kind（judging ・ working）</text><text class="label small" x="44" y="318" text-anchor="start">argv ・ output</text><rect class="box kind-2" x="470" y="250" width="300" height="82"/><text class="label" x="484" y="276" text-anchor="start">Concrete</text><text class="label small" x="484" y="298" text-anchor="start">x-instance-path ・ x-instance-label</text><text class="label small" x="484" y="318" text-anchor="start">x-extensions</text><rect class="box" x="30" y="410" width="300" height="82"/><text class="label" x="44" y="436" text-anchor="start">rule（欄の x-prompt.write）</text><text class="label small" x="44" y="458" text-anchor="start">id ・ by（machine ・ ai ・ human）</text><text class="label small" x="44" y="478" text-anchor="start">agent：任せる先の名前</text><rect class="box kind-2" x="470" y="410" width="300" height="102"/><text class="label" x="484" y="436" text-anchor="start">欄（properties の1つ）</text><text class="label small" x="484" y="458" text-anchor="start">x-prompt ・ x-relationship</text><text class="label small" x="484" y="478" text-anchor="start">x-derived-from ・ x-decided-by</text><text class="label small" x="484" y="498" text-anchor="start">x-published</text><rect class="box" x="870" y="410" width="400" height="82"/><text class="label" x="884" y="436" text-anchor="start">glossary の term</text><text class="label small" x="884" y="458" text-anchor="start">.semantic-agent-schema/glossary.json</text><text class="label small" x="884" y="478" text-anchor="start">欄が URN で term を指す</text><path class="flow" d="M620,165 V248"/><text class="label small" x="628" y="232" text-anchor="start">$schema</text><path class="flow" d="M470,290 H332"/><text class="label small" x="401" y="281" text-anchor="middle">1:N</text><path class="flow" d="M620,334 V408"/><text class="label small" x="628" y="380" text-anchor="start">1:N</text><path class="flow" d="M470,450 H332"/><text class="label small" x="401" y="441" text-anchor="middle">1:N</text><path class="flow" d="M180,410 V336"/><text class="label small" x="188" y="380" text-anchor="start">agent N:1</text><path class="flow" d="M770,450 H868"/><text class="label small" x="846" y="441" text-anchor="middle">N:1</text><path class="flow" d="M770,500 H820 V300 H772"/><text class="label small" x="828" y="330" text-anchor="start">x-relationship：指す Concrete</text><rect class="area" x="10" y="555" width="1280" height="540"/><text class="title" x="26" y="581" text-anchor="start">データ（インスタンスと記録）</text><text class="note" x="230" y="581" text-anchor="start">2行目が置き場所。他の枠の箱は → で指す</text><rect class="box" x="30" y="610" width="300" height="82"/><text class="label" x="44" y="636" text-anchor="start">変えた欄（change_items）</text><text class="label small" x="44" y="658" text-anchor="start">SQLite</text><text class="label small" x="44" y="678" text-anchor="start">→ 欄（pointer）</text><rect class="box kind-2" x="470" y="610" width="300" height="102"/><text class="label" x="484" y="636" text-anchor="start">インスタンス</text><text class="label small" x="484" y="658" text-anchor="start">利用者のリポジトリ（x-instance-path）</text><text class="label small" x="484" y="678" text-anchor="start">→ Concrete（$schema）</text><text class="label small" x="484" y="698" text-anchor="start">x-relationship の欄で別のインスタンスを指す</text><rect class="box" x="870" y="610" width="400" height="102"/><text class="label" x="884" y="636" text-anchor="start">判定の記録（judgment）</text><text class="label small" x="884" y="658" text-anchor="start">.semantic-agent-schema/judgments/{key}.json</text><text class="label small" x="884" y="678" text-anchor="start">インスタンス × rule で1件</text><text class="label small" x="884" y="698" text-anchor="start">→ rule（URN#id）・ 任せる先とモデル</text><path class="flow" d="M330,650 H468"/><text class="label small" x="399" y="641" text-anchor="middle">対象 N:1</text><path class="flow" d="M870,650 H772"/><text class="label small" x="821" y="641" text-anchor="middle">対象 N:1</text><rect class="box" x="30" y="800" width="300" height="82"/><text class="label" x="44" y="826" text-anchor="start">変更の記録（changes）</text><text class="label small" x="44" y="848" text-anchor="start">SQLite ・ CLI には change の形で出す</text><text class="label small" x="44" y="868" text-anchor="start">意図 ・ 目的の参照 ・ 書いた者</text><rect class="box" x="470" y="800" width="300" height="82"/><text class="label" x="484" y="826" text-anchor="start">意図の判定（intent_judgments）</text><text class="label small" x="484" y="848" text-anchor="start">SQLite ・ 1つの変更に1件</text><text class="label small" x="484" y="868" text-anchor="start">人の承認で x-decided-by の欄が決まる</text><path class="flow" d="M180,800 V694"/><text class="label small" x="188" y="750" text-anchor="start">1:N</text><path class="flow" d="M470,840 H332"/><text class="label small" x="401" y="831" text-anchor="middle">1:1</text><rect class="box" x="30" y="970" width="300" height="102"/><text class="label" x="44" y="996" text-anchor="start">セッション（sessions）</text><text class="label small" x="44" y="1018" text-anchor="start">SQLite ・ ステップ9 で足す（Q11）</text><text class="label small" x="44" y="1038" text-anchor="start">ID（ツール:文字列）・ 目的 ・ 役割 ・ 状態</text><text class="label small" x="44" y="1058" text-anchor="start">親：別のセッションを指す（N:1）</text><rect class="box" x="470" y="970" width="300" height="62"/><text class="label" x="484" y="996" text-anchor="start">セッションと変更（session_changes）</text><text class="label small" x="484" y="1018" text-anchor="start">SQLite ・ セッションと変更を N:M でつなぐ</text><rect class="box" x="870" y="970" width="400" height="82"/><text class="label" x="884" y="996" text-anchor="start">変更のまとめ（change-summary）</text><text class="label small" x="884" y="1018" text-anchor="start">.semantic-agent-schema/changes/{id}.json</text><text class="label small" x="884" y="1038" text-anchor="start">コミットごとに1件</text><path class="flow" d="M470,1001 H332"/><text class="label small" x="401" y="992" text-anchor="middle">N:1</text><path class="flow" d="M620,970 V950 H200 V886"/><text class="label small" x="208" y="920" text-anchor="start">N:1</text><path class="flow" d="M300,884 V930 H1070 V968"/><text class="label small" x="1078" y="955" text-anchor="start">N:1</text><path class="flow" d="M700,884 V915 H1170 V968"/><text class="label small" x="1178" y="948" text-anchor="start">purposes で公開</text></svg>