<svg viewBox="0 0 1190 600" width="100%" style="min-width:1040px;max-width:1190px;display:block;margin:0 auto" role="img" aria-label="ヘキサゴナル：駆動する側と駆動される側のポート"><path class="area" d="M250,300 L350,40 L660,40 L760,300 L660,560 L350,560 Z"/><text class="note" x="505" y="66" text-anchor="middle">コア（domain と application）</text><rect class="box focus" x="330" y="150" width="350" height="100"/><text class="title focus" x="345" y="174" text-anchor="start">application（使う場面）</text><text class="label" x="345" y="196" text-anchor="start">業務領域ごとの use_cases</text><text class="label" x="345" y="213" text-anchor="start">ユーザー目的とサブ機能</text><text class="label" x="345" y="230" text-anchor="start">外に依頼する約束（ports）を持つ</text><rect class="box kind-2" x="360" y="300" width="290" height="90"/><text class="title kind-2" x="375" y="324" text-anchor="start">domain（概念）</text><text class="label" x="375" y="346" text-anchor="start">集約 ・ 値 ・ ドメインサービス</text><text class="label" x="375" y="364" text-anchor="start">ポートを知らない</text><path class="flow" d="M480,250 V298"/><path class="flow" d="M530,298 V252"/><text class="note" x="95" y="110" text-anchor="middle">駆動する側（inbound）</text><rect class="box" x="10" y="160" width="170" height="56"/><text class="title" x="22" y="182" text-anchor="start">CLI</text><text class="label small" x="22" y="202" text-anchor="start">人 ・ 子のセッション ・ CI</text><path class="flow" d="M180,188 H328"/><rect class="boundary" x="10" y="250" width="170" height="56"/><text class="title" x="22" y="272" text-anchor="start">MCP</text><text class="label small" x="22" y="292" text-anchor="start">子のセッション（ステップ5）</text><path class="flow" d="M180,278 H328"/><text class="label small" x="10" y="140" text-anchor="start">コマンド ＝ 使う場面を呼ぶ</text><text class="note" x="885" y="26" text-anchor="middle">駆動される側のポート（持ち主の業務領域）</text><text class="note" x="1110" y="26" text-anchor="middle">outbound</text><rect class="box" x="770" y="40" width="230" height="52"/><text class="label" x="782" y="61" text-anchor="start">文書を保管する</text><text class="label small" x="782" y="80" text-anchor="start">保存と版の管理</text><rect class="box" x="1040" y="48" width="140" height="36"/><text class="label small" x="1110" y="70" text-anchor="middle">fs</text><path class="flow" d="M1040,66 H1002"/><rect class="box" x="770" y="104" width="230" height="52"/><text class="label" x="782" y="125" text-anchor="start">確定した姿と比べる</text><text class="label small" x="782" y="144" text-anchor="start">保存と版の管理</text><rect class="box" x="1040" y="112" width="140" height="36"/><text class="label small" x="1110" y="134" text-anchor="middle">git</text><path class="flow" d="M1040,130 H1002"/><rect class="box" x="770" y="168" width="230" height="52"/><text class="label" x="782" y="189" text-anchor="start">変更の記録と承認を残し、たどる</text><text class="label small" x="782" y="208" text-anchor="start">変更の確かめ</text><rect class="box" x="1040" y="176" width="140" height="36"/><text class="label small" x="1110" y="198" text-anchor="middle">sqlite</text><path class="flow" d="M1040,194 H1002"/><rect class="box" x="770" y="232" width="230" height="52"/><text class="label" x="782" y="253" text-anchor="start">承認された欄を問う</text><text class="label small" x="782" y="272" text-anchor="start">意味の検証</text><rect class="box" x="1040" y="240" width="140" height="36"/><text class="label small" x="1110" y="262" text-anchor="middle">sqlite</text><path class="flow" d="M1040,258 H1002"/><rect class="box" x="770" y="296" width="230" height="52"/><text class="label" x="782" y="317" text-anchor="start">rule の判定を残し、使い直す</text><text class="label small" x="782" y="336" text-anchor="start">意味の検証</text><rect class="box" x="1040" y="304" width="140" height="36"/><text class="label small" x="1110" y="326" text-anchor="middle">fs</text><path class="flow" d="M1040,322 H1002"/><rect class="box" x="770" y="360" width="230" height="52"/><text class="label" x="782" y="381" text-anchor="start">任せる先に依頼する</text><text class="label small" x="782" y="400" text-anchor="start">AI と外のツールによる判定</text><rect class="box" x="1040" y="368" width="140" height="36"/><text class="label small" x="1110" y="390" text-anchor="middle">tools ・ coding-agents</text><path class="flow" d="M1040,386 H1002"/><path class="flow" d="M680,200 H768"/><text class="label small" x="10" y="580" text-anchor="start">ポートは、その会話を受け持つ業務領域の application に置く。アダプターはポートを実装し、矢印はアダプター → ポート（実装する向き）</text></svg>