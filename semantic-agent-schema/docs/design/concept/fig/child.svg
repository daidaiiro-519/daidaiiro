hecker で断る</text></g></g><g class="wf-node" transform="translate(235.6,246.0)"><g class="svg-box" role="warn"><rect class="box warn" x="0" y="0" width="238.6" height="32.0" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="119.3" y="20.3" text-anchor="middle" font-weight="400" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">同じ子が処理中 → busy（送らない）</text></g></g><g class="wf-node" transform="translate(512.6,114.0)"><g class="svg-box" role="focus"><rect class="box focus" x="0" y="0" width="214.6" height="50.0" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="107.3" y="20.3" text-anchor="middle" font-weight="600" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">--new か、この親に同じ役割の</text><text class="label focus" x="107.3" y="38.3" text-anchor="middle" font-weight="600" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">子が無い → 起動して ID を返す</text></g></g><g class="wf-node" transform="translate(498.2,246.0)"><g class="svg-box" role="warn"><rect class="box warn" x="0" y="0" width="243.4" height="50.0" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="121.7" y="20.3" text-anchor="middle" font-weight="400" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">この親に直前の同じ役割の子がある → </text><text class="label warn" x="121.7" y="38.3" text-anchor="middle" font-weight="400" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">起動せずに child_exists で案内</text></g></g></g></svg>