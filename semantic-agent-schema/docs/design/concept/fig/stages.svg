nt-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">いくつかのものにまたがる判定や計算</text><rect class="box kind-1" x="640" y="260" width="300" height="40" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/><text class="label kind-1" x="790.0" y="284.0" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#7A3B6D">業務サービス</text><path class="flow" d="M550,280 H638" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-5d6c9a51-arrow-5B6B66)"/><rect class="box" x="50" y="312" width="500" height="40" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="300.0" y="336.0" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">データの出し入れだけで、ルールが無い</text><rect class="box" x="640" y="312" width="300" height="40" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="790.0" y="336.0" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">スクリプトのまま</text><path class="flow" d="M550,332 H638" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-5d6c9a51-arrow-5B6B66)"/><rect class="box" x="50" y="364" width="500" height="40" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="300.0" y="388.0" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">見た目は同じだが、意味や変わる理由が違う</text><rect class="box" x="640" y="364" width="300" height="40" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="790.0" y="388.0" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">別のものとして分ける</text><path class="flow" d="M550,384 H638" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-5d6c9a51-arrow-5B6B66)"/></svg>