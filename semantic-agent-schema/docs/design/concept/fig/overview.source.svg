<svg viewBox="0 0 1000 700" width="100%" style="min-width:760px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="SAS と使う側と一般の製品"><rect class="area" x="10" y="10" width="980" height="190"/><text class="note" x="22" y="30" font-weight="700">使う側（SAS の外）</text><rect class="box" x="30" y="40" width="290" height="56"/><text class="label" x="175.0" y="63.0" text-anchor="middle">オーケストレーター：</text><text class="label" x="175.0" y="81.0" text-anchor="middle">目的のセッション・親子・子セッションへの委譲</text><rect class="boundary" x="30" y="124" width="290" height="56"/><text class="label" x="175.0" y="147.0" text-anchor="middle">進め方としての目的</text><text class="label" x="175.0" y="165.0" text-anchor="middle">（目的ごとに進める営み）</text><rect class="box" x="355" y="40" width="290" height="56"/><text class="label" x="500.0" y="63.0" text-anchor="middle">変更の運用：</text><text class="label" x="500.0" y="81.0" text-anchor="middle">承認・まとめ・コミット・PR</text><rect class="box" x="680" y="40" width="290" height="56"/><text class="label" x="825.0" y="72.0" text-anchor="middle">Concrete を持つ Skill・ガイド</text><path class="flow async" d="M175,96 V122"/><rect class="area" x="10" y="240" width="980" height="290"/><text class="note" x="22" y="260" font-weight="700">Semantic Agent Schema</text><path class="flow" d="M500,96 V268"/><text class="note" x="510" y="226" text-anchor="start">使う（公開する形だけ）</text><rect class="box focus" x="340" y="270" width="320" height="56"/><text class="label focus" x="500.0" y="293.0" text-anchor="middle">公開する形：Abstract の版・</text><text class="label focus" x="500.0" y="311.0" text-anchor="middle">CLI の出力・描画の契約</text><path class="flow" d="M500,326 V358"/><rect class="box focus" x="340" y="360" width="320" height="56"/><text class="label focus" x="500.0" y="383.0" text-anchor="middle">能力：作成・更新・削除・</text><text class="label focus" x="500.0" y="401.0" text-anchor="middle">検証・描画・検索</text><path class="flow" d="M500,416 V448"/><path class="flow" d="M340,388 H175 V448"/><path class="flow async" d="M660