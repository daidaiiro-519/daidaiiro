<svg viewBox="0 0 1000 440" width="100%" style="min-width:760px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="探索の4つの段階と、引き上げの表"><rect class="box" x="20" y="30" width="220" height="64"/><text class="label" x="130.0" y="57.0" text-anchor="middle">1 境界</text><text class="label" x="130.0" y="75.0" text-anchor="middle">区切られた文脈と業務領域</text><path class="flow" d="M240,62 H263"/><rect class="box" x="265" y="30" width="220" height="64"/><text class="label" x="375.0" y="57.0" text-anchor="middle">2 ユースケース</text><text class="label" x="375.0" y="75.0" text-anchor="middle">アクター・事前状態・保証</text><path class="flow" d="M485,62 H508"/><rect class="box" x="510" y="30" width="220" height="64"/><text class="label" x="620.0" y="57.0" text-anchor="middle">3 トランザクションスクリプト</text><text class="label" x="620.0" y="75.0" text-anchor="middle">手続きとルールをそのまま書く</text><path class="flow" d="M730,62 H753"/><rect class="box focus" x="755" y="30" width="220" height="64"/><text class="label focus" x="865.0" y="57.0" text-anchor="middle">4 引き上げ</text><text class="label focus" x="865.0" y="75.0" text-anchor="middle">何になるかを判別する</text><rect class="area" x="20" y="120" width="960" height="310"/><text class="note" x="32" y="140" font-weight="700">引き上げの表（段階4）</text><rect class="box" x="50" y="156" width="500" height="40"/><text class="label" x="300.0" y="180.0" text-anchor="middle">いつも同時に守らないといけない条件</text><rect class="box focus" x="640" y="156" width="300" height="40"/><text class="label focus" x="790.0" y="180.0" text-anchor="middle">集約</text><path class="flow" d="M550,176 H638"/><rect class="box" x="50" y="208" width="500" height="40"/><text class="label" x="300.0" y="232.0" text-anchor="middle">意味を持つ値と、その値の規則</text><rect class="box focus" x="640" y="208" width="300" height="40"/><text class="label focus" x="790.0" y="232.0" text-anchor="middle">値オブジェクト</text><path class="flow" d="M550,228 H638"/><rect class="box" x="50" y="260" width="500" height="40"/><text class="label" x="300.0" y="284.0" text-anchor="middle">いくつかのものにまたがる判定や計算</text><rect class="box kind-1" x="640" y="260" width="300" height="40"/><text class="label kind-1" x="790.0" y="284.0" text-anchor="middle">ドメインサービス</text><path class="flow" d="M550,280 H638"/><rect class="box" x="50" y="312" width="500" height="40"/><text class="label" x="300.0" y="336.0" text-anchor="middle">データの出し入れだけで、ルールが無い</text><rect class="box" x="640" y="312" width="300" height="40"/><text class="label" x="790.0" y="336.0" text-anchor="middle">スクリプトのまま</text><path class="flow" d="M550,332 H638"/><rect class="box" x="50" y="364" width="500" height="40"/><text class="label" x="300.0" y="388.0" text-anchor="middle">見た目は同じだが、意味や変わる理由が違う</text><rect class="box" x="640" y="364" width="300" height="40"/><text class="label" x="790.0" y="388.0" text-anchor="middle">別のものとして分ける</text><path class="flow" d="M550,384 H638"/></svg>