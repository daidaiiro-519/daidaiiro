<svg viewBox="0 0 1200 1232" width="100%" style="min-width:1000px;max-width:1200px;display:block" role="img" aria-label="SAS の手元の DB の ER 図"><rect class="area" x="10" y="10" width="1180" height="1062"/><text class="title" x="26" y="40" text-anchor="start">手元の DB（SQLite・リポジトリごとに1つ・SAS の中だけで使う。DDL は公開しない）</text><path class="link" d="M560,126 H600"/><text class="label small" x="568" y="120" text-anchor="start">1</text><text class="label small" x="592" y="142" text-anchor="end">0..*</text><path class="link" d="M20,130 H12 V159 H20"/><text class="note" x="30" y="550" text-anchor="start">親・引き継いだ元・続けた元は sessions どうし</text><path class="link" d="M290.0,530 V590"/><text class="label small" x="298.0" y="546" text-anchor="start">1</text><text class="label small" x="298.0" y="584" text-anchor="start">0..*</text><path class="link" d="M560,630 H580.0 V412 H600"/><text class="label small" x="568" y="624" text-anchor="start">1</text><text class="label small" x="592" y="404" text-anchor="end">0..1</text><path class="link" d="M870.0,442 V546"/><text class="label small" x="878.0" y="458" text-anchor="start">1</text><text class="label small" x="878.0" y="540" text-anchor="start">0..*</text><path class="link" d="M1140,422 H1182 V820 H1140"/><text class="label small" x="1144" y="416" text-anchor="start">1</text><text class="label small" x="1144" y="814" text-anchor="start">0..*</text><text class="note" x="610" y="480" text-anchor="start">cause_id：参照元の書き換え → 削除</text><text class="note" x="610" y="500" text-anchor="start">turn_seq：答えを受けた回</text><rect class="box focus" x="20" y="70" width="540" height="460"/><text class="label focus" x="32" y="92" text-anchor="start">sessions（セッション）</text><text class="label small" x="32" y="119" text-anchor="start">PK</text><text class="label small" x="76" y="119" text-anchor="start">id : TEXT</text><text class="note" x="270" y="119" text-anchor="start">ULID</text><text class="label small" x="32" y="141" text-anchor="start"></text><text class="label small" x="76" y="141" text-anchor="start">kind : TEXT</text><text class="note" x="270" y="141" text-anchor="start">caller ・ sas</text><text class="label small" x="32" y="163" text-anchor="start">FK</text><text class="label small" x="76" y="163" text-anchor="start">parent_id : TEXT</text><text class="note" x="270" y="163" text-anchor="start">sas のとき必須。先は caller</text><text class="label small" x="32" y="185" text-anchor="start"></text><text class="label small" x="76" y="185" text-anchor="start">actor : TEXT</text><text class="note" x="270" y="185" text-anchor="start">caller：ai_agent・human</text><text class="label small" x="32" y="207" text-anchor="start"></text><text class="label small" x="76" y="207" text-anchor="start">adapter : TEXT</text><text class="note" x="270" y="207" text-anchor="start">設定のアダプターの名前</text><text class="label small" x="32" y="229" text-anchor="start"></text><text class="label small" x="76" y="229" text-anchor="start">tool_ref : TEXT</text><text class="note" x="270" y="229" text-anchor="start">ツールのセッション ID。解釈しない</text><text class="label small" x="32" y="251" text-anchor="start"></text><text class="label small" x="76" y="251" text-anchor="start">caller_ref : TEXT</text><text class="note" x="270" y="251" text-anchor="start">--caller。使う側の参照</text><text class="label small" x="32" y="273" text-anchor="start"></text><text class="label small" x="76" y="273" text-anchor="start">operation_kind : TEXT</text><text class="note" x="270" y="273" text-anchor="start">sas：create・update・validate・search</text><text class="label small" x="32" y="295" text-anchor="start"></text><text class="label small" x="76" y="295" text-anchor="start">lifetime : TEXT</text><text class="note" x="270" y="295" text-anchor="start">single ・ continuing</text><text class="label small" x="32" y="317" text-anchor="start"></text><text class="label small" x="76" y="317" text-anchor="start">context : TEXT</text><text class="note" x="270" y="317" text-anchor="start">none ・ inherit</text><text class="label small" x="32" y="339" text-anchor="start">FK</text><text class="label small" x="76" y="339" text-anchor="start">inherited_from : TEXT</text><text class="note" x="270" y="339" text-anchor="start">inherit のとき必須</text><text class="label small" x="32" y="361" text-anchor="start">FK</text><text class="label small" x="76" y="361" text-anchor="start">continued_from : TEXT</text><text class="note" x="270" y="361" text-anchor="start">再開の決まりで新しく立てたとき</text><text class="label small" x="32" y="383" text-anchor="start"></text><text class="label small" x="76" y="383" text-anchor="start">capabilities : JSON</text><text class="note" x="270" y="383" text-anchor="start">立てた時の能力の写し</text><text class="label small" x="32" y="405" text-anchor="start"></text><text class="label small" x="76" y="405" text-anchor="start">model : TEXT</text><text class="label small" x="32" y="427" text-anchor="start"></text><text class="label small" x="76" y="427" text-anchor="start">brief : TEXT</text><text class="note" x="270" y="427" text-anchor="start">決めたことの文</text><text class="label small" x="32" y="449" text-anchor="start"></text><text class="label small" x="76" y="449" text-anchor="start">started_at : TEXT</text><text class="label small" x="32" y="471" text-anchor="start"></text><text class="label small" x="76" y="471" text-anchor="start">last_used_at : TEXT</text><text class="note" x="270" y="471" text-anchor="start">caller：一定の時間で閉じる材料</text><text class="label small" x="32" y="493" text-anchor="start"></text><text class="label small" x="76" y="493" text-anchor="start">ended_at : TEXT</text><text class="label small" x="32" y="515" text-anchor="start"></text><text class="label small" x="76" y="515" text-anchor="start">ended_as : TEXT</text><text class="note" x="270" y="515" text-anchor="start">sas は8つ・caller は closed・idle</text><rect class="box focus" x="600" y="70" width="540" height="372"/><text class="label focus" x="612" y="92" text-anchor="start">operations（操作）</text><text class="label small" x="612" y="119" text-anchor="start">PK</text><text class="label small" x="656" y="119" text-anchor="start">id : TEXT</text><text class="note" x="850" y="119" text-anchor="start">ULID</text><text class="label small" x="612" y="141" text-anchor="start">FK</text><text class="label small" x="656" y="141" text-anchor="start">session_id : TEXT</text><text class="label small" x="612" y="163" text-anchor="start"></text><text class="label small" x="656" y="163" text-anchor="start">seq : INTEGER</text><text class="note" x="850" y="163" text-anchor="start">セッションの中の続き番号</text><text class="label small" x="612" y="185" text-anchor="start">FK</text><text class="label small" x="656" y="185" text-anchor="start">turn_seq : INTEGER</text><text class="note" x="850" y="185" text-anchor="start">sas のセッションのとき、答えを受けた回</text><text class="label small" x="612" y="207" text-anchor="start"></text><text class="label small" x="656" y="207" text-anchor="start">request_id : TEXT</text><text class="note" x="850" y="207" text-anchor="start">1つの依頼に操作は1回</text><text class="label small" x="612" y="229" text-anchor="start"></text><text class="label small" x="656" y="229" text-anchor="start">kind : TEXT</text><text class="note" x="850" y="229" text-anchor="start">create・update・delete・validate</text><text class="label small" x="612" y="251" text-anchor="start"></text><text class="label small" x="656" y="251" text-anchor="start">source : TEXT</text><text class="note" x="850" y="251" text-anchor="start">sas ・ outside（取り込み）</text><text class="label small" x="612" y="273" text-anchor="start"></text><text class="label small" x="656" y="273" text-anchor="start">target_kind : TEXT</text><text class="note" x="850" y="273" text-anchor="start">concrete ・ instance</text><text class="label small" x="612" y="295" text-anchor="start"></text><text class="label small" x="656" y="295" text-anchor="start">target_path : TEXT</text><text class="note" x="850" y="295" text-anchor="start">リポジトリの中のパス</text><text class="label small" x="612" y="317" text-anchor="start"></text><text class="label small" x="656" y="317" text-anchor="start">concrete_ref : TEXT</text><text class="note" x="850" y="317" text-anchor="start">従う Concrete の URN と版</text><text class="label small" x="612" y="339" text-anchor="start"></text><text class="label small" x="656" y="339" text-anchor="start">before_hash : TEXT</text><text class="label small" x="612" y="361" text-anchor="start"></text><text class="label small" x="656" y="361" text-anchor="start">after_hash : TEXT</text><text class="label small" x="612" y="383" text-anchor="start">FK</text><text class="label small" x="656" y="383" text-anchor="start">cause_id : TEXT</text><text class="note" x="850" y="383" text-anchor="start">削除に伴う参照元の書き換えのとき、その削除</text><text class="label small" x="612" y="405" text-anchor="start"></text><text class="label small" x="656" y="405" text-anchor="start">intent : TEXT</text><text class="label small" x="612" y="427" text-anchor="start"></text><text class="label small" x="656" y="427" text-anchor="start">at : TEXT</text><rect class="box focus" x="20" y="590" width="540" height="394"/><text class="label focus" x="32" y="612" text-anchor="start">session_turns（手順を渡した1回）</text><text class="label small" x="32" y="639" text-anchor="start">PK FK</text><text class="label small" x="76" y="639" text-anchor="start">session_id : TEXT</text><text class="label small" x="32" y="661" text-anchor="start">PK</text><text class="label small" x="76" y="661" text-anchor="start">seq : INTEGER</text><text class="note" x="270" y="661" text-anchor="start">セッションの中の何回目か</text><text class="label small" x="32" y="683" text-anchor="start"></text><text class="label small" x="76" y="683" text-anchor="start">kind : TEXT</text><text class="note" x="270" y="683" text-anchor="start">start ・ resume ・ fix</text><text class="label small" x="32" y="705" text-anchor="start"></text><text class="label small" x="76" y="705" text-anchor="start">request_id : TEXT</text><text class="note" x="270" y="705" text-anchor="start">1つの依頼に操作は1回</text><text class="label small" x="32" y="727" text-anchor="start"></text><text class="label small" x="76" y="727" text-anchor="start">attempt : INTEGER</text><text class="note" x="270" y="727" text-anchor="start">同じ依頼の何回目のセッションか</text><text class="label small" x="32" y="749" text-anchor="start"></text><text class="label small" x="76" y="749" text-anchor="start">resume_decision : TEXT</text><text class="note" x="270" y="749" text-anchor="start">再開の決まりのどれに当たったか</text><text class="label small" x="32" y="771" text-anchor="start"></text><text class="label small" x="76" y="771" text-anchor="start">prompt_path : TEXT</text><text class="note" x="270" y="771" text-anchor="start">手順のプロンプト（JSON）のファイル</text><text class="label small" x="32" y="793" text-anchor="start"></text><text class="label small" x="76" y="793" text-anchor="start">prompt_hash : TEXT</text><text class="note" x="270" y="793" text-anchor="start">渡した文の指紋</text><text class="label small" x="32" y="815" text-anchor="start"></text><text class="label small" x="76" y="815" text-anchor="start">time_limit_s : INTEGER</text><text class="label small" x="32" y="837" text-anchor="start"></text><text class="label small" x="76" y="837" text-anchor="start">outcome : TEXT</text><text class="note" x="270" y="837" text-anchor="start">answered・invalid・timeout ほか</text><text class="label small" x="32" y="859" text-anchor="start"></text><text class="label small" x="76" y="859" text-anchor="start">answer_hash : TEXT</text><text class="note" x="270" y="859" text-anchor="start">受け取った答えの指紋</text><text class="label small" x="32" y="881" text-anchor="start"></text><text class="label small" x="76" y="881" text-anchor="start">answer_raw : TEXT</text><text class="note" x="270" y="881" text-anchor="start">invalid のときだけ受け取った文字列</text><text class="label small" x="32" y="903" text-anchor="start"></text><text class="label small" x="76" y="903" text-anchor="start">tokens : JSON</text><text class="note" x="270" y="903" text-anchor="start">session#/$defs/tokens</text><text class="label small" x="32" y="925" text-anchor="start"></text><text class="label small" x="76" y="925" text-anchor="start">context_tokens : INTEGER</text><text class="note" x="270" y="925" text-anchor="start">再開の決まり③の材料</text><text class="label small" x="32" y="947" text-anchor="start"></text><text class="label small" x="76" y="947" text-anchor="start">started_at : TEXT</text><text class="label small" x="32" y="969" text-anchor="start"></text><text class="label small" x="76" y="969" text-anchor="start">ended_at : TEXT</text><rect class="box focus" x="600" y="546" width="540" height="174"/><text class="label focus" x="612" y="568" text-anchor="start">field_changes（変わった欄）</text><text class="label small" x="612" y="595" text-anchor="start">PK FK</text><text class="label small" x="656" y="595" text-anchor="start">operation_id : TEXT</text><text class="label small" x="612" y="617" text-anchor="start">PK</text><text class="label small" x="656" y="617" text-anchor="start">pointer : TEXT</text><text class="note" x="850" y="617" text-anchor="start">JSON ポインタ</text><text class="label small" x="612" y="639" text-anchor="start"></text><text class="label small" x="656" y="639" text-anchor="start">change : TEXT</text><text class="note" x="850" y="639" text-anchor="start">add・remove・replace</text><text class="label small" x="612" y="661" text-anchor="start"></text><text class="label small" x="656" y="661" text-anchor="start">before : JSON</text><text class="note" x="850" y="661" text-anchor="start">NULL は値が無い（null と区別）</text><text class="label small" x="612" y="683" text-anchor="start"></text><text class="label small" x="656" y="683" text-anchor="start">after : JSON</text><text class="label small" x="612" y="705" text-anchor="start"></text><text class="label small" x="656" y="705" text-anchor="start">before_unavailable : INTEGER</text><text class="note" x="850" y="705" text-anchor="start">前の版が無い（Git に無い）</text><rect class="box focus" x="600" y="780" width="540" height="262"/><text class="label focus" x="612" y="802" text-anchor="start">rule_results（rule ごとの結果）</text><text class="label small" x="612" y="829" text-anchor="start">PK FK</text><text class="label small" x="656" y="829" text-anchor="start">operation_id : TEXT</text><text class="label small" x="612" y="851" text-anchor="start">PK</text><text class="label small" x="656" y="851" text-anchor="start">rule_schema : TEXT</text><text class="note" x="850" y="851" text-anchor="start">rule を持つスキーマの URN</text><text class="label small" x="612" y="873" text-anchor="start">PK</text><text class="label small" x="656" y="873" text-anchor="start">rule_id : TEXT</text><text class="label small" x="612" y="895" text-anchor="start">PK</text><text class="label small" x="656" y="895" text-anchor="start">pointer : TEXT</text><text class="note" x="850" y="895" text-anchor="start">判定した欄</text><text class="label small" x="612" y="917" text-anchor="start"></text><text class="label small" x="656" y="917" text-anchor="start">by : TEXT</text><text class="note" x="850" y="917" text-anchor="start">machine ・ ai ・ human</text><text class="label small" x="612" y="939" text-anchor="start"></text><text class="label small" x="656" y="939" text-anchor="start">result : TEXT</text><text class="note" x="850" y="939" text-anchor="start">5つの値</text><text class="label small" x="612" y="961" text-anchor="start"></text><text class="label small" x="656" y="961" text-anchor="start">reason : TEXT</text><text class="label small" x="612" y="983" text-anchor="start"></text><text class="label small" x="656" y="983" text-anchor="start">grounds : JSON</text><text class="note" x="850" y="983" text-anchor="start">読んだ欄のポインタの並び</text><text class="label small" x="612" y="1005" text-anchor="start"></text><text class="label small" x="656" y="1005" text-anchor="start">reads_hash : TEXT</text><text class="note" x="850" y="1005" text-anchor="start">rule.reads の値の指紋</text><text class="label small" x="612" y="1027" text-anchor="start"></text><text class="label small" x="656" y="1027" text-anchor="start">details : JSON</text><text class="note" x="850" y="1027" text-anchor="start">任せる先の output の形</text><rect class="boundary" x="10" y="1102" width="380.0" height="120"/><text class="label" x="22" y="1126" text-anchor="start">公開する形（DB の外）</text><text class="label small" x="22" y="1150" text-anchor="start">CLI の出力：session・operation・diff・rule-result</text><text class="label small" x="22" y="1172" text-anchor="start">DB の名前は出力で直す（parent_id → parent）</text><text class="label small" x="22" y="1194" text-anchor="start">使う側はセッション ID を記録する</text><rect class="boundary" x="410.0" y="1102" width="380.0" height="120"/><text class="label" x="422.0" y="1126" text-anchor="start">ファイル（DB の外）</text><text class="label small" x="422.0" y="1150" text-anchor="start">Concrete・インスタンスの中身は Git（SAS は読むだけ）</text><text class="label small" x="422.0" y="1172" text-anchor="start">手順のプロンプトは prompts_dir のファイル</text><text class="label small" x="422.0" y="1194" text-anchor="start">設定・接続の定義・デザインシステム</text><rect class="boundary" x="810.0" y="1102" width="380.0" height="120"/><text class="label" x="822.0" y="1126" text-anchor="start">DB に持たないもの</text><text class="label small" x="822.0" y="1150" text-anchor="start">人の判定（by: human は unverified だけ）</text><text class="label small" x="822.0" y="1172" text-anchor="start">検索の答え・描画したもの</text><text class="label small" x="822.0" y="1194" text-anchor="start">目的・承認・コミット・変更のまとめ・残した版</text></svg>