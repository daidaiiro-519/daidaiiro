<svg viewBox="0 0 1000 470" width="100%" style="min-width:760px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="集約・値・サービス（突き合わせで確かめたもの）"><rect class="area" x="10" y="10" width="480" height="450"/><text class="note" x="22" y="30" font-weight="700">writing-domain（書くのモジュール）</text><rect class="box focus" x="30" y="44" width="200" height="64"/><text class="label focus" x="130.0" y="71.0" text-anchor="middle">集約：Concrete</text><text class="label focus" x="130.0" y="89.0" text-anchor="middle">版は閉じた一覧・公開した版</text><rect class="box focus" x="270" y="44" width="200" height="64"/><text class="label focus" x="370.0" y="71.0" text-anchor="middle">集約：インスタンス</text><text class="label focus" x="370.0" y="89.0" text-anchor="middle">導出値・人の欄・ハッシュ</text><path class="flow async" d="M270,76 H232"/><text class="note" x="251" y="132" text-anchor="middle">URN と版で指す</text><rect class="box" x="30" y="152" width="440" height="86"/><text class="label" x="250.0" y="181.0" text-anchor="middle">値：ハッシュ・差分・書く条件の外れ・</text><text class="label" x="250.0" y="199.0" text-anchor="middle">文書の種類（TargetKind）・文書の一覧（Corpus）・</text><text class="label" x="250.0" y="217.0" text-anchor="middle">誰が打ったか（Caller）・変更の行</text><rect class="box kind-1" x="30" y="270" width="440" height="66"/><text class="label kind-1" x="250.0" y="298.0" text-anchor="middle">サービス：field_schema</text><text class="label kind-1" x="250.0" y="316.0" text-anchor="middle">（スキーマの所に当たる欄の定義を引く）</text><rect class="boundary" x="30" y="370" width="440" height="66"/><text class="label" x="250.0" y="398.0" text-anchor="middle">use_cases に残すもの：取り込みの前の値・</text><text class="label" x="250.0" y="416.0" text-anchor="middle">衝突を返す・従うインスタンスがあれば止める</text><rect class="area" x="510" y="10" width="480" height="450"/><text class="note" x="522" y="30" font-weight="700">validation-domain（検証のモジュール）</text><rect class="boundary" x="530" y="44" width="440" height="64"/><text class="label" x="750.0" y="71.0" text-anchor="middle">集約は持たない</text><text class="label" x="750.0" y="89.0" text-anchor="middle">← 書くモジュールの集約を読んで rule に照らす</text><rect class="box" x="530" y="160" width="440" height="70"/><text class="label" x="750.0" y="190.0" text-anchor="middle">値：判定の5つの区分・rule の結果・</text><text class="label" x="750.0" y="208.0" text-anchor="middle">誰が判定したか（by）・検証と判定の行</text><rect class="box kind-1" x="530" y="270" width="440" height="66"/><text class="label kind-1" x="750.0" y="298.0" text-anchor="middle">サービス：当たる rule・Abstract の rule・</text><text class="label kind-1" x="750.0" y="316.0" text-anchor="middle">判定が読んだ所のハッシュ（reads_hash）</text><rect class="boundary" x="530" y="370" width="440" height="66"/><text class="label" x="750.0" y="398.0" text-anchor="middle">意味（x-prompt の rule）は同じ検証の中。</text><text class="label" x="750.0" y="416.0" text-anchor="middle">手順を返し、判定は --answer で受け取る（use_cases）</text><path class="flow" d="M530,76 H472"/></svg>