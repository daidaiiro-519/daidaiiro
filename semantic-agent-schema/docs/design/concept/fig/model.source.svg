<svg viewBox="0 0 1000 470" width="100%" style="min-width:760px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="集約・値・サービス（突き合わせで確かめたもの）"><rect class="area" x="10" y="10" width="480" height="450"/><text class="note" x="22" y="30" font-weight="700">writing-domain（書くのモジュール）</text><rect class="box focus" x="30" y="44" width="200" height="64"/><text class="label focus" x="130.0" y="71.0" text-anchor="middle">集約：Concrete</text><text class="label focus" x="130.0" y="89.0" text-anchor="middle">版は閉じた一覧・公開した版</text><rect class="box focus" x="270" y="44" width="200" height="64"/><text class="label focus" x="370.0" y="71.0" text-anchor="middle">集約：インスタンス</text><text class="label focus" x="370.0" y="89.0" text-anchor="middle">導出値・人の欄・指紋</text><path class="flow async" d="M270,76 H232"/><text class="note" x="251" y="132" text-anchor="middle">URN と版で指す</text><rect class="box" x="30" y="160" width="440" height="70"/><text class="label" x="250.0" y="190.0" text-anchor="middle">値：指紋・差分（欄ごとの前後）・</text><text class="label" x="250.0" y="208.0" text-anchor="middle">書く条件の外れ</text><rect class="boundary" x="30" y="270" width="440" height="66"/><text class="label" x="250.0" y="298.0" text-anchor="middle">サービスは持たない</text><text class="label" x="250.0" y="316.0" text-anchor="middle">（参照を見分けず、文書をまたぐ計算が無い）</text><rect class="boundary" x="30" y="370" width="440" height="66"/><text class="label" x="250.0" y="398.0" text-anchor="middle">use_cases に残すもの：取り込みの前の値・</text><text class="label" x="250.0" y="416.0" text-anchor="middle">衝突を返す・従うインスタンスがあれば止める</text><rect class="area" x="510" y="10" width="480" height="450"/><text class="note" x="522" y="30" font-weight="700">validation-domain（検証のモジュール）</text><rect class="boundary" x="530" y="44" width="440" height="64"/><text class="label" x="750.0" y="71.0" text-anchor="middle">集約は持たない</text><text class="label" x="750.0" y="89.0" text-anchor="middle">← 書くモジュールの集約を読んで rule に照らす</text><rect class="box" x="530" y="160" width="440" height="56"/><text class="label" x="750.0" y="192.0" text-anchor="middle">値：判定の5つの区分・rule の結果・誰が判定するか（by）</text><rect class="box kind-1" x="530" y="270" width="440" height="66"/><text class="label kind-1" x="750.0" y="298.0" text-anchor="middle">サービス：当たる rule・</text><text class="label kind-1" x="750.0" y="316.0" text-anchor="middle">Concrete に当たる Abstract の rule</text><rect class="boundary" x="530" y="370" width="440" height="66"/><text class="label" x="750.0" y="398.0" text-anchor="middle">意味（by: ai の rule）は同じ検証の中。</text><text class="label" x="750.0" y="416.0" text-anchor="middle">意味を読ませるポートは application（ステップ6）</text><path class="flow" d="M530,76 H472"/></svg>