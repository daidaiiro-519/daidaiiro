<svg viewBox="0 0 1000 470" width="100%" style="min-width:760px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="集約・値・サービス（突き合わせで確かめたもの）"><rect class="area" x="10" y="10" width="480" height="450"/><text class="note" x="22" y="30" font-weight="700">conformance-domain（契約への適合）</text><rect class="box focus" x="30" y="44" width="200" height="64"/><text class="label focus" x="130.0" y="71.0" text-anchor="middle">集約：Concrete</text><text class="label focus" x="130.0" y="89.0" text-anchor="middle">版は閉じた一覧・名前を足さない</text><rect class="box focus" x="270" y="44" width="200" height="64"/><text class="label focus" x="370.0" y="71.0" text-anchor="middle">集約：インスタンス</text><text class="label focus" x="370.0" y="89.0" text-anchor="middle">id・導出値・人の欄・指紋</text><path class="flow async" d="M270,76 H232"/><text class="note" x="251" y="132" text-anchor="middle">URN と版で指す</text><rect class="box" x="30" y="160" width="440" height="70"/><text class="label" x="250.0" y="190.0" text-anchor="middle">値：指紋・差分・URN と版・インスタンスの id・</text><text class="label" x="250.0" y="208.0" text-anchor="middle">判定の結果（5つの値と数え方）</text><rect class="box kind-1" x="30" y="270" width="440" height="56"/><text class="label kind-1" x="250.0" y="302.0" text-anchor="middle">サービス：x-relationship（指す先の実在・参照元を探す）</text><rect class="boundary" x="30" y="370" width="440" height="66"/><text class="label" x="250.0" y="398.0" text-anchor="middle">use_cases に残すもの：検索・参照元を消して回る・</text><text class="label" x="250.0" y="416.0" text-anchor="middle">版の移し方・$schema を決める・衝突を返す</text><rect class="area" x="510" y="10" width="480" height="450"/><text class="note" x="522" y="30" font-weight="700">semantic-operations-domain（意味の操作）</text><rect class="box focus" x="530" y="44" width="440" height="64"/><text class="label focus" x="750.0" y="71.0" text-anchor="middle">集約：SAS が立てたセッション（回は内側）</text><text class="label focus" x="750.0" y="89.0" text-anchor="middle">型ごとの不変条件・閉じたら足さない</text><rect class="box" x="530" y="160" width="440" height="56"/><text class="label" x="750.0" y="183.0" text-anchor="middle">値：セッションの型（寿命・文脈）・能力の宣言</text><text class="label" x="750.0" y="201.0" text-anchor="middle">（左の値を使う）</text><rect class="box kind-1" x="530" y="270" width="440" height="56"/><text class="label kind-1" x="750.0" y="302.0" text-anchor="middle">サービス：再開の決まり（5段）・やり直しの決まり</text><rect class="boundary" x="530" y="370" width="440" height="66"/><text class="label" x="750.0" y="398.0" text-anchor="middle">use_cases に残すもの：手順のプロンプトを組む・</text><text class="label" x="750.0" y="416.0" text-anchor="middle">エージェントを呼ぶ</text><path class="flow async" d="M530,188 H472"/></svg>