<svg viewBox="0 0 360 646" role="img" aria-label="1つのユースケースを作るときの9つの手順。1 本質の行を引く（本質）：ユースケースが照らす本質の id。2 ユースケースを書く（抽象）：目的 ・ 保証 ・ 主成功シナリオ ・ 拡張。3 各ステップの担保を決める（抽象）：5つの担保から1つを選ぶ。4 JSON Schema に寄せる（Schema）：公開された言葉 ・ Abstract に書く。5 不変条件をドメインモデルに（domain）：JSON Schema で書けないものだけ。6 必要とするポートだけを足す（ports）：このユースケースが呼ぶものだけ。7 試験の場面を先に書く（試験）：期待値はページの行から書く。8 実装する（コード）：usecase_*.go ・ domain ・ アダプター。9 コメントに設計を書く（コメント）：具体モデリング概念の言葉で書く">
<text class="title" x="10" y="22">1つのユースケースを作る順</text>
<rect class="box" x="10" y="34" width="340" height="54"/>
