<rect class="badge focus" x="40" y="43" width="52" height="18"/>
<text class="label small focus" x="66" y="56" text-anchor="middle">本質</text>
<text class="label" x="102" y="57">本質の行を引く</text>
<text class="note small" x="102" y="77">ユースケースが照らす本質の id</text>
<line class="flow" x1="180" y1="88" x2="180" y2="100"/>
<rect class="box" x="10" y="102" width="340" height="54"/>
<text class="title" x="22" y="124">2</text>
<rect class="badge focus" x="40" y="111" width="52" height="18"/>
<text class="label small focus" x="66" y="124" text-anchor="middle">抽象</text>
<text class="label" x="102" y="125">ユースケースを書く</text>
<text class="note small" x="102" y="145">目的 ・ 保証 ・ 主成功シナリオ ・ 拡張</text>
<line class="flow" x1="180" y1="156" x2="180" y2="168"/>
<rect class="box" x="10" y="170" width="340" height="54"/>
<text class="title" x="22" y="192">3</text>
<rect class="badge focus" x="40" y="179" width="52" height="18"/>
<text class="label small focus" x="66" y="192" text-anchor="middle">抽象</text>
<text class="label" x="102" y="193">各ステップの担保を決める</text>
