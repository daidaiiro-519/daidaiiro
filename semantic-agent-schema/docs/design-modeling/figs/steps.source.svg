<text class="note small" x="102" y="553">usecase_*.go ・ domain ・ アダプター</text>
<line class="flow" x1="180" y1="564" x2="180" y2="576"/>
<rect class="box" x="10" y="578" width="340" height="54"/>
<text class="title" x="22" y="600">9</text>
<rect class="badge focus" x="40" y="587" width="52" height="18"/>
<text class="label small focus" x="66" y="600" text-anchor="middle">コメント</text>
<text class="label" x="102" y="601">コメントに設計を書く</text>
<text class="note small" x="102" y="621">具体モデリング概念の言葉で書く</text>
