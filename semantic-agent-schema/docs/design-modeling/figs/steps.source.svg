<rect class="badge focus" x="40" y="247" width="52" height="18"/>
<text class="label small focus" x="66" y="260" text-anchor="middle">Schema</text>
<text class="label" x="102" y="261">JSON Schema に寄せる</text>
<text class="note small" x="102" y="281">公開された言葉 ・ Abstract に書く</text>
<line class="flow" x1="180" y1="292" x2="180" y2="304"/>
<rect class="box" x="10" y="306" width="340" height="54"/>
<text class="title" x="22" y="328">5</text>
<rect class="badge focus" x="40" y="315" width="52" height="18"/>
<text class="label small focus" x="66" y="328" text-anchor="middle">domain</text>
<text class="label" x="102" y="329">不変条件をドメインモデルに</text>
<text class="note small" x="102" y="349">JSON Schema で書けないものだけ</text>
<line class="flow" x1="180" y1="360" x2="180" y2="372"/>
<rect class="box" x="10" y="374" width="340" height="54"/>
<text class="title" x="22" y="396">6</text>
<rect class="badge focus" x="40" y="383" width="52" height="18"/>
<text class="label small focus" x="66" y="396" text-anchor="middle">ports</text>
<text class="label" x="102" y="397">必要とするポートだけを足す</text>
<text class="note small" x="102" y="417">このユースケースが呼ぶものだけ</text>
<line class="flow" x1="180" y1="428" x2="180" y2="440"/>
<rect class="box" x="10" y="442" width="340" height="54"/>
<text class="title" x="22" y="464">7</text>
<rect class="badge focus" x="40" y="451" width="52" height="18"/>
<text class="label small focus" x="66" y="464" text-anchor="middle">試験</text>
<text class="label" x="102" y="465">試験の場面を先に書く</text>
<text class="note small" x="102" y="485">期待値はページの行から書く</text>
<line class="flow" x1="180" y1="496" x2="180" y2="508"/>
<rect class="box" x="10" y="510" width="340" height="54"/>
<text class="title" x="22" y="532">8</text>
<rect class="badge focus" x="40" y="519" width="52" height="18"/>
<text class="label small focus" x="66" y="532" text-anchor="middle">コード</text>
