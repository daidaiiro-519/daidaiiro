<path class="flow" d="M140,200 V218" fill="none"/>
<rect class="box" x="30" y="220" width="220" height="44"/>
<text class="label small" x="42" y="238">不変条件を確かめる</text>
<text class="note small" x="42" y="255">ドメインモデル</text>
