<svg viewBox="0 0 440 400" role="img" aria-label="契約で入力と出力を守る流れ。AI が引数と JSON ドキュメントを作る。引数を arguments.schema.json で検証する。JSON の引数（JSON Patch ・ answer）と、書く JSON ドキュメントを、それぞれのスキーマと Concrete で検証する。ドメインモデルで不変条件を確かめる。どこかで違反すれば、error のログイベントを出す。error は code ・ instruction ・ next を持ち、error-codes.json の定型から作る。違反が無ければ、event.schema.json の形のログイベントを出す。AI はログイベントを読み、next を実行する">
