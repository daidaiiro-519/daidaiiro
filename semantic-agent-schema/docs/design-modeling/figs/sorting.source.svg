<svg viewBox="0 0 440 360" role="img" aria-label="ステップの担保を決める順。ユースケースの1ステップについて、上から問う。形と値を JSON Schema で書けるなら、機械的（JSON Schema）で、公開された言葉か Concrete に書く。いいえなら、入力から機械的に決まる不変条件か。はいなら機械的（ドメインモデル）で、集約 ・ 値オブジェクト ・ ドメインサービスに書く。いいえなら、意味の判定か生成か。はいなら意味的（ドメインモデル）と意味的（AI）で、x-prompt から procedure を作り、AI が answer を渡す。どれでもなければ処理で、アダプターが読み書き ・ 追記 ・ 描画をする">
<text class="title" x="10" y="22">ステップの担保を決める順：上から問う</text>
