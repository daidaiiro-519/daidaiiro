<path class="flow" d="M115,70 V92" fill="none"/>
<rect class="box" x="10" y="94" width="210" height="40"/>
<text class="label small" x="115" y="119" text-anchor="middle">形と値を JSON Schema で書けるか</text>
<path class="flow" d="M220,114 H246" fill="none"/>
<text class="note small" x="233" y="106" text-anchor="middle">はい</text>
<rect class="box kind-1" x="248" y="94" width="184" height="40"/>
<text class="label small kind-1" x="258" y="110">機械的（JSON Schema）</text>
<text class="note small" x="258" y="127">公開された言葉 ・ Concrete</text>
<path class="flow" d="M115,134 V164" fill="none"/>
<text class="note small" x="123" y="153">いいえ</text>
<rect class="box" x="10" y="166" width="210" height="40"/>
<text class="label small" x="115" y="191" text-anchor="middle">入力から機械的に決まる不変条件か</text>
<path class="flow" d="M220,186 H246" fill="none"/>
<text class="note small" x="233" y="178" text-anchor="middle">はい</text>
<rect class="box kind-1" x="248" y="166" width="184" height="40"/>
<text class="label small kind-1" x="258" y="182">機械的（ドメインモデル）</text>
<text class="note small" x="258" y="199">集約 ・ 値オブジェクトなど</text>
<path class="flow" d="M115,206 V236" fill="none"/>
<text class="note small" x="123" y="225">いいえ</text>
<rect class="box" x="10" y="238" width="210" height="40"/>
<text class="label small" x="115" y="263" text-anchor="middle">意味の判定か生成か</text>
<path class="flow" d="M220,258 H246" fill="none"/>
<text class="note small" x="233" y="250" text-anchor="middle">はい</text>
<rect class="box kind-2" x="248" y="238" width="184" height="40"/>
<text class="label small kind-2" x="258" y="254">意味的（ドメインモデル ・ AI）</text>
<text class="note small" x="258" y="271">procedure を返す</text>
<path class="flow" d="M115,278 V308" fill="none"/>
<text class="note small" x="123" y="297">いいえ</text>
<rect class="box" x="10" y="310" width="210" height="40"/>
<text class="label small" x="115" y="335" text-anchor="middle">どれでもない</text>
<path class="flow" d="M220,330 H246" fill="none"/>
<rect class="box kind-3" x="248" y="310" width="184" height="40"/>
<text class="label small kind-3" x="258" y="326">処理（アダプター）</text>
<text class="note small" x="258" y="343">読み書き ・ 追記 ・ 描画</text>
</svg>
