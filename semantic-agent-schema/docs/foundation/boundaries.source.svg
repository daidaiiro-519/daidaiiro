<svg viewBox="0 0 980 350" width="100%" style="min-width:900px;max-width:980px;display:block;margin:0 auto" role="img" aria-label="7つの境界"><rect class="area" x="10" y="10" width="960" height="96"/><text class="title" x="26" y="38" text-anchor="start">層1 業務領域</text><rect class="box" x="180.0" y="22" width="381.0" height="72"/><text class="label" x="190.0" y="48" text-anchor="start">4 都合で入れない</text><text class="label small" x="190.0" y="68" text-anchor="start">事業の目的に届き、</text><text class="label small" x="190.0" y="83" text-anchor="start">3条件でまとまるものだけ</text><rect class="box" x="573.0" y="22" width="381.0" height="72"/><text class="label" x="583.0" y="48" text-anchor="start">3 集約の中だけが変える</text><text class="label small" x="583.0" y="68" text-anchor="start">外には参照だけ</text><rect class="area" x="10" y="120" width="960" height="96"/><text class="title" x="26" y="148" text-anchor="start">層2 目的レベル</text><rect class="box" x="180.0" y="132" width="381.0" height="72"/><text class="label" x="190.0" y="158" text-anchor="start">5 なぜ？で届くものだけ</text><text class="label small" x="190.0" y="178" text-anchor="start">サブ機能は</text><text class="label small" x="190.0" y="193" text-anchor="start">親を1つに決めない</text><rect class="box" x="573.0" y="132" width="381.0" height="72"/><text class="label" x="583.0" y="158" text-anchor="start">6 分類を混ぜない</text><text class="label small" x="583.0" y="178" text-anchor="start">レベル ・ 範囲 ・ 業務領域 ・</text><text class="label small" x="583.0" y="193" text-anchor="start">区分は別々に持つ</text><rect class="area" x="10" y="230" width="960" height="96"/><text class="title" x="26" y="258" text-anchor="start">層3 文脈</text><rect class="box" x="180.0" y="242" width="250.0" height="72"/><text class="label" x="190.0" y="268" text-anchor="start">1 使う場面を割らない</text><text class="label small" x="190.0" y="288" text-anchor="start">同じデータを扱う</text><text class="label small" x="190.0" y="303" text-anchor="start">まとまりは1つの文脈</text><rect class="box" x="442.0" y="242" width="250.0" height="72"/><text class="label" x="452.0" y="268" text-anchor="start">2 集約を割らない</text><text class="label small" x="452.0" y="288" text-anchor="start">1つの集約は</text><text class="label small" x="452.0" y="303" text-anchor="start">1つの文脈</text><rect class="box" x="704.0" y="242" width="250.0" height="72"/><text class="label" x="714.0" y="268" text-anchor="start">7 中身を取り込まない</text><text class="label small" x="714.0" y="288" text-anchor="start">連係の方法でつなぐ</text></svg>