<svg viewBox="0 0 980 460" width="100%" style="min-width:900px;max-width:980px;display:block;margin:0 auto" role="img" aria-label="13の境界"><rect class="area" x="10" y="10" width="960" height="96"/><text class="title" x="26" y="38" text-anchor="start">層1 業務領域</text><rect class="box" x="180.0" y="22" width="774.0" height="72"/><text class="label" x="190.0" y="48" text-anchor="start">1 都合で入れない</text><text class="label small" x="190.0" y="68" text-anchor="start">事業活動に届き、3条件で</text><text class="label small" x="190.0" y="83" text-anchor="start">まとまるものだけ</text><rect class="area" x="10" y="120" width="960" height="96"/><text class="title" x="26" y="148" text-anchor="start">層2 目的レベル</text><rect class="box" x="180.0" y="132" width="145.2" height="72"/><text class="label" x="190.0" y="158" text-anchor="start">2 なぜ？で届くもの</text><text class="label small" x="190.0" y="178" text-anchor="start">サブ機能は2条件で</text><text class="label small" x="190.0" y="193" text-anchor="start">切り出す</text><rect class="box" x="337.2" y="132" width="145.2" height="72"/><text class="label" x="347.2" y="158" text-anchor="start">3 分類を混ぜない</text><text class="label small" x="347.2" y="178" text-anchor="start">レベル ・ 範囲 ・</text><text class="label small" x="347.2" y="193" text-anchor="start">業務領域は別々</text><rect class="box" x="494.4" y="132" width="145.2" height="72"/><text class="label" x="504.4" y="158" text-anchor="start">4 欄を持たせる</text><text class="label small" x="504.4" y="178" text-anchor="start">どの U にも</text><text class="label small" x="504.4" y="193" text-anchor="start">レベル欄とスコープ欄</text><rect class="box" x="651.5999999999999" y="132" width="145.2" height="72"/><text class="label" x="661.5999999999999" y="158" text-anchor="start">5 低すぎる目的</text><text class="label small" x="661.5999999999999" y="178" text-anchor="start">ユースケースにせず</text><text class="label small" x="661.5999999999999" y="193" text-anchor="start">呼ぶ側の手順に</text><rect class="box" x="808.8" y="132" width="145.2" height="72"/><text class="label" x="818.8" y="158" text-anchor="start">6 1対1にしない</text><text class="label small" x="818.8" y="178" text-anchor="start">U をクラスや</text><text class="label small" x="818.8" y="193" text-anchor="start">フォルダに1つずつ</text><rect class="area" x="10" y="230" width="960" height="96"/><text class="title" x="26" y="258" text-anchor="start">層3 文脈</text><rect class="box" x="180.0" y="242" width="184.5" height="72"/><text class="label" x="190.0" y="268" text-anchor="start">7 まとまりを割らない</text><text class="label small" x="190.0" y="288" text-anchor="start">同じデータを扱う</text><text class="label small" x="190.0" y="303" text-anchor="start">ユースケースの集まり</text><rect class="box" x="376.5" y="242" width="184.5" height="72"/><text class="label" x="386.5" y="268" text-anchor="start">8 競合させない</text><text class="label small" x="386.5" y="288" text-anchor="start">1つの文脈に</text><text class="label small" x="386.5" y="303" text-anchor="start">競合するモデルを入れない</text><rect class="box" x="573.0" y="242" width="184.5" height="72"/><text class="label" x="583.0" y="268" text-anchor="start">9 連係を明示する</text><text class="label small" x="583.0" y="288" text-anchor="start">中核を含む下流は</text><text class="label small" x="583.0" y="303" text-anchor="start">従属しない</text><rect class="box" x="769.5" y="242" width="184.5" height="72"/><text class="label" x="779.5" y="268" text-anchor="start">10 1文脈1チーム</text><text class="label small" x="779.5" y="288" text-anchor="start">1つの文脈を</text><text class="label small" x="779.5" y="303" text-anchor="start">複数で持たない</text><rect class="area" x="10" y="340" width="960" height="96"/><text class="title" x="26" y="368" text-anchor="start">層3 集約</text><rect class="box" x="180.0" y="352" width="250.0" height="72"/><text class="label" x="190.0" y="378" text-anchor="start">11 集約を割らない</text><text class="label small" x="190.0" y="398" text-anchor="start">1つの集約は</text><text class="label small" x="190.0" y="413" text-anchor="start">1つの文脈</text><rect class="box" x="442.0" y="352" width="250.0" height="72"/><text class="label" x="452.0" y="378" text-anchor="start">12 中だけが変える</text><text class="label small" x="452.0" y="398" text-anchor="start">集約の状態は</text><text class="label small" x="452.0" y="413" text-anchor="start">中の業務ロジックだけ</text><rect class="box" x="704.0" y="352" width="250.0" height="72"/><text class="label" x="714.0" y="378" text-anchor="start">13 1回に1つ</text><text class="label small" x="714.0" y="398" text-anchor="start">1つのトランザクションで</text><text class="label small" x="714.0" y="413" text-anchor="start">変える集約は1つ</text></svg>