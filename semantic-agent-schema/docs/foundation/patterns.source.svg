<svg viewBox="0 0 980 460" width="100%" style="min-width:900px;max-width:980px;display:block;margin:0 auto" role="img" aria-label="層ごとのパターン"><rect class="area" x="10" y="10" width="960" height="96"/><text class="title" x="26" y="38" text-anchor="start">層1 業務領域</text><rect class="box" x="180.0" y="22" width="774.0" height="72"/><text class="label" x="190.0" y="48" text-anchor="start">細分化</text><text class="label small" x="190.0" y="68" text-anchor="start">事業活動を、3条件でまとまるまで分ける</text><text class="label small" x="190.0" y="83" text-anchor="start">中核はできる限り正確に区切る</text><rect class="area" x="10" y="120" width="960" height="96"/><text class="title" x="26" y="148" text-anchor="start">層2 目的レベル</text><rect class="box" x="180.0" y="132" width="250.0" height="72"/><text class="label" x="190.0" y="158" text-anchor="start">要約 → 目的 → サブ機能</text><text class="label small" x="190.0" y="178" text-anchor="start">サブ機能は、読みやすさか</text><text class="label small" x="190.0" y="193" text-anchor="start">再利用のときだけ</text><rect class="box" x="442.0" y="132" width="250.0" height="72"/><text class="label" x="452.0" y="158" text-anchor="start">なぜ？で上げる</text><text class="label small" x="452.0" y="178" text-anchor="start">手順をまとめて</text><text class="label small" x="452.0" y="193" text-anchor="start">1つ上の目的にする</text><rect class="box" x="704.0" y="132" width="250.0" height="72"/><text class="label" x="714.0" y="158" text-anchor="start">一番外側に要約</text><text class="label small" x="714.0" y="178" text-anchor="start">設計の範囲の軸。</text><text class="label small" x="714.0" y="193" text-anchor="start">いつも書くのを勧める</text><rect class="area" x="10" y="230" width="960" height="96"/><text class="title" x="26" y="258" text-anchor="start">層3 文脈の線</text><rect class="box focus" x="180.0" y="242" width="250.0" height="72"/><text class="label focus" x="190.0" y="268" text-anchor="start">広い1つの文脈</text><text class="label small" x="190.0" y="288" text-anchor="start">最初はこれ</text><rect class="box" x="442.0" y="242" width="250.0" height="72"/><text class="label" x="452.0" y="268" text-anchor="start">部分木を切り出す</text><text class="label small" x="452.0" y="288" text-anchor="start">言葉 ・ チームが</text><text class="label small" x="452.0" y="303" text-anchor="start">分かれたら</text><rect class="box" x="704.0" y="242" width="250.0" height="72"/><text class="label" x="714.0" y="268" text-anchor="start">複数のモデル</text><text class="label small" x="714.0" y="288" text-anchor="start">1つの業務領域でも、</text><text class="label small" x="714.0" y="303" text-anchor="start">別々の文脈に置く</text><rect class="area" x="10" y="340" width="960" height="96"/><text class="title" x="26" y="368" text-anchor="start">層3 文脈どうし</text><rect class="box" x="180.0" y="352" width="250.0" height="72"/><text class="label" x="190.0" y="378" text-anchor="start">連係を選ぶ</text><text class="label small" x="190.0" y="398" text-anchor="start">共用サービス ・ 変換装置 ・</text><text class="label small" x="190.0" y="413" text-anchor="start">従属 ・ 良きパートナー</text><rect class="box" x="442.0" y="352" width="250.0" height="72"/><text class="label" x="452.0" y="378" text-anchor="start">互いに独立</text><text class="label small" x="452.0" y="398" text-anchor="start">一般 ・ 補完だけ</text><rect class="box" x="704.0" y="352" width="250.0" height="72"/><text class="label" x="714.0" y="378" text-anchor="start">モデルの共有</text><text class="label small" x="714.0" y="398" text-anchor="start">例外。1チームが</text><text class="label small" x="714.0" y="413" text-anchor="start">複数の文脈を持つとき</text></svg>