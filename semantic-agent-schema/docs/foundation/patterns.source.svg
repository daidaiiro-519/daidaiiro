<svg viewBox="0 0 980 350" width="100%" style="min-width:900px;max-width:980px;display:block;margin:0 auto" role="img" aria-label="層ごとのパターン"><rect class="area" x="10" y="10" width="960" height="96"/><text class="title" x="26" y="38" text-anchor="start">層1 業務領域</text><rect class="box" x="180.0" y="22" width="381.0" height="72"/><text class="label" x="190.0" y="48" text-anchor="start">細分化</text><text class="label small" x="190.0" y="68" text-anchor="start">3条件でまとまるまで分ける</text><text class="label small" x="190.0" y="83" text-anchor="start">分けても区分が同じなら止める</text><rect class="box" x="573.0" y="22" width="381.0" height="72"/><text class="label" x="583.0" y="48" text-anchor="start">1つの業務領域に複数のモデル</text><text class="label small" x="583.0" y="68" text-anchor="start">課題ごとに素直なとき</text><rect class="area" x="10" y="120" width="960" height="96"/><text class="title" x="26" y="148" text-anchor="start">層2 目的レベル</text><rect class="box" x="180.0" y="132" width="381.0" height="72"/><text class="label" x="190.0" y="158" text-anchor="start">要約 → 目的 → サブ機能</text><text class="label small" x="190.0" y="178" text-anchor="start">いつも。どれにも</text><text class="label small" x="190.0" y="193" text-anchor="start">レベルの印を付ける</text><rect class="box" x="573.0" y="132" width="381.0" height="72"/><text class="label" x="583.0" y="158" text-anchor="start">範囲を広げて上に要約</text><text class="label small" x="583.0" y="178" text-anchor="start">組み合わせで</text><text class="label small" x="583.0" y="193" text-anchor="start">新しい上位の目的</text><rect class="area" x="10" y="230" width="960" height="96"/><text class="title" x="26" y="258" text-anchor="start">層3 文脈</text><rect class="box focus" x="180.0" y="242" width="145.2" height="72"/><text class="label focus" x="190.0" y="268" text-anchor="start">広い1つの文脈</text><text class="label small" x="190.0" y="288" text-anchor="start">最初はこれ</text><rect class="box" x="337.2" y="242" width="145.2" height="72"/><text class="label" x="347.2" y="268" text-anchor="start">部分木を切り出す</text><text class="label small" x="347.2" y="288" text-anchor="start">言葉 ・ チームが</text><text class="label small" x="347.2" y="303" text-anchor="start">分かれたら</text><rect class="box" x="494.4" y="242" width="145.2" height="72"/><text class="label" x="504.4" y="268" text-anchor="start">上流 ・ 下流で連係</text><text class="label small" x="504.4" y="288" text-anchor="start">中身は取り込まない</text><rect class="box" x="651.5999999999999" y="242" width="145.2" height="72"/><text class="label" x="661.5999999999999" y="268" text-anchor="start">互いに独立</text><text class="label small" x="661.5999999999999" y="288" text-anchor="start">一般 ・ 補完だけ</text><rect class="box warn" x="808.8" y="242" width="145.2" height="72"/><text class="label warn" x="818.8" y="268" text-anchor="start">モデルの共有</text><text class="label small" x="818.8" y="288" text-anchor="start">使わない</text></svg>