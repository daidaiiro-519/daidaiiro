<svg viewBox="0 0 1078 476" width="100%" style="min-width:1018px;max-width:1078px;display:block;margin:0 auto" role="img" aria-label="業務領域のフォルダと、置く使う場面"><text class="note" x="105.0" y="24" text-anchor="middle">業務領域のフォルダ</text><text class="note" x="246.0" y="24" text-anchor="middle">区分</text><text class="note" x="407.0" y="24" text-anchor="middle">domain に置くもの</text><text class="note" x="680.0" y="24" text-anchor="middle">use_cases に置くユーザー目的</text><text class="note" x="953.0" y="24" text-anchor="middle">中に置くサブ機能</text><rect class="box focus" x="10" y="36" width="190" height="50"/><text class="label focus" x="18" y="56" text-anchor="start">declaration</text><text class="label small" x="18" y="74" text-anchor="start">意味の宣言</text><rect class="box" x="208" y="36" width="76" height="50"/><text class="label small" x="246.0" y="65" text-anchor="middle">中核</text><rect class="box" x="292" y="36" width="230" height="50"/><text class="label small" x="300" y="56" text-anchor="start">Abstract ・ Concrete ・ glossary</text><text class="label small" x="300" y="73" text-anchor="start">任せる先</text><rect class="box" x="530" y="36" width="300" height="50"/><text class="label small" x="538" y="56" text-anchor="start">U1 Concrete を作る</text><text class="label small" x="538" y="73" text-anchor="start">U2 Concrete を変える（U23 ・ U24 は中の手順）</text><rect class="box" x="838" y="36" width="230" height="50"/><text class="label small" x="846" y="56" text-anchor="start">手順を返す（セマンティック）</text><rect class="box focus" x="10" y="94" width="190" height="50"/><text class="label focus" x="18" y="114" text-anchor="start">validation</text><text class="label small" x="18" y="132" text-anchor="start">意味の検証</text><rect class="box" x="208" y="94" width="76" height="50"/><text class="label small" x="246.0" y="123" text-anchor="middle">中核</text><rect class="box" x="292" y="94" width="230" height="50"/><text class="label small" x="300" y="114" text-anchor="start">Resolver ・ Validator</text><text class="label small" x="300" y="131" text-anchor="start">呼び出し（call）</text><rect class="box" x="530" y="94" width="300" height="50"/><text class="label small" x="538" y="114" text-anchor="start">U8 すべてを検証する</text><text class="label small" x="538" y="131" text-anchor="start">U10 判定を取り直す ・ U14 validator をつなぐ</text><rect class="box" x="838" y="94" width="230" height="50"/><text class="label small" x="846" y="114" text-anchor="start">検証する</text><rect class="box focus" x="10" y="152" width="190" height="50"/><text class="label focus" x="18" y="172" text-anchor="start">instance</text><text class="label small" x="18" y="190" text-anchor="start">instance の作成と変更</text><rect class="box" x="208" y="152" width="76" height="50"/><text class="label small" x="246.0" y="181" text-anchor="middle">補完</text><rect class="box" x="292" y="152" width="230" height="50"/><text class="label small" x="300" y="172" text-anchor="start">インスタンス</text><rect class="box" x="530" y="152" width="300" height="50"/><text class="label small" x="538" y="172" text-anchor="start">U5 作る ・ U6 変える（U7 は U6 の拡張）</text><text class="label small" x="538" y="189" text-anchor="start">U11 置き換えて残す ・ U17 取り込む</text><rect class="boundary" x="838" y="152" width="230" height="50"/><text class="label small" x="846" y="172" text-anchor="start"></text><rect class="box focus" x="10" y="210" width="190" height="50"/><text class="label focus" x="18" y="230" text-anchor="start">change</text><text class="label small" x="18" y="248" text-anchor="start">変更の確かめと例外の判断</text><rect class="box" x="208" y="210" width="76" height="50"/><text class="label small" x="246.0" y="239" text-anchor="middle">中核</text><rect class="box" x="292" y="210" width="230" height="50"/><text class="label small" x="300" y="230" text-anchor="start">変更の記録 ・ 判定の記録</text><rect class="box" x="530" y="210" width="300" height="50"/><text class="label small" x="538" y="230" text-anchor="start">U13 経緯を確かめる ・ U16 承認する</text><text class="label small" x="538" y="247" text-anchor="start">U18 ほかの変更を取り込む ・ U25 変更を確かめる</text><rect class="box" x="838" y="210" width="230" height="50"/><text class="label small" x="846" y="230" text-anchor="start">変更を記録する ・ まとめを作る</text><rect class="box focus" x="10" y="268" width="190" height="50"/><text class="label focus" x="18" y="288" text-anchor="start">render</text><text class="label small" x="18" y="306" text-anchor="start">描画</text><rect class="box" x="208" y="268" width="76" height="50"/><text class="label small" x="246.0" y="297" text-anchor="middle">補完</text><rect class="box" x="292" y="268" width="230" height="50"/><text class="label small" x="300" y="288" text-anchor="start">ビュー ・ デザインシステム</text><rect class="box" x="530" y="268" width="300" height="50"/><text class="label small" x="538" y="288" text-anchor="start">U12 人が読む形で読む</text><rect class="boundary" x="838" y="268" width="230" height="50"/><text class="label small" x="846" y="288" text-anchor="start"></text><rect class="box focus" x="10" y="326" width="190" height="50"/><text class="label focus" x="18" y="346" text-anchor="start">search</text><text class="label small" x="18" y="364" text-anchor="start">意味で探す</text><rect class="box" x="208" y="326" width="76" height="50"/><text class="label small" x="246.0" y="355" text-anchor="middle">中核</text><rect class="box" x="292" y="326" width="230" height="50"/><text class="label small" x="300" y="346" text-anchor="start">Query ・ Scope ・ Provenance</text><rect class="box" x="530" y="326" width="300" height="50"/><text class="label small" x="538" y="346" text-anchor="start">U26 探す範囲を宣言する ・ U28 答える</text><text class="label small" x="538" y="363" text-anchor="start">（ステップ6）</text><rect class="boundary" x="838" y="326" width="230" height="50"/><text class="label small" x="846" y="346" text-anchor="start"></text><rect class="boundary" x="10" y="384" width="190" height="50"/><text class="label" x="18" y="404" text-anchor="start">session ほか</text><text class="label small" x="18" y="422" text-anchor="start">セッション ・ 公開 ・ 移行</text><rect class="boundary" x="208" y="384" width="76" height="50"/><text class="label small" x="246.0" y="413" text-anchor="middle">中核 ・ 補完</text><rect class="boundary" x="292" y="384" width="230" height="50"/><text class="label small" x="300" y="404" text-anchor="start">（使うステップで作る）</text><rect class="boundary" x="530" y="384" width="300" height="50"/><text class="label small" x="538" y="404" text-anchor="start">U27（要約）・ U4 版を出す ・ U3 合わせる</text><text class="label small" x="538" y="421" text-anchor="start">（ステップ7b ・ 9）</text><rect class="boundary" x="838" y="384" width="230" height="50"/><text class="label small" x="846" y="404" text-anchor="start"></text><text class="note" x="10" y="468" text-anchor="start">U0（要約）は application の目次に書く。一般の業務領域（保存と版の管理 ・ AI と外のツールによる判定）はアダプターの側に置く</text></svg>