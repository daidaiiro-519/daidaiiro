<svg viewBox="0 0 1190 600" width="100%" style="min-width:1040px;max-width:1190px;display:block;margin:0 auto" role="img" aria-label="ヘキサゴナル：入口が値で渡し、各モジュールが使うポートを宣言し、アダプターが実装する" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .area{fill:var(--dsvg-area-fill,#FFFFFF);stroke:var(--dsvg-line,#7C8C86)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.kind-2{fill:var(--dsvg-kind-2-bg,#DCE7F1);stroke:var(--dsvg-kind-2,#2F5B80)}.dsvg .title.kind-2{fill:var(--dsvg-kind-2,#2F5B80);font-size:13px;font-weight:700}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label.small{fill:var(--dsvg-ink,#111D1A);font-size:10px}.dsvg .boundary{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg #dsvg-d6db38f8-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-line:#62756F;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-line:#62756F;--dsvg-ink-soft:#9DADA8;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-kind-2-bg:#182A3A;--dsvg-kind-2:#8FB8DE;--dsvg-box-fill:#16211E}</style><defs data-dsvg="marker"><marker id="dsvg-d6db38f8-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="1190.0" height="600.0" fill="#FFFFFF" rx="8"/><path class="area" d="M250,300 L350,40 L660,40 L760,300 L660,560 L350,560 Z" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1"/><text class="note" x="505" y="66" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">コア（domain と application）</text><rect class="box focus" x="330" y="150" width="350" height="100" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title focus" x="345" y="174" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">application（使う場面）</text><text class="label" x="345" y="196" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">モジュールごとの use_cases</text><text class="label" x="345" y="213" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ユーザー目的とサブ機能</text><text class="label" x="345" y="230" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">使うポート（ports）を自分で宣言する</text><rect class="box kind-2" x="360" y="300" width="290" height="90" fill="#DCE7F1" stroke="#2F5B80" stroke-width="1.5" rx="5"/><text class="title kind-2" x="375" y="324" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#2F5B80">domain（概念）</text><text class="label" x="375" y="346" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">集約 ・ 値 ・ ドメインサービス</text><text class="label" x="375" y="364" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">複数のモジュールが使う判断も置く</text><text class="label" x="375" y="382" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">ポートを知らない</text><path class="flow" d="M480,250 V298" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><path class="flow" d="M530,298 V252" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><text class="note" x="95" y="110" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">駆動する側（inbound）</text><rect class="box" x="10" y="160" width="170" height="56" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="22" y="182" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">CLI</text><text class="label small" x="22" y="202" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">人 ・ CI</text><path class="flow" d="M180,188 H328" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><rect class="boundary" x="10" y="250" width="170" height="56" fill="none" stroke="#5B6B66" stroke-width="1.5" stroke-dasharray="4 3" rx="5"/><text class="title" x="22" y="272" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">API など</text><text class="label small" x="22" y="292" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">ほかのシステム</text><path class="flow" d="M180,278 H328" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><text class="label small" x="10" y="140" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">外の入力を読み取り、値で渡す</text><text class="note" x="885" y="26" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">駆動される側のポート（宣言するモジュール）</text><text class="note" x="1110" y="26" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">outbound</text><rect class="box" x="770" y="104" width="230" height="52" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="782" y="125" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更を記録に足す</text><text class="label small" x="782" y="144" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">モジュール A</text><rect class="box" x="1040" y="112" width="140" height="100" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label small" x="1110" y="166" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">db</text><path class="flow" d="M1040,130 H1002" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><rect class="box" x="770" y="168" width="230" height="52" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="782" y="189" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">検証を記録に足す</text><text class="label small" x="782" y="208" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">モジュール B</text><path class="flow" d="M1040,194 H1002" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><rect class="box" x="770" y="232" width="230" height="52" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="782" y="253" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">文書を読む</text><text class="label small" x="782" y="272" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">モジュール C</text><rect class="box" x="1040" y="240" width="140" height="36" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label small" x="1110" y="262" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">fs</text><path class="flow" d="M1040,258 H1002" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><path class="flow" d="M680,200 H768" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-d6db38f8-arrow-5B6B66)"/><text class="label small" x="10" y="580" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">ポートは、それを使うユースケースを持つモジュールの application が宣言する。1つのアダプター（db）が複数のモジュールのポートを実装してよい。矢印はアダプター → ポート（実装する向き）</text></svg>