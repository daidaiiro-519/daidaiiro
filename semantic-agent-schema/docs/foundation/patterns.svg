gino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">一番外側に要約</text><text class="label small" x="714.0" y="178" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">設計の範囲の軸。</text><text class="label small" x="714.0" y="193" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">いつも書くのを勧める</text><rect class="area" x="10" y="230" width="960" height="96" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="26" y="258" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">層3 文脈の線</text><rect class="box focus" x="180.0" y="242" width="250.0" height="72" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label focus" x="190.0" y="268" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">広い1つの文脈</text><text class="label small" x="190.0" y="288" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">最初はこれ</text><rect class="box" x="442.0" y="242" width="250.0" height="72" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="452.0" y="268" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">部分木を切り出す</text><text class="label small" x="452.0" y="288" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">言葉 ・ チームが</text><text class="label small" x="452.0" y="303" text-anchor="start" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="10" fill="#111D1A">分かれたら</text><rect class="box" x="704.0" y="242" width="250.0" height="72" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="714.0" y="268" tex