<svg viewBox="0 0 1000 540" width="100%" style="min-width:920px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="ディレクトリ：リポジトリの根の直下に文脈の名前のフォルダ。その中に業務領域を作るモジュールと adapters"><text class="title" x="10" y="30" text-anchor="start">&lt;リポジトリの根&gt;/</text><text class="note" x="190" y="30" text-anchor="start">製品の置き場。製品全体のもの（ビルドの設定 ・ docs/ など）と文脈のフォルダを置き、文脈の根にしない</text><rect class="area" x="10" y="50" width="980" height="478"/><text class="title" x="26" y="76" text-anchor="start">&lt;文脈&gt;/</text><text class="note" x="110" y="76" text-anchor="start">文脈の根（文脈の名前のフォルダ）。文脈が1つでもここ。中はポートとアダプターで作る</text><rect class="box focus" x="26" y="92" width="608" height="80"/><text class="label focus" x="38" y="122" text-anchor="start">&lt;モジュール A&gt;/</text><text class="label small" x="38" y="144" text-anchor="start">業務領域を作る</text><rect class="box kind-2" x="236" y="104" width="80" height="56"/><text class="label small" x="276" y="137" text-anchor="middle">domain</text><rect class="box" x="326" y="104" width="298" height="56"/><text class="label small" x="338" y="126" text-anchor="start">application：use_cases ・ ports</text><text class="label small" x="338" y="148" text-anchor="start">ports：A のユースケースが使うものだけ</text><rect class="box focus" x="26" y="188" width="608" height="80"/><text class="label focus" x="38" y="218" text-anchor="start">&lt;モジュール B&gt;/</text><text class="label small" x="38" y="240" text-anchor="start">業務領域を作る</text><rect class="box kind-2" x="236" y="200" width="80" height="56"/><text class="label small" x="276" y="233" text-anchor="middle">domain</text><rect class="box" x="326" y="200" width="298" height="56"/><text class="label small" x="338" y="222" text-anchor="start">application：use_cases ・ ports</text><text class="label small" x="338" y="244" text-anchor="start">ports：B のユースケースが使うものだけ</text><rect class="box focus" x="26" y="284" width="608" height="80"/><text class="label focus" x="38" y="314" text-anchor="start">&lt;モジュール C&gt;/</text><text class="label small" x="38" y="336" text-anchor="start">domain の無いモジュール</text><rect class="box" x="326" y="296" width="298" height="56"/><text class="label small" x="338" y="318" text-anchor="start">application：use_cases ・ ports</text><text class="label small" x="338" y="340" text-anchor="start">ports：C のユースケースが使うものだけ</text><text class="note" x="26" y="400" text-anchor="start">domain：集約 ・ 値 ・ ドメインサービス。複数のモジュールが使う判断と値もここ。ポートを知らない</text><text class="note" x="26" y="426" text-anchor="start">application：ほかのモジュールの application（ポートもユースケースも）に依存しない</text><text class="note" x="26" y="452" text-anchor="start">ポートは使うユースケースから見つけ、使うモジュールが宣言する。共有の置き場は作らない</text><text class="note" x="26" y="478" text-anchor="start">文脈の根に domain を置かない。domain は守る条件が確かめられたモジュールだけが持つ</text><text class="note" x="26" y="504" text-anchor="start">ユースケース1つにつき1ファイルにしない。目的レベルでフォルダを分けない</text><rect class="area" x="650" y="92" width="324" height="320"/><text class="title" x="666" y="118" text-anchor="start">adapters/</text><text class="note" x="776" y="118" text-anchor="start">六角形の外側</text><text class="label" x="666" y="152" text-anchor="start">inbound/</text><rect class="box" x="666" y="162" width="292" height="66"/><text class="label" x="678" y="184" text-anchor="start">入口（CLI ・ API など）</text><text class="label small" x="678" y="203" text-anchor="start">誰が呼んだかなどの外の入力を読み取り、</text><text class="label small" x="678" y="220" text-anchor="start">値でユースケースへ渡す</text><text class="label" x="666" y="262" text-anchor="start">outbound/</text><rect class="box" x="666" y="272" width="292" height="66"/><text class="label" x="678" y="294" text-anchor="start">ポートの実装（db ・ fs など）</text><text class="label small" x="678" y="313" text-anchor="start">1つで複数のモジュールの</text><text class="label small" x="678" y="330" text-anchor="start">ポートを実装してよい</text><rect class="box" x="666" y="350" width="292" height="56"/><text class="label" x="678" y="372" text-anchor="start">外の仕組みへのアダプター</text><text class="label small" x="678" y="392" text-anchor="start">連係の型（従属 ・ 変換）を明示</text></svg>
