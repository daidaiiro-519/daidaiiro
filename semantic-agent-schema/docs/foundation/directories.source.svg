<svg viewBox="0 0 1000 500" width="100%" style="min-width:920px;max-width:1000px;display:block;margin:0 auto" role="img" aria-label="ディレクトリ：1つの文脈の中の形。core の業務領域ごとの domain と application、inbound と outbound"><text class="title" x="10" y="30" text-anchor="start">&lt;文脈の根&gt;/</text><text class="note" x="170" y="30" text-anchor="start">文脈が1つならリポジトリの根、複数なら contexts/&lt;文脈&gt;/。この下は1つの文脈の中の形</text><rect class="area" x="10" y="50" width="640" height="440"/><text class="title" x="26" y="76" text-anchor="start">core/</text><text class="note" x="110" y="76" text-anchor="start">六角形の内側（区分の「中核」とは別）。業務領域ごとに分ける</text><rect class="box focus" x="26" y="92" width="608" height="80"/><text class="label focus" x="38" y="122" text-anchor="start">&lt;業務領域 A&gt;/</text><text class="label small" x="38" y="144" text-anchor="start">中核の例。ポートを持つ</text><rect class="box kind-2" x="236" y="104" width="80" height="56"/><text class="label small" x="276" y="137" text-anchor="middle">domain</text><rect class="box" x="326" y="104" width="298" height="56"/><text class="label small" x="338" y="126" text-anchor="start">application：use_cases ・ ports</text><text class="label small" x="338" y="148" text-anchor="start">ports：その会話を受け持つものだけ</text><rect class="box focus" x="26" y="188" width="608" height="80"/><text class="label focus" x="38" y="218" text-anchor="start">&lt;業務領域 B&gt;/</text><text class="label small" x="38" y="240" text-anchor="start">補完の例</text><rect class="box kind-2" x="236" y="200" width="80" height="56"/><text class="label small" x="276" y="233" text-anchor="middle">domain</text><rect class="box" x="326" y="200" width="298" height="56"/><text class="label small" x="338" y="233" text-anchor="start">application：use_cases</text><rect class="box focus" x="26" y="284" width="608" height="80"/><text class="label focus" x="38" y="314" text-anchor="start">&lt;業務領域 C&gt;/</text><text class="label small" x="38" y="336" text-anchor="start">外の仕組みに依頼する会話を受け持つ</text><rect class="box kind-2" x="236" y="296" width="80" height="56"/><text class="label small" x="276" y="329" text-anchor="middle">domain</text><rect class="box" x="326" y="296" width="298" height="56"/><text class="label small" x="338" y="318" text-anchor="start">application：use_cases ・ ports</text><text class="label small" x="338" y="340" text-anchor="start">ports：外の仕組みに依頼する</text><text class="note" x="26" y="400" text-anchor="start">domain：集約 ・ 値 ・ ドメインサービス。ポートを知らない</text><text class="note" x="26" y="424" text-anchor="start">application：ユースケースの手順（use_cases）と外に依頼する約束（ports）</text><text class="note" x="26" y="448" text-anchor="start">ポートは会話を受け持つ業務領域に置き、共有の置き場は作らない</text><text class="note" x="26" y="472" text-anchor="start">ユースケース1つにつき1ファイルにしない。目的レベルでフォルダを分けない</text><rect class="area" x="660" y="50" width="330" height="440"/><text class="title" x="676" y="76" text-anchor="start">外側</text><text class="note" x="740" y="76" text-anchor="start">六角形の外側</text><text class="label" x="676" y="114" text-anchor="start">inbound/</text><rect class="box" x="676" y="124" width="298" height="50"/><text class="label" x="688" y="145" text-anchor="start">入口（CLI ・ API など）</text><text class="label small" x="688" y="164" text-anchor="start">コマンド → ユースケース ・ 起動時の結合</text><text class="label" x="676" y="206" text-anchor="start">outbound/</text><rect class="box" x="676" y="216" width="298" height="50"/><text class="label" x="688" y="237" text-anchor="start">ポートの実装（db ・ fs など）</text><text class="label small" x="688" y="256" text-anchor="start">外の技術を1つずつ</text><rect class="box" x="676" y="278" width="298" height="50"/><text class="label" x="688" y="299" text-anchor="start">外の仕組みへのアダプター</text><text class="label small" x="688" y="318" text-anchor="start">連係の型（従属 ・ 変換）を明示</text></svg>