<svg viewBox="0 0 1190 600" width="100%" style="min-width:1040px;max-width:1190px;display:block;margin:0 auto" role="img" aria-label="ヘキサゴナル：入口が値で渡し、各モジュールが使うポートを宣言し、アダプターが実装する"><path class="area" d="M250,300 L350,40 L660,40 L760,300 L660,560 L350,560 Z"/><text class="note" x="505" y="66" text-anchor="middle">コア（domain と application）</text><rect class="box focus" x="330" y="150" width="350" height="100"/><text class="title focus" x="345" y="174" text-anchor="start">application（使う場面）</text><text class="label" x="345" y="196" text-anchor="start">モジュールごとの use_cases</text><text class="label" x="345" y="213" text-anchor="start">ユーザー目的とサブ機能</text><text class="label" x="345" y="230" text-anchor="start">使うポート（ports）を自分で宣言する</text><rect class="box kind-2" x="360" y="300" width="290" height="90"/><text class="title kind-2" x="375" y="324" text-anchor="start">domain（概念）</text><text class="label" x="375" y="346" text-anchor="start">集約 ・ 値 ・ ドメインサービス</text><text class="label" x="375" y="364" text-anchor="start">複数のモジュールが使う判断も置く</text><text class="label" x="375" y="382" text-anchor="start">ポートを知らない</text><path class="flow" d="M480,250 V298"/><path class="flow" d="M530,298 V252"/><text class="note" x="95" y="110" text-anchor="middle">駆動する側（inbound）</text><rect class="box" x="10" y="160" width="170" height="56"/><text class="title" x="22" y="182" text-anchor="start">CLI</text><text class="label small" x="22" y="202" text-anchor="start">人 ・ CI</text><path class="flow" d="M180,188 H328"/><rect class="boundary" x="10" y="250" width="170" height="56"/><text class="title" x="22" y="272" text-anchor="start">API など</text><text class="label small" x="22" y="292" text-anchor="start">ほかのシステム</text><path class="flow" d="M180,278 H328"/><text class="label small" x="10" y="140" text-anchor="start">外の入力を読み取り、値で渡す</text><text class="note" x="885" y="26" text-anchor="middle">駆動される側のポート（宣言するモジュール）</text><text class="note" x="1110" y="26" text-anchor="middle">outbound</text><rect class="box" x="770" y="104" width="230" height="52"/><text class="label" x="782" y="125" text-anchor="start">変更を記録に足す</text><text class="label small" x="782" y="144" text-anchor="start">モジュール A</text><rect class="box" x="1040" y="112" width="140" height="100"/><text class="label small" x="1110" y="166" text-anchor="middle">db</text><path class="flow" d="M1040,130 H1002"/><rect class="box" x="770" y="168" width="230" height="52"/><text class="label" x="782" y="189" text-anchor="start">検証を記録に足す</text><text class="label small" x="782" y="208" text-anchor="start">モジュール B</text><path class="flow" d="M1040,194 H1002"/><rect class="box" x="770" y="232" width="230" height="52"/><text class="label" x="782" y="253" text-anchor="start">文書を読む</text><text class="label small" x="782" y="272" text-anchor="start">モジュール C</text><rect class="box" x="1040" y="240" width="140" height="36"/><text class="label small" x="1110" y="262" text-anchor="middle">fs</text><path class="flow" d="M1040,258 H1002"/><path class="flow" d="M680,200 H768"/><text class="label small" x="10" y="580" text-anchor="start">ポートは、それを使うユースケースを持つモジュールの application が宣言する。1つのアダプター（db）が複数のモジュールのポートを実装してよい。矢印はアダプター → ポート（実装する向き）</text></svg>