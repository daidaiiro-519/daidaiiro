<svg viewBox="0 0 1080 600" width="100%" style="min-width:960px;max-width:1080px;display:block;margin:0 auto" role="img" aria-label="ヘキサゴナル：入口が値で渡し、各モジュールが使うポートを宣言し、アダプターが実装する"><path class="area" d="M250,300 L350,40 L660,40 L760,300 L660,560 L350,560 Z"/><text class="note" x="505" y="66" text-anchor="middle">コア（domain と application）</text><rect class="box focus" x="330" y="104" width="290" height="180"/><text class="title focus" x="345" y="128" text-anchor="start">application（使う場面）</text><text class="label" x="345" y="152" text-anchor="start">モジュールごとの use_cases</text><text class="label" x="345" y="170" text-anchor="start">ユーザー目的とサブ機能</text><text class="label" x="345" y="188" text-anchor="start">使うポート（ports）を自分で宣言する</text><rect class="box kind-2" x="360" y="330" width="290" height="90"/><text class="title kind-2" x="375" y="354" text-anchor="start">domain（概念）</text><text class="label" x="375" y="376" text-anchor="start">集約 ・ 値 ・ ドメインサービス</text><text class="label" x="375" y="394" text-anchor="start">複数のモジュールが使う判断も置く</text><text class="label" x="375" y="412" text-anchor="start">ポートを知らない</text><path class="flow" d="M475,284 V328"/><text class="note" x="95" y="96" text-anchor="middle">駆動する側（inbound）</text><text class="label small" x="10" y="122" text-anchor="start">外の入力を読み取り、値で渡す</text><rect class="box" x="10" y="140" width="170" height="56"/><text class="title" x="22" y="162" text-anchor="start">CLI</text><text class="label small" x="22" y="182" text-anchor="start">人 ・ CI</text><path class="flow" d="M180,168 H328"/><rect class="boundary" x="10" y="214" width="170" height="56"/><text class="title" x="22" y="236" text-anchor="start">API など</text><text class="label small" x="22" y="256" text-anchor="start">ほかのシステム</text><path class="flow" d="M180,242 H328"/><text class="note" x="750" y="26" text-anchor="middle">駆動される側のポート（宣言するモジュール）</text><text class="note" x="970" y="26" text-anchor="middle">outbound</text><rect class="box" x="650" y="104" width="200" height="52"/><text class="label" x="662" y="125" text-anchor="start">変更を記録に足す</text><text class="label small" x="662" y="144" text-anchor="start">モジュール A</text><path class="flow" d="M620,130 H648"/><rect class="box" x="650" y="168" width="200" height="52"/><text class="label" x="662" y="189" text-anchor="start">検証を記録に足す</text><text class="label small" x="662" y="208" text-anchor="start">モジュール B</text><path class="flow" d="M620,194 H648"/><rect class="box" x="650" y="232" width="200" height="52"/><text class="label" x="662" y="253" text-anchor="start">文書を読む</text><text class="label small" x="662" y="272" text-anchor="start">モジュール C</text><path class="flow" d="M620,258 H648"/><rect class="box" x="900" y="112" width="140" height="100"/><text class="label small" x="970" y="166" text-anchor="middle">db</text><path class="flow" d="M900,130 H852"/><path class="flow" d="M900,194 H852"/><rect class="box" x="900" y="240" width="140" height="36"/><text class="label small" x="970" y="262" text-anchor="middle">fs</text><path class="flow" d="M900,258 H852"/><text class="label small" x="10" y="574" text-anchor="start">ポートは、それを使うユースケースを持つモジュールの application が宣言し、六角形の縁に置く。1つのアダプター（db）が複数のモジュールのポートを実装してよい</text><text class="label small" x="10" y="592" text-anchor="start">矢印は、呼び出しと依存の向き（入口 → application → ポート ・ application → domain）と、実装する向き（アダプター → ポート）</text></svg>