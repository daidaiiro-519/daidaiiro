<svg viewBox="0 0 900 250" width="100%" style="min-width:760px;max-width:900px;display:block;margin:0 auto" role="img" aria-label="業務領域は見つけ、区切られた文脈は設計する"><rect class="area" x="10" y="10" width="880" height="96"/><text class="title" x="26" y="34" text-anchor="start">問題の側：業務領域（見つけるもの）</text><rect class="box kind-1" x="26" y="48" width="160" height="46"/><text class="label kind-1" x="38" y="68" text-anchor="start">意味の宣言</text><text class="label small" x="38" y="86" text-anchor="start">中核</text><rect class="box kind-1" x="198" y="48" width="160" height="46"/><text class="label kind-1" x="210" y="68" text-anchor="start">意味の検証</text><text class="label small" x="210" y="86" text-anchor="start">中核</text><rect class="box kind-1" x="370" y="48" width="160" height="46"/><text class="label kind-1" x="382" y="68" text-anchor="start">変更の確かめ</text><text class="label small" x="382" y="86" text-anchor="start">中核</text><rect class="box kind-1" x="542" y="48" width="160" height="46"/><text class="label kind-1" x="554" y="68" text-anchor="start">描画</text><text class="label small" x="554" y="86" text-anchor="start">補完</text><rect class="box kind-1" x="714" y="48" width="160" height="46"/><text class="label kind-1" x="726" y="68" text-anchor="start">保存と版の管理</text><text class="label small" x="726" y="86" text-anchor="start">一般</text><rect class="area" x="10" y="140" width="880" height="100"/><text class="title" x="26" y="164" text-anchor="start">解決の側：区切られた文脈（設計するもの）</text><rect class="box focus" x="26" y="178" width="600" height="50"/><text class="label focus" x="40" y="200" text-anchor="start">1つのモデルと言葉が一貫する範囲</text><text class="label small" x="40" y="218" text-anchor="start">どこで線を引くかは、言葉の一貫 ・ 同じデータを扱う使う場面 ・ チーム ・ ライフサイクルで決める</text><path class="flow" d="M106,94 V138"/><path class="flow" d="M278,94 V138"/><path class="flow" d="M450,94 V138"/><path class="flow" d="M622,94 V138"/><path class="flow" d="M794,94 V138"/><text class="note" x="650" y="200" text-anchor="start">対応は設計判断で、</text><tex