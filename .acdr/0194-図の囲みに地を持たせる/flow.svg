<svg viewBox="0 0 780 230" style="min-width:660px" role="img" aria-label="囲みが透明で置いた面と同じ色だったのを、白い地を持たせて面と分ける" class="dsvg"><style data-dsvg="dark">.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .boundary{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .area{fill:var(--dsvg-area-fill,#FFFFFF);stroke:var(--dsvg-line,#7C8C86)}.dsvg #dsvg-4cfb432c-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-area-fill:#22302D;--dsvg-line:#62756F}}:root[data-theme="dark"] .dsvg{--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330;--dsvg-area-fill:#22302D;--dsvg-line:#62756F}</style><defs data-dsvg="marker"><marker id="dsvg-4cfb432c-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更前（囲みは透明）</text><text class="note" x="410" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更後（囲みに地を持たせる）</text>
<rect class="boundary" x="20" y="34" width="350" height="180" fill="none" stroke="#5B6B66" stroke-width="1.5" stroke-dasharray="4 3" rx="5"/>
<text class="note" x="34" y="200" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">図を置く面と囲みが同じ色に見える</text>
<rect class="box" x="44" y="54" width="300" height="120" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="title" x="58" y="78" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">囲み（class area）</text><text class="note" x="58" y="98" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">fill: none（置いた面が透ける）</text>
<rect class="box focus" x="58" y="114" width="130" height="40" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="68" y="139" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">中の箱</text>
<path class="flow" d="M370,124 H410" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-4cfb432c-arrow-5B6B66)"/>
<rect class="area" x="430" y="54" width="300" height="120" fill="#FFFFFF" stroke="#7C8C86" stroke-width="1" rx="8"/>
<text class="title" x="444" y="78" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">囲み（class area）</text><text class="note" x="444" y="98" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">fill: color.area-fill（明は白）</text>
<rect class="box focus" x="444" y="114" width="130" height="40" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="454" y="139" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">中の箱</text>
<text class="note" x="430" y="200" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">面 ・ 囲み ・ 箱の3つが別の地になる</text>
</svg>
