<svg viewBox="0 0 780 230" style="min-width:660px" role="img" aria-label="囲みが透明で置いた面と同じ色だったのを、白い地を持たせて面と分ける">
<text class="note" x="20" y="22">変更前（囲みは透明）</text><text class="note" x="410" y="22">変更後（囲みに地を持たせる）</text>
<rect class="boundary" x="20" y="34" width="350" height="180"/>
<text class="note" x="34" y="200">図を置く面と囲みが同じ色に見える</text>
<rect class="box" x="44" y="54" width="300" height="120"/>
<text class="title" x="58" y="78">囲み（class area）</text><text class="note" x="58" y="98">fill: none（置いた面が透ける）</text>
<rect class="box focus" x="58" y="114" width="130" height="40"/><text class="label" x="68" y="139">中の箱</text>
<path class="flow" d="M370,124 H410"/>
<rect class="area" x="430" y="54" width="300" height="120"/>
<text class="title" x="444" y="78">囲み（class area）</text><text class="note" x="444" y="98">fill: color.area-fill（明は白）</text>
<rect class="box focus" x="444" y="114" width="130" height="40"/><text class="label" x="454" y="139">中の箱</text>
<text class="note" x="430" y="200">面 ・ 囲み ・ 箱の3つが別の地になる</text>
</svg>
