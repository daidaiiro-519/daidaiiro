<svg viewBox="0 0 760 284" style="min-width:600px" role="img" aria-label="検査の結果の変更前と変更後" class="dsvg"><style data-dsvg="dark">.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .link{stroke:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8}}:root[data-theme="dark"] .dsvg{--dsvg-ink:#E6EEEB;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-accent:#6CC9B8}</style>
<text class="title" x="20" y="28" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">検査の結果の変更前と変更後</text>
<text class="label" x="200" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更前</text>
<text class="label" x="485" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">変更後</text>
<text class="note" x="20" y="90" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">要素が多すぎる</text>
<rect class="box warn" x="200" y="68" width="270" height="44" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label" x="212" y="86" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">「合う要素が無い」と返す</text>
<rect class="box focus" x="485" y="68" width="255" height="44" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="86" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">2 個あり、maxContains の</text><text class="label" x="497" y="104" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">1 を超えている</text>
<text class="note" x="20" y="150" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">要素が少なすぎる</text>
<rect class="box warn" x="200" y="128" width="270" height="44" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label" x="212" y="146" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">「合う要素が無い」と返す</text>
<rect class="box focus" x="485" y="128" width="255" height="44" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="146" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">1 個で、minContains の</text><text class="label" x="497" y="164" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">2 より少ない</text>
<text class="note" x="20" y="207" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">check-schemas の指摘</text>
<rect class="box warn" x="200" y="188" width="270" height="28" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label" x="212" y="207" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">どこが何かだけを返す</text>
<rect class="box focus" x="485" y="188" width="255" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="207" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">直し方の案内（x-prompt）も返す</text>
<path class="link" d="M20,240 H740" fill="none" stroke="#5B6B66" stroke-width="1"/>
<text class="note" x="20" y="266" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">指摘を読んだ人と AI が、そのまま直せる</text>
</svg>