<svg viewBox="0 0 760 230" role="img" aria-label="幅の広い図の見え方の変更前と変更後" style="min-width:640px" class="dsvg"><style data-dsvg="dark">.dsvg .area{stroke:var(--dsvg-line,#7C8C86)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .label.warn{fill:var(--dsvg-warn,#8F5410);font-size:12px}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .title.focus{fill:var(--dsvg-accent,#0D5C55);font-size:13px;font-weight:700}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label.focus{fill:var(--dsvg-accent,#0D5C55);font-size:12px}.dsvg .note.small{fill:var(--dsvg-ink-soft,#5B6B66);font-size:10px}.dsvg #dsvg-f46fbb4c-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-line:#62756F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-line:#62756F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330}</style><defs data-dsvg="marker"><marker id="dsvg-f46fbb4c-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs>
<rect class="area" x="10" y="10" width="360" height="200" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title" x="26" y="36" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">変更前</text>
<rect class="box" x="30" y="56" width="140" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="100" y="83" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">min-width の図</text>
<path class="flow" d="M170,78 H198" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-f46fbb4c-arrow-5B6B66)"/>
<rect class="box warn" x="200" y="56" width="150" height="44" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label warn" x="275" y="83" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#8F5410">枠の外へはみ出す</text>
<text class="note" x="30" y="140" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">figure は max-width:100% だけ</text>
<rect class="area" x="390" y="10" width="360" height="200" fill="none" stroke="#7C8C86" stroke-width="1" rx="8"/><text class="title focus" x="406" y="36" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#0D5C55">変更後</text>
<rect class="box" x="410" y="56" width="140" height="44" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="label" x="480" y="83" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">min-width の図</text>
