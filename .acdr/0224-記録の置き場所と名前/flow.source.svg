<svg viewBox="0 0 420 748" role="img" aria-label="記録の置き場所と外の変更の検出の変更前と変更後">
<rect class="area" x="10" y="10" width="400" height="238"/>
<text class="title" x="26" y="36">変更前</text>
<rect class="box" x="30" y="52" width="160" height="36"/>
<text class="label" x="110" y="75" text-anchor="middle">ワークツリー a</text>
<rect class="box" x="230" y="52" width="160" height="36"/>
<text class="label" x="310" y="75" text-anchor="middle">ワークツリー b</text>
<path class="flow" d="M110,88 V110"/>
<path class="flow" d="M310,88 V110"/>
<rect class="box warn" x="30" y="112" width="360" height="50"/>
<text class="label warn" x="210" y="133" text-anchor="middle">&lt;git-common-dir&gt;/sas/sas.db</text>
<text class="label warn" x="210" y="152" text-anchor="middle">記録は1つ。最後の事後を経路だけで引く</text>
<path class="flow" d="M210,162 V180"/>
<rect class="box warn" x="30" y="182" width="360" height="50"/>
<text class="label warn" x="210" y="203" text-anchor="middle">a の update を、b が書いた事後と比べる</text>
<text class="label warn" x="210" y="222" text-anchor="middle">外の変更と取り違えて断る</text>
<rect class="area" x="10" y="268" width="400" height="238"/>
<text class="title focus" x="26" y="294">変更後</text>
<rect class="box" x="30" y="310" width="160" height="36"/>
<text class="label" x="110" y="333" text-anchor="middle">ワークツリー a</text>
<rect class="box" x="230" y="310" width="160" height="36"/>
<text class="label" x="310" y="333" text-anchor="middle">ワークツリー b</text>
<path class="flow" d="M110,346 V368"/>
<path class="flow" d="M310,346 V368"/>
<rect class="box focus" x="30" y="370" width="360" height="50"/>
<text class="label focus" x="210" y="391" text-anchor="middle">&lt;git-common-dir&gt;/semantic-agent-schema/</text>
<text class="label focus" x="210" y="410" text-anchor="middle">records.sqlite（記録は1つのまま）</text>
<path class="flow" d="M210,420 V438"/>
<rect class="box focus" x="30" y="440" width="360" height="50"/>
<text class="label focus" x="210" y="461" text-anchor="middle">外の変更は、同じワークツリーで</text>
<text class="label focus" x="210" y="480" text-anchor="middle">記録した最後の事後と比べる</text>
<rect class="area" x="10" y="526" width="400" height="174"/>
<text class="title" x="26" y="552">比べた3案</text>
<text class="note" x="210" y="574" text-anchor="middle">ワークツリー</text>
<text class="note" x="210" y="588" text-anchor="middle">で1つ</text>
<text class="note" x="290" y="574" text-anchor="middle">git clean</text>
<text class="note" x="290" y="588" text-anchor="middle">で残る</text>
<text class="note" x="370" y="574" text-anchor="middle">リポジトリと</text>
<text class="note" x="370" y="588" text-anchor="middle">一緒に動く</text>
<rect class="box focus" x="20" y="598" width="380" height="28"/>
<text class="label focus" x="30" y="617">.git の中（採る）</text>
<text class="label focus" x="210" y="617" text-anchor="middle">◯</text>
<text class="label focus" x="290" y="617" text-anchor="middle">◯</text>
<text class="label focus" x="370" y="617" text-anchor="middle">◯</text>
<text class="label" x="30" y="651">作業ツリーの中</text>
<text class="label" x="210" y="651" text-anchor="middle">✕</text>
<text class="label" x="290" y="651" text-anchor="middle">✕</text>
<text class="label" x="370" y="651" text-anchor="middle">◯</text>
<text class="label" x="30" y="683">HOME の下</text>
<text class="label" x="210" y="683" text-anchor="middle">鍵しだい</text>
<text class="label" x="290" y="683" text-anchor="middle">◯</text>
<text class="label" x="370" y="683" text-anchor="middle">✕</text>
<text class="note" x="10" y="722">塗り：変更前の問題（warn）と、変更後に置くもの（focus）</text>
<text class="note" x="10" y="740">作業ツリーの中は .gitignore で除外し、git clean -fdx で消える</text>
</svg>
