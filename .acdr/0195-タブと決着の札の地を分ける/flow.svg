<svg viewBox="0 0 780 200" style="min-width:660px" role="img" aria-label="選んでいないタブと決着の札が背景に溶けていたのを、押せる部品の地と完了の緑で分ける" class="dsvg"><style data-dsvg="dark">.dsvg .canvas{fill:var(--dsvg-area-fill,#FFFFFF)}.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box{fill:var(--dsvg-box-fill,#F3F7F5);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg #dsvg-0d6546ac-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330}}:root[data-theme="dark"] .dsvg{--dsvg-area-fill:#22302D;--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-accent-bg:#173330}</style><defs data-dsvg="marker"><marker id="dsvg-0d6546ac-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs><rect data-dsvg="canvas" class="canvas" x="0.0" y="0.0" width="780.0" height="200.0" fill="#FFFFFF" rx="8"/>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更前</text><text class="note" x="410" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更後</text>
<rect class="box" x="20" y="34" width="350" height="150" fill="#F3F7F5" stroke="#0D5C55" stroke-width="1.5" rx="5"/>
<text class="label" x="34" y="60" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">選んでいないタブ：地が透明（枠と同じ色）</text>
<text class="label" x="34" y="90" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">決着の札：淡い線 ・ 透明 ・ 控えめの文字</text>
<text class="note" x="34" y="130" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">どちらも置いた面に溶けて見えにくい</text>
<path class="flow" d="M370,110 H410" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-0d6546ac-arrow-5B6B66)"/>
<rect class="box focus" x="410" y="34" width="350" height="150" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/>
<text class="label" x="424" y="60" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">タブ：押せる部品の地（surface.control）</text>
<text class="label" x="424" y="90" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">決着：明るい緑の地と緑の線 ・ 文字</text>
<text class="note" x="424" y="130" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">完了を前向きな色で伝え、回答待ちの青緑と分ける</text>
</svg>
