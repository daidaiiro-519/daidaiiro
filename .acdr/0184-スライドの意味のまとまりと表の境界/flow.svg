<svg class="ws-visual" viewBox="0 0 1112 372" role="img" aria-label="身につける3つごとに、仕組みに残るものと、毎回目的に合った結果が出ることを並べる。だから作業をAIに任せられ、手直しと依頼し直しが減って判断に時間を使え、人が替わっても同じ品質で続く"><text x="0" y="20.0" font-size="15" fill="#59605a" font-weight="700" text-anchor="start">身につけること（ワークショップの目的）</text><text x="404" y="20.0" font-size="15" fill="#59605a" font-weight="700" text-anchor="start">仕組みに残るもの</text><text x="790" y="20.0" font-size="15" fill="#59605a" font-weight="700" text-anchor="start">毎回、目的に合った結果が出る</text><rect x="0" y="34" width="330" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="404" y="34" width="310" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="790" y="34" width="322" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><text x="22" y="64.0" font-size="14" fill="#59605a" font-weight="700" text-anchor="start">教材1</text><text x="22" y="92.0" font-size="20" fill="#252b29" font-weight="700" text-anchor="start">作業の目的を依頼に書く</text><path d="M340 71 H386 M378 64 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(414 45) scale(0.95)"><path d="M3 0 H33 L46 13 V55 H3 Z M33 0 V13 H46 M12 25 H35 M12 35 H35 M12 45 H28" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="484" y="64" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">作業の目的と、意味 ・ 範囲 ・</text><text x="484" y="90" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">条件を書いたプロンプト</text><path d="M730 71 H776 M768 64 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(802 57) scale(0.6)"><path d="M0 20 L13 33 L40 0" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="840" y="64" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">入力が替わっても、出力が</text><text x="840" y="90" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">目的から外れない</text><rect x="0" y="120" width="330" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="404" y="120" width="310" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="790" y="120" width="322" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><text x="22" y="150.0" font-size="14" fill="#59605a" font-weight="700" text-anchor="start">教材2</text><text x="22" y="178.0" font-size="20" fill="#252b29" font-weight="700" text-anchor="start">違う言葉の意味を言語化する</text><path d="M340 157 H386 M378 150 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(414 131) scale(0.9)"><path d="M0 3 Q14 -3 27 3 Q40 -3 54 3 V44 Q40 38 27 44 Q14 38 0 44 Z M27 3 V44" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="484" y="150" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">業務ごとの言葉の定義と、</text><text x="484" y="176" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">業務による違いの記録</text><path d="M730 157 H776 M768 150 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(802 143) scale(0.6)"><path d="M0 20 L13 33 L40 0" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="840" y="150" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">AIが業務ごとの言葉を、</text><text x="840" y="176" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">その業務の意味で解釈する</text><rect x="0" y="206" width="330" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="404" y="206" width="310" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><rect x="790" y="206" width="322" height="74" rx="12" fill="#fffaf2" stroke="#6f7a63" stroke-width="2"/><text x="22" y="236.0" font-size="14" fill="#59605a" font-weight="700" text-anchor="start">教材3</text><text x="22" y="264.0" font-size="20" fill="#252b29" font-weight="700" text-anchor="start">仕組みにして改善する</text><path d="M340 243 H386 M378 236 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M436 229 V220" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="436" cy="219" r="3" fill="none" stroke="#252b29" stroke-width="2"/><rect x="414" y="229" width="44" height="32" rx="9" fill="none" stroke="#252b29" stroke-width="2"/><circle cx="428" cy="244" r="3.5" fill="#252b29" stroke="#252b29" stroke-width="2"/><circle cx="444" cy="244" r="3.5" fill="#252b29" stroke="#252b29" stroke-width="2"/><path d="M429 253 H443" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M414 243 H406 M458 243 H466" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M425 261 V269 H447 V261" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="484" y="236" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">業務ごとのエージェントと、</text><text x="484" y="262" font-size="16" fill="#252b29" font-weight="400" text-anchor="start">作業ごとのSkills</text><path d="M730 243 H776 M768 236 l8 7 -8 7" stroke="#6f7a63" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(802 229) scale(0.6)"><path d="M0 20 L13 33 L40 0" stroke="#252b29" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="840" y="236" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">誰が使っても、毎回目的に</text><text x="840" y="262" font-size="17" fill="#252b29" font-weight="700" text-anchor="start">合った結果が出る</text><rect x="0" y="296" width="1112" height="70" rx="12" fill="#fffaf2" stroke="#ae3f23" stroke-width="2"/><text x="24" y="324.0" font-size="15" fill="#ae3f23" font-weight="700" text-anchor="start">だから</text><text x="24" y="352.0" font-size="20" fill="#ae3f23" font-weight="700" text-anchor="start">作業をAIに任せられる</text><path d="M262 312 V350" stroke="#6f7a63" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="288" y="324.0" font-size="16" fill="#252b29" font-weight="700" text-anchor="start">手直しと依頼し直しが減り、空いた時間を判断に使える</text><text x="288" y="352.0" font-size="16" fill="#252b29" font-weight="700" text-anchor="start">人が替わっても、仕組みが残るので、同じ品質で続く</text></svg>