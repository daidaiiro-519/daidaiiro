<svg viewBox="0 0 1000 330" style="min-width:860px" role="img" aria-label="依存の向きの検査の変更前と変更後">
<text class="title" x="10" y="24">変更前：Cargo だけ</text>
<text class="title kind-2" x="520" y="24">変更後：Cargo ＋ dependency-rules</text>
<rect class="box" x="20" y="44" width="460" height="56"/><text class="title" x="32" y="66">Cargo.toml に書いていない crate を使う</text><text class="note small" x="32" y="86">cargo build が止める</text>
<rect class="box" x="20" y="112" width="460" height="56"/><text class="title" x="32" y="134">通常の依存の循環</text><text class="note small" x="32" y="154">cargo build が止める</text>
<rect class="box kind-1" x="20" y="180" width="460" height="56"/><text class="title kind-1" x="32" y="202">許していない辺を Cargo.toml に書く</text><text class="note small" x="32" y="222">ビルドが通る（例：domain/change → outbound/fs）</text>
<rect class="box kind-1" x="20" y="248" width="460" height="56"/><text class="title kind-1" x="32" y="270">dev ・ build の辺、表に無い外の crate</text><text class="note small" x="32" y="290">ビルドが通る</text>
<rect class="box" x="520" y="44" width="460" height="56"/><text class="title" x="532" y="66">Cargo.toml に書いていない crate を使う</text><text class="note small" x="532" y="86">cargo build が止める（変わらない）</text>
<rect class="box" x="520" y="112" width="460" height="56"/><text class="title" x="532" y="134">通常の依存の循環</text><text class="note small" x="532" y="154">cargo build が止める（変わらない）</text>
<rect class="box kind-2" x="520" y="180" width="460" height="124"/><text class="title kind-2" x="532" y="202">dependency-rules check が止める</text><text class="note small" x="532" y="224">規則（component と allow）に無い辺は not-in-allowed</text><text class="note small" x="532" y="244">kinds で dev ・ build だけに許した辺も区別する</text><text class="note small" x="532" y="264">どの component にも入らない crate は uncovered</text><text class="note small" x="532" y="284">終了コード 1 で CI が止まる</text>
</svg>
