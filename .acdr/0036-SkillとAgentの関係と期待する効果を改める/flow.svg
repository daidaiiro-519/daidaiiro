ok ・ 目的の分割→Agent</text></g></g><g class="wf-node" transform="translate(498.6,0.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="607.6" height="32.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="303.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">Skill＝作業ごとの道具（目的 ・ 意味 ・ 範囲 ・ 条件）／ Agent＝Skillを使い業務の目的を達成</text></g></g><g class="wf-node" transform="translate(0.0,56.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="280.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="140.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">作った人以外も、同じ業務で目的を達成できる</text></g></g><g class="wf-node" transform="translate(498.6,56.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="339.4" height="32.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="169.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">個人のAI活用を、チームや組織の成果へつなげる（3層）</text></g></g><g class="wf-node" transform="translate(0.0,112.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="155.8" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="77.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">3つの段階を順に上がる</text></g></g><g class="wf-node" transform="translate(498.6,112.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="292.0" height="32.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="146.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">前の教材で決めたことを、次の教材で前提にする</text></g></g><g class="wf-node" transform="translate(0.0,168.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="232.0" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="116.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">チームや組織の成果は変わっていない</text></g></g><g class="wf-node" transform="translate(498.6,168.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="220.0" height="32.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">チームや組織ではなかなか進まない</text></g></g></g></svg>