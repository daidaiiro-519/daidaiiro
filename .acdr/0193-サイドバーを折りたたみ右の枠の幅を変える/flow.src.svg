<rect class="box" x="104" y="34" width="170" height="196"/><text class="label" x="114" y="58">本文</text>
<rect class="box" x="278" y="34" width="92" height="196"/><text class="label" x="288" y="58">チャット</text><text class="note" x="288" y="78">360px</text><text class="note" x="288" y="96">固定</text>
