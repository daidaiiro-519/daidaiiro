23">用語集に書く語</text></g></g><g class="wf-node" transform="translate(214.0,0.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="220.0" height="68.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">仕様の用語（JSON Schema ・ </text><text x="110.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">JMESPath ・ HTTP など）。綴</text><text x="110.0" y="56.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">りのまま書き、仕様の名前を添える</text></g></g><g class="wf-node" transform="translate(214.0,92.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="208.0" height="50.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="104.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">業務の言葉（利用者や業務の人が</text><text x="104.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">使う語）。誰の言葉かを添える</text></g></g><g class="wf-node" transform="translate(214.0,166.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="220.0" height="32.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="110.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">一般の言葉（辞書の意味のとおり）</text></g></g><g class="wf-node" transform="translate(214.0,222.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="256.0" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="128.0" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">どれにも当たらない語（作った語）。出ど</text><text x="128.0" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">ころが書けないので、用語集に入らない</text></g></g></g></svg>