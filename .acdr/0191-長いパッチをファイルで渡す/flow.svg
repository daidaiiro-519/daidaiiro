<svg viewBox="0 0 780 300" style="min-width:660px" role="img" aria-label="長いパッチを引数で渡して止められていたのを、ボードのフォルダのファイルで渡す形に変える" class="dsvg"><style data-dsvg="dark">.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .boundary{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .flow{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}.dsvg #dsvg-698237bb-arrow-5B6B66 path{fill:var(--dsvg-ink-soft,#5B6B66)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}}:root[data-theme="dark"] .dsvg{--dsvg-ink-soft:#9DADA8;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-ink:#E6EEEB;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-accent-bg:#173330;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}</style><defs data-dsvg="marker"><marker id="dsvg-698237bb-arrow-5B6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6B66"/></marker></defs>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更前</text><text class="note" x="410" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更後</text>
<rect class="box" x="20" y="34" width="360" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="34" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">チャットの AI</text><text class="label" x="34" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">図の SVG（約1万字）を手で組む</text>
<rect class="box warn" x="20" y="116" width="360" height="62" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="title" x="34" y="140" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">update --patch '&lt;1万字&gt;'</text><text class="label" x="34" y="162" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">長いコマンドが許可の判定で止められる</text>
<rect class="boundary" x="20" y="198" width="360" height="62" fill="none" stroke="#5B6B66" stroke-width="1.5" stroke-dasharray="4 3" rx="5"/><text class="label" x="34" y="222" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">図が直せず、人が代わりに直す</text>
<path class="flow" d="M200,98 V112" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-698237bb-arrow-5B6B66)"/><path class="flow" d="M200,180 V194" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-698237bb-arrow-5B6B66)"/>
<rect class="box" x="410" y="34" width="350" height="62" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="424" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">ボードのフォルダにファイルで書く</text><text class="label" x="424" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">Edit はボードのフォルダだけ許す</text>
<rect class="box focus" x="410" y="116" width="350" height="62" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title" x="424" y="140" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">update --patch_file &lt;ファイル&gt;</text><text class="label" x="424" y="162" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">コマンドは短いまま（基盤 0.1.2）</text>
<rect class="box kind-1" x="410" y="198" width="350" height="62" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/><text class="label" x="424" y="222" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">図は design-svg の resolve と verify を通す</text><text class="note" x="424" y="244" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">許可の設定のフォルダには書けない</text>
<path class="flow" d="M585,98 V112" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-698237bb-arrow-5B6B66)"/><path class="flow" d="M585,180 V194" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-698237bb-arrow-5B6B66)"/>
</svg>
