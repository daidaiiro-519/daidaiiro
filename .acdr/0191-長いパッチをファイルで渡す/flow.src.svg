<svg viewBox="0 0 780 300" style="min-width:660px" role="img" aria-label="長いパッチを引数で渡して止められていたのを、ボードのフォルダのファイルで渡す形に変える">
<text class="note" x="20" y="22">変更前</text><text class="note" x="410" y="22">変更後</text>
<rect class="box" x="20" y="34" width="360" height="62"/><text class="title" x="34" y="58">チャットの AI</text><text class="label" x="34" y="80">図の SVG（約1万字）を手で組む</text>
<rect class="box warn" x="20" y="116" width="360" height="62"/><text class="title" x="34" y="140">update --patch '&lt;1万字&gt;'</text><text class="label" x="34" y="162">長いコマンドが許可の判定で止められる</text>
<rect class="boundary" x="20" y="198" width="360" height="62"/><text class="label" x="34" y="222">図が直せず、人が代わりに直す</text>
<path class="flow" d="M200,98 V112"/><path class="flow" d="M200,180 V194"/>
<rect class="box" x="410" y="34" width="350" height="62"/><text class="title" x="424" y="58">ボードのフォルダにファイルで書く</text><text class="label" x="424" y="80">Edit はボードのフォルダだけ許す</text>
<rect class="box focus" x="410" y="116" width="350" height="62"/><text class="title" x="424" y="140">update --patch_file &lt;ファイル&gt;</text><text class="label" x="424" y="162">コマンドは短いまま（基盤 0.1.2）</text>
<rect class="box kind-1" x="410" y="198" width="350" height="62"/><text class="label" x="424" y="222">図は design-svg の resolve と verify を通す</text><text class="note" x="424" y="244">許可の設定のフォルダには書けない</text>
<path class="flow" d="M585,98 V112"/><path class="flow" d="M585,180 V194"/>
</svg>
