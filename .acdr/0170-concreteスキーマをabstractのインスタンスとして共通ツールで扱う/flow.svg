<rect class="box focus" x="485" y="172" width="255" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="191" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">書き進められる</text>
<text class="note" x="20" y="235" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">②の書き方の案内</text>
<rect class="box warn" x="200" y="216" width="270" height="28" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="label" x="212" y="235" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">無い</text>
<rect class="box focus" x="485" y="216" width="255" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="235" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">prompt と create が返す</text>
<text class="note" x="20" y="279" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">$schema 欄の const</text>
