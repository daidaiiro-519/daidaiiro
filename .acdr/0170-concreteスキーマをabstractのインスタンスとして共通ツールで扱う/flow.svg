<rect class="box focus" x="485" y="112" width="255" height="44" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="130" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">dialect と x-abstract を書く</text><text class="label" x="497" y="148" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">（名前で受け付ける）</text>
<text class="note" x="20" y="191" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">②を update</text>
