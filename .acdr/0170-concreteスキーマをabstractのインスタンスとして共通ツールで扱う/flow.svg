<rect class="box focus" x="485" y="260" width="255" height="28" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="label" x="497" y="279" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">abstract の決まり（検査あり）</text>
<path class="link" d="M20,312 H740" fill="none" stroke="#5B6B66" stroke-width="1"/>
<text class="note" x="20" y="338" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">②を③と同じ共通ツール ・ 同じ引数で扱う。共通ツールの数と引数は変えない</text>
