<svg viewBox="0 0 780 330" style="min-width:660px" role="img" aria-label="確かめてほしい箇所が、問いだけから、問いと私の見解と確かめてほしい理由へ変わる" class="dsvg"><style data-dsvg="dark">.dsvg .note{fill:var(--dsvg-ink-soft,#5B6B66);font-size:11px}.dsvg .box.warn{fill:var(--dsvg-warn-bg,#F0E2CD);stroke:var(--dsvg-warn,#8F5410)}.dsvg .title{fill:var(--dsvg-ink,#111D1A);font-size:13px;font-weight:700}.dsvg .label{fill:var(--dsvg-ink,#111D1A);font-size:12px}.dsvg .boundary{stroke:var(--dsvg-ink-soft,#5B6B66)}.dsvg .box{fill:var(--dsvg-box-fill,#F8FAF9);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .box.focus{fill:var(--dsvg-accent-bg,#D5E6E3);stroke:var(--dsvg-accent,#0D5C55)}.dsvg .box.kind-1{fill:var(--dsvg-kind-1-bg,#F1E3EE);stroke:var(--dsvg-kind-1,#7A3B6D)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsvg,.dsvg:root:not([data-theme="light"]){--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-accent-bg:#173330;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}}:root[data-theme="dark"] .dsvg{--dsvg-ink-soft:#9DADA8;--dsvg-warn-bg:#33281A;--dsvg-warn:#D9A35F;--dsvg-ink:#E6EEEB;--dsvg-box-fill:#16211E;--dsvg-accent:#6CC9B8;--dsvg-accent-bg:#173330;--dsvg-kind-1-bg:#2E1F2B;--dsvg-kind-1:#D094C2}</style>
<text class="note" x="20" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更前</text><text class="note" x="410" y="22" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">変更後</text>
<rect class="box warn" x="20" y="34" width="360" height="60" fill="#F0E2CD" stroke="#8F5410" stroke-width="1.5" rx="5"/><text class="title" x="34" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">問い</text><text class="label" x="34" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">HTTP は基盤が待ち受けず…でよいか</text>
<rect class="boundary" x="20" y="108" width="360" height="188" fill="none" stroke="#5B6B66" stroke-width="1.5" stroke-dasharray="4 3" rx="5"/><text class="label" x="34" y="134" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">なぜ聞かれているのか</text><text class="label" x="34" y="154" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">書き手がどう考えているのか</text><text class="note" x="34" y="184" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">どちらも書く欄が無い。</text><text class="note" x="34" y="204" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">読み手が裏づけを開いて推し量る</text>
<rect class="box" x="410" y="34" width="350" height="60" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="424" y="58" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">問い</text><text class="label" x="424" y="80" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">HTTP は基盤が待ち受けず…でよいか</text>
<rect class="box focus" x="410" y="108" width="350" height="56" fill="#D5E6E3" stroke="#0D5C55" stroke-width="2" rx="5"/><text class="title" x="424" y="130" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">私の見解（view）</text><text class="label" x="424" y="150" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">結論だけを1文。60字まで</text><rect class="box" x="410" y="174" width="350" height="56" fill="#F8FAF9" stroke="#0D5C55" stroke-width="1.5" rx="5"/><text class="title" x="424" y="196" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">根拠（basis）</text><text class="label" x="424" y="216" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">名前だけを札で3件まで</text>
<rect class="box kind-1" x="410" y="240" width="350" height="56" fill="#F1E3EE" stroke="#7A3B6D" stroke-width="1.5" rx="5"/><text class="title" x="424" y="262" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" font-weight="700" fill="#111D1A">決めきれない理由（why）</text><text class="label" x="424" y="282" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">何で答えが変わるか。60字まで</text>
<text class="note" x="410" y="318" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">回答待ちの論点で欠けていれば、inspect が知らせる</text>
</svg>
