<svg viewBox="0 0 780 330" style="min-width:660px" role="img" aria-label="確かめてほしい箇所が、問いだけから、問いと私の見解と確かめてほしい理由へ変わる">
<text class="note" x="20" y="22">変更前</text><text class="note" x="410" y="22">変更後</text>
<rect class="box warn" x="20" y="34" width="360" height="60"/><text class="title" x="34" y="58">問い</text><text class="label" x="34" y="80">HTTP は基盤が待ち受けず…でよいか</text>
<rect class="boundary" x="20" y="108" width="360" height="188"/><text class="label" x="34" y="134">なぜ聞かれているのか</text><text class="label" x="34" y="154">書き手がどう考えているのか</text><text class="note" x="34" y="184">どちらも書く欄が無い。</text><text class="note" x="34" y="204">読み手が裏づけを開いて推し量る</text>
<rect class="box" x="410" y="34" width="350" height="60"/><text class="title" x="424" y="58">問い</text><text class="label" x="424" y="80">HTTP は基盤が待ち受けず…でよいか</text>
<rect class="box focus" x="410" y="108" width="350" height="56"/><text class="title" x="424" y="130">私の見解（view）</text><text class="label" x="424" y="150">結論だけを1文。60字まで</text><rect class="box" x="410" y="174" width="350" height="56"/><text class="title" x="424" y="196">根拠（basis）</text><text class="label" x="424" y="216">名前だけを札で3件まで</text>
<rect class="box kind-1" x="410" y="240" width="350" height="56"/><text class="title" x="424" y="262">決めきれない理由（why）</text><text class="label" x="424" y="282">何で答えが変わるか。60字まで</text>
<text class="note" x="410" y="318">回答待ちの論点で欠けていれば、inspect が知らせる</text>
</svg>
