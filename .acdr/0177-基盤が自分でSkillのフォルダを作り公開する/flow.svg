<text class="label focus" x="380.0" y="96" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">cargo xtask skill</text>
<text class="note" x="380.0" y="116" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">ビルドして置く</text>
<text class="note" x="380.0" y="133" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">dist.json を書く</text>
