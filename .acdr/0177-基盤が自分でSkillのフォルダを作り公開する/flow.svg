<text class="note" x="640.0" y="116" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">scripts/bin/ の実行ファイル2つ</text>
<text class="note" x="640.0" y="133" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">assets/ ・ dist.json</text>
<path class="flow" d="M220,116 H278" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-29f7c85a-arrow-5B6B66)"/><path class="flow" d="M480,116 H538" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-29f7c85a-arrow-5B6B66)"/>
<text class="note" x="20" y="186" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">tag schema-driven-v&lt;版&gt; で、基盤専用のワークフローが同じ手順を3つの OS で動かす</text>
