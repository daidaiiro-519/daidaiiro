<text class="label focus" x="640.0" y="222" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#0D5C55">Release へ公開</text>
<text class="note" x="640.0" y="242" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">配布物 ・ SHA256SUMS</text>
<text class="note" x="640.0" y="259" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">証明（attestation）</text>
<path class="flow" d="M220,242 H278" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-29f7c85a-arrow-5B6B66)"/><path class="flow" d="M480,242 H538" fill="none" stroke="#5B6B66" stroke-width="1.5" marker-end="url(#dsvg-29f7c85a-arrow-5B6B66)"/>
<path class="link" d="M20,306 H740" fill="none" stroke="#5B6B66" stroke-width="1"/>
<text class="label" x="20" y="330" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" fill="#111D1A">受け取る側（基盤はだれかを知らない）がすること</text>
<text class="note" x="20" y="354" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">版を指して取得する → SHA-256 と証明を照合する（ワークフローと tag まで縛る）</text>
<text class="note" x="20" y="374" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="11" fill="#5B6B66">→ 展開して置く → --version に答えさせ、指した版と一致することを確かめる</text>
