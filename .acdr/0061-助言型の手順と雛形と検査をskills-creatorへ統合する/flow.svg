othic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">した日 ・ sha256 を記録する）</text></g></g><g class="wf-node" transform="translate(24.0,132.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="195.4" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="97.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">2. 章（文書）ごとの学習ノー</text><text x="97.7" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">トを書く（手元だけに置く）</text></g></g><g class="wf-node" transform="translate(24.0,246.0)"><g class="svg-box" role="focus"><rect x="0" y="0" width="195.4" height="50.0" rx="5.0" fill="#E2EFF0" stroke="#16636B" stroke-width="1.6"/><text x="97.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">3. ノートの節を、原典が立て</text><text x="97.7" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="600" fill="#16636B">ている概念ごとに振り分ける</text></g></g><g class="wf-node" transform="translate(0.0,360.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="243.4" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="121.7" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">4. 概念ごとに、変換前の形へ取り込む</text></g></g><g class="wf-node" transform="translate(31.8,456.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="179.8" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="89.9" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">5. 判断基準へ変換する</text><text x="89.9" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">（ノートに無い文字列0件）</text></g></g><g class="wf-node" transform="translate(4.5,570.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="234.4" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="117.2" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">6. 図を SVG のファイルにして、判</text><text x="117.2" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">断基準に置く（描く道具は問わない）</text></g></g><g class="wf-node" transform="translate(45.9,684.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="151.6" height="50.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="75.8" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">7. 形の後処理（繰り</text><text x="75.8" y="38.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">返し ・ 崩れを外す）</text></g></g><g class="wf-node" transform="translate(2.4,798.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="238.6" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="119.3" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif" font-size="12.0" font-weight="400" fill="#171B23">8. 回答の形 ・ 道具 ・ 試験を置く</text></g></g><g class="wf-node" transform="translate(26.1,894.0)"><g class="svg-box" role="plain"><rect x="0" y="0" width="191.2" height="32.0" rx="5.0" fill="#F5F7F9" stroke="#C3CAD2" stroke-width="1.2"/><text x="95.6" y="20.3" text-anchor="middle" font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-