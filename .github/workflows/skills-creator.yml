# skills-creator を、3つの OS 向けの Skill のフォルダにして、証明を付けて Release へ公開する（daidaiiro-519/daidaiiro）。
# 基盤（schema-driven.yml）と同じ形である。私たちが管理するものが3つになったら、共通の1本にまとめる。
#
# tag skills-creator-v<版> で動く。版は src/skills-creator/Cargo.toml の [workspace.package] の version の1か所で決める。
# workflow_dispatch では build と verify だけを通す。
# skills-creator の Skill のフォルダに入れる基盤のエンジンの版は、ENGINE_VERSION で指す。
#
# 流れ：build（3つの OS で cargo xtask skill）→ verify（ビルドしなかったランナーで展開して cargo xtask verify。
#       練習用の Skill の scaffold と check、Windows では PowerShell から入口の .cmd を起動）
#       → publish（SHA256SUMS と証明を付けて公開）→ receive（公開した Release から取り直し、受け取る側の手順を通す）
name: skills-creator

on:
  push:
    tags: ["skills-creator-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# ランナーの image は版で固定する。actions は Node.js 24 で動く版を使う。
env:
  ENGINE_VERSION: "0.1.1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-14
            target: universal2-apple-darwin
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: ビルドのツールを用意する
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl) sudo apt-get update && sudo apt-get install -y musl-tools
                                       rustup target add x86_64-unknown-linux-musl ;;
            universal2-apple-darwin)   rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            *)                         rustup target add "${{ matrix.target }}" ;;
          esac
      - name: Skill のフォルダを作る ── git で追跡するものを写し、実行ファイルと基盤のエンジンは cargo xtask skill が置く
        run: |
          out="$GITHUB_WORKSPACE/dist/skills-creator"
          mkdir -p "$out"
          cp -r .claude/skills/skills-creator/SKILL.md .claude/skills/skills-creator/LICENSE .claude/skills/skills-creator/assets "$out/"
          (cd src/skills-creator && cargo xtask skill --out "$out" --target "${{ matrix.target }}" --engine "$ENGINE_VERSION")
      - name: 試験 ── 利用者の環境のライブラリに依存しない
        working-directory: dist/skills-creator/scripts/bin
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              file skills-creator | grep -q "static" || { file skills-creator; exit 1; } ;;
            universal2-apple-darwin)
              archs="$(lipo -archs skills-creator)"
              [ "$archs" = "x86_64 arm64" ] || [ "$archs" = "arm64 x86_64" ] || { echo "skills-creator: $archs"; exit 1; } ;;
            x86_64-pc-windows-msvc)
              if grep -qai "vcruntime140" skills-creator.exe; then echo "skills-creator.exe が VCRUNTIME に依存する"; exit 1; fi ;;
          esac
      - name: 梱包する ── 名前は skills-creator-<版>-<target>
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/skills-creator/Cargo.toml | head -1)"
          name="skills-creator-$version-${{ matrix.target }}"
          mkdir -p release
          if [ "${{ matrix.ext }}" = zip ]; then (cd dist && 7z a -tzip "../release/$name.zip" skills-creator >/dev/null)
          else tar -czf "release/$name.tar.gz" -C dist skills-creator; fi
      - uses: actions/upload-artifact@v7
        with:
          name: skills-creator-${{ matrix.target }}
          path: release/

  verify:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: skills-creator-${{ matrix.target }}
          path: release
      - name: 試験 ── ビルドしなかったランナーで展開し、版 ・ 自分の check ・ 練習用の Skill の scaffold と check を確かめる
        run: |
          place="$RUNNER_TEMP/unpacked" && mkdir -p "$place"
          for f in release/*; do
            case "$f" in *.zip) 7z x -o"$place" "$f" >/dev/null ;; *) tar -xzf "$f" -C "$place" ;; esac
          done
          tag=""; [ "$GITHUB_REF_TYPE" = tag ] && tag="--tag $GITHUB_REF_NAME"
          (cd src/skills-creator && cargo xtask verify --dir "$place/skills-creator" $tag)
      - name: 試験 ── PowerShell で scripts/<Skill名> と打つと、入口の .cmd が動く
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $creator = Join-Path $env:RUNNER_TEMP 'unpacked\skills-creator\scripts\bin\skills-creator.exe'
          $practice = Join-Path $env:RUNNER_TEMP 'pwsh-practice'
          & $creator scaffold $practice | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "scaffold が失敗した" }
          # Skill の名前はフォルダの名前で決まるので、入口は scripts\pwsh-practice（と .cmd）である
          Push-Location $practice
          & .\scripts\pwsh-practice prompt --schema schema-driven/abstract@v1 --property /title | Out-Host
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "PowerShell から scripts\pwsh-practice を起動できない（終了コード $code）" }

  publish:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    # 証明は、鍵を持たない GitHub の artifact attestations で付ける。証明に必要な権限は、このジョブだけに渡す
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: skills-creator-*
          path: release
          merge-multiple: true
      - name: SHA-256 の一覧を作る
        run: (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: 配布物と照合の一覧に、出所の証明を付ける
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: "release/*"
      - name: 証明の bundle を配布物に並べる
        run: cp "${{ steps.attest.outputs.bundle-path }}" release/attestation.sigstore.json
      - name: 下書きに全部を付けてから公開する ── 公開した版は、配布物と tag を変えられない
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "skills-creator の Skill のフォルダ（3つの OS）。受け取る側は、SHA256SUMS と attestation.sigstore.json で照合する：gh attestation verify <配布物> --repo $GITHUB_REPOSITORY --bundle attestation.sigstore.json --signer-workflow $GITHUB_REPOSITORY/.github/workflows/skills-creator.yml --source-ref refs/tags/$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  receive:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: 試験 ── 公開した Release から版を指して取り直し、受け取る側の手順を通す
        run: |
          version="${GITHUB_REF_NAME#skills-creator-v}"
          file="skills-creator-$version-x86_64-unknown-linux-musl.tar.gz"
          got="$RUNNER_TEMP/got" && mkdir -p "$got" && cd "$got"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p "$file" -p SHA256SUMS -p attestation.sigstore.json
          sha256sum -c --ignore-missing SHA256SUMS
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --bundle attestation.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/skills-creator.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME"
          }
          verify "$file"
          # 1バイト変えた配布物は、証明の照合で止まる
          cp "$file" tampered.tar.gz && printf 'x' >> tampered.tar.gz
          if verify tampered.tar.gz; then echo "書き換えた配布物が照合を通った"; exit 1; fi
          tar -xzf "$file"
          (cd "$GITHUB_WORKSPACE/src/skills-creator" && cargo xtask verify --dir "$got/skills-creator" --tag "$GITHUB_REF_NAME")
