# brainstorming を、3つの OS 向けの Skill のフォルダにして、証明を付けて Release へ公開する（daidaiiro-519/daidaiiro）。
# 基盤（schema-driven.yml）・ skills-creator（skills-creator.yml）と同じ形である。
#
# tag brainstorming-v<版> で動く。版は src/brainstorming/Cargo.toml の [workspace.package] の version の1か所で決める。
# workflow_dispatch では build と verify だけを通す。
# brainstorming の Skill のフォルダに入れる基盤のエンジンの版は、ENGINE_VERSION で指す。
# エンジンは、同じ版の src/skills-creator から skills-creator の Skill のフォルダを作り、その engine で照合して入れる。
#
# 流れ：build（3つの OS で cargo xtask skill）→ verify（ビルドしなかったランナーで展開して cargo xtask verify。
#       トークンの一致 ・ スキーマ ・ skills-creator の check ・ 練習のボード ・ 壊したボード ・ コントラスト ・ serve の守り）
#       → publish（SHA256SUMS と証明を付けて公開）→ receive（公開した Release から取り直し、受け取る側の手順を通す）
name: brainstorming

on:
  push:
    tags: ["brainstorming-v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# ランナーの image は版で固定する。actions は Node.js 24 で動く版を使う。
env:
  ENGINE_VERSION: "0.1.1"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: zip
          - os: macos-14
            target: universal2-apple-darwin
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: ビルドのツールを用意する
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl) sudo apt-get update && sudo apt-get install -y musl-tools
                                       rustup target add x86_64-unknown-linux-musl ;;
            universal2-apple-darwin)   rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            *)                         rustup target add "${{ matrix.target }}" ;;
          esac
      - name: 基盤のエンジンを入れる skills-creator の Skill のフォルダを、この版のソースから作る
        run: |
          creator_dir="$RUNNER_TEMP/skills-creator" && mkdir -p "$creator_dir"
          cp -r .claude/skills/skills-creator/SKILL.md .claude/skills/skills-creator/LICENSE .claude/skills/skills-creator/assets "$creator_dir/"
          (cd src/skills-creator && cargo xtask skill --out "$creator_dir" --engine "$ENGINE_VERSION")
      - name: Skill のフォルダを作る ── git で追跡するものを写し、実行ファイルと基盤のエンジンは cargo xtask skill が置く
        run: |
          out="$GITHUB_WORKSPACE/dist/brainstorming"
          creator="$RUNNER_TEMP/skills-creator/scripts/bin/skills-creator"
          [ -f "$creator.exe" ] && creator="$creator.exe"
          mkdir -p "$out"
          cp -r .claude/skills/brainstorming/SKILL.md .claude/skills/brainstorming/LICENSE .claude/skills/brainstorming/assets "$out/"
          (cd src/brainstorming && cargo xtask skill --out "$out" --creator "$creator" --target "${{ matrix.target }}" --engine "$ENGINE_VERSION")
      - name: 試験 ── 利用者の環境のライブラリに依存しない
        working-directory: dist/brainstorming/scripts/bin
        run: |
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              file brainstorming | grep -q "static" || { file brainstorming; exit 1; } ;;
            universal2-apple-darwin)
              archs="$(lipo -archs brainstorming)"
              [ "$archs" = "x86_64 arm64" ] || [ "$archs" = "arm64 x86_64" ] || { echo "brainstorming: $archs"; exit 1; } ;;
            x86_64-pc-windows-msvc)
              if grep -qai "vcruntime140" brainstorming.exe; then echo "brainstorming.exe が VCRUNTIME に依存する"; exit 1; fi ;;
          esac
      - name: 梱包する ── 名前は brainstorming-<版>-<target>
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src/brainstorming/Cargo.toml | head -1)"
          name="brainstorming-$version-${{ matrix.target }}"
          mkdir -p release
          if [ "${{ matrix.ext }}" = zip ]; then (cd dist && 7z a -tzip "../release/$name.zip" brainstorming >/dev/null)
          else tar -czf "release/$name.tar.gz" -C dist brainstorming; fi
      - uses: actions/upload-artifact@v7
        with:
          name: brainstorming-${{ matrix.target }}
          path: release/

  verify:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: universal2-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: brainstorming-${{ matrix.target }}
          path: release
      - name: skills-creator の check に使う skills-creator の Skill のフォルダを、この版のソースから作る
        run: |
          creator_dir="$RUNNER_TEMP/skills-creator" && mkdir -p "$creator_dir"
          cp -r .claude/skills/skills-creator/SKILL.md .claude/skills/skills-creator/LICENSE .claude/skills/skills-creator/assets "$creator_dir/"
          (cd src/skills-creator && cargo xtask skill --out "$creator_dir" --engine "$ENGINE_VERSION")
      - name: 試験 ── ビルドしなかったランナーで展開し、版 ・ トークン ・ スキーマ ・ check ・ 練習のボード ・ serve の守りを確かめる
        run: |
          place="$RUNNER_TEMP/unpacked" && mkdir -p "$place"
          for f in release/*; do
            case "$f" in *.zip) 7z x -o"$place" "$f" >/dev/null ;; *) tar -xzf "$f" -C "$place" ;; esac
          done
          creator="$RUNNER_TEMP/skills-creator/scripts/bin/skills-creator"
          [ -f "$creator.exe" ] && creator="$creator.exe"
          tag=""; [ "$GITHUB_REF_TYPE" = tag ] && tag="--tag $GITHUB_REF_NAME"
          (cd src/brainstorming && cargo xtask verify --dir "$place/brainstorming" --creator "$creator" $tag)

  publish:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    # 証明は、鍵を持たない GitHub の artifact attestations で付ける。証明に必要な権限は、このジョブだけに渡す
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: brainstorming-*
          path: release
          merge-multiple: true
      - name: SHA-256 の一覧を作る
        run: (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: 配布物と照合の一覧に、出所の証明を付ける
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: "release/*"
      - name: 証明の bundle を配布物に並べる
        run: cp "${{ steps.attest.outputs.bundle-path }}" release/attestation.sigstore.json
      - name: 下書きに全部を付けてから公開する ── 公開した版は、配布物と tag を変えられない
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" \
            --notes "brainstorming の Skill のフォルダ（3つの OS）。受け取る側は、SHA256SUMS と attestation.sigstore.json で照合する：gh attestation verify <配布物> --repo $GITHUB_REPOSITORY --bundle attestation.sigstore.json --signer-workflow $GITHUB_REPOSITORY/.github/workflows/brainstorming.yml --source-ref refs/tags/$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  receive:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: 試験 ── 公開した Release から版を指して取り直し、受け取る側の手順を通す
        run: |
          version="${GITHUB_REF_NAME#brainstorming-v}"
          file="brainstorming-$version-x86_64-unknown-linux-musl.tar.gz"
          got="$RUNNER_TEMP/got" && mkdir -p "$got" && cd "$got"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p "$file" -p SHA256SUMS -p attestation.sigstore.json
          sha256sum -c --ignore-missing SHA256SUMS
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --bundle attestation.sigstore.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/brainstorming.yml" \
              --source-ref "refs/tags/$GITHUB_REF_NAME"
          }
          verify "$file"
          # 1バイト変えた配布物は、証明の照合で止まる
          cp "$file" tampered.tar.gz && printf 'x' >> tampered.tar.gz
          if verify tampered.tar.gz; then echo "書き換えた配布物が照合を通った"; exit 1; fi
          tar -xzf "$file"
          creator_dir="$RUNNER_TEMP/skills-creator" && mkdir -p "$creator_dir"
          cp -r "$GITHUB_WORKSPACE"/.claude/skills/skills-creator/SKILL.md "$GITHUB_WORKSPACE"/.claude/skills/skills-creator/LICENSE "$GITHUB_WORKSPACE"/.claude/skills/skills-creator/assets "$creator_dir/"
          (cd "$GITHUB_WORKSPACE/src/skills-creator" && cargo xtask skill --out "$creator_dir" --engine "$ENGINE_VERSION")
          (cd "$GITHUB_WORKSPACE/src/brainstorming" && cargo xtask verify --dir "$got/brainstorming" --creator "$creator_dir/scripts/bin/skills-creator" --tag "$GITHUB_REF_NAME")
